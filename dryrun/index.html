<div class="wrap">
  <header>

    </div>

<script>
(() => {
/*CORE-START*/
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const coin = (p = 0.5) => Math.random() < p;

// =================== 直譯器（只支援本頁用到的偽代碼語句） ===================
const DR = (() => {
  class DRError extends Error { constructor(m, kind) { super(m); this.kind = kind || 'run'; } }
  const REL = { '=': '=', '<>': '<>', '≠': '<>', '<': '<', '>': '>', '<=': '<=', '≤': '<=', '>=': '>=', '≥': '>=' };
  const KWS = { AND: 1, OR: 1, NOT: 1, TRUE: 1, FALSE: 1 };
  const fmt = (v) => typeof v === 'boolean' ? (v ? 'TRUE' : 'FALSE') : typeof v === 'number' ? (Number.isInteger(v) ? String(v) : String(Math.round(v * 10000) / 10000)) : v === undefined || v === null ? '' : String(v);
  const fmtB = (v) => (v ? 'TRUE' : 'FALSE');

  function tokenize(s) {
    const t = []; let i = 0;
    while (i < s.length) {
      const c = s[i];
      if (/\s/.test(c)) { i++; continue; }
      if (s.startsWith('的整數部分', i)) { t.push({ k: 'post', v: 'idiv', p: i, e: i + 5 }); i += 5; continue; }
      if (s.startsWith('的餘數', i)) { t.push({ k: 'post', v: 'mod', p: i, e: i + 3 }); i += 3; continue; }
      if (/[0-9]/.test(c)) { let j = i; while (j < s.length && /[0-9.]/.test(s[j])) j++; t.push({ k: 'num', v: parseFloat(s.slice(i, j)), p: i, e: j }); i = j; continue; }
      if (c === "'" || c === '"' || c === '「') { const cl = c === '「' ? '」' : c; const j = s.indexOf(cl, i + 1); if (j < 0) throw new DRError('字串缺少引號', 'parse'); t.push({ k: 'str', v: s.slice(i + 1, j), p: i, e: j + 1 }); i = j + 1; continue; }
      if (/[A-Za-z_]/.test(c)) { let j = i; while (j < s.length && /[A-Za-z0-9_]/.test(s[j])) j++; const w = s.slice(i, j), u = w.toUpperCase(); t.push(KWS[u] ? { k: 'kw', v: u, p: i, e: j } : { k: 'id', v: w, p: i, e: j }); i = j; continue; }
      if (c === '與' || c === '或') { t.push({ k: 'kw', v: c === '與' ? 'AND' : 'OR', p: i, e: i + 1 }); i++; continue; }
      const two = s.slice(i, i + 2);
      if (two === '<=' || two === '>=' || two === '<>') { t.push({ k: 'op', v: two, p: i, e: i + 2 }); i += 2; continue; }
      if ('<>=≤≥≠+-*×/()[],'.includes(c)) { t.push({ k: 'op', v: c === '×' ? '*' : c, p: i, e: i + 1 }); i++; continue; }
      throw new DRError(`無法理解的符號「${c}」`, 'parse');
    }
    return t;
  }

  function parseExpr(src) {
    const tk = tokenize(src); let p = 0;
    const peek = () => tk[p];
    const isOp = (v) => tk[p] && tk[p].k === 'op' && tk[p].v === v;
    const isKw = (v) => tk[p] && tk[p].k === 'kw' && tk[p].v === v;
    const sp = (node, a, b) => { node.p = a; node.e = b; node.src = src.slice(a, b); return node; };
    const need = (v) => { const t = tk[p++]; if (!t || t.v !== v) throw new DRError(`算式「${src}」缺少「${v}」`, 'parse'); return t; };
    function or() { let l = and(); while (isKw('OR')) { p++; const r = and(); l = sp({ t: 'or', a: l, b: r }, l.p, r.e); } return l; }
    function and() { let l = not(); while (isKw('AND')) { p++; const r = not(); l = sp({ t: 'and', a: l, b: r }, l.p, r.e); } return l; }
    function not() { if (isKw('NOT')) { const s = tk[p++]; const a = not(); return sp({ t: 'not', a }, s.p, a.e); } return cmp(); }
    function cmp() { const l = add(); const t = peek(); if (t && t.k === 'op' && REL[t.v]) { p++; const r = add(); return sp({ t: 'cmp', op: REL[t.v], a: l, b: r }, l.p, r.e); } return l; }
    function add() { let l = mul(); while (isOp('+') || isOp('-')) { const op = tk[p++].v; const r = mul(); l = sp({ t: 'bin', op, a: l, b: r }, l.p, r.e); } return l; }
    function mul() { let l = un(); while (isOp('*') || isOp('/')) { const op = tk[p++].v; const r = un(); l = sp({ t: 'bin', op, a: l, b: r }, l.p, r.e); } return l; }
    function un() { if (isOp('-')) { const s = tk[p++]; const a = un(); return sp({ t: 'neg', a }, s.p, a.e); } return post(); }
    function post() {
      const t = peek();
      if (t && t.k === 'op' && t.v === '(') {
        p++; const inner = or(); const c = need(')'); let node = sp({ t: 'paren', a: inner }, t.p, c.e);

add('loop', '當循環的次數', () => {
  const a = R(0, 5), c = R(2, 4), op = pick(['<', '<=']), b = coin() ? a + c * R(2, 4) : a + R(4, 12);
  const build = (o) => C(`N ← ${a}`, `當 N ${o} ${b} 執行`, `${I}輸出 '*'`, `${I}N ← N + ${c}`);
  return { code: build(op), asks: [{ k: 'count', t: "輸出 '*'" }, { k: 'var', e: 'N' }], trace: { mode: 'iter', cols: ['N'] },
    mistakes: [{ code: build(op === '<' ? '<=' : '<'), msg: op === '<' ? `邊界值：N = ${b} 時「N < ${b}」不成立，不會再執行。` : `邊界值：N = ${b} 時「N <= ${b}」仍然成立，要再執行一次。` }],
    explain: ['前測循環：每次執行循環體之前先檢查條件。', '用追蹤表逐次記下 N 的值，直至條件不成立；最後一次檢查（FALSE）不會執行循環體。'] };
});
add('loop', '前測與後測', () => {
  const pre = coin(), dbl = coin(), b = R(10, 30);
  const a = coin(0.4) ? b + R(0, 5) : dbl ? R(1, 4) : R(0, 6), d = R(3, 6), upd = dbl ? 'X ← X * 2' : `X ← X + ${d}`;
  const build = (p) => (p ? C(`X ← ${a}`, 'C ← 0', `當 X < ${b} 執行`, I + upd, `${I}C ← C + 1`, '輸出 C') : C(`X ← ${a}`, 'C ← 0', '重複', I + upd, `${I}C ← C + 1`, `直至 X >= ${b}`, '輸出 C'));
  return { code: build(pre), asks: [{ k: 'output' }, { k: 'var', e: 'X' }], trace: { mode: 'iter', cols: ['X', 'C'] },
    mistakes: [{ code: build(!pre), msg: '前測循環（當…執行）先檢查條件，條件一開始不成立便一次也不執行；後測循環（重複…直至）先執行循環體才檢查，最少執行一次。' }],
    explain: [pre ? '這是前測循環：先檢查 X < ' + b + '。' : '這是後測循環：先執行循環體，再檢查 X >= ' + b + '。', '「當 X < b」與「直至 X >= b」的條件剛好相反（一個繼續、一個停止）。'] };
});
add('loop', '重複…直至', () => {
  if (coin()) {
    const a = R(1, 3), d = R(1, 3), lim = R(6, 14), op = pick(['>', '>=']);
    const build = (o) => C('S ← 0', `N ← ${a}`, '重複', `${I}S ← S + N`, `${I}N ← N + ${d}`, `直至 N ${o} ${lim}`, '輸出 S');
    return { code: build(op), asks: [{ k: 'output' }, { k: 'count', t: 'S ← S + N' }], trace: { mode: 'iter', cols: ['S', 'N'] },
      mistakes: [{ code: build(op === '>' ? '>=' : '>'), msg: `「直至」條件一成立便停止；留意 N 剛好等於 ${lim} 時「>」與「>=」的分別。` }],
      explain: ['後測循環：先執行循環體，再檢查「直至」的條件；條件成立便停止。'] };
  }
  const j0 = R(10, 16), d = R(2, 3), lim = R(1, 4), op = pick(['<=', '<']);
  const build = (o) => C('sum ← 0', `j ← ${j0}`, '重複', `${I}sum ← sum + 1`, `${I}j ← j - ${d}`, `直至 j ${o} ${lim}`, '輸出 sum');
  return { code: build(op), asks: [{ k: 'output' }, { k: 'var', e: 'j' }], trace: { mode: 'iter', cols: ['sum', 'j'] },
    mistakes: [{ code: build(op === '<' ? '<=' : '<'), msg: `留意 j 剛好等於 ${lim} 時「<」與「<=」的分別。` }],
    explain: ['後測循環：先執行循環體，再檢查「直至」的條件；條件成立便停止。', 'sum 數算循環體執行了多少次。'] };
});
add('loop', '執行…當（後測）', () => {
  if (coin()) {
    const a = R(3, 6), b = R(1, a - 1), lim = R(8, 20);
    const build = (rep) => C(`X ← ${a}`, `Y ← ${b}`, rep ? '重複' : '執行', `${I}Y ← X - Y`, `${I}X ← X + Y`, `${I}輸出 X`, rep ? `直至 Y < ${lim}` : `當 Y < ${lim}`);
    return { code: build(false), asks: [{ k: 'output' }, { k: 'count', t: '輸出 X' }], trace: { mode: 'iter', cols: ['X', 'Y'] },
      mistakes: [{ code: build(true), msg: '「執行…當」是條件「成立」便再做一次；「重複…直至」才是條件成立便停止。' }],
      explain: ['後測循環：先執行循環體，再檢查「當」的條件；條件成立便再執行。', 'Y ← X - Y 用的是 X 的舊值；X ← X + Y 用的是 Y 的新值。'] };
  }
  const n = R(8, 20), k = R(2, 5);
  const build = (rep) => C(`N ← ${n}`, rep ? '重複' : '執行', `${I}輸出 N`, `${I}N ← N - ${k}`, rep ? '直至 N > 0' : '當 N > 0');
  return { code: build(false), asks: [{ k: 'output' }, { k: 'count', t: '輸出 N' }], trace: { mode: 'iter', cols: ['N'] },
    mistakes: [{ code: build(true), msg: '「執行…當」是條件「成立」便再做一次；「重複…直至」才是條件成立便停止。' }],
    explain: ['後測循環：先輸出 N 及更新 N，再檢查 N > 0；成立便再執行。'] };
});
add('loop', '標記值', () => {
  const nums = Array.from({ length: R(3, 5) }, () => R(1, 20)), extra = coin(0.4) ? [R(1, 20)] : [], cnt = coin(0.4);
  const sum = nums.reduce((a, b) => a + b, 0), V = cnt ? 'C' : 'j';
  const code = cnt ? C('C ← 0', '輸入 N', '當 N <> 888 執行', `${I}C ← C + 1`, `${I}輸入 N`, '輸出 C') : C('j ← 0', '輸入 N', '當 N <> 888 執行', `${I}j ← j + N`, `${I}輸入 N`, '輸出 j');
  const sm = '讀到 888 時循環已停止，888 之後的數值不會被讀入。';
  const mistakes = cnt ? [{ ans: String(nums.length + 1), msg: '888 是標記值，只用來終止輸入，本身不計算在內。' }, ...(extra.length ? [{ ans: String(nums.length + 2), msg: sm }] : [])]
    : [{ ans: String(sum + 888), msg: '888 是標記值，只用來終止輸入，不會加入 j。' }, ...(extra.length ? [{ ans: String(sum + extra[0]), msg: sm }, { ans: String(sum + 888 + extra[0]), msg: sm }] : [])];
  return { code, init: { inputs: [...nums, 888, ...extra] }, asks: [{ k: 'output' }, { k: 'count', t: cnt ? 'C ← C + 1' : 'j ← j + N' }], trace: { mode: 'iter', cols: ['N', V] }, mistakes,
    explain: ['標記值（888）是終止輸入的特別值，不是要處理的數據。', '先在循環前讀入第一個數值；循環體最後再讀入下一個，然後回到條件檢查。', cnt ? '這個算法數算輸入了多少個數值。' : '這個算法計算輸入數值的總和。'] };
});
add('loop', '條件中的 NOT', () => {
  const v = pick([1, 2, 3]); const a = R(0, 4);
  if (v === 1) { const d = R(1, 3), b = a + R(4, 9);
    const build = (c) => C(`M ← ${a}`, '重複', `${I}M ← M + ${d}`, `直至 ${c}`, '輸出 M');
    return { code: build(`NOT (M < ${b})`), asks: [{ k: 'output' }, { k: 'count', t: `M ← M + ${d}` }], trace: { mode: 'iter', cols: ['M'] },
      mistakes: [{ code: build(`M < ${b}`), msg: `忘記 NOT：NOT (M < ${b}) 即 M >= ${b}。` }], explain: [`「直至 NOT (M < ${b})」即「直至 M >= ${b}」。`, '後測循環：最少執行一次。'] };
  }
  if (v === 2) { const b = a + R(2, 5);
    const build = (c) => C(`M ← ${a}`, '重複', `${I}M ← M + 1`, `直至 ${c}`, '輸出 M');
    return { code: build(`NOT (M <> ${b})`), asks: [{ k: 'output' }, { k: 'count', t: 'M ← M + 1' }], trace: { mode: 'iter', cols: ['M'] },
      mistakes: [{ code: build(`M <> ${b}`), msg: `忘記 NOT：NOT (M <> ${b}) 即 M = ${b}。` }], explain: [`「直至 NOT (M <> ${b})」即「直至 M = ${b}」。`, '<> 是「不等於」（亦寫作 ≠）。'] };
  }
  const d = R(2, 4), b = a + R(5, 10);
  const build = (c) => C(`M ← ${a}`, `當 ${c} 執行`, `${I}M ← M + ${d}`, '輸出 M');
  return { code: build(`NOT (M >= ${b})`), asks: [{ k: 'output' }, { k: 'count', t: `M ← M + ${d}` }], trace: { mode: 'iter', cols: ['M'] },
    mistakes: [{ code: build(`M >= ${b}`), msg: `忘記 NOT：NOT (M >= ${b}) 即 M < ${b}。` }], explain: [`「當 NOT (M >= ${b})」即「當 M < ${b}」。`, '前測循環：條件成立才執行循環體。'] };
});
add('loop', '除二取餘', () => {
  const n = R(5, 40), bin = n.toString(2), rev = [...bin].reverse().join('');
  return { code: C(`X ← ${n}`, '重複', `${I}輸出 (X / 2) 的餘數`, `${I}X ← (X / 2) 的整數部分`, '直至 X = 0'),
    asks: [{ k: 'output' }, { k: 'count', t: '輸出 (X / 2) 的餘數' }], trace: { mode: 'iter', cols: ['X'] },
    mistakes: rev !== bin ? [{ ans: [...bin].join(' '), msg: `輸出次序：這個算法先輸出最低位。${n} 的二進制是 ${bin}，但算法由右至左輸出，結果是 ${rev}。` }] : [],
    explain: ['每次輸出 X 除以 2 的餘數（0 或 1），再把 X 變成商。', `把輸出倒轉來讀，便是 ${n} 的二進制 ${bin}。`] };
});

// ---------- 循環內改變變量 ----------
add('chg', '兩個變量同時改變', () => {
  const a = R(0, 4), b = R(14, 30), p = R(1, 3), q = R(1, 3);
  const build = (useY) => C(`X ← ${a}`, `Y ← ${b}`, '當 X < Y 執行', `${I}輸出 'A'`, `${I}X ← X + ${p}`, useY ? [`${I}Y ← Y - ${q}`] : []);
  return { code: build(true), asks: [{ k: 'count', t: "輸出 'A'" }, { k: 'var', e: 'X' }], trace: { mode: 'iter', cols: ['X', 'Y'] },
    mistakes: [{ code: build(false), msg: 'Y 在循環內亦每次減少，X 和 Y 同時在拉近，所以次數比只看 X 少。' }],
    explain: [`每次迭代 X 增加 ${p}、Y 減少 ${q}，兩者的差距每次縮小 ${p + q}。`, '用追蹤表同時記下 X 和 Y，直至 X < Y 不成立。'] };
});
add('chg', '控制變量被重新設定', () => {
  const a = R(2, 8), b = R(5, 15), c = R(6, 9), [s, e] = pick([[2, 3], [1, 3], [3, 5], [2, 4]]), n = e - s + 1;
  return { code: C(`A ← ${a}`, `B ← ${b}`, `C ← ${c}`, `設 C 由 ${s} 至 ${e} 執行`, `${I}B ← A + B`, '輸出 (A + B)'), asks: [{ k: 'output' }], trace: { mode: 'iter', cols: ['C', 'B'] },
    mistakes: [{ ans: String(a + b), msg: `「設 C 由 ${s} 至 ${e}」會把 C 重新設為 ${s}，C 原本的值 ${c} 沒有影響；循環照樣執行 ${n} 次。` },
      { ans: String(a + b + a * (n - 1)), msg: `循環共執行 ${n} 次（C = ${s} 至 ${e}），你少做了一次。` }, { ans: String(a + b + a * (n + 1)), msg: `循環共執行 ${n} 次，你多做了一次。` }],
    explain: [`計數循環開始時把 C 設為 ${s}，C ← ${c} 被覆蓋。`, `循環體執行 ${n} 次，每次 B 增加 A（${a}）；最後輸出 A + B。`] };

  return { code: build(false, '<='), asks: [{ k: 'output' }, { k: 'count', t: 'C ← C + 1' }], trace: { mode: 'iter', cols: ['S', 'C'] },

add('chg', '循環內的選擇改變變量', () => {
  const a = R(1, 5), lim = R(9, 20);

add('chg', '最後一次輸出超過界限', () => {
  const a = R(1, 3), lim = R(10, 40), m = pick(['A + A', 'A * 3']);
  let A = a; const outs = []; while (A < lim) { A = m === 'A + A' ? A * 2 : A * 3; outs.push(A); }
  const below = outs.filter((x) => x < lim).join(' ');
  const build = (o) => C(`A ← ${a}`, `當 A ${o} ${lim} 執行`, `${I}A ← ${m}`, `${I}輸出 A`);
  return { code: build('<'), asks: [{ k: 'output' }, { k: 'count', t: '輸出 A' }], trace: { mode: 'iter', cols: ['A'] },
    mistakes: [...(below ? [{ ans: below, msg: `條件只在每次循環「開始前」檢查：最後一次進入循環時 A 仍小於 ${lim}，更新後的 A 雖已超過 ${lim}，仍會被輸出。` }] : []), { code: build('<='), msg: `邊界值：A = ${lim} 時「A < ${lim}」不成立。` }],
    explain: ['前測循環的條件只在每次執行循環體之前檢查。', '所以最後輸出的數值可以大於界限。'] };
});
add('chg', '互相影響的更新', () => {
  const a = R(1, 3), b = R(1, 3), lim = R(8, 30);
  const build = (o) => C(`A ← ${a}`, `B ← ${b}`, `當 B ${o} ${lim} 執行`, `${I}A ← A + B`, `${I}B ← A - B`, `${I}輸出 B`);
  return { code: build('<'), asks: [{ k: 'output' }, { k: 'var', e: 'A' }, { k: 'count', t: '輸出 B' }], trace: { mode: 'iter', cols: ['A', 'B'] },
    mistakes: [{ code: build('<='), msg: `邊界值：B = ${lim} 時「B < ${lim}」不成立。` }],
    explain: ['B ← A - B 用的是「已更新」的 A，所以新的 B 等於 A 原本的值。', '條件中的 B 在循環體內改變，要逐次追蹤。'] };

add('arr', '最大值與最小值', () => {
  const n = R(5, 6), v = pick(['max', 'min', 'pos', 'while']); const A = distinct(n, 1, 40);
  if (v === 'max' || v === 'min') {
    const op = v === 'max' ? '>' : '<';
    const build = (o) => C('M ← A[1]', `設 i 由 2 至 ${n} 執行`, `${I}如果 A[i] ${o} M 則`, `${I2}M ← A[i]`, '輸出 M');
    return { code: build(op), init: { arrays: { A } }, asks: [{ k: 'output' }, { k: 'count', t: 'M ← A[i]' }], trace: { mode: 'iter', cols: ['i', 'A[i]', 'M'] },
      mistakes: [{ code: build(op === '>' ? '<' : '>'), msg: '「A[i] > M」找最大值；「A[i] < M」找最小值。' }],

    const build = (o) => C('P ← 1', `設 i 由 2 至 ${n} 執行`, `${I}如果 A[i] ${o} A[P] 則`, `${I2}P ← i`, '輸出 P');
    return { code: build(op), init: { arrays: { A } }, asks: [{ k: 'output' }], trace: { mode: 'iter', cols: ['i', 'A[i]', 'P'] },
      mistakes: [{ code: build(op + '='), msg: `有兩個相同的最${op === '>' ? '大' : '小'}值：用「${op}」時，相等不會更新 P，所以保留第一個的位置。` }, { ans: String(ext), msg: '輸出的是位置 P（索引），不是數值 A[P]。' }],
      explain: ['P 記錄目前最' + (op === '>' ? '大' : '小') + '值的位置（索引）。', '比較時用 A[P] 取出該位置的數值。'] };
  }
  const build = (o) => C('i ← 1', 'M ← A[i]', `當 i < ${n} 執行`, `${I}i ← i + 1`, `${I}如果 A[i] ${o} M 則`, `${I2}M ← A[i]`, '輸出 M');
  return { code: build('>'), init: { arrays: { A } }, asks: [{ k: 'output' }], trace: { mode: 'iter', cols: ['i', 'A[i]', 'M'] },
    mistakes: [{ code: build('<'), msg: '「A[i] > M」找最大值；「A[i] < M」找最小值。' }], explain: ['先把 i 加 1，再比較 A[i]；所以 A[1] 至 A[' + n + '] 全部都會被檢查。'] };
});

  const nav = $('modes');

  function renderNav() { [...nav.children].forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.id === S.mode)));
    const m = MODES.find((x) => x.id === S.mode); $('mode-note').textContent = m.note; $('tips').innerHTML = m.tips; }
  const tbar = $('types');
  TYPES.forEach((t) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = t.name; b.dataset.id = t.id;
    b.addEventListener('click', () => { S.type = t.id; try { localStorage.setItem('dryrun-type', t.id); } catch (e) {} renderTypes(); next(); }); tbar.appendChild(b); });

      box.appendChild(c); });
    renderCount();
  }
  function afterFilter() { if (!S.on[S.mode].size) { showEmpty(); return; } if (!S.q || !S.on[S.mode].has(S.q.tpl.name)) next(); }
  $('f-all').addEventListener('click', () => { S.on[S.mode] = new Set(TPL.filter((t) => t.cat === S.mode).map((t) => t.name)); saveFilter(); renderFilter(); afterFilter(); });
  $('f-none').addEventListener('click', () => { S.on[S.mode] = new Set(); saveFilter(); renderFilter(); afterFilter(); });

  function renderScore() { $('sc-right').textContent = S.right; $('sc-total').textContent = S.total; $('sc-streak').textContent = S.streak; $('sc-best').textContent = S.best; }
  function showEmpty() {
    S.q = null; $('qtype').textContent = ''; $('qno').textContent = '';
    $('prompt').innerHTML = '<p class="empty">請在上方「算法篩選」選擇至少一種算法。</p>'; $('input-area').innerHTML = ''; $('feedback').hidden = true; $('rowmsg').hidden = true;
    $('btn-check').disabled = true; $('btn-show').disabled = true; $('btn-next').disabled = true; $('filter').open = true; $('btn-hint').hidden = true; $('hintbox').hidden = true;
  }

  // ---------- 顯示偽代碼及已知數據 ----------
  const KWRE = /(否則如果|否則|如果|則|遞減至|直至|重複|執行|當|設|由|至|輸入|輸出|的整數部分|的餘數|AND|OR|NOT|TRUE|FALSE)/g;
  const hlText = (s) => s.split(/('[^']*')/).map((seg, i) => (i % 2 ? `<span class="st">${esc(seg)}</span>` : esc(seg).replace(KWRE, '<span class="kw">$1</span>'))).join('');
  const codeHTML = (code) => `<div class="code" id="code" role="group" aria-label="偽代碼">${code.split('\n').map((l, i) => `<div class="ln" data-l="${i}"><span class="no" aria-hidden="true">${i + 1}</span><span class="tx">${hlText(l)}</span></div>`).join('')}</div>`;
  const showV = (v) => (typeof v === 'string' ? `'${v}'` : DR.fmt(v));
  function givenHTML(init) {
    if (!init) return '';
    const parts = [];
    for (const [k, v] of Object.entries(init.vars || {})) parts.push(`<div>已知 <span class="mono">${esc(k)} = ${esc(showV(v))}</span></div>`);
    for (const [name, arr] of Object.entries(init.arrays || {})) parts.push(`<div>陣列 <span class="mono">${esc(name)}</span> 的初始值：</div><div class="scroll"><table class="arr"><tr><th>索引</th>${arr.map((_, i) => `<td>${i + 1}</td>`).join('')}</tr><tr><th>${esc(name)}[索引]</th>${arr.map((x) => `<td>${esc(showV(x))}</td>`).join('')}</tr></table></div>`);
    if (init.inputs && init.inputs.length) parts.push(`<div>輸入的數值依次為：<span class="mono">${init.inputs.map((x) => esc(showV(x))).join('、')}</span></div>`);
    return parts.length ? `<div class="given">${parts.join('')}</div>` : '';
  }
  function askText(q) { const a = q.ask;
    if (a.k === 'output') return '這個算法的輸出是甚麼？';
    if (a.k === 'count') return `「<span class="mono">${hlText(a.t)}</span>」會被執行多少次？`;
    return `算法完成後，<span class="mono">${esc(a.e)}</span> 的值是甚麼？`; }
  function setHL(lines) { document.querySelectorAll('#code .ln').forEach((el) => el.classList.toggle('hl', !!lines && lines.includes(+el.dataset.l))); }

  // ---------- 追蹤表 ----------
  function howto(tr) {
    if (tr.mode === 'stmt') return '逐句執行，每一行填寫執行該語句後的值。變量沒有改變可以留空；遇到「如果」選擇條件的結果。';
    const t = tr.loop.t;
    if (t === 'while') return '「進入循環前」填寫初始值。之後每一行代表一次檢查條件：先選條件結果；若是 TRUE，再填寫執行循環體後的值（沒有改變可留空）。';
    if (t === 'for') return '「進入循環前」填寫初始值；之後每一行填寫該次循環體執行完畢後的值（沒有改變可以留空）。';
    return '「進入循環前」填寫初始值；之後每一行填寫該次循環體執行後的值，再判斷條件的結果。';
  }
  const condHead = (c) => (c.post ? (c.loopT === 'repeat' ? `直至 ${c.label}` : `當 ${c.label}`) : c.label);
  function tableHTML(q, full) {
    const tr = q.trace, cols = tr.cols, upto = full ? tr.rows.length : S.row;
    let h = `<div class="tracewrap"><table class="trace"><thead><tr><th class="lab" scope="col">步驟</th>${cols.map((c) => `<th class="${c.kind}" scope="col">${esc(c.kind === 'cond' && tr.mode === 'iter' ? condHead(c) : c.label)}</th>`).join('')}${full ? '' : '<th class="lab" scope="col" aria-label="結果"></th>'}</tr></thead><tbody>`;
    tr.rows.forEach((r, i) => {
      if (i > upto || (i === upto && (full || S.answered))) return;
      const lab = `<td class="lab${r.mono ? ' m' : ''}">${r.mono ? hlText(r.label) : esc(r.label)}</td>`;
      if (i < upto) {
        h += `<tr>${lab}${cols.map((c) => { const cell = r.cells[c.key]; if (!cell.on) return '<td class="v off"></td>';
          const same = c.kind === 'var' && cell.exp === cell.prev; return `<td class="v${same ? ' same' : ''}">${esc(cell.exp)}</td>`; }).join('')}`;
        if (!full) { const st = S.stats[i]; h += `<td class="st ${st}">${st === 'ok' ? '✓' : st === 'retry' ? '✓ 再試' : '提示'}</td>`; }
        h += '</tr>';
      } else {
        h += `<tr class="cur">${lab}${cols.map((c) => { const cell = r.cells[c.key]; if (!cell.on) return '<td class="v off"></td>';
          const al = `${r.label}：${c.kind === 'cond' ? '條件 ' + c.label : c.label}`;
          if (c.kind === 'cond') return `<td><select class="cell" data-key="${esc(c.key)}" aria-label="${esc(al)}"><option value="">選擇</option><option>TRUE</option><option>FALSE</option></select></td>`;
          const allNum = tr.rows.every((x) => !x.cells[c.key].on || /^\d*$/.test(x.cells[c.key].exp));
          return `<td><input class="cell${c.kind === 'out' || tr.rows.some((x) => x.cells[c.key].exp.length > 5) ? ' wide' : ''}" data-key="${esc(c.key)}" type="text" autocomplete="off" spellcheck="false" ${allNum ? 'inputmode="numeric"' : ''} aria-label="${esc(al)}"></td>`; }).join('')}<td class="st"></td></tr>`;

  }
  function renderTrace() {
    const q = S.q, area = $('input-area');
    area.innerHTML = `<p class="howto">${howto(q.trace)} 每一行第一次按「檢查」便全對，本題才計答對。</p>${tableHTML(q, false)}<p class="legend">灰色數值表示該變量在這一步沒有改變。</p>`;

    setHL(r && !S.answered ? r.lines : null);
    const inputs = area.querySelectorAll('.cell');
    inputs.forEach((el) => el.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); checkRow(); } }));
    if (inputs[0] && S.n > 1) inputs[0].focus({ preventScroll: true });
  }
  function cellMsg(c, cell, v, row) {
    const lab = c.label;
    if (c.kind === 'cond') return v === '' ? '請選擇條件的結果（TRUE 或 FALSE）。' : `條件「${lab}」的結果不對：把這時各變量的值代入再判斷。${/NOT/.test(lab) ? '留意 NOT 會把結果反轉。' : ''}${/[<>]=|<>/.test(lab) ? '留意相等時的情況。' : ''}`;
    if (c.kind === 'out') return cell.exp === '' ? '這一步沒有執行「輸出」語句，輸出一欄應留空。' : v.trim() === '' ? '這一步有執行「輸出」語句，請寫下輸出的內容。' : '輸出的內容不對：看清楚輸出的是哪一個變量或算式。';
    if (cell.exp === cell.prev) return `${lab}：這一步沒有改變 ${lab}（可以留空）。`;
    if (v.trim() === '') return `${lab}：這一步有改變，不可以留空。`;
    if (cell.prev !== '' && DR.same(v, cell.prev)) return `${lab}：仍是上一行的值？這一步已執行了改變 ${lab} 的語句。`;
    return `${lab}：數值不對，再逐句計算一次。`;
  }
  function checkRow() {
    if (!S.q || S.answered || S.q.type !== 'trace') return;
    const row = S.q.trace.rows[S.row], msgs = []; let ok = true;
    for (const c of S.q.trace.cols) {
      const cell = row.cells[c.key]; if (!cell.on) continue;
      const el = $('input-area').querySelector(`.cell[data-key="${CSS.escape(c.key)}"]`); const v = el.value;

      else if (c.kind === 'cond') good = v === cell.exp;
      else good = v.trim() === '' ? cell.exp === '' : cell.exp !== '' && DR.same(v, cell.exp);

    S.tried = true;
    const m = $('rowmsg'); m.hidden = false; m.className = 'feedback bad';
    m.innerHTML = `<div class="verdict">這一行有錯，改正後再按「檢查」，或按「顯示這一步」。</div><ul class="steps">${msgs.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>${S.q.g.tip ? `<div>${esc(S.q.g.tip)}</div>` : ''}`;
  }
  function revealRow() {
    if (!S.q || S.answered) return;
    const row = S.q.trace.rows[S.row]; S.stats[S.row] = 'rev';
    advance('', 'info', row);
  }
  function advance(msg, cls, revealed) {

    if (revealed) { m.hidden = false; m.className = 'feedback info'; m.innerHTML = `<div class="verdict">這一步（${esc(row.label)}）：</div><ul class="desc">${row.desc.map((d) => `<li>${esc(d)}</li>`).join('') || '<li>沒有語句改變變量。</li>'}</ul>`; }
    else { m.hidden = false; m.className = 'feedback ' + cls; m.innerHTML = `<div class="verdict">${esc(msg)}</div>`; }

  function finishTrace() {

  }

  // ---------- 出題 ----------
  function next() {
    const pool = TPL.filter((t) => t.cat === S.mode && S.on[S.mode].has(t.name));

    const type = S.type === 'mix' ? pick(['calc', 'trace']) : S.type;
    S.q = makeQuestion(t, type); S.n++; S.answered = false; S.row = 0; S.stats = []; S.tried = false;
    const q = S.q;
    $('qtype').innerHTML = `${esc(t.name)}<span class="kind">${type === 'calc' ? '求輸出／次數' : '逐步追蹤'}</span>`; $('qno').textContent = `第 ${S.n} 題`;
    const h = HINTS[t.name]; $('hintbox').innerHTML = h ? `<h4>方法：${esc(t.name)}</h4><ol>${h[0].map((x) => `<li>${esc(x)}</li>`).join('')}</ol>${h[1] ? `<div class="ex">例：\n${esc(h[1])}</div>` : ''}` : '';
    $('btn-hint').hidden = !h; setHint(false);
    $('prompt').innerHTML = `<p>${esc(q.g.intro || '空運行以下算法。')}</p>${givenHTML(q.g.init)}${codeHTML(q.g.code)}${type === 'calc' ? `<p class="ask">${askText(q)}</p>` : ''}`;
    $('feedback').hidden = true; $('rowmsg').hidden = true; $('btn-next').disabled = false;
    $('btn-check').disabled = false; $('btn-show').disabled = false;

      const inp = $('ans'); inp.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); S.answered ? next() : check(); } });

  }

  function explainHTML(q, wrongMist) {
    const out = q.res.out.join(' ');

    if (wrongMist) h += `<div class="mist"><b>常見錯誤：</b>${esc(wrongMist.msg)}</div>`;
    h += `<ol class="steps">${q.g.explain.map((x) => `<li>${esc(x)}</li>`).join('')}${q.type === 'trace' ? `<li>輸出：<span class="mono">${esc(out || '（沒有輸出）')}</span></li>` : ''}</ol>`;
    if (q.type === 'calc') h += `<details class="full-trace" open><summary>完整追蹤表</summary>${tableHTML(q, true)}</details>`;
    else if (q.mistakes.length) h += `<details class="full-trace"><summary>這類題目的常見錯誤</summary><ul class="steps">${q.mistakes.map((m) => `<li>${esc(m.msg)}</li>`).join('')}</ul></details>`;
    return h;
  }
  function finish(correct, revealed, note) {
    S.answered = true; $('btn-check').disabled = true; $('btn-show').disabled = true;
    if (!revealed) { S.total++; if (correct) { S.right++; S.streak++; if (S.streak > S.best) { S.best = S.streak; try { localStorage.setItem('dryrun-best', S.best); } catch (e) {} } } else S.streak = 0; }
    else S.streak = 0;

    const q = S.q, fb = $('feedback'); fb.className = 'feedback ' + (correct ? 'good' : 'bad'); fb.hidden = false;

      const a = ($('ans').value || '').trim();
      if (!correct && !revealed) mist = q.mistakes.find((m) => DR.same(a, m.ans)) || null;
      head = `${revealed ? '答案' : correct ? '答對了' : '未答對'}：<span class="mono">${esc(q.answer)}</span>`;

  function check() {

  }
  function setHint(open) { $('hintbox').hidden = !open; $('btn-hint').setAttribute('aria-expanded', String(open)); }
  $('btn-hint').addEventListener('click', () => setHint($('hintbox').hidden));
  $('btn-check').addEventListener('click', check);
  $('btn-show').addEventListener('click', () => { if (!S.q || S.answered) return; if (S.q.type === 'trace') revealRow(); else finish(false, true); });
  let skipTimer = null;
  function updNext(confirming) {
    const b = $('btn-next'); clearTimeout(skipTimer); b.classList.remove('primary', 'ghost', 'skip', 'confirm');

  }
  $('btn-next').addEventListener('click', () => { if (S.answered || $('btn-next').classList.contains('confirm')) return next(); updNext(true); });

  // 供自動測試讀取目前題目（不影響使用）
  window.dryrunLab = { info: () => S.q && { type: S.q.type, tpl: S.q.tpl.name, answer: S.q.answer, mistakes: S.q.mistakes.map((m) => m.ans), row: S.row, answered: S.answered,
    rows: S.q.trace.rows.map((r) => Object.fromEntries(Object.entries(r.cells).filter(([, c]) => c.on).map(([k, c]) => [k, c.exp]))) } };

  renderNav(); renderTypes(); renderFilter(); renderScore(); next();
})();
</script>
