<!doctype html><html><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>算法與數據結構練習室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --sunk:#E3E9E6; --ink:#17262A; --muted:#566A6E; --line:#C9D4D0;
  --accent:#0E7466; --accent-ink:#FFFFFF; --led:#E39B10; --led-ink:#1A1204;
  --hl:rgba(227,155,16,.18); --str:#9A4A06; --cm:#6B7C80;
  --good:#1F7A3A; --good-bg:#E3F3E7; --bad:#B3261E; --bad-bg:#FBE7E5;
  --cmp:#E39B10; --cmp-bg:#FBEBC8; --swp:#0E7466; --swp-bg:#D3EEE9; --done:#2F7F6F; --done-bg:#E1ECE9;
  --key:#7A3E9D; --key-bg:#EEDDF6; --gone:#A9B6B3; --bar:#BCCDC9;
  --b1:#CFE6F5; --b1-ink:#164A6B; --b2:#DDEFD3; --b2-ink:#2C5A1B; --b3:#EADCF4; --b3-ink:#5A2C77;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1618; --surface:#162226; --sunk:#1D2C31; --ink:#E2ECE9; --muted:#95A9AB; --line:#2C3E43;
    --accent:#35BFA9; --accent-ink:#0B1413; --led:#F4B23C; --led-ink:#1A1204;
    --hl:rgba(244,178,60,.16); --str:#F2B880; --cm:#86999B;
    --good:#5BD17E; --good-bg:#15301F; --bad:#FF8A80; --bad-bg:#3A1A18;
    --cmp:#F4B23C; --cmp-bg:#3D3115; --swp:#35BFA9; --swp-bg:#163A35; --done:#4FA893; --done-bg:#1B2E2B;
    --key:#D7A8F0; --key-bg:#3A2648; --gone:#4A5A5E; --bar:#34504B;
    --b1:#24506B; --b1-ink:#CDE7F8; --b2:#2F5426; --b2-ink:#D2F0C4; --b3:#4B3266; --b3-ink:#EAD6F8; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1618; --surface:#162226; --sunk:#1D2C31; --ink:#E2ECE9; --muted:#95A9AB; --line:#2C3E43;
  --accent:#35BFA9; --accent-ink:#0B1413; --led:#F4B23C; --led-ink:#1A1204;
  --hl:rgba(244,178,60,.16); --str:#F2B880; --cm:#86999B;
  --good:#5BD17E; --good-bg:#15301F; --bad:#FF8A80; --bad-bg:#3A1A18;
  --cmp:#F4B23C; --cmp-bg:#3D3115; --swp:#35BFA9; --swp-bg:#163A35; --done:#4FA893; --done-bg:#1B2E2B;
  --key:#D7A8F0; --key-bg:#3A2648; --gone:#4A5A5E; --bar:#34504B;
  --b1:#24506B; --b1-ink:#CDE7F8; --b2:#2F5426; --b2-ink:#D2F0C4; --b3:#4B3266; --b3-ink:#EAD6F8; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;margin:0;overflow-x:hidden}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
.wrap>*,.card>*{min-width:0}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
h1{font-size:30px;font-weight:900;margin:0;letter-spacing:.02em;text-wrap:balance}
h1 .bits{display:inline-block;white-space:nowrap;font-family:var(--mono);font-weight:600;color:var(--accent);font-size:.7em;margin-left:.4em;letter-spacing:.04em}
.score{display:flex;gap:16px;font-variant-numeric:tabular-nums}
.score div{display:flex;flex-direction:column;align-items:flex-end}
.score b{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.1}
.score span{font-size:12px;color:var(--muted)}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav button{font:inherit;font-size:15px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
nav button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--led);outline-offset:2px}
.topic-note{font-size:14px;color:var(--muted);margin:-6px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.qtype{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--accent)}
.qno{font-family:var(--mono);font-size:12px;color:var(--muted)}
.qright{display:flex;align-items:center;gap:12px;margin-left:auto}
.hintbtn{font:inherit;font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid var(--led);background:transparent;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.hintbtn::before{content:"?";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--led);color:var(--led-ink);font-family:var(--mono);font-size:12px}
.hintbtn[aria-expanded="true"]{background:var(--led);color:var(--led-ink)}
.hintbtn[aria-expanded="true"]::before{background:var(--led-ink);color:var(--led)}
.hintbox{border:1px solid var(--led);border-left-width:4px;border-radius:10px;padding:12px 14px;background:var(--sunk);font-size:15px;line-height:1.7;display:flex;flex-direction:column;gap:6px}
.hintbox h4{margin:0;font-size:13px;letter-spacing:.06em;color:var(--muted)}
.hintbox ol{margin:0;padding-left:1.3em}
.hintbox .ex{font-family:var(--mono);font-size:14px;background:var(--surface);border-radius:8px;padding:6px 10px;width:fit-content;max-width:100%;overflow-x:auto;white-space:pre}
.prompt{font-size:17px;line-height:1.7;display:flex;flex-direction:column;gap:10px;min-width:0}
.prompt p{margin:0}
.mono{font-family:var(--mono);font-weight:600;letter-spacing:.02em}
.small{font-size:14px;color:var(--muted)}
.scroll{overflow-x:auto;max-width:100%}
/* 程式碼 */
.code{font-family:var(--mono);font-size:15px;line-height:1.7;background:var(--sunk);border-radius:10px;padding:10px 0;overflow-x:auto;max-width:100%}
.code .ln{display:flex;white-space:pre;padding-right:14px;border-left:3px solid transparent;min-width:fit-content}
.code .no{width:2.6em;flex:0 0 auto;text-align:right;padding-right:.9em;color:var(--muted);user-select:none;font-size:12px;opacity:.75;line-height:inherit}
.code .ln.hl{background:var(--hl);border-left-color:var(--led)}
.code .kw{color:var(--accent);font-weight:600}
.code .st{color:var(--str)}
.code .cm{color:var(--cm);font-style:italic}
.dual{display:flex;flex-direction:column;gap:6px;min-width:0}
.dual>.code{display:none}
.dual[data-show="ps"]>.code[data-lang="ps"],.dual[data-show="py"]>.code[data-lang="py"]{display:block}
.ctabs{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.ctabs button{font:inherit;font-size:13px;padding:3px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer}
.ctabs button[aria-pressed="true"]{background:var(--sunk);border-color:var(--accent);color:var(--ink);font-weight:700}
.ctabs .cap{font-size:13px;color:var(--muted);margin-right:4px}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.pair h4{margin:0 0 4px;font-size:14px}
.io{font-family:var(--mono);font-size:15px;line-height:1.6;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;white-space:pre;overflow-x:auto;max-width:100%;margin:0}
.io .er{color:var(--bad);font-weight:600}
.iolab{font-size:13px;color:var(--muted);margin:0 0 4px}
/* 陣列表 */
table.arr{border-collapse:collapse;font-family:var(--mono);font-size:15px}
.arr th,.arr td{border:1px solid var(--line);padding:4px 8px;text-align:center;min-width:2.6em}
.arr th{background:var(--sunk);font-weight:500;font-size:12px;color:var(--muted)}
.arr th.rh{text-align:left;font-family:var(--sans);white-space:nowrap}
.arr td.hl{background:var(--cmp-bg);font-weight:700}
.arr td.dim{color:var(--gone)}
.arr td.ok{background:var(--good-bg)}
.arr td.no{background:var(--bad-bg)}
.arr td.chg{color:var(--bad);font-weight:700}
.arr input{font-family:var(--mono);font-size:16px;width:3.2em;padding:4px 2px;text-align:center;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.arr input.ok{border-color:var(--good);background:var(--good-bg)}
.arr input.no{border-color:var(--bad);background:var(--bad-bg)}
.arr.wide input{width:4.2em}
/* 作答 */
.parts{display:flex;flex-direction:column;gap:12px}
.part{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.part>label,.part>.plab{font-size:15px;color:var(--ink)}
.part .sfx{font-size:14px;color:var(--muted)}
input[type=text]{font-family:var(--mono);font-size:18px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:min(260px,100%)}
input[type=text].n{width:6.5em;text-align:center}
input[type=text].l{width:min(340px,100%)}
input[type=text].ok{border-color:var(--good);background:var(--good-bg)}
input[type=text].no{border-color:var(--bad);background:var(--bad-bg)}
textarea{display:block;font-family:var(--mono);font-size:17px;line-height:1.55;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-height:6em;resize:vertical;white-space:pre;overflow-x:auto}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:8px;width:100%}
.choice{font:inherit;text-align:left;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-width:0}
.choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.choice.ok{border-color:var(--good);background:var(--good-bg)}
.choice.no{border-color:var(--bad);background:var(--bad-bg)}
.choice.m{font-family:var(--mono);font-size:15px}
.choice.pre{white-space:pre;font-family:var(--mono);font-size:14px;overflow-x:auto;line-height:1.5}
.btn{font:inherit;font-weight:700;padding:10px 18px;border-radius:10px;border:1px solid var(--accent);cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:6px 12px;font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#btn-next{margin-left:auto}
#btn-next.skip{border-color:var(--line);color:var(--muted);font-weight:500}
#btn-next.confirm{border-color:var(--bad);color:var(--bad);font-weight:700}
.feedback{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.feedback.good{background:var(--good-bg)}
.feedback.bad{background:var(--bad-bg)}
.feedback .verdict{font-weight:700}
.feedback.good .verdict{color:var(--good)}
.feedback.bad .verdict{color:var(--bad)}
.feedback .io,.feedback .code{background:var(--surface)}
.feedback table.arr td{background:var(--surface)}
.feedback table.arr td.hl{background:var(--cmp-bg)}
.feedback table.arr td.chg{background:var(--surface)}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.steps li{line-height:1.6}
.tips{font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:14px}
.tips b{color:var(--ink)}
/* 篩選 */
.filter{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.filter summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:10px 14px;font-weight:700;font-size:15px}
.filter summary::-webkit-details-marker{display:none}
.filter summary::after{content:"▾";color:var(--muted);transition:transform .15s}
.filter[open] summary::after{transform:rotate(180deg)}
.fcount{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--muted);margin-left:auto}
.fcount.partial{color:var(--accent);font-weight:600}
.fbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.fbody>*{min-width:0}
.fact{display:flex;flex-wrap:wrap;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;line-height:1.4;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sunk);border-color:var(--accent);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}
.chip[aria-pressed="true"]::before{content:"✓ ";color:var(--accent);font-weight:700}
.mini{font:inherit;font-size:13px;padding:4px 12px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.mini:disabled{opacity:.4;cursor:default}
.fhint{margin:0;font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:16px}
/* 模擬器共用 */
.tool{display:flex;flex-direction:column;gap:12px;min-width:0}
.tool>*{min-width:0}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:14px;color:var(--muted)}
.ctl label{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ctl label.grow{flex:1 1 220px;min-width:0}
.ctl label.grow input{flex:1;min-width:0;width:auto}
.ctl select,.ctl input[type=text],.ctl input[type=number]{font-family:var(--mono);font-size:15px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.ctl input[type=text]{width:min(300px,100%)}
.ctl input.w4{width:5em}
.ctl select{font-family:var(--sans)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{font:inherit;font-size:14px;padding:5px 12px;border:0;background:var(--bg);color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.counters{display:flex;flex-wrap:wrap;gap:8px}
.counter{background:var(--sunk);border-radius:10px;padding:6px 12px;display:flex;flex-direction:column;min-width:84px}
.counter b{font-family:var(--mono);font-size:22px;line-height:1.2}
.counter span{font-size:12px;color:var(--muted)}
.msg{font-size:15px;min-height:3.2em;background:var(--sunk);border-radius:10px;padding:8px 12px;line-height:1.6}
.msg.err{background:var(--bad-bg);color:var(--bad);font-weight:700}
.msg.ok{background:var(--good-bg)}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px;align-items:start}
.split>*{min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.box>h4{margin:0;font-size:15px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.box>h4 small{font-weight:400;font-size:13px;color:var(--muted)}
/* 排序柱 */
.bars{display:flex;align-items:flex-end;gap:6px;height:190px;padding:22px 2px 0;overflow-x:auto;max-width:100%}
.bar{flex:1 1 0;min-width:30px;max-width:64px;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end;position:relative}
.bar .v{font-family:var(--mono);font-weight:600;font-size:14px}
.bar .f{width:100%;border-radius:6px 6px 2px 2px;background:var(--bar);transition:height .25s ease}
.bar .ix{font-family:var(--mono);font-size:12px;color:var(--muted)}
.bar.done .f{background:var(--done)}
.bar.cmp .f{background:var(--cmp)}
.bar.swp .f{background:var(--swp)}
.bar.key .f{background:var(--key)}
.bar.cmp .v,.bar.swp .v{font-weight:700}
.bar .tag{position:absolute;top:-20px;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--key);white-space:nowrap}
.keybox{font-family:var(--mono);font-size:15px;display:inline-flex;align-items:center;gap:8px}
.keybox b{display:inline-grid;place-items:center;min-width:2.4em;height:32px;border-radius:8px;background:var(--key-bg);border:2px solid var(--key);padding:0 6px}
.passlog{font-family:var(--mono);font-size:14px;line-height:1.7;background:var(--sunk);border-radius:10px;padding:8px 12px;white-space:pre-wrap;overflow-x:auto;max-height:240px;overflow-y:auto}
.predict{display:flex;flex-direction:column;gap:8px;border:1px dashed var(--accent);border-radius:10px;padding:10px 12px}
.predict p{margin:0;font-size:14px}
/* 格子（檢索、堆疊、隊列、二維） */
.cells{display:flex;gap:4px;overflow-x:auto;max-width:100%;padding:4px 2px 4px}
.cells.wr{flex-wrap:wrap;row-gap:6px;overflow-x:visible}
.cell{flex:0 0 auto;width:44px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.cell .ix{font-family:var(--mono);font-size:12px;color:var(--muted)}
.cell .vx{width:44px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:var(--mono);font-weight:600;font-size:15px}
.cell.out .vx{color:var(--gone);background:transparent;border-style:dashed;font-weight:400}
.cell.mid .vx{background:var(--cmp-bg);border:2px solid var(--cmp)}
.cell.hit .vx{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cell.on .vx{background:var(--swp-bg);border-color:var(--swp)}
.cell .pt{font-family:var(--mono);font-size:11px;font-weight:700;min-height:1.3em;line-height:1.3;text-align:center;white-space:nowrap}
.pt .s{color:var(--b1-ink)}.pt .e{color:var(--bad)}.pt .m{color:var(--str)}
.cell .pt span{display:block}
/* 堆疊 */
.stackv{display:flex;flex-direction:column-reverse;gap:3px;width:150px;max-width:100%}
.slot{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:14px}
.slot .ix{width:1.8em;text-align:right;color:var(--muted);font-size:12px}
.slot .vx{flex:1;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-weight:600}
.slot.on .vx{background:var(--swp-bg);border-color:var(--swp)}
.slot.top .vx{border:2px solid var(--accent)}
.slot .pt{width:3.5em;font-size:12px;font-weight:700;color:var(--accent)}
.slot.flash .vx{background:var(--cmp-bg);border-color:var(--cmp)}
.ring{width:220px;max-width:100%;height:auto;display:block}
.ring text{font-family:var(--mono)}
.ring .sec{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.ring .sec.on{fill:var(--swp-bg);stroke:var(--swp)}
.ring .sec.fl{fill:var(--cmp-bg);stroke:var(--cmp)}
.ring .val{fill:var(--ink);font-size:14px;font-weight:600}
.ring .val.gone{fill:var(--gone);font-weight:400}
.ring .lab{fill:var(--muted);font-size:10px}
.ring .hd,.ring .tl{stroke-width:3;stroke-linecap:round}

const grid = (r, c, lo = 1, hi = 9) => Array.from({ length: r }, () => Array.from({ length: c }, () => R(lo, hi)));
const gridPy = (m) => m.map((row, i) => (i ? "     " : "m = [") + "[" + row.join(", ") + "]" + (i === m.length - 1 ? "]" : ","));
const gridTable = (m, cls) => `<div class="scroll"><table class="grid"><tr><th></th>${m[0].map((_, j) => `<th>${j}</th>`).join("")}</tr>${m.map((row, i) => `<tr><th>${i}</th>${row.map((v, j) => `<td${cls && cls(i, j) ? ` class="${cls(i, j)}"` : ""}>${v}</td>`).join("")}</tr>`).join("")}</table></div>`;
function neighbours(m, r, c, mode = 4) {
  const d4 = [[-1, 0], [1, 0], [0, -1], [0, 1]], d8 = d4.concat([[-1, -1], [-1, 1], [1, -1], [1, 1]]);
  const inb = [], oob = [];
  (mode === 8 ? d8 : d4).forEach(([dr, dc]) => { const i = r + dr, j = c + dc; if (i >= 0 && i < m.length && j >= 0 && j < m[0].length) inb.push([i, j]); else oob.push([i, j]); });
  return { inb, oob, sum: inb.reduce((s, [i, j]) => s + m[i][j], 0) };
}

// ---------- 5. 子程式追蹤 ----------
BUILD.sub = (root) => {
  const PROGS = [["imm", "整數參數（不可變）"], ["mut", "列表參數（可變）"], ["both", "列表及整數參數、傳回值"], ["find", "在循環內 return"], ["count", "以子程式作條件"], ["chain", "子程式調用子程式"], ["glob", "global 全程變量"], ["noglob", "沒有 global（出錯）"], ["shadow", "同名的局部變量"], ["readg", "讀取全程變量"]];
  const st = { code: [], r: null, steps: [], pos: 0, label: "" };
  root.innerHTML = `<div class="ctl" data-r="1"></div><div class="ctl" data-r="2"></div><p class="small" id="sb-lab"></p>
  <div class="split"><div><p class="iolab" id="sb-at"></p><div id="sb-code"></div><p class="iolab">輸出</p><pre class="io" id="sb-out"></pre></div><div><p class="iolab">調用堆疊（由底至頂；頂端是正在執行的子程式）</p><div class="frames" id="sb-fr"></div></div></div><div class="msg" id="sb-msg" aria-live="polite"></div>`;
  const sel = h("select", { "aria-label": "選擇程式" }, PROGS.map(([k, t]) => `<option value="${k}">${t}</option>`).join(""));
  const l = h("label", {}, "程式 "); l.appendChild(sel); sel.addEventListener("change", () => newProg());
  const r1 = root.querySelector('[data-r="1"]'), r2 = root.querySelector('[data-r="2"]');
  r1.append(l, btn("換一組數值", () => newProg()));
  const bPrev = btn("◀ 上一步", () => go(st.pos - 1)), bNext = btn("下一步 ▶", () => go(st.pos + 1)), bPlay = btn("播放", () => player.toggle()), bEnd = btn("執行到完", () => { player.stop(); go(st.steps.length - 1); });
  const info = h("span", { class: "small" });
  r2.append(btn("重設", () => { player.stop(); go(0); }), bPrev, bNext, bPlay, bEnd, info);
  const player = Player(() => { if (st.pos >= st.steps.length - 1) return false; go(st.pos + 1); return st.pos < st.steps.length - 1; }, (on) => { bPlay.textContent = on ? "暫停" : "播放"; }, 800);
  function newProg() { const T = SUB[sel.value](); load(T.code, sel.options[sel.selectedIndex].text); }
  function load(code, label) {
    player.stop(); st.code = code; st.label = label; st.r = PY.run(code, { trace: true });
    const last = st.r.steps[st.r.steps.length - 1];
    st.steps = st.r.steps.concat([{ end: true, line: 0, frames: [{ name: "<module>", vars: st.r.globals, refs: {}, callLine: null }], out: st.r.out.length }]);
    if (st.r.error && last) st.steps[st.steps.length - 1].frames = last.frames;
    root.querySelector("#sb-code").innerHTML = codeHTML(code, "py"); root.querySelector("#sb-lab").textContent = "程式：" + label; go(0);
  }
  const fmtV = (v) => PY.repr(v);
  function go(p) {
    p = Math.max(0, Math.min(st.steps.length - 1, p)); st.pos = p; const s = st.steps[p], prev = p ? st.steps[p - 1] : null;
    hlLines(root.querySelector("#sb-code"), s.end ? [] : [s.line]);
    root.querySelector("#sb-at").textContent = s.end ? "程式已結束" : `即將執行第 ${s.line} 行`;
    const outLines = st.r.out.slice(0, s.out); let ot = outLines.join("\n"); if (s.end && st.r.error) ot += (ot ? "\n" : "") + st.r.error.type + ": " + st.r.error.msg;
    root.querySelector("#sb-out").innerHTML = ot ? esc(ot).replace(/(\w+Error: .*)$/, '<span class="er">$1</span>') : '<span class="none">（未有輸出）</span>';
    const gRefs = s.frames[0].refs || {};
    root.querySelector("#sb-fr").innerHTML = s.frames.map((f, k) => {
      const pf = prev && prev.frames[k] && prev.frames[k].name === f.name ? prev.frames[k] : null;
      const names = Object.keys(f.vars);
      const rows = names.map((n) => { const v = fmtV(f.vars[n]), chg = !pf || !(n in pf.vars) || fmtV(pf.vars[n]) !== v; let al = "";
        if (k > 0 && f.refs && f.refs[n]) { const g = Object.keys(gRefs).find((gn) => gRefs[gn] === f.refs[n]); if (g) al = `<span class="al">與全程變量 ${esc(g)} 是同一個列表</span>`; }
        return `<span class="k">${esc(n)}</span><span class="v${chg && prev ? " chg" : ""}">${esc(v)}${al}</span>`; }).join("");
      return `<div class="frame${k === s.frames.length - 1 ? " cur" : ""}"><h5>${k === 0 ? "主程式（全程變量）" : esc(f.name) + "（局部變量）"}${k > 0 ? `<small>返回第 ${f.callLine} 行</small>` : ""}</h5>${names.length ? `<div class="vars">${rows}</div>` : '<span class="none">（未有變量）</span>'}</div>`;
    }).join("");
    const m = root.querySelector("#sb-msg");
    if (s.end) { m.textContent = st.r.error ? `執行第 ${st.r.error.line} 行時出現運行時錯誤 ${st.r.error.type}，程式終止。` : "程式結束：調用堆疊只剩主程式。"; m.className = "msg" + (st.r.error ? " err" : " ok"); }
    else { const d = s.frames.length, pd = prev ? prev.frames.length : 1; m.className = "msg";
      m.textContent = d > pd ? `調用 ${s.frames[d - 1].name}：推入它的堆疊框（返回第 ${s.frames[d - 1].callLine} 行），實際參數的值傳給形式參數。` : d < pd ? `${prev.frames[pd - 1].name} 結束：彈出它的堆疊框，局部變量被捨去，回到第 ${prev.frames[pd - 1].callLine} 行。` : p === 0 ? "由第一行開始；def 只是定義子程式，調用時才執行子程式內的語句。" : "紅色是剛改變的值。"; }
    info.textContent = `步驟 ${p + 1}／${st.steps.length}`;
    bPrev.disabled = p === 0; bNext.disabled = bEnd.disabled = bPlay.disabled = p >= st.steps.length - 1;
  }

  return { load, pause: () => player.stop() };
};

// ---------- 6. 二維陣列 ----------
BUILD.grid = (root) => {
  const st = { r: 3, c: 4, m: grid(3, 4), op: "row", pos: 0, steps: [], cell: [1, 1] };
  root.innerHTML = `<div class="ctl" data-r="1"></div><div class="ctl" data-r="2"></div><div id="gr-t"></div><p class="small" id="gr-tip"></p>
  <div class="counters"><div class="counter"><b id="gr-i">–</b><span>i</span></div><div class="counter"><b id="gr-j">–</b><span>j</span></div><div class="counter"><b id="gr-cnt">0</b><span id="gr-cntl">內循環次數</span></div><div class="counter"><b id="gr-tot">0</b><span>total</span></div></div>
  <div class="msg" id="gr-msg" aria-live="polite"></div><div id="gr-code"></div>`;
  const r1 = root.querySelector('[data-r="1"]'), r2 = root.querySelector('[data-r="2"]');
  const rs = h("select", { "aria-label": "列數" }, range(2, 6).map((k) => `<option${k === st.r ? " selected" : ""}>${k}</option>`).join("")), cs = h("select", { "aria-label": "欄數" }, range(2, 7).map((k) => `<option${k === st.c ? " selected" : ""}>${k}</option>`).join(""));
  const lr = h("label", {}, "列 "); lr.appendChild(rs); const lc = h("label", {}, "欄 "); lc.appendChild(cs);
  const remake = () => { st.r = +rs.value; st.c = +cs.value; st.m = grid(st.r, st.c); st.cell = [Math.min(st.cell[0], st.r - 1), Math.min(st.cell[1], st.c - 1)]; build(); };
  rs.addEventListener("change", remake); cs.addEventListener("change", remake);
  r1.append(lr, lc, btn("新數據", remake), seg([["row", "逐列"], ["col", "逐欄"], ["nb", "鄰格求和"]], st.op, (v) => { st.op = v; build(); }));
  const bStep = btn("下一步", () => step()), bPlay = btn("播放", () => player.toggle()), bAll = btn("全部", () => { player.stop(); while (step()); });
  r2.append(btn("重設", () => { player.stop(); st.pos = 0; render(); }), bStep, bPlay, bAll);
  const player = Player(() => step(), (on) => { bPlay.textContent = on ? "暫停" : "播放"; }, 600);
  const DI = [-1, 1, 0, 0], DJ = [0, 0, -1, 1];
  function build() {
    player.stop(); const { r, c, m } = st; let code, steps = [], tot = 0, cnt = 0;
    if (st.op === "row" || st.op === "col") {
      const rowFirst = st.op === "row";
      code = ["total = 0", rowFirst ? `for i in range(0, ${r}):` : `for j in range(0, ${c}):`, rowFirst ? `    for j in range(0, ${c}):` : `    for i in range(0, ${r}):`, "        total = total + m[i][j]", "print(total)"];
      for (let a = 0; a < (rowFirst ? r : c); a++) for (let b = 0; b < (rowFirst ? c : r); b++) { const i = rowFirst ? a : b, j = rowFirst ? b : a; tot += m[i][j]; cnt++; steps.push({ i, j, tot, cnt, ok: true, note: `i = ${i}，j = ${j}：total ← total + m[${i}][${j}] = ${tot - m[i][j]} + ${m[i][j]} = ${tot}` }); }
    } else {
      const [ci, cj] = st.cell;
      code = ["di = [-1, 1, 0, 0]", "dj = [0, 0, -1, 1]", "total = 0", "for k in range(0, 4):", `    i = ${ci} + di[k]`, `    j = ${cj} + dj[k]`, `    if i >= 0 and i < ${r} and j >= 0 and j < ${c}:`, "        total = total + m[i][j]", "print(total)"];
      for (let k = 0; k < 4; k++) { const i = ci + DI[k], j = cj + DJ[k], ok = i >= 0 && i < r && j >= 0 && j < c; if (ok) tot += m[i][j]; cnt++;
        steps.push({ i, j, tot, cnt, ok, k, note: `k = ${k}（${["上", "下", "左", "右"][k]}）：i = ${i}，j = ${j}` + (ok ? `，在範圍內，total ← ${tot - m[i][j]} + ${m[i][j]} = ${tot}` : `，${i < 0 || i >= r ? `i 不在 0–${r - 1}` : `j 不在 0–${c - 1}`}，超出範圍，不計（如不檢查會出現 IndexError 或讀到錯誤的格）`) }); }
    }
    st.code = code; st.steps = steps; st.pos = 0; root.querySelector("#gr-code").innerHTML = codeHTML(gridPy(m).concat(code), "py");
    root.querySelector("#gr-tip").textContent = st.op === "nb" ? "按表內任何一格，選擇要求相鄰格之和的格子（試試角落及邊緣）。" : st.op === "row" ? "外循環 i（列），內循環 j（欄）：一列一列地存取。" : "外循環 j（欄），內循環 i（列）：一欄一欄地存取。";
    root.querySelector("#gr-cntl").textContent = st.op === "nb" ? "檢查次數" : "內循環次數";
    render();
  }
  function step() { if (st.pos >= st.steps.length) return false; st.pos++; render(); return st.pos < st.steps.length; }
  function render() {
    const { r, c, m } = st, s = st.pos ? st.steps[st.pos - 1] : null, done = st.steps.slice(0, st.pos).filter((x) => x.ok), nb = st.op === "nb";
    const cls = (i, j) => { if (nb && st.cell[0] === i && st.cell[1] === j) return "ctr"; if (s && s.ok && s.i === i && s.j === j) return "cur"; if (done.some((d) => d.i === i && d.j === j)) return nb ? "nb" : "done"; if (s && !nb) { if (st.op === "row" && s.i === i) return "row"; if (st.op === "col" && s.j === j) return "col"; } return ""; };
    let t = `<div class="scroll"><table class="grid"><tr><th></th>${range(0, c).map((j) => `<th class="${s && s.j === j ? "on" : ""}">${j}</th>`).join("")}</tr>`;
    t += m.map((row, i) => `<tr><th class="${s && s.i === i ? "on" : ""}">${i}</th>${row.map((v, j) => `<td class="${cls(i, j)}">${nb ? `<button type="button" aria-label="選擇 m[${i}][${j}]" data-i="${i}" data-j="${j}">${v}</button>` : v}</td>`).join("")}</tr>`).join("");
    root.querySelector("#gr-t").innerHTML = t + "</table></div>";
    root.querySelectorAll("#gr-t td button").forEach((b) => b.addEventListener("click", () => { st.cell = [+b.dataset.i, +b.dataset.j]; build(); }));
    root.querySelector("#gr-i").textContent = s ? s.i : "–"; root.querySelector("#gr-j").textContent = s ? s.j : "–";
    root.querySelector("#gr-cnt").textContent = s ? s.cnt : 0; root.querySelector("#gr-tot").textContent = s ? s.tot : 0;
    const msg = root.querySelector("#gr-msg");
    msg.textContent = !s ? (nb ? `求 m[${st.cell[0]}][${st.cell[1]}] 的上、下、左、右相鄰格之和。按「下一步」。` : `共 ${r} × ${c} = ${r * c} 格，內循環主體會執行 ${r * c} 次。按「下一步」。`) : s.note + (st.pos === st.steps.length ? `。完成：total = ${s.tot}。` : "");
    msg.className = "msg" + (s && !s.ok ? " err" : "");
    hlLines(root.querySelector("#gr-code"), s ? (nb ? [m.length + 4, m.length + 5, m.length + 6, m.length + 7].concat(s.ok ? [m.length + 8] : []) : [m.length + 4]) : []);
    [bStep, bPlay, bAll].forEach((b) => { b.disabled = st.pos >= st.steps.length; });
  }
  build();
  return { pause: () => player.stop() };
};
