'img2.txt', 'r')\n# 在這裏寫程式\nf.close()","ref":"w = int(input('Width: '))\nf = open('img2.txt', 'r')\ns = ''\nfor line in f:\n    parts = line.strip()[1:-1].split(',')\n    s = s + parts[0] * int(parts[1])\nf.close()\nfor k in range(0, len(s), w):\n    print(s[k:k + w])","tests":[{"inputs":"5","files":{"img2.txt":"[2,4]\n[1,3]\n[0,8]\n[1,4]\n[2,6]\n"}},{"inputs":"4","files":{"img2.txt":"[1,1]\n[0,2]\n[1,2]\n[0,2]\n[1,6]\n[0,2]\n[1,2]\n[0,2]\n[1,1]\n"}},{"inputs":"3","files":{"img2.txt":"[1,6]\n"}},{"inputs":"1","files":{"img2.txt":"[0,1]"}}],"hint":"每行先 `strip()`，再用 `[1:-1]` 去掉方括號，`split(',')` 得到 D 和 N；`D * int(N)` 重複 N 次。把所有像素接成一個字串，再用切片 `s[k:k + w]` 每 w 個輸出一行。","_exp":[{"out":"Width: 5\n22221\n11000\n00000\n11112\n22222\n","err":null},{"out":"Width: 4\n1001\n1001\n1111\n1001\n1001\n","err":null},{"out":"Width: 3\n111\n111\n","err":null},{"out":"Width: 1\n0\n","err":null}],"_sample":"Width: 5\n22221\n11000\n00000\n11112\n22222\n"},{"id":"c9b-w2","pts":12,"title":"2048：向左移動一行","src":"延伸教科書 p.342 開放式問題第 3 題","q":"輸入一行 4 個數字（以空格分隔，0 代表空格）。模擬「2048」**向左**移動：\n(1) 所有非 0 方塊向左靠；\n(2) 由左至右，相鄰兩個相同的方塊合併為兩者之和，**每個方塊每次只可合併一次**；\n(3) 右邊補 0。\n以空格分隔輸出 4 個數字。例如 `2 2 2 2` → `4 4 0 0`；`4 4 8 0` → `8 8 0 0`。","starter":"row = input('Row: ').split()\n# 在這裏寫程式","ref":"row = input('Row: ').split()\nnums = []\nfor x in row:\n    if x != '0':\n        nums.append(int(x))\nresult = []\ni = 0\nwhile i \u003c len(nums):\n    if i + 1 \u003c len(nums) and nums[i] == nums[i + 1]:\n        result.append(nums[i] * 2)\n        i = i + 2\n    else:\n        result.append(nums[i])\n        i = i + 1\nwhile len(result) \u003c 4:\n    result.append(0)\nprint(result[0], result[1], result[2], result[3])","tests":[{"inputs":"2 2 0 4"},{"inputs":"2 2 2 2"},{"inputs":"0 2 0 2"},{"inputs":"4 4 8 0"},{"inputs":"2 4 2 4"},{"inputs":"0 0 0 0"}],"hint":"分三步：先把非 0 的數字放入新列表 nums；再用 while 由左至右檢查 nums[i] 和 nums[i + 1]，相同便合併並跳過兩格（i + 2），否則只放 nums[i]；最後補 0 至 4 個。","_exp":[{"out":"Row: 2 2 0 4\n4 4 0 0\n","err":null},{"out":"Row: 2 2 2 2\n4 4 0 0\n","err":null},{"out":"Row: 0 2 0 2\n4 0 0 0\n","err":null},{"out":"Row: 4 4 8 0\n8 8 0 0\n","err":null},{"out":"Row: 2 4 2 4\n2 4 2 4\n","err":null},{"out":"Row: 0 0 0 0\n0 0 0 0\n","err":null}],"_sample":"Row: 2 2 0 4\n4 4 0 0\n"},{"id":"c9b-w3","pts":13,"title":"四子棋：誰勝出？","src":"延伸教科書 p.341 開放式問題第 1 題","q":"board.txt 有 6 行，每行 7 個字元：`0` 是空位，`A`、`B` 是兩位玩家的棋子。輸入玩家（A 或 B）。若該玩家有 4 枚棋子以**橫、直或斜**（兩個斜方向）連成一線，輸出 `A wins`（或 `B wins`），否則輸出 `No winner`。","starter":"f = open('board.txt', 'r')\nboard = []\nfor line in f:\n    board.append(line.strip())\nf.close()\np = input('Player: ')\n# 在這裏寫程式","ref":"f = open('board.txt', 'r')\nboard = []\nfor line in f:\n    board.append(line.strip())\nf.close()\np = input('Player: ')\nwin = False\nfor r in range(6):\n    for c in range(7):\n        for d in [[0, 1], [1, 0], [1, 1], [1, -1]]:\n            count = 0\n            for k in range(4):\n                rr = r + d[0] * k\n                cc = c + d[1] * k\n                if 0 \u003c= rr \u003c 6 and 0 \u003c= cc \u003c 7 and board[rr][cc] == p:\n                    count = count + 1\n            if count == 4:\n                win = True\nif win:\n    print(p, 'wins')\nelse:\n    print('No winner')","tests":[{"inputs":"A","files":{"board.txt":"0000000\n0000000\n0000000\n0000000\n0000000\nBBBAAAA\n"}},{"inputs":"B","files":{"board.txt":"0000000\n0000000\n000000B\n000000B\n00A000B\nAAA000B\n"}},{"inputs":"A","files":{"board.txt":"0000000\n0000000\n000A000\n00AB000\n0ABB000\nABBA000\n"}},{"inputs":"B","files":{"board.txt":"0000000\n0000000\nB000000\nAB00000\nAAB0000\nAAAB000\n"}},{"inputs":"A","files":{"board.txt":"0000000\n0000000\n0000000\n0000000\n0000000\nAAA0AAA\n"}},{"inputs":"A","files":{"board.txt":"0000000\n0000000\n0000000\n0000000\n0000000\nBBBB000\n"}}],"hint":"`board[r][c]` 是第 r 行第 c 個字元。由每一格出發，檢查四個方向：向右 (0, 1)、向下 (1, 0)、右下 (1, 1)、左下 (1, −1)，連續 4 格都是 p 便勝出。檢查前要確保行 0–5、列 0–6 沒有超出範圍。","_exp":[{"out":"Player: A\nA wins\n","err":null},{"out":"Player: B\nB wins\n","err":null},{"out":"Player: A\nA wins\n","err":null},{"out":"Player: B\nB wins\n","err":null},{"out":"Player: A\nNo winner\n","err":null},{"out":"Player: A\nNo winner\n","err":null}],"_sample":"Player: A\nA wins\n"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.337–340","items":[{"id":"c9b-q1","pts":4,"src":"教科書 p.337 綜合練習第 4(b) 題","tags":[{"t":"hot","why":"線性檢索的效率及提早停止（DSE 卷二D 常考）"}],"q":"曉彤先比較 target 和 winner 中間的項目：較小便用 fromMin（由左至右），否則用 fromMax（由右至左）。這比直接用 fromMin 更有效率嗎？","options":["同意，因為把檢索範圍減半，能減少平均的比較次數","不同意，因為多了一次比較，一定較慢","不同意，因為只有對分檢索才可以提高效率","同意，因為每次都只須比較一次"],"answer":"A","why":"書中答案：同意，將檢索減半能減少平均的比較次數。","_right":0},{"id":"c9b-q2","pts":4,"src":"教科書 p.338 綜合練習第 4(c)(i)、(ii) 題（參考 DSE 2019 2D Q2c）","tags":[{"t":"hot","why":"鏈表與陣列的比較（DSE 2019 卷二D 第 2(c) 題為本書第 4(c) 題的參考）"}],"q":"中獎名單改用單向鏈表（由小至大，每個節點只有指向下一個節點的 next）。為什麼 fromMax 較難編寫？怎樣解決？","options":["在單向鏈表追蹤前一個節點較複雜；可新增指向前一個節點的指示標（雙向鏈表）","鏈表不能儲存數字；可改用二維陣列","鏈表的最後一個節點不能存取；可刪除最後一個節點","鏈表一定比陣列慢；可改用對分檢索"],"answer":"A","why":"書中答案：fromMin 跟着 next 由左至右搜尋較容易；fromMax 要由右至左，單向鏈表難以找到前一個節點。可加指向前一個節點的指示標。","_right":0},{"id":"c9b-q3","pts":4,"src":"教科書 p.338 綜合練習第 4(c)(iii) 題","tags":[{"t":"hot","why":"鏈表與陣列的比較（DSE 2019 卷二D 第 2(c) 題為本書第 4(c) 題的參考）"}],"q":"對已排序的鏈表進行對分檢索，能提高檢索的效率嗎？","options":["不能，因為對分檢索須直接存取指定項目，而鏈表只能順序存取","能，因為鏈表已經排序","能，因為鏈表不用移動項目","不能，因為鏈表不能排序"],"answer":"A","why":"書中答案：對分檢索要直接跳到中間的項目，鏈表只能由頭沿指示標逐個前進。","_right":0},{"id":"c9b-q4","pts":4,"src":"教科書 p.338 綜合練習第 4(c)(iv) 題","tags":[{"t":"hot","why":"鏈表與陣列的比較（DSE 2019 卷二D 第 2(c) 題為本書第 4(c) 題的參考）"}],"q":"以下哪一項是使用鏈表而非陣列儲存數據的好處？","options":["加入或刪除數據時只須改變指示標，不用逐一移動項目","可以用索引直接存取任何項目","佔用的儲存空間一定較少","可以使用對分檢索"],"answer":"A","why":"書中答案：鏈表只須改變指示標的指向；陣列須把項目逐一移動，步驟較多。","_right":0},{"id":"c9b-q5","pts":4,"src":"教科書 p.340 綜合練習第 6(d) 題","q":"相比儲存在程式內的陣列，用文字檔案儲存圖像像素的一個好處是什麼？","options":["數據是非易失性的，程式結束後仍保存在檔案內","程式讀取數據一定較快","不用把數字轉換為字串","檔案的內容不會被其他程式存取"],"answer":"A","why":"書中答案：確保數據的獨立性；數據可被多於一個程式存取；數據是非易失性的。","_right":0}]},{"id":"more","kin
