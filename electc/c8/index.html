PY.unit({"id":"c8","title":"程式編寫在現實生活的應用","book":"教科書 選修C 第 8 章 p.304–331","key":"C-c8-hmac-d38c140ce7","theory":true,"writeLabel":"分析題","sections":[{"id":"s1","title":"創客文化與輸入—處理—輸出","pages":"教科書 p.306–310","learn":[{"pts":["**創客文化**：用原材料和科技（機械人、電子感應器、3D 打印等）自己動手創作或改裝產品來解決問題；我們由工具用家變成**工具建構者**。（p.306）","電子裝置和電腦一樣有**輸入—處理—輸出周期（IPO）**：輸入＝輸入設備（例如感應器）接收的數據；處理＝處理數據的方法或步驟；輸出＝裝置作出的回應。（p.307）","**感應器**是**自動**輸入設備，會因應環境變化自動更新數據；按鈕、搖桿、滑桿電位器、旋轉電位器是**手動**輸入設備。（p.307–308）","**輸出設備**的效果可以是光、聲音、文字或物理運動。（p.309）"]},{"table":{"head":["感應器（p.307–308）","量度","應用例子"],"rows":[["光感應器（光敏電阻）","光亮度","自動照明（太暗便開燈）"],["超聲波感應器","收發超聲波量度距離","自動水龍頭、倒車雷達"],["溫度與濕度感應器","空氣溫度與濕度","智能溫室恒溫系統"],["人體紅外線感應器","用紅外線感測人的動作","自動門、自動電梯"],["加速度計與陀螺儀","加速度與方向","計步器、平衡無人機"],["懸浮粒子感應器","懸浮粒子濃度","空氣污染監察站"]]}},{"table":{"head":["輸出設備（p.309）","輸出效果","應用例子"],"rows":[["LED 燈","發出光源","提示燈、燈泡"],["蜂鳴器","發出聲響","門鈴、警報器"],["顯示器","顯示資訊","儀表板"],["直流摩打","以不同速度連續轉動","車輪、風扇"],["伺服摩打","定位到指定角度","機械臂、水撥、門窗"]]}},{"sim":{"code":"# 輸入：用 input() 模擬光感應器的讀數\nlight = int(input())\n# 處理：與臨界值比較\nif light \u003c 100:\n    led = \"ON\"\nelse:\n    led = \"OFF\"\n# 輸出：LED 燈的狀態\nprint(\"LED\", led)","inputs":"51","open":["vars"],"_run":{"out":"51\nLED ON\n","err":null,"vrepr":{"light":"51","led":"'ON'"},"files":{}}},"cap":"用 Python 模擬一個 IPO 周期（智能街燈）。把輸入改成 181 再執行。"}],"practice":[{"id":"c8-s1-p1","type":"mc","pts":2,"src":"教科書 p.310 測試站 8.1(a)（參考 DSE 2022 SP 2C Q11）","tags":[{"t":"hot","why":"選擇感應器／輸出設備並解釋運作：參考 DSE 2022 Sample Paper 2C Q11（教科書測試站 8.1、8.3）。"}],"q":"卓峰設計的智能盆栽要監控**土壤的水分及酸鹼值**，提醒他何時澆水。應使用哪些感應器？","options":["懸浮粒子感應器、加速度計","土壤濕度感應器、酸鹼值感應器","溫度感應器、光感應器","超聲波感應器、人體紅外線感應器"],"answer":1,"hint":"要量度的物理量是什麼？","why":"水分 → 土壤濕度感應器；酸鹼值 → 酸鹼值感應器。","_right":1},{"id":"c8-s1-p2","type":"mc","pts":2,"src":"教科書 p.310 測試站 8.1(c)–(e)","q":"以下哪一項配對**不正確**？","options":["提醒主人光線不足 → 光感應器（輸出設備）","實時展示感應器的數值 → 顯示器","定時自動澆水 → 水泵／摩打","發出適合植物生長的光譜 → (RGB) LED 燈"],"answer":0,"hint":"光感應器是輸入還是輸出設備？","why":"光感應器是輸入設備；提醒主人要用輸出設備，例如蜂鳴器或顯示器。","_right":0},{"id":"c8-s1-p3","type":"mc","pts":2,"src":"教科書 p.331 課題練習 1(a)","q":"曉晴想在家中的小型污染監察站監察**噪音**和**空氣污染**。最適合設置哪兩種感應器？","options":["聲音強度感應器、人體紅外線感應器","聲音強度感應器、懸浮粒子感應器","光感應器、溫度感應器","超聲波感應器、懸浮粒子感應器"],"answer":1,"hint":"超聲波感應器用來量度距離，不是噪音。","_right":1},{"id":"c8-s1-p4","type":"mc","pts":2,"src":"仿教科書 p.320 智能街燈","verify":true,"ask":{"var":"led"},"q":"光感應器的讀數是 100。執行模擬程式後，led 的值是什麼？","code":"light = int(input())\nif light \u003c 100:\n    led = \"ON\"\nelse:\n    led = \"OFF\"","inputs":"100","options":["ON","OFF","100","沒有值"],"answer":1,"hint":"100 \u003c 100 成立嗎？","why":"邊界值：100 不小於 100，所以 LED 熄滅。","_right":1},{"id":"c8-s1-p5","type":"mc","pts":2,"src":"教科書 p.307–308","q":"以下哪一項是**手動**輸入設備？","options":["人體紅外線感應器","加速度計","旋轉電位器","溫度與濕度感應器"],"answer":2,"hint":"要人手調整的才是手動輸入設備。","why":"感應器會因應環境自動更新數據；電位器要人手轉動。","_right":2}]},{"id":"s2","title":"可編程微控制器：設定與無限循環","pages":"教科書 p.311–317","learn":[{"pts":["**可編程微控制器**（例如 Arduino、micro:bit、Raspberry Pi）是電子裝置的「大腦」，有許多**腳位／引腳**接駁輸入及輸出設備；用家把程式**上傳**給它執行。（p.311）","大部分程式有兩個函數：**設定函數**（啟動後只運行**一次**）和**無限循環函數**（之後**不停重複**，直至重置或斷電）。（p.314）","micro:bit 的 MakeCode：「當啟動時」＝設定；「重複無限次」＝無限循環。可以用積木或 Python 編寫。（p.314–315）","**視覺化編程**（積木）易學易讀，但**靈活度較低**；**文字編程**（Python 等）要守嚴格語法，但可以做得更多，例如改變圖示顯示的時間。（p.315–316）","micro:bit 內置光線感應器（0 至 255，愈光讀數愈**大**）、溫度感應器、方位感應器、加速度感應器及按鈕 A、B。（p.317）"]},{"code":"void setup() {\n  pinMode(10, OUTPUT);\n}\n\nvoid loop() {\n  if(analogRead(A5) > 400) {\n    digitalWrite(10, HIGH);\n  } else {\n    digitalWrite(10, LOW);\n  }\n}","cap":"Arduino 程式（p.311，C++，只供閱讀）：setup() 運行一次；loop() 不停讀取 A5 腳位的感應器，數值大於 400 便亮起 10 號腳位的 LED。"},{"sim":{"code":"def setup():\n    print(\"顯示 3\")\n    print(\"顯示 2\")\n    print(\"顯示 1\")\n\ndef loop(light):\n    if light \u003c 100:\n        print(light, \"→ 亮起 LED\")\n    else:\n        print(light, \"→ 熄滅 LED\")\n\nsetup()\n# 真正的微控制器會 while True 不停重複；這裏用列表模擬每次讀到的數值\nreadings = [51, 181, 99, 100]\nfor light in readings:\n    loop(light)","open":["vars","trace"],"step":true,"_run":{"out":"顯示 3\n顯示 2\n顯示 1\n51 → 亮起 LED\n181 → 熄滅 LED\n99 → 亮起 LED\n100 → 熄滅 LED\n","err":null,"vrepr":{"readings":"[51, 181, 99, 100]","light":"100"},"files":{},"steps":[{"l":1,"v":{},"o":0},{"l":6,"v":{},"o":0},{"l":12,"v":{},"o":0},{"l":2,"v":{},"o":0,"fn":"setup"},{"l":3,"v":{},"o":5,"fn":"setup"},{"l":4,"v":{},"o":10,"fn":"setup"},{"l":14,"v":{},"o":15},{"l":15,"v":{"readings":"[51, 181, 99, 100]"},"o":15},{"l":16,"v":{"readings":"[51, 181, 99, 100]","light":"51"},"o":15},{"l":7,"v":{"readings":"[51, 181, 99, 100]","light":"51"},"o":15,"fn":"loop"},{"l":8,"v":{"readings":"[51, 181, 99, 100]","light":"51"},"o":15,"fn":"loop"},{"l":15,"v":{"readings":"[51, 181, 99, 100]","light":"51"},"o":27},{"l":16,"v":{"readings":"[51, 181, 99, 100]","light":"181"},"o":27},{"l":7,"v":{"readings":"[51, 181, 99, 100]","light":"181"},"o":27,"fn":"loop"},{"l":10,"v":{"readings":"[51, 181, 99, 100]","light":"181"},"o":27,"fn":"loop"},{"l":15,"v":{"readings":"[51, 181, 99, 100]","light":"181"},"o":40},{"l":16,"v":{"readings":"[51, 181, 99, 100]","light":"99"},"o":40},{"l":7,"v":{"readings":"[51, 181, 99, 100]","light":"99"},"o":40,"fn":"loop"},{"l":8,"v":{"readings":"[51, 181, 99, 100]","light":"99"},"o":40,"fn":"loop"},{"l":15,"v":{"readings":"[51, 181, 99, 100]","light":"99"},"o":52},{"l":16,"v":{"readings":"[51, 181, 99, 100]","light":"100"},"o":52},{"l":7,"v":{"readings":"[51, 181, 99, 100]","light":"100"},"o":52,"fn":"loop"},{"l":10,"v":{"readings":"[51, 181, 99, 100]","light":"100"},"o":52,"fn":"loop"},{"l":15,"v":{"readings":"[51, 181, 99, 100]","light":"100"},"o":65}],"cut":false}},"cap":"用 Python 模擬「設定函數 + 無限循環函數」。按「下一步」：setup() 只執行一次，loop() 每個讀數執行一次。"}],"practice":[{"id":"c8-s2-p1","type":"mc","pts":3,"src":"教科書 p.331 課題練習 2","q":"程式開始時溫度是 28，風扇能啟動；但溫度降至 24 時，風扇仍然轉動。原因及解決方法是什麼？\n```\n當啟動時\n    如果 溫度感應器 攝氏溫度 > 25 則\n        開啟風扇摩打\n    否則\n        停止風扇摩打\n```","options":["應把「開啟」和「停止」對調。","程式啟動後只運行一次，開啟風扇後便結束；應改用「重複無限次」。","條件應改為「> 24」。","溫度感應器壞了，應更換感應器。"],"answer":1,"hint":"「當啟動時」內的程式會運行多少次？","why":"設定函數只運行一次，之後再沒有讀取溫度；要放進不停重複的循環。","_right":1},{"id":"c8-s2-p2","type":"mc","pts":2,"src":"仿教科書 p.331 課題練習 2","verify":true,"q":"用 Python 模擬課題練習 2 的錯誤：感應器先後讀到 28、24，但程式只讀一次。輸出是什麼？","code":"readings = [28, 24]\ntemp = readings[0]       # 只在啟動時讀一次\nif temp > 25:\n    print(\"開啟風扇\")\nelse:\n    print(\"停止風扇\")","options":["停止風扇","開啟風扇\n停止風扇","停止風扇\n開啟風扇","開啟風扇"],"answer":3,"hint":"程式只處理了 readings[0]。","why":"沒有循環，24 那個讀數根本沒有被處理。","_right":3},{"id":"c8-s2-p3","type":"mc","pts":2,"src":"教科書 p.315 實驗站 8.1 第 2 步","q":"micro:bit 程式：「當啟動時」顯示 3、2、1；「重複無限次」顯示大心形、小心形。模擬器會看到什麼？","options":["3、2、1 和心形不斷重複","只顯示大心和小心各一次","只由 3 倒數至 1，然後不再變化","先由 3 倒數至 1，然後大心、小心不斷交替（心跳動畫）"],"answer":3,"hint":"設定只運行一次；無限循環不停重複。","_right":3},{"id":"c8-s2-p4","type":"mc","pts":1,"src":"教科書 p.317 實驗站 8.2","q":"micro:bit 的光線感應器：環境光愈亮，讀數會怎樣？","options":["變成負數","愈大","愈小","不變"],"answer":1,"hint":"用電筒照向感應器時，讀數大於 100。","_right":1},{"id":"c8-s2-p5","type":"mc","pts":2,"src":"教科書 p.315–316 擴闊視野","q":"為什麼有時要由積木（視覺化編程）改用 Python（文字編程）？","options":["文字編程一定比積木容易閱讀","文字編程的靈活度較高，例如可以指定圖示的顯示時間","文字編程不需要遵守語法","積木程式不能在 micro:bit 上運行"],"answer":1,"hint":"p.316「心跳加速」的例子。","why":"積木的「顯示圖示」預設 600 毫秒，不能縮短；Python 可以加參數，例如 `basic.show_icon(IconNames.HEART, 200)`。","_right":1}]},{"id":"s3","title":"事件驅動程式","pages":"教科書 p.318–319、p.331","learn":[{"pts":["日常例子：按下相機快門便拍照；按下升降機按鈕，升降機便到達。（p.318）","**事件驅動程式**：設計程式時設定觸發程式執行的**事件**；當特定事件發生時，便執行相應的程式碼（**事件處理器**）。（p.318）","micro:bit 例子：「當按鈕 A 被按下」顯示 A；「當按鈕 B 被按下」顯示 B；「當按鈕 A+B 被按下」清空畫面。（p.318 實驗站 8.3）","計步器：「當啟動時」steps ← 0；「當搖晃時」steps ← steps + 1，然後輸出 steps。（p.331 課題練習 3）"]},{"sim":{"code":"screen = \"\"\n\ndef on_button_a():\n    global screen\n    screen = \"A\"\n\ndef on_button_b():\n    global screen\n    screen = \"B\"\n\ndef on_button_ab():\n    global screen\n    screen = \"\"\n\n# 用 input() 模擬事件：輸入 A、B 或 A+B，輸入 end 結束\nevent = input()\nwhile event != \"end\":\n    if event == \"A\":\n        on_button_a()\n    elif event == \"B\":\n        on_button_b()\n    elif event == \"A+B\":\n        on_button_ab()\n    print(\"畫面：\", screen)\n    event = input()","inputs":"A\nB\nA+B\nA\nend","open":["vars"],"_run":{"out":"A\n畫面： A\nB\n畫面： B\nA+B\n畫面： \nA\n畫面： A\nend\n","err":null,"vrepr":{"screen":"'A'","event":"'end'"},"files":{}}},"cap":"實驗站 8.3（p.318）的 Python 模擬：每個事件調用對應的子程式（事件處理器）。"}],"practice":[{"id":"c8-s3-p1","type":"complete","pts":3,"src":"教科書 p.331 課題練習 3","label":"補完程式","q":"用 Python 模擬計步器：輸入 `shake` 代表一次「當搖晃時」事件，`end` 代表結束。每次搖晃，步數加 1 並輸出步數。會用多組數據測試。","template":"steps = ［1］            # 當啟動時\nevent = input()\nwhile event != \"end\":\n    if event == \"shake\":   # 當搖晃時\n        steps = ［2］\n        print(steps)\n    event = input()","ref":["0","steps + 1"],"tests":[{"inputs":"shake\nshake\nshake\nend"},{"inputs":"end"},{"inputs":"shake\nstill\nshake\nend"}],"check":{"out":true},"hint":"啟動時步數由 0 開始；每次搖晃加 1。","_exp":[{"out":"shake\n1\nshake\n2\nshake\n3\nend\n","err":null},{"out":"end\n","err":null},{"out":"shake\n1\nstill\nshake\n2\nend\n","err":null}]},{"id":"c8-s3-p2","type":"mc","pts":2,"src":"仿教科書 p.318 實驗站 8.3","verify":true,"ask":{"var":"screen"},"q":"依次發生事件：按鈕 A、按鈕 A+B、按鈕 B。最後 screen 的值是什麼？","code":"screen = \"\"\nevents = [\"A\", \"A+B\", \"B\"]\nfor e in events:\n    if e == \"A\":\n        screen = \"A\"\n    elif e == \"B\":\n        screen = \"B\"\n    elif e == \"A+B\":\n        screen = \"\"","options":["AB","A+B","B","A"],"answer":2,"hint":"每個事件都會改變畫面；看最後一個事件。","_right":2},{"id":"c8-s3-p3","type":"mc","pts":2,"src":"教科書 p.319 測試站 8.2","q":"電子水平尺：「左側偏低」時亮起左方 3 × 3 方塊；「左右平衡」時亮起中間 3 × 3 方塊；「右側偏低」時亮起右方 3 × 3 方塊。水平尺**向右傾斜**時，LED 面板第 2 至 4 行哪幾列亮起？","options":["第 3 至 5 列","第 1 至 3 列","第 2 至 4 列","全部 5 列"],"answer":0,"hint":"向右傾斜即右側偏低。","_right":0},{"id":"c8-s3-p4","type":"mc","pts":2,"src":"教科書 p.318","q":"以下哪一項**最能**說明事件驅動程式？","options":["程式計算 1 至 100 的總和","按下升降機按鈕後，升降機才到達該層","程式由第一行順序執行到最後一行","程式每秒讀取一次溫度並記錄"],"answer":1,"hint":"事件發生 → 執行相應程式碼。","_right":1},{"id":"c8-s3-p5","type":"mc","pts":1,"src":"教科書 p.318 實驗站 8.3 第 2 步","q":"要令 micro:bit「當同時按下按鈕 A 及 B 時，清空畫面」，應使用哪個積木作事件？","options":["當按鈕 A+B 被按下","當啟動時","重複無限次","當搖晃時"],"answer":0,"hint":"按鈕積木有 A、B、A+B 三個選項。","_right":0}]},{"id":"s4","title":"自動化、物聯網與人工智能","pages":"教科書 p.320–329","learn":[{"pts":["**自動化**：讓電腦根據預定程式自行作出決定，只須用**條件語句**和**關係運算符**編寫。好處：減少人力、提升成本效益、可以無間斷運作。（p.320、p.325）","智能街燈（圖 8.11）：讀取光線感應器 → 光亮度 \u003c 臨界值？是 → 亮起 LED；否 → 熄滅 LED → 返回再讀取（不斷重複）。（p.320）","**物聯網（IoT）**：物件和感應器連結互聯網，互相傳輸數據；常用無線通訊技術有 Wi-Fi、藍牙、RFID、NFC。（p.325）","**人工智能物聯網（AIoT）**：物聯網**收集數據** → **大數據** → **雲端運算**提供運算能力**訓練模型** → **人工智能**分析趨勢、預測結果及自動採取行動。（p.326、p.330）","人工智能應用：**圖像識別**（Teachable Machine：收集樣本 → 訓練模型 → 測試模型）、**語音識別**（把語音轉換為文字，例如 Siri、App Inventor 的語音辨識組件）。（p.326–329）","**工程設計流程**：發問 → 思考 → 構思 → 創作 → 改善，與編程解難（界定問題 → 分析問題 → 設計算法 → 開發程式 → 測試及除錯）相似。（p.329）"]},{"sim":{"code":"# 智能電熱水煲（測試站 8.3 第 2 題）的 Python 模擬\n# 每次 input() 代表讀取一次水溫度感應器\ntemp = int(input())\nwhile temp \u003c 100:\n    print(temp, \"紅燈：沸騰中\")\n    temp = int(input())\nprint(temp, \"綠燈：沸騰完成\")\nprint(\"蜂鳴器發出提示聲\")\nprint(\"停止煲水\")","inputs":"25\n70\n99\n100","open":["vars"],"_run":{"out":"25\n25 紅燈：沸騰中\n70\n70 紅燈：沸騰中\n99\n99 紅燈：沸騰中\n100\n100 綠燈：沸騰完成\n蜂鳴器發出提示聲\n停止煲水\n","err":null,"vrepr":{"temp":"100"},"files":{}}},"cap":"流程圖（p.324）：讀取水溫 →〈水溫 \u003c 100〉是 → 紅燈並再讀取；否 → 綠燈、提示聲、停止煲水。"}],"practice":[{"id":"c8-s4-p1","type":"complete","pts":3,"src":"教科書 p.331 課題練習 4(b)","label":"補完程式","q":"用 Python 模擬護眼裝置：每次 input() 是超聲波（距離）感應器的讀數（厘米），`-1` 代表關機。距離**小於 50 厘米**便關閉屏幕，否則開啟屏幕。會用多組數據測試（包括邊界值 50）。","template":"d = int(input())\nwhile d != -1:          # 真正的裝置：重複無限次\n    if ［1］:\n        print(\"關閉屏幕\")\n    else:\n        print(\"開啟屏幕\")\n    d = int(input())","ref":["d \u003c 50"],"tests":[{"inputs":"80\n30\n-1"},{"inputs":"50\n49\n-1"},{"inputs":"-1"},{"inputs":"0\n120\n51\n-1"}],"check":{"out":true},"hint":"「小於 50」不包括 50。","_exp":[{"out":"80\n開啟屏幕\n30\n關閉屏幕\n-1\n","err":null},{"out":"50\n開啟屏幕\n49\n關閉屏幕\n-1\n","err":null},{"out":"-1\n","err":null},{"out":"0\n關閉屏幕\n120\n開啟屏幕\n51\n開啟屏幕\n-1\n","err":null}]},{"id":"c8-s4-p2","type":"mc","pts":2,"src":"教科書 p.324 測試站 8.3 第 1(a) 題（參考 DSE 2022 SP 2C Q11）","tags":[{"t":"hot","why":"選擇感應器／輸出設備並解釋運作：參考 DSE 2022 Sample Paper 2C Q11（教科書測試站 8.1、8.3）。"}],"q":"有人走進走廊時，走廊的燈會自動亮起。應使用哪種感應器？","options":["光感應器","人體紅外線感應器","溫度感應器","懸浮粒子感應器"],"answer":1,"hint":"要偵測的是人的動作。","why":"教科書答案：人體紅外線感應器／超聲波感應器。","_right":1},{"id":"c8-s4-p3","type":"mc","pts":2,"src":"教科書 p.325 測試站 8.3 第 3 題","q":"以下哪一項**不是**自動化的好處？","options":["減少人力消耗","提升成本效益","可以無間斷運作","裝置不需要任何程式便能運作"],"answer":3,"hint":"自動化要根據「預定程式」作決定。","_right":3},{"id":"c8-s4-p4","type":"mc","pts":2,"src":"教科書 p.326、p.330","q":"在人工智能物聯網中，以下哪個次序正確？","options":["雲端運算 → 物聯網 → 人工智能 → 大數據","大數據 → 物聯網收集數據 → 人工智能 → 雲端運算","物聯網收集數據 → 大數據 → 雲端運算訓練模型 → 人工智能預測結果","人工智能 → 物聯網 → 大數據 → 雲端運算"],"answer":2,"hint":"先有數據，才能訓練模型。","_right":2},{"id":"c8-s4-p5","type":"mc","pts":1,"src":"教科書 p.331 課題練習 1(b)","q":"曉晴想**遠程存取**監察站內感應器的數據，應怎樣做？","options":["加入 Wi-Fi 模組連接互聯網，自動把實時數據傳送到雲端","加入更多感應器","加入一個蜂鳴器","把程式改用積木編寫"],"answer":0,"hint":"物聯網：連接互聯網。","_right":0}]},{"id":"write","kind":"write","title":"分析題","pages":"教科書 p.307–310、p.320–331","intro":"第 1 題選出感應器及輸出設備；第 2、3 題用 Python 模擬裝置的控制邏輯（以 input() 代替感應器讀數），寫好後按「提交評核」。","tasks":[{"id":"c8-w1","kind":"table","tier":"必做","title":"選擇感應器及輸出設備","pts":10,"src":"教科書 p.307–310、p.324、p.331","prompt":"為以下每個智能裝置選出最合適的**感應器**（輸入）和**輸出設備**。","q":"為以下每個智能裝置選出最合適的**感應器**（輸入）和**輸出設備**。","head":["智能裝置","感應器","輸出設備"],"opts":{"S":["光感應器","超聲波感應器","溫度感應器","人體紅外線感應器","土壤濕度感應器","懸浮粒子感應器"],"O":["LED 燈","蜂鳴器","顯示器","直流摩打","伺服摩打","水泵"]},"rows":[["智能街燈：環境昏暗時亮燈",{"sel":"S","a":"光感應器"},{"sel":"O","a":"LED 燈"}],["智能盆栽：泥土太乾便自動澆水",{"sel":"S","a":"土壤濕度感應器"},{"sel":"O","a":"水泵"}],["倒車雷達：太接近障礙物便發出響聲",{"sel":"S","a":"超聲波感應器"},{"sel":"O","a":"蜂鳴器"}],["智能風扇：室溫高於 25°C 便轉動",{"sel":"S","a":"溫度感應器"},{"sel":"O","a":"直流摩打"}],["空氣污染監察站：實時展示懸浮粒子濃度",{"sel":"S","a":"懸浮粒子感應器"},{"sel":"O","a":"顯示器"}]],"hint":"先想「要量度什麼物理量」，再想「要以什麼形式回應」：光、聲音、文字還是轉動。"},{"id":"c8-w2","tier":"必做","title":"智能電熱水煲","pts":12,"src":"教科書 p.324 測試站 8.3 第 2(c) 題","q":"每次 `input()` 代表讀取一次水溫度感應器（整數，°C）。\n• 水溫**低於 100**：輸出 `紅燈`，然後再讀取；\n• 水溫**達到 100 或以上**：依次輸出 `綠燈`、`提示聲`、`停止煲水`，程式結束（不再讀取）。\n第一行已寫好。","starter":"temp = int(input())\n","ref":"temp = int(input())\nwhile temp \u003c 100:\n    print(\"紅燈\")\n    temp = int(input())\nprint(\"綠燈\")\nprint(\"提示聲\")\nprint(\"停止煲水\")","tests":[{"inputs":"25\n60\n99\n100"},{"inputs":"100"},{"inputs":"98\n101"},{"inputs":"20\n99\n99\n105"}],"check":{"out":true},"rules":[{"must":"while","msg":"要用 while 循環不斷讀取水溫。"}],"hint":"按流程圖：`while temp \u003c 100:` 循環內輸出紅燈並再讀取；循環結束後輸出三行。邊界：剛好 100 已經沸騰。","_exp":[{"out":"25\n紅燈\n60\n紅燈\n99\n紅燈\n100\n綠燈\n提示聲\n停止煲水\n","err":null},{"out":"100\n綠燈\n提示聲\n停止煲水\n","err":null},{"out":"98\n紅燈\n101\n綠燈\n提示聲\n停止煲水\n","err":null},{"out":"20\n紅燈\n99\n紅燈\n99\n紅燈\n105\n綠燈\n提示聲\n停止煲水\n","err":null}],"_sample":"25\n紅燈\n60\n紅燈\n99\n紅燈\n100\n綠燈\n提示聲\n停止煲水\n"},{"id":"c8-w3","tier":"挑戰","title":"計步器：達標提示","pts":13,"src":"仿教科書 p.331 課題練習 3","q":"第一個 `input()` 是目標步數 goal（正整數）。之後每次 `input()` 是一個事件，直至輸入 `end`：\n• `shake`（當搖晃時）：steps 加 1，輸出 steps；如果 steps **剛好等於** goal，再輸出 `達標！`；\n• 其他事件：不用理會。\n最後輸出 `總步數` 和 steps（用 `print(\"總步數\", steps)`）。","starter":"goal = int(input())\nsteps = 0\nevent = input()\n","ref":"goal = int(input())\nsteps = 0\nevent = input()\nwhile event != \"end\":\n    if event == \"shake\":\n        steps = steps + 1\n        print(steps)\n        if steps == goal:\n            print(\"達標！\")\n    event = input()\nprint(\"總步數\", steps)","tests":[{"inputs":"3\nshake\nshake\nshake\nshake\nend"},{"inputs":"2\nend"},{"inputs":"1\nstill\nshake\nend"},{"inputs":"2\nshake\nstill\nshake\nend"},{"inputs":"5\nshake\nshake\nend"}],"check":{"out":true},"hint":"事件循環：`while event != \"end\":`，循環最後要再 `event = input()`。達標只在 steps == goal 那一次輸出。","_exp":[{"out":"3\nshake\n1\nshake\n2\nshake\n3\n達標！\nshake\n4\nend\n總步數 4\n","err":null},{"out":"2\nend\n總步數 0\n","err":null},{"out":"1\nstill\nshake\n1\n達標！\nend\n總步數 1\n","err":null},{"out":"2\nshake\n1\nstill\nshake\n2\n達標！\nend\n總步數 2\n","err":null},{"out":"5\nshake\n1\nshake\n2\nend\n總步數 2\n","err":null}],"_sample":"3\nshake\n1\nshake\n2\nshake\n3\n達標！\nshake\n4\nend\n總步數 4\n"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.307–331","items":[{"id":"c8-q1","pts":5,"src":"教科書 p.311 圖 8.7","tags":[{"t":"hot","why":"選擇感應器／輸出設備並解釋運作：參考 DSE 2022 Sample Paper 2C Q11（教科書測試站 8.1、8.3）。"}],"q":"一部四輪機械車以 Arduino 控制，用超聲波感應器避開障礙物，用直流摩打推動車輪。以下哪項配對正確？","options":["輸入：Arduino；處理：超聲波感應器；輸出：直流摩打","輸入：直流摩打；處理：Arduino；輸出：超聲波感應器","輸入：超聲波感應器；處理：直流摩打；輸出：Arduino","輸入：超聲波感應器；處理：Arduino；輸出：直流摩打"],"answer":"D","why":"可編程微控制器是處理器；感應器是輸入設備；摩打是輸出設備。","_right":3},{"id":"c8-q2","pts":5,"src":"仿教科書 p.320 智能街燈","verify":true,"q":"智能街燈的模擬程式依次讀到以下光亮度。輸出是什麼？","code":"readings = [120, 99, 100, 30]\ncount = 0\nfor light in readings:\n    if light \u003c 100:\n        count = count + 1\nprint(count)","options":["4","2","1","3"],"answer":"B","why":"只有 99 和 30 小於 100；100 不算。","_right":1},{"id":"c8-q3","pts":5,"src":"教科書 p.331 課題練習 4(b)","q":"護眼裝置的算法如下。空格應填什麼？\n```\n重複 ＿＿＿＿ 次\n    如果 超聲波（距離）感應器 \u003c 50 則\n        關閉屏幕\n    否則\n        開啟屏幕\n```","options":["0","無限","1","50"],"answer":"B","why":"裝置要不停檢查距離；只檢查一次便會出現課題練習 2 的問題。","_right":1},{"id":"c8-q4","pts":5,"src":"教科書 p.325","q":"以下哪一項**不是**教科書列出的物聯網無線通訊技術？","options":["Wi-Fi","藍牙（Bluetooth）","無線射頻識別（RFID）","USB"],"answer":"D","why":"教科書列出 Wi-Fi、藍牙、RFID 和 NFC；USB 要用線連接。","_right":3},{"id":"c8-q5","pts":5,"src":"教科書 p.326–327","q":"關於人工智能，以下哪項描述**正確**？\n(1) 雲端運算為訓練人工智能模型提供更強大的運算能力。\n(2) 語音識別能把人類語音轉換為相應的文字。\n(3) 用 Teachable Machine 做圖像識別，不需要提供圖片樣本。","options":["只有 (1) 和 (2)","只有 (1) 和 (3)","只有 (2) 和 (3)","(1)、(2) 和 (3)"],"answer":"A","why":"Teachable Machine 要先收集樣本（上載或拍攝圖片），才能訓練模型。","_right":0}]},{"id":"more","kind":"endless","title":"無限練習","gens":["pyIf","pyBool","pyWhile"],"intro":"隨機生成條件語句、布爾運算及 while 循環題目（自動化裝置的控制邏輯），答案由 Python 計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]}, {"code":"選修C","title":"選修C 算法與程式編寫 自學平台","kicker":"HKDSE
