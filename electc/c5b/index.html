     nxt = (nxt + 1) % N\n        wait = wait + 1\n\ndef pop():\n    global wait\n    if wait == 0:\n        print(\"沒有計程車\")\n        return \"\"\n    temp = TAXI[start()]\n    wait = wait - 1\n    return temp\n\npush(\"AB1234\")\npush(\"HD764\")\npush(\"KL2510\")\npush(\"GC646\")\npop()\npop()\npush(\"SC343\")\npush(\"NN203\")\npop()\npush(\"ST546\")\nfirst_car = TAXI[start()]","blanks":[{"label":"nxt","ask":{"var":"nxt"}},{"label":"wait","ask":{"var":"wait"}},{"label":"首位車牌","ask":{"var":"first_car"}}],"hint":"教科書答案 next = 1、wait = 4。首位索引 = nxt − wait + N = 1 − 4 + 6。","_ans":["1","4","GC646"]}]},{"id":"write","kind":"write","title":"寫程式","pages":"教科書 p.167、p.174–182","intro":"在編輯器寫 Python 程式，先按 ▶ 自己測試，再按「提交評核」。每個 `input()` 讀一行輸入。","tasks":[{"id":"c5b-w1","pts":15,"title":"餐廳輪候（Python 列表隊列）","src":"教科書 p.166–168","q":"第一行輸入指令數目 n，之後每行一個指令：\n• `JOIN 名字`：客人排隊。\n• `SEAT`：最先排隊的客人入座，輸出 `請 名字 入座`；沒有人輪候便輸出 `沒有客人`。\n全部指令完成後，輸出仍在輪候的人數。","starter":"queue = []\nn = int(input())\nfor i in range(n):\n    cmd = input()\n    # 在這裏完成\nprint(len(queue))","ref":"queue = []\nn = int(input())\nfor i in range(n):\n    cmd = input()\n    if cmd == \"SEAT\":\n        if len(queue) == 0:\n            print(\"沒有客人\")\n        else:\n            print(\"請\", queue.pop(0), \"入座\")\n    else:\n        queue.append(cmd[5:])\nprint(len(queue))","tests":[{"inputs":"5\nJOIN Amy\nJOIN Ben\nSEAT\nJOIN Cat\nSEAT"},{"inputs":"2\nSEAT\nJOIN Dan"},{"inputs":"4\nJOIN A\nSEAT\nSEAT\nJOIN B"},{"inputs":"3\nJOIN Mr Chan\nJOIN Ken\nSEAT"}],"hint":"`cmd[5:]` 取得 \"JOIN \" 之後的名字。離隊用 `pop(0)`，離隊前檢查是否空。`print(\"請\", name, \"入座\")` 會自動以空格分隔。","_exp":[{"out":"5\nJOIN Amy\nJOIN Ben\nSEAT\n請 Amy 入座\nJOIN Cat\nSEAT\n請 Ben 入座\n1\n","err":null},{"out":"2\nSEAT\n沒有客人\nJOIN Dan\n1\n","err":null},{"out":"4\nJOIN A\nSEAT\n請 A 入座\nSEAT\n沒有客人\nJOIN B\n1\n","err":null},{"out":"3\nJOIN Mr Chan\nJOIN Ken\nSEAT\n請 Mr Chan 入座\n1\n","err":null}],"_sample":"5\nJOIN Amy\nJOIN Ben\nSEAT\n請 Amy 入座\nJOIN Cat\nSEAT\n請 Ben 入座\n1\n"},{"id":"c5b-w2","pts":20,"title":"循環隊列（陣列 + 指示標）","src":"教科書 p.174–182","q":"用大小 4 的陣列 `Q` 實現**循環隊列**，`head` 是前端索引，`count` 是項目數量（已寫好）。第一行輸入指令數目 n，之後每行一個指令：\n• `ENQ 數字`：如果已滿，輸出 `隊列已滿`；否則把數字（整數）存入 `Q[(head + count) % 4]`，count 加 1。\n• `DEQ`：如果是空的，輸出 `隊列是空的`；否則輸出 `Q[head]`，head 前進一格（到 3 之後回到 0），count 減 1。**離隊時不用清除陣列內容。**\n全部指令完成後，輸出 `Q`、`head`、`count`（一行，用 `print(Q, head, count)`）。\n**不可**使用 `append`、`pop`。","starter":"Q = [0, 0, 0, 0]\nhead = 0\ncount = 0\nn = int(input())\nfor i in range(n):\n    cmd = input()\n    # 在這裏完成\nprint(Q, head, count)","ref":"Q = [0, 0, 0, 0]\nhead = 0\ncount = 0\nn = int(input())\nfor i in range(n):\n    cmd = input()\n    if cmd == \"DEQ\":\n        if count == 0:\n            print(\"隊列是空的\")\n        else:\n            print(Q[head])\n            head = (head + 1) % 4\n            count = count - 1\n    else:\n        if count == 4:\n            print(\"隊列已滿\")\n        else:\n            Q[(head + count) % 4] = int(cmd[4:])\n            count = count + 1\nprint(Q, head, count)","rules":[{"mustNot":"append","msg":"這題要用陣列和指示標，不可用 append。"},{"mustNot":"pop(","msg":"這題要用陣列和指示標，不可用 pop()。"},{"must":"%","msg":"循環隊列要用 % 令索引繞回 0。"}],"tests":[{"inputs":"6\nENQ 5\nENQ 8\nDEQ\nENQ 2\nDEQ\nDEQ"},{"inputs":"2\nDEQ\nENQ 7"},{"inputs":"9\nENQ 1\nENQ 2\nENQ 3\nDEQ\nDEQ\nENQ 4\nENQ 5\nENQ 6\nENQ 7"},{"inputs":"7\nENQ 10\nENQ 20\nENQ 30\nENQ 40\nDEQ\nENQ 50\nDEQ"}],"hint":"末端的下一個空位是 `(head + count) % 4`。滿的條件 `count == 4`，空的條件 `count == 0`。`int(cmd[4:])` 取得 \"ENQ \" 之後的數字。","_exp":[{"out":"6\nENQ 5\nENQ 8\nDEQ\n5\nENQ 2\nDEQ\n8\nDEQ\n2\n[5, 8, 2, 0] 3 0\n","err":null},{"out":"2\nDEQ\n隊列是空的\nENQ 7\n[7, 0, 0, 0] 0 1\n","err":null},{"out":"9\nENQ 1\nENQ 2\nENQ 3\nDEQ\n1\nDEQ\n2\nENQ 4\nENQ 5\nENQ 6\nENQ 7\n隊列已滿\n[5, 6, 3, 4] 2 4\n","err":null},{"out":"7\nENQ 10\nENQ 20\nENQ 30\nENQ 40\nDEQ\n10\nENQ 50\nDEQ\n20\n[50, 20, 30, 40] 2 3\n","err":null}],"_sample":"6\nENQ 5\nENQ 8\nDEQ\n5\nENQ 2\nDEQ\n8\nDEQ\n2\n[5, 8, 2, 0] 3 0\n"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.171–182","items":[{"id":"c5b-q1","pts":4,"src":"教科書 p.178 例題 5.3(e)（參考 DSE 2020 卷二D Q3）","tags":[{"t":"hot","why":"隊列／循環隊列：DSE 2012 練習卷 卷二D Q2、2016 卷二D Q2、2020 卷二D Q3"}],"verify":true,"q":"陣列 T 的索引由 0 至 9，以循環隊列儲存輪候客戶。first 是首位客戶的索引，N 是人數。以下程式的輸出是什麼？","code":"first = 7\nN = 5\nprint((first + N - 1) % 10)","options":["11","1","2","0"],"answer":"B","why":"客戶在索引 7、8、9、0、1；最後一位的索引是 (7 + 5 − 1) % 10 = 1。","_right":1},{"id":"c5b-q2","pts":4,"src":"教科書 p.181 測試站 5.3(c)（參考 DSE 2016 卷二D Q2）","tags":[{"t":"hot","why":"隊列／循環隊列：DSE 2012 練習卷 卷二D Q2、2016 卷二D Q2、2020 卷二D Q3"}],"verify":true,"q":"計程車循環隊列大小 N = 6，nxt 是下一架車的等候位置，wait 是車數。以下程式的輸出是什麼？","code":"N = 6\nnxt = 1\nwait = 4\nif nxt - wait >= 0:\n    print(nxt - wait)\nelse:\n    print(nxt - wait + N)","options":["-3","3","5","1"],"answer":"B","why":"1 − 4 = −3 是負數，要加 N：首位在索引 3（車輛在 3、4、5、0）。","_right":1},{"id":"c5b-q3","pts":4,"src":"教科書 p.175 提示","q":"使用循環隊列時，為什麼要額外使用一個變量 N 記錄項目數量？","options":["因為 Python 列表沒有 len()","因為單靠 head 和 tail 的位置無法判斷隊列是空的還是滿的","因為循環隊列只能儲存 N 個項目","因為要計算平均輪候時間"],"answer":"B","why":"空的隊列和滿的隊列，head 與 tail 的相對位置可以一樣（p.175 兩幅圖）。","_right":1},{"id":"c5b-q4","pts":4,"src":"教科書 p.173–174、p.205 課題練習 2(c)","tags":[{"t":"hot","why":"隊列／循環隊列：DSE 2012 練習卷 卷二D Q2、2016 卷二D Q2、2020 卷二D Q3"}],"q":"用陣列及兩個指示標實現**非循環**的隊列。即使前端已有很多項目離隊，末端指示標到達陣列盡頭後仍不能再排隊。以下哪項是最合適的解決方法？","options":["每次離隊把所有項目往前移一格","使用循環隊列：指示標到達陣列末端後重設為最前端的索引","把隊列改為堆疊","離隊時把項目設為空字串"],"answer":"B","why":"往前移雖然可行但效率低（例題 5.2 想像）；循環隊列可重用已離隊的位置。","_right":1},{"id":"c5b-q5","pts":4,"src":"自擬","verify":true,"q":"以下程式的輸出是什麼？","code":"q = []\nfor x in [4, 8, 1, 6]:\n    q.append(x)\na = q.pop(0)\nb = q.pop(0)\nq.append(a + b)\nq.pop(0)\nprint(q)","options":["[6, 12]","[1, 6]","[8, 1, 6]","[4, 8, 12]"],"answer":"A","why":"離隊 4、8，排入 12：[1, 6, 12]；再離隊 1，剩 [6, 12]。","_right":0}]},{"id":"more","kind":"endless","title":"無限練習","gens":["pyQueue","pyStack","pyList"],"intro":"隨機生成隊列、堆疊及列表的題目，答案由程式計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]}, {"code":"選修C","title":"選修C 算法與程式編寫 自學平台","kicker":"HKDSE ICT · 選修 C","pin":"cict2026"});
