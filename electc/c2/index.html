多出的數位。**截尾誤差** = |真實數值 − 實際儲存數值|。π 截尾至 3 個小數位 = 3.141。（p.55）","Python：`math.trunc(1234.56789)` 和 `int(1234.56789)` 都得 `1234`。（p.55）","**四捨五入**：`round(PI, 2)` 得 3.14，`round(PI, 4)` 得 3.1416。（p.56）","**上捨**：調升到最接近的數值（π → 3.15）；**下捨**：降低到最接近的數值（π → 3.14）。**捨入誤差** = |真實數值 − 捨入後的數值|。（p.57）","常見錯誤：下捨 ≠ 截尾。負數時：−3.456 下捨至兩個小數位是 −3.46，截尾是 −3.45。（p.57）"]},{"table":{"head":["","Python","2.7","-2.7"],"rows":[["截尾","`int(x)`／`math.trunc(x)`","2","-2"],["下捨（至整數）","`math.floor(x)`","2","-3"],["上捨（至整數）","`math.ceil(x)`","3","-2"],["捨入（至整數）","`round(x)`","3","-3"]]},"cap":"教科書 p.57 說 Python 沒有上捨及下捨函數；其實 `math` 有 `ceil()` 和 `floor()`（只捨入至整數）。"},{"warn":"Python 3 的 `round()` **不完全是四捨五入**：剛好在中間（.5）時取**雙數**（銀行家捨入），所以 `round(2.5)` 得 `2`，`round(3.5)` 得 `4`。此外很多小數不能以二進制準確儲存，`round(2.675, 2)` 得 `2.67`。"},{"sim":{"code":"import math\nx = -3.456\nprint(math.trunc(x * 100) / 100)\nprint(math.floor(x * 100) / 100)\nprint(math.ceil(x * 100) / 100)\nprint(round(x, 2))","step":true,"open":["vars"],"_run":{"out":"-3.45\n-3.46\n-3.45\n-3.46\n","err":null,"vrepr":{"x":"-3.456"},"files":{},"steps":[{"l":1,"v":{},"o":0},{"l":2,"v":{},"o":0},{"l":3,"v":{"x":"-3.456"},"o":0},{"l":4,"v":{"x":"-3.456"},"o":6},{"l":5,"v":{"x":"-3.456"},"o":12},{"l":6,"v":{"x":"-3.456"},"o":18}],"cut":false}},"cap":"先乘 100、取整、再除 100，便可截尾／下捨／上捨至兩個小數位。"}],"tries":[{"id":"c2-s2-t1","pts":4,"src":"教科書 p.55–57","code":"import math\nprint(math.trunc(-3.7), math.floor(-3.7), round(-3.7))","q":"先估：輸出是什麼？","options":["-3 -4 -4","-4 -4 -4","-3 -3 -4","-3 -4 -3"],"why":"截尾直接去掉小數得 -3；下捨向較小的方向得 -4；四捨五入 -3.7 最接近 -4。","_right":0,"_ans":"-3 -4 -4","_run":{"out":"-3 -4 -4\n","err":null,"vrepr":{},"files":{},"steps":[{"l":1,"v":{},"o":0},{"l":2,"v":{},"o":0}],"cut":false}}],"practice":[{"id":"c2-s2-p1","type":"fill","pts":3,"src":"教科書 p.58 活動 2.1 第 1 題","q":"把 2.3 捨入至整數。寫出數值及上捨的誤差。","code":"import math\nx = 2.3","blanks":[{"label":"上捨 math.ceil(x)","ask":{"expr":"math.ceil(x)"}},{"label":"上捨的誤差","a":"0.7","accept":[".7"]},{"label":"下捨 math.fl ":"marks = [80, 75, 90]\navg = sum(marks) / len(mark)\nprint(avg)","ask":{"error":true},"q":"先估：程式會出現哪種錯誤？","options":["NameError","SyntaxError","TypeError","沒有錯誤"],"why":"`mark` 少了 s，是未定義的變量名稱。語法本身沒有問題，所以要到執行第 2 行時才出錯（運行時錯誤）。","_right":0,"_ans":"NameError","_run":{"out":"","err":{"type":"NameError","line":2,"msg":"name 'mark' is not defined","tb":[{"line":2,"fn":"\u003cmodule>"}]},"vrepr":{"marks":"[80, 75, 90]"},"files":{},"steps":[{"l":1,"v":{},"o":0},{"l":2,"v":{"marks":"[80, 75, 90]"},"o":0}],"cut":false}}],"practice":[{"id":"c2-s3-p1","type":"mc","pts":2,"src":"教科書 p.58（計算負數的平方根）","q":"執行以下程式會出現哪種錯誤？","ask":{"error":true},"verify":true,"code":"import math\nx = -4\nprint(math.sqrt(x))","options":["ValueError","ZeroDivisionError","OverflowError","沒有錯誤"],"answer":0,"hint":"數值不合要求（math domain error）。","_right":0},{"id":"c2-s3-p2","type":"mc","pts":1,"src":"教科書 p.58","q":"程式寫了 `while x > 0` （欠冒號）。這屬於哪一類錯誤？","options":["語法錯誤","邏輯錯誤","運行時錯誤","溢出錯誤"],"answer":0,"hint":"違反 Python 的語法規則，程式完全不能開始執行。","_right":0},{"id":"c2-s3-p3","type":"mc","pts":2,"src":"教科書 p.58","q":"程式本應計算 6 個分數的平均分，卻寫成 `avg = total / 5`。這屬於哪一類錯誤？","options":["邏輯錯誤","語法錯誤","運行時錯誤","截尾誤差"],"answer":0,"hint":"程式可以完成，沒有錯誤訊息，但結果錯。","_right":0}]},{"id":"s4","title":"除錯：測試數據、程式追蹤及斷點","pages":"教科書 p.59–62、p.65–66","learn":[{"pts":["**測試數據**：代入數據運行程式，把測試結果與**預期結果**比較；不相等即程式有錯誤。（p.59）","**除錯**：找出錯誤的位置並除去錯誤。人手方式：測試數據、**標記**、**子程式存根**。（p.59）","**程式追蹤**：在 IDE 的除錯模式逐步執行，監察變量的值（等於電腦幫你做追蹤表）。（p.59）","**斷點**：程式暫停執行的位置。暫停時可檢視當刻變量的值，判斷錯誤在斷點之前還是之後；通常加在條件語句或想測試的部分**之前**。（p.59）","斷點加在分支**內**：程式在那裏暫停，表示該條件成立。（p.61）","**迴聲測試**：在關鍵位置（運算後、條件語句前、循環體內）用 `print()` 輸出變量值；除錯完畢後刪除。（p.62）","測試數據分三類：**正常數據**、**邊界數據（邊際個案）**、**錯誤數據**。例如 D 的有效範圍是 0–15：3 是正常、15 是邊界、20 是錯誤。（p.66 課題練習 3(c)）"]},{"sim":{"code":"marks = [98, 79, 56, 68, 77, 93]\navg_mark = sum(marks) / len(marks)\nif avg_mark > 80:\n    grade = \"Distinction\"\nelif avg_mark > 50:\n    grade = \"Pass\"\nelse:\n    grade = \"Fail\"\nprint(avg_mark, grade)","step":true,"open":["vars"],"_run":{"out":"78.5 Pass\n","err":null,"vrepr":{"marks":"[98, 79, 56, 68, 77, 93]","avg_mark":"78.5","grade":"'Pass'"},"files":{},"steps":[{"l":1,"v":{},"o":0},{"l":2,"v":{"marks":"[98, 79, 56, 68, 77, 93]"},"o":0},{"l":3,"v":{"marks":"[98, 79, 56, 68, 77, 93]","avg_mark":"78.5"},"o":0},{"l":5,"v":{"marks":"[98, 79, 56, 68, 77, 93]","avg_mark":"78.5"},"o":0},{"l":6,"v":{"marks":"[98, 79, 56, 68, 77, 93]","avg_mark":"78.5"},"o":0},{"l":9,"v":{"marks":"[98, 79, 56, 68, 77, 93]","avg_mark":"78.5","grade":"'Pass'"},"o":0}],"cut":false}},"cap":"實驗站 2.2（p.60–61）：按「下一步」就像在 Thonny 逐步執行。看看執行到哪一個分支，avg_mark 的值是多少。"}],"tries":[{"id":"c2-s4-t1","pts":4,"src":"教科書 p.60 實驗站 2.2","code":"marks = [98, 79, 56, 68, 77, 93]\navg_mark = sum(marks) / len(marks)\nif avg_mark > 80:\n    grade = \"Distinction\"\nelif avg_mark > 50:\n    grade = \"Pass\"\nelse:\n    grade = \"Fail\"\nprint(avg_mark, grade)","q":"先估：輸出是什麼？","options":["78.5 Pass","78.5 Distinction","78 Pass","78.5 Fail"],"why":"總分 471 ÷ 6 = 78.5；不大於 80，但大於 50，所以是 Pass。","_right":0,"_ans":"78.5 Pass","_run":{"out":"78.5 Pass\n","err":null,"vrepr":{"marks":"[98, 79, 56, 68, 77, 93]","avg_mark":"78.5","grade":"'Pass'"},"files":{},"steps":[{"l":1,"v":{},"o":0},{"l":2,"v":{"marks":"[98, 79, 56, 68, 77, 93]"},"o":0},{"l":3,"v":{"marks":"[98, 79, 56, 68, 77, 93]","avg_mark":"78.5"},"o":0},{"l":5,"v":{"marks":"[98, 79, 56, 68, 77, 93]","avg_mark":"78.5"},"o":0},{"l":6,"v":{"marks":"[98, 79, 56, 68, 77, 93]","avg_mark":"78.5"},"o":0},{"l":9,"v":{"marks":"[98, 79, 56, 68, 77, 93]","avg_mark":"78.5","grade":"'Pass'"},"o":0}],"cut":false}}],"practice":[{"id":"c2-s4-p1","type":"trace","pts":3,"src":"教科書 p.65 課題練習 1","q":"以人手方式進行程式追蹤：完成每次循環完結時 i 和 total 的值。","code":"step = 10\ntotal = 0\nfor i in range(1, step + 1):\n    total = total + (i * i) + step\nprint(total)","spec":{"mode":"iter","cols":["i","total"],"out":true},"hint":"每次加 i × i + 10：11、25、44……","_trace":{"mode":"iter","cols":[{"key":"i","label":"i"},{"key":"total","label":"total"},{"key":"__out","label":"輸出"}],"rows":[{"label":"循環前","line":3,"cells":[{"v":"","changed":false},{"v":"0","changed":true},{"v":"","changed":false}]},{"label":"第 1 次","line":3,"cells":[{"v":"1","changed":true},{"v":"11","changed":true},{"v":"","changed":false}]},{"label":"第 2 次","line":3,"cells":[{"v":"2","changed":true},{"v":"25","changed":true},{"v":"","changed":false}]},{"label":"第 3 次","line":3,"cells":[{"v":"3","changed":true},{"v":"44","changed":true},{"v":"","changed":false}]},{"label":"第 4 次","line":3,"cells":[{"v":"4","changed":true},{"v":"70","changed":true},{"v":"","changed":false}]},{"label":"第 5 次","line":3,"cells":[{"v":"5","changed":true},{"v":"105","changed":true},{"v":"","changed":false}]},{"label":"第 6 次","line":3,"cells":[{"v":"6","changed":true},{"v":"151","changed":true},{"v":"","changed":false}]},{"label":"第 7 次","line":3,"cells":[{"v":"7","changed":true},{"v":"210","changed":true},{"v":"","changed":false}]},{"label":"第 8 次","line":3,"cells":[{"v":"8","changed":true},{"v":"284","changed":true},{"v":"","changed":false}]},{"label":"第 9 次","line":3,"cells":[{"v":"9","changed":true},{"v":"375","changed":true},{"v":"","changed":false}]},{"label":"第 10 次","line":3,"cells":[{"v":"10","changed":true},{"v":"485","changed":true},{"v":"","changed":false}]}]}},{"id":"c2-s4-p2","type":"mc","pts":2,"src":"教科書 p.61 測試站 2.1 第 2 題","q":"在第 3 行加入斷點，以除錯模式運行。程式**首次暫停**時，Shell 顯示什麼？","code":"print(\"This is the first line.\")\nprint(\"A new line\")\nprint(\"Another new line\")\nprint(\"This is line 4\")\nprint(\"The end\")","options":["This is the first line.\nA new line","This is the first line.\nA new line\nAnother new line","This is the first line.","（沒有輸出）"],"answer":0,"hint":"程式在**執行**斷點那一行之前暫停。","_right":0},{"id":"c2-s4-p3","type":"complete","pts":3,"src":"教科書 p.62 測試站 2.1 第 3 題","label":"補完程式（迴聲測試）","q":"在第 5 行及第 7 行輸出剛計算好的變量，以檢視變量的狀態。","template":"marks = [98, 79, 56, 68, 77, 93]\ntotal_mark = 0\nfor i in range(0, len(marks)):\n    total_mark = total_mark + marks[i]\nprint(［1］)\navg_mark = total_mark / len(marks)\nprint(［2］)\nif avg_mark >= 50:\n    print(\"Pass\")\nelse:\n    print(\"Fail\")","ref":["total_mark","avg_mark"],"tests":[{"inputs":""}],"hint":"輸出剛在上一行計算出來的變量。","_exp":[{"out":"471\n78.5\nPass\n","err":null}]}]},{"id":"write","kind":"write","title":"寫程式及除錯","pages":"教科書 p.55–62、p.66","intro":"第 1 題是分析題；第 2、3 題在編輯器寫或修改 Python 程式，先按 ▶ 執行自己測試，再按「提交評核」。","tasks":[{"id":"c2-w1","kind":"table","tier":"必做","title":"找出錯誤類型","pts":10,"src":"教科書 p.54–58、p.66","q":"為以下每個情況選出最合適的錯誤類型。","head":["情況","錯誤類型"],"opts":{"E":["語法錯誤","邏輯錯誤","運行時錯誤","溢出錯誤","截尾誤差","捨入誤差"]},"rows":[["`if mark >= 50` 後面欠了冒號",{"sel":"E","a":"語法錯誤"}],["循環條件永遠成立，程式停不下來",{"sel":"E","a":"邏輯錯誤"}],["`avg = total / n`，而用戶輸入 n 為 0",{"sel":"E","a":"運行時錯誤"}],["`pow(math.e, 1000)` 的結果超出浮點數能儲存的範圍",{"sel":"E","a":"溢出錯誤"}],["8 位元二進制補碼計算 127 + 1",{"sel":"E","a":"溢出錯誤"}],["把 π 儲存為 3.141（直接刪去後面的數位）",{"sel":"E","a":"截尾誤差"}],["`int(19.99)` 得 19",{"sel":"E","a":"截尾誤差"}],["`num[1] = round(c, 2)`，c 是 3.6055…，儲存了 3.61",{"sel":"E","a":"捨入誤差"}],["計算平均分時把 `len(marks)` 誤寫成 `len(marks) - 1`",{"sel":"E","a":"邏輯錯誤"}],["把 e 上捨至兩個小數位，儲存為 2.72",{"sel":"E","a":"捨入誤差"}]],"hint":"截尾是「直接刪去」；捨入包括四捨五入、上捨、下捨。程式能完成但結果錯是邏輯錯誤；程式中途終止是運行時錯誤。"},{"id":"c2-w2","tier":"進階","title":"四位元二進制：加入範圍檢查","pts":12,"src":"教科書 p.66 課題練習 3（參考 DSE 2018 2D Q1b）","q":"下面是課題練習 3 的算法：把非負整數 D 轉換為 4 位元二進制，存入陣列 B。但 D 太大時，結果會出錯（Python 甚至不會報錯！）。\n修改程式：先檢查 D 是否在 **0 至 15** 之內——不在範圍便只輸出 `超出範圍`；否則照樣輸出 B。","starter":"D = int(input())\nB = [0, 0, 0, 0]\ni = 0\nwhile D > 0:\n    B[3-i] = D % 2\n    D = D // 2\n    i = i + 1\nprint(B)","ref":"D = int(input())\nB = [0, 0, 0, 0]\nif D \u003c 0 or D > 15:\n    print(\"超出範圍\")\nelse:\n    i = 0\n    while D > 0:\n        B[3-i] = D % 2\n        D = D // 2\n        i = i + 1\n    print(B)","tests":[{"inputs":"6"},{"inputs":"3"},{"inputs":"0"},{"inputs":"15"},{"inputs":"16"},{"inputs":"20"},{"inputs":"-1"}],"hint":"四位元最大是 1111₂ = 15。測試要包括正常數據（6、3）、邊界數據（0、15、16）和錯誤數據（20、-1）。先用 ▶ 試 D = 20：原程式輸出 [0, 1, 0, 1]——因為 B[3-4] 即 B[-1]，在 Python 是最後一項！","_exp":[{"out":"6\n[0, 1, 1, 0]\n","err":null},{"out":"3\n[0, 0, 1, 1]\n","err":null},{"out":"0\n[0, 0, 0, 0]\n","err":null},{"out":"15\n[1, 1, 1, 1]\n","err":null},{"out":"16\n超出範圍\n","err":null},{"out":"20\n超出範圍\n","err":null},{"out":"-1\n超出範圍\n","err":null}],"_sample":"6\n[0, 1, 1, 0]\n"},{"id":"c2-w3","tier":"挑戰","title":"除錯：平均及最高氣溫","pts":13,"src":"仿教科書 p.59–62（實驗站 2.2、測試站 2.1）","q":"程式要求：先輸入天數 n，再輸入 n 天的氣溫（整數，可以是負數）。輸出平均氣溫（**四捨五入至 1 個小數位**）及最高氣溫，例如：\n`Average: 22.3`\n`Highest: 25`\n下面的程式有 **3 個錯誤**。用逐步執行或迴聲測試找出並改正它們。","starter":"n = int(input())\ntemps = []\nfor i in range(1, n):\n    temps.append(int(input()))\nhighest = 0\ntotal = 0\nfor t in temps:\n    total = total + t\n    if t > highest:\n        highest = t\navg = total // n\nprint(\"Average:\", avg)\nprint(\"Highest:\", highest)","ref":"n = int(input())\ntemps = []\nfor i in range(n):\n    temps.append(int(input()))\nhighest = temps[0]\ntotal = 0\nfor t in temps:\n    total = total + t\n    if t > highest:\n        highest = t\navg = round(total / n, 1)\nprint(\"Average:\", avg)\nprint(\"Highest:\", highest)","tests":[{"inputs":"3\n20\n25\n22"},{"inputs":"1\n-3"},{"inputs":"4\n-5\n-2\n-8\n-1"},{"inputs":"2\n30\n33"},{"inputs":"5\n10\n12\n11\n13\n9"},{"inputs":"3\n1\n2\n2"}],"hint":"(1) `range(1, n)` 只讀入 n − 1 個氣溫。(2) highest 由 0 開始，全部是負數時便錯（邊界／特殊數據！）；應由第一個氣溫開始。(3) `//` 截除了小數，要用 `/` 再 `round(..., 1)`。","_exp":[{"out":"3\n20\n25\n22\nAverage: 22.3\nHighest: 25\n","err":null},{"out":"1\n-3\nAverage: -3.0\nHighest: -3\n","err":null},{"out":"4\n-5\n-2\n-8\n-1\nAverage: -4.0\nHighest: -1\n","err":null},{"out":"2\n30\n33\nAverage: 31.5\nHighest: 33\n","err":null},{"out":"5\n10\n12\n11\n13\n9\nAverage: 11.0\nHighest: 13\n","err":null},{"out":"3\n1\n2\n2\nAverage: 1.7\nHighest: 2\n","err":null}],"_sample":"3\n20\n25\n22\nAverage: 22.3\nHighest: 25\n"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.56–61、p.66","items":[{"id":"c2-q1","pts":4,"src":"教科書 p.56（見本單元警告）","tags":[{"t":"trap","why":"教科書說 round() 是四捨五入；Python 3 在 .5 時取雙數，而且 0.125 等數值有二進制表示問題。"}],"verify":true,"q":"以下程式的輸出是什麼？","code":"print(round(2.5), round(3.5), round(0.125, 2))","options":["3 4 0.13","2 4 0.12","2 4 0.13","3 4 0.12"],"answer":"B","why":"剛好在中間時，Python 3 捨入至雙數：2.5 → 2，3.5 → 4，0.125 → 0.12。","_right":1},{"id":"c2-q2","pts":4,"src":"教科書 p.66 課題練習 3(c)(d)","tags":[{"t":"trap","why":"負索引令 Python 不報錯，錯誤數據產生錯誤結果。"}],"verify":true,"q":"把課題練習 3 的算法照寫成 Python，D = 20。輸出是什麼？","code":"D = 20\nB = [0, 0, 0, 0]\ni = 0\nwhile D > 0:\n    B[3-i] = D % 2\n    D = D // 2\n    i = i + 1\nprint(B)","options":["[1, 0, 1, 0, 0]","[0, 1, 0, 1]","IndexError","[0, 1, 0, 0]"],"answer":"B","why":"20 = 10100₂ 要 5 位元。第 5 次循環 i = 4，B[3-4] 即 B[-1]（最後一項），把 B[3] 由 0 改為 1。程式沒有終止，結果卻錯了。","_right":1},{"id":"c2-q3","pts":4,"src":"教科書 p.57 常見錯誤","verify":true,"q":"以下程式的輸出是什麼？","code":"import math\nx = -3.456\nprint(math.floor(x * 100) / 100, math.trunc(x * 100) / 100)","options":["-3.46 -3.45","-3.45 -3.45","-3.46 -3.46","-3.45 -3.46"],"answer":"A","why":"負數時，下捨（floor）向較小的方向得 −3.46；截尾直接刪去數位得 −3.45。所以下捨和截尾並不相同。","_right":0},{"id":"c2-q4","pts":4,"src":"教科書 p.61 測試站 2.1 第 1 題（參考 DSE 2019 2D Q1e）","q":"以下哪一項最能描述斷點如何協助找出程式錯誤？","options":["斷點會自動改正程式的語法錯誤。","程式在斷點暫停，讓我們檢視當刻變量的值，判斷錯誤在斷點之前還是之後。","斷點令程式跳過有錯誤的語句，繼續執行。","斷點會把所有變量的值輸出到 Shell。"],"answer":"B","why":"斷點只是令程式在指定行數暫停；之後可檢視變量或逐步執行。","_right":1},{"id":"c2-q5","pts":4,"src":"教科書 p.66 課題練習 3(c)(i)","q":"算法只可處理 D = 0 至 15。以 D = 3、D = 15、D = 20 測試，三組數據分別屬於什麼？","options":["正常、邊界、錯誤","正常、正常、錯誤","邊界、正常、錯誤","正常、錯誤、錯誤"],"answer":"A","why":"15 是有效範圍的分界值（邊際個案）；20 超出範圍，是錯誤數據。","_right":0}]},{"id":"more","kind":"endless","title":"無限練習","gens":["pyErr","pyCast","pyArith"],"intro":"隨機生成錯誤類型、數據類型轉換及運算題目，答案由程式計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]}, {"code":"選修C","title":"選修C 算法與程式編寫 自學平台","kicker":"HKDSE ICT · 選修 C","pin":"cict2026"});
