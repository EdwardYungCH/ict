ange(n):\n    cmd = input()\n    if cmd == \"PASTE\":\n        if len(clipboard) == 0:\n            print(\"剪貼簿是空的\")\n        else:\n            print(clipboard.pop())\n    elif cmd == \"CLEAR\":\n        clipboard = []\n    else:\n        word = cmd[5:]\n        if len(clipboard) == 5:\n            print(\"剪貼簿已滿\")\n        else:\n            clipboard.append(word)\nprint(len(clipboard))","tests":[{"inputs":"6\nCOPY friends\nCOPY banana\nPASTE\nCOPY wood\nCOPY forever\nPASTE"},{"inputs":"3\nPASTE\nCOPY hi\nPASTE"},{"inputs":"7\nCOPY a\nCOPY b\nCOPY c\nCOPY d\nCOPY e\nCOPY f\nPASTE"},{"inputs":"4\nCOPY x\nCOPY y\nCLEAR\nPASTE"},{"inputs":"2\nCOPY good morning\nPASTE"}],"hint":"`cmd[5:]` 取得 \"COPY \" 之後的文字（文字可能有空格）。先判斷 `cmd == \"PASTE\"`、`cmd == \"CLEAR\"`，其餘便是 COPY。推入前檢查 `len(clipboard) == 5`，彈出前檢查是否空。","_exp":[{"out":"6\nCOPY friends\nCOPY banana\nPASTE\nbanana\nCOPY wood\nCOPY forever\nPASTE\nforever\n2\n","err":null},{"out":"3\nPASTE\n剪貼簿是空的\nCOPY hi\nPASTE\nhi\n0\n","err":null},{"out":"7\nCOPY a\nCOPY b\nCOPY c\nCOPY d\nCOPY e\nCOPY f\n剪貼簿已滿\nPASTE\ne\n4\n","err":null},{"out":"4\nCOPY x\nCOPY y\nCLEAR\nPASTE\n剪貼簿是空的\n0\n","err":null},{"out":"2\nCOPY good morning\nPASTE\ngood morning\n0\n","err":null}],"_sample":"6\nCOPY friends\nCOPY banana\nPASTE\nbanana\nCOPY wood\nCOPY forever\nPASTE\nforever\n2\n"},{"id":"c5a-w2","pts":20,"title":"括號配對檢查","src":"堆疊應用（自擬）","q":"輸入一行算式，當中可能有 `( )`、`[ ]`、`{ }` 三種括號。用**堆疊**檢查括號是否正確配對：\n• 遇到左括號便推入；\n• 遇到右括號時，堆疊必須不是空的，而且彈出的左括號要和它同一種；\n• 讀完後堆疊必須是空的。\n正確輸出 `配對正確`，否則輸出 `配對錯誤`。","starter":"expr = input()\ns = []\nok = True\n# 在這裏完成\nif ok:\n    print(\"配對正確\")\nelse:\n    print(\"配對錯誤\")","ref":"expr = input()\ns = []\nok = True\npairs = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}\nfor ch in expr:\n    if ch in \"([{\":\n        s.append(ch)\n    elif ch in \")]}\":\n        if len(s) == 0:\n            ok = False\n        elif s.pop() != pairs[ch]:\n            ok = False\nif len(s) > 0:\n    ok = False\nif ok:\n    print(\"配對正確\")\nelse:\n    print(\"配對錯誤\")","rules":[{"must":"append","msg":"要用列表作堆疊（append 推入、pop 彈出）。"}],"tests":[{"inputs":"(a+b)*[c-d]"},{"inputs":"{[(x)]}"},{"inputs":"([)]"},{"inputs":"((a+b)"},{"inputs":"a+b)"},{"inputs":"x+y"}],"hint":"可以用字典 `{\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}` 找出右括號對應的左括號。記得三種錯誤：右括號時堆疊是空的、種類不同、最後堆疊不是空的。","_exp":[{"out":"(a+b)*[c-d]\n配對正確\n","err":null},{"out":"{[(x)]}\n配對正確\n","err":null},{"out":"([)]\n配對錯誤\n","err":null},{"out":"((a+b)\n配對錯誤\n","err":null},{"out":"a+b)\n配對錯誤\n","err":null},{"out":"x+y\n配對正確\n","err":null}],"_sample":"(a+b)*[c-d]\n配對正確\n"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.155–165、p.203–204","items":[{"id":"c5a-q1","pts":4,"src":"教科書 p.160 例題 5.1(d)（參考 DSE 2019 卷二D Q1）","tags":[{"t":"hot","why":"堆疊操作空運行：DSE 2017 卷二D Q3（瀏覽器上一頁／下一頁）、2019 卷二D Q1（膠箱堆疊）"}],"verify":true,"q":"以下程式的輸出是什麼？","code":"def reverse(A, B):\n    while len(A) > 0:\n        B.append(A.pop())\n\nS1 = [7, 3, 9, 4, 6]\nS2 = []\nreverse(S1, S2)\nS2.pop()\nS2.pop()\nreverse(S2, S1)\nprint(S1)","options":["[7, 3, 9]","[9, 4, 6]","[6, 4, 9]","[3, 9, 4]"],"answer":"B","why":"reverse 後 S2 由底至頂是 6、4、9、3、7；彈出 7 和 3（原本最底的兩個）；再 reverse 回 S1 得 [9, 4, 6]。","_right":1},{"id":"c5a-q2","pts":4,"src":"教科書 p.165 測試站 5.1(d)（參考 DSE 2017 卷二D Q3）","tags":[{"t":"hot","why":"堆疊操作空運行：DSE 2017 卷二D Q3（瀏覽器上一頁／下一頁）、2019 卷二D Q1（膠箱堆疊）"}],"q":"瀏覽器用堆疊 goBack、goForward 實現「上一頁」「下一頁」。如果堆疊 goForward **已滿**，用戶再按「上一頁」，最合理的處理是？","options":["直接把網址推入 goForward，令上溢錯誤出現","先移除 goForward **最底層**的項目，再執行 push(goForward, pop(goBack))","先彈出 goForward 頂端的項目，再執行 push(goForward, pop(goBack))","清空 goBack"],"answer":"B","why":"最底層是最舊的網址，最少機會再用到；頂端是剛剛離開的網址，不應丟掉。","_right":1},{"id":"c5a-q3","pts":4,"src":"自擬（DSE 題型）","tags":[{"t":"trap","why":"要逐步模擬推入／彈出，不能只看數字次序"}],"q":"把 1、2、3、4 **依次**推入一個空的堆疊，期間可以隨時彈出。以下哪一個彈出次序是**不可能**的？","options":["4 3 2 1","1 2 3 4","2 4 3 1","3 1 4 2"],"answer":"D","why":"要先彈出 3，1、2 必定已推入且 2 在 1 之上，所以下一個彈出的只能是 2 或 4，不可能是 1。","_right":3},{"id":"c5a-q4","pts":4,"src":"教科書 p.204 課題練習 1(d)(ii)","q":"剪貼簿以陣列 `clipboard` 及變量 `latest`（頂端項目的索引）實現堆疊。以下哪一項是用變量儲存頂端索引的**好處**？","options":["陣列可以無限大","彈出時只須移動指示標，無須清除陣列內容","可以直接存取堆疊底部的項目並刪除","不會發生上溢錯誤"],"answer":"B","why":"彈出只是 `latest = latest - 1`；之後推入新項目時便覆寫舊內容。","_right":1},{"id":"c5a-q5","pts":4,"src":"教科書 p.155 調用堆疊","verify":true,"q":"以下程式的輸出是什麼？","code":"def c():\n    print(\"C\", end=\" \")\n\ndef b():\n    print(\"B1\", end=\" \")\n    c()\n    print(\"B2\", end=\" \")\n\ndef a():\n    print(\"A1\", end=\" \")\n    b()\n    print(\"A2\", end=\" \")\n\na()","options":["A1 B1 C B2 A2","A1 A2 B1 B2 C","A1 B1 B2 C A2","C B2 B1 A2 A1"],"answer":"A","why":"子程式完成後，從調用堆疊彈出返回位置，回到調用它的下一句繼續：c 完成回到 b，b 完成回到 a。","_right":0}]},{"id":"more","kind":"endless","title":"無限練習","gens":["pyStack","pyList","pyFunc"],"intro":"隨機生成堆疊（推入／彈出）、列表及子程式的題目，答案由程式計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]}, {"code":"選修C","title":"選修C 算法與程式編寫 自學平台","kicker":"HKDSE ICT · 選修 C","pin":"cict2026"});
