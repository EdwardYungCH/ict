PY.unit({"id":"c7","title":"文字檔案處理","book":"教科書 選修C 第 7 章 p.274–303","key":"C-c7-hmac-582a47f92c","sections":[{"id":"s1","title":"開啟及讀取文字檔案","pages":"教科書 p.276–282","learn":[{"pts":["程式有大量輸入或輸出時，從**文字檔案**（TXT、CSV 等）讀取或寫入會較方便，不用每次執行都逐個輸入。（p.276）","`f = open(\"datafile.txt\", \"r\")`：兩個參數——檔案名稱（連副檔名）和**模式**。用完要 `f.close()`。（p.277）","`f.read()`：讀取**所有內容**，傳回**一個字串**。（p.278）","`f.readline()`：讀取**一行**（直至 `\\n`，`\\n` 也包括在內），傳回字串。（p.279–280）","`f.readlines()`：讀取所有內容，**每一行作為一個列表項目**，傳回列表；除最後一行外，每項都帶着 `\\n`。（p.279）","**串流**：開檔時有一個隱藏的**指示標**指向第一個字符；每讀一次便向後移。每行結尾有**換行**字符 `\\n`，檔案結尾有**檔尾** `EOF`。（p.280）","指示標到達檔尾後，`readline()` 傳回**空字串** `\"\"`。所以可以用 `while len(name) > 0:` 一直讀到檔尾。（p.281–282）"]},{"table":{"head":["模式","描述（p.277）"],"rows":[["`\"r\"`","讀取內容。檔案**不存在**便出現運行時錯誤（FileNotFoundError）。"],["`\"x\"`","創建檔案。檔案**已存在**便出現運行時錯誤。"],["`\"w\"`","開啟檔案並**覆寫**內容。檔案不存在便創建它。"],["`\"a\"`","開啟檔案並**追加**內容（寫在檔尾）。檔案不存在便創建它。"]]}},{"sim":{"code":"f = open(\"inputfile.txt\", \"r\")\ncontent = f.read()\nprint(content)\nprint(type(content))\nf.close()","files":{"inputfile.txt":"This is line one.\nThis is line two.\nThis is line three."},"open":["vars"],"_run":{"out":"This is line one.\nThis is line two.\nThis is line three.\n\u003cclass 'str'>\n","err":null,"vrepr":{"content":"'This is line one.\\nThis is line two.\\nThis is line three.'"},"files":{"inputfile.txt":"This is line one.\nThis is line two.\nThis is line three."}}},"cap":"實驗站 7.1 第 2 步（p.278）。把第 2 行改成 `f.readline()`、`f.readlines()` 再執行，比較三者的分別。"},{"sim":{"code":"f = open(\"testfile.txt\", \"r\")\nline1 = f.readline()\nline2 = f.readline()\nline3 = f.readline()\nline4 = f.readline()\nf.close()","files":{"testfile.txt":"This is line one.\nThis is line two.\nThis is line three."},"open":["vars","trace"],"step":true,"_run":{"out":"","err":null,"vrepr":{"line1":"'This is line one.\\n'","line2":"'This is line two.\\n'","line3":"'This is line three.'","line4":"''"},"files":{"testfile.txt":"This is line one.\nThis is line two.\nThis is line three."},"steps":[{"l":1,"v":{},"o":0},{"l":2,"v":{},"o":0},{"l":3,"v":{"line1":"'This is line one.\\n'"},"o":0},{"l":4,"v":{"line1":"'This is line one.\\n'","line2":"'This is line two.\\n'"},"o":0},{"l":5,"v":{"line1":"'This is line one.\\n'","line2":"'This is line two.\\n'","line3":"'This is line three.'"},"o":0},{"l":6,"v":{"line1":"'This is line one.\\n'","line2":"'This is line two.\\n'","line3":"'This is line three.'","line4":"''"},"o":0}],"cut":false}},"cap":"串流例子（p.280–281）：按「下一步」，看每次 readline() 讀到什麼；line3 沒有 `\\n`，line4 是空字串。"},{"code":"import os\nif os.path.exists(\"targetfile.txt\"):\n    print(\"The file exists.\")\nelse:\n    print(\"The file does not exist.\")","cap":"開檔前先檢查檔案是否存在（p.277）：`os.path.exists()` 傳回 True／False，可避免運行時錯誤。（請在 Thonny 試，本平台的模擬器沒有 os 函數庫。）"}],"tries":[{"id":"c7-s1-t1","pts":4,"src":"教科書 p.279 實驗站 7.1 第 3 步","code":"f = open(\"inputfile.txt\", \"r\")\ncontent = f.readline()\nprint(content)\nprint(type(content))\nf.close()","files":{"inputfile.txt":"This is line one.\nThis is line two.\nThis is line three."},"q":"先估：輸出是什麼？","options":["This is line one.\n\n\u003cclass 'str'>","This is line one.\n\u003cclass 'str'>","This is line one.\nThis is line two.\nThis is line three.\n\u003cclass 'str'>","This is line one.\n\n\u003cclass 'list'>"],"why":"readline() 只讀第一行，而且連 `\\n` 一起讀入；print() 再換一次行，所以中間多了一個空行。","_right":0,"_ans":"This is line one.\n\n\u003cclass 'str'>","_run":{"out":"This is line one.\n\n\u003cclass 'str'>\n","err":null,"vrepr":{"content":"'This is line one.\\n'"},"files":{"inputfile.txt":"This is line one.\nThis is line two.\nThis is line three."},"steps":[{"l":1,"v":{},"o":0},{"l":2,"v":{},"o":0},{"l":3,"v":{"content":"'This is line one.\\n'"},"o":0},{"l":4,"v":{"content":"'This is line one.\\n'"},"o":19},{"l":5,"v":{"content":"'This is line one.\\n'"},"o":33}],"cut":false}},{"id":"c7-s1-t2","pts":4,"src":"教科書 p.280–281 串流例子","code":"f = open(\"testfile.txt\", \"r\")\nline1 = f.readline()\nline2 = f.readline()\nline3 = f.readline()\nline4 = f.readline()\nf.close()\nn = len(line2) + len(line4)","files":{"testfile.txt":"This is line one.\nThis is line two.\nThis is line three."},"ask":{"var":"n"},"q":"先估：程式完結後 n 的值是什麼？（\"This is line two.\" 有 17 個字符）","options":["18","17","19","35"],"why":"line2 是 `\"This is line two.\\n\"`，共 18 個字符；line4 已到檔尾，是空字串，長度 0。","_right":0,"_ans":"18","_run":{"out":"","err":null,"vrepr":{"line1":"'This is line one.\\n'","line2":"'This is line two.\\n'","line3":"'This is line three.'","line4":"''","n":"18"},"files":{"testfile.txt":"This is line one.\nThis is line two.\nThis is line three."},"steps":[{"l":1,"v":{},"o":0},{"l":2,"v":{},"o":0},{"l":3,"v":{"line1":"'This is line one.\\n'"},"o":0},{"l":4,"v":{"line1":"'This is line one.\\n'","line2":"'This is line two.\\n'"},"o":0},{"l":5,"v":{"line1":"'This is line one.\\n'","line2":"'This is line two.\\n'","line3":"'This is line three.'"},"o":0},{"l":6,"v":{"line1":"'This is line one.\\n'","line2":"'This is line two.\\n'","line3":"'This is line three.'","line4":"''"},"o":0},{"l":7,"v":{"line1":"'This is line one.\\n'","line2":"'This is line two.\\n'","line3":"'This is line three.'","line4":"''"},"o":0}],"cut":false}}],"practice":[{"id":"c7-s1-p1","type":"mc","pts":2,"src":"教科書 p.279 實驗站 7.1 第 4 步","verify":true,"ask":{"var":"content"},"q":"執行後，列表 content 是什麼？","code":"f = open(\"inputfile.txt\", \"r\")\ncontent = f.readlines()\nf.close()","files":{"inputfile.txt":"This is line one.\nThis is line two.\nThis is line three."},"options":["['This is line one.\\n', 'This is line two.\\n', 'This is line three.']","['This is line one.', 'This is line two.', 'This is line three.']","['This is line one.\\n', 'This is line two.\\n', 'This is line three.\\n']","'This is line one.\\nThis is line two.\\nThis is line three.'"],"answer":0,"hint":"每行都連 `\\n` 讀入；最後一行後面沒有 `\\n`。","why":"readlines() 傳回列表；最後一行在檔尾 EOF 前結束，所以沒有 `\\n`。","_right":0},{"id":"c7-s1-p2","type":"complete","pts":3,"src":"教科書 p.282 例題 7.1（參考 DSE 2012 2D Q4a）","label":"補完程式","q":"`NewMember.txt` 每行一位新會員的名字。子程式 `newMemberList()` 把名字逐行讀入列表 member 並傳回。完成 while 循環的條件。會用不同檔案測試（包括空檔案）。","template":"def newMemberList():\n    member = []\n    f = open(\"NewMember.txt\", \"r\")\n    name = f.readline()\n    while ［1］:\n        member = member + [name]\n        name = f.readline()\n    f.close()\n    return member\n\nprint(newMemberList())","ref":["len(name) > 0"],"tests":[{"inputs":"","files":{"NewMember.txt":"Zoe\nWendy\nKing\nSally\nMark\nKeith"}},{"inputs":"","files":{"NewMember.txt":"Amy\n"}},{"inputs":"","files":{"NewMember.txt":""}}],"check":{"out":true},"hint":"指示標到達檔尾時，readline() 傳回空字串，長度是 0。","_exp":[{"out":"['Zoe\\n', 'Wendy\\n', 'King\\n', 'Sally\\n', 'Mark\\n', 'Keith']\n","err":null},{"out":"['Amy\\n']\n","err":null},{"out":"[]\n","err":null}]},{"id":"c7-s1-p3","type":"mc","pts":1,"src":"教科書 p.277","q":"用哪個模式開啟檔案時，若檔案**已存在**便會出現運行時錯誤？","options":["\"x\"","\"w\"","\"a\"","\"r\""],"answer":0,"hint":"x 用來「創建」新檔案。","_right":0}]},{"id":"s2","title":"字串處理：find、split、replace","pages":"教科書 p.283–287、p.299","learn":[{"pts":["`s.find(\"is\")`：找到便傳回目標字串**第一次出現的索引**，找不到傳回 `-1`。`s.find(\"is\", 3)` 由索引 3 開始找。（p.283）","`s.split()`：以空格分拆，傳回**列表**。`s.split(\"#\")` 以 `#` 作**定界符號**。（p.284）","`s.replace(\"two\", \"2\")`：傳回**新字串**；原本的 s **保持不變**。（p.284–285）","`s.replace(\"three\", \"3\", 1)`：只替換**指定次數**（這裏是第一個）。（p.285）","處理 CSV 檔案的步驟（測試站 7.1）：`readlines()` → `replace(\"\\n\", \"\")` 刪除換行字符 → `split(\",\")` 變成二維列表 → 數字欄用 `int()` 轉換。（p.286–287）"]},{"fix":{"bad":"the_string = \"one two two three three three\"\nthe_string.replace(\"two\", \"2\")\nprint(the_string)","good":"the_string = \"one two two three three three\"\nnew_string = the_string.replace(\"two\", \"2\")\nprint(new_string)","why":"常見錯誤（p.285）：replace() 不會改變原本的字串，要把傳回的新字串存起來。"}},{"sim":{"code":"f = open(\"fruits.csv\", \"r\")\nfruits = f.readlines()\nf.close()\nfor i in range(0, len(fruits)):\n    fruits[i] = fruits[i].replace(\"\\n\", \"\")\n    fruits[i] = fruits[i].split(\",\")\nfor i in range(0, len(fruits)):\n    for j in range(1, 3):\n        fruits[i][j] = int(fruits[i][j])\nprint(fruits)","files":{"fruits.csv":"apple,1,946\norange,2,457\ncherry,3,646\nbanana,4,356"},"open":["vars"],"_run":{"out":"[['apple', 1, 946], ['orange', 2, 457], ['cherry', 3, 646], ['banana', 4, 356]]\n","err":null,"vrepr":{"fruits":"[['apple', 1, 946], ['orange', 2, 457], ['cherry', 3, 646], ['banana', 4, 356]]","i":"3","j":"2"},"files":{"fruits.csv":"apple,1,946\norange,2,457\ncherry,3,646\nbanana,4,356"}}},"cap":"測試站 7.1（p.286–287）：CSV 檔案 → 二維列表。留意第 2、3 欄最後變成整數（沒有引號）。"}],"tries":[{"id":"c7-s2-t1","pts":4,"src":"仿教科書 p.283","code":"s = \"This is a string\"\nprint(s.find(\"is\", 3), s.find(\"IS\"), s.find(\"s\", 7))","q":"先估：輸出是什麼？","options":["5 -1 10","2 -1 10","5 2 10","5 -1 3"],"why":"由索引 3 開始，下一個 \"is\" 在索引 5；大小寫不同所以找不到 \"IS\"；由索引 7 開始，第一個 \"s\" 是 \"string\" 的 s（索引 10）。","_right":0,"_ans":"5 -1 10","_run":{"out":"5 -1 10\n","err":null,"vrepr":{"s":"'This is a string'"},"files":{},"steps":[{"l":1,"v":{},"o":0},{"l":2,"v":{"s":"'This is a string'"},"o":0}],"cut":false}}],"practice":[{"id":"c7-s2-p1","type":"fill","pts":2,"src":"教科書 p.299 課題練習 2(a)、(c)(ii)","q":"`weather forecast.txt` 儲存了五天天氣預報。執行後，以下各項的值是什麼？","code":"file = open(\"weather forecast.txt\", \"r\")\nx = file.readlines()\nfile.close()\nfor i in range(0, len(x)):\n    x[i] = x[i].replace(\"\\n\", \"\")\na = x[1]\nb = x[3].split(\"#\")[1]\nc = x[2].split(\"#\")[0].split(\"/\")[1]","files":{"weather forecast.txt":"10/06#Rainy\n11/06#Cloudy\n12/06#Sunny\n13/06#Sunny\n14/06#Cloudy"},"blanks":[{"label":"a","ask":{"var":"a"}},{"label":"b","ask":{"var":"b"}},{"label":"c","ask":{"var":"c"}}],"hint":"索引由 0 開始；split(\"#\") 之後 [0] 是日期、[1] 是天氣；日期再用 \"/\" 分拆。","_ans":["11/06#Cloudy","Sunny","06"]},{"id":"c7-s2-p2","type":"complete","pts":2,"src":"教科書 p.287 測試站 7.1 (b)–(d)","label":"補完程式","q":"把 `fruits.csv` 變成二維列表，第 2、3 欄轉為整數。會用不同檔案測試。","template":"f = open(\"fruits.csv\", \"r\")\nfruits = f.readlines()\nf.close()\nfor i in range(0, len(fruits)):\n    fruits[i] = fruits[i].replace(［1］, \"\")\n    fruits[i] = ［2］\nfor i in range(0, len(fruits)):\n    for j in range(1, 3):\n        fruits[i][j] = ［3］\nprint(fruits)","ref":["\"\\n\"","fruits[i].split(\",\")","int(fruits[i][j])"],"tests":[{"inputs":"","files":{"fruits.csv":"apple,1,946\norange,2,457\ncherry,3,646\nbanana,4,356"}},{"inputs":"","files":{"fruits.csv":"kiwi,7,12\n"}},{"inputs":"","files":{"fruits.csv":"pear,5,80\nlime,6,9"}}],"check":{"out":true},"hint":"先刪除換行字符，再以逗號分拆；轉換整數用 int()。","_exp":[{"out":"[['apple', 1, 946], ['orange', 2, 457], ['cherry', 3, 646], ['banana', 4, 356]]\n","err":null},{"out":"[['kiwi', 7, 12]]\n","err":null},{"out":"[['pear', 5, 80], ['lime', 6, 9]]\n","err":null}]},{"id":"c7-s2-p3","type":"mc","pts":2,"src":"教科書 p.285","verify":true,"q":"以下程式的輸出是什麼？","code":"the_string = \"one two two three three three\"\nnew_string = the_string.replace(\"three\", \"3\", 1)\nthe_string.replace(\"two\", \"2\")\nprint(new_string)","options":["one 2 2 3 three three","one two two 3 3 3","one 2 2 3 3 3","one two two 3 three three"],"answer":3,"hint":"第 3 行的結果沒有存起來；第 2 行只替換一次。","why":"replace() 不改變原字串；指定次數 1 只換第一個 three。","_right":3}]},{"id":"s3","title":"將內容寫入文字檔案","pages":"教科書 p.288–291、p.298","learn":[{"pts":["`f.write(\"…\")`：把字串寫入文字檔案。（p.288–289）","模式 `\"w\"`：新內容**覆寫**舊內容；模式 `\"a\"`：新內容**追加**在檔尾。（p.289）","write() **不會自動換行**：用 `\"a\"` 追加後，新內容會緊貼在舊內容後面。要在新一行追加，便在新內容前加 `\\n`，例如 `f.write(\"\\nThis is additional content.\")`。（p.289 試想想）","用 `\"r\"` 模式開啟的檔案是**唯讀**的，不能 write()，否則出現運行時錯誤。（p.298 課題練習 1）","write() 只接受字串：數字要先用 `str()` 轉換。","例子：測試站 7.2 把訊息**加密**（每個字母換成往後數第 X 個字母）後才寫入檔案，令文字檔較安全。（p.289–291）"]},{"sim":{"code":"f = open(\"outputfile.txt\", \"w\")\nf.write(\"This is new content.\")\nf.close()\nf = open(\"outputfile.txt\", \"a\")\nf.write(\"This is additional content.\")\nf.close()\nf = open(\"outputfile.txt\", \"r\")\nprint(f.read())\nf.close()","files":{"outputfile.txt":"The original content."},"open":["vars"],"_run":{"out":"This is new content.This is additional content.\n","err":null,"vrepr":{},"files":{"outputfile.txt":"This is new content.This is additional content."}}},"cap":"實驗站 7.2（p.288–289）。試在第 5 行的字串前加上 `\\n`，看看結果有何不同。"},{"sim":{"code":"def encode(original_message, X):\n    encoded_message = \"\"\n    for i in range(0, len(original_message)):\n        encoded_char = ord(original_message[i])\n        if original_message[i] != \" \":\n            encoded_char = encoded_char + X\n            if encoded_char > 90:\n                encoded_char = encoded_char - 26\n        encoded_message = encoded_message + chr(encoded_char)\n    return encoded_message\n\nmessage = input()\nf = open(\"encoded_file.txt\", \"w\")\nf.write(encode(message, 3))\nf.close()\nf = open(\"encoded_file.txt\", \"r\")\nprint(f.read())\nf.close()","inputs":"IT IS A NICE DAY","files":{},"open":["vars"],"_run":{"out":"IT IS A NICE DAY\nLW LV D QLFH GDB\n","err":null,"vrepr":{"message":"'IT IS A NICE DAY'"},"files":{"encoded_file.txt":"LW LV D QLFH GDB"}}},"cap":"測試站 7.2 (b)、(c)、(e)（p.290–291）：加密後寫入檔案，再讀出來檢查。"}],"tries":[{"id":"c7-s3-t1","pts":4,"src":"教科書 p.298 課題練習 1(b)","code":"myFile = open(\"text.txt\", \"a\")\nmyFile.write(\":D What a sunny day!\")\nmyFile.close()","files":{"text.txt":"Tomorrow is Tuesday."},"ask":{"file":"text.txt"},"q":"先估：執行後 `text.txt` 的內容是什麼？","options":["Tomorrow is Tuesday.:D What a sunny day!","Tomorrow is Tuesday.\n:D What a sunny day!",":D What a sunny day!","Tomorrow is Tuesday. :D What a sunny day!"],"why":"\"a\" 模式把新內容追加在檔尾；write() 不會自動換行，也不會加空格。","_right":0,"_ans":"Tomorrow is Tuesday.:D What a sunny day!","_run":{"out":"","err":null,"vrepr":{},"files":{"text.txt":"Tomorrow is Tuesday.:D What a sunny day!"},"steps":[{"l":1,"v":{},"o":0},{"l":2,"v":{},"o":0},{"l":3,"v":{},"o":0}],"cut":false}}],"practice":[{"id":"c7-s3-p1","type":"mc","pts":1,"src":"教科書 p.298 課題練習 1(a)","q":"智華想用以下程式把 `text.txt` 的內容換成「Tomorrow is Tuesday.」，但出現錯誤。應怎樣修改？","code":"myFile = open(\"text.txt\", \"r\")\nmyFile.write(\"Tomorrow is Tuesday.\")\nmyFile.close()","options":["第 1 行改為 myFile = open(\"text.txt\", \"w\")","第 1 行改為 myFile = open(\"text.txt\", \"x\")","第 2 行改為 myFile.read(\"Tomorrow is Tuesday.\")","刪除第 3 行"],"answer":0,"hint":"\"r\" 模式是唯讀的；要取代舊內容用哪個模式？","why":"\"w\" 覆寫舊內容。\"x\" 在檔案已存在時會出錯。","_right":0},{"id":"c7-s3-p2","type":"complete","pts":3,"src":"教科書 p.290 測試站 7.2 (b)、(c)","label":"補完程式","q":"完成子程式 encode()（字母換成往後數第 3 個，空格不變，超過 Z 便回到 A）及主程式（把加密訊息寫入 `encoded_file.txt`）。會用多組數據測試。","template":"def encode(original_message):\n    encoded_message = \"\"\n    for i in range(0, len(original_message)):\n        encoded_char = ord(original_message[i])\n        if original_message[i] != ［1］:\n            encoded_char = ［2］\n            if encoded_char > 90:\n                encoded_char = ［3］\n        encoded_message = encoded_message + chr(encoded_char)\n    return encoded_message\n\nmessage = input()\nf = open(\"encoded_file.txt\", ［4］)\nf.write(encode(message))\nf.close()","ref":["\" \"","encoded_char + 3","encoded_char - 26","\"w\""],"tests":[{"inputs":"IT IS A NICE DAY","files":{}},{"inputs":"XYZ ABC","files":{"encoded_file.txt":"OLD"}},{"inputs":"HELLO WORLD","files":{}}],"check":{"file":"encoded_file.txt"},"hint":"ASCII：A 是 65、Z 是 90。超過 90 便減 26 回到開頭。要覆寫舊檔案。","_exp":[{"out":"IT IS A NICE DAY\n","err":null,"files":{"encoded_file.txt":"LW LV D QLFH GDB"}},{"out":"XYZ ABC\n","err":null,"files":{"encoded_file.txt":"ABC DEF"}},{"out":"HELLO WORLD\n","err":null,"files":{"encoded_file.txt":"KHOOR ZRUOG"}}]},{"id":"c7-s3-p3","type":"fill","pts":2,"src":"教科書 p.290–291 測試站 7.2 (a)、(d)","q":"寫出以下程式的輸出（加密後的訊息）。","code":"def encode(original_message, X):\n    encoded_message = \"\"\n    for i in range(0, len(original_message)):\n        encoded_char = ord(original_message[i])\n        if original_message[i] != \" \":\n            encoded_char = encoded_char + X\n            if encoded_char > 90:\n                encoded_char = encoded_char - 26\n        encoded_message = encoded_message + chr(encoded_char)\n    return encoded_message\n\nprint(encode(\"IT IS A NICE DAY\", 5))","blanks":[{"label":"輸出","ask":"out"}],"hint":"X 是 5：I → N、T → Y；Y → D（超過 Z 回到 A）。","_ans":["NY NX F SNHJ IFD"]}]},{"id":"s4","title":"更新文字檔案內的記錄","pages":"教科書 p.292–295、p.302–303","learn":[{"pts":["文字檔案就像簡單的**數據庫**：每一行是一項**記錄**，每一欄是一個**欄位**；欄位用定界符號（例如 `;`）分隔。程式結束後數據仍然保存。（p.292）","**載入記錄**：`readlines()` → 刪除 `\\n` → `split(\";\")`，存成二維列表 `record`。（p.293）","**檢索記錄**：線性檢索第 0 欄，找到傳回列數 i，找不到傳回 `-1`。（p.294）","**刪除記錄**：把該列所有欄位換成 `\"---\"`。這只改了**列表**，檔案還未改變！（p.294）","**更新文字檔案**：用 `\"w\"` 把整個二維列表重新寫入檔案；除最後一行外，每行後面寫 `\\n`。（p.295）","**新增記錄**：用 `\"a\"` 在檔尾寫 `\"\\n\" + 新記錄`。之後要再 `load_record()`，列表才有新記錄。（p.295）"]},{"sim":{"code":"def load_record():\n    f = open(\"phonebook.txt\", \"r\")\n    global record\n    record = f.readlines()\n    for i in range(0, len(record)):\n        record[i] = record[i].replace(\"\\n\", \"\")\n        record[i] = record[i].split(\";\")\n    f.close()\n\ndef search_recordByFirstname(firstname):\n    for i in range(0, len(record)):\n        if record[i][0] == firstname:\n            return i\n    return -1\n\ndef delete_recordByFirstname(firstname):\n    global record\n    row = search_recordByFirstname(firstname)\n    if row != -1:\n        for j in range(0, 4):\n            record[row][j] = \"---\"\n\ndef update_file():\n    f = open(\"phonebook.txt\", \"w\")\n    for i in range(0, len(record)):\n        f.write(record[i][0]+\";\"+record[i][1]+\";\"+record[i][2]+\";\"+record[i][3])\n        if i \u003c len(record)-1:\n            f.write(\"\\n\")\n    f.close()\n\ndef add_record(firstname, lastname, noType, number):\n    f = open(\"phonebook.txt\", \"a\")\n    f.write(\"\\n\"+firstname+\";\"+lastname+\";\"+noType+\";\"+number)\n    f.close()\n\nload_record()\nprint(search_recordByFirstname(\"Gary\"))\ndelete_recordByFirstname(\"Gary\")\nupdate_file()\nadd_record(\"Jay\", \"Chow\", \"Home\", \"26573012\")\nf = open(\"phonebook.txt\", \"r\")\nprint(f.read())\nf.close()","files":{"phonebook.txt":"Rose;Wong;Mobile;95784224\nDaniel;Chan;Mobile;90094786\nGary;Lee;Home;23546030\nSally;Ho;Mobile;68753694"},"open":["vars"],"_run":{"out":"2\nRose;Wong;Mobile;95784224\nDaniel;Chan;Mobile;90094786\n---;---;---;---\nSally;Ho;Mobile;68753694\nJay;Chow;Home;26573012\n","err":null,"vrepr":{"record":"[['Rose', 'Wong', 'Mobile', '95784224'], ['Daniel', 'Chan', 'Mobile', '90094786'], ['---', '---', '---', '---'], ['Sally', 'Ho', 'Mobile', '68753694']]"},"files":{"phonebook.txt":"Rose;Wong;Mobile;95784224\nDaniel;Chan;Mobile;90094786\n---;---;---;---\nSally;Ho;Mobile;68753694\nJay;Chow;Home;26573012"}}},"cap":"聯絡人管理程式（p.293–295）：載入 → 檢索 → 刪除 → 更新檔案 → 新增記錄。"},{"warn":"教科書 p.295 寫 `f.close`（沒有括號）——這樣**不會**調用 close()，檔案沒有被關閉。一定要寫 `f.close()`。"}],"tries":[{"id":"c7-s4-t1","pts":4,"src":"教科書 p.294 試想想","code":"def load_record():\n    f = open(\"phonebook.txt\", \"r\")\n    global record\n    record = f.readlines()\n    for i in range(0, len(record)):\n        record[i] = record[i].replace(\"\\n\", \"\")\n        record[i] = record[i].split(\";\")\n    f.close()\n\ndef search_recordByFirstname(firstname):\n    for i in range(0, len(record)):\n        if record[i][0] == firstname:\n            return i\n    return -1\n\nload_record()\nprint(search_recordByFirstname(\"Gary\"), search_recordByFirstname(\"gary\"))","files":{"phonebook.txt":"Rose;Wong;Mobile;95784224\nDaniel;Chan;Mobile;90094786\nGary;Lee;Home;23546030\nSally;Ho;Mobile;68753694"},"q":"先估：輸出是什麼？","options":["2 -1","3 -1","2 2","3 3"],"why":"Gary 在第 3 行，即列索引 2。字串比較分大小寫，\"gary\" 找不到，傳回 -1。","_right":0,"_ans":"2 -1","_run":{"out":"2 -1\n","err":null,"vrepr":{"record":"[['Rose', 'Wong', 'Mobile', '95784224'], ['Daniel', 'Chan', 'Mobile', '90094786'], ['Gary', 'Lee', 'Home', '23546030'], ['Sally', 'Ho', 'Mobile', '68753694']]"},"files":{"phonebook.txt":"Rose;Wong;Mobile;95784224\nDaniel;Chan;Mobile;90094786\nGary;Lee;Home;23546030\nSally;Ho;Mobile;6875 rstname(firstname):\n    global record\n    row = search_recordByFirstname(firstname)\n    if row != -1:\n        for j in range(0, 4):\n            record[row][j] = \"---\"\n\ndef update_file():\n    f = open(\"phonebook.txt\", \"w\")\n    for i in range(0, len(record)):\n        f.write(record[i][0]+\";\"+record[i][1]+\";\"+record[i][2]+\";\"+record[i][3])\n        if i \u003c len(record)-1:\n            f.write(\"\\n\")\n    f.close()\n\nload_record()\ndelete_recordByFirstname(\"Daniel\")\ndelete_recordByFirstname(\"Tom\")\nupdate_file()","files":{"phonebook.txt":"Rose;Wong;Mobile;95784224\nDaniel;Chan;Mobile;90094786\nGary;Lee;Home;23546030\nSally;Ho;Mobile;68753694"},"options":["Rose;Wong;Mobile;95784224\n---;---;---;---\nGary;Lee;Home;23546030\nSally;Ho;Mobile;68753694\n---;---;---;---","Rose;Wong;Mobile;95784224\nDaniel;Chan;Mobile;90094786\nGary;Lee;Home;23546030\nSally;Ho;Mobile;68753694","Rose;Wong;Mobile;95784224\n---;---;---;---\nGary;Lee;Home;23546030\nSally;Ho;Mobile;68753694","Rose;Wong;Mobile;95784224\nGary;Lee;Home;23546030\nSally;Ho;Mobile;68753694"],"answer":2,"hint":"刪除只是把欄位換成 \"---\"，記錄的數目不變；找不到 Tom 便什麼也不做。","why":"update_file() 把整個列表寫回檔案，Daniel 那列變成 ---。","_right":2},{"id":"c7-s4-p2","type":"complete","pts":3,"src":"教科書 p.302 課題練習 4(a)","label":"補完程式","q":"子程式 writeInfo() 把二維列表 student 寫入 `info.txt`：每行一位學生，欄位以逗號分隔，最後一行後面不換行。","template":"student = [[\"Emily\", \"2\", \"A\", \"2\", \"S10289@abc.edu.hk\"],\n           [\"Kay\", \"2\", \"B\", \"13\", \"S10251@abc.edu.hk\"],\n           [\"Henry\", \"3\", \"B\", \"5\", \"S10201@abc.edu.hk\"],\n           [\"Nina\", \"4\", \"D\", \"25\", \"S10133@abc.edu.hk\"]]\n\ndef writeInfo():\n    f = open(\"info.txt\", \"w\")\n    for i in range(0, ［1］):\n        info = \"\"\n        for j in range(0, ［2］):\n            info = ［3］\n            if j \u003c 4:\n                info = ［4］\n        f.write(info)\n        if i \u003c len(student)-1:\n            f.write(\"\\n\")\n    f.close()\n\nwriteInfo()","ref":["len(student)","5","info + student[i][j]","info + \",\""],"tests":[{"inputs":"","files":{}}],"check":{"file":"info.txt"},"hint":"每位學生有 5 個欄位；最後一個欄位（j = 4）後面不加逗號。","_exp":[{"out":"","err":null,"files":{"info.txt":"Emily,2,A,2,S10289@abc.edu.hk\nKay,2,B,13,S10251@abc.edu.hk\nHenry,3,B,5,S10201@abc.edu.hk\nNina,4,D,25,S10133@abc.edu.hk"}}]},{"id":"c7-s4-p3","type":"fill","pts":2,"src":"教科書 p.302–303 課題練習 4(b)、(d)","q":"執行後，以下各項的值是什麼？","code":"student = [[\"Emily\", \"2\", \"A\", \"2\", \"S10289@abc.edu.hk\"],\n           [\"Kay\", \"2\", \"B\", \"13\", \"S10251@abc.edu.hk\"],\n           [\"Henry\", \"3\", \"B\", \"5\", \"S10201@abc.edu.hk\"],\n           [\"Nina\", \"4\", \"D\", \"25\", \"S10133@abc.edu.hk\"]]\n\ndef getID(r):\n    email = student[r][4].split(\"@\")\n    username = email[0]\n    return username\n\ndef proceed():\n    for i in range(0, len(student)):\n        student[i][1] = int(student[i][1]) + 1\n\na = getID(2)\nproceed()\nb = student[3][1]\nc = student[1][1] * 2","blanks":[{"label":"a","ask":{"var":"a"}},{"label":"b","ask":{"var":"b"}},{"label":"c","ask":{"var":"c"}}],"hint":"split(\"@\") 後 [0] 是 @ 前面的部分；proceed() 之後年級已變成整數（Kay 由 \"2\" 變成 3）。","_ans":["S10201","5","6"]}]},{"id":"write","kind":"write","title":"寫程式","pages":"教科書 p.294–301","intro":"在編輯器寫 Python，可以先按「▶ 執行」自己測試，再按「提交評核」。評核會用不同內容的檔案測試。","tasks":[{"id":"c7-w1","tier":"必做","title":"文章統計","pts":12,"src":"教科書 p.300 課題練習 3(a)–(d)","q":"`essay.txt` 是一篇短文（最後一行後面沒有換行字符，不會有連續空格）。程式已用 `read()` 及 `split(\"\\n\")` 把每行存入列表 line。依次輸出：\n1. 行數\n2. 字符數目（包括空格，不計換行字符）\n3. 單字數目（以空格分隔）","starter":"myEssay = open(\"essay.txt\", \"r\")\ncontent = myEssay.read()\nmyEssay.close()\nline = content.split(\"\\n\")\n","ref":"myEssay = open(\"essay.txt\", \"r\")\ncontent = myEssay.read()\nmyEssay.close()\nline = content.split(\"\\n\")\nchars = 0\nwords = 0\nfor i in range(0, len(line)):\n    chars = chars + len(line[i])\n    words = words + len(line[i].split(\" \"))\nprint(len(line))\nprint(chars)\nprint(words)","tests":[{"inputs":"","files":{"essay.txt":"I go to school by ...\nbus"}},{"inputs":"","files":{"essay.txt":"I have a pen I have a apple\nUh apple pen\nI have a pen I have pineapple\nUh pineapple pen"}},{"inputs":"","files":{"essay.txt":"Hello"}},{"inputs":"","files":{"essay.txt":"a b c\nd\ne f"}}],"check":{"out":true},"hint":"行數是 `len(line)`；每行的字符數是 `len(line[i])`；每行的單字數是 `len(line[i].split(\" \"))`。用一個 for 循環累加。","_exp":[{"out":"2\n24\n7\n","err":null},{"out":"4\n84\n21\n","err":null},{"out":"1\n5\n1\n","err":null},{"out":"3\n9\n6\n","err":null}],"_sample":"2\n24\n7\n"},{"id":"c7-w2","tier":"必做","title":"天氣篩選","pts":13,"src":"仿教科書 p.299 課題練習 2","q":"`weather.txt` 每行格式是 `日/月#天氣`，例如 `12/06#Sunny`（最後一行可能沒有換行字符）。\n輸入一種天氣 w（例如 `Sunny`）：\n• 把天氣是 w 的**日期**（例如 `12/06`）寫入 `result.txt`，每個日期一行（每行後面都加 `\\n`；原有內容要清除）；\n• 最後輸出有多少天。","starter":"w = input()\n","ref":"w = input()\nfin = open(\"weather.txt\", \"r\")\nx = fin.readlines()\nfin.close()\nfout = open(\"result.txt\", \"w\")\ncount = 0\nfor i in range(0, len(x)):\n    x[i] = x[i].replace(\"\\n\", \"\")\n    data = x[i].split(\"#\")\n    if data[1] == w:\n        fout.write(data[0] + \"\\n\")\n        count = count + 1\nfout.close()\nprint(count)","tests":[{"inputs":"Sunny","files":{"weather.txt":"10/06#Rainy\n11/06#Cloudy\n12/06#Sunny\n13/06#Sunny\n14/06#Cloudy","result.txt":"old\n"}},{"inputs":"Cloudy","files":{"weather.txt":"10/06#Rainy\n11/06#Cloudy\n12/06#Sunny\n13/06#Sunny\n14/06#Cloudy"}},{"inputs":"Rainy","files":{"weather.txt":"10/06#Rainy\n11/06#Cloudy\n12/06#Sunny\n13/06#Sunny\n14/06#Cloudy"}},{"inputs":"Snowy","files":{"weather.txt":"10/06#Rainy\n11/06#Cloudy\n12/06#Sunny\n13/06#Sunny\n14/06#Cloudy","result.txt":"x\n"}},{"inputs":"Hot","files":{"weather.txt":"01/07#Hot\n02/07#Hot\n"}}],"check":{"out":true,"file":"result.txt"},"rules":[{"must":"split(","msg":"要用 split() 分拆欄位。"}],"hint":"用 `replace(\"\\n\", \"\")` 刪除換行字符，再 `split(\"#\")`：[0] 是日期、[1] 是天氣。記得用 \"w\" 開啟 result.txt。","_exp":[{"out":"Sunny\n2\n","err":null,"files":{"result.txt":"12/06\n13/06\n"}},{"out":"Cloudy\n2\n","err":null,"files":{"result.txt":"11/06\n14/06\n"}},{"out":"Rainy\n1\n","err":null,"files":{"result.txt":"10/06\n"}},{"out":"Snowy\n0\n","err":null,"files":{"result.txt":""}},{"out":"Hot\n2\n","err":null,"files":{"result.txt":"01/07\n02/07\n"}}],"_sample":"Sunny\n2\n","_sampleFile":{"name":"result.txt","text":"12/06\n13/06\n"}},{"id":"c7-w3","tier":"挑戰","title":"刪除聯絡人記錄","pts":10,"src":"仿教科書 p.293–295","q":"`phonebook.txt` 每行是一項記錄：`名;姓;類型;電話`（最後一行後面沒有換行字符）。輸入一個名（first name）：\n• 如找到，把該記錄的 4 個欄位都換成 `---`，把**所有記錄**按原格式寫回檔案（以 `;` 分隔，最後一行後面不換行），然後輸出 `File updated`；\n• 如找不到，輸出 `Not found`，檔案不變。\n（名字分大小寫；名字不會重複。）","starter":"firstname = input()\n","ref":"firstname = input()\nf = open(\"phonebook.txt\", \"r\")\nrecord = f.readlines()\nf.close()\nfor i in range(0, len(record)):\n    record[i] = record[i].replace(\"\\n\", \"\")\n    record[i] = record[i].split(\";\")\nrow = -1\nfor i in range(0, len(record)):\n    if record[i][0] == firstname:\n        row = i\nif row == -1:\n    print(\"Not found\")\nelse:\n    for j in range(0, 4):\n        record[row][j] = \"---\"\n    f = open(\"phonebook.txt\", \"w\")\n    for i in range(0, len(record)):\n        f.write(record[i][0]+\";\"+record[i][1]+\";\"+record[i][2]+\";\"+record[i][3])\n        if i \u003c len(record)-1:\n            f.write(\"\\n\")\n    f.close()\n    print(\"File updated\")","tests":[{"inputs":"Gary","files":{"phonebook.txt":"Rose;Wong;Mobile;95784224\nDaniel;Chan;Mobile;90094786\nGary;Lee;Home;23546030\nSally;Ho;Mobile;68753694"}},{"inputs":"Rose","files":{"phonebook.txt":"Rose;Wong;Mobile;95784224\nDaniel;Chan;Mobile;90094786\nGary;Lee;Home;23546030\nSally;Ho;Mobile;68753694"}},{"inputs":"Sally","files":{"phonebook.txt":"Rose;Wong;Mobile;95784224\nDaniel;Chan;Mobile;90094786\nGary;Lee;Home;23546030\nSally;Ho;Mobile;68753694"}},{"inputs":"Tom","files":{"phonebook.txt":"Rose;Wong;Mobile;95784224\nDaniel;Chan;Mobile;90094786\nGary;Lee;Home;23546030\nSally;Ho;Mobile;68753694"}},{"inputs":"gary","files":{"phonebook.txt":"Rose;Wong;Mobile;95784224\nDaniel;Chan;Mobile;90094786\nGary;Lee;Home;23546030\nSally;Ho;Mobile;68753694"}}],"check":{"out":true,"file":"phonebook.txt"},"hint":"按 p.293–295 的步驟：載入成二維列表 → 線性檢索 → 換成 \"---\" → 用 \"w\" 寫回（最後一行不加 \\n）。第一個和最後一個記錄都要測試。","_exp":[{"out":"Gary\nFile updated\n","err":null,"files":{"phonebook.txt":"Rose;Wong;Mobile;95784224\nDaniel;Chan;Mobile;90094786\n---;---;---;---\nSally;Ho;Mobile;68753694"}},{"out":"Rose\nFile updated\n","err":null,"files":{"phonebook.txt":"---;---;---;---\nDaniel;Chan;Mobile;90094786\nGary;Lee;Home;23546030\nSally;Ho;Mobile;68753694"}},{"out":"Sally\nFile updated\n","err":null,"files":{"phonebook.txt":"Rose;Wong;Mobile;95784224\nDaniel;Chan;Mobile;90094786\nGary;Lee;Home;23546030\n---;---;---;---"}},{"out":"Tom\nNot found\n","err":null,"files":{"phonebook.txt":"Rose;Wong;Mobile;95784224\nDaniel;Chan;Mobile;90094786\nGary;Lee;Home;23546030\nSally;Ho;Mobile;68753694"}},{"out":"gary\nNot found\n","err":null,"files":{"phonebook.txt":"Rose;Wong;Mobile;95784224\nDaniel;Chan;Mobile;90094786\nGary;Lee;Home;23546030\nSally;Ho;Mobile;68753694"}}],"_sample":"Gary\nFile updated\n","_sampleFile":{"name":"phonebook.txt","text":"Rose;Wong;Mobile;95784224\nDaniel;Chan;Mobile;90094786\n---;---;---;---\nSally;Ho;Mobile;68753694"}}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.277、p.285、p.291、p.298–301","items":[{"id":"c7-q1","pts":4,"src":"教科書 p.298 課題練習 1(c)","verify":true,"ask":{"expr":"len(message)"},"q":"`text.txt` 的內容是 `Tomorrow is Tuesday.:D What a sunny day!`。執行以下程式後，列表 message 有多少個項目？","code":"myFile = open(\"text.txt\", \"r\")\nmessage = myFile.readlines()\nmyFile.close()","files":{"text.txt":"Tomorrow is Tuesday.:D What a sunny day!"},"options":["40","1","2","8"],"answer":"B","why":"檔案只有一行（中間沒有換行字符），所以列表只有 1 個項目。","_right":1},{"id":"c7-q2","pts":4,"src":"教科書 p.301 課題練習 3(f)","tags":[{"t":"hot","why":"卷二 D 部（2D）常考：讀取文字檔案，用 split() 分拆欄位，再統計、檢索或寫回檔案（例：DSE 2012 2D Q4a）。"}],"verify":true,"q":"`essay.txt` 共 4 行（見下）。以下程式的輸出是什麼？\n```\nI have a pen I have a apple\nUh apple pen\nI have a pen I have pineapple\nUh pineapple pen\n```","code":"def lineCount():\n    return len(line)\n\ndef search(text):\n    k = 0\n    for i in range(0, len(line)):\n        word = line[i].split(\" \")\n        for j in range(0, len(word)):\n            if text == word[j]:\n                k = k + 1\n    return k\n\nmyEssay = open(\"essay.txt\", \"r\")\ncontent = myEssay.read()\nline = content.split(\"\\n\")\nprint(lineCount())\nprint(search(\"pen\"))\nprint(search(\"apple\"))","files":{"essay.txt":"I have a pen I have a apple\nUh apple pen\nI have a pen I have pineapple\nUh pineapple pen"},"options":["4\n4\n2","4\n4\n4","4\n2\n2","3\n4\n2"],"answer":"A","why":"\"pen\" 每行一次，共 4 次；\"apple\" 只計整個單字，\"pineapple\" 不算，共 2 次。","_right":0},{"id":"c7-q3","pts":4,"src":"教科書 p.285 常見錯誤","tags":[{"t":"trap","why":"replace() 傳回新字串，原字串不變。"}],"verify":true,"q":"以下程式的輸出是什麼？","code":"s = \"10/06#Rainy\"\ns.replace(\"Rainy\", \"Sunny\")\nt = s.split(\"#\")\nprint(t[1], s.find(\"#\"))","options":["Sunny 6","Rainy 5","Sunny 5","Rainy 6"],"answer":"B","why":"第 2 行的結果沒有存起來，s 不變；\"#\" 在索引 5。","_right":1},{"id":"c7-q4","pts":4,"src":"教科書 p.277、p.289","q":"以下哪項關於 Python 檔案模式的描述是**正確**的？","options":["用 \"a\" 開啟不存在的檔案，會創建該檔案。","用 \"x\" 開啟已存在的檔案，會覆寫原有內容。","用 \"r\" 開啟不存在的檔案，會自動創建該檔案。","用 \"w\" 開啟已存在的檔案，新內容會追加在檔尾。"],"answer":"A","why":"\"r\"：不存在便出錯；\"w\"：覆寫；\"x\"：已存在便出錯。","_right":0},{"id":"c7-q5","pts":4,"src":"教科書 p.291 測試站 7.2 (f)（挑戰題）","tags":[{"t":"hot","why":"卷二 D 部（2D）常考：讀取文字檔案，用 split() 分拆欄位，再統計、檢索或寫回檔案（例：DSE 2012 2D Q4a）。"}],"q":"`encoded_file.txt` 儲存了用 encode(訊息, X) 加密的訊息（字母往後數第 X 個，超過 Z 便減 26）。解密程式只可以再調用同一個 encode()。第 13 行應怎樣寫？\n```\n11  X = int(input())\n12  f = open(\"encoded_file.txt\", \"r\")\n13  print(＿＿＿＿)\n14  f.close()\n```","options":["encode(f.read(), X)","encode(f.read(), -X)","encode(f.read(), 26 - X)","encode(f.readline(), 26)"],"answer":"C","why":"再往後數 26 − X 個字母，合共轉了 26 個，字母便回到原位。用 -X 會令字母的 ASCII 小於 65，encode() 不會處理，得到符號。","_right":2}]},{"id":"more","kind":"endless","title":"無限練習","gens":["pyStr","pyList","pyAscii","pyErr"],"intro":"隨機生成字串、列表、ASCII 及錯誤類型題目（處理檔案記錄、加密時常用），答案由 Python 計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]}, {"code":"選修C","title":"選修C 算法與程式編寫 自學平台","kicker":"HKDSE ICT · 選修 C","pin":"cict2026"});
