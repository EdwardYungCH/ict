 in mark:\n    i = 0\n    while i \u003c len(mark) and mark[i] != target:\n        i = i + 1\n    total = total + (i + 1)\navg = total / len(mark)","blanks":[{"label":"avg（N = 10）","ask":{"var":"avg"}},{"label":"N = 500 的平均次數","a":"250.5"}],"hint":"(1 + 2 + … + 10) / 10 = 5.5。教科書例題 6.1(b) 答 250，是用 N / 2 近似；準確是 (500 + 1) / 2。","_ans":["5.5","250.5"]}]},{"id":"s2","title":"改良線性檢索","pages":"教科書 p.214","learn":[{"pts":["測試站 6.1：`found = -1` 表示未找到；找到時 `found = i`。在 while 加上 `found == -1`，找到便停止。（p.214，參考 DSE 2018 卷二D Q3(d)）","只把列表排序，檢索方法不變的話，效率**沒有改善**（平均仍約 n / 2 次）。","列表**由小至大**排序時，可再加條件 `staff_no >= retire[i]`：遇到比目標大的項目，餘下的項目一定更大，可以立即停止。","列表**由大至小**排序時，條件改為 `staff_no \u003c= retire[i]`。（試想想）"]},{"sim":{"code":"retire = [4497, 5557, 5568, 5790, 7924]\nstaff_no = int(input())\nfound = -1\ni = 0\nwhile i \u003c len(retire) and found == -1 and staff_no >= retire[i]:\n    if staff_no == retire[i]:\n        found = i\n    i = i + 1\nprint(found)","inputs":"5000","step":true,"open":["vars"],"_run":{"out":"5000\n-1\n","err":null,"vrepr":{"retire":"[4497, 5557, 5568, 5790, 7924]","staff_no":"5000","found":"-1","i":"1"},"files":{},"steps":[{"l":1,"v":{},"o":0},{"l":2,"v":{"retire":"[4497, 5557, 5568, 5790, 7924]"},"o":0},{"l":3,"v":{"retire":"[4497, 5557, 5568, 5790, 7924]","staff_no":"5000"},"o":5},{"l":4,"v":{"retire":"[4497, 5557, 5568, 5790, 7924]","staff_no":"5000","found":"-1"},"o":5},{"l":5,"v":{"retire":"[4497, 5557, 5568, 5790, 7924]","staff_no":"5000","found":"-1","i":"0"},"o":5},{"l":6,"v":{"retire":"[4497, 5557, 5568, 5790, 7924]","staff_no":"5000","found":"-1","i":"0"},"o":5},{"l":8,"v":{"retire":"[4497, 5557, 5568, 5790, 7924]","staff_no":"5000","found":"-1","i":"0"},"o":5},{"l":5,"v":{"retire":"[4497, 5557, 5568, 5790, 7924]","staff_no":"5000","found":"-1","i":"1"},"o":5},{"l":9,"v":{"retire":"[4497, 5557, 5568, 5790, 7924]","staff_no":"5000","found":"-1","i":"1"},"o":5}],"cut":false}},"cap":"已由小至大排序的列表：輸入 5000，看循環怎樣在 5557 前停止。"}],"tries":[{"id":"c6a-s2-t1","pts": // 2\n        if age[mid] == target:\n            return mid\n        elif age[mid] > target:\n            start = mid + 1\n        else:\n            end = mid - 1\n    return -1\n\ndef rightMost(index):\n    right = index\n    while right \u003c len(age) - 1 and age[right + 1] == age[index]:\n        right = right + 1\n    return right\n\ndef leftMost(index):\n    left = index\n    while ［1］ and ［2］:\n        left = ［3］\n    return left\n\nindex = SearchByBinary(int(input()))\nif index == -1:\n    print(0)\nelse:\n    print(leftMost(index), rightMost(index) - leftMost(index) + 1)","ref":["left > 0","age[left - 1] == age[index]","left - 1"],"tests":[{"inputs":"38"},{"inputs":"29"},{"inputs":"50"},{"inputs":"19"}],"hint":"向左走：不可超出索引 0，而且左邊的值要和 age[index] 相同。","_exp":[{"out":"38\n3 3\n","err":null},{"out":"29\n6 2\n","err":null},{"out":"50\n0 1\n","err":null},{"out":"19\n9 1\n","err":null}]}]},{"id":"write","kind":"write","title":"寫程式","pages":"教科書 p.212、p.217、p.269","intro":"在編輯器寫 Python 程式，先按 ▶ 自己測試，再按「提交評核」。每個 `input()` 讀一行輸入。","tasks":[{"id":"c6a-w1","pts":15,"title":"線性檢索：找出所有位置","src":"教科書 p.212","q":"第一行輸入一串整數（以空格分隔），第二行輸入目標值 target。\n用**線性檢索**找出 target 在列表中的**所有**索引，每個一行輸出。如果找不到，輸出 `No result is found.`。\n最後一行輸出 `共 k 個`（k 是找到的數目）。","starter":"nums = [int(x) for x in input().split()]\ntarget = int(input())\n# 在這裏完成","ref":"nums = [int(x) for x in input().split()]\ntarget = int(input())\nk = 0\nfor i in range(0, len(nums)):\n    if target == nums[i]:\n        print(i)\n        k = k + 1\nif k == 0:\n    print(\"No result is found.\")\nprint(\"共\", k, \"個\")","rules":[{"must":"for","msg":"要用循環逐一比較（線性檢索）。"},{"mustNot":".index(","msg":"不可用 index()，要自己逐一比較。"},{"mustNot":".count(","msg":"不可用 count()，要自己計算。"}],"tests":[{"inputs":"79 50 85 64 97 88 80 75 50 65\n50"},{"inputs":"79 50 85 64 97 88 80 75 50 65\n100"},{"inputs":"7 7 7\n7"},{"inputs":"3 1 4 1 5 9\n9"},{"inputs":"42\n42"}],"hint":"用 for 循環檢查每一個索引，相同便輸出索引並計數。循環完結後才判斷 k 是否為 0。","_exp":[{"out":"79 50 85 64 97 88 80 75 50 65\n50\n1\n8\n共 2 個\n","err":null},{"out":"79 50 85 64 97 88 80 75 50 65\n100\nNo result is found.\n共 0 個\n","err":null},{"out":"7 7 7\n7\n0\n1\n2\n共 3 個\n","err":null},{"out":"3 1 4 1 5 9\n9\n5\n共 1 個\n","err":null},{"out":"42\n42\n0\n共 1 個\n","err":null}],"_sample":"79 50 85 64 97 88 80 75 50 65\n50\n1\n8\n共 2 個\n"},{"id":"c6a-w2","pts":20,"title":"對分檢索並計算比較次數","src":"教科書 p.217、p.269 課題練習 1","q":"第一行輸入一串**已由小至大排序**、沒有重複的整數（以空格分隔），第二行輸入目標值 target。\n用**對分檢索**（`mid = (start + end) // 2`）檢索 target：找到輸出 `Found at index 索引`，找不到輸出 `Not found`。\n第二行輸出 `比較次數: c`，c 是 `nums[mid]` 與 target 比較是否相同的次數。","starter":"nums = [int(x) for x in input().split()]\ntarget = int(input())\nstart = 0\nend = len(nums) - 1\nc = 0\n# 在這裏完成","ref":"nums = [int(x) for x in input().split()]\ntarget = int(input())\nstart = 0\nend = len(nums) - 1\nc = 0\nfound = -1\nwhile start \u003c= end and found == -1:\n    mid = (start + end) // 2\n    c = c + 1\n    if nums[mid] == target:\n        found = mid\n    elif target \u003c nums[mid]:\n        end = mid - 1\n    else:\n        start = mid + 1\nif found == -1:\n    print(\"Not found\")\nelse:\n    print(\"Found at index\", found)\nprint(\"比較次數:\", c)","rules":[{"must":"while","msg":"要用 while 循環實現對分檢索。"},{"must":"//","msg":"用 (start + end) // 2 計算中間索引。"},{"mustNot":".index(","msg":"不可用 index()。"}],"tests":[{"inputs":"50 51 64 65 75 79 80 85 88 97\n80"},{"inputs":"50 51 64 65 75 79 80 85 88 97\n75"},{"inputs":"50 51 64 65 75 79 80 85 88 97\n68"},{"inputs":"50 51 64 65 75 79 80 85 88 97\n100"},{"inputs":"5\n5"},{"inputs":"2 4 6 8 10 12 14 16\n1"}],"hint":"每次進入循環先計算 mid，c 加 1，再比較。找不到時循環在 start > end 時停止。","_exp":[{"out":"50 51 64 65 75 79 80 85 88 97\n80\nFound at index 6\n比較次數: 4\n","err":null},{"out":"50 51 64 65 75 79 80 85 88 97\n75\nFound at index 4\n比較次數: 1\n","err":null},{"out":"50 51 64 65 75 79 80 85 88 97\n68\nNot found\n比較次數: 4\n","err":null},{"out":"50 51 64 65 75 79 80 85 88 97\n100\nNot found\n比較次數: 4\n","err":null},{"out":"5\n5\nFound at index 0\n比較次數: 1\n","err":null},{"out":"2 4 6 8 10 12 14 16\n1\nNot found\n比較次數: 3\n","err":null}],"_sample":"50 51 64 65 75 79 80 85 88 97\n80\nFound at index 6\n比較次數: 4\n"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.213–227","items":[{"id":"c6a-q1","pts":4,"src":"教科書 p.226 測試站 6.2(b)（參考 DSE 2018 卷二D Q3(e)）","tags":[{"t":"hot","why":"線性／對分檢索：DSE 2018 卷二D Q3、2019 卷二D Q2"}],"q":"已排序的列表有 300 個關鍵字。用對分檢索檢索一個**不是**關鍵字的名稱，最多要比較字串多少次？","options":["8","9","150","300"],"answer":"B","why":"log₂300 ≈ 8.23；每次範圍減半，最多 9 次（⌊log₂300⌋ + 1）。","_right":1},{"id":"c6a-q2","pts":4,"src":"教科書 p.213 例題 6.1(a)（參考 DSE 2018 卷二D Q3(c)）","tags":[{"t":"hot","why":"線性／對分檢索：DSE 2018 卷二D Q3、2019 卷二D Q2"}],"verify":true,"ask":{"count":4},"q":"第 4 行的條件 `participant[i] != name` 被判斷了多少次？","code":"participant = [\"smartguy123\", \"happy555\", \"supersuperwoman\", \"funfunfun\", \"sakura_0101\"]\nname = \"funfunfun\"\ni = 0\nwhile i \u003c len(participant) and participant[i] != name:\n    i = i + 1\nregistered = i \u003c len(participant)","options":["3","4","5","1"],"answer":"B","why":"比較了索引 0、1、2、3；第 4 次相同，條件不成立，離開循環。","_right":1},{"id":"c6a-q3","pts":4,"src":"教科書 p.219 活動 6.1 第 5 題","q":"列表**由大至小**排序：位置 1–10 為 98、92、85、77、73、66、65、50、43、28。用對分檢索找 25（不存在），依次比較了哪些位置？","options":["5、8、9、10","5、2、1","5、8、6、7","10、9、8"],"answer":"A","why":"73 > 25 → 後半；位置 8（50）> 25 → 後半；位置 9（43）→ 後半；位置 10（28）→ 後半，範圍變空，比較 4 次。","_right":0},{"id":"c6a-q4","pts":4,"src":"教科書 p.215、p.227","q":"以下哪一項有關對分檢索的描述是**錯誤**的？","options":["只適用於已排序的列表","項目越多，它比線性檢索的優勢越大","它的最好情況是只比較 1 次","它可直接用於未排序的列表，只是速度較慢"],"answer":"D","why":"未排序的列表不能用對分檢索：捨棄一半範圍的判斷會錯誤，可能找不到存在的值。","_right":3},{"id":"c6a-q5","pts":4,"src":"教科書 p.215–217","verify":true,"q":"以下程式的輸出是什麼？","code":"mark = [50, 51, 64, 65, 75, 79, 80, 85, 88, 97]\ntarget = 97\nstart = 0\nend = len(mark) - 1\nwhile start \u003c= end:\n    mid = (start + end) // 2\n    print(mid, end=\" \")\n    if mark[mid] == target:\n        break\n    elif target \u003c mark[mid]:\n
