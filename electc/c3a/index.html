 i in range(0, 5):\n    line = input()\n    row = []\n    for ch in line:\n        row = row + [ch == \"T\"]\n    result = result + [row]\nwin = False\nfor i in range(［1］):\n    row = True\n    for j in range(0, 5):\n        if ［2］:\n            row = False\n    if row == True:\n        win = True\nprint(win)","ref":["0, 5","result[i][j] == False"],"tests":[{"inputs":"FFTFT\nTFTTF\nTTTTT\nFTTFF\nTFFFF"},{"inputs":"FFFFF\nFFFFF\nFFFFF\nFFFFF\nFFFFF"},{"inputs":"TTTTF\nTTTFT\nTTFTT\nTFTTT\nFTTTT"},{"inputs":"FFFFF\nFFFFF\nFFFFF\nFFFFF\nTTTTT"}],"hint":"列索引由 0 至 4；只要該列有一格是 False，這列便未連上。","_exp":[{"out":"FFTFT\nTFTTF\nTTTTT\nFTTFF\nTFFFF\nTrue\n","err":null},{"out":"FFFFF\nFFFFF\nFFFFF\nFFFFF\nFFFFF\nFalse\n","err":null},{"out":"TTTTF\nTTTFT\nTTFTT\nTFTTT\nFTTTT\nFalse\n","err":null},{"out":"FFFFF\nFFFFF\nFFFFF\nFFFFF\nTTTTT\nTrue\n","err":null}]},{"id":"c3a-s3-p2","type":"complete","pts":3,"src":"教科書 p.83 測試站 3.2 第 4(b)(i) 題","label":"補完程式","q":"俊賢用 while 循環檢查有沒有一**欄**完全連上，找到便提早停止。補完四個空格。會用多組數據測試。","template":"result = []\nfor i in range(0, 5):\n    line = input()\n    row = []\n    for ch in line:\n        row = row + [ch == \"T\"]\n    result = result + [row]\nwin = False\nj = 0\nwhile j \u003c= 4 and win == False:\n    win = ［1］\n    col = ［2］\n    i = 0\n    while i \u003c= 4 and col == True:\n        if result[i][j] == False:\n            col = ［3］\n            win = ［4］\n        i = i + 1\n    j = j + 1\nprint(win)","ref":["True","True","False","False"],"tests":[{"inputs":"FFTFT\nTFTTF\nTTTTT\nFTTFF\nTFFFF"},{"inputs":"FFTFF\nFFTFF\nFFTFF\nFFTFF\nFFTFF"},{"inputs":"TTTTT\nTTTTT\nTTTTT\nTTTTT\nTTTTF"},{"inputs":"FFFFT\nFFFFT\nFFFFT\nFFFFT\nFFFFT"}],"hint":"每欄開始時先假設「連上了」；遇到 False 便兩個旗標都改為 False。教科書答案：True、True、False、False。","_exp":[{"out":"FFTFT\nTFTTF\nTTTTT\nFTTFF\nTFFFF\nFalse\n","err":null},{"out":"FFTFF\nFFTFF\nFFTFF\nFFTFF\nFFTFF\nTrue\n","err":null},{"out":"TTTTT\nTTTTT\nTTTTT\nTTTTT\nTTTTF\nTrue\n","err":null},{"out":"FFFFT\nFFFFT\nFFFFT\nFFFFT\nFFFFT\nTrue 輸入 `50`，輸出 `不及格人數 = 5` 和 `最高分 = 97`。","starter":"form5_chi = [[65, 89, 61, 49, 62, 51, 88, 97, 85, 70],\n             [38, 68, 79, 90, 89, 95, 77, 61, 55, 63],\n             [76, 85, 96, 45, 62, 36, 79, 91, 87, 65],\n             [69, 88, 76, 55, 83, 71, 47, 68, 89, 94]]\np = int(input())\n","ref":"form5_chi = [[65, 89, 61, 49, 62, 51, 88, 97, 85, 70],\n             [38, 68, 79, 90, 89, 95, 77, 61, 55, 63],\n             [76, 85, 96, 45, 62, 36, 79, 91, 87, 65],\n             [69, 88, 76, 55, 83, 71, 47, 68, 89, 94]]\np = int(input())\nfail = 0\nhighest_mark = form5_chi[0][0]\nfor i in range(0, 4):\n    for j in range(0, 10):\n        if form5_chi[i][j] \u003c p:\n            fail = fail + 1\n        if form5_chi[i][j] > highest_mark:\n            highest_mark = form5_chi[i][j]\nprint(\"不及格人數 =\", fail)\nprint(\"最高分 =\", highest_mark)","tests":[{"inputs":"50"},{"inputs":"36"},{"inputs":"37"},{"inputs":"0"},{"inputs":"97"},{"inputs":"98"}],"rules":[{"mustNot":"max(","msg":"這題要用循環找最高分，不可用 max()"}],"hint":"`fail` 由 0 開始；最高分先設為 `form5_chi[0][0]`，再逐格比較（教科書答案的寫法）。`print(\"不及格人數 =\", fail)` 會在 = 後自動加空格。","_exp":[{"out":"50\n不及格人數 = 5\n最高分 = 97\n","err":null},{"out":"36\n不及格人數 = 0\n最高分 = 97\n","err":null},{"out":"37\n不及格人數 = 1\n最高分 = 97\n","err":null},{"out":"0\n不及格人數 = 0\n最高分 = 97\n","err":null},{"out":"97\n不及格人數 = 39\n最高分 = 97\n","err":null},{"out":"98\n不及格人數 = 40\n最高分 = 97\n","err":null}],"_sample":"50\n不及格人數 = 5\n最高分 = 97\n"},{"id":"c3a-w3","tier":"挑戰","pts":10,"title":"賓果：對角線","src":"教科書 p.83 測試站 3.2 第 4(c) 題","q":"首 7 行已把 5 行 T／F 輸入讀進 5 × 5 的二維列表 `result`（抽中為 True）。檢查兩條對角線（左上至右下、右上至左下）：任何一條完全連上，輸出 `True`，否則輸出 `False`。","starter":"result = []\nfor i in range(0, 5):\n    line = input()\n    row = []\n    for ch in line:\n        row = row + [ch == \"T\"]\n    result = result + [row]\n","ref":"result = []\nfor i in range(0, 5):\n    line = input()\n    row = []\n    for ch in line:\n        row = row + [ch == \"T\"]\n    result = result + [row]\nwin = True\nfor i in range(0, 5):\n    if result[i][i] == False:\n        win = False\nif win == False:\n    win = True\n    for i in range(0, 5):\n        if result[i][4 - i] == False:\n            win = False\nprint(win)","tests":[{"inputs":"FFTFT\nTFTTF\nTTTTT\nFTTFF\nTFFFF"},{"inputs":"TFFFF\nFTFFF\nFFTFF\nFFFTF\nFFFFT"},{"inputs":"TTTTT\nTTTTT\nTTFTT\nTTTTT\nTTTTT"},{"inputs":"TFFFT\nFTFTF\nFFTFF\nFTFTF\nTFFFF"},{"inputs":"FFFFF\nFFFFF\nFFFFF\nFFFFF\nFFFFF"}],"hint":"左上至右下的項目是 `result[i][i]`；右上至左下是 `result[i][4 - i]`。先查第一條；未連上才查第二條。","_exp":[{"out":"FFTFT\nTFTTF\nTTTTT\nFTTFF\nTFFFF\nTrue\n","err":null},{"out":"TFFFF\nFTFFF\nFFTFF\nFFFTF\nFFFFT\nTrue\n","err":null},{"out":"TTTTT\nTTTTT\nTTFTT\nTTTTT\nTTTTT\nFalse\n","err":null},{"out":"TFFFT\nFTFTF\nFFTFF\nFTFTF\nTFFFF\nTrue\n","err":null},{"out":"FFFFF\nFFFFF\nFFFFF\nFFFFF\nFFFFF\nFalse\n","err":null}],"_sample":"FFTFT\nTFTTF\nTTTTT\nFTTFF\nTFFFF\nTrue\n"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.70–83、p.99–103","items":[{"id":"c3a-q1","pts":4,"src":"自擬（DSE 卷二D 風格）","tags":[{"t":"trap","why":"內循環的範圍隨外循環變量改變時，不可以直接用「外循環次數 × 內循環次數」。"}],"verify":true,"ask":{"count":4},"q":"以下程式中，第 4 行執行了多少次？","code":"k = 0\nfor i in range(1, 6):\n    for j in range(i, 6):\n        k = k + 1\nprint(k)","options":["15","25","10","20"],"answer":"A","why":"i = 1 至 5 時，內循環分別執行 5、4、3、2、1 次，共 15 次，不是 5 × 5。","_right":0},{"id":"c3a-q2","pts":4,"src":"教科書 p.99 課題練習第 1 題","tags":[{"t":"hot","why":"卷二D 常考以嵌套循環處理二維陣列（DSE 2014 2D Q4、2016 2D Q4、2017 2D Q4、2019 2D Q2、2021 2D Q3）"}],"verify":true,"q":"列表 `map` 儲存了某地區每個單元格的人口（以千計）。以下程式的輸出是什麼？","code":"map = [[0, 2, 3, 2, 0, 0, 0],\n       [1, 3, 5, 4, 4, 2, 0],\n       [1, 4, 6, 7, 6, 4, 3],\n       [0, 4, 4, 7, 5, 4, 0],\n       [0, 2, 3, 4, 0, 0, 0]]\npopulation = 0\nfor i in range(0, 5):\n    for j in range(0, 7):\n        population = population + map[i][j]\nprint(population)","options":["90","81","35","7"],"answer":"A","why":"各列總和：7 + 19 + 31 + 24 + 9 = 90。（教科書答案：90）","_right":0},{"id":"c3a-q3","pts":4,"src":"仿教科書 p.103 課題練習第 5 題（參考 DSE 2014 2D Q4a）","verify":true,"q":"以下程式的輸出是什麼？","code":"row = [\"A\", \"B\", \"C\", \"D\", \"E\", \"F\"]\nfor j in range(0, 6):\n    row[5 - j] = row[j]\nprint(\"\".join(row))","options":["ABCCBA","FEDCBA","ABCDEF","FEDDEF"],"answer":"A","why":"j = 0、1、2 時把左半複製到右半（F、E、D 被蓋過）；j = 3、4、5 時再把已改過的右半抄回左半，所以左半不變。結果左右對稱：ABCCBA。這就是課題練習第 5 題「沿中線反射」的效果；把範圍改為 range(0, 3) 便可減少一半步數。","_right":0},{"id":"c3a-q4","pts":4,"src":"仿教科書 p.101 課題練習第 4 題（參考 DSE 2021 2D Q3）","tags":[{"t":"hot","why":"卷二D 常考以嵌套循環處理二維陣列（DSE 2014 2D Q4、2016 2D Q4、2017 2D Q4、2019 2D Q2、2021 2D Q3）"}],"q":"3 × 3 的二維列表 `ttt_2d` 要由上至下逐列複製到有 9 個項目的一維列表 `ttt_1d`。Python 列表索引由 0 開始，內循環體應該是：","code":"for i in range(0, 3):\n    for j in range(0, 3):\n        ttt_1d[ ？ ] = ttt_2d[i][j]","options":["i * 3 + j","(i - 1) * 3 + j","j * 3 + i","i + j"],"answer":"A","why":"第 i 列前面已有 i 列、每列 3 個項目，所以是 i * 3 + j。教科書由 1 開始，答案寫成 (i-1)*3 + j。j * 3 + i 是逐欄複製；i + j 會重複。","_right":0},{"id":"c3a-q5","pts":4,"src":"自擬","verify":true,"q":"以下程式的輸出是什麼？","code":"x = 7\ny = 3\nif x > 5:\n    if y > 5:\n        print(\"P\")\n    elif x + y > 9:\n        print(\"Q\")\n    else:\n        print(\"R\")\nelse:\n    print(\"S\")","options":["P","Q","R","S"],"answer":"B","why":"x > 5 成立；y > 5 不成立；x + y = 10 > 9 成立，輸出 Q。","_right":1}]},{"id":"more","kind":"endless","title":"無限練習","gens":["pyIf","pyFor","pyListAlgo"],"intro":"隨機生成選擇、循環及列表算法的估輸出題目，答案由程式計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]}, {"code":"選修C","title":"選修C 算法與程式編寫 自學平台","kicker":"HKDSE ICT · 選修 C","pin":"cict2026"});
