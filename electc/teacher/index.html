re 是局部變量；右邊讀取它時它還沒有值。","_right":0},{"id":"c4-s3-p2","type":"fill","pts":1,"src":"教科書 p.124 活動 4.3","q":"以下程式會出現什麼錯誤？（寫錯誤類型名稱）","code":"def add(a, b):\n    result = a + b\n\nadd(1, 1)\nprint(result)","blanks":[{"label":"錯誤類型","ask":{"error":true}}],"hint":"result 是 add 的局部變量，子程式結束後已被捨去。（教科書：使用超出有效範圍的變量）","_ans":["NameError"]},{"id":"c4-s3-p3","type":"complete","pts":2,"src":"教科書 p.126–127 測試站 4.3（參考 DSE 2018 2D Q3）","label":"補完程式","q":"`username` 和 `N`（長度）是全程變量。`hasDigit()` 在用戶名稱包含數字時傳回 True，否則傳回 False。補完傳回值。會用多組數據測試。","template":"username = input()\nN = len(username)\n\ndef hasDigit():\n    for i in range(0, N):\n        if username[i] >= \"0\" and username[i] \u003c= \"9\":\n            return ［1］\n    return ［2］\n\ndef noSpace():\n    for i in range(0, N):\n        if username[i] == \" \":\n            return False\n    return True\n\nprint(hasDigit(), noSpace())","ref":["True","False"],"tests":[{"inputs":"abc1"},{"inputs":"abc"},{"inputs":"ab 1"},{"inputs":"9"},{"inputs":"a b"}],"hint":"一找到數字便可以 `return True`（子程式立即結束）；整個循環完結都找不到，才 `return False`。注意第二個 return 不在循環之內。"}]},{"id":"s4","title":"傳遞參數","pages":"教科書 p.128–129","learn":[{"pts":["**傳遞參數**：調用子程式時，實際參數傳遞至形式參數。Python 按實際參數的數據類型決定傳遞方法。（p.128）","**不可變的物件**：整數、浮點數、布爾、字串。實際參數的值被**複製**到形式參數；在子程式內修改形式參數**不會影響**實際參數。（p.128）","**可變的物件**：列表。形式參數儲存實際參數的記憶體地址（**指示標**）；在子程式內修改列表的項目**會影響**實際參數。（p.129）","C++ 的類似做法：**按值調用**（call-by-value）、**按址調用**（call-by-reference）。（p.129 擴闊視野）","注意：如果在子程式內把形式參數**賦值為另一個列表**（例如 `x = [0]`），它便指向新列表，不再影響實際參數。"]},{"table":{"head":["實際參數的數據類型","物件種類","修改形式參數會否影響實際參數"],"rows":[["int、float、bool、str","不可變的物件（複製值）","不會"],["list","可變的物件（記憶體地址）","會（修改項目時）"]]},"cap":"p.141 課文總結"},{"sim":{"code":"def add(x):\n    print(\"Inside, before add:\", x)\n    x = x + 1\n    print(\"Inside, after add:\", x)\n\nnum = 1\nprint(\"Outside, before add:\", num)\nadd(num)\nprint(\"Outside, after add:\", num)","step":true,"open":["vars"]},"cap":"p.128：傳遞整數。把第 3 行改為 `x[0] = x[0] + 1`、第 6 行改為 `num = [1]`，便是 p.129 傳遞列表的例子，再執行比較。"}],"tries":[{"id":"c4-s4-t1","pts":4,"src":"仿教科書 p.129","tags":[{"t":"trap","why":"列表是可變的物件：在子程式內改動項目會影響實際參數；但把形式參數賦值為另一個列表則不會。"}],"code":"def add_bonus(scores):\n    for i in range(0, len(scores)):\n        scores[i] = scores[i] + 5\n\ndata = [60, 70]\nadd_bonus(data)\nprint(data)","q":"先估：輸出是什麼？","options":["[65, 75]","[60, 70]","[65, 70]","None"],"why":"列表是可變的物件：scores 和 data 指向同一個列表，改動項目便會反映在 data。","_right":0,"_ans":"[65, 75]"}],"practice":[{"id":"c4-s4-p1","type":"fill","pts":2,"src":"教科書 p.128–129","q":"執行後，num 和 lst 的值分別是什麼？","code":"def add(x):\n    x = x + 1\n\ndef add_list(y):\n    y[0] = y[0] + 1\n\nnum = 1\nlst = [1]\nadd(num)\nadd_list(lst)","blanks":[{"label":"num","ask":{"var":"num"}},{"label":"lst","ask":{"var":"lst"}}],"hint":"整數：複製值；列表：傳遞記憶體地址。","_ans":["1","[2]"]},{"id":"c4-s4-p2","type":"mc","pts":2,"src":"自擬","tags":[{"t":"trap","why":"列表是可變的物件：在子程式內改動項目會影響實際參數；但把形式參數賦值為另一個列表則不會。"}],"verify":true,"q":"以下程式的輸出是什麼？","code":"def reset(a):\n    a = [0, 0]\n\ndata = [5, 6]\nreset(data)\nprint(data)","options":["[5, 6]","[0, 0]","[0, 0, 5, 6]","None"],"answer":0,"hint":"`a = [0, 0]` 令局部變量 a 指向一個新列表；原本的列表沒有被修改。","_right":0},{"id":"c4-s4-p3","type":"mc","pts":1,"src":"教科書 p.128","q":"以下哪一組全是 Python 的**不可變的物件**？","options":["整數、浮點數、布爾、字串","整數、列表","字串、列表","列表、布爾"],"answer":0,"hint":"列表是可變的物件。","_right":0}]},{"id":"s5","title":"子程式存根及模組化應用","pages":"教科書 p.131–139","learn":[{"pts":["複雜的程式分拆為多個子程式，主程式調用它們，把功能組合起來。（p.136）","問題：子程式未全部完成時，整個程式不能正確運行；出錯時亦難以得知是哪個子程式有問題。（p.137）","**子程式存根**：以短小、簡單、臨時的程式碼取代子程式的本體（例如 `return 100`），令主程式在子程式未完成時仍可運行。（p.138）","除錯時用存根取代某些子程式，可縮窄範圍，更有效率地找出問題。（p.138）","模組化的好處：**易於理解**、**便於重複使用**、**提升開發效率**（可分工）。（p.142）","子程式可以調用其他子程式：例如無人機只有 FW（前進）和 TR（順時針轉 90°），`TL` 可以寫成「TR 三次」。（p.131–135 測試站 4.4，參考 DSE 2020、2022 2D Q1）"]},{"sim":{"code":"def calc_bmi(weight, height):\n    return 21          # 子程式存根\n\ndef analyse(bmi):\n    return \"正常\"       # 子程式存根\n\ndef report(bmi, category):\n    return \"Your BMI: \" + str(bmi) + \" belongs to \" + category\n\nw = float(input(\"weight: \"))\nh = float(input(\"height: \"))\nb = calc_bmi(w, h)\nc = analyse(b)\nprint(report(b, c))","inputs":"60\n1.7","open":[]},"cap":"p.137–138：用存根取代「計算 BMI」和「分析 BMI」，先測試「製作報告」。試把 calc_bmi 改為 `return weight / height ** 2`。"},{"sim":{"code":"x = 3\ny = 2\nd = 1          # 1 北、2 東、3 南、4 西\n\ndef FW():\n    global x, y\n    if d == 1:\n        y = y + 1\n    elif d == 2:\n        x = x + 1\n    elif d == 3:\n        y = y - 1\n    else:\n        x = x - 1\n\ndef TR():\n    global d\n    d = d % 4 + 1\n\ndef TL():\n    for i in range(0, 3):\n        TR()\n\nFW()\nFW()\nFW()\nTR()\nFW()\nFW()\nTL()\nFW()\nTL()\nprint(x, y, d)","step":true,"open":["vars"]},"cap":"p.131 測試站 4.4：無人機由 (3, 2) 面向北方出發，執行 9 個指令後在 (5, 6) 面向西方（d = 4）。"}],"tries":[{"id":"c4-s5-t1","pts":4,"src":"教科書 p.132 測試站 4.4(a)","code":"x = 5\ny = 3\nd = 1\n\ndef FW():\n    global x, y\n    if d == 1:\n        y = y + 1\n    elif d == 2:\n        x = x + 1\n    elif d == 3:\n        y = y - 1\n    else:\n        x = x - 1\n\ndef TR():\n    global d\n    d = d % 4 + 1\n\ndef TL():\n    for i in range(0, 3):\n        TR()\n\nTL()\nFW()\nFW()\nFW()\nTR()\nFW()\nFW()\nprint(x, y, d)","q":"先估：無人機由 (5, 3) 面向北方出發。輸出是什麼？","options":["2 5 1","8 5 1","2 5 4","5 6 2"],"why":"TL 後面向西，前進 3 格到 (2, 3)；TR 後面向北，前進 2 格到 (2, 5)。（教科書答案：(2, 5)，面向北方）","_right":0,"_ans":"2 5 1"}],"practice":[{"id":"c4-s5-p1","type":"complete","pts":3,"src":"教科書 p.132–133 測試站 4.4(b)、(c)","label":"補完程式","q":"補完子程式 `TL`（用 TR）及 `SQ(N)`（以長度 N 的正方形路徑飛行，最後回到起點及原來方向）。SQ 每飛完一條邊便輸出位置及方向。主程式由 (1, 1) 面向北方出發，執行 SQ(N)、TL()、FW()。會用多組數據測試。","template":"x = 1\ny = 1\nd = 1\n\ndef FW():\n    global x, y\n    if d == 1:\n        y = y + 1\n    elif d == 2:\n        x = x + 1\n    elif d == 3:\n        y = y - 1\n    else:\n        x = x - 1\n\ndef TR():\n    global d\n    d = d % 4 + 1\n\ndef TL():\n    for i in range(0, ［1］):\n        TR()\n\ndef SQ(N):\n    for i in range(0, ［2］):\n        for j in range(0, ［3］):\n            FW()\n        TR()\n        print(x, y, d)\n\nN = int(input())\nSQ(N)\nprint(x, y, d)\nTL()\nFW()\nprint(x, y, d)","ref":["3","4","N"],"tests":[{"inputs":"3"},{"inputs":"1"},{"inputs":"5"},{"inputs":"0"}],"hint":"逆時針 90° = 順時針 270° = TR 三次。正方形有 4 邊，每邊 FW N 次，然後 TR。（教科書答案：1 至 3；i 由 1 至 4、j 由 1 至 N）"},{"id":"c4-s5-p2","type":"mc","pts":2,"src":"教科書 p.137–138","q":"以下哪一項**不是**使用子程式存根的原因？","options":["令主程式在部分子程式未完成時仍可運行","排除某些子程式，縮窄除錯範圍","令最終程式運行得較快","可以先測試其中一個子程式"],"answer":2,"hint":"存根只是臨時的程式碼，完成後要換回真正的子程式。","_right":2}]},{"id":"write","kind":"write","title":"寫子程式","pages":"教科書 p.117–119、p.145–146","intro":"每題的子程式已用**子程式存根**佔位（只傳回固定值），主程式已寫好。把存根換成真正的子程式，先按「▶ 執行」自己測試，再按「提交評核」。","tasks":[{"id":"c4-w1","tier":"必做","pts":12,"title":"十二生肖 zodiac(year)","src":"教科書 p.145 課題練習第 3 題","q":"列表 `Z` 依次儲存十二生肖。完成子程式 `zodiac(year)`，傳回該年份所屬的生肖。\n提示：先將年份減去 4，再除以 12；餘數是 0 便是 \"rat\"，餘數是 1 便是 \"ox\"，如此類推。\n例如輸入 `2023`，輸出 `rabbit`。","starter":"Z = [\"rat\", \"ox\", \"tiger\", \"rabbit\", \"dragon\", \"snake\", \"horse\", \"goat\", \"monkey\", \"rooster\", \"dog\", \"pig\"]\n\ndef zodiac(year):\n    return \"rat\"        # 子程式存根\n\nyear = int(input())\nprint(zodiac(year))","ref":"Z = [\"rat\", \"ox\", \"tiger\", \"rabbit\", \"dragon\", \"snake\", \"horse\", \"goat\", \"monkey\", \"rooster\", \"dog\", \"pig\"]\n\ndef zodiac(year):\n    remainder = (year - 4) % 12\n    return Z[remainder]\n\nyear = int(input())\nprint(zodiac(year))","tests":[{"inputs":"2023"},{"inputs":"2013"},{"inputs":"2020"},{"inputs":"2019"},{"inputs":"2024"}],"rules":[{"must":"def zodiac(","msg":"要定義子程式 zodiac(year)"},{"must":"return","msg":"子程式要用 return 傳回生肖"}],"hint":"`remainder = (year - 4) % 12`，然後 `return Z[remainder]`。教科書的陣列由 1 開始，所以寫 `Z[remainder + 1]`；Python 列表由 0 開始，不用加 1。Z 是全程變量，可以直接讀取。"},{"id":"c4-w2","tier":"進階","pts":13,"title":"十六進制轉十進制","src":"教科書 p.146 課題練習第 4 題","q":"完成兩個子程式：\n• `F1(c)`：把一個字元 `c`（\"0\"–\"9\" 或 \"A\"–\"F\"）轉換為 0 至 15 的數字並傳回，例如 F1(\"D\") 傳回 13。\n• `hex2dec(h)`：把十六進制字串 h 轉換為十進制數字並傳回，要**調用 F1**。\n例如輸入 `9B1`，輸出 `2481`。（不可以用 `int(h, 16)`。）","starter":"def F1(c):\n    return 0            # 子程式存根\n\ndef hex2dec(h):\n    return 0            # 子程式存根\n\nh = input()\nprint(hex2dec(h))","ref":"def F1(c):\n    if c >= \"0\" and c \u003c= \"9\":\n        return int(c)\n    return ord(c) - ord(\"A\") + 10\n\ndef hex2dec(h):\n    dec = 0\n    length = len(h)\n    for i in range(0, length):\n        digit = length - 1 - i\n        dec = dec + F1(h[i]) * (16 ** digit)\n    return dec\n\nh = input()\nprint(hex2dec(h))","tests":[{"inputs":"9B1"},{"inputs":"FF"},{"inputs":"0"},{"inputs":"A"},{"inputs":"1000"},{"inputs":"7E3"}],"rules":[{"mustNot":", 16)","msg":"不可以用 int(h, 16)"},{"must":"def F1(","msg":"要定義子程式 F1(c)"},{"must":"def hex2dec(","msg":"要定義子程式 hex2dec(h)"}],"hint":"F1：數字字元用 `int(c)`；字母用 `ord(c) - ord(\"A\") + 10`。hex2dec（教科書答案）：`digit = length - 1 - i`，`dec = dec + F1(h[i]) * (16 ** digit)`。dec、length、digit 都是局部變量。"},{"id":"c4-w3","tier":"挑戰","pts":10,"title":"藏寶地圖 coins(i, j)","src":"教科書 p.117–119 例題 4.1（參考 DSE 2019 2D Q4）","q":"二維列表 `C` 儲存 6 × 8 藏寶地圖每格的金幣數量。教科書的位置 (i, j) 由 **1** 開始（第 i 列、第 j 欄），對應 Python 的 `C[i - 1][j - 1]`。\n完成子程式 `coins(i, j)`，傳回位置 (i − 1, j − 1) 至 (i + 1, j + 1) 這 3 × 3 區域的金幣總和；**超出地圖的格不計算**（例題 4.1(d)）。\n例如輸入 `5` 和 `2`，輸出 `15`；輸入 `1` 和 `7`，輸出 `5`。","starter":"C = [[0, 0, 1, 0, 2, 2, 0, 0],\n     [4, 3, 4, 2, 2, 3, 0, 0],\n     [3, 6, 3, 10, 2, 2, 0, 0],\n     [0, 4, 5, 6, 7, 3, 3, 0],\n     [0, 3, 3, 3, 7, 5, 5, 2],\n     [0, 0, 0, 0, 0, 0, 1, 1]]\n\ndef coins(i, j):\n    return 0            # 子程式存根\n\ni = int(input())\nj = int(input())\nprint(coins(i, j))","ref":"C = [[0, 0, 1, 0, 2, 2, 0, 0],\n     [4, 3, 4, 2, 2, 3, 0, 0],\n     [3, 6, 3, 10, 2, 2, 0, 0],\n     [0, 4, 5, 6, 7, 3, 3, 0],\n     [0, 3, 3, 3, 7, 5, 5, 2],\n     [0, 0, 0, 0, 0, 0, 1, 1]]\n\ndef coins(i, j):\n    total = 0\n    for x in range(1, 4):\n        for y in range(1, 4):\n            r = i - 2 + x\n            c = j - 2 + y\n            if 1 \u003c= r \u003c= 6 and 1 \u003c= c \u003c= 8:\n                total = total + C[r - 1][c - 1]\n    return total\n\ni = int(input())\nj = int(input())\nprint(coins(i, j))","tests":[{"inputs":"5\n2"},{"inputs":"4\n4"},{"inputs":"1\n7"},{"inputs":"6\n8"},{"inputs":"1\n1"},{"inputs":"3\n4"}],"hint":"教科書答案：x、y 由 1 至 3，位置是 `[i-2+x, j-2+y]`；先檢查 `1 \u003c= i-2+x \u003c= 6 and 1 \u003c= j-2+y \u003c= 8`。Python 讀取時兩個索引都要減 1。注意：Python 的負數索引不會出錯，但會讀錯格，所以一定要檢查範圍。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.112–138","items":[{"id":"c4-q1","pts":4,"src":"自擬（DSE 卷二D 風格）","tags":[{"t":"hot","why":"卷二D 常要求寫出調用子程式的傳回值（DSE 2015 2D Q1、2019 2D Q2、2019 2D Q4）"}],"verify":true,"q":"以下程式的輸出是什麼？","code":"def f(a, b):\n    a = a + b\n    b = a - b\n    return a * b\n\nx = 2\ny = 3\nprint(f(y, x), x, y)","options":["15 2 3","10 2 3","15 5 3","10 5 2"],"answer":"A","why":"實際參數按次序傳遞：a = y = 3、b = x = 2。a = 5，b = 3，傳回 15。x、y 是整數（不可變），不受影響。","_right":0},{"id":"c4-q2","pts":4,"src":"教科書 p.108 常見錯誤","tags":[{"t":"trap","why":"列印不等於傳回；沒有 return 的子程式傳回 None。"}],"verify":true,"q":"以下程式的輸出是什麼？","code":"def double(x):\n    print(x * 2)\n\ny = double(4)\nprint(y)","options":["8\nNone","8\n8","8","None"],"answer":"A","why":"double 只列印 8，沒有 return，所以傳回值是 None，y 便是 None。","_right":0},{"id":"c4-q3","pts":4,"src":"教科書 p.124–128","tags":[{"t":"trap","why":"子程式內對變量賦值，Python 便把它當作局部變量；要修改全程變量須用 global。"}],"verify":true,"q":"以下程式的輸出是什麼？","code":"x = 5\n\ndef f():\n    global x\n    x = x * 2\n\ndef g(x):\n    x = x + 1\n    return x\n\nf()\ny = g(x)\nprint(x, y)","options":["10 11","5 6","10 10","11 11"],"answer":"A","why":"f 用 global，把全程變量 x 改為 10。g 的形式參數 x 是局部變量，加 1 後傳回 11，全程變量 x 仍是 10。","_right":0},{"id":"c4-q4","pts":4,"src":"教科書 p.129","tags":[{"t":"trap","why":"列表是可變的物件：在子程式內改動項目會影響實際參數；但把形式參數賦值為另一個列表則不會。"}],"verify":true,"q":"以下程式的輸出是什麼？","code":"def h(a):\n    a[0] = a[0] + len(a)\n    a = [0]\n    a[0] = 9\n\nnums = [1, 2]\nh(nums)\nprint(nums)","options":["[3, 2]","[9]","[1, 2]","[9, 2]"],"answer":"A","why":"第 2 行修改的是 nums 指向的列表（1 + 2 = 3）；第 3 行之後 a 指向新列表，再修改不影響 nums。","_right":0},{"id":"c4-q5","pts":4,"src":"教科書 p.137–142","q":"一個程式由主程式及子程式 A 至 E 組成。子程式 C 未完成，其他人想先測試子程式 D。最合適的做法是：","options":["等所有子程式完成後才一起測試","為子程式 C 寫一個子程式存根，例如只傳回一個固定值","把子程式 C 的程式碼複製到主程式內","把所有子程式合併成一個大的子程式"],"answer":"B","why":"子程式存根令主程式在子程式未完成時仍可運行，亦可縮窄除錯範圍。合併子程式會失去模組化的好處。","_right":1}]},{"id":"more","kind":"endless","title":"無限練習","gens":["pyFunc","pyErr","pyList"],"intro":"隨機生成子程式（傳回值、局部與全程變量）、錯誤類型及列表的估輸出題目，答案由程式計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]},{"id":"c5a","title":"數據結構（一）：堆疊","book":"教科書 選修C 第 5 章 p.150–165（另有 p.203–204 課題練習 1）","key":"C-c5a-hmac-ceb14ae4de","sections":[{"id":"s1","title":"數據結構、指示標與堆疊的概念","pages":"教科書 p.150–155","learn":[{"pts":["**數據結構**：在電腦記憶體中儲存和組織數據的方式。例如全班成績用一個陣列（列表）儲存，而不是數十個變量。（p.150）","**陣列**把數據連續儲存，用索引便能直接計算位址，例如 `the_array[4]`。（p.150）","**指示標（pointer）**：儲存記憶體位址的變量，好像箭頭指向另一個變量。Python 沒有指示標運算符，本章用**整數索引**當作指示標。（p.151）","**堆疊（stack）**：**後進先出法（LIFO）**。好像一疊書：最後放上的書最先拿走。（p.153）","**推入（push）**：把數據加到堆疊**頂端**；**彈出（pop）**：取出頂端（最後加入）的數據。（p.153）"]},{"h":"堆疊在電腦系統的應用（p.154–155）"},{"pts":["**復原（undo）**：每個操作推入「復原堆疊」；按復原便彈出最後的操作，並推入「取消復原堆疊」。","**取消復原（redo）**：由取消復原堆疊彈出，放回復原堆疊。進行新操作時，取消復原堆疊會被**清空**。","**調用堆疊（call stack）**：調用子程式時，其堆疊框（包括返回位址）被推入；子程式完成後被彈出。"]},{"sim":{"code":"undo = []\nredo = []\nundo.append(\"畫 1\")\nundo.append(\"畫 2\")\nundo.append(\"畫 3\")\nredo.append(undo.pop())     # 按復原\nredo.append(undo.pop())     # 再按復原\nundo.append(redo.pop())     # 按取消復原\nprint(\"復原堆疊：\", undo)\nprint(\"取消復原堆疊：\", redo)","step":true,"open":["vars"]},"cap":"復原／取消復原（p.154–155）。按「下一步」，看兩個列表（列表末端 = 堆疊頂端）怎樣變化。"},{"fix":{"bad":"def multiply(a, b):\n    return a*b\n\ndef area(a, b):\n    return multiply(a, b)\n\ndef square(n):\n    area = area(n, n)\n\nprint(square(5))","good":"def multiply(a, b):\n    return a*b\n\ndef area(a, b):\n    return multiply(a, b)\n\ndef square(n):\n    result = area(n, n)\n    return result\n\nprint(square(5))","why":"教科書 p.155 的調用堆疊例子在 Python 會出 **UnboundLocalError**：`square` 內把結果賦值給 `area`，Python 便把 `area` 當作局部變量，再調用 `area(n, n)` 時它還未有值。另外 `square` 沒有 `return`，會輸出 `None`。改用另一個變量名並加上 `return`。調用次序不變：square（第 11 行調用）→ area（第 8 行）→ multiply（第 5 行）。"}}],"tries":[{"id":"c5a-s1-t1","pts":4,"src":"教科書 p.156–157 堆疊在 Python 的操作","code":"the_stack = []\nthe_stack.append(\"A\")\nthe_stack.append(\"B\")\nthe_stack.append(\"C\")\ntemp = the_stack.pop()\ntemp = the_stack.pop()\nthe_stack.append(\"D\")\nprint(the_stack, temp)","q":"先估：輸出是什麼？","options":["['A', 'D'] B","['C', 'D'] A","['A', 'D'] C","['A', 'B', 'D'] B"],"why":"`pop()` 取出列表**末端**（堆疊頂端）：先取出 C，再取出 B，所以 temp 最後是 B；之後 D 推入，堆疊剩 A、D。","_right":0,"_ans":"['A', 'D'] B"}],"practice":[{"id":"c5a-s1-p1","type":"mc","pts":2,"src":"教科書 p.154、p.167","q":"以下哪一項功能**最適合**使用堆疊？","options":["列印機按送出次序列印文件","繪圖軟件的「復原」功能","銀行櫃位按取票次序叫號","把學生按學號排列"],"answer":1,"hint":"堆疊是後進先出：最後的操作最先被復原。另外三項都是先到先得（隊列）或排序。","_right":1},{"id":"c5a-s1-p2","type":"mc","pts":2,"src":"教科書 p.155 調用堆疊","q":"主程式第 11 行調用 `square`，`square` 在第 8 行調用 `area`，`area` 在第 5 行調用 `multiply`。當 `multiply` **正在執行**時，調用堆疊（由底至頂）儲存的返回位置是？","options":["第 5 行、第 8 行、第 11 行","第 11 行、第 8 行、第 5 行","只有第 5 行","第 11 行、第 5 行"],"answer":1,"hint":"最先調用的最先被推入，所以在最底；multiply 完成後，「第 5 行」最先被彈出。","_right":1},{"id":"c5a-s1-p3","type":"fill","pts":2,"src":"教科書 p.154–155 復原與取消復原","q":"用戶畫了 1、2、3，按復原兩次，按取消復原一次，再畫 6。寫出最後兩個堆疊的內容（照 Python 的列表寫法）。","code":"undo = []\nredo = []\nundo.append(1)\nundo.append(2)\nundo.append(3)\nredo.append(undo.pop())\nredo.append(undo.pop())\nundo.append(redo.pop())\nundo.append(6)\nredo = []      # 新操作會清空取消復原堆疊","blanks":[{"label":"undo","ask":{"var":"undo"}},{"label":"redo","ask":{"var":"redo"}}],"hint":"復原兩次後 undo = [1]、redo = [3, 2]；取消復原把 2 放回 undo；畫 6 時清空 redo。","_ans":["[1, 2, 6]","[]"]}]},{"id":"s2","title":"用 Python 列表操作堆疊","pages":"教科書 p.156–162","learn":[{"table":{"head":["堆疊的操作","Python 列表的操作","描述"],"rows":[["定義堆疊","`the_stack = []`","建立一個空列表"],["推入","`the_stack.append(item)`","把 item 加到列表末端（堆疊頂端）"],["彈出","`the_stack.pop()`","傳回並刪除列表末端的項目"],["查看頂端（不彈出）","`the_stack[-1]`","只讀取，不刪除"],["是否空的","`len(the_stack) == 0`","相當於教科書的 isEmpty(S)"]]},"cap":"表：堆疊在 Python 的操作（p.156）"},{"pts":["**下溢錯誤（underflow）**：從**空的堆疊**彈出。在 Python，`[].pop()` 會出 **IndexError**。（p.157）","**上溢錯誤（overflow）**：把項目推入**滿的堆疊**。Python 列表本身沒有大小上限，所以要自己設定上限並檢查。（p.157）","彈出前先檢查：`if len(s) > 0:`；推入前檢查：`if len(s) \u003c SIZE:`。","`S.append(S.pop() + S.pop())`：先彈出兩個項目相加，再把結果推入（例題 5.1(a)(i)）。"]},{"sim":{"code":"S1 = []\nS1.append(30)\nS1.append(10)\nS1.append(10)\nS1.append(S1.pop() + S1.pop())\nS1.append(25)\nprint(S1)","step":true,"open":["vars"]},"cap":"例題 5.1(a)(i)（p.158，參考 DSE 2019 卷二D Q1）：push 寫成 `append`，pop 寫成 `pop()`。"}],"tries":[{"id":"c5a-s2-t1","pts":4,"src":"教科書 p.158 例題 5.1(a)(i)","code":"S1 = []\nS1.append(30)\nS1.append(10)\nS1.append(10)\nS1.append(S1.pop() + S1.pop())\nS1.append(25)\nprint(S1)","q":"先估：輸出是什麼？（列表左邊是堆疊底部）","options":["[30, 20, 25]","[30, 10, 10, 20, 25]","[40, 25]","[25, 20, 30]"],"why":"兩次 pop 取出 10 和 10，相加得 20 再推入：[30, 20]；最後推入 25。","_right":0,"_ans":"[30, 20, 25]"},{"id":"c5a-s2-t2","pts":4,"src":"教科書 p.157 下溢錯誤","code":"s = []\ns.append(5)\nx = s.pop()\ny = s.pop()\nprint(x, y)","ask":{"error":true},"q":"先估：執行時會出現哪種錯誤？","options":["IndexError","ValueError","NameError","沒有錯誤"],"why":"第 4 行從空的堆疊彈出（下溢）。Python 的訊息是 `IndexError: pop from empty list`，所以 print 不會執行。","_right":0,"_ans":"IndexError"}],"practice":[{"id":"c5a-s2-p1","type":"fill","pts":2,"src":"教科書 p.158 例題 5.1(a)(ii)","q":"寫出執行後堆疊 S2 的內容（照 Python 的列表寫法）。","code":"S2 = []\nS2.append(20)\nS2.append(10)\nS2.pop()\nif len(S2) == 0:     # isEmpty(S2)\n    S2.append(15)\nelse:\n    S2.append(25)","blanks":[{"label":"S2","ask":{"var":"S2"}}],"hint":"彈出 10 後 S2 仍有 20，不是空的，所以推入 25。","_ans":["[20, 25]"]},{"id":"c5a-s2-p2","type":"fill","pts":3,"src":"教科書 p.159 例題 5.1(b)","q":"S1 起初由底至頂是 20、20、20，S2 是空的。寫出執行後 S1、S2 及 temp。","code":"S1 = [20, 20, 20]\nS2 = []\ntemp = 0\nwhile len(S1) > 0:\n    temp = temp + S1.pop()\n    if temp > 25:\n        S2.append(25)\n        temp = temp - 25\nS2.append(temp)","blanks":[{"label":"S1","ask":{"var":"S1"}},{"label":"S2","ask":{"var":"S2"}},{"label":"temp","ask":{"var":"temp"}}],"hint":"temp：20 → 40（推入 25，剩 15）→ 35（推入 25，剩 10）；最後把 10 推入 S2。","_ans":["[]","[25, 25, 10]","10"]},{"id":"c5a-s2-p3","type":"mc","pts":2,"src":"教科書 p.157","q":"`stack` 可能是空的。以下哪一段程式可以**避免下溢錯誤**？","options":["`x = stack.pop()`","`if len(stack) > 0:` 然後 `x = stack.pop()`","`if len(stack) == 0:` 然後 `x = stack.pop()`","`x = stack.pop(0)`"],"answer":1,"hint":"要先確定堆疊不是空的才彈出。`pop(0)` 一樣會在空列表出錯。","_right":1}]},{"id":"s3","title":"以陣列和指示標實現堆疊：剪貼簿","pages":"教科書 p.203–204 課題練習 1","learn":[{"pts":["DSE 題目常用**固定大小的陣列**加一個**指示標**表示堆疊，例如剪貼簿 `clipboard`（大小 5），變量 `latest` 儲存**頂端項目的索引**。（p.203）","教科書索引由 1 開始：`latest = 0` 代表**空**，`latest = 5` 代表**滿**。下面的 Python 程式也用索引 1–5（索引 0 不用）。","**推入** `copy(item)`：先檢查是否已滿；否則 `latest` 加 1，再把 item 存入 `clipboard[latest]`。**次序不可調轉**。","**彈出** `paste()`：先檢查是否空；否則取出 `clipboard[latest]`，`latest` 減 1。","彈出時**只移動指示標，不清除內容**；之後推入新項目時便會覆寫舊內容。`clear()` 只須 `latest = 0`。（p.204 (d)(ii)）"]},{"sim":{"code":"clipboard = [\"\"] * 6        # 用索引 1 至 5，索引 0 不用\nlatest = 0                  # 頂端項目的索引；0 代表空\n\ndef clear():\n    global latest\n    latest = 0\n\ndef copy(item):\n    global latest\n    if latest == 5:\n        print(\"剪貼簿已滿\")\n    else:\n        latest = latest + 1\n        clipboard[latest] = item\n\ndef paste():\n    global latest\n    if latest == 0:\n        result = -1\n    else:\n        result = clipboard[latest]\n        latest = latest - 1\n    return result\n\nclear()\ncopy(\"friends\")\ncopy(\"banana\")\npaste()\ncopy(\"wood\")\ncopy(\"forever\")\nprint(latest)\nprint(clipboard)","step":true,"open":["vars"]},"cap":"課題練習 1(a)（p.203）。留意 `paste()` 之後 \"banana\" 仍在陣列內，直到被 \"wood\" 覆寫。"},{"warn":"指示標的約定要看清楚題目：本例 `latest` 指向**頂端項目**（空時是 0）；有些題目用 `top = -1` 代表空（Python 索引由 0 開始），或者 `top` 指向**下一個空位**。滿／空的條件會跟着改變。"}],"tries":[{"id":"c5a-s3-t1","pts":4,"src":"教科書 p.203 課題練習 1(a)","code":"clipboard = [\"\"] * 6        # 用索引 1 至 5，索引 0 不用\nlatest = 0                  # 頂端項目的索引；0 代表空\n\ndef clear():\n    global latest\n    latest = 0\n\ndef copy(item):\n    global latest\n    if latest == 5:\n        print(\"剪貼簿已滿\")\n    else:\n        latest = latest + 1\n        clipboard[latest] = item\n\ndef paste():\n    global latest\n    if latest == 0:\n        result = -1\n    else:\n        result = clipboard[latest]\n        latest = latest - 1\n    return result\n\nclear()\ncopy(\"friends\")\ncopy(\"banana\")\npaste()\ncopy(\"wood\")\ncopy(\"forever\")\nprint(latest, clipboard[1:4])","q":"先估：輸出是什麼？","options":["3 ['friends', 'wood', 'forever']","4 ['friends', 'banana', 'wood']","3 ['friends', 'banana', 'wood']","2 ['wood', 'forever', '']"],"why":"paste 令 latest 由 2 變 1；copy(\"wood\") 令 latest = 2，覆寫 banana；copy(\"forever\") 令 latest = 3。","_right":0,"_ans":"3 ['friends', 'wood', 'forever']"}],"practice":[{"id":"c5a-s3-p1","type":"complete","pts":3,"src":"教科書 p.203 課題練習 1(b)","q":"完成 `copy(item)`。程式會輸入要複製多少個項目，然後輸出 latest 及陣列。會用多組數據測試（包括超過 5 個）。","template":"clipboard = [\"\"] * 6\nlatest = 0\n\ndef copy(item):\n    global latest\n    if ［1］:\n        print(\"剪貼簿已滿\")\n    else:\n        latest = ［2］\n        ［3］\n\nk = int(input())\nfor i in range(k):\n    copy(\"w\" + str(i))\nprint(latest, clipboard)","ref":["latest == 5","latest + 1","clipboard[latest] = item"],"tests":[{"inputs":"2"},{"inputs":"5"},{"inputs":"7"}],"hint":"已滿的條件是 latest == 5；先把 latest 加 1，再存入 clipboard[latest]。"},{"id":"c5a-s3-p2","type":"mc","pts":2,"src":"教科書 p.204 課題練習 1(d)(ii)","verify":true,"q":"以下程式的輸出是什麼？","code":"clipboard = [\"\"] * 6        # 用索引 1 至 5，索引 0 不用\nlatest = 0                  # 頂端項目的索引；0 代表空\n\ndef clear():\n    global latest\n    latest = 0\n\ndef copy(item):\n    global latest\n    if latest == 5:\n        print(\"剪貼簿已滿\")\n    else:\n        latest = latest + 1\n        clipboard[latest] = item\n\ndef paste():\n    global latest\n    if latest == 0:\n        result = -1\n    else:\n        result = clipboard[latest]\n        latest = latest - 1\n    return result\n\ncopy(\"a\")\ncopy(\"b\")\ncopy(\"c\")\npaste()\npaste()\nprint(latest, clipboard)","options":["1 ['', 'a', 'b', 'c', '', '']","1 ['', 'a', '', '', '', '']","3 ['', 'a', 'b', 'c', '', '']","1 ['', 'c', 'b', 'a', '', '']"],"answer":0,"hint":"彈出只移動指示標 latest，陣列內容沒有被清除。","_right":0},{"id":"c5a-s3-p3","type":"mc","pts":2,"src":"教科書 p.204 課題練習 1(c)(ii)","q":"`paste()` 傳回 −1 代表什麼？","options":["剪貼簿已滿","剪貼簿是空的","頂端項目是 −1","程式出現運行時錯誤"],"answer":1,"hint":"看 `if latest == 0:` 那一個分支。","_right":1}]},{"id":"s4","title":"堆疊的應用：膠箱與瀏覽器","pages":"教科書 p.159–165","learn":[{"pts":["`reverse(A, B)`：當 A 不是空的，便 `push(B, pop(A))`。結果 A 清空，B 的次序**相反**。（例題 5.1(c)，p.159）","捨棄 S1 底部 N 個膠箱：`reverse(S1, S2)` → 彈出 S2 頂端 N 個 → `reverse(S2, S1)`，餘下膠箱回復原有次序。（例題 5.1(d)，p.160）","取出第 n 層起的 k 箱：先把第 t 層至第 n 層移到 S3（共 **t − n + 1** 個），再把 S3 頂端 k 個移到 S2，最後 `reverse(S3, S1)`。（例題 5.1(e)，p.161）","瀏覽器：「上一頁」是 `push(goForward, pop(goBack))`；「下一頁」是 `push(goBack, pop(goForward))`。堆疊是空的便沒有操作。（測試站 5.1，p.164–165，參考 DSE 2017 卷二D Q3）"]},{"sim":{"code":"def reverse(A, B):\n    while len(A) > 0:\n        B.append(A.pop())\n\nS1 = [1, 2, 3, 4, 5, 6]\nS2 = []\nN = 4\nreverse(S1, S2)\nfor i in range(N):\n    S2.pop()\nreverse(S2, S1)\nprint(S1, S2)","step":true,"open":["vars"]},"cap":"例題 5.1(d)（p.160）：捨棄 S1 底部 4 個膠箱。"}],"tries":[{"id":"c5a-s4-t1","pts":4,"src":"教科書 p.164–165 測試站 5.1(a)（參考 DSE 2017 卷二D Q3）","code":"goBack = [\"google.com\", \"hk.yahoo.com\", \"hku.hk\", \"www.gov.hk\"]\ngoForward = []\nfor i in range(3):          # 按「上一頁」三次\n    goForward.append(goBack.pop())\nfor i in range(2):          # 再按「下一頁」兩次\n    goBack.append(goForward.pop())\nprint(goForward)","q":"先估：最後 goForward 的內容是什麼？","options":["['www.gov.hk']","['hk.yahoo.com']","['www.gov.hk', 'hku.hk']","[]"],"why":"上一頁三次後 goForward 由底至頂是 www.gov.hk、hku.hk、hk.yahoo.com；下一頁兩次彈出 hk.yahoo.com 和 hku.hk，剩 www.gov.hk。","_right":0,"_ans":"['www.gov.hk']"}],"practice":[{"id":"c5a-s4-p1","type":"complete","pts":3,"src":"教科書 p.159 例題 5.1(c)","q":"完成子程式 `reverse(A, B)`，把堆疊 A 的所有項目按相反次序移至堆疊 B。程式會輸入膠箱數目 n，S1 是 [1, 2, …, n]。","template":"def reverse(A, B):\n    while ［1］:\n        ［2］\n\nn = int(input())\nS1 = list(range(1, n + 1))\nS2 = []\nreverse(S1, S2)\nprint(S1, S2)","ref":["len(A) > 0","B.append(A.pop())"],"tests":[{"inputs":"5"},{"inputs":"1"},{"inputs":"0"}],"hint":"「當 not isEmpty(A)」即 `len(A) > 0`；「push(B, pop(A))」即 `B.append(A.pop())`。"},{"id":"c5a-s4-p2","type":"fill","pts":2,"src":"教科書 p.161 例題 5.1(e)（旁註數目有誤，見本單元檔頭）","q":"S1 有 t = 25 個膠箱，要由第 n = 4 層開始取出。以下程式模擬「設 i 由 t 下至 n」把膠箱移到 S3。最後 S3 有多少個膠箱？","code":"S1 = list(range(1, 26))\nS3 = []\nt = len(S1)\nn = 4\nfor i in range(t, n - 1, -1):\n    S3.append(S1.pop())\nmoved = len(S3)","blanks":[{"label":"moved","ask":{"var":"moved"}}],"hint":"i 由 25 下至 4，共 25 − 4 + 1 個。教科書旁註寫 (t − n)，少算了第 n 層本身。","_ans":["22"]}]},{"id":"write","kind":"write","title":"寫程式","pages":"教科書 p.156–157、p.203–204","intro":"在編輯器寫 Python 程式，先按 ▶ 自己測試，再按「提交評核」。每個 `input()` 讀一行輸入。","tasks":[{"id":"c5a-w1","pts":15,"title":"剪貼簿歷程（大小 5 的堆疊）","src":"教科書 p.203–204 課題練習 1","q":"第一行輸入指令數目 n，之後每行一個指令：\n• `COPY 文字`：把文字推入剪貼簿；如果已有 5 項，輸出 `剪貼簿已滿`（不推入）。\n• `PASTE`：彈出頂端項目並輸出它；如果是空的，輸出 `剪貼簿是空的`。\n• `CLEAR`：清空剪貼簿。\n全部指令完成後，輸出剪貼簿餘下的項目數目。\n可以用 Python 列表（`append`、`pop`）作堆疊。","starter":"clipboard = []\nn = int(input())\nfor i in range(n):\n    cmd = input()\n    # 在這裏完成\nprint(len(clipboard))","ref":"clipboard = []\nn = int(input())\nfor i in range(n):\n    cmd = input()\n    if cmd == \"PASTE\":\n        if len(clipboard) == 0:\n            print(\"剪貼簿是空的\")\n        else:\n            print(clipboard.pop())\n    elif cmd == \"CLEAR\":\n        clipboard = []\n    else:\n        word = cmd[5:]\n        if len(clipboard) == 5:\n            print(\"剪貼簿已滿\")\n        else:\n            clipboard.append(word)\nprint(len(clipboard))","tests":[{"inputs":"6\nCOPY friends\nCOPY banana\nPASTE\nCOPY wood\nCOPY forever\nPASTE"},{"inputs":"3\nPASTE\nCOPY hi\nPASTE"},{"inputs":"7\nCOPY a\nCOPY b\nCOPY c\nCOPY d\nCOPY e\nCOPY f\nPASTE"},{"inputs":"4\nCOPY x\nCOPY y\nCLEAR\nPASTE"},{"inputs":"2\nCOPY good morning\nPASTE"}],"hint":"`cmd[5:]` 取得 \"COPY \" 之後的文字（文字可能有空格）。先判斷 `cmd == \"PASTE\"`、`cmd == \"CLEAR\"`，其餘便是 COPY。推入前檢查 `len(clipboard) == 5`，彈出前檢查是否空。"},{"id":"c5a-w2","pts":20,"title":"括號配對檢查","src":"堆疊應用（自擬）","q":"輸入一行算式，當中可能有 `( )`、`[ ]`、`{ }` 三種括號。用**堆疊**檢查括號是否正確配對：\n• 遇到左括號便推入；\n• 遇到右括號時，堆疊必須不是空的，而且彈出的左括號要和它同一種；\n• 讀完後堆疊必須是空的。\n正確輸出 `配對正確`，否則輸出 `配對錯誤`。","starter":"expr = input()\ns = []\nok = True\n# 在這裏完成\nif ok:\n    print(\"配對正確\")\nelse:\n    print(\"配對錯誤\")","ref":"expr = input()\ns = []\nok = True\npairs = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}\nfor ch in expr:\n    if ch in \"([{\":\n        s.append(ch)\n    elif ch in \")]}\":\n        if len(s) == 0:\n            ok = False\n        elif s.pop() != pairs[ch]:\n            ok = False\nif len(s) > 0:\n    ok = False\nif ok:\n    print(\"配對正確\")\nelse:\n    print(\"配對錯誤\")","rules":[{"must":"append","msg":"要用列表作堆疊（append 推入、pop 彈出）。"}],"tests":[{"inputs":"(a+b)*[c-d]"},{"inputs":"{[(x)]}"},{"inputs":"([)]"},{"inputs":"((a+b)"},{"inputs":"a+b)"},{"inputs":"x+y"}],"hint":"可以用字典 `{\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}` 找出右括號對應的左括號。記得三種錯誤：右括號時堆疊是空的、種類不同、最後堆疊不是空的。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.155–165、p.203–204","items":[{"id":"c5a-q1","pts":4,"src":"教科書 p.160 例題 5.1(d)（參考 DSE 2019 卷二D Q1）","tags":[{"t":"hot","why":"堆疊操作空運行：DSE 2017 卷二D Q3（瀏覽器上一頁／下一頁）、2019 卷二D Q1（膠箱堆疊）"}],"verify":true,"q":"以下程式的輸出是什麼？","code":"def reverse(A, B):\n    while len(A) > 0:\n        B.append(A.pop())\n\nS1 = [7, 3, 9, 4, 6]\nS2 = []\nreverse(S1, S2)\nS2.pop()\nS2.pop()\nreverse(S2, S1)\nprint(S1)","options":["[7, 3, 9]","[9, 4, 6]","[6, 4, 9]","[3, 9, 4]"],"answer":"B","why":"reverse 後 S2 由底至頂是 6、4、9、3、7；彈出 7 和 3（原本最底的兩個）；再 reverse 回 S1 得 [9, 4, 6]。","_right":1},{"id":"c5a-q2","pts":4,"src":"教科書 p.165 測試站 5.1(d)（參考 DSE 2017 卷二D Q3）","tags":[{"t":"hot","why":"堆疊操作空運行：DSE 2017 卷二D Q3（瀏覽器上一頁／下一頁）、2019 卷二D Q1（膠箱堆疊）"}],"q":"瀏覽器用堆疊 goBack、goForward 實現「上一頁」「下一頁」。如果堆疊 goForward **已滿**，用戶再按「上一頁」，最合理的處理是？","options":["直接把網址推入 goForward，令上溢錯誤出現","先移除 goForward **最底層**的項目，再執行 push(goForward, pop(goBack))","先彈出 goForward 頂端的項目，再執行 push(goForward, pop(goBack))","清空 goBack"],"answer":"B","why":"最底層是最舊的網址，最少機會再用到；頂端是剛剛離開的網址，不應丟掉。","_right":1},{"id":"c5a-q3","pts":4,"src":"自擬（DSE 題型）","tags":[{"t":"trap","why":"要逐步模擬推入／彈出，不能只看數字次序"}],"q":"把 1、2、3、4 **依次**推入一個空的堆疊，期間可以隨時彈出。以下哪一個彈出次序是**不可能**的？","options":["4 3 2 1","1 2 3 4","2 4 3 1","3 1 4 2"],"answer":"D","why":"要先彈出 3，1、2 必定已推入且 2 在 1 之上，所以下一個彈出的只能是 2 或 4，不可能是 1。","_right":3},{"id":"c5a-q4","pts":4,"src":"教科書 p.204 課題練習 1(d)(ii)","q":"剪貼簿以陣列 `clipboard` 及變量 `latest`（頂端項目的索引）實現堆疊。以下哪一項是用變量儲存頂端索引的**好處**？","options":["陣列可以無限大","彈出時只須移動指示標，無須清除陣列內容","可以直接存取堆疊底部的項目並刪除","不會發生上溢錯誤"],"answer":"B","why":"彈出只是 `latest = latest - 1`；之後推入新項目時便覆寫舊內容。","_right":1},{"id":"c5a-q5","pts":4,"src":"教科書 p.155 調用堆疊","verify":true,"q":"以下程式的輸出是什麼？","code":"def c():\n    print(\"C\", end=\" \")\n\ndef b():\n    print(\"B1\", end=\" \")\n    c()\n    print(\"B2\", end=\" \")\n\ndef a():\n    print(\"A1\", end=\" \")\n    b()\n    print(\"A2\", end=\" \")\n\na()","options":["A1 B1 C B2 A2","A1 A2 B1 B2 C","A1 B1 B2 C A2","C B2 B1 A2 A1"],"answer":"A","why":"子程式完成後，從調用堆疊彈出返回位置，回到調用它的下一句繼續：c 完成回到 b，b 完成回到 a。","_right":0}]},{"id":"more","kind":"endless","title":"無限練習","gens":["pyStack","pyList","pyFunc"],"intro":"隨機生成堆疊（推入／彈出）、列表及子程式的題目，答案由程式計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]},{"id":"c5b","title":"數據結構（二）：隊列","book":"教科書 選修C 第 5 章 p.166–182（另有 p.204–206 課題練習 2、3）","key":"C-c5b-hmac-3e1fa86b8b","sections":[{"id":"s1","title":"隊列的概念及 Python 操作","pages":"教科書 p.166–168、p.182","learn":[{"pts":["**隊列（queue）**：**先進先出法（FIFO）**。好像餐廳外排隊：第一個到的人第一個入座。（p.166）","**排隊（enqueue）**：把數據加到隊列**末端**；**離隊（dequeue）**：從隊列**前端**取出最先加入的數據。（p.166）","應用：列印機的列印隊列，按送出次序完成任務。（p.167）","類比：堆疊像疊起的汽水籃（後進先出）；隊列像便利店雪櫃，職員從後方放入、顧客從前方取出（先進先出）。（p.182）"]},{"table":{"head":["隊列的操作","Python 列表的操作","描述"],"rows":[["定義隊列","`the_queue = []`","建立一個空列表"],["排隊","`the_queue.append(item)`","把 item 加到列表末端"],["離隊","`the_queue.pop(0)`","傳回並刪除列表**首項**"]]},"cap":"表：隊列在 Python 的操作（p.167）。和堆疊只差在 `pop(0)`（首項）與 `pop()`（末項）。"},{"sim":{"code":"the_queue = []\nthe_queue.append(\"A\")\nthe_queue.append(\"B\")\nthe_queue.append(\"C\")\ntemp = the_queue.pop(0)\ntemp = the_queue.pop(0)\nthe_queue.append(\"D\")\nprint(the_queue, temp)","step":true,"open":["vars"]},"cap":"教科書 p.167–168 的例子。"}],"tries":[{"id":"c5b-s1-t1","pts":4,"src":"教科書 p.167–168 隊列在 Python 的操作","code":"the_queue = []\nthe_queue.append(\"A\")\nthe_queue.append(\"B\")\nthe_queue.append(\"C\")\ntemp = the_queue.pop(0)\ntemp = the_queue.pop(0)\nthe_queue.append(\"D\")\nprint(the_queue, temp)","q":"先估：輸出是什麼？","options":["['C', 'D'] B","['A', 'D'] B","['C', 'D'] A","['A', 'B', 'D'] C"],"why":"`pop(0)` 先取出 A，再取出 B（temp 最後是 B）；隊列剩 C，再排入 D。和 c5a 的堆疊例子比較一下。","_right":0,"_ans":"['C', 'D'] B"}],"practice":[{"id":"c5b-s1-p1","type":"mc","pts":2,"src":"教科書 p.182 類比","q":"便利店職員從雪櫃**後方**放入汽水，顧客從**前方**取出。這個模式對應哪一種數據結構？","options":["堆疊","隊列","鏈表","二維陣列"],"answer":1,"hint":"最先放入的汽水最先被取出：先進先出。","_right":1},{"id":"c5b-s1-p2","type":"fill","pts":3,"src":"自擬","q":"寫出輸出的兩行（每格填一行）。","code":"q = []\ns = []\nfor x in [3, 6, 9, 12]:\n    q.append(x)\n    s.append(x)\nq.pop(0)\ns.pop()\nq.append(15)\ns.append(15)\nprint(q[0], q[-1])\nprint(s[0], s[-1])","blanks":[{"label":"隊列 q 的首項、末項","a":"6 15"},{"label":"堆疊 s 的底部、頂端","a":"3 15"}],"hint":"隊列離隊取走 3；堆疊彈出取走 12。之後兩者都在末端加入 15。","_ans":["6 15","3 15"]}]},{"id":"s2","title":"以陣列顯示的隊列：移位","pages":"教科書 p.168–171","learn":[{"pts":["例題 5.2：陣列 Q（大小 10）以隊列方式操作，`item(Q)` 是項目數量。（p.168–169，參考 DSE 2020 卷二D Q3）","**排隊**：未滿便存入「項目數量 + 1」的位置（Python 索引由 0 開始，即 `Q[count]`），然後 count 加 1。","**離隊**：取出 Q 的首項，之後的項目**逐一往前移**一格，count 減 1。","這個方法簡單直接，但**不是好算法**：每次離隊都要移動其餘所有項目，執行步數大增，效率低。（p.171 想像，參考 DSE 2012 練習卷 卷二D Q2(a)(ii)）"]},{"sim":{"code":"Q = [93, 44, 70, 77, 29, \"\", \"\", \"\", \"\", \"\"]\ncount = 5\n\ndef enq(num):\n    global count\n    if count == 10:\n        print(\"不成功\")\n    else:\n        Q[count] = num\n        count = count + 1\n\ndef deq():\n    global count\n    if count == 0:\n        print(\"不成功\")\n        return \"\"\n    temp = Q[0]\n    for i in range(0, count - 1):\n        Q[i] = Q[i + 1]\n    Q[count - 1] = \"\"\n    count = count - 1\n    return temp\n\nenq(20)\ndeq()\ndeq()\nprint(Q)","step":true,"open":["vars"]},"cap":"例題 5.2(a)（p.169）改用 Python（索引由 0 開始）。按「下一步」看離隊時項目怎樣一格一格往前移。"},{"fix":{"bad":"Q = [\"\", \"\", \"\"]\ncount = 0\n\ndef deq():\n    global count\n    if count == 0:\n        print(\"不成功\")\n    else:\n        temp = Q[0]\n        count = count - 1\n    return temp\n\nprint(deq())","good":"Q = [\"\", \"\", \"\"]\ncount = 0\n\ndef deq():\n    global count\n    if count == 0:\n        print(\"不成功\")\n        temp = \"\"\n    else:\n        temp = Q[0]\n        count = count - 1\n    return temp\n\nprint(deq())","why":"教科書 p.171 例題 5.2(d) 的 deq 在隊列是空時沒有為 temp 賦值，卻在最後「傳回 temp」。在 Python 會出 **UnboundLocalError**。每個分支都要令 temp 有值（或者在空的分支直接 `return`）。"}}],"tries":[{"id":"c5b-s2-t1","pts":4,"src":"教科書 p.169 例題 5.2(a)（參考 DSE 2020 卷二D Q3）","code":"Q = [93, 44, 70, 77, 29, \"\", \"\", \"\", \"\", \"\"]\ncount = 5\n\ndef enq(num):\n    global count\n    if count == 10:\n        print(\"不成功\")\n    else:\n        Q[count] = num\n        count = count + 1\n\ndef deq():\n    global count\n    if count == 0:\n        print(\"不成功\")\n        return \"\"\n    temp = Q[0]\n    for i in range(0, count - 1):\n        Q[i] = Q[i + 1]\n    Q[count - 1] = \"\"\n    count = count - 1\n    return temp\n\nenq(20)\ndeq()\ndeq()\nprint(Q[:count])","q":"先估：輸出是什麼？","options":["[70, 77, 29, 20]","[93, 44, 70, 77]","[44, 70, 77, 29, 20]","[77, 29, 20]"],"why":"20 排在 29 之後；兩次離隊移走最前的 93 和 44，其餘往前移。","_right":0,"_ans":"[70, 77, 29, 20]"}],"practice":[{"id":"c5b-s2-p1","type":"complete","pts":3,"src":"教科書 p.170 例題 5.2(c)","q":"完成 `enq(num)`（Python 索引由 0 開始，count 是項目數量，陣列大小 10）。程式會輸入要排隊的數目 k，把 1、2、…、k 排入隊列。","template":"Q = [\"\"] * 10\ncount = 0\n\ndef enq(num):\n    global count\n    if ［1］:\n        print(\"不成功\")\n    else:\n        ［2］\n        count = count + 1\n\nk = int(input())\nfor x in range(1, k + 1):\n    enq(x)\nprint(count, Q)","ref":["count == 10","Q[count] = num"],"tests":[{"inputs":"3"},{"inputs":"10"},{"inputs":"12"}],"hint":"教科書寫 `isFull(Q)` 及 `Q[item(Q) + 1] ← num`（索引由 1 開始）；Python 索引由 0 開始，下一個空位就是 `Q[count]`。"},{"id":"c5b-s2-p2","type":"mc","pts":2,"src":"教科書 p.171 想像（參考 DSE 2012 練習卷 卷二D Q2(a)(ii)）","q":"例題 5.2 的 deq(Q) 每次離隊都把其餘項目往前移。為什麼它**不是一個好算法**？","options":["它會令隊列變成後進先出","每次離隊都要逐一移動其餘項目，執行步數多，效率低","它不能處理空的隊列","它會浪費陣列前端的空間"],"answer":1,"hint":"項目越多，每次離隊要移動的項目越多。用兩個指示標便不用移位（下一節）。","_right":1}]},{"id":"s3","title":"以指示標操作的隊列","pages":"教科書 p.172–173、p.204–205","learn":[{"pts":["用兩個**指示標**：`head` 指向**前端**項目，`tail` 指向**末端**項目。排隊時 tail 加 1；離隊時 head 加 1，**不用移動項目**。（p.172）","head 和 tail 指向同一項目，代表隊列只有一個項目。（p.172）","測試站 5.2：列車排隊進入月台，P 是前端索引、Q 是末端索引（索引由 1 開始）。新列車：Q 加 1，存入 `T[Q]`；列車進入月台：P 加 1。（p.173，參考 DSE 2012 練習卷 卷二D Q2(b)）","所有列車都已進入月台（隊列是空的）的條件：**`P > Q`**。","缺點：tail 到達陣列盡頭便不能再加項目，前面已離隊的位置也不能重用 → **上溢錯誤**（Python 中是 IndexError）。解決方法：**循環隊列**。（p.173–174）"]},{"sim":{"code":"T = [\"\"] * 9          # 用索引 1–8\nT[1] = \"T123\"\nT[2] = \"T746\"\nP = 1\nQ = 2\n\ndef arrive(train):\n    global Q\n    Q = Q + 1\n    T[Q] = train\n\ndef leave():\n    global P\n    P = P + 1\n\nleave()\narrive(\"T136\")\narrive(\"T587\")\narrive(\"T364\")\nprint(P, Q)","step":true,"open":["vars"]},"cap":"測試站 5.2(a)(i)（p.173）。留意 leave() 沒有清除 T[1]，只是 P 加 1。"}],"tries":[{"id":"c5b-s3-t1","pts":4,"src":"教科書 p.173 測試站 5.2(a)（參考 DSE 2012 練習卷 卷二D Q2(b)）","code":"T = [\"\"] * 9\nT[1] = \"T123\"\nT[2] = \"T746\"\nP = 1\nQ = 2\n\ndef arrive(train):\n    global Q\n    Q = Q + 1\n    T[Q] = train\n\ndef leave():\n    global P\n    P = P + 1\n\nleave()\narrive(\"T136\")\narrive(\"T587\")\narrive(\"T364\")\nleave()\nleave()\narrive(\"T269\")\narrive(\"T785\")\narrive(\"T468\")\nprint(P, Q, T[P])","q":"先估：輸出是什麼？","options":["4 8 T587","3 8 T136","4 8 T364","1 8 T123"],"why":"P 由 1 加三次得 4；Q 由 2 加六次得 8。前端項目 T[4] 是 T587。","_right":0,"_ans":"4 8 T587"}],"practice":[{"id":"c5b-s3-p1","type":"fill","pts":2,"src":"教科書 p.204 課題練習 2(a)（參考 DSE 2012 練習卷 卷二D Q2(b)）","q":"陣列 W（索引 0–9）儲存輪候客人的號碼，A 是前端索引、B 是末端索引。寫出 A 和 B 的最後數值。","code":"W = [9874, 6587, 6325, 0, 0, 0, 0, 0, 0, 0]\nA = 0\nB = 2\n# 首兩枱客人進入餐廳\nA = A + 2\n# 三枱客人加入輪候\nfor no in [9458, 9256, 6883]:\n    B = B + 1\n    W[B] = no\n# 再有三枱客人進入餐廳，兩枱加入輪候\nA = A + 3\nfor no in [6472, 9390]:\n    B = B + 1\n    W[B] = no","blanks":[{"label":"A","ask":{"var":"A"}},{"label":"B","ask":{"var":"B"}}],"hint":"課題練習 2(a)(i) 答案 A = 2、B = 5；(ii) 再計下去。","_ans":["5","7"]},{"id":"c5b-s3-p2","type":"mc","pts":2,"src":"教科書 p.205 課題練習 2(c)(i)","verify":true,"ask":{"error":true},"q":"接上題（B = 7），再有五枱客人加入輪候。執行時會出現什麼錯誤？","code":"W = [9874, 6587, 6325, 9458, 9256, 6883, 6472, 9390, 0, 0]\nB = 7\nfor no in [1111, 2222, 3333, 4444, 5555]:\n    B = B + 1\n    W[B] = no","options":["IndexError","ValueError","ZeroDivisionError","沒有錯誤"],"answer":0,"hint":"B 加到 10 時，W[10] 超出索引 0–9 的範圍：上溢錯誤。教科書建議用循環隊列解決（2(c)(ii)）。","_right":0},{"id":"c5b-s3-p3","type":"mc","pts":2,"src":"教科書 p.173 測試站 5.2(b)","q":"列車隊列中 P 是前端索引、Q 是末端索引。以下哪個條件表示**所有列車都已進入月台**？","options":["P == Q","P > Q","P \u003c Q","Q == 8"],"answer":1,"hint":"只剩一班車時 P == Q；這班車進入月台後 P 再加 1。","_right":1}]},{"id":"s4","title":"循環隊列","pages":"教科書 p.174–182、p.205–206","learn":[{"pts":["**循環隊列**：指示標到達陣列末端後，下一個值**重設為陣列最前端的索引**，令陣列首尾相連，可以重用已離隊的位置。（p.174）","Python 寫法：`tail = (tail + 1) % SIZE`、`head = (head + 1) % SIZE`。例如大小 8：7 的下一個是 (7 + 1) % 8 = 0。","單靠 head、tail 的位置**無法分辨隊列是空還是滿**，所以要另加變量 **N 記錄項目數量**：N = 0 是空（下溢），N = 陣列大小是滿（上溢）。（p.175 提示）","例題 5.3：已知首位索引 first 及人數 N（大小 10），最後一位的索引是 `(first + N - 1) % 10`。（p.176–179，參考 DSE 2020 卷二D Q3、2016 卷二D Q2）","測試站 5.3：已知下一個空位 next 及車數 wait，首位索引是 `next - wait`；若是負數便加 N。（p.181）"]},{"sim":{"code":"T = [\"\"] * 10\nT[7] = \"Lisa\"\nT[8] = \"Susan\"\nT[9] = \"Ben\"\nN = 3          # 輪候人數\nfirst = 7      # 首位客戶的索引\n\ndef last():\n    if (first + N - 1) \u003c= 9:\n        return first + N - 1\n    else:\n        return (first + N - 1) % 10\n\ndef addQ(name):\n    global N\n    if N == 10:\n        print(\"服務繁忙\")\n    else:\n        T[(last() + 1) % 10] = name\n        N = N + 1\n\ndef delQ():\n    global N, first\n    if N == 0:\n        temp = \"不成功\"\n    else:\n        temp = T[first]\n        T[first] = \"\"\n        N = N - 1\n        if first == 9:\n            first = 0\n        else:\n            first = first + 1\n    return temp\n\ndelQ()\naddQ(\"Katie\")\naddQ(\"Dan\")\ndelQ()\ndelQ()\naddQ(\"Alan\")\ndelQ()\naddQ(\"Ellen\")\nprint(T)\nprint(N, first, last())","step":true,"open":["vars"]},"cap":"例題 5.3（p.176–179）：VIP 櫃位取票。留意 Katie 存入 T[0]：T[9] 的下一個是 T[0]。"}],"tries":[{"id":"c5b-s4-t1","pts":4,"src":"教科書 p.176–177 例題 5.3(a)（參考 DSE 2020 卷二D Q3）","code":"T = [\"\"] * 10\nT[7] = \"Lisa\"\nT[8] = \"Susan\"\nT[9] = \"Ben\"\nN = 3          # 輪候人數\nfirst = 7      # 首位客戶的索引\n\ndef last():\n    if (first + N - 1) \u003c= 9:\n        return first + N - 1\n    else:\n        return (first + N - 1) % 10\n\ndef addQ(name):\n    global N\n    if N == 10:\n        print(\"服務繁忙\")\n    else:\n        T[(last() + 1) % 10] = name\n        N = N + 1\n\ndef delQ():\n    global N, first\n    if N == 0:\n        temp = \"不成功\"\n    else:\n        temp = T[first]\n        T[first] = \"\"\n        N = N - 1\n        if first == 9:\n            first = 0\n        else:\n            first = first + 1\n    return temp\n\ndelQ()\naddQ(\"Katie\")\naddQ(\"Dan\")\ndelQ()\ndelQ()\naddQ(\"Alan\")\ndelQ()\naddQ(\"Ellen\")\nprint(N, first, last())","q":"先估：輸出 N、first、last() 是什麼？","options":["3 1 3","3 0 2","4 1 4","3 8 0"],"why":"答案與教科書相同：T 剩 Dan（索引 1）、Alan（2）、Ellen（3），所以 N = 3、first = 1、last() = 3。","_right":0,"_ans":"3 1 3"},{"id":"c5b-s4-t2","pts":4,"src":"教科書 p.205 課題練習 3(a)","code":"pending = [0, 0, 0, 0, 0, 13, 14, 15]\nstart = 5\nend = 7\n\ndef F1():\n    global end\n    temp = pending[end] + 1\n    end = (end + 1) % 8\n    pending[end] = temp\n\ndef F2():\n    global start\n    pending[start] = 0\n    start = (start + 1) % 8\n\nF2()\nF2()\nF1()\nF1()\nF1()\nprint(pending, start, end)","q":"先估：輸出是什麼？","options":["[16, 17, 18, 0, 0, 0, 0, 15] 7 2","[16, 17, 18, 0, 0, 13, 14, 15] 5 2","[0, 0, 0, 0, 0, 16, 17, 18] 7 2","[16, 17, 18, 0, 0, 0, 0, 15] 7 3"],"why":"F2 清除前端並令 start 加 1（5 → 6 → 7）；F1 在末端加入下一個編號，end 由 7 繞回 0、1、2。","_right":0,"_ans":"[16, 17, 18, 0, 0, 0, 0, 15] 7 2"}],"practice":[{"id":"c5b-s4-p1","type":"complete","pts":3,"src":"教科書 p.181 測試站 5.3(d)（參考 DSE 2016 卷二D Q2）","q":"完成循環隊列的 `push(no)`（N = 6；教科書的 next 改名 nxt）。程式會輸入要加入的車數 k。","template":"N = 6\nTAXI = [\"\"] * N\nnxt = 0\nwait = 0\n\ndef push(no):\n    global nxt, wait\n    if ［1］:\n        print(\"隊列已滿\")\n    else:\n        TAXI[nxt] = no\n        nxt = ［2］\n        wait = ［3］\n\nk = int(input())\nfor i in range(k):\n    push(\"C\" + str(i))\nprint(TAXI, nxt, wait)","ref":["wait == N","(nxt + 1) % N","wait + 1"],"tests":[{"inputs":"3"},{"inputs":"6"},{"inputs":"8"}],"hint":"滿的條件是車數等於 N；nxt 到了 N − 1 之後要繞回 0，所以用 `% N`。"},{"id":"c5b-s4-p2","type":"mc","pts":3,"src":"教科書 p.206 課題練習 3(b)（答案有漏洞，見本單元檔頭）","verify":true,"tags":[{"t":"trap","why":"循環隊列全滿時 start = (end + 1) % 8"}],"q":"用教科書 printQ() 的循環條件。隊列**全滿**（8 個編號，start = 0、end = 7）時，以下程式輸出什麼？","code":"pending = [11, 12, 13, 14, 15, 16, 17, 18]\nstart = 0\nend = 7\nshown = 0\ni = start\nwhile i != (end + 1) % 8:\n    shown = shown + 1\n    i = (i + 1) % 8\nprint(shown)","options":["8","7","0","1"],"answer":2,"hint":"(7 + 1) % 8 = 0，一開始 i = 0 已等於它，循環一次也不執行。要改用人數 Q 控制循環，例如 `for j in range(Q)`。","_right":2},{"id":"c5b-s4-p3","type":"fill","pts":3,"src":"教科書 p.180 測試站 5.3(b)","q":"執行測試站 5.3(b) 的操作後，寫出 nxt（教科書的 next）、wait 及首位車牌。","code":"N = 6\nTAXI = [\"\"] * N\nnxt = 0        # 下一架車的等候位置（教科書叫 next）\nwait = 0       # 正在等候的車數\n\ndef start():\n    if nxt - wait >= 0:\n        return nxt - wait\n    else:\n        return nxt - wait + N\n\ndef push(no):\n    global nxt, wait\n    if wait == N:\n        print(\"隊列已滿\")\n    else:\n        TAXI[nxt] = no\n        nxt = (nxt + 1) % N\n        wait = wait + 1\n\ndef pop():\n    global wait\n    if wait == 0:\n        print(\"沒有計程車\")\n        return \"\"\n    temp = TAXI[start()]\n    wait = wait - 1\n    return temp\n\npush(\"AB1234\")\npush(\"HD764\")\npush(\"KL2510\")\npush(\"GC646\")\npop()\npop()\npush(\"SC343\")\npush(\"NN203\")\npop()\npush(\"ST546\")\nfirst_car = TAXI[start()]","blanks":[{"label":"nxt","ask":{"var":"nxt"}},{"label":"wait","ask":{"var":"wait"}},{"label":"首位車牌","ask":{"var":"first_car"}}],"hint":"教科書答案 next = 1、wait = 4。首位索引 = nxt − wait + N = 1 − 4 + 6。","_ans":["1","4","GC646"]}]},{"id":"write","kind":"write","title":"寫程式","pages":"教科書 p.167、p.174–182","intro":"在編輯器寫 Python 程式，先按 ▶ 自己測試，再按「提交評核」。每個 `input()` 讀一行輸入。","tasks":[{"id":"c5b-w1","pts":15,"title":"餐廳輪候（Python 列表隊列）","src":"教科書 p.166–168","q":"第一行輸入指令數目 n，之後每行一個指令：\n• `JOIN 名字`：客人排隊。\n• `SEAT`：最先排隊的客人入座，輸出 `請 名字 入座`；沒有人輪候便輸出 `沒有客人`。\n全部指令完成後，輸出仍在輪候的人數。","starter":"queue = []\nn = int(input())\nfor i in range(n):\n    cmd = input()\n    # 在這裏完成\nprint(len(queue))","ref":"queue = []\nn = int(input())\nfor i in range(n):\n    cmd = input()\n    if cmd == \"SEAT\":\n        if len(queue) == 0:\n            print(\"沒有客人\")\n        else:\n            print(\"請\", queue.pop(0), \"入座\")\n    else:\n        queue.append(cmd[5:])\nprint(len(queue))","tests":[{"inputs":"5\nJOIN Amy\nJOIN Ben\nSEAT\nJOIN Cat\nSEAT"},{"inputs":"2\nSEAT\nJOIN Dan"},{"inputs":"4\nJOIN A\nSEAT\nSEAT\nJOIN B"},{"inputs":"3\nJOIN Mr Chan\nJOIN Ken\nSEAT"}],"hint":"`cmd[5:]` 取得 \"JOIN \" 之後的名字。離隊用 `pop(0)`，離隊前檢查是否空。`print(\"請\", name, \"入座\")` 會自動以空格分隔。"},{"id":"c5b-w2","pts":20,"title":"循環隊列（陣列 + 指示標）","src":"教科書 p.174–182","q":"用大小 4 的陣列 `Q` 實現**循環隊列**，`head` 是前端索引，`count` 是項目數量（已寫好）。第一行輸入指令數目 n，之後每行一個指令：\n• `ENQ 數字`：如果已滿，輸出 `隊列已滿`；否則把數字（整數）存入 `Q[(head + count) % 4]`，count 加 1。\n• `DEQ`：如果是空的，輸出 `隊列是空的`；否則輸出 `Q[head]`，head 前進一格（到 3 之後回到 0），count 減 1。**離隊時不用清除陣列內容。**\n全部指令完成後，輸出 `Q`、`head`、`count`（一行，用 `print(Q, head, count)`）。\n**不可**使用 `append`、`pop`。","starter":"Q = [0, 0, 0, 0]\nhead = 0\ncount = 0\nn = int(input())\nfor i in range(n):\n    cmd = input()\n    # 在這裏完成\nprint(Q, head, count)","ref":"Q = [0, 0, 0, 0]\nhead = 0\ncount = 0\nn = int(input())\nfor i in range(n):\n    cmd = input()\n    if cmd == \"DEQ\":\n        if count == 0:\n            print(\"隊列是空的\")\n        else:\n            print(Q[head])\n            head = (head + 1) % 4\n            count = count - 1\n    else:\n        if count == 4:\n            print(\"隊列已滿\")\n        else:\n            Q[(head + count) % 4] = int(cmd[4:])\n            count = count + 1\nprint(Q, head, count)","rules":[{"mustNot":"append","msg":"這題要用陣列和指示標，不可用 append。"},{"mustNot":"pop(","msg":"這題要用陣列和指示標，不可用 pop()。"},{"must":"%","msg":"循環隊列要用 % 令索引繞回 0。"}],"tests":[{"inputs":"6\nENQ 5\nENQ 8\nDEQ\nENQ 2\nDEQ\nDEQ"},{"inputs":"2\nDEQ\nENQ 7"},{"inputs":"9\nENQ 1\nENQ 2\nENQ 3\nDEQ\nDEQ\nENQ 4\nENQ 5\nENQ 6\nENQ 7"},{"inputs":"7\nENQ 10\nENQ 20\nENQ 30\nENQ 40\nDEQ\nENQ 50\nDEQ"}],"hint":"末端的下一個空位是 `(head + count) % 4`。滿的條件 `count == 4`，空的條件 `count == 0`。`int(cmd[4:])` 取得 \"ENQ \" 之後的數字。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.171–182","items":[{"id":"c5b-q1","pts":4,"src":"教科書 p.178 例題 5.3(e)（參考 DSE 2020 卷二D Q3）","tags":[{"t":"hot","why":"隊列／循環隊列：DSE 2012 練習卷 卷二D Q2、2016 卷二D Q2、2020 卷二D Q3"}],"verify":true,"q":"陣列 T 的索引由 0 至 9，以循環隊列儲存輪候客戶。first 是首位客戶的索引，N 是人數。以下程式的輸出是什麼？","code":"first = 7\nN = 5\nprint((first + N - 1) % 10)","options":["11","1","2","0"],"answer":"B","why":"客戶在索引 7、8、9、0、1；最後一位的索引是 (7 + 5 − 1) % 10 = 1。","_right":1},{"id":"c5b-q2","pts":4,"src":"教科書 p.181 測試站 5.3(c)（參考 DSE 2016 卷二D Q2）","tags":[{"t":"hot","why":"隊列／循環隊列：DSE 2012 練習卷 卷二D Q2、2016 卷二D Q2、2020 卷二D Q3"}],"verify":true,"q":"計程車循環隊列大小 N = 6，nxt 是下一架車的等候位置，wait 是車數。以下程式的輸出是什麼？","code":"N = 6\nnxt = 1\nwait = 4\nif nxt - wait >= 0:\n    print(nxt - wait)\nelse:\n    print(nxt - wait + N)","options":["-3","3","5","1"],"answer":"B","why":"1 − 4 = −3 是負數，要加 N：首位在索引 3（車輛在 3、4、5、0）。","_right":1},{"id":"c5b-q3","pts":4,"src":"教科書 p.175 提示","q":"使用循環隊列時，為什麼要額外使用一個變量 N 記錄項目數量？","options":["因為 Python 列表沒有 len()","因為單靠 head 和 tail 的位置無法判斷隊列是空的還是滿的","因為循環隊列只能儲存 N 個項目","因為要計算平均輪候時間"],"answer":"B","why":"空的隊列和滿的隊列，head 與 tail 的相對位置可以一樣（p.175 兩幅圖）。","_right":1},{"id":"c5b-q4","pts":4,"src":"教科書 p.173–174、p.205 課題練習 2(c)","tags":[{"t":"hot","why":"隊列／循環隊列：DSE 2012 練習卷 卷二D Q2、2016 卷二D Q2、2020 卷二D Q3"}],"q":"用陣列及兩個指示標實現**非循環**的隊列。即使前端已有很多項目離隊，末端指示標到達陣列盡頭後仍不能再排隊。以下哪項是最合適的解決方法？","options":["每次離隊把所有項目往前移一格","使用循環隊列：指示標到達陣列末端後重設為最前端的索引","把隊列改為堆疊","離隊時把項目設為空字串"],"answer":"B","why":"往前移雖然可行但效率低（例題 5.2 想像）；循環隊列可重用已離隊的位置。","_right":1},{"id":"c5b-q5","pts":4,"src":"自擬","verify":true,"q":"以下程式的輸出是什麼？","code":"q = []\nfor x in [4, 8, 1, 6]:\n    q.append(x)\na = q.pop(0)\nb = q.pop(0)\nq.append(a + b)\nq.pop(0)\nprint(q)","options":["[6, 12]","[1, 6]","[8, 1, 6]","[4, 8, 12]"],"answer":"A","why":"離隊 4、8，排入 12：[1, 6, 12]；再離隊 1，剩 [6, 12]。","_right":0}]},{"id":"more","kind":"endless","title":"無限練習","gens":["pyQueue","pyStack","pyList"],"intro":"隨機生成隊列、堆疊及列表的題目，答案由程式計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]},{"id":"c5c","title":"數據結構（三）：線性鏈表","book":"教科書 選修C 第 5 章 p.183–200（另有 p.206–207 課題練習 4）","key":"C-c5c-hmac-973db88220","sections":[{"id":"s1","title":"鏈表的概念","pages":"教科書 p.149、p.183–186","learn":[{"pts":["**鏈表（linked list）**由許多**節點（node）**組成；每個節點儲存**數據**和一個**指示標**，指示標儲存**下一個節點**的位址（或索引）。（p.183）","**首項指示標**指向第一個節點；最後一個節點的指示標是**空值指示標（null pointer）**，常用 −1 表示。（p.183）","**刪除節點**：把上一個節點的指示標改為指向下一個節點，繞過被刪除的節點。被繞過的節點已無法存取，不必改它的指示標。（p.183）","**加入節點**：① 先令新節點的指示標指向下一個節點；② 再令上一個節點指向新節點。次序調轉的話，下一個節點會失去指向它的指示標（內存泄漏）。（p.183 試想想）","應用：檔案系統用鏈表連結一個檔案的所有分段（磁碟碎片化）。區塊鏈的概念也和鏈表相似。（p.149、p.184–185）"]},{"table":{"head":["","鏈表","陣列"],"rows":[["儲存的數據類型","不同類型","相同類型"],["數據存取方法","順序存取（跟着指示標由頭找）","直接存取／隨機存取（用索引）"],["存取數據的速度","慢","快"],["加入或刪除數據的速度","快（只改指示標）","慢（要移動其他項目）"]]},"cap":"表 5.1 比較鏈表和陣列（p.186）"},{"h":"以陣列顯示鏈表（例題 5.4，p.187，參考 DSE 2014 卷二D Q3(a)）"},{"pts":["用兩個列表：`content` 儲存節點內容，`pointer` 儲存下一個節點的索引。陣列內的次序**不是**鏈表的次序。","遍歷：由首個節點開始，`cur = pointer[cur]`，直至遇到空指示標 −1。","沒有任何指示標指向的位置（例如 Jordan、Wong Tai Sin）不屬於這個鏈表。"]},{"sim":{"code":"content = [\"start\", \"\", \"Yau Ma Tei\", \"Whampoa\", \"\", \"Ho Man Tin\",\n           \"Mong Kok\", \"\", \"Wong Tai Sin\", \"Jordan\"]\npointer = [3, None, 6, 5, None, 2, -1, None, -1, 2]\n\ncur = 0\nnames = []\nwhile cur != -1:\n    names.append(content[cur])\n    cur = pointer[cur]\nprint(\", \".join(names))","step":true,"open":["vars"]},"cap":"例題 5.4(a)（p.187）：按「下一步」，看 cur 怎樣跟着指示標跳：0 → 3 → 5 → 2 → 6 → −1。"}],"tries":[{"id":"c5c-s1-t1","pts":4,"src":"教科書 p.187 例題 5.4(a)(i)","code":"content = [\"start\", \"\", \"Yau Ma Tei\", \"Whampoa\", \"\", \"Ho Man Tin\",\n           \"Mong Kok\", \"\", \"Wong Tai Sin\", \"Jordan\"]\npointer = [3, None, 6, 5, None, 2, -1, None, -1, 2]\n\ncur = 0\nnames = []\nwhile cur != -1:\n    names.append(content[cur])\n    cur = pointer[cur]\nprint(\", \".join(names))","q":"先估：輸出是什麼？","options":["start, Whampoa, Ho Man Tin, Yau Ma Tei, Mong Kok","start, Yau Ma Tei, Whampoa, Ho Man Tin, Mong Kok, Wong Tai Sin, Jordan","start, Whampoa, Ho Man Tin, Yau Ma Tei, Mong Kok, Jordan","start, Jordan, Yau Ma Tei, Mong Kok"],"why":"由索引 0 開始跟指示標：0 → 3（Whampoa）→ 5（Ho Man Tin）→ 2（Yau Ma Tei）→ 6（Mong Kok）→ −1 結束。","_right":0,"_ans":"start, Whampoa, Ho Man Tin, Yau Ma Tei, Mong Kok"}],"practice":[{"id":"c5c-s1-p1","type":"mc","pts":2,"src":"教科書 p.186 表 5.1","q":"以下哪一項是鏈表**比陣列優勝**的地方？","options":["可以用索引直接存取第 k 個項目","加入或刪除數據時只須改變指示標，速度較快","佔用較少記憶體","可以用對分檢索"],"answer":1,"hint":"陣列加入或刪除要把後面的項目逐一移動；鏈表只改指示標。存取第 k 個項目則是陣列較快。","_right":1},{"id":"c5c-s1-p2","type":"mc","pts":2,"src":"教科書 p.183 試想想","q":"在節點 A、B 之間加入新節點 E。為什麼要**先**令 E 的指示標指向 B，**才**令 A 指向 E？","options":["因為 E 的數據比 A 小","若先改 A 的指示標，便沒有指示標指向 B，B 及之後的節點會失去連結（內存泄漏）","因為鏈表只可以在末端加入節點","兩個步驟的次序沒有影響"],"answer":1,"hint":"A 原本是唯一指向 B 的節點。","_right":1},{"id":"c5c-s1-p3","type":"fill","pts":2,"src":"教科書 p.187 例題 5.4(a)(ii)","q":"包括首個節點，這個鏈表共有多少個節點？最後一個節點的內容是什麼？","code":"content = [\"start\", \"\", \"Yau Ma Tei\", \"Whampoa\", \"\", \"Ho Man Tin\",\n           \"Mong Kok\", \"\", \"Wong Tai Sin\", \"Jordan\"]\npointer = [3, None, 6, 5, None, 2, -1, None, -1, 2]\ncount = 0\ncur = 0\nwhile cur != -1:\n    count = count + 1\n    last = content[cur]\n    cur = pointer[cur]","blanks":[{"label":"count","ask":{"var":"count"}},{"label":"last","ask":{"var":"last"}}],"hint":"只計跟着指示標走到的節點。","_ans":["5","Mong Kok"]}]},{"id":"s2","title":"遍歷鏈表：長度及列印","pages":"教科書 p.194–200","learn":[{"pts":["例題 5.5：陣列 `D` 儲存節點內容，陣列 `NP` 儲存下一個節點的索引；全程變量 `start` 儲存首個節點的索引；**10** 代表空指示標。（p.194）","`length()`：由 start 開始，每走一個節點 l 加 1，`next ← NP[next]`，直至遇到空指示標。（p.195 (c)）","`printList()`：同樣的循環，每次輸出 `schedule[current]`。（p.200 測試站 5.5，空指示標用 null；Python 可用 `None`）","教科書變量叫 `next`；它也是 Python 內置函數的名稱，下面程式改叫 `nxt`。"]},{"sim":{"code":"D = [\"\", \"Iris\", \"Ada\", \"Peter\", \"\", \"Ben\", \"\"]\nNP = [0, 2, 10, 1, 0, 3, 0]\nstart = 5\n\ndef length():\n    l = 0\n    nxt = start\n    while nxt != 10:\n        l = l + 1\n        print(D[nxt])\n        nxt = NP[nxt]\n    return l\n\nprint(\"長度:\", length())","step":true,"open":["vars"]},"cap":"例題 5.5(a)、(c)（p.194–197）：索引 0 不用，跟教科書一樣由 1 開始。"}],"tries":[{"id":"c5c-s2-t1","pts":4,"src":"教科書 p.194 例題 5.5(a)(i)","code":"D = [\"\", \"Iris\", \"Ada\", \"Peter\", \"\", \"Ben\", \"\"]\nNP = [0, 2, 10, 1, 0, 3, 0]\nstart = 5\nnxt = start\nwhile nxt != 10:\n    print(D[nxt], end=\" \")\n    nxt = NP[nxt]","q":"先估：輸出是什麼？","options":["Ben Peter Iris Ada","Iris Ada Peter Ben","Ben Iris Ada","Ada Iris Peter Ben"],"why":"5（Ben）→ NP[5] = 3（Peter）→ NP[3] = 1（Iris）→ NP[1] = 2（Ada）→ NP[2] = 10，結束。","_right":0,"_ans":"Ben Peter Iris Ada"}],"practice":[{"id":"c5c-s2-p1","type":"complete","pts":3,"src":"教科書 p.195 例題 5.5(c)","q":"完成子程式 `length()`。程式會輸入首個節點的索引 start（測試會用不同的 start）。","template":"D = [\"\", \"Iris\", \"Ada\", \"Peter\", \"\", \"Ben\", \"\"]\nNP = [0, 2, 10, 1, 0, 3, 0]\nstart = int(input())\n\ndef length():\n    l = 0\n    nxt = start\n    while nxt != ［1］:\n        l = ［2］\n        nxt = ［3］\n    return l\n\nprint(length())","ref":["10","l + 1","NP[nxt]"],"tests":[{"inputs":"5"},{"inputs":"3"},{"inputs":"2"}],"hint":"空指示標是 10；指示標向前移動：`nxt = NP[nxt]`。"},{"id":"c5c-s2-p2","type":"complete","pts":3,"src":"教科書 p.200 測試站 5.5(b)","q":"完成 `printList()`，順序列印時間表的活動。空指示標用 `None`。程式會輸入首個節點的索引 monday。","template":"schedule = [\"dinner\", \"japanese\", \"painting\", \"\", \"yoga\", \"tea\"]\nptr = [2, None, 5, None, 1, 4]\nmonday = int(input())\n\ndef printList():\n    current = ［1］\n    while current != ［2］:\n        print(［3］)\n        current = ［4］\n\nprintList()","ref":["monday","None","schedule[current]","ptr[current]"],"tests":[{"inputs":"2"},{"inputs":"0"},{"inputs":"4"}],"hint":"教科書答案：monday、null（Python 用 None）、schedule[current]、ptr[current]。"},{"id":"c5c-s2-p3","type":"fill","pts":2,"src":"教科書 p.206 課題練習 4(a)","q":"定向活動的檢查點鏈表（索引 1–10，−1 代表空指示標），首個檢查點的索引是 7。寫出檢查點數目及最後一個檢查點。","code":"CP = [\"\", \"cinema\", \"\", \"gas station\", \"\", \"substation\", \"coffee shop\", \"park\", \"\", \"sports ground\", \"hotel\"]\nP = [0, 6, 0, -1, 0, 9, 5, 1, 0, -1, 3]\ncur = 7\ncount = 0\nwhile cur != -1:\n    count = count + 1\n    last = CP[cur]\n    cur = P[cur]","blanks":[{"label":"count","ask":{"var":"count"}},{"label":"last","ask":{"var":"last"}}],"hint":"park → cinema → coffee shop → substation → sports ground。gas station、hotel 不在這個鏈表內。","_ans":["5","sports ground"]}]},{"id":"s3","title":"刪除節點","pages":"教科書 p.183、p.187–189、p.195–198","learn":[{"pts":["刪除**第一個**節點：只須 `start ← NP[start]`。（例題 5.5(d)，p.197）","刪除第 n 個節點（n ≥ 2）：用 `prev`、`current` 兩個指示標，由第 1、2 個節點開始一起向前移，直至 current 到達第 n 個節點；然後 `NP[prev] ← NP[current]`。（p.197）","被刪除的節點仍留在陣列內（內容及指示標都沒有改），只是沒有指示標指向它。"]},{"sim":{"code":"D = [\"\", \"Iris\", \"Ada\", \"Peter\", \"\", \"Ben\", \"\"]\nNP = [0, 2, 10, 1, 0, 3, 0]\nstart = 5\n\ndef delete(n):\n    global start\n    if n == 1:\n        start = NP[start]\n    else:\n        prev = start\n        current = NP[start]\n        for k in range(2, n):\n            prev = current\n            current = NP[current]\n        NP[prev] = NP[current]\n\ndelete(3)\nprint(\"NP:\", NP[1:])\nnxt = start\nwhile nxt != 10:\n    print(D[nxt], end=\" \")\n    nxt = NP[nxt]","step":true,"open":["vars"]},"cap":"例題 5.5(b)(i)、(d)（p.194–198）：刪除第 3 個節點 Iris。教科書「設 k 由 2 至 n−1」寫成 `range(2, n)`。"}],"tries":[{"id":"c5c-s3-t1","pts":4,"src":"教科書 p.194 例題 5.5(b)(i)","code":"D = [\"\", \"Iris\", \"Ada\", \"Peter\", \"\", \"Ben\", \"\"]\nNP = [0, 2, 10, 1, 0, 3, 0]\nstart = 5\n\ndef delete(n):\n    global start\n    if n == 1:\n        start = NP[start]\n    else:\n        prev = start\n        current = NP[start]\n        for k in range(2, n):\n            prev = current\n            current = NP[current]\n        NP[prev] = NP[current]\n\ndelete(3)\nprint(NP[1:6])","q":"先估：輸出是什麼？（即 NP[1] 至 NP[5]）","options":["[2, 10, 2, 0, 3]","[2, 10, 1, 0, 3]","[10, 10, 2, 0, 3]","[2, 10, 2, 0, 1]"],"why":"第 3 個節點是 Iris（索引 1）；它的上一個節點是 Peter（索引 3），所以 NP[3] 改為 NP[1] = 2。Iris 本身的 NP[1] 不變。","_right":0,"_ans":"[2, 10, 2, 0, 3]"}],"practice":[{"id":"c5c-s3-p1","type":"complete","pts":3,"src":"教科書 p.195 例題 5.5(d)","q":"完成子程式 `delete(n)`。程式會輸入 n，刪除後輸出鏈表內容。會測試刪除第 1 至第 4 個節點。","template":"D = [\"\", \"Iris\", \"Ada\", \"Peter\", \"\", \"Ben\", \"\"]\nNP = [0, 2, 10, 1, 0, 3, 0]\nstart = 5\n\ndef delete(n):\n    global start\n    if n == 1:\n        start = ［1］\n    else:\n        prev = start\n        current = NP[start]\n        for k in range(2, n):\n            prev = ［2］\n            current = ［3］\n        NP[prev] = ［4］\n\ndelete(int(input()))\nnxt = start\nwhile nxt != 10:\n    print(D[nxt], end=\" \")\n    nxt = NP[nxt]","ref":["NP[start]","current","NP[current]","NP[current]"],"tests":[{"inputs":"1"},{"inputs":"2"},{"inputs":"3"},{"inputs":"4"}],"hint":"prev 移到 current 的位置，current 再向前一步；最後令 prev 繞過 current。"},{"id":"c5c-s3-p2","type":"mc","pts":2,"src":"教科書 p.187–189 例題 5.4(b)（參考 DSE 2014 卷二D Q3(a)）","q":"港鐵站鏈表 start（索引 0，指示標 3）→ Whampoa（索引 3，指示標 5）→ Ho Man Tin（索引 5）→ …。執行 `delete(2)` 刪除第 2 個節點 Whampoa，要改變哪一個數值？","options":["索引 3 的指示標改為 −1","索引 0 的指示標改為 5","索引 5 的指示標改為 0","把索引 3 的內容改為空白"],"answer":1,"hint":"只須令上一個節點（start）繞過 Whampoa，指向 Whampoa 的下一個節點（索引 5）。","_right":1}]},{"id":"s4","title":"加入節點與雙向鏈表","pages":"教科書 p.184、p.187–199、p.207","learn":[{"pts":["在第 n 個節點**之後**加入新節點（例題 5.4）：把內容放在一個空位 i；`pointer[i] ← pointer[第 n 個節點]`，再 `pointer[第 n 個節點] ← i`。（p.188–189）","新節點**成為第 n 個節點**（例題 5.5 挑戰題）：n = 1 時 `NP[i] ← start`、`start ← i`；否則先找出第 n − 1 個節點 prev，`NP[i] ← current`、`NP[prev] ← i`。（p.199）","**雙向鏈表**：每個節點有 `prev`、`next` 兩個指示標。好處：可以從兩個方向存取；壞處：要用較多記憶體，加入／刪除時要改多個指示標。（p.184、p.192）","**循環鏈表**：最後一個節點指回第一個節點。（p.184）"]},{"sim":{"code":"content = [\"start\", \"\", \"Yau Ma Tei\", \"Whampoa\", \"\", \"Ho Man Tin\",\n           \"Mong Kok\", \"\", \"Wong Tai Sin\", \"Jordan\"]\npointer = [3, None, 6, 5, None, 2, -1, None, -1, 2]\n\ndef node_index(n):          # 第 n 個節點的索引（第 1 個是 start）\n    cur = 0\n    for k in range(n - 1):\n        cur = pointer[cur]\n    return cur\n\ndef insert(n, station):     # 在第 n 個節點後加入新節點\n    i = content.index(\"\")   # 找第一個空位\n    content[i] = station\n    before = node_index(n)\n    pointer[i] = pointer[before]     # 先導向新節點的指示標\n    pointer[before] = i              # 再導向上一個節點\n\ndef delete(n):              # 刪除第 n 個節點\n    before = node_index(n - 1)\n    pointer[before] = pointer[pointer[before]]\n\ninsert(5, \"Kowloon Tong\")\ninsert(5, \"Prince Edward\")\ndelete(2)\nprint(pointer)\ncur = 0\nnames = []\nwhile cur != -1:\n    names.append(content[cur])\n    cur = pointer[cur]\nprint(\", \".join(names))","step":true,"open":["vars"]},"cap":"例題 5.4(b)（p.187–190）：`insert(n, station)` 在第 n 個節點後加入，`delete(n)` 刪除第 n 個節點。新節點放在第一個空位。"}],"tries":[{"id":"c5c-s4-t1","pts":4,"src":"教科書 p.187–190 例題 5.4(b)（教科書表格有誤，見本單元檔頭）","tags":[{"t":"trap","why":"教科書答案表把 Mong Kok 的指示標印成 1"}],"code":"content = [\"start\", \"\", \"Yau Ma Tei\", \"Whampoa\", \"\", \"Ho Man Tin\",\n           \"Mong Kok\", \"\", \"Wong Tai Sin\", \"Jordan\"]\npointer = [3, None, 6, 5, None, 2, -1, None, -1, 2]\n\ndef node_index(n):          # 第 n 個節點的索引（第 1 個是 start）\n    cur = 0\n    for k in range(n - 1):\n        cur = pointer[cur]\n    return cur\n\ndef insert(n, station):     # 在第 n 個節點後加入新節點\n    i = content.index(\"\")   # 找第一個空位\n    content[i] = station\n    before = node_index(n)\n    pointer[i] = pointer[before]     # 先導向新節點的指示標\n    pointer[before] = i              # 再導向上一個節點\n\ndef delete(n):              # 刪除第 n 個節點\n    before = node_index(n - 1)\n    pointer[before] = pointer[pointer[before]]\n\ninsert(5, \"Kowloon Tong\")\ninsert(5, \"Prince Edward\")\ndelete(2)\nprint(pointer[0], pointer[6], pointer[4])","q":"先估：最後索引 0（start）、索引 6（Mong Kok）、索引 4（Prince Edward）的指示標是什麼？","options":["5 4 1","5 1 1","3 4 1","5 4 -1"],"why":"Kowloon Tong 放在索引 1，接在 Mong Kok 後；Prince Edward 放在索引 4，也接在第 5 個節點 Mong Kok 後，所以 Mong Kok → 4 → 1。教科書答案表印「1」是錯的。delete(2) 令 start 指向 5。","_right":0,"_ans":"5 4 1"},{"id":"c5c-s4-t2","pts":4,"src":"教科書 p.193 測試站 5.4(b)（參考 DSE 2014 卷二D Q3(d)）","code":"content = [\"start\", \"Teresa\", \"Benson\", \"Joyce\", \"Kyle\", \"Vicky\", \"Daniel\", \"Mike\"]\nptr = [3, 10, 13, 6, 6, 2, 6, 3]      # 每個 ptr = prev + next\nprev = -1\ncur = 0\nfor k in range(4):\n    nxt = ptr[cur] - prev\n    prev = cur\n    cur = nxt\n    print(content[cur], end=\" \")","q":"先估：鏈表 L2 每個節點只儲存 prev + next 的總和。輸出 start 後的四個節點是什麼？","options":["Kyle Daniel Benson Mike","Joyce Vicky Benson Mike","Kyle Daniel Daniel Daniel","Teresa Benson Joyce Kyle"],"why":"已知上一個節點，便可以 next = ptr − prev：3 − (−1) = 4（Kyle）；6 − 0 = 6（Daniel）；6 − 4 = 2（Benson）；13 − 6 = 7（Mike）。","_right":0,"_ans":"Kyle Daniel Benson Mike"}],"practice":[{"id":"c5c-s4-p1","type":"complete","pts":3,"src":"教科書 p.199 例題 5.5 挑戰題","q":"完成 `insert(n, name, i)`：加入內容為 name、索引為 i 的節點，成為第 n 個節點。程式會輸入 n，把 \"Brian\" 放在索引 4。","template":"D = [\"\", \"Iris\", \"Ada\", \"Peter\", \"\", \"Ben\", \"\"]\nNP = [0, 2, 10, 1, 0, 3, 0]\nstart = 5\n\ndef insert(n, name, i):\n    global start\n    D[i] = name\n    if n == 1:\n        NP[i] = ［1］\n        start = i\n    else:\n        prev = start\n        current = NP[start]\n        for k in range(2, n):\n            prev = current\n            current = NP[current]\n        NP[i] = ［2］\n        NP[prev] = ［3］\n\ninsert(int(input()), \"Brian\", 4)\nnxt = start\nwhile nxt != 10:\n    print(D[nxt], end=\" \")\n    nxt = NP[nxt]","ref":["start","current","i"],"tests":[{"inputs":"1"},{"inputs":"2"},{"inputs":"4"},{"inputs":"5"}],"hint":"先令新節點指向原本的第 n 個節點（current），再令第 n − 1 個節點（prev）指向新節點。"},{"id":"c5c-s4-p2","type":"mc","pts":2,"src":"教科書 p.192 例題 5.4 第 2 題(c)、p.207 課題練習 4(c)","q":"把單向鏈表改為**雙向鏈表**，以下哪一項描述正確？","options":["可以從兩個方向存取節點，但須要使用較多記憶體","可以用索引直接存取節點，而且記憶體較少","不再需要空值指示標","加入節點時只須改一個指示標"],"answer":0,"hint":"每個節點多了一個 prev 指示標。","_right":0},{"id":"c5c-s4-p3","type":"mc","pts":1,"src":"教科書 p.207 課題練習 4(d)","q":"雙向鏈表 park（索引 7）→ cinema → coffee shop → substation → sports ground（索引 9）。要令終點返回起點（變成循環），要更新哪兩個指示標？","options":["park 的 next 改為 9，sports ground 的 prev 改為 7","park 的 prev 改為 9，sports ground 的 next 改為 7","cinema 的 prev 改為 9，substation 的 next 改為 7","只須 sports ground 的 next 改為 1"],"answer":1,"hint":"起點 park 原本的 prev 是 −1，終點 sports ground 原本的 next 是 −1。","_right":1}]},{"id":"write","kind":"write","title":"寫程式","pages":"教科書 p.183–200","intro":"在編輯器寫 Python 程式，先按 ▶ 自己測試，再按「提交評核」。每個 `input()` 讀一行輸入。","tasks":[{"id":"c5c-w1","pts":15,"title":"遍歷鏈表","src":"教科書 p.195、p.200","q":"第一行輸入節點位置的數目 m（索引 0 至 m−1）。之後 m 行，每行是該位置的「內容 指示標」，以一個空格分隔（內容沒有空格；−1 是空指示標）。最後一行輸入首個節點的索引 start。\n順序輸出鏈表每個節點的內容（每個一行），最後輸出 `共 k 個節點`。\n例如輸入 3、`Ada -1`、`Ben 0`、`Cat 1`、`2`，輸出 Cat、Ben、Ada、共 3 個節點。","starter":"m = int(input())\ncontent = []\npointer = []\nfor i in range(m):\n    parts = input().split()\n    content.append(parts[0])\n    pointer.append(int(parts[1]))\nstart = int(input())\n# 在這裏完成","ref":"m = int(input())\ncontent = []\npointer = []\nfor i in range(m):\n    parts = input().split()\n    content.append(parts[0])\n    pointer.append(int(parts[1]))\nstart = int(input())\nk = 0\ncur = start\nwhile cur != -1:\n    print(content[cur])\n    k = k + 1\n    cur = pointer[cur]\nprint(\"共\", k, \"個節點\")","tests":[{"inputs":"3\nAda -1\nBen 0\nCat 1\n2"},{"inputs":"6\ndinner 2\njapanese -1\npainting 5\nx -1\nyoga 1\ntea 4\n2"},{"inputs":"1\nsolo -1\n0"},{"inputs":"6\na 3\nb -1\nc 0\nd 5\ne -1\nf 1\n2"},{"inputs":"4\np -1\nq 0\nr -1\ns 1\n0"}],"hint":"`cur = start`；當 `cur != -1`：輸出 `content[cur]`、計數、`cur = pointer[cur]`。陣列中沒有被指向的位置不用輸出。"},{"id":"c5c-w2","pts":20,"title":"按次序加入節點（有序鏈表）","src":"教科書 p.188–189、p.199（自擬延伸）","q":"用兩個列表 `data`、`nxt` 和首項指示標 `head`（−1 代表空）建立一個**由小至大**的鏈表。\n第一行輸入 n，之後輸入 n 個整數，每輸入一個：把它加到列表末端的新位置（`data.append(x)`、`nxt.append(-1)`），再**只改指示標**把它接到鏈表的正確位置（相同的數放在已有的數之後）。\n最後：第一行順序輸出鏈表的數字（以空格分隔），第二行輸出 `print(nxt)`。\n**不可**使用 sort 或 sorted。","starter":"data = []\nnxt = []\nhead = -1\nn = int(input())\nfor k in range(n):\n    x = int(input())\n    data.append(x)\n    nxt.append(-1)\n    i = len(data) - 1\n    # 在這裏把節點 i 接到正確位置\n\ncur = head\nwhile cur != -1:\n    print(data[cur], end=\" \")\n    cur = nxt[cur]\nprint()\nprint(nxt)","ref":"data = []\nnxt = []\nhead = -1\nn = int(input())\nfor k in range(n):\n    x = int(input())\n    data.append(x)\n    nxt.append(-1)\n    i = len(data) - 1\n    if head == -1 or x \u003c data[head]:\n        nxt[i] = head\n        head = i\n    else:\n        prev = head\n        while nxt[prev] != -1 and data[nxt[prev]] \u003c= x:\n            prev = nxt[prev]\n        nxt[i] = nxt[prev]\n        nxt[prev] = i\n\ncur = head\nwhile cur != -1:\n    print(data[cur], end=\" \")\n    cur = nxt[cur]\nprint()\nprint(nxt)","rules":[{"mustNot":"sort","msg":"這題要用指示標排列，不可用 sort／sorted。"}],"tests":[{"inputs":"4\n50\n20\n70\n40"},{"inputs":"1\n9"},{"inputs":"5\n5\n4\n3\n2\n1"},{"inputs":"5\n1\n2\n3\n4\n5"},{"inputs":"4\n30\n10\n30\n20"}],"hint":"分兩種情況：① 鏈表是空的或 x 比首個節點小 → 新節點成為首個節點（`nxt[i] = head`、`head = i`）；② 否則由 head 開始找最後一個「≤ x」的節點 prev，然後先 `nxt[i] = nxt[prev]`，再 `nxt[prev] = i`。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.149、p.185–207","items":[{"id":"c5c-q1","pts":4,"src":"教科書 p.187 例題 5.4(a)(iii)（參考 DSE 2014 卷二D Q3(a)）","tags":[{"t":"hot","why":"以陣列顯示的鏈表：DSE 2014 卷二D Q3"}],"q":"鏈表以索引 0 至 9 的陣列顯示，−1 代表空指示標。以下哪一個數值**不能**用作空指示標？","options":["−5","9","10","99"],"answer":"B","why":"空指示標必須不是有效索引：任何負數，或大於或等於陣列大小（10）的數字。9 是有效索引。","_right":1},{"id":"c5c-q2","pts":4,"src":"教科書 p.206 課題練習 4(a)(i)","tags":[{"t":"hot","why":"以陣列顯示的鏈表：DSE 2014 卷二D Q3"}],"verify":true,"q":"首個檢查點的索引是 7。以下程式的輸出是什麼？","code":"CP = [\"\", \"cinema\", \"\", \"gas station\", \"\", \"substation\", \"coffee shop\", \"park\", \"\", \"sports ground\", \"hotel\"]\nP = [0, 6, 0, -1, 0, 9, 5, 1, 0, -1, 3]\ncur = 7\nwhile P[cur] != -1:\n    cur = P[cur]\nprint(CP[cur], P[5])","options":["sports ground 9","gas station 9","hotel 3","sports ground -1"],"answer":"A","why":"循環在 P[cur] 是 −1 時停止，cur 停在最後一個節點（索引 9 sports ground）。P[5] 是 9。","_right":0},{"id":"c5c-q3","pts":4,"src":"教科書 p.193 測試站 5.4(a)（參考 DSE 2014 卷二D Q3(d)）","verify":true,"q":"雙向鏈表 L1 的 prev、next 如下。若改用 L2，每個節點只儲存 prev + next 的總和，Jessica（索引 5）的 pointer 是多少？","code":"prev = [-1, 0, 0, 0, 5, 2]\nnxt  = [2, 0, 5, 0, -1, 4]\n# 索引 0 start、2 Andy、4 Tracy、5 Jessica\nprint(prev[5] + nxt[5])","options":["4","6","7","2"],"answer":"B","why":"Jessica 的 prev 是 2（Andy）、next 是 4（Tracy），2 + 4 = 6。教科書答案：start 1、Andy 5、Tracy 4、Jessica 6。","_right":1},{"id":"c5c-q4","pts":4,"src":"教科書 p.185–186 表 5.1","q":"一個程式經常要讀取「第 k 個」項目，但很少加入或刪除項目。應選用哪一種數據結構？為什麼？","options":["鏈表，因為順序存取速度快","陣列，因為可以用索引直接存取","鏈表，因為可以儲存不同類型的數據","陣列，因為加入和刪除數據的速度快"],"answer":"B","why":"陣列是直接（隨機）存取；鏈表要跟着指示標由頭找（順序存取）。陣列加入、刪除反而較慢。","_right":1},{"id":"c5c-q5","pts":4,"src":"教科書 p.149 應用與職涯","q":"區塊鏈的概念與鏈表相似。以下哪一個操作可以在鏈表進行，但**不能**在區塊鏈進行？","options":["由第一個節點／區塊開始逐一存取","在中間加入新的節點／區塊","每個節點／區塊儲存數據","每個節點／區塊連繫到另一個節點／區塊"],"answer":"B","why":"區塊鏈不能刪除某些區塊，也不能在中間加入新區塊；鏈表可以。","_right":1}]},{"id":"more","kind":"endless","title":"無限練習","gens":["pyList","pyWhile","pyFunc"],"intro":"隨機生成列表、while 循環及子程式題目，鞏固遍歷鏈表所需的技巧。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]},{"id":"c6a","title":"檢索：線性檢索與對分檢索","book":"教科書 選修C 第 6 章 p.210–227","key":"C-c6a-hmac-c184a82eaa","sections":[{"id":"s1","title":"線性檢索","pages":"教科書 p.210–213","learn":[{"pts":["**檢索（searching）**：在列表中找出與目標值相同的記錄。（p.210）","**線性檢索（順序檢索）**：由索引 0 開始逐一比較，直至找到目標值或到達最後一項。**適用於未排序的列表**。（p.210）","**旗標（flag）**：監視程式狀態的變量，例如 `found`。先假設找不到（False），找到才轉為 True。（p.211）","用 for 循環：一定比較 N 次。改用 while 循環加上條件 `found == False`：找到便停止，效率較高。（p.211）","要找出**所有**位置（列表有重複的值），便不能找到第一個就停止。用 `index = -1` 表示找不到。（p.212）","比較次數（N 個項目）：最好 1 次；最壞 N 次（在最後或不存在）；平均 (1 + 2 + … + N) / N = **(N + 1) / 2** ≈ N / 2。（p.213 例題 6.1，參考 DSE 2018 卷二D Q3(c)）"]},{"table":{"head":["target","for 循環","while 循環",""],"rows":[["79","10 次","1 次","最好的情況"],["50","10 次","2 次",""],["85","10 次","3 次",""],["100","10 次","10 次","最差的情況"]]},"cap":"條件 `target == mark[i]` 的判斷次數（p.211）"},{"sim":{"code":"mark = [79, 50, 85, 64, 97, 88, 80, 75, 50, 65]\ntarget = int(input())\nfound = False\ni = 0\nwhile i \u003c len(mark) and found == False:\n    if target == mark[i]:\n        found = True\n    i = i + 1\nprint(found)","inputs":"85","step":true,"open":["vars"]},"cap":"while 循環的線性檢索（p.211）。輸入 85，數一數第 6 行執行了多少次。"}],"tries":[{"id":"c6a-s1-t1","pts":4,"src":"教科書 p.211","code":"mark = [79, 50, 85, 64, 97, 88, 80, 75, 50, 65]\ntarget = int(input())\nfound = False\ni = 0\nwhile i \u003c len(mark) and found == False:\n    if target == mark[i]:\n        found = True\n    i = i + 1\nprint(found)","inputs":"50","ask":{"count":6},"q":"先估：輸入 50 時，第 6 行 `if target == mark[i]:` 執行了多少次？","options":["2","9","10","1"],"why":"mark[1] 已是 50，found 變成 True，循環停止。列表後面另一個 50（索引 8）不會再比較。","_right":0,"_ans":"2"}],"practice":[{"id":"c6a-s1-p1","type":"mc","pts":2,"src":"教科書 p.212","verify":true,"q":"以下程式的輸出是什麼？","code":"mark = [79, 50, 85, 64, 97, 88, 80, 75, 50, 65]\ntarget = 50\nindex = -1\nfor i in range(0, len(mark)):\n    if target == mark[i]:\n        index = i\n        print(i, end=\" \")\nif index == -1:\n    print(\"No result is found.\")","options":["1 8","1","8","No result is found."],"answer":0,"hint":"for 循環會檢查全部項目，兩個 50 的索引都會輸出。","_right":0},{"id":"c6a-s1-p2","type":"fill","pts":2,"src":"教科書 p.211 表","inputs":"100","q":"輸入 100（不在列表中）。第 6 行執行了多少次？這是最好還是最壞的情況？","code":"mark = [79, 50, 85, 64, 97, 88, 80, 75, 50, 65]\ntarget = int(input())\nfound = False\ni = 0\nwhile i \u003c len(mark) and found == False:\n    if target == mark[i]:\n        found = True\n    i = i + 1\nprint(found)","blanks":[{"label":"第 6 行執行次數","ask":{"count":6}},{"label":"最好／最壞","a":"最壞","accept":["最壞的情況","最差","最差的情況"]}],"hint":"找不到便要比較全部 N 個項目。","_ans":["10","最壞"]},{"id":"c6a-s1-p3","type":"fill","pts":2,"src":"教科書 p.213 例題 6.1(b) 分析（答案有近似，見本單元檔頭）","q":"以下程式逐一檢索列表中每一個值，計算平均比較次數（列表沒有重複的值）。寫出 avg；再用公式 (N + 1) / 2 計算 N = 500 時的平均檢索次數。","code":"mark = [79, 51, 85, 64, 97, 88, 80, 75, 50, 65]\ntotal = 0\nfor target in mark:\n    i = 0\n    while i \u003c len(mark) and mark[i] != target:\n        i = i + 1\n    total = total + (i + 1)\navg = total / len(mark)","blanks":[{"label":"avg（N = 10）","ask":{"var":"avg"}},{"label":"N = 500 的平均次數","a":"250.5"}],"hint":"(1 + 2 + … + 10) / 10 = 5.5。教科書例題 6.1(b) 答 250，是用 N / 2 近似；準確是 (500 + 1) / 2。","_ans":["5.5","250.5"]}]},{"id":"s2","title":"改良線性檢索","pages":"教科書 p.214","learn":[{"pts":["測試站 6.1：`found = -1` 表示未找到；找到時 `found = i`。在 while 加上 `found == -1`，找到便停止。（p.214，參考 DSE 2018 卷二D Q3(d)）","只把列表排序，檢索方法不變的話，效率**沒有改善**（平均仍約 n / 2 次）。","列表**由小至大**排序時，可再加條件 `staff_no >= retire[i]`：遇到比目標大的項目，餘下的項目一定更大，可以立即停止。","列表**由大至小**排序時，條件改為 `staff_no \u003c= retire[i]`。（試想想）"]},{"sim":{"code":"retire = [4497, 5557, 5568, 5790, 7924]\nstaff_no = int(input())\nfound = -1\ni = 0\nwhile i \u003c len(retire) and found == -1 and staff_no >= retire[i]:\n    if staff_no == retire[i]:\n        found = i\n    i = i + 1\nprint(found)","inputs":"5000","step":true,"open":["vars"]},"cap":"已由小至大排序的列表：輸入 5000，看循環怎樣在 5557 前停止。"}],"tries":[{"id":"c6a-s2-t1","pts":4,"src":"教科書 p.214 測試站 6.1(b)(ii)","code":"retire = [4497, 5557, 5568, 5790, 7924]\nstaff_no = int(input())\nfound = -1\ni = 0\nwhile i \u003c len(retire) and found == -1 and staff_no >= retire[i]:\n    if staff_no == retire[i]:\n        found = i\n    i = i + 1\nprint(found)","inputs":"5700","ask":{"count":6},"q":"先估：輸入 5700（不在列表中），第 6 行 `if staff_no == retire[i]:` 執行了多少次？","options":["3","4","5","1"],"why":"4497、5557、5568 都 ≤ 5700，要比較；到 5790 時 5700 >= 5790 不成立，循環停止。不用比較全部 5 個。","_right":0,"_ans":"3"}],"practice":[{"id":"c6a-s2-p1","type":"complete","pts":3,"src":"教科書 p.214 測試站 6.1(a)","q":"在 while 循環加入條件，令程式找到員工編號後立即停止。會用多組數據測試，並檢查比較次數。","template":"retire = [4497, 5557, 5568, 7924, 5790]\nstaff_no = int(input())\nfound = -1\ni = 0\nchecks = 0\nwhile i \u003c len(retire) and ［1］:\n    checks = checks + 1\n    if staff_no == retire[i]:\n        found = i\n    i = i + 1\nprint(found, checks)","ref":["found == -1"],"tests":[{"inputs":"4497"},{"inputs":"7924"},{"inputs":"5790"},{"inputs":"1234"}],"hint":"還未找到時 found 仍是 −1。"},{"id":"c6a-s2-p2","type":"mc","pts":2,"src":"教科書 p.214 測試站 6.1(b)(ii)（參考 DSE 2018 卷二D Q3(d)）","q":"列表 retire 已**由小至大**排序。輸入的編號不在記錄中是最壞情況之一。應在 while 再加入哪個條件以改善效率？","options":["and staff_no >= retire[i]","and staff_no \u003c= retire[i]","and staff_no != retire[i]","and i \u003c len(retire) // 2"],"answer":0,"hint":"遇到比目標大的項目便停止，所以繼續的條件是目標仍然 ≥ 項目。","_right":0},{"id":"c6a-s2-p3","type":"mc","pts":1,"src":"教科書 p.214 試想想","q":"若列表改為**由大至小**排序，  活動 6.1 第 1 題","q":"輸入 68（不在列表中），完成每次循環**結束時**的追蹤表。","code":"mark = [50, 51, 64, 65, 75, 79, 80, 85, 88, 97]\nstart = 0\nend = len(mark)-1\ntarget = int(input())\nfound = False\nwhile start \u003c= end and found == False:\n    mid = int((start + end)/2)\n    if mark[mid] == target:\n        found = True\n    else:\n        if target \u003c mark[mid]:\n            end = mid - 1\n        else:\n            start = mid + 1\nif found == True:\n    print(\"Found at index\", mid)\nelse:\n    print(\"Not found\")","inputs":"68","spec":{"mode":"iter","cols":["start","end","mid"],"out":true},"hint":"mid 依次是 4、1、2、3（即教科書位置 5、2、3、4），共比較 4 次。最後 start > end，輸出 Not found。","_trace":{"mode":"iter","cols":[{"key":"start","label":"start"},{"key":"end","label":"end"},{"key":"mid","label":"mid"},{"key":"__out","label":"輸出"}],"rows":[{"label":"循環前","line":6,"cells":[{"v":"0","changed":true},{"v":"9","changed":true},{"v":"","changed":false},{"v":"","changed":false}]},{"label":"第 1 次","line":6,"cells":[{"v":"0","changed":false},{"v":"3","changed":true},{"v":"4","changed":true},{"v":"","changed":false}]},{"label":"第 2 次","line":6,"cells":[{"v":"2","changed":true},{"v":"3","changed":false},{"v":"1","changed":true},{"v":"","changed":false}]},{"label":"第 3 次","line":6,"cells":[{"v":"3","changed":true},{"v":"3","changed":false},{"v":"2","changed":true},{"v":"","changed":false}]},{"label":"第 4 次","line":6,"cells":[{"v":"4","changed":true},{"v":"3","changed":false},{"v":"3","changed":true},{"v":"","changed":false}]}]}},{"id":"c6a-s3-p2","type":"mc","pts":2,"src":"教科書 p.219 活動 6.1 第 4 題","verify":true,"q":"列表**由大至小**排序。以下程式檢索 66，輸出是什麼？","code":"a = [98, 92, 85, 77, 73, 66, 65, 50, 43, 28]\ntarget = 66\nstart = 0\nend = len(a) - 1\ncount = 0\nwhile start \u003c= end:\n    mid = (start + end) // 2\n    count = count + 1\n    if a[mid] == target:\n        break\n    elif a[mid] > target:\n        start = mid + 1\n    else:\n        end = mid - 1\nprint(count, mid)","options":["3 5","2 5","3 6","4 5
