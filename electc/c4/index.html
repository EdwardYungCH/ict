PY.unit({"id":"c4","title":"子程式","book":"教科書 選修C 第 4 章 p.104–147","key":"C-c4-hmac-a7e31c94d2","sections":[{"id":"s1","title":"子程式、內置函數及函數庫","pages":"教科書 p.106–111","learn":[{"pts":["**模組化**：把大問題拆解成細小而容易處理的模組，逐個擊破。程式內的模組稱為**子程式**（Python 亦稱為**函數**），可以獨立並重複使用。（p.106）","**黑盒**：不用知道函數內裏的算法，只要知道它的輸入和輸出便可以使用，例如 `math.exp(1)` 得到 e ≈ 2.718。（p.107）","子程式的四種類型：沒有輸入沒有輸出（例如列印歡迎訊息）、有輸入沒有輸出、沒有輸入有輸出（例如隨機抽獎）、**有輸入有輸出**（最常見，例如 `sum(a, b)`）。（p.108–109）","常見錯誤：子程式內**列印**的字串是程式的輸出，**不是**子程式的傳回值。（p.108）","調用函數：寫函數名稱及**實際參數**（又稱**變元**）；有傳回值的可以用變量儲存，例如 `a = input()`。（p.109）","內置函數：`abs(x)` 絕對值；`round(x, y)` 四捨五入到 y 位小數。（p.109 表 4.1）","**函數庫**要先匯入（`import math`、`import random`），每個程式匯入一次即可。`math.sqrt(16)` 得 `4.0`；`random.randint(a, b)` 得 a 至 b 的隨機整數（**包括 b**）；`random.random()` 得 0 至 1（不包括 1）的浮點數。（p.110 表 4.2–4.3）"]},{"sim":{"code":"import math\nimport random\nprint(abs(-10), abs(20))\nprint(round(10/3, 2), round(10/3, 5))\nprint(math.sqrt(16))\nprint(round(math.exp(1), 3))\ny = random.randint(1, 10)\nprint(1 \u003c= y \u003c= 10)","open":[],"_run":{"out":"10 20\n3.33 3.33333\n4.0\n2.718\nTrue\n","err":null,"vrepr":{"y":"4"},"files":{}}},"cap":"表 4.1–4.3 的例句。y 每次執行都可能不同，但一定在 1 至 10 之內（試加一行 `print(y)` 再執行幾次）。"}],"tries":[{"id":"c4-s1-t1","pts":4,"src":"教科書 p.109 表 4.1","code":"y = round(10/3, 2) + abs(-10)\nprint(y)","q":"先估：輸出是什麼？","options":["13.33","-6.67","13.333333333333334","13"],"why":"round(10/3, 2) = 3.33；abs(-10) = 10；3.33 + 10 = 13.33。","_right":0,"_ans":"13.33","_run":{"out":"13.33\n","err":null,"vrepr":{"y":"13.33"},"files":{},"steps":[{"l":1,"v":{},"o":0},{"l":2,"v":{"y":"13.33"},"o":0}],"cut":false}}],"practice":[{"id":"c4-s1-p1","type":"fill","pts":2,"src":"教科書 p.111 測試站 4.1 第 1 題（參考 DSE 2019 2D Q2ai）","q":"李老師用列表 `mark` 儲存 10 個學生的數學分數。寫出兩個子程式的傳回值。","code":"mark = [78, 89, 87, 95, 60, 44, 51, 98, 77, 69]\n\ndef average():\n    total = 0\n    for i in range(0, 10):\n        total = total + mark[i]\n    return total / 10\n\ndef higher(m):\n    count = 0\n    for i in range(0, 10):\n        if mark[i] > m:\n            count = count + 1\n    return count","blanks":[{"label":"average() 的傳回值","ask":{"expr":"average()"}},{"label":"higher(90) 的傳回值","ask":{"expr":"higher(90)"}}],"hint":"總分 748 ÷ 10；高於 90 的只有 95 和 98。（教科書答案：74.8、2）","_ans":["74.8","2"]},{"id":"c4-s1-p2","type":"mc","pts":1,"src":"教科書 p.108","q":"以下哪一個子程式屬於「有輸入、沒有輸出（傳回值）」？","options":["def show(n):\n    print(n * 2)","def double(n):\n    return n * 2","def hello():\n    print(\"Hello\")","def lucky():\n    return \"Peter\""],"answer":0,"hint":"`print` 只是在 Shell 顯示，不是傳回值。","_right":0},{"id":"c4-s1-p3","type":"mc","pts":2,"src":"教科書 p.110 表 4.3","q":"執行 `y = random.randint(1, 10)` 後，y 可能是哪些值？","options":["1 至 10 的整數（包括 10）","1 至 9 的整數","0 至 10 的整數","1 至 10 之間的任何小數"],"answer":0,"hint":"randint 的範圍包括首尾兩數；這點和 range() 不同。","_right":0}]},{"id":"s2","title":"定義及調用子程式","pages":"教科書 p.112–116","learn":[{"pts":["寫子程式前，先分析它的**輸入—處理—輸出周期**。（p.112）","用 `def` 定義：`def 子程式名稱(形式參數):`，下面縮排的是**子程式主體**；`return` 後面是**傳回值**。（p.112）","子程式名稱是**識別符**，命名規則與變量相同；同一程式內的識別符不可重複。（p.113）","**形式參數**：多於一個用逗號分隔；沒有參數便把括號留空，例如 `def myFunctionC():`。（p.113）","`return` 表示**結束子程式**並把數據傳回調用的位置；`return value1, value2` 可傳回多於一個值。沒有傳回值便不用寫 `return`。（p.113）","子程式**必須在被調用前定義**，否則出現 `NameError`。（p.115 活動 4.1）","調用時，實際參數的值傳給形式參數（`a ← n1`、`b ← n2`……），執行子程式主體，然後返回調用的位置。可以重複調用。（p.114）"]},{"sim":{"code":"def add3(a, b, c):\n    s = a + b + c\n    return s\nn1 = 1\nn2 = 2\nn3 = 3\nsumm = add3(n1, n2, n3)\nprint(summ)\nn4 = 4\nn5 = 5\nsumm = add3(summ, n4, n5)\nprint(summ)","step":true,"open":["vars","trace"],"_run":{"out":"6\n15\n","err":null,"vrepr":{"n1":"1","n2":"2","n3":"3","summ":"15","n4":"4","n5":"5"},"files":{},"steps":[{"l":1,"v":{},"o":0},{"l":4,"v":{},"o":0},{"l":5,"v":{"n1":"1"},"o":0},{"l":6,"v":{"n1":"1","n2":"2"},"o":0},{"l":7,"v":{"n1":"1","n2":"2","n3":"3"},"o":0},{"l":2,"v":{"n1":"1","n2":"2","n3":"3","a":"1","b":"2","c":"3"},"o":0,"fn":"add3"},{"l":3,"v":{"n1":"1","n2":"2","n3":"3","a":"1","b":"2","c":"3","s":"6"},"o":0,"fn":"add3"},{"l":8,"v":{"n1":"1","n2":"2","n3":"3","summ":"6"},"o":0},{"l":9,"v":{"n1":"1","n2":"2","n3":"3","summ":"6"},"o":2},{"l":10,"v":{"n1":"1","n2":"2","n3":"3","summ":"6","n4":"4"},"o":2},{"l":11,"v":{"n1":"1","n2":"2","n3":"3","summ":"6","n4":"4","n5":"5"},"o":2},{"l":2,"v":{"n1":"1","n2":"2","n3":"3","summ":"6","n4":"4","n5":"5","a":"6","b":"4","c":"5"},"o":2,"fn":"add3"},{"l":3,"v":{"n1":"1","n2":"2","n3":"3","summ":"6","n4":"4","n5":"5","a":"6","b":"4","c":"5","s":"15"},"o":2,"fn":"add3"},{"l":12,"v":{"n1":"1","n2":"2","n3":"3","summ":"15","n4":"4","n5":"5"},"o":2}],"cut":false}},"cap":"p.114 調用子程式的序列：按「下一步」看程式怎樣由第 7 行跳到子程式，再返回第 7 行。"},{"fix":{"bad":"total = add3(1, 2, 3)\n\ndef add3(a, b, c):\n    s = a + b + c\n    return s\n\nprint(total)","good":"def add3(a, b, c):\n    s = a + b + c\n    return s\n\ntotal = add3(1, 2, 3)\nprint(total)","why":"活動 4.1（p.115）：第 1 行調用 add3 時它還未定義，出現 `NameError: name 'add3' is not defined`。子程式必須在被調用前定義。"}}],"tries":[{"id":"c4-s2-t1","pts":4,"src":"教科書 p.116 活動 4.2 第 1 題","code":"def printsth():\n    print(\"One\")\n    print(\"Two\")\n\nprint(\"Three\")\nprintsth()\nprint(\"Four\")","q":"先估：輸出是什麼？","options":["Three\nOne\nTwo\nFour","One\nTwo\nThree\nFour","Three\nFour\nOne\nTwo","One\nTwo\nThree\nOne\nTwo\nFour"],"why":"`def` 只是定義，不會執行主體。程式由 `print(\"Three\")` 開始，調用 printsth() 時才輸出 One、Two。","_right":0,"_ans":"Three\nOne\nTwo\nFour","_run":{"out":"Three\nOne\nTwo\nFour\n","err":null,"vrepr":{},"files":{},"steps":[{"l":1,"v":{},"o":0},{"l":5,"v":{},"o":0},{"l":6,"v":{},"o":6},{"l":2,"v":{},"o":6,"fn":"printsth"},{"l":3,"v":{},"o":10,"fn":"printsth"},{"l":7,"v":{},"o":14}],"cut":false}}],"practice":[{"id":"c4-s2-p1","type":"fill","pts":1,"src":"教科書 p.116 活動 4.2 第 3 題","q":"寫出程式的輸出。","code":"def birthday():\n    return \"Jan\", 1\n\nmonth, day = birthday()\nprint(day, month)","blanks":[{"label":"輸出","ask":"out"}],"hint":"傳回兩個值，依次存入 month、day；列印時次序對調。","_ans":["1 Jan"]},{"id":"c4-s2-p2","type":"mc","pts":1,"src":"教科書 p.116 活動 4.2 第 4 題","verify":true,"q":"以下程式的輸出是什麼？","code":"def isOdd(num):\n    if num % 2 == 0:\n        return False\n    else:\n        return True\n\nif isOdd(4) == True:\n    print(\"This is an odd number\")\nelse:\n    print(\"This is an even number\")","options":["This is an even number","This is an odd number","False","True"],"answer":0,"hint":"4 % 2 == 0，傳回 False。","_right":0},{"id":"c4-s2-p3","type":"fill","pts":1,"src":"教科書 p.115 活動 4.1","q":"執行以下程式會出現什麼錯誤？（寫錯誤類型名稱）","code":"total = add3(1, 2, 3)\n\ndef add3(a, b, c):\n    s = a + b + c\n    return s\n\nprint(total)","blanks":[{"label":"錯誤類型","ask":{"error":true}}],"hint":"子程式必須在被調用前定義。","_ans":["NameError"]},{"id":"c4-s2-p4","type":"complete","pts":2,"src":"教科書 p.111 測試站 4.1 第 2 題（參考 DSE 2015 2D Q1ai）","label":"補完程式","q":"`functionA(a, b)` 傳回兩數的差（大減小），`functionB(c, d)` 傳回較大的數。例如 functionA(3, 9) 傳回 6，functionB(3, 9) 傳回 9。會用多組數據測試。","template":"def functionA(a, b):\n    if a > b:\n        return ［1］\n    else:\n        return ［2］\n\ndef functionB(c, d):\n    if ［3］:\n        return c\n    return d\n\nx = int(input())\ny = int(input())\nprint(functionA(x, y), functionB(x, y))","ref":["a - b","b - a","c > d"],"tests":[{"inputs":"6\n2"},{"inputs":"3\n9"},{"inputs":"5\n10"},{"inputs":"3\n-4"},{"inputs":"7\n7"}],"hint":"`return` 之後的語句不會執行，所以 functionB 第一個 return 不用配 else。（教科書答案：functionA(5, 10) = 5；functionB(3, -4) = 3）","_exp":[{"out":"6\n2\n4 6\n","err":null},{"out":"3\n9\n6 9\n","err":null},{"out":"5\n10\n5 10\n","err":null},{"out":"3\n-4\n7 3\n","err":null},{"out":"7\n7\n0 7\n","err":null}]}]},{"id":"s3","title":"變量範圍：局部變量及全程變量","pages":"教科書 p.124–127","learn":[{"pts":["每個變量都有有效的使用**範圍**，主要分為**局部變量**及**全程變量**。（p.124）","**局部變量**：在子程式中宣告的變量，**形式參數也是局部變量**；只在該子程式內有效，子程式結束後便被捨去。在子程式外使用它會出現 `NameError`。（p.124 活動 4.3）","兩個子程式內同名的局部變量（例如 add 和 sub 都有 result）是**不同的變量**。（p.124）","**全程變量**：在子程式之外宣告的變量，有效範圍涵蓋整個程式，包括所有子程式之內——子程式可以直接**讀取**它。（p.125）","子程式內對變量**賦值**，Python 便視它為局部變量。要**修改**全程變量，須在子程式內寫 `global 變量名稱`。（p.125）","類比：「紅的」行走全港 = 全程變量；「綠的」「藍的」只在新界、大嶼山 = 局部變量。（p.126）"]},{"sim":{"code":"adj = \"fun\"\n\ndef fill():\n    print(\"Python is \" + adj)\n\nfill()\nprint(adj, adj, adj)","step":true,"open":["vars"],"_run":{"out":"Python is fun\nfun fun fun\n","err":null,"vrepr":{"adj":"'fun'"},"files":{},"steps":[{"l":1,"v":{},"o":0},{"l":3,"v":{"adj":"'fun'"},"o":0},{"l":6,"v":{"adj":"'fun'"},"o":0},{"l":4,"v":{"adj":"'fun'"},"o":0,"fn":"fill"},{"l":7,"v":{"adj":"'fun'"},"o":14}],"cut":false}},"cap":"p.125：子程式 fill 只讀取全程變量 adj，不用 global。"},{"fix":{"bad":"score = 0\n\ndef add1():\n    score = score + 1\n\nadd1()\nprint(score)","good":"score = 0\n\ndef add1():\n    global score\n    score = score + 1\n\nadd1()\nprint(score)","why":"p.125：沒有 `global` 時，add1 內的 score 是局部變量，但在賦值前就要讀取它的值，出現 `UnboundLocalError`（一種 NameError）。"}}],"tries":[{"id":"c4-s3-t1","pts":4,"src":"仿教科書 p.124","tags":[{"t":"trap","why":"子程式內對變量賦值，Python 便把它當作局部變量；要修改全程變量須用 global。"}],"code":"result = 100\n\ndef add(a, b):\n    result = a + b\n    print(result)\n\nadd(1, 1)\nprint(result)","q":"先估：輸出是什麼？","options":["2\n100","2\n2","100\n100","2"],"why":"add 內的 result 是局部變量（有賦值、沒有 global），與全程變量 result 是不同的變量。子程式結束後局部變量被捨去，全程變量仍是 100。","_right":0,"_ans":"2\n100","_run":{"out":"2\n100\n","err":null,"vrepr":{"result":"100"},"files":{},"steps":[{"l":1,"v":{},"o":0},{"l":3,"v":{"result":"100"},"o":0},{"l":7,"v":{"result":"100"},"o":0},{"l":4,"v":{"result":"100","a":"1","b":"1"},"o":0,"fn":"add"},{"l":5,"v":{"result":"2","a":"1","b":"1"},"o":0,"fn":"add"},{"l":8,"v":{"result":"100"},"o":2}],"cut":false}}],"practice":[{"id":"c4-s3-p1","type":"mc","pts":2,"src":"教科書 p.125","tags":[{"t":"trap","why":"子程式內對變量賦值，Python 便把它當作局部變量；要修改全程變量須用 global。"}],"verify":true,"ask":{"error":true},"q":"執行以下程式會出現什麼錯誤？","code":"score = 0\n\ndef add1():\n    score = score + 1\n\nadd1()\nprint(score)","options":["UnboundLocalError","SyntaxError","TypeError","沒有錯誤"],"answer":0,"hint":"子程式內有 `score = …`，所以 score 是局部變量；右邊讀取它時它還沒有值。","_right":0},{"id":"c4-s3-p2","type":"fill","pts":1,"src":"教科書 p.124 活動 4.3","q":"以下程式會出現什麼錯誤？（寫錯誤類型名稱）","code":"def add(a, b):\n    result = a + b\n\nadd(1, 1)\nprint(result)","blanks":[{"label":"錯誤類型","ask":{"error":true}}],"hint":"result 是 add 的局部變量，子程式結束後已被捨去。（教科書：使用超出有效範圍的變量）","_ans":["NameError"]},{"id":"c4-s3-p3","type":"complete","pts":2,"src":"教科書 p.126–127 測試站 4.3（參考 DSE 2018 2D Q3）","label":"補完程式","q":"`username` 和 `N`（長度）是全程變量。`hasDigit()` 在用戶名稱包含數字時傳回 True，否則傳回 False。補完傳回值。會用多組數據測試。","template":"username = input()\nN = len(username)\n\ndef hasDigit():\n    for i in range(0, N):\n        if username[i] >= \"0\" and username[i] \u003c= \"9\":\n            return ［1］\n    return ［2］\n\ndef noSpace():\n    for i in range(0, N):\n        if username[i] == \" \":\n            return False\n    return True\n\nprint(hasDigit(), noSpace())","ref":["True","False"],"tests":[{"inputs":"abc1"},{"inputs":"abc"},{"inputs":"ab 1"},{"inputs":"9"},{"inputs":"a b"}],"hint":"一找到數字便可以 `return True`（子程式立即結束）；整個循環完結都找不到，才 `return False`。注意第二個 return 不在循環之內。","_exp":[{"out":"abc1\nTrue True\n","err":null},{"out":"abc\nFalse True\n","err":null},{"out":"ab 1\nTrue False\n","err":null},{"out":"9\nTrue True\n","err":null},{"out":"a b\nFalse False\n","err":null}]}]},{"id":"s4","title":"傳遞參數","pages":"教科書 p.128–129","learn":[{"pts":["**傳遞參數**：調用子程式時，實際參數傳遞至形式參數。Python 按實際參數的數據類型決定傳遞方法。（p.128）","**不可變的物件**：整數、浮點數、布爾、字串。實際參數的值被**複製**到形式參數；在子程式內修改形式參數**不會影響**實際參數。（p.128）","**可變的物件**：列表。形式參數儲存實際參數的記憶體地址（**指示標**）；在子程式內修改列表的項目**會影響**實際參數。（p.129）","C++ 的類似做法：**按值調用**（call-by-value）、**按址調用**（call-by-reference）。（p.129 擴闊視野）","注意：如果在子程式內把形式參數**賦值為另一個列表**（例如 `x = [0]`），它便指向新列表，不再影響實際參數。"]},{"table":{"head":["實際參數的數據類型","物件種類","修改形式參數會否影響實際參數"],"rows":[["int、float、bool、str","不可變的物件（複製值）","不會"],["list","可變的物件（記憶體地址）","會（修改項目時）"]]},"cap":"p.141 課文總結"},{"sim":{"code":"def add(x):\n    print(\"Inside, before add:\", x)\n    x = x + 1\n    print(\"Inside, after add:\", x)\n\nnum = 1\nprint(\"Outside, before add:\", ":"x = 1\ny = 1\nd = 1\n\ndef FW():\n    global x, y\n    if d == 1:\n        y = y + 1\n    elif d == 2:\n        x = x + 1\n    elif d == 3:\n        y = y - 1\n    else:\n        x = x - 1\n\ndef TR():\n    global d\n    d = d % 4 + 1\n\ndef TL():\n    for i in range(0, ［1］):\n        TR()\n\ndef SQ(N):\n    for i in range(0, ［2］):\n        for j in range(0, ［3］):\n            FW()\n        TR()\n        print(x, y, d)\n\nN = int(input())\nSQ(N)\nprint(x, y, d)\nTL()\nFW()\nprint(x, y, d)","ref":["3","4","N"],"tests":[{"inputs":"3"},{"inputs":"1"},{"inputs":"5"},{"inputs":"0"}],"hint":"逆時針 90° = 順時針 270° = TR 三次。正方形有 4 邊，每邊 FW N 次，然後 TR。（教科書答案：1 至 3；i 由 1 至 4、j 由 1 至 N）","_exp":[{"out":"3\n1 4 2\n4 4 3\n4 1 4\n1 1 1\n1 1 1\n0 1 4\n","err":null},{"out":"1\n1 2 2\n2 2 3\n2 1 4\n1 1 1\n1 1 1\n0 1 4\n","err":null},{"out":"5\n1 6 2\n6 6 3\n6 1 4\n1 1 1\n1 1 1\n0 1 4\n","err":null},{"out":"0\n1 1 2\n1 1 3\n1 1 4\n1 1 1\n1 1 1\n0 1 4\n","err":null}]},{"id":"c4-s5-p2","type":"mc","pts":2,"src":"教科書 p.137–138","q":"以下哪一項**不是**使用子程式存根的原因？","options":["令主程式在部分子程式未完成時仍可運行","排除某些子程式，縮窄除錯範圍","令最終程式運行得較快","可以先測試其中一個子程式"],"answer":2,"hint":"存根只是臨時的程式碼，完成後要換回真正的子程式。","_right":2}]},{"id":"write","kind":"write","title":"寫子程式","pages":"教科書 p.117–119、p.145–146","intro":"每題的子程式已用**子程式存根**佔位（只傳回固定值），主程式已寫好。把存根換成真正的子程式，先按「▶ 執行」自己測試，再按「提交評核」。","tasks":[{"id":"c4-w1","tier":"必做","pts":12,"title":"十二生肖 zodiac(year)","src":"教科書 p.145 課題練習第 3 題","q":"列表 `Z` 依次儲存十二生肖。完成子程式 `zodiac(year)`，傳回該年份所屬的生肖。\n提示：先將年份減去 4，再除以 12；餘數是 0 便是 \"rat\"，餘數是 1 便是 \"ox\"，如此類推。\n例如輸入 `2023`，輸出 `rabbit`。","starter":"Z = [\"rat\", \"ox\", \"tiger\", \"rabbit\", \"dragon\", \"snake\", \"horse\", \"goat\", \"monkey\", \"rooster\", \"dog\", \"pig\"]\n\ndef zodiac(year):\n    return \"rat\"        # 子程式存根\n\nyear = int(input())\nprint(zodiac(year))","ref":"Z = [\"rat\", \"ox\", \"tiger\", \"rabbit\", \"dragon\", \"snake\", \"horse\", \"goat\", \"monkey\", \"rooster\", \"dog\", \"pig\"]\n\ndef zodiac(year):\n    remainder = (year - 4) % 12\n    return Z[remainder]\n\nyear = int(input())\nprint(zodiac(year))","tests":[{"inputs":"2023"},{"inputs":"2013"},{"inputs":"2020"},{"inputs":"2019"},{"inputs":"2024"}],"rules":[{"must":"def zodiac(","msg":"要定義子程式 zodiac(year)"},{"must":"return","msg":"子程式要用 return 傳回生肖"}],"hint":"`remainder = (year - 4) % 12`，然後 `return Z[remainder]`。教科書的陣列由 1 開始，所以寫 `Z[remainder + 1]`；Python 列表由 0 開始，不用加 1。Z 是全程變量，可以直接讀取。","_exp":[{"out":"2023\nrabbit\n","err":null},{"out":"2013\nsnake\n","err":null},{"out":"2020\nrat\n","err":null},{"out":"2019\npig\n","err":null},{"out":"2024\ndragon\n","err":null}],"_sample":"2023\nrabbit\n"},{"id":"c4-w2","tier":"進階","pts":13,"title":"十六進制轉十進制","src":"教科書 p.146 課題練習第 4 題","q":"完成兩個子程式：\n• `F1(c)`：把一個字元 `c`（\"0\"–\"9\" 或 \"A\"–\"F\"）轉換為 0 至 15 的數字並傳回，例如 F1(\"D\") 傳回 13。\n• `hex2dec(h)`：把十六進制字串 h 轉換為十進制數字並傳回，要**調用 F1**。\n例如輸入 `9B1`，輸出 `2481`。（不可以用 `int(h, 16)`。）","starter":"def F1(c):\n    return 0            # 子程式存根\n\ndef hex2dec(h):\n    return 0            # 子程式存根\n\nh = input()\nprint(hex2dec(h))","ref":"def F1(c):\n    if c >= \"0\" and c \u003c= \"9\":\n        return int(c)\n    return ord(c) - ord(\"A\") + 10\n\ndef hex2dec(h):\n    dec = 0\n    length = len(h)\n    for i in range(0, length):\n        digit = length - 1 - i\n        dec = dec + F1(h[i]) * (16 ** digit)\n    return dec\n\nh = input()\nprint(hex2dec(h))","tests":[{"inputs":"9B1"},{"inputs":"FF"},{"inputs":"0"},{"inputs":"A"},{"inputs":"1000"},{"inputs":"7E3"}],"rules":[{"mustNot":", 16)","msg":"不可以用 int(h, 16)"},{"must":"def F1(","msg":"要定義子程式 F1(c)"},{"must":"def hex2dec(","msg":"要定義子程式 hex2dec(h)"}],"hint":"F1：數字字元用 `int(c)`；字母用 `ord(c) - ord(\"A\") + 10`。hex2dec（教科書答案）：`digit = length - 1 - i`，`dec = dec + F1(h[i]) * (16 ** digit)`。dec、length、digit 都是局部變量。","_exp":[{"out":"9B1\n2481\n","err":null},{"out":"FF\n255\n","err":null},{"out":"0\n0\n","err":null},{"out":"A\n10\n","err":null},{"out":"1000\n4096\n","err":null},{"out":"7E3\n2019\n","err":null}],"_sample":"9B1\n2481\n"},{"id":"c4-w3","tier":"挑戰","pts":10,"title":"藏寶地圖 coins(i, j)","src":"教科書 p.117–119 例題 4.1（參考 DSE 2019 2D Q4）","q":"二維列表 `C` 儲存 6 × 8 藏寶地圖每格的金幣數量。教科書的位置 (i, j) 由 **1** 開始（第 i 列、第 j 欄），對應 Python 的 `C[i - 1][j - 1]`。\n完成子程式 `coins(i, j)`，傳回位置 (i − 1, j − 1) 至 (i + 1, j + 1) 這 3 × 3 區域的金幣總和；**超出地圖的格不計算**（例題 4.1(d)）。\n例如輸入 `5` 和 `2`，輸出 `15`；輸入 `1` 和 `7`，輸出 `5`。","starter":"C = [[0, 0, 1, 0, 2, 2, 0, 0],\n     [4, 3, 4, 2, 2, 3, 0, 0],\n     [3, 6, 3, 10, 2, 2, 0, 0],\n     [0, 4, 5, 6, 7, 3, 3, 0],\n     [0, 3, 3, 3, 7, 5, 5, 2],\n     [0, 0, 0, 0, 0, 0, 1, 1]]\n\ndef coins(i, j):\n    return 0            # 子程式存根\n\ni = int(input())\nj = int(input())\nprint(coins(i, j))","ref":"C = [[0, 0, 1, 0, 2, 2, 0, 0],\n     [4, 3, 4, 2, 2, 3, 0, 0],\n     [3, 6, 3, 10, 2, 2, 0, 0],\n     [0, 4, 5, 6, 7, 3, 3, 0],\n     [0, 3, 3, 3, 7, 5, 5, 2],\n     [0, 0, 0, 0, 0, 0, 1, 1]]\n\ndef coins(i, j):\n    total = 0\n    for x in range(1, 4):\n        for y in range(1, 4):\n            r = i - 2 + x\n            c = j - 2 + y\n            if 1 \u003c= r \u003c= 6 and 1 \u003c= c \u003c= 8:\n                total = total + C[r - 1][c - 1]\n    return total\n\ni = int(input())\nj = int(input())\nprint(coins(i, j))","tests":[{"inputs":"5\n2"},{"inputs":"4\n4"},{"inputs":"1\n7"},{"inputs":"6\n8"},{"inputs":"1\n1"},{"inputs":"3\n4"}],"hint":"教科書答案：x、y 由 1 至 3，位置是 `[i-2+x, j-2+y]`；先檢查 `1 \u003c= i-2+x \u003c= 6 and 1 \u003c= j-2+y \u003c= 8`。Python 讀取時兩個索引都要減 1。注意：Python 的負數索引不會出錯，但會讀錯格，所以一定要檢查範圍。","_exp":[{"out":"5\n2\n15\n","err":null},{"out":"4\n4\n46\n","err":null},{"out":"1\n7\n5\n","err":null},{"out":"6\n8\n9\n","err":null},{"out":"1\n1\n7\n","err":null},{"out":"3\n4\n41\n","err":null}],"_sample":"5\n2\n15\n"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.112–138","items":[{"id":"c4-q1","pts":4,"src":"自擬（DSE 卷二D 風格）","tags":[{"t":"hot","why":"卷二D 常要求寫出調用子程式的傳回值（DSE 2015 2D Q1、2019 2D Q2、2019 2D Q4）"}],"verify":true,"q":"以下程式的輸出是什麼？","code":"def f(a, b):\n    a = a + b\n    b = a - b\n    return a * b\n\nx = 2\ny = 3\nprint(f(y, x), x, y)","options":["15 2 3","10 2 3","15 5 3","10 5 2"],"answer":"A","why":"實際參數按次序傳遞：a = y = 3、b = x = 2。a = 5，b = 3，傳回 15。x、y 是整數（不可變），不受影響。","_right":0},{"id":"c4-q2","pts":4,"src":"教科書 p.108 常見錯誤","tags":[{"t":"trap","why":"列印不等於傳回；沒有 return 的子程式傳回 None。"}],"verify":true,"q":"以下程式的輸出是什麼？","code":"def double(x):\n    print(x * 2)\n\ny = double(4)\nprint(y)","options":["8\nNone","8\n8","8","None"],"answer":"A","why":"double 只列印 8，沒有 return，所以傳回值是 None，y 便是 None。","_right":0},{"id":"c4-q3","pts":4,"src":"教科書 p.124–128","tags":[{"t":"trap","why":"子程式內對變量賦值，Python 便把它當作局部變量；要修改全程變量須用 global。"}],"verify":true,"q":"以下程式的輸出是什麼？","code":"x = 5\n\ndef f():\n    global x\n    x = x * 2\n\ndef g(x):\n    x = x + 1\n    return x\n\nf()\ny = g(x)\nprint(x, y)","options":["10 11","5 6","10 10","11 11"],"answer":"A","why":"f 用 global，把全程變量 x 改為 10。g 的形式參數 x 是局部變量，加 1 後傳回 11，全程變量 x 仍是 10。","_right":0},{"id":"c4-q4","pts":4,"src":"教科書 p.129","tags":[{"t":"trap","why":"列表是可變的物件：在子程式內改動項目會影響實際參數；但把形式參數賦值為另一個列表則不會。"}],"verify":true,"q":"以下程式的輸出是什麼？","code":"def h(a):\n    a[0] = a[0] + len(a)\n    a = [0]\n    a[0] = 9\n\nnums = [1, 2]\nh(nums)\nprint(nums)","options":["[3, 2]","[9]","[1, 2]","[9, 2]"],"answer":"A","why":"第 2 行修改的是 nums 指向的列表（1 + 2 = 3）；第 3 行之後 a 指向新列表，再修改不影響 nums。","_right":0},{"id":"c4-q5","pts":4,"src":"教科書 p.137–142","q":"一個程式由主程式及子程式 A 至 E 組成。子程式 C 未完成，其他人想先測試子程式 D。最合適的做法是：","options":["等所有子程式完成後才一起測試","為子程式 C 寫一個子程式存根，例如只傳回一個固定值","把子程式 C 的程式碼複製到主程式內","把所有子程式合併成一個大的子程式"],"answer":"B","why":"子程式存根令主程式在子程式未完成時仍可運行，亦可縮窄除錯範圍。合併子程式會失去模組化的好處。","_right":1}]},{"id":"more","kind":"endless","title":"無限練習","gens":["pyFunc","pyErr","pyList"],"intro":"隨機生成子程式（傳回值、局部與全程變量）、錯誤類型及列表的估輸出題目，答案由程式計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]}, {"code":"選修C","title":"選修C 算法與程式編寫 自學平台","kicker":"HKDSE ICT · 選修 C","pin":"cict2026"});
