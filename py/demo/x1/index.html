PY.unit({"id":"x1","title":"示範單元：所有題型","book":"框架示範（不是教科書內容）","key":"DEMO-x1-hmac-3c9a51f07e","writeLabel":"寫程式","sections":[{"id":"s1","title":"輸入、輸出與變量","pages":"示範 p.1–2","learn":[{"pts":["`print()` 把結果顯示在 Shell。","`input()` 得到的一定是**字串**，要計算便用 `int()` 或 `float()`。"]},{"h":"數據類型"},{"table":{"head":["例子","類型"],"rows":[["`12`","int"],["`3.5`","float"],["`\"12\"`","str"],["`True`","bool"]]},"cap":"常見數據類型。"},{"note":"在 Thonny 按 F5 執行；這裏按「▶ 執行」。"},{"warn":"`input()` 得到字串，`\"5\" + 1` 會出現 TypeError。"},{"fix":{"bad":"age = input(\"Age? \")\nprint(age + 1)","good":"age = int(input(\"Age? \"))\nprint(age + 1)","why":"先用 `int()` 把字串轉成整數。"}},{"code":"name = \"Amy\"\nprint(\"Hello\", name)","cap":"字串要加引號。"},{"sim":{"code":"n = int(input(\"n? \"))\ntotal = 0\nfor i in range(1, n + 1):\n    total = total + i\nprint(\"total =\", total)","inputs":"4","step":true,"open":["trace"],"_run":{"out":"n? 4\ntotal = 10\n","err":null,"vrepr":{"n":"4","total":"10","i":"4"},"files":{},"steps":[{"l":1,"v":{},"o":0},{"l":2,"v":{"n":"4"},"o":5},{"l":3,"v":{"n":"4","total":"0"},"o":5},{"l":4,"v":{"n":"4","total":"0","i":"1"},"o":5},{"l":3,"v":{"n":"4","total":"1","i":"1"},"o":5},{"l":4,"v":{"n":"4","total":"1","i":"2"},"o":5},{"l":3,"v":{"n":"4","total":"3","i":"2"},"o":5},{"l":4,"v":{"n":"4","total":"3","i":"3"},"o":5},{"l":3,"v":{"n":"4","total":"6","i":"3"},"o":5},{"l":4,"v":{"n":"4","total":"6","i":"4"},"o":5},{"l":3,"v":{"n":"4","total":"10","i":"4"},"o":5},{"l":5,"v":{"n":"4","total":"10","i":"4"},"o":5}],"cut":false}},"cap":"按「⏭ 下一步」逐行執行，看追蹤表；也可以修改程式後按「▶ 執行」。"}],"tries":[{"id":"x1-s1-t1","pts":4,"src":"示範 p.1","code":"x = int(input(\"x? \"))\nprint(x * 2)","inputs":"7","q":"先估：輸入 7，Shell 顯示什麼？","options":["x? 7\n14","14","x? 7\n77","77"],"why":"`int()` 把 \"7\" 轉成 7；Shell 亦會顯示提示及輸入值。","_right":0,"_ans":"x? 7\n14","_run":{"out":"x? 7\n14\n","err":null,"vrepr":{"x":"7"},"files":{},"steps":[{"l":1,"v":{},"o":0},{"l":2,"v":{"x":"7"},"o":5}],"cut":false}},{"id":"x1-s1-t2","pts":4,"src":"示範 p.2", \u003cmodule>"}]},"vrepr":{"scores":"[70, 80, 90]"},"files":{},"steps":[{"l":1,"v":{},"o":0},{"l":2,"v":{"scores":"[70, 80, 90]"},"o":0}],"cut":false}}],"practice":[{"id":"x1-s2-p1","type":"trace","pts":4,"q":"完成追蹤表（每次循環一行）。","code":"n = 1\nk = 0\nwhile n \u003c 20:\n    n = n * 3\n    k = k + 1\nprint(n, k)","spec":{"mode":"iter","cols":["n","k"],"out":false},"hint":"n：1 → 3 → 9 → 27。","_trace":{"mode":"iter","cols":[{"key":"n","label":"n"},{"key":"k","label":"k"}],"rows":[{"label":"循環前","line":3,"cells":[{"v":"1","changed":true},{"v":"0","changed":true}]},{"label":"第 1 次","line":3,"cells":[{"v":"3","changed":true},{"v":"1","changed":true}]},{"label":"第 2 次","line":3,"cells":[{"v":"9","changed":true},{"v":"2","changed":true}]},{"label":"第 3 次","line":3,"cells":[{"v":"27","changed":true},{"v":"3","changed":true}]}]}},{"id":"x1-s2-p2","type":"complete","pts":4,"q":"補完程式：輸入一個整數，如果是雙數輸出 even，否則輸出 odd。","template":"n = int(input())\nif n % 2 ［1］ 0:\n    print(\"even\")\nelse:\n    print(［2］)","ref":["==","\"odd\""],"tests":[{"inputs":"4"},{"inputs":"7"},{"inputs":"0"}],"hint":"比較相等用 ==。","_exp":[{"out":"4\neven\n","err":null},{"out":"7\nodd\n","err":null},{"out":"0\neven\n","err":null}]},{"id":"x1-s2-p3","type":"mc","pts":2,"q":"要在檔案最後加一行，應該用哪個模式？","options":["\"r\"","\"w\"","\"a\"","\"x\""],"answer":2,"hint":"a = append。","_right":2}]},{"id":"s3","title":"隨機數與檔案處理","pages":"示範 p.5","learn":[{"pts":["以下用固定的隨機數（fixRandom）核對答案。"]}],"tries":[{"id":"x1-s3-t1","pts":4,"src":"示範 p.5","code":"import random\na = random.randint(1, 10)\nb = random.randint(1, 10)\nprint(a + b)","fixRandom":{"randint":4},"q":"假設 randint 每次都得到 4，輸出是什麼？","options":["8","44","4","16"],"why":"4 + 4 = 8。","_right":0,"_ans":"8","_run":{"out":"8\n","err":null,"vrepr":{"a":"4","b":"4"},"files":{},"steps":[{"l":1,"v":{},"o":0},{"l":2,"v":{},"o":0},{"l":3,"v":{"a":"4"},"o":0},{"l":4,"v":{"a":"4","b":"4"},"o":0}],"cut":false}}],"practice":[{"id":"x1-s3-p1","type":"complete","pts":4,"q":"補完程式：把 names.txt 每一行轉成 ,"title":"平均分","q":"列表 `marks` 已給出。計算平均分，存入變量 `avg`（不用輸出）。","starter":"marks = [int(x) for x in input().split()]\navg = 0","ref":"marks = [int(x) for x in input().split()]\ntotal = 0\nfor m in marks:\n    total = total + m\navg = total / len(marks)","tests":[{"inputs":"60 70 80"},{"inputs":"1 2"},{"inputs":"10 20 25"}],"check":{"out":false,"vars":["avg"],"nums":true},"hint":"avg = 總和 / len(marks)。","_exp":[{"out":"60 70 80\n","err":null,"vars":{"avg":"70.0"}},{"out":"1 2\n","err":null,"vars":{"avg":"1.5"}},{"out":"10 20 25\n","err":null,"vars":{"avg":"18.333333333333332"}}],"_sample":"60 70 80\n"}]},{"kind":"quiz","id":"quiz","title":"小測","items":[{"id":"x1-q1","pts":4,"src":"示範","tags":[{"t":"hot","why":"常考 int/float"}],"q":"以下程式的輸出是什麼？","code":"print(7 // 2, 7 / 2)","options":["3 3.5","3.5 3","3 3","4 3.5"],"answer":"A","verify":true,"why":"// 向下取整。","_right":0},{"id":"x1-q2","pts":4,"src":"示範","tags":[{"t":"trap","why":"易混淆 append/insert"}],"q":"程式完結後 a 是什麼？","code":"a = [1, 2]\na.insert(0, 5)","ask":{"var":"a"},"options":["[5, 1, 2]","[1, 2, 5]","[1, 5, 2]","[5, 2]"],"answer":"A","verify":true,"why":"insert(0, 5) 放在最前。","_right":0},{"id":"x1-q3","pts":4,"src":"示範","q":"輸入 3 時輸出是什麼？","code":"n = int(input())\nprint(n * \"ab\")","inputs":"3","options":["3\nababab","ababab","3ab","錯誤"],"answer":"A","verify":true,"why":"Shell 也會顯示輸入的 3。","_right":0},{"id":"x1-q4","pts":4,"src":"示範","q":"哪一個是合法的變量名稱？","options":["`2total`","`total_2`","`total-2`","`total 2`"],"answer":"B","why":"只可用字母、數字、底線，不可以數字開頭。","_right":1},{"id":"x1-q5","pts":4,"src":"示範","q":"以下程式會出現甚麼錯誤？","code":"x = 5\nif x > 3\n    print(x)","ask":{"error":true},"options":["SyntaxError","IndentationError","NameError","沒有錯誤"],"answer":"A","verify":true,"why":"if 一行少了冒號。","_right":0}]},{"kind":"endless","id":"more","title":"無限練習","gens":["pyArith","pyCast","pyPrint","pyIf","pyBool","pyRange","pyFor","pyWhile","pyList","pyListAlgo","pyStr","pyAscii","pyFunc","pySearch","pySort","pyStack","pyQueue","pyErr"]},{"
