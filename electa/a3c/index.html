SQ.unit({"id":"a3c","title":"子查詢：IN、EXISTS、ANY、ALL","book":"教科書 選修A 第 3 章 p.134–157","key":"A-a3c-hmac-3ba03210ab","theory":false,"dbs":{"sub":{"STUDENT":[["SID","NAME","SEX","CLASS","SCORE"],[["03493","Ada","F","3A",0],["03496","Clem","F","3B",89],["03505","Eva","F","3B",83],["03506","Gabe","M","3C",47],["03510","Finn","M","3B",35],["03513","Dio","M","3C",67],["03517","Ben","M","3A",86]],["SID"]],"SC":[["SID","CID"],[["03493",2],["03496",1],["03496",2],["03496",4],["03505",4],["03506",4],["03510",1],["03513",4]],["SID","CID"]],"CLUB":[["CID","NAME","ROOM","TEACH"],[[1,"Chess Club",501,"Mr Chan"],[2,"Art Club",402,"Mrs Lee"],[3,"English Club",203,"Mr Suen"],[4,"Science Club",502,"Mr Wong"]],["CID"]],"STUDENT2":[["SID","NAME","SEX","CLASS","SCORE"],[["03518","Xing","M","3A",83],["03519","Yen","F","3B",47],["03520","Zack","M","3B",null]],["SID"]]},"any":{"STUDENT":[["SID","NAME","SEX","CLASS","SCORE"],[["03493","Ada","F","3A",0],["03496","Clem","F","3B",89],["03505","Eva","F","3B",83],["03506","Gabe","M","3C",47],["03510","Finn","M","3B",35],["03513","Dio","M","3C",67],["03517","Ben","M","3A",86]],["SID"]],"STUDENT2":[["SID","NAME","SEX","CLASS","SCORE"],[["03518","Xing","M","3A",83],["03519","Yen","F","3B",47],["03520","Zack","M","3B",60]],["SID"]]},"ins":{"STUDENT":[["SID","NAME","SEX","CLASS","SCORE"],[["03493","Ada","F","3A",0],["03496","Clem","F","3B",89],["03505","Eva","F","3B",83],["03506","Gabe","M","3C",47],["03510","Finn","M","3B",35],["03513","Dio","M","3C",67],["03517","Ben","M","3A",86]],["SID"]],"STUDENT2":[["ID","NAME","SEX","CLASS","DOB"],[["03518","Xing","M","3A","2015-05-01"],["03519","Yen","F","3B","2015-01-05"],["03520","Zack","M","3C","2015-02-15"]],["ID"]]},"cat":{"CAT":[["ID","BID","HID","NAME","AGE","WEIGHT"],[[1,1,1,"Mochi",3,7],[2,2,1,"Coco",5,5],[3,1,1,"Luna",7,6],[4,3,1,"Kiki",2,4.2],[5,1,2,"Snow",4,6.8],[6,2,2,"Max",6,6.1],[7,4,2,"Bella",9,4],[8,3,3,"Tom",1,3.5],[9,4,3,"Nana",3,5],[10,3,3,"Lucky",8,4.1]],["ID"]],"BREED":[["ID","NAME","WEIGHT"],[[1,"Ragdoll",6.5],[2,"British Shorthair",5.5],[3,"Siamese",4],[4,"Persian",4.5]],["ID"]],"HOTEL":[["ID","NAME","CAPACITY"],[[1,"Alpha",3],[2,"Beta",4],[3,"Gamma",2],[4,"Delta",2]],["ID"]]},"game":{"PLAYER":[["ID","NAME","LEVEL","GOLD"],[[1,"Tom",12,500],[2,"Jerry",15,300],[3,"Amy",20,800],[4,"Ken",9,100],[5,"Mia",25,450],[6,"Leo",18,0]],["ID"]],"CLASS":[["ID","NAME","COST","MAXHP","STR"],[[1,"戰士",100,500,80],[2,"弓箭手",120,300,95],[3,"火魔法師",200,250,110],[4,"黑魔法師",250,220,120],[5,"騎士",300,600,90]],["ID"]],"ARMY":[["ID","OWNER","CID","HP"],[[1,1,1,500],[2,1,2,280],[3,2,3,250],[4,3,4,100],[5,3,1,450],[6,3,5,600],[7,4,1,480],[8,5,2,300],[9,5,2,120]],["ID"]]}},"sections":[{"id":"s1","title":"子查詢：找出最高分的學生","pages":"教科書 p.134–136","learn":[{"pts":["`SELECT MAX(SCORE) FROM STUDENT` 可以找出最高分（89），但**找不到是誰**取得最高分。（p.134）","常見錯誤：`SELECT NAME, MAX(SCORE) FROM STUDENT`——NAME 不是匯總的數據，與 MAX(SCORE) 沒有關係。舊版 MySQL 會隨便給一個名字（例如 Ada）；MySQL 8.0 預設會**報錯**。（p.134–135）","做法：先找出最高分，再找誰取得這個分數。把 `89` 換成用括號括起的查詢：（p.136）","`SELECT NAME, SCORE FROM STUDENT WHERE SCORE = (SELECT MAX(SCORE) FROM STUDENT)`","**子查詢（subquery）**：在一個查詢中利用另一個查詢的結果。括號內的子查詢先執行。","提示：用 `=`、`>`、`\u003c` 等比較運算符時，子查詢必須傳回**單一的值**，否則出錯。（p.136）"]},{"sim":{"db":"sub","sql":"SELECT NAME, SCORE FROM STUDENT WHERE SCORE = (SELECT MAX(SCORE) FROM STUDENT)"},"cap":"p.136：試把 MAX 改成 MIN；再試執行 `SELECT NAME, MAX(SCORE) FROM STUDENT`，看看錯誤訊息。"}],"tries":[{"id":"a3c-s1-t1","pts":4,"src":"教科書 p.136","db":"sub","sql":"SELECT NAME, SCORE FROM STUDENT WHERE SCORE > (SELECT AVG(SCORE) FROM STUDENT)","q":"先估：哪些學生的分數比所有學生的平均分高？","ask":{"col":"NAME"},"options":["Clem, Eva, Dio, Ben","Clem, Eva, Ben","Clem","Ada, Gabe, Finn"],"why":"平均分 = (0 + 89 + 83 + 47 + 35 + 67 + 86) ÷ 7 = 407 ÷ 7 ≈ 58.1；高於 58.1 的有 Clem、Eva、Dio、Ben。"}],"practice":[{"id":"a3c-s1-p1","type":"complete","pts":2,"src":"教科書 p.136","db":"sub","q":"列出取得**最低分**的學生之名字和分數。","template":"SELECT NAME, SCORE FROM STUDENT WHERE SCORE = ［1］","ref":["(SELECT MIN(SCORE) FROM STUDENT)"],"hint":"子查詢要用括號括起，傳回一個值。"},{"id":"a3c-s1-p2","type":"mc","pts":1,"src":"教科書 p.136 提示","db":"sub","q":"執行 `SELECT NAME FROM STUDENT WHERE SCORE = (SELECT SCORE FROM STUDENT2)` 會怎樣？（STUDENT2 有 3 行）","options":["列出與任何一位插班生同分的學生","列出與所有插班生同分的學生","出錯：= 之後的子查詢傳回多於一個值","沒有結果，但不會出錯"],"answer":2,"hint":"比較運算符後的子查詢只可傳回單一的值；多個值要用 IN、ANY 或 ALL。"},{"id":"a3c-s1-p3","type":"mc","pts":2,"src":"自擬（p.136 延伸）","db":"sub","verify":true,"ask":"table","q":"以下語句的結果是什麼？","sql":"SELECT NAME, SCORE FROM STUDENT\n    WHERE CLASS = '3B' AND SCORE \u003c (SELECT AVG(SCORE) FROM STUDENT WHERE CLASS = '3B')","options":["Finn, 35","Eva, 83\nFinn, 35","Ada, 0\nGabe, 47\nFinn, 35","Clem, 89\nEva, 83"],"answer":0,"hint":"3B 班的平均分 = (89 + 83 + 35) ÷ 3 = 69；3B 班中低於 69 的只有 Finn。"}]},{"id":"s2","title":"IN 與 NOT IN；用子查詢修改數據","pages":"教科書 p.137–140","learn":[{"pts":["**IN**：檢查一個值是否出現在子查詢的結果中。子查詢可以代替連接，令語句更簡單。（p.137–138）","至少加入了一個學會、且分數高於 70 的學生：連接寫法要 DISTINCT（Clem 在 SC 有三行）——`SELECT DISTINCT s.NAME FROM STUDENT s, SC WHERE s.SID = SC.SID AND SCORE > 70`；子查詢寫法：`SELECT NAME FROM STUDENT WHERE SCORE > 70 AND SID IN (SELECT SID FROM SC)`。（p.137–138）","IN 之後的子查詢只可選擇**一個**欄位。（p.138 提示）","**NOT IN**：檢查值**不在**子查詢結果中。未加入任何學會的學生：`SELECT NAME FROM STUDENT WHERE SID NOT IN (SELECT SID FROM SC)`，等於 `LEFT JOIN SC … WHERE SC.CID IS NULL`。（p.138–139）","子查詢也可用於 **INSERT、UPDATE、DELETE**（p.139–140）：","`INSERT INTO STUDENT (SELECT ID, NAME, SEX, CLASS, 0 FROM STUDENT2)`——欄位**數目**相同即可，名稱不必相同。","`UPDATE STUDENT SET SCORE = NULL WHERE SID IN (SELECT ID FROM STUDENT2)`；`DELETE FROM STUDENT WHERE SID IN (SELECT ID FROM STUDENT2)`。"]},{"sim":{"db":"sub","sql":"SELECT NAME FROM STUDENT WHERE SCORE > 70 AND SID IN (SELECT SID FROM SC)"},"cap":"p.138：Ben 86 分，但他不在 SC 中。"},{"sim":{"db":"ins","sql":"INSERT INTO STUDENT (SELECT ID, NAME, SEX, CLASS, 0 FROM STUDENT2);\nSELECT * FROM STUDENT"},"cap":"p.139：把插班生加入 STUDENT。再試在 INSERT 後加上 `UPDATE STUDENT SET SCORE = NULL WHERE SID IN (SELECT ID FROM STUDENT2);`。"}],"tries":[{"id":"a3c-s2-t1","pts":4,"src":"教科書 p.139–140","db":"ins","sql":"INSERT INTO STUDENT (SELECT ID, NAME, SEX, CLASS, 0 FROM STUDENT2);\nUPDATE STUDENT SET SCORE = NULL WHERE SID IN (SELECT ID FROM STUDENT2);\nSELECT COUNT(*), COUNT(SCORE), AVG(SCORE) FROM STUDENT","q":"先估：插入 3 位插班生並把他們的分數改為 NULL 後，結果是什麼？","ask":"table","options":["10, 7, 58.1428571429","10, 10, 40.7","7, 7, 58.1428571429","10, 7, 40.7"],"why":"COUNT(*) 點算全部 10 行；COUNT(SCORE) 和 AVG(SCORE) 都不計 NULL，所以仍是原本 7 位學生：407 ÷ 7。若分數仍是 0，平均分便會被拉低到 40.7——這就是書中把分數改為 NULL 的原因。"}],"practice":[{"id":"a3c-s2-p1","type":"complete","pts":2,"src":"教科書 p.139","db":"sub","q":"用子查詢列出尚未加入任何學會的學生之名字。","template":"SELECT NAME FROM STUDENT WHERE SID ［1］ (SELECT ［2］ FROM SC)","ref":["NOT IN","SID"],"hint":"「不在加入了學會的學生名單中」。子查詢只選擇一個欄位。"},{"id":"a3c-s2-p2","type":"mc","pts":1,"src":"教科書 p.137","db":"sub","verify":true,"ask":"rows","q":"以下語句（**沒有** DISTINCT）的結果有多少行？","sql":"SELECT s.NAME FROM STUDENT s, SC WHERE s.SID = SC.SID AND SCORE > 70","options":["2","3","4","5"],"answer":2,"hint":"Clem 在 SC 有 3 行，Eva 有 1 行。這就是連接寫法要加 DISTINCT 的原因。"},{"id":"a3c-s2-p3","type":"fill","pts":2,"src":"教科書 p.140","db":"ins","sql":"INSERT INTO STUDENT (SELECT ID, NAME, SEX, CLASS, 0 FROM STUDENT2);\nDELETE FROM STUDENT WHERE SID IN (SELECT ID FROM STUDENT2 WHERE CLASS \u003c> '3C');\nSELECT NAME FROM STUDENT WHERE SCORE = 0","q":"先插入插班生，再刪除部分插班生。最後輸出哪些名字？（用「, 」分隔）","blanks":[{"label":"名字","ask":{"col":"NAME"}}],"hint":"只刪除不是 3C 班的插班生（Xing、Yen）；Zack 在 3C 班，留下。原有學生中 Ada 也是 0 分。"}]},{"id":"s3","title":"EXISTS、NOT EXISTS 與 NULL 陷阱","pages":"教科書 p.140–143","learn":[{"pts":["**EXISTS**：檢查子查詢**有沒有結果**（有任何一行便是 TRUE）。（p.140）","`SELECT NAME, SCORE FROM STUDENT s WHERE EXISTS (SELECT 1 FROM STUDENT2 s2 WHERE s.SCORE = s2.SCORE)`：對 STUDENT 的**每一行**，子查詢都用該行的 s.SCORE 重新執行一次（**關聯子查詢**）。結果：Eva 83、Gabe 47。（p.141）","`SELECT 1` 中的 1 可以換成任何值或欄位——EXISTS 只看有沒有行，不看內容。（p.141）","大部分 IN 都可以改寫成 EXISTS：上例等於 `WHERE SCORE IN (SELECT SCORE FROM STUDENT2)`。（p.141）","**NOT EXISTS**：子查詢**沒有**結果時是 TRUE。結果：Ada、Clem、Finn、Dio、Ben。（p.142）","**陷阱**：改用 `SCORE NOT IN (SELECT SCORE FROM STUDENT2)` 卻**沒有任何結果**！因為 STUDENT2 中 Zack 的分數是 NULL：（p.142–143）","`89 NOT IN (83, 47, NULL)` = `89 \u003c> 83 AND 89 \u003c> 47 AND 89 \u003c> NULL` = TRUE AND TRUE AND **NULL** = NULL（不是 TRUE），所以不會列出。","`83 IN (83, 47, NULL)` = TRUE OR … = TRUE，所以 IN 不受 NULL 影響。"]},{"sim":{"db":"sub","sql":"SELECT NAME, SCORE FROM STUDENT s WHERE NOT EXISTS\n    (SELECT 1 FROM STUDENT2 s2 WHERE s.SCORE = s2.SCORE)"},"cap":"p.142：再試改寫成 `SELECT NAME, SCORE FROM STUDENT WHERE SCORE NOT IN (SELECT SCORE FROM STUDENT2)`，比較結果。"},{"warn":"子查詢的結果可能有 NULL 時，**不要**用 NOT IN，改用 NOT EXISTS，或在子查詢加上 `WHERE SCORE IS NOT NULL`。"}],"tries":[{"id":"a3c-s3-t1","pts":4,"src":"教科書 p.142","db":"sub","sql":"SELECT NAME, SCORE FROM STUDENT WHERE SCORE NOT IN (SELECT SCORE FROM STUDENT2)","q":"先估：STUDENT2 的分數是 83、47、NULL。結果有多少行？","ask":"rows","options":["0","2","5","7"],"why":"每個 SCORE 與 NULL 比較都得 NULL，令 NOT IN 的結果不是 TRUE，所以一行也沒有。NOT EXISTS 則有 5 行。"}],"practice":[{"id":"a3c-s3-p1","type":"complete","pts":2,"src":"教科書 p.142–143","db":"sub","q":"修正 NOT IN 的語句：在子查詢中排除 NULL，令結果與 NOT EXISTS 相同（5 行）。","template":"SELECT NAME, SCORE FROM STUDENT WHERE SCORE NOT IN (SELECT SCORE FROM STUDENT2 WHERE ［1］)","ref":["SCORE IS NOT NULL"],"hint":"判斷 NULL 要用 IS NOT NULL，不可以用 \u003c> NULL。"},{"id":"a3c-s3-p2","type":"mc","pts":2,"src":"教科書 p.141","db":"sub","verify":true,"ask":{"col":"NAME"},"q":"以下語句輸出哪些名字？","sql":"SELECT NAME FROM STUDENT s WHERE EXISTS\n    (SELECT 1 FROM STUDENT2 s2 WHERE s2.CLASS = s.CLASS AND s2.SCORE > s.SCORE)","options":["Ada","Ada, Finn","Ada, Eva, Finn","Ada, Clem, Eva, Finn, Ben"],"answer":1,"hint":"找出「同班的插班生中有人比他高分」的學生。3A：Xing 83 > Ada 0（但 \u003c Ben 86）；3B：Yen 47 > Finn 35；Zack 的 NULL 比較不成立。"},{"id":"a3c-s3-p3","type":"mc","pts":1,"src":"教科書 p.141","q":"在 `WHERE EXISTS (SELECT 1 FROM STUDENT2 s2 WHERE s.SCORE = s2.SCORE)` 中，把 `SELECT 1` 改成 `SELECT NAME` 會怎樣？","options":["結果不變","出錯","結果變成插班生的名字","結果變成空"],"answer":0,"hint":"EXISTS 只檢查子查詢有沒有行，不理會選擇了甚麼。"}]},{"id":"s4","title":"ANY 與 ALL","pages":"教科書 p.143–151","learn":[{"pts":["**ANY**（也可寫 **SOME**）：與子查詢中**任何一個**值比較，只要有一個成立便是 TRUE（即用 OR 連接）。（p.143）","`CLASS = ANY (SELECT CLASS FROM STUDENT2)` = `CLASS = '3A' OR CLASS = '3B' OR CLASS = '3B'` = `CLASS IN (…)`。（p.144）","IN 後面可以是一列數值 `IN ('3A', '3B')`；但 ANY、ALL 後面**必須是子查詢**，`= ANY ('3A', '3B')` 會出錯。（p.144、p.148）","`\u003c> ANY` **不等於** NOT IN：CLASS 不可能同時是 3A 和 3B，所以 `\u003c> ANY` 對每個學生都成立（毫無意義）。（p.144）","`SCORE > ANY (…)`：比**至少一位**（部分）插班生高分 = 比**最低分**高：`SCORE > (SELECT MIN(SCORE) …)`。日常說「比任何一個都高」其實是「全部」，SQL 的 ANY 不是這個意思！（p.145–146）","`SCORE \u003c ANY (…)` = 比最高分低：`SCORE \u003c (SELECT MAX(SCORE) …)`。（p.146–147）","**ALL**：與子查詢中**所有**值比較，全部成立才是 TRUE（即用 AND 連接）。（p.147）","`\u003c> ALL` = NOT IN；`= ALL` 不等於 IN（CLASS 不可能同時等於 3A 和 3B，永遠不成立）。（p.148–149）","`SCORE > ALL (…)` = 比最高分高：`> (SELECT MAX(SCORE) …)`；`SCORE \u003c ALL (…)` = 比最低分低：`\u003c (SELECT MIN(SCORE) …)`。（p.149–151）"]},{"table":{"head":["寫法","意思","等於"],"rows":[["= ANY","等於其中一個","IN"],["\u003c> ALL","與每一個都不同","NOT IN"],["> ANY","比至少一個大","> MIN"],["\u003c ANY","比至少一個小","\u003c MAX"],["> ALL","比全部都大","> MAX"],["\u003c ALL","比全部都小","\u003c MIN"],["\u003c> ANY","幾乎永遠成立","（毫無意義）"],["= ALL","（多於一個不同值時）永遠不成立","（毫無意義）"]]},"cap":"ANY 與 ALL 一覽（p.143–151）"},{"sim":{"db":"any","sql":"SELECT NAME, SCORE FROM STUDENT WHERE SCORE > ANY (SELECT SCORE FROM STUDENT2)"},"cap":"p.145：插班生是 83、47、60 分。再試 `\u003c ANY`、`> ALL`、`\u003c ALL`。"}],"tries":[{"id":"a3c-s4-t1","pts":4,"src":"教科書 p.146–147","db":"any","sql":"SELECT NAME, SCORE FROM STUDENT WHERE SCORE \u003c ANY (SELECT SCORE FROM STUDENT2)","q":"先估：插班生是 83、47、60 分。哪些學生的分數「\u003c ANY」插班生？","ask":{"col":"NAME"},"options":["Ada, Gabe, Finn, Dio","Ada, Finn","Ada, Gabe, Finn","Clem, Eva, Ben"],"why":"\u003c ANY = 比最高分（83）低：Ada 0、Gabe 47、Finn 35、Dio 67。Eva 83 不比 83 低。Dio 同時在 > ANY 和 \u003c ANY 的結果中。"}],"practice":[{"id":"a3c-s4-p1","type":"mc","pts":2,"src":"教科書 p.149–150","db":"any","verify":true,"ask":{"col":"NAME"},"q":"以下語句輸出哪些名字？","sql":"SELECT NAME FROM STUDENT WHERE SCORE > ALL (SELECT SCORE FROM STUDENT2)","options":["Clem, Ben","Clem, Eva, Ben","Clem, Eva, Dio, Ben","Clem"],"answer":0,"hint":"> ALL = 比最高分 83 高（Eva 83 不算）。"},{"id":"a3c-s4-p2","type":"fill","pts":1,"src":"教科書 p.144","db":"any","sql":"SELECT NAME FROM STUDENT WHERE CLASS \u003c> ANY (SELECT CLASS FROM STUDENT2)","q":"插班生的班別是 3A、3B、3B。以下語句的結果有多少行？","blanks":[{"label":"行數","ask":"rows"}],"hint":"`\u003c> ANY` 用 OR 連接：CLASS \u003c> 3A OR CLASS \u003c> 3B，每個學生都至少符合一個。"},{"id":"a3c-s4-p3","type":"complete","pts":2,"src":"教科書 p.146","db":"any","q":"不用 ANY，改寫 `SELECT NAME, SCORE FROM STUDENT WHERE SCORE > ANY (SELECT SCORE FROM STUDENT2)`，結果要相同。","template":"SELECT NAME, SCORE FROM STUDENT WHERE SCORE > (SELECT ［1］ FROM STUDENT2)","ref":["MIN(SCORE)"],"hint":"比至少一位插班生高分 = 比分數最低的插班生高分。"}]},{"id":"s5","title":"綜合：子查詢還是連接？","pages":"教科書 p.152–157（例題 3.3、測試站 3.3）","learn":[{"pts":["例題 3.3：CAT（ID, BID, HID, NAME, AGE, WEIGHT）、BREED（ID, NAME, WEIGHT）、HOTEL（ID, NAME, CAPACITY）。同一題可以用連接，也可以用 IN、ANY、EXISTS 子查詢。（p.152–153）","(a) 住在 Alpha 酒店的貓之品種：連接寫法要 **DISTINCT**（同一品種可能有多隻貓）；子查詢寫法 `SELECT NAME FROM BREED WHERE ID IN (SELECT BID FROM CAT, HOTEL h WHERE HID = h.ID AND h.NAME = 'Alpha')`。","主查詢**不能**選擇子查詢內的欄位：`SELECT NAME, h.NAME FROM BREED WHERE ID IN (SELECT … HOTEL h …)` 會出錯。（p.153 提示）","(c) 超出容量的酒店：`SELECT NAME FROM HOTEL h WHERE (SELECT COUNT(c.ID) FROM CAT c WHERE HID = h.ID) > CAPACITY`——子查詢放在比較的**左邊**也可以。（p.154）","(d) 年齡比所有布偶貓的平均年齡大的布偶貓：`AGE > (SELECT AVG(c2.AGE) FROM CAT c2 WHERE c2.BID = b.ID)`。（p.154）","(e) 沒有布偶貓居住的酒店，要用 **NOT IN**；寫成 `ID IN (… b.NAME \u003c> 'Ragdoll')` 是錯的——它列出「住了至少一隻非布偶貓」的酒店，這些酒店仍可能有布偶貓，而且沒有貓的酒店會被漏掉。（p.154）","有時連接比子查詢簡單，例如 (b) 要比較貓與其品種的體重。（p.153 提示）"]},{"sim":{"db":"cat","sql":"SELECT NAME FROM HOTEL WHERE ID NOT IN\n    (SELECT HID FROM CAT, BREED b WHERE BID = b.ID AND b.NAME = 'Ragdoll')"},"cap":"例題 3.3(e)（p.154）：再把 `NOT IN` 改成 `IN`、`=` 改成 `\u003c>`，比較錯誤寫法的結果。"},{"sim":{"db":"game","sql":"SELECT NAME, COUNT(a.ID) FROM PLAYER p LEFT JOIN ARMY a ON OWNER = p.ID\n    WHERE LEVEL > (SELECT AVG(LEVEL) FROM PLAYER)\n    GROUP BY p.ID ORDER BY LEVEL DESC"},"cap":"測試站 3.3(d)（p.157）：連接、子查詢、分組一起用。"}],"tries":[{"id":"a3c-s5-t1","pts":4,"src":"教科書 p.154 例題 3.3(c)","db":"cat","sql":"SELECT NAME FROM HOTEL h WHERE (SELECT COUNT(c.ID) FROM CAT c WHERE HID = h.ID) > CAPACITY","q":"先估：Alpha、Beta、Gamma、Delta 的容量是 3、4、2、2，分別住了 4、3、3、0 隻貓。輸出哪些酒店？","ask":{"col":"NAME"},"options":["Alpha, Gamma","Alpha","Alpha, Beta, Gamma","Gamma, Delta"],"why":"對每間酒店，子查詢點算住在該酒店的貓（關聯子查詢）：Alpha 4 > 3、Gamma 3 > 2。"}],"practice":[{"id":"a3c-s5-p1","type":"complete","pts":2,"src":"教科書 p.153 例題 3.3(b)（比較符號已更正，見單元檔頭）","db":"cat","q":"列出住在 Beta 酒店、且體重**超出**該品種全球平均重量的貓之名字。","template":"SELECT c.NAME FROM CAT c, BREED b, HOTEL h\n    WHERE BID = b.ID AND HID = h.ID AND h.NAME = 'Beta' AND ［1］","ref":["c.WEIGHT > b.WEIGHT"],"hint":"CAT 和 BREED 都有 WEIGHT，要寫 c.WEIGHT 和 b.WEIGHT。"},{"id":"a3c-s5-p2","type":"mc","pts":2,"src":"教科書 p.154 例題 3.3(e)","db":"cat","verify":true,"ask":{"col":"NAME"},"q":"以下是例題 3.3(e) 的**錯誤**寫法。它輸出什麼？（正確答案是 Gamma, Delta）","sql":"SELECT NAME FROM HOTEL WHERE ID IN\n    (SELECT HID FROM CAT, BREED b WHERE BID = b.ID AND b.NAME \u003c> 'Ragdoll')","options":["Alpha, Beta, Gamma","Gamma, Delta","Gamma","Alpha, Beta, Gamma, Delta"],"answer":0,"hint":"Alpha、Beta 都住了非布偶貓（也住了布偶貓）；Delta 沒有貓，不會在子查詢中出現。"},{"id":"a3c-s5-p3","type":"fill","pts":1,"src":"教科書 p.156 測試站 3.3(a)","db":"game","sql":"SELECT COUNT(ID) FROM PLAYER WHERE ID IN\n    (SELECT OWNER FROM ARMY a, CLASS c WHERE CID = c.ID AND STR > 90)","q":"點算擁有力量高於 90 的軍隊之玩家人數。","blanks":[{"label":"人數","ask":{"cell":[1,"COUNT(ID)"]}}],"hint":"力量高於 90 的兵種：弓箭手 95、火魔法師 110、黑魔法師 120（騎士 90 不算）。IN 令擁有多隊的玩家只計一次。"}]},{"id":"write","kind":"write","title":"寫 SQL","pages":"教科書 p.136–157","intro":"在編輯器寫一句 SELECT 語句，可以先按 ▶ 執行自己檢查，再按「提交評核」。評核時會用另外幾組數據測試，所以不可以把答案「寫死」。","tasks":[{"id":"a3c-w1","pts":10,"title":"最高分的學生","src":"教科書 p.136","db":"sub","q":"列出 STUDENT 中取得**最高分**的學生之名字 NAME 和班別 CLASS（可能多於一人）。不可把分數直接寫在語句中。","starter":"SELECT NAME, CLASS FROM STUDENT","ref":"SELECT NAME, CLASS FROM STUDENT WHERE SCORE = (SELECT MAX(SCORE) FROM STUDENT)","rules":[{"must":"MAX(","msg":"要用子查詢 SELECT MAX(SCORE) 找出最高分。"}],"hint":"`WHERE SCORE = (SELECT MAX(SCORE) FROM STUDENT)`。"},{"id":"a3c-w2","pts":12,"title":"沒有軍隊的玩家","src":"教科書 p.157 測試站 3.3(f)","db":"game","q":"**不連接數據表**，用子查詢列出沒有任何軍隊的玩家之名字。","starter":"SELECT NAME FROM PLAYER","ref":"SELECT NAME FROM PLAYER WHERE ID NOT IN (SELECT OWNER FROM ARMY)","rules":[{"mustNot":"JOIN","msg":"這題不可連接數據表，要用子查詢。"}],"hint":"ARMY 的 OWNER 是擁有軍隊的玩家 ID：`WHERE ID NOT IN (SELECT OWNER FROM ARMY)`（也可用 NOT EXISTS）。"},{"id":"a3c-w3","pts":13,"title":"高於平均等級的玩家","src":"教科書 p.157 測試站 3.3(d)","db":"game","q":"列出等級高於所有玩家平均等級的玩家之名字，以及他們各自擁有的軍隊數量（沒有軍隊顯示 0）。結果按等級遞降排序。","starter":"SELECT NAME FROM PLAYER ORDER BY LEVEL DESC","ref":"SELECT NAME, COUNT(a.ID) FROM PLAYER p LEFT JOIN ARMY a ON OWNER = p.ID\n    WHERE LEVEL > (SELECT AVG(LEVEL) FROM PLAYER)\n    GROUP BY p.ID ORDER BY LEVEL DESC","check":{"order":true},"rules":[{"must":"AVG(","msg":"要用子查詢計算平均等級。"},{"must":"GROUP BY","msg":"要按玩家分組點算軍隊。"}],"hint":"PLAYER 在左方 `LEFT JOIN ARMY a ON OWNER = p.ID`；`WHERE LEVEL > (SELECT AVG(LEVEL) FROM PLAYER)`；`COUNT(a.ID)` 不計 NULL。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.134–157","items":[{"id":"a3c-q1","pts":4,"src":"教科書 p.142–143（延伸到 ALL）","tags":[{"t":"trap","why":"子查詢結果含 NULL 時，NOT IN 和 ALL 都會失效"}],"db":"sub","verify":true,"ask":"rows","q":"STUDENT2 的分數是 83、47、NULL。以下語句的結果有多少行？","sql":"SELECT NAME FROM STUDENT WHERE SCORE > ALL (SELECT SCORE FROM STUDENT2)","options":["0","2","4","7"],"answer":"A","why":"ALL 用 AND 連接：89 > 83 AND 89 > 47 AND 89 > NULL = TRUE AND TRUE AND NULL = NULL，不是 TRUE。所以連 Clem 和 Ben 也不會列出。"},{"id":"a3c-q2","pts":4,"src":"教科書 p.145 常見錯誤","tags":[{"t":"trap","why":"把 SQL 的 ANY 誤解為「全部」"}],"q":"`SELECT NAME FROM STUDENT WHERE SCORE > ANY (SELECT SCORE FROM STUDENT2)` 列出的是什麼學生？","options":["分數比所有插班生都高的學生","分數比至少一位插班生高的學生","分數與某插班生相同的學生","分數比所有插班生都低的學生"],"answer":"B","why":"ANY 用 OR 連接：只要比其中一位（即比分數最低的一位）高便成立。"},{"id":"a3c-q3","pts":4,"src":"教科書 p.144、p.148","q":"以下哪一句會**出錯**？","options":["SELECT NAME FROM STUDENT WHERE CLASS IN ('3A', '3B')","SELECT NAME FROM STUDENT WHERE CLASS = ANY ('3A', '3B')","SELECT NAME FROM STUDENT WHERE CLASS = ANY (SELECT CLASS FROM STUDENT2)","SELECT NAME FROM STUDENT WHERE CLASS \u003c> ALL (SELECT CLASS FROM STUDENT2)"],"answer":"B","why":"ANY、ALL 後面必須是子查詢；只有 IN 可以接一列數值。"},{"id":"a3c-q4","pts":4,"src":"教科書 p.141","tags":[{"t":"hot","why":"DSE 卷二A 常考以子查詢找最高／最低值的記錄，以及 IN／NOT IN／EXISTS"}],"db":"sub","verify":true,"ask":{"col":"NAME"},"q":"以下語句輸出哪些名字？","sql":"SELECT NAME FROM CLUB c WHERE NOT EXISTS\n    (SELECT 1 FROM SC WHERE SC.CID = c.CID)","options":["English Club","Art Club, English Club","Chess Club, Art Club, Science Club","沒有結果"],"answer":"A","why":"對每個學會，子查詢找 SC 中屬於該學會的記錄；只有 English Club 找不到任何記錄。"},{"id":"a3c-q5","pts":4,"src":"教科書 p.153 例題 3.3(a) 提示","tags":[{"t":"hot","why":"DSE 卷二A 常考以子查詢找最高／最低值的記錄，以及 IN／NOT IN／EXISTS"}],"q":"以下哪一句**不能**列出住在 Alpha 酒店的貓之品種名稱（不重複）？","options":["SELECT NAME FROM BREED WHERE ID IN (SELECT BID FROM CAT, HOTEL h WHERE HID = h.ID AND h.NAME = 'Alpha')","SELECT NAME FROM BREED WHERE ID = ANY (SELECT BID FROM CAT, HOTEL h WHERE HID = h.ID AND h.NAME = 'Alpha')","SELECT DISTINCT b.NAME FROM CAT c, BREED b, HOTEL h WHERE BID = b.ID AND HID = h.ID AND h.NAME = 'Alpha'","SELECT NAME, h.NAME FROM BREED WHERE ID IN (SELECT BID FROM CAT, HOTEL h WHERE HID = h.ID AND h.NAME = 'Alpha')"],"answer":"D","why":"主查詢不能選擇子查詢內數據表的欄位（h.NAME），會出錯。"}]},{"id":"more","kind":"endless","title":"無限練習","gens":["sqlSub","sqlAgg"],"intro":"隨機生成 IN／EXISTS 子查詢及聚合函數題目，答案由 SQL 引擎計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]}, {"code":"選修A","title":"選修A 數據庫 自學平台","kicker":"HKDSE ICT · 選修 A","pin":"aict2026"});
