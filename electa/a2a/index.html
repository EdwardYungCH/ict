SQ.unit({"id":"a2a","title":"SQL 運算符","book":"教科書 選修A 第 2 章 p.58–76（另有 p.100–101 課題練習）","key":"A-a2a-hmac-30a0895fc8","theory":false,"dbs":{"intro":{"STUDENT":[["SID","NAME","CLASS","SCORE1","SCORE2"],[["03369","Hans","2C",72,77],["03405","Ivy","2A",46,54],["03410","Jean","2B",52,33],["03493","Ada","1A",0,0],["03496","Clem","1B",81,89],["03505","Eva","1B",62,38],["03506","Gabe","1C",null,null],["03510","Finn","1B",35,15],["03513","Dio","1C",53,67],["03517","Ben","1A",43,56]]]},"school":{"STUDENT":[["SID","NAME","CLASS","DOB","SCORE1","SCORE2"],[["03369","Hans","2C","2012-05-18",82,77],["03405","Ivy","2A","2012-04-16",46,45],["03410","Jean","2B","2011-11-08",74,65],["03493","Ada","1A","2013-09-21",0,0],["03496","Clem","1B","2013-10-08",81,89],["03505","Eva","1B","2013-03-19",62,83],["03506","Gabe","1C","2013-08-23",66,47],["03510","Finn","1B","2013-01-24",53,35],["03513","Dio","1C","2013-06-25",58,67],["03517","Ben","1A","2013-11-17",73,86]]]},"absent":{"STUDENT":[["SID","NAME","CLASS","DOB","SCORE1","SCORE2"],[["03369","Hans","2C","2012-05-18",82,77],["03405","Ivy","2A","2012-04-16",46,45],["03410","Jean","2B","2011-11-08",74,65],["03493","Ada","1A","2013-09-21",0,0],["03496","Clem","1B","2013-10-08",null,89],["03505","Eva","1B","2013-03-19",62,83],["03506","Gabe","1C","2013-08-23",66,47],["03510","Finn","1B","2013-01-24",53,35],["03513","Dio","1C","2013-06-25",58,67],["03517","Ben","1A","2013-11-17",73,86]]]},"temp":{"TEMP":[["SID","NAME","DEGREE","WEIGHT"],[[1197,"Jack",98.6,70.2],[1382,"Lisa",99.1,54.5],[1585,"Peter",97.9,78.1],[1901,"Emma",98.3,61.9],[10522,"Ken",98.4,-10522],[2033,"Mia",98.9,-2033],[2048,"Sam",99.5,48.2]]]},"exp":{"EXP":[["RID","FORCE","DIST","TTIME","ACCEL"],[[229,10.1,2.1,1.3,null],[463,8.2,1.8,1.2,null],[591,15.3,3.4,1.7,null],[872,12.5,2.5,1.5,null]]]},"expa":{"EXP":[["RID","FORCE","DIST","TTIME","ACCEL"],[[229,10.1,2.1,1.3,2.485],[463,8.2,1.8,1.2,2.5],[591,15.3,3.4,1.7,2.353],[872,12.5,2.5,1.5,2.222],[905,9.6,2,1.4,null],[918,11.2,2.4,1.6,null]]]},"emp":{"EMPLOYEE":[["EID","ENAME","TEAM","ROOM","DOB","TENURE","LEAVE"],[["A1234X","Ng Ka Ming","A",203,"1965-03-02",25,12],["A9876X","Ngai Siu Wah","C",205,"1970-07-15",20,8],["B2345Y","Chan Tai Man","D",204,"1980-01-20",10,15],["A5555X","Wong Mei Ling","D",310,"1990-12-01",5,11],["C1111Z","Lee Ka Yan","E",202,"1966-01-01",19,14],["A12X","Ho Chi Kit","B",208,"1985-05-05",12,10],["D7777W","Ng Wing Sze",null,101,"1975-09-09",18,20],["A3333Y","Cheung Hoi","A",209,"1966-02-14",22,9],["E4444X","Lam Siu Fung","C",206,"1995-04-30",3,18],["AB123X","Yip Tsz Ching",null,150,"1999-08-08",1,7]]]},"bk":{"BK":[["BID","BN"],[[1,"The Hobbit"],[2,"Little Women"],[3,"Aggregate"],[4,"Tourists"],[5,"Memento"],[6,"the Secret Garden"],[7,"Matilda"],[8,"Atonement"],[9,"Other Stories"],[10,"Brave New World"]]]},"movie":{"MOVIE":[["MOVID","MNAME","DNAME","RELEASE"],[[1,"The Manhunter","Ada Kwong","2023-04-04"],[2,"Postman","Bill Smith","2025-09-15"],[3,"Don The Mantle","Cheve Lee","2024-08-27"],[4,"The Manic","Bill Smith","2025-06-02"],[5,"The Man on Fire","Cheve Lee","2025-03-16"],[6,"Manhattan","Cheve Lee","2023-12-24"],[7,"The Man","Ada Kwong","2022-09-09"],[8,"Mandy The Mantis","Cheve Lee","2024-01-08"],[9,"Spring Rain","Dan Wu","2024-04-01"],[10,"Mango Island","Eva Chan","2025-01-20"]]]}},"sections":[{"id":"s1","title":"算術運算符與別名","pages":"教科書 p.60–65","learn":[{"pts":["**SQL 運算符**分三種：**算術運算符**（`+ - * /`）、**比較運算符**（`= \u003c> \u003c > \u003c= >=`）、**邏輯運算符**（`NOT AND OR`，還有 `IN`、`BETWEEN`、`LIKE`、`IS NULL`）。條件中還可以用**萬用字符** `%` 和 `_`。（p.60）","運算次序跟數學一樣：**先乘除、後加減**；要先計某部分，只可以用圓括號 `()`，不可用 `[]` 或 `{}`。（p.61）","算式可以放在 `SELECT` 之後，計算每一項記錄的值，例如總分 = SCORE1 × 40% + SCORE2 × 60%。（p.61）","用 `AS` 為算式加上**別名**，結果的欄名便由長長的算式變成別名；別名也可以用在 `ORDER BY`。（p.62）","算式也可以用在 `UPDATE … SET` 和 `WHERE`；減號亦可以當作負號，例如 `-SID`。（p.64 例題 2.1）"]},{"sim":{"db":"school","sql":"SELECT NAME, SCORE1*0.4+SCORE2*0.6 AS FINAL FROM STUDENT ORDER BY FINAL DESC"},"cap":"計算每位學生的總分（p.62），再按總分由高至低排列。試把 `AS FINAL` 刪去，看看欄名變成什麼。"},{"warn":"`+` 不能把文字串連起來：`SID + ' ' + NAME` 會把文字當作數字相加。串連文字要用 `CONCAT(SID, ' ', NAME)`。兩個日期相減也不會得到日數，要用日期函數。（p.62 擴闊視野）"}],"tries":[{"id":"a2a-s1-t1","pts":4,"src":"教科書 p.62","db":"school","sql":"SELECT NAME, SCORE1*0.4+SCORE2*0.6 AS FINAL FROM STUDENT WHERE NAME = 'Eva'","ask":{"cell":[1,"FINAL"]},"q":"先估：Eva（SCORE1 = 62，SCORE2 = 83）的 FINAL 是多少？","options":["74.6","72.5","145","89.8"],"why":"先乘後加：62 × 0.4 + 83 × 0.6 = 24.8 + 49.8 = 74.6。"}],"practice":[{"id":"a2a-s1-p1","type":"mc","pts":2,"src":"教科書 p.63 例題 2.1(b)","q":"TEMP 的 DEGREE 是華氏體溫。已知 °C = (°F − 32) × 5 ÷ 9。哪一句 SQL 能以**攝氏**列出學生名字和體溫？","options":["SELECT NAME, DEGREE - 32 * 5 / 9 FROM TEMP","SELECT NAME, (DEGREE - 32) * 5 / 9 FROM TEMP","SELECT NAME, [DEGREE - 32] * 5 / 9 FROM TEMP","UPDATE TEMP SET DEGREE = (DEGREE - 32) * 5 / 9"],"answer":1,"hint":"先減 32，所以要加圓括號；題目只要「列出」，不可以改動數據表。","why":"沒有括號便先計 32 × 5 ÷ 9；方括號不是 SQL 的括號；UPDATE 會改掉原有數據。"},{"id":"a2a-s1-p2","type":"complete","pts":2,"src":"教科書 p.63 例題 2.1(a)","db":"temp","q":"把 TEMP 的體重由公斤改為磅（1 公斤 = 2.2 磅），更新現有數據。（之後會列出整個數據表核對。）","template":"UPDATE TEMP SET WEIGHT = ［1］; SELECT * FROM TEMP","ref":["WEIGHT * 2.2"],"hint":"新的值 = 原有的值 × 2.2；SET 右邊可以用欄名做運算。"},{"id":"a2a-s1-p3","type":"fill","pts":2,"src":"教科書 p.64 例題 2.1(c)","db":"temp","q":"系統錯誤令部分記錄把 SID 的負數當作體重（例如 SID 是 10522，體重便是 −10522）。執行以下語句後，TEMP 餘下多少項記錄？","sql":"DELETE FROM TEMP WHERE -SID = WEIGHT; SELECT * FROM TEMP","blanks":[{"label":"餘下記錄數目","ask":"rows"}],"hint":"找出 WEIGHT 剛好等於 −SID 的記錄：Ken 和 Mia。"},{"id":"a2a-s1-p4","type":"complete","pts":1,"src":"教科書 p.64–65 測試站 2.1(a)","db":"exp","q":"測試物件於受力前靜止，s = ½at²，所以 a = 2s ÷ t²。完成語句，更新每項結果的加速度 ACCEL。","template":"UPDATE EXP SET ACCEL = ［1］; SELECT RID, ACCEL FROM EXP","ref":["DIST * 2 / TTIME / TTIME"],"hint":"`DIST * 2 / TTIME / TTIME`，或 `2 * DIST / (TTIME * TTIME)`。小心：`2 * DIST / TTIME * TTIME` 是錯的。"}]},{"id":"s2","title":"比較運算符與邏輯運算符","pages":"教科書 p.60、p.65–69","learn":[{"table":{"head":["運算符","意義"],"rows":[["=","等於"],["\u003c>","不等於"],["\u003c","小於"],[">","大於"],["\u003c=","小於或等於"],[">=","大於或等於"]]},"cap":"表 2.3 比較運算符（p.65）"},{"pts":["字串按**字母順序**比較：先比第一個字符，相同才比第二個……例如 `'bad' \u003c 'bed'` 是 TRUE。（p.66）","MySQL 比較字串**不分大小寫**：`'bad' = 'BAD'` 是 TRUE。日期字串 `'2025-03-01' > '2025-02-28'` 也是 TRUE。（p.66）","要比較同一類數據：`'1' > '01'` 是 TRUE（比第一個字符 1 和 0），`'03493' > '0350'` 是 FALSE（比第三個字符 4 和 5）。數字與文字混合比較，結果難以預料。（p.66）","MySQL 以 `1` 代表 TRUE，`0` 代表 FALSE。（p.66）","`NOT`：條件相反；`AND`：全部成立才 TRUE；`OR`：最少一項成立便 TRUE。（p.66 表 2.5）","先後次序：**NOT → AND → OR**。`NOT CLASS = '1B' AND SCORE1 \u003c 60 OR SCORE2 \u003c 60` 等於 `((NOT CLASS = '1B') AND SCORE1 \u003c 60) OR SCORE2 \u003c 60`。（p.69）","NULL 參與運算或比較，結果是 NULL（不是 TRUE），所以該記錄不會被選出：p.60 的 Gabe 兩次測驗都是 NULL，`SCORE1 + SCORE2 >= 100` 不成立。（p.60）"]},{"sim":{"db":"school","sql":"SELECT NAME, SCORE1, SCORE2 FROM STUDENT WHERE SCORE1 \u003c 60 AND SCORE2 \u003c 60"},"cap":"兩次測驗都不合格（p.68）。把 AND 改成 OR，便是「至少一次不合格」（p.69）；在條件前加 NOT 試試。"}],"tries":[{"id":"a2a-s2-t1","pts":4,"src":"教科書 p.60","db":"intro","sql":"SELECT * FROM STUDENT WHERE CLASS LIKE '1_' AND SCORE1 + SCORE2 >= 100","ask":"rows","q":"先估：p.60 的語句會選出多少項記錄？（Gabe 兩次測驗都是 NULL）","options":["2","3","4","5"],"why":"中一班（1_）而總分至少 100：Clem 170、Eva 100、Dio 120。Ada 只有 0、Finn 50、Ben 99；Gabe 的總分是 NULL，不成立。"},{"id":"a2a-s2-t2","pts":4,"src":"教科書 p.69","tags":[{"t":"trap","why":"AND 比 OR 先運算：`A OR B AND C` 等於 `A OR (B AND C)`，常漏括號。"}],"db":"school","sql":"SELECT SID, CLASS, SCORE1, SCORE2 FROM STUDENT WHERE NOT (CLASS = '1B' AND (SCORE1 \u003c 60 OR SCORE2 \u003c 60))","ask":"rows","q":"先估：條件 Q `NOT (CLASS = '1B' AND (SCORE1 \u003c 60 OR SCORE2 \u003c 60))` 會選出多少項記錄？","options":["1","5","8","9"],"why":"括號內只有 Finn（1B，53、35）成立；NOT 之後只有 Finn 不被選出，其餘 9 項都選出。條件 P（沒有括號）只選出 5 項，可見括號位置很重要。"}],"practice":[{"id":"a2a-s2-p1","type":"mc","pts":1,"src":"教科書 p.66 表 2.4","q":"以下哪一句比較的結果是 **FALSE**？","options":["'bad' \u003c 'bed'","'bad' = 'BAD'","'1' > '01'","'03493' > '0350'"],"answer":3,"hint":"字串由左至右逐個字符比較。","why":"比到第三個字符：'4' \u003c '5'，所以 '03493' 比 '0350' 小。"},{"id":"a2a-s2-p2","type":"fill","pts":2,"src":"教科書 p.68–69","db":"school","sql":"SELECT NAME FROM STUDENT WHERE SCORE1 \u003c 60 OR SCORE2 \u003c 60","q":"列出**至少一次**測驗不合格（少於 60 分）的學生。按 STUDENT 的次序寫出名字（用「, 」分隔）。","blanks":[{"label":"NAME","ask":{"col":"NAME"}}],"hint":"逐行看：SCORE1 \u003c 60 或 SCORE2 \u003c 60，任何一個成立便選出。Gabe 的 SCORE2 是 47。"},{"id":"a2a-s2-p3","type":"complete","pts":2,"src":"教科書 p.74 例題 2.2(a)","db":"emp","q":"列出出生日期在 1966-01-01 **之前**，或已於公司工作**至少 20 年**的員工名字。","template":"SELECT ENAME FROM EMPLOYEE WHERE DOB ［1］ '1966-01-01' OR TENURE ［2］ 20","ref":["\u003c",">="],"hint":"「之前」不包括當天；「至少 20 年」包括剛好 20 年。"},{"id":"a2a-s2-p4","type":"mc","pts":1,"src":"教科書 p.75 例題 2.2(c) 分析","db":"emp","tags":[{"t":"trap","why":"AND 比 OR 先運算：`A OR B AND C` 等於 `A OR (B AND C)`，常漏括號。"}],"sql":"SELECT EID FROM EMPLOYEE WHERE TEAM = 'A' OR TEAM = 'C' OR TEAM = 'E' AND LEAVE > 10","ask":"rows","verify":true,"q":"想找團隊 A、C 或 E 而假期多於 10 日的員工，卻漏了括號。這句會選出多少項記錄？（正確答案只有 3 項）","options":["3","4","5","7"],"answer":2,"hint":"AND 先運算：`TEAM = 'A' OR TEAM = 'C' OR (TEAM = 'E' AND LEAVE > 10)`。","why":"團隊 A 和 C 的員工不論假期多少都被選出（共 4 人），再加 Lee Ka Yan（E，14 日）。"}]},{"id":"s3","title":"IN、BETWEEN…AND、LIKE","pages":"教科書 p.70–72、p.76","learn":[{"pts":["`IN`：選取多個值。`CLASS IN ('1A', '1B', '2C')` 等於 `CLASS = '1A' OR CLASS = '1B' OR CLASS = '2C'`，較簡短清晰。（p.70）","`BETWEEN … AND`：在範圍內選取，**包括首尾兩個值**。`DOB BETWEEN '2013-08-23' AND '2013-09-22'` 等於 `DOB >= '2013-08-23' AND DOB \u003c= '2013-09-22'`。（p.70–71）","`NOT` 可以放在 IN、BETWEEN、LIKE 前面：`CLASS NOT IN (…)`、`SCORE1 NOT BETWEEN 60 AND 80`、`ENAME NOT LIKE 'Ng %'`。（p.75–76）","`LIKE` 選取符合模式的字串：`%` 代表**任意數量**（包括零個）字符；`_` 代表**剛好一個**字符。LIKE 也不分大小寫。（p.71 表 2.6）","`'%an%'`：含有 an；`'%an'`：以 an 結尾；`'__n'`：三個字符而以 n 結尾；`'__n_'`：四個字符而第三個是 n；`'__a%'`：第三個字符是 a。（p.71–72）"]},{"sim":{"db":"school","sql":"SELECT SID, NAME FROM STUDENT WHERE NAME LIKE '__n_'"},"cap":"名字共四個字符、第三個是 n（p.72）。試改成 `'%an'`、`'__n'`、`'__a%'`。"},{"warn":"`'Ng%'` 不等於 `'Ng %'`：沒有空格的話，姓 Ngai 的員工也會被選出。（p.75 例題 2.2(e)）"}],"tries":[{"id":"a2a-s3-t1","pts":4,"src":"教科書 p.71–72 試想想","db":"school","sql":"SELECT SID, NAME FROM STUDENT WHERE NAME LIKE '__n'","ask":{"col":"NAME"},"q":"先估：`NAME LIKE '__n'` 會選出誰？","options":["Ben","Ben, Jean","Hans, Jean, Ben, Finn","Hans, Finn"],"why":"`__n` 是三個字符、以 n 結尾：只有 Ben。Jean 的 n 前面有三個字符，不符合。"}],"practice":[{"id":"a2a-s3-p1","type":"complete","pts":2,"src":"教科書 p.76 測試站 2.2 第 2 題","db":"bk","q":"BK 的書名儲存在欄位 BN。列出名稱包含**至少兩個「t」**的書名。","template":"SELECT BN FROM BK WHERE BN LIKE ［1］","ref":["'%t%t%'"],"hint":"每個 t 前後都可以有任意數量的字符。LIKE 不分大小寫，所以 T 也計算在內。"},{"id":"a2a-s3-p2","type":"complete","pts":2,"src":"教科書 p.76 測試站 2.2 第 2(d) 題","db":"bk","q":"列出**倒數第二個字符**是「t」的書名，例如 Aggregate、Tourists、Memento。","template":"SELECT BN FROM BK WHERE BN LIKE ［1］","ref":["'%t_'"],"hint":"t 之後剛好還有一個字符。"},{"id":"a2a-s3-p3","type":"mc","pts":1,"src":"教科書 p.76 測試站 2.2 第 1(b) 題","q":"`WHERE NOT SCORE1 BETWEEN 60 AND 80` 等於以下哪一個條件？","options":["SCORE1 \u003c 60 OR SCORE1 > 80","SCORE1 \u003c= 60 OR SCORE1 >= 80","SCORE1 \u003c 60 AND SCORE1 > 80","SCORE1 > 60 AND SCORE1 \u003c 80"],"answer":0,"hint":"BETWEEN 包括 60 和 80，所以 NOT BETWEEN 不包括它們。","why":"一個分數不可能同時小於 60 又大於 80，所以要用 OR。"},{"id":"a2a-s3-p4","type":"fill","pts":1,"src":"教科書 p.75 例題 2.2(d)","db":"emp","sql":"SELECT DISTINCT TEAM FROM EMPLOYEE WHERE EID LIKE 'A____X'","q":"員工編號長度為六、以 A 開首而以 X 結尾。這句會傳回多少行？（DISTINCT 會去除重複；NULL 也算一行）","blanks":[{"label":"行數","ask":"rows"}],"hint":"A 與 X 之間有四條下劃線。A12X 只有四個字符；A3333Y 不是以 X 結尾。"}]},{"id":"s4","title":"IS NULL 與綜合條件","pages":"教科書 p.73–76","learn":[{"pts":["假設缺席測驗的學生分數是 `NULL`。要找出 NULL 值，必須用 `IS NULL`；找出不是 NULL 的值用 `IS NOT NULL`。（p.73）","**不要寫 `= NULL`**：任何值與 NULL 比較，結果都是 NULL（不是 TRUE），所以一行也選不到。（p.75 例題 2.2(f)）","`0` 不等於 `NULL`：0 是整數，NULL 沒有數據類型。（p.73）","寫條件的步驟：① 每個要求寫成一個小條件；② 用 AND／OR 連接；③ 有 OR 又有 AND 時加括號；④ 能用 IN、BETWEEN、LIKE 便用，語句較短。（p.74–75 例題 2.2）"]},{"sim":{"db":"absent","sql":"SELECT SID, NAME FROM STUDENT WHERE SCORE1 IS NULL"},"cap":"找出缺席第一次測驗的學生（p.73）。試把 `IS NULL` 改成 `= NULL`，再改成 `IS NOT NULL`。"}],"tries":[{"id":"a2a-s4-t1","pts":4,"src":"教科書 p.75 例題 2.2(f) 分析","tags":[{"t":"trap","why":"`= NULL` 永遠不會成立（結果是 NULL，不是 TRUE），要寫 `IS NULL`。"}],"db":"absent","sql":"SELECT SID, NAME FROM STUDENT WHERE SCORE1 = NULL","ask":"rows","q":"先估：Clem 的 SCORE1 是 NULL。`WHERE SCORE1 = NULL` 會選出多少項記錄？","options":["0","1","9","10"],"why":"`SCORE1 = NULL` 的結果永遠是 NULL，不是 TRUE，所以一項也選不到。要寫 `SCORE1 IS NULL`。"}],"practice":[{"id":"a2a-s4-p1","type":"complete","pts":2,"src":"教科書 p.75 例題 2.2(f)","db":"emp","q":"TEAM 是 NULL 代表員工未編入任何團隊。列出這些員工的姓名。","template":"SELECT ENAME FROM EMPLOYEE WHERE ［1］","ref":["TEAM IS NULL"],"hint":"不要用 `= NULL`。"},{"id":"a2a-s4-p2","type":"complete","pts":2,"src":"教科書 p.75 例題 2.2(e)","db":"emp","q":"ENAME 以姓氏開首。列出姓氏**不是**「Ng」的員工姓名（姓 Ngai 的要保留）。","template":"SELECT ENAME FROM EMPLOYEE WHERE ［1］","ref":["ENAME NOT LIKE 'Ng %'"],"hint":"`NOT LIKE` 加上模式 `'Ng %'`（Ng 之後有空格）。"},{"id":"a2a-s4-p3","type":"mc","pts":2,"src":"教科書 p.74 例題 2.2(b)","db":"emp","verify":true,"ask":{"col":"EID"},"sql":"SELECT EID FROM EMPLOYEE WHERE TEAM \u003c> 'D' AND ROOM BETWEEN 202 AND 208","q":"列出不屬於團隊 D，而房間號碼在 202 與 208 之間的員工編號。結果是什麼？","options":["A1234X, A9876X, C1111Z, A12X, E4444X","A1234X, A9876X, C1111Z, E4444X","A1234X, A9876X, B2345Y, C1111Z, A12X, E4444X","A1234X, A9876X, C1111Z, A12X, A3333Y, E4444X"],"answer":0,"hint":"BETWEEN 包括 202 和 208；B2345Y 屬團隊 D；A3333Y 在房間 209。","why":"A12X 在房間 208（包括在內）；團隊是 NULL 的員工房間不在範圍內，這裏沒有影響。"}]},{"id":"write","kind":"write","title":"寫 SQL","pages":"教科書 p.64–65、p.74–76、p.100","intro":"在編輯器寫一句 SELECT 語句，先按「▶ 執行」看結果，再按「提交評核」。評核會用另外的數據再測試，所以不可以只寫出現在的答案。","tasks":[{"id":"a2a-w1","tier":"必做","pts":10,"title":"不是這三位導演的電影","src":"教科書 p.100 課題練習第 3(a) 題","db":"movie","q":"列出所有**不是**由以下導演執導的電影名稱（MNAME）：Ada Kwong、Bill Smith、Cheve Lee。","starter":"SELECT MNAME FROM MOVIE","ref":"SELECT MNAME FROM MOVIE WHERE DNAME NOT IN ('Ada Kwong', 'Bill Smith', 'Cheve Lee')","hint":"用 `NOT IN (…)`，或用三個 `\u003c>` 以 AND 連接。"},{"id":"a2a-w2","tier":"進階","pts":13,"title":"團隊 A、C、E 而假期多","src":"教科書 p.74 例題 2.2(c)","db":"emp","q":"列出屬於團隊 A、C 或 E，**而且**可申請假期多於 10 日的員工之編號（EID）和出生日期（DOB）。","starter":"SELECT EID, DOB FROM EMPLOYEE WHERE TEAM = 'A' OR TEAM = 'C' OR TEAM = 'E' AND LEAVE > 10","ref":"SELECT EID, DOB FROM EMPLOYEE WHERE TEAM IN ('A', 'C', 'E') AND LEAVE > 10","hint":"起始語句漏了括號（AND 比 OR 先運算）。改用 `TEAM IN ('A', 'C', 'E')`，或把三個 OR 用括號括起來。"},{"id":"a2a-w3","tier":"挑戰","pts":12,"title":"測試物件的質量","src":"教科書 p.65 測試站 2.1(c)","db":"expa","q":"F = ma，所以質量 m = F ÷ a（FORCE ÷ ACCEL）。部分結果的加速度還未計算（ACCEL 是 NULL）。\n列出**已計算加速度**的每項結果的結果編號（RID）及質量，質量的別名是 `MASS`，並按質量**由小至大**排列。","starter":"SELECT RID, FORCE / ACCEL FROM EXP","ref":"SELECT RID, FORCE / ACCEL AS MASS FROM EXP WHERE ACCEL IS NOT NULL ORDER BY MASS","check":{"order":true},"hint":"`FORCE / ACCEL AS MASS`；用 `ACCEL IS NOT NULL` 排除未計算的結果；`ORDER BY MASS`（別名可用在 ORDER BY）。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.66–76、p.100–101","items":[{"id":"a2a-q1","pts":4,"src":"教科書 p.101 課題練習第 3(b) 題（另加兩項記錄）","tags":[{"t":"trap","why":"`_` 也可以代表空格；`_` 必須有一個字符，所以 The Man 本身不符合。"}],"db":"movie","sql":"SELECT DNAME FROM MOVIE WHERE MNAME LIKE 'The Man_%'","ask":{"col":"DNAME"},"verify":true,"q":"MOVIE 有 p.101 的八項記錄（The Manhunter、Postman、Don The Mantle、The Manic、The Man on Fire、Manhattan、The Man、Mandy The Mantis），另加 Spring Rain 和 Mango Island。`SELECT DNAME FROM MOVIE WHERE MNAME LIKE 'The Man_%'` 的輸出是什麼？","options":["Ada Kwong, Bill Smith","Ada Kwong, Bill Smith, Cheve Lee","Ada Kwong, Bill Smith, Cheve Lee, Ada Kwong","Ada Kwong, Cheve Lee, Bill Smith, Cheve Lee, Cheve Lee"],"answer":"B","why":"要以 The Man 開首，之後最少多一個字符：The Manhunter、The Manic、The Man on Fire（_ 配對空格）。The Man 沒有多一個字符；Don The Mantle 不是以 The 開首。"},{"id":"a2a-q2","pts":4,"src":"自擬（DSE 卷二A 題型）","tags":[{"t":"trap","why":"AND 比 OR 先運算：`A OR B AND C` 等於 `A OR (B AND C)`，常漏括號。"},{"t":"hot","why":"卷二A 幾乎每年都要求寫 WHERE 條件（AND／OR／IN／BETWEEN／LIKE／IS NULL），例如 DSE 2018 2A Q3、2019 2A Q3、2021 2A Q2"}],"db":"school","sql":"SELECT NAME FROM STUDENT WHERE CLASS = '1A' OR CLASS = '1B' AND SCORE2 > 80","ask":"rows","verify":true,"q":"`SELECT NAME FROM STUDENT WHERE CLASS = '1A' OR CLASS = '1B' AND SCORE2 > 80` 會傳回多少行？（p.61 的 STUDENT：1A 有 Ada 0 分、Ben 86 分；1B 有 Clem 89、Eva 83、Finn 35）","options":["2","3","4","5"],"answer":"C","why":"AND 先運算：1A 全部（Ada、Ben），加上 1B 而 SCORE2 > 80（Clem、Eva），共 4 行。"},{"id":"a2a-q3","pts":4,"src":"自擬（參考 p.70–71）","tags":[{"t":"hot","why":"卷二A 幾乎每年都要求寫 WHERE 條件（AND／OR／IN／BETWEEN／LIKE／IS NULL），例如 DSE 2018 2A Q3、2019 2A Q3、2021 2A Q2"}],"db":"school","sql":"SELECT NAME FROM STUDENT WHERE DOB BETWEEN '2013-03-19' AND '2013-08-23'","ask":{"col":"NAME"},"verify":true,"q":"`SELECT NAME FROM STUDENT WHERE DOB BETWEEN '2013-03-19' AND '2013-08-23'` 的輸出是什麼？（Eva 2013-03-19、Gabe 2013-08-23、Dio 2013-06-25、Finn 2013-01-24）","options":["Dio","Eva, Dio","Gabe, Dio","Eva, Gabe, Dio"],"answer":"D","why":"BETWEEN 包括首尾兩個日期，所以 Eva 和 Gabe 都在內。"},{"id":"a2a-q4","pts":4,"src":"教科書 p.73、p.75 例題 2.2(f)","tags":[{"t":"trap","why":"`= NULL` 永遠不會成立（結果是 NULL，不是 TRUE），要寫 `IS NULL`。"}],"db":"absent","sql":"SELECT NAME FROM STUDENT WHERE NOT SCORE1 >= 60","ask":"rows","verify":true,"q":"Clem 缺席第一次測驗（SCORE1 是 NULL），其餘 9 人之中有 4 人 SCORE1 少於 60。`WHERE NOT SCORE1 >= 60` 會傳回多少行？","options":["4","5","6","10"],"answer":"A","why":"Clem：`NULL >= 60` 是 NULL，`NOT NULL` 仍是 NULL，不是 TRUE，所以 Clem 不會被選出。要包括缺席者須另加 `OR SCORE1 IS NULL`。"},{"id":"a2a-q5","pts":4,"src":"教科書 p.76 測試站 2.2 第 1(c)、(d) 題","q":"以下哪一對條件**不**相等？","options":["`CLASS \u003c> '1B' AND CLASS \u003c> '2C'` 與 `NOT CLASS IN ('1B', '2C')`","`SCORE2 >= SCORE1 AND SCORE2 \u003c= SCORE3` 與 `SCORE2 BETWEEN SCORE1 AND SCORE3`","`NOT DOB \u003c '2013-05-05'` 與 `DOB >= '2013-05-05'`","`NAME LIKE '%an'` 與 `NAME LIKE '%an%'`"],"answer":"D","why":"`%an` 要以 an 結尾；`%an%` 只要含有 an 便可，例如 Hans 符合後者但不符合前者。"}]},{"id":"more","kind":"endless","title":"無限練習","gens":["sqlWhere"],"intro":"隨機生成 WHERE 條件（AND／OR／NOT／BETWEEN／IN／LIKE／NULL）的題目，答案由 SQL 引擎計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]}, {"code":"選修A","title":"選修A 數據庫 自學平台","kicker":"HKDSE ICT · 選修 A","pin":"aict2026"});
