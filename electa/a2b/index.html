"],["U501","Red DawnUPPERCASE","2020-07-07"]]]},"member":{"MEMBER":[["NAME","TYPEID","MEMID","SEX","CREDIT","DOB","REGDATE"],[["Chan Siu Ming",2,"M001","M",1200,"2001-08-20","2017-05-03"],["Lee Mei",2,"M002","F",800,"1999-02-28","2019-01-15"],["Wong Ka Lok",0,"M003","M",150,"2005-12-08","2018-03-21"],["Ho Wing",1,"M004","F",560,"1988-07-18","2020-03-02"],["Cheung Yan",0,"M005","F",300,"2010-08-01","2021-03-30"],["Lam Chi",3,"M006","M",5000,"1995-11-11","2016-06-06"],["Ng Hoi",0,"M007","M",90,"2003-04-05","2019-11-11"],["Tse Ling",2,"M008","F",2400,"1990-01-09","2018-12-25"],["Yip Sum",1,"M009","M",700,"2007-03-28","2022-03-14"],["Kwok Ying",0,"M010","F",210,"2012-06-17","2022-11-02"]]],"MTYPE":[["ID","NAME"],[[0,"銅級"],[1,"銀級"],[2,"金級"],[3,"鑽石級"]]]},"product":{"PRODUCT":[["CAT","SN","PNAME","PRICE","WAREHOUSE","STOCK"],[["FD03",30,"Potato chips",13.9,"A",216],["FD03",261,"Candy bar",18.5,"B",231],["FD10",185,"Bag of rice",62.9,"A",193],["DI05",261,"Toothbrush",17.9,"B",389],["FD03",31,"Potato chips",12.5,"B",40],["FD03",32,"Potato chips",14.2,"C",120],["FD03",262,"Candy bar",9.5,"C",80],["DI05",262,"Toothbrush",16,"A",60],["DI07",300,"Soap",8.9,"A",500],["FD10",186,"Bag of rice",59,"C",30]]]},"phone":{"PHONE":[["PID","PNAME","RELEASE","CAPTION","PRICE","DISC"],[["A520","Alpha 5","2022-05-01","Slim design.",3999,0],["S100","Sigma","2021-09-15",null,2599,1],["M210","Mega Max","2022-11-30","Long battery life, a big 6.8-inch screen, triple cameras with night mode, fast charging and a strong metal frame.",5299,0],["A600","Alpha 6","2023-03-10","A light phone with a bright screen, a good camera for daily photos and a battery that lasts all day.",4599,0],["X001","Xeno","2021-02-02","Rugged phone.",1999,1],["S220","Sigma 2","2023-08-18",null,3299,0],["K300","Kilo","2022-01-20","Budget choice.",1599,0]]]},"quiz":{"CONTESTANT":[["CID","CNAME","DOB","AGID","LITE","HIST","SUBTIME"],[[1,"Amy","2011-04-02",1,74,90,"2025-03-12 20:15:00"],[2,"Bob","2012-07-19",1,86,95,"2025-03-13 23:59:59"],[3,"Cat","2008-01-30",2,92,88,"2025-03-10 09:00:00"],[4,"Don","2009-05-05",2,98,60,"2025-03-14 08:30:00"],[5,"Eve","2014-12-12",1,60,86,"2025-03-14 10:00:00"],[6,"Fay","2007-09-09",2,66,72,"2025-03-11 13:45:00"],[7,"Gus","2016-02-02",null,70,91,"2025-03-12 18:00:00"],[8,"Hon","2015-03-03",null,75,99,"2025-03-13 12:00:00"],[9,"Ian","2006-06-06",3,81,70,"2025-03-13 22:10:00"]]]},"egg":{"CONTESTANT":[["ID","NAME","SEX","TEAM","EGG"],[[1,"Ada","F","X",2],[2,"Ben","M","Y",3],[3,"Clem","F","X",2],[4,"Dio","M","Y",0],[5,"Eva","F","X",4],[6,"Finn","M","Z",5],[7,"Gabe","M","Y",2],[8,"Hans","M","Z",0],[9,"Ivy","F","Z",1]]]}},"sections":[{"id":"s1","title":"數學函數與文字函數","pages":"教科書 p.77、p.79–80","learn":[{"pts":["**函數**放在算式中，幫助分析數據，例如 `ABS(SCORE1 - SCORE2)` 是兩次分數之差的絕對值，`MONTH(DOB)` 是出生月份。（p.77）","函數可以用在 SELECT、WHERE、ORDER BY、GROUP BY，也可以用在 UPDATE … SET。（p.79 例題 2.3）","只有 `UPDATE` 才會改動數據：`SELECT TRIM(USERNAME) …` 只是顯示結果，數據表不會改變。（p.79 例題 2.3(a)）"]},{"table":{"head":["函數","用途","例子","結果"],"rows":[["`LENGTH(s)`","字符數目（包括空格和符號）","`LENGTH('A Cat!')`","6"],["`MID(s, 開始, 數目)`","由第「開始」個字符起取「數目」個字符","`MID('Luggage', 4, 3)`","'gag'"],["`UPPER(s)`／`LOWER(s)`","轉為大寫／小寫","`UPPER('A Cat!')`","'A CAT!'"],["`TRIM(s)`","刪除開首和結尾的空格（中間的空格保留）","`TRIM('  A Cat!  ')`","'A Cat!'"],["`SPACE(n)`","傳回 n 個空格","`SPACE(3)`","'   '"],["`ABS(n)`","絕對值","`ABS(-25)`","25"]]},"cap":"表 2.7 常用文字函數（p.77）。`MID` 又可寫作 `SUBSTR`、`SUBSTRING`；字符位置由 **1** 開始。"},{"pts":["取最後 k 個字符（編號長度不一）：`MID(UID, LENGTH(UID) - k + 1, k)`，例如最後四個字符是 `MID(UID, LENGTH(UID) - 3, 4)`。（p.79 例題 2.3(f)）","多餘空格的數目 = `LENGTH(FNAME) - LENGTH(TRIM(FNAME))`。（p.80 測試站 2.3(d)）"]},{"sim":{"db":"user","sql":"SELECT UID, MID(UID, LENGTH(UID) - 3, 4) AS LAST4, LENGTH(USERNAME), LENGTH(TRIM(USERNAME)) FROM USER"},"cap":"例題 2.3（p.78–79）。看看 Ken 和 Tom 的名字有多少個多餘空格。"}],"tries":[{"id":"a2b-s1-t1","pts":4,"src":"教科書 p.80 測試站 2.3(c)","db":"film","sql":"SELECT FCODE, MID(FCODE, LENGTH(FCODE)-2, 2) AS PART FROM FILM WHERE FCODE IN ('T90015', 'A77')","ask":{"col":"PART"},"q":"先估：取出編號 A77 和 T90015 的「倒數第二和第三個字符」，結果依次是什麼？","options":["A7, 01","77, 00","77, 15","A7, 90"],"why":"A77 長度 3，由第 3 − 2 = 1 個字符起取 2 個：A7。T90015 長度 6，由第 4 個字符起取 2 個：01。"}],"practice":[{"id":"a2b-s1-p1","type":"mc","pts":1,"src":"教科書 p.79 例題 2.3(a)","q":"部分用戶名稱的開首和結尾有多餘空格。哪一句能**刪除**這些空格？","options":["SELECT TRIM(USERNAME) FROM USER","UPDATE USER SET USERNAME = TRIM(USERNAME)","UPDATE USER SET TRIM(USERNAME)","DELETE FROM USER WHERE USERNAME LIKE ' %'"],"answer":1,"hint":"要改動數據，便要用 UPDATE … SET 欄名 = 新的值。","why":"SELECT 只顯示結果；DELETE 會刪除整項記錄。"},{"id":"a2b-s1-p2","type":"complete","pts":2,"src":"教科書 p.79 例題 2.3(d)","db":"user","q":"班別名稱的首個字符是年級。上一學年考試不合格的學生要重讀（年級不變）。列出這些學生的用戶名稱。","template":"SELECT USERNAME FROM USER WHERE ［1］ = ［2］","ref":["MID(CLASS, 1, 1)","MID(OLDCLASS, 1, 1)"],"hint":"比較 CLASS 和 OLDCLASS 的首個字符：`MID(…, 1, 1)`（也可用 `LEFT(…, 1)`）。"},{"id":"a2b-s1-p3","type":"complete","pts":2,"src":"教科書 p.79 例題 2.3(e)","db":"user","q":"電話號碼應有 8 位。由於轉錄錯誤，部分號碼少了數字。列出這些用戶的編號和電話號碼。","template":"SELECT UID, PHONE FROM USER WHERE ［1］","ref":["LENGTH(PHONE) \u003c 8"],"hint":"檢查電話號碼的長度。"},{"id":"a2b-s1-p4","type":"fill","pts":2,"src":"教科書 p.80 測試站 2.3(d)","db":"film","sql":"SELECT LENGTH(FNAME) - LENGTH(TRIM(FNAME)) FROM FILM WHERE FCODE = '2468'","q":"編號 2468 的電影名稱開首和結尾有多餘空格。執行以下語句，多餘空格有多少個？","blanks":[{"label":"多餘空格數目","ask":{"cell":[1,"LENGTH(FNAME) - LENGTH(TRIM(FNAME))"]}}],"hint":"先在試算區執行 `SELECT FNAME, LENGTH(FNAME) FROM FILM` 看看。"}]},{"id":"s2","title":"時間函數","pages":"教科書 p.78–80","learn":[{"table":{"head":["函數","用途","例子","結果"],"rows":[["`YEAR(d)`","年份","`YEAR('2034-05-06')`","2034"],["`MONTH(d)`","月份","`MONTH('2034-05-06')`","5"],["`DAY(d)`","日子","`DAY('2034-05-06')`","6"],["`DATE(s)`","把字串轉為日期（MySQL 一般會自動轉換，用途不大）","`DATE('2034-05-06')`","2034-05-06"]]},"cap":"表 2.8 常用時間函數（p.78）"},{"pts":["函數的結果是**數字**，可以再運算或比較，例如 `YEAR(RELEASE) IN (2012, 2016, 2021)`。（p.80 測試站 2.3(a)）","不理年份的日期範圍（例如 08-23 至 09-22）：把月和日變成一個整數 `MONTH(DOB)*100 + DAY(DOB)`，再用 `BETWEEN 823 AND 922`。（p.79 例題 2.3(c)）","函數也可以用在 ORDER BY：`ORDER BY MONTH(DOB)` 按出生月份排列；`ORDER BY LENGTH(FNAME)` 按名稱長度排列。（p.79–80）"]},{"sim":{"db":"user","sql":"SELECT UID, USERNAME, DOB, MONTH(DOB)*100+DAY(DOB) AS MD FROM USER ORDER BY MD"},"cap":"把每位用戶的生日變成整數 MD（月 × 100 + 日），再排序。"}],"tries":[{"id":"a2b-s2-t1","pts":4,"src":"教科書 p.79 例題 2.3(c)","db":"user","sql":"SELECT UID FROM USER WHERE MONTH(DOB)*100+DAY(DOB) BETWEEN 823 AND 922","ask":{"col":"UID"},"q":"先估：生日在 08-23 至 09-22 之間的用戶編號是哪些？（Sarah 08-21、Ken 09-22、Zoe 08-23、Tom 09-23）","options":["8051, 14002","14002","9238, 8051, 14002","8051, 14002, 10777"],"why":"MD 分別是 821、922、823、923。BETWEEN 包括 823 和 922，所以只有 Ken（8051）和 Zoe（14002）。"}],"practice":[{"id":"a2b-s2-p1","type":"complete","pts":2,"src":"教科書 p.80 測試站 2.3(a)","db":"film","q":"展示於 2012、2016 和 2021 年上映的電影名稱。","template":"SELECT FNAME FROM FILM WHERE ［1］ IN (2012, 2016, 2021)","ref":["YEAR(RELEASE)"],"hint":"用 YEAR() 取出上映日期的年份。"},{"id":"a2b-s2-p2","type":"complete","pts":2,"src":"教科書 p.79 例題 2.3(b)","db":"user","q":"列出用戶名稱，按出生**月份**由小至大排列。","template":"SELECT USERNAME FROM USER ORDER BY ［1］","ref":["MONTH(DOB)"],"hint":"函數也可以用在 ORDER BY：`ORDER BY MONTH(DOB)`（默認是遞升，ASC 可省略）。"},{"id":"a2b-s2-p3","type":"mc","pts":2,"src":"教科書 p.100 課題練習第 3(e) 題","db":"film","verify":true,"ask":"rows","sql":"SELECT FCODE FROM FILM WHERE MONTH(RELEASE) BETWEEN 1 AND 6","q":"`SELECT FCODE FROM FILM WHERE MONTH(RELEASE) BETWEEN 1 AND 6` 列出在一月至六月之間上映的電影編號。在 FILM 執行時傳回多少行？","options":["2","3","4","5"],"answer":1,"hint":"`WHERE MONTH(RELEASE) BETWEEN 1 AND 6`。逐行看上映月份：3、6、7、9、2、11、7。","why":"3 月、6 月、2 月：共 3 行。"}]},{"id":"s3","title":"聚合函數","pages":"教科書 p.81、p.87–91","learn":[{"table":{"head":["函數","用途","例子（p.81 STUDENT）","結果"],"rows":[["`COUNT(*)`","記錄的數目","`SELECT COUNT(*) FROM STUDENT`","4"],["`COUNT(欄)`","該欄非 NULL 值的數目","`SELECT COUNT(SCORE) FROM STUDENT`","3"],["`MAX()`／`MIN()`","最大／最小值","`SELECT MAX(SCORE) …`","90"],["`SUM()`","總和","`SELECT SUM(SCORE) …`","201"],["`AVG()`","平均值","`SELECT AVG(SCORE) …`","67"]]},"cap":"表 2.9 常用聚合函數（p.81）。STUDENT：Ada 31、Clem 90、Eva 80、Gabe NULL。"},{"pts":["**聚合函數**把多項記錄匯總成一個值。除了 `COUNT(*)`，所有聚合函數都**不理會 NULL**：AVG = 201 ÷ 3 = 67，不是 201 ÷ 4。（p.81）","`SUM(SCORE) / COUNT(SCORE)` 等於 `AVG(SCORE)`；`SUM(SCORE) / COUNT(*)` 便不一樣（NULL 也計算在內）。（p.91）","聚合函數內可以放算式或其他函數，例如 `MAX(LENGTH(PNAME))` 找出最長的貨品名稱有多少個字符。（p.93 測試站 2.4(b)）"]},{"warn":"`SELECT NAME, MAX(SCORE) FROM STUDENT` **不能**找出最高分學生的名字：NAME 不是匯總的數據，與 MAX(SCORE) 沒有關係。MySQL 8.0 會出錯（ONLY_FULL_GROUP_BY）。要找最高分的學生，可用子查詢：`SELECT NAME FROM STUDENT WHERE SCORE = (SELECT MAX(SCORE) FROM STUDENT)`。（p.88–89）"},{"sim":{"db":"small","sql":"SELECT COUNT(*), COUNT(SCORE), SUM(SCORE), AVG(SCORE), SUM(SCORE)/COUNT(*) FROM STUDENT"},"cap":"比較 COUNT(*) 與 COUNT(SCORE)、AVG 與 SUM ÷ COUNT(*)。"}],"tries":[{"id":"a2b-s3-t1","pts":4,"src":"教科書 p.81 表 2.9","tags":[{"t":"trap","why":"除了 COUNT(*)，聚合函數都不理會 NULL：AVG 只除以非 NULL 值的數目。"}],"db":"small","sql":"SELECT AVG(SCORE) FROM STUDENT","ask":{"cell":[1,"AVG(SCORE)"]},"q":"先估：SCORE 是 31、90、80、NULL。`AVG(SCORE)` 是多少？","options":["50.25","67","201","NULL"],"why":"AVG 不理會 NULL：(31 + 90 + 80) ÷ 3 = 67。"},{"id":"a2b-s3-t2","pts":4,"src":"教科書 p.91","db":"class3","sql":"SELECT AVG(SCORE) FROM STUDENT WHERE CLASS = '3A' AND SID \u003c> '03493'","ask":{"cell":[1,"AVG(SCORE)"]},"q":"先估：3A 班的分數是 Ivy 45、Ada 0、Ben 86。Ada（03493）因缺席得 0 分，計算平均分時不應納入。結果是多少？","options":["65.5","131","43.5","45"],"why":"WHERE 先刪去 Ada 的記錄，再計算平均：(45 + 86) ÷ 2 = 65.5。如果不刪去，0 分會拉低平均分。"}],"practice":[{"id":"a2b-s3-p1","type":"fill","pts":2,"src":"教科書 p.81 表 2.9","db":"small","sql":"SELECT COUNT(*), COUNT(SCORE) FROM STUDENT","q":"寫出 `COUNT(*)` 和 `COUNT(SCORE)` 的值（p.81 STUDENT，Gabe 的 SCORE 是 NULL）。","blanks":[{"label":"COUNT(*)","ask":{"cell":[1,"COUNT(*)"]}},{"label":"COUNT(SCORE)","ask":{"cell":[1,"COUNT(SCORE)"]}}],"hint":"COUNT(*) 點算記錄；COUNT(欄) 只點算非 NULL 的值。"},{"id":"a2b-s3-p2","type":"complete","pts":2,"src":"教科書 p.93 測試站 2.4(b)","db":"product","q":"經理想找出最長的貨品名稱，以定下合適的欄位長度。寫出 SQL 語句，找出最長貨品名稱的字符長度。","template":"SELECT ［1］ FROM PRODUCT","ref":["MAX(LENGTH(PNAME))"],"hint":"先用 LENGTH() 計每個名稱的長度，再用 MAX()。"},{"id":"a2b-s3-p3","type":"mc","pts":1,"src":"教科書 p.91","tags":[{"t":"trap","why":"除了 COUNT(*)，聚合函數都不理會 NULL：AVG 只除以非 NULL 值的數目。"}],"q":"`SELECT CLASS, SUM(SCORE) / COUNT(SCORE) FROM STUDENT GROUP BY CLASS` 想找出什麼？","options":["每班的平均分","每班的總分","每班有分數的學生人數","全級的平均分"],"answer":0,"hint":"總和 ÷ 有分數的數目。","why":"SUM(SCORE) / COUNT(SCORE) 與 AVG(SCORE) 相同（兩者都不理會 NULL）。"},{"id":"a2b-s3-p4","type":"mc","pts":1,"src":"教科書 p.88–89 常見錯誤","q":"`SELECT NAME, MAX(SCORE) FROM STUDENT` 想找出最高分學生的名字。以下哪一項正確？","options":["可以，NAME 會是最高分學生的名字","不可以：NAME 不是匯總的數據，與 MAX(SCORE) 無關（MySQL 8.0 更會出錯）","不可以：MAX 只可以用在 HAVING","可以，但要加 DISTINCT"],"answer":1,"hint":"只有放在聚合函數內的欄位才是匯總的數據。","why":"要找最高分的學生，可用子查詢 `WHERE SCORE = (SELECT MAX(SCORE) FROM STUDENT)`（第 3 章）。"}]},{"id":"s4","title":"GROUP BY 與 HAVING","pages":"教科書 p.81–87、p.90–94","learn":[{"pts":["`GROUP BY CLASS`：CLASS 相同的記錄歸入同一組，聚合函數**每組計算一次**，結果每組一行。（p.82）","通常要一併 SELECT 用作分組的欄位，否則看不出每行是哪一組。（p.83）","SELECT 之後的欄位，要麼在 GROUP BY 之中，要麼放在聚合函數之內，否則沒有意義（MySQL 8.0 會出錯）。（p.84）","可以按多個欄位分組：`GROUP BY CLASS, SEX`；也可以按函數分組：`GROUP BY YEAR(DOB)`。（p.86–87）","`HAVING`：在分組**之後**篩選類別，例如 `HAVING COUNT(*) > 1`；`WHERE`：在分組**之前**篩選記錄。聚合函數不可以放在 WHERE。（p.84–85）","子句次序：`SELECT … FROM … WHERE … GROUP BY … HAVING … ORDER BY …`。（p.85）"]},{"sim":{"db":"school","sql":"SELECT CLASS, COUNT(*) FROM STUDENT\n    WHERE SCORE1 >= 60\n    GROUP BY CLASS\n    HAVING COUNT(*) > 1\n    ORDER BY CLASS"},"cap":"p.85：先 WHERE 選出第一次測驗合格的學生，再按班別分組點算，最後 HAVING 只留下多於一人的班別。試刪去 WHERE 或 HAVING 一行，比較結果。"},{"fix":{"bad":"SELECT CLASS, COUNT(*) FROM STUDENT WHERE COUNT(*) > 1 GROUP BY CLASS","good":"SELECT CLASS, COUNT(*) FROM STUDENT GROUP BY CLASS HAVING COUNT(*) > 1","why":"聚合函數不可放在 WHERE：WHERE 在分組之前執行，那時還未有「每組的人數」。（p.85 常見錯誤）"}}],"tries":[{"id":"a2b-s4-t1","pts":4,"src":"教科書 p.86","tags":[{"t":"hot","why":"卷二A 常考 GROUP BY／HAVING 及聚合函數，例如 DSE 2017 2A Q2、2019 2A Q3、2022 2A Q3"}],"db":"class3","sql":"SELECT CLASS, SEX, COUNT(*) FROM STUDENT GROUP BY CLASS, SEX ORDER BY CLASS, SEX","ask":"rows","q":"先估：`GROUP BY CLASS, SEX` 的結果有多少行？（3A：F、F、M；3B：F、F、F、M；3C：M、M、M）","options":["3","5","6","10"],"why":"每個（班別, 性別）組合一行：3A F、3A M、3B F、3B M、3C M，共 5 行（3C 沒有女生，所以沒有 3C F）。"}],"practice":[{"id":"a2b-s4-p1","type":"complete","pts":2,"src":"教科書 p.93 例題 2.4(d)","db":"member","q":"列出每個會員類型中，各性別會員的平均積分。（要顯示分組用的欄位）","template":"SELECT TYPEID, SEX, AVG(CREDIT) FROM MEMBER GROUP BY ［1］","ref":["TYPEID, SEX"],"hint":"按兩個欄位分組。"},{"id":"a2b-s4-p2","type":"complete","pts":2,"src":"教科書 p.93 例題 2.4(f)","db":"member","q":"找出每個月登記成為**銅級會員**（TYPEID = 0）的人數，不限年份。","template":"SELECT MONTH(REGDATE), COUNT(*) FROM MEMBER WHERE ［1］ GROUP BY ［2］","ref":["TYPEID = 0","MONTH(REGDATE)"],"hint":"先用 WHERE 篩選銅級會員，再按登記月份分組。"},{"id":"a2b-s4-p3","type":"fill","pts":1,"src":"教科書 p.93 例題 2.4(b)","db":"member","sql":"UPDATE MEMBER SET TYPEID = 3 WHERE TYPEID = 2 AND YEAR(REGDATE) \u003c= 2018; SELECT NAME FROM MEMBER WHERE TYPEID = 3","q":"把所有於 2018 年或之前登記的金級會員（TYPEID = 2）升為鑽石級（TYPEID = 3）。執行後，鑽石級會員有多少人？","blanks":[{"label":"鑽石級人數","ask":"rows"}],"hint":"原本已有 1 位鑽石級（Lam Chi）。金級會員：Chan（2017）、Lee（2019）、Tse（2018）。"},{"id":"a2b-s4-p4","type":"mc","pts":1,"src":"教科書 p.85","tags":[{"t":"trap","why":"WHERE 在分組前篩選記錄，HAVING 在分組後篩選類別；聚合函數不可放在 WHERE。"}],"q":"要列出「每班第一次測驗合格（SCORE1 >= 60）的人數，只顯示多於一人的班別」，`SCORE1 >= 60` 和 `COUNT(*) > 1` 應分別放在哪裏？","options":["兩者都放在 WHERE","兩者都放在 HAVING","SCORE1 >= 60 放在 WHERE，COUNT(*) > 1 放在 HAVING","SCORE1 >= 60 放在 HAVING，COUNT(*) > 1 放在 WHERE"],"answer":2,"hint":"篩選記錄（分組前）→ WHERE；篩選類別（分組後）→ HAVING。"}]},{"id":"write","kind":"write","title":"寫 SQL","pages":"教科書 p.99–100 課題練習","intro":"在編輯器寫一句 SELECT 語句，先按「▶ 執行」看結果，再按「提交評核」。評核會用另外的數據再測試，所以不可以只寫出現在的答案。","tasks":[{"id":"a2b-w1","tier":"必做","pts":10,"title":"描述太長或欠缺描述的手機","src":"教科書 p.100 課題練習第 2(b) 題","db":"phone","q":"PHONE 的 CAPTION 是手機的產品描述。部分描述**多於 100 個字符**，又有些手機**欠缺**產品描述（NULL）。列出這些手機的 PID。","starter":"SELECT PID FROM PHONE WHERE LENGTH(CAPTION) >= 100","ref":"SELECT PID FROM PHONE WHERE LENGTH(CAPTION) > 100 OR CAPTION IS NULL","hint":"「多於 100」不包括 100；欠缺描述要用 `CAPTION IS NULL`（LENGTH(NULL) 是 NULL，不會大於 100）。兩個情況用 OR 連接。"},{"id":"a2b-w2","tier":"進階","pts":12,"title":"每年未停產手機的售價總和","src":"教科書 p.100 課題練習第 2(d) 題","db":"phone","q":"計算**每年**開始發售的手機的售價總和，只計算**未停產**的手機（DISC = 0）。顯示年份及售價總和。","starter":"SELECT YEAR(RELEASE), SUM(PRICE) FROM PHONE","ref":"SELECT YEAR(RELEASE), SUM(PRICE) FROM PHONE WHERE DISC = 0 GROUP BY YEAR(RELEASE)","hint":"先 `WHERE DISC = 0`（或 `DISC = FALSE`），再 `GROUP BY YEAR(RELEASE)`。"},{"id":"a2b-w3","tier":"挑戰","pts":13,"title":"文學平均分 80 或以上的年齡組別","src":"教科書 p.100 課題練習第 1(e) 題","db":"quiz","q":"CONTESTANT 記錄問答比賽參賽者的資料：AGID 是年齡組別編號，LITE 是文學分數，SUBTIME 是遞交時間。\n列出所有文學**平均分 80 或以上**的年齡組別（AGID）。計算平均分時，只包括於 **2025-03-13 23:59:59 或之前**遞交答案的參賽者。","starter":"SELECT AGID FROM CONTESTANT GROUP BY AGID","ref":"SELECT AGID FROM CONTESTANT WHERE SUBTIME \u003c= '2025-03-13 23:59:59' GROUP BY AGID HAVING AVG(LITE) >= 80","hint":"遞交時間的條件是篩選**記錄**（WHERE，分組前）；平均分的條件是篩選**組別**（HAVING，分組後）。「或之前」用 `\u003c=`，「或以上」用 `>=`。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.85–99","items":[{"id":"a2b-q1","pts":4,"src":"教科書 p.99 課文總結（尋找復活蛋比賽）","tags":[{"t":"hot","why":"卷二A 常考 GROUP BY／HAVING 及聚合函數，例如 DSE 2017 2A Q2、2019 2A Q3、2022 2A Q3"}],"db":"egg","sql":"SELECT TEAM, SUM(EGG) AS TOTAL FROM CONTESTANT GROUP BY TEAM HAVING TOTAL > 5 ORDER BY TEAM","ask":"table","verify":true,"q":"CONTESTANT 的 EGG：X 隊 2、2、4；Y 隊 3、0、2；Z 隊 5、0、1。以下語句的輸出是什麼？\n`SELECT TEAM, SUM(EGG) AS TOTAL FROM CONTESTANT GROUP BY TEAM HAVING TOTAL > 5 ORDER BY TEAM`","options":["X, 8","X, 8\nZ, 6","X, 8\nY, 5\nZ, 6","Z, 6"],"answer":"B","why":"各隊總數：X 8、Y 5、Z 6。HAVING 只保留總數大於 5 的隊伍。"},{"id":"a2b-q2","pts":4,"src":"教科書 p.99 課文總結","db":"egg","sql":"SELECT SEX, AVG(EGG) AS NUM FROM CONTESTANT GROUP BY SEX ORDER BY SEX","ask":"table","verify":true,"q":"女參賽者（F）找到 2、2、4、1 隻蛋；男參賽者（M）找到 3、0、5、2、0 隻。`SELECT SEX, AVG(EGG) AS NUM FROM CONTESTANT GROUP BY SEX ORDER BY SEX` 的輸出是什麼？","options":["F, 9\nM, 10","F, 4\nM, 5","F, 2.25\nM, 2","F, 2.25\nM, 2.5"],"answer":"C","why":"F：9 ÷ 4 = 2.25；M：10 ÷ 5 = 2（0 不是 NULL，要計算在內）。"},{"id":"a2b-q3","pts":4,"src":"教科書 p.94 測試站 2.4(e)","tags":[{"t":"trap","why":"WHERE 在分組前篩選記錄，HAVING 在分組後篩選類別；聚合函數不可放在 WHERE。"}],"db":"product","sql":"SELECT PNAME, MIN(PRICE) FROM PRODUCT WHERE STOCK > 50 GROUP BY PNAME HAVING MIN(PRICE) >= 10","ask":"rows","verify":true,"q":"找出每項貨品的最低價格，只計存貨多於 50 件的倉庫，並排除最低價格低於 10 的貨品。\n`SELECT PNAME, MIN(PRICE) FROM PRODUCT WHERE STOCK > 50 GROUP BY PNAME HAVING MIN(PRICE) >= 10`\nPRODUCT 有 5 種貨品：Potato chips（13.9／216 件、12.5／40 件、14.2／120 件）、Candy bar（18.5／231、9.5／80）、Bag of rice（62.9／193、59／30）、Toothbrush（17.9／389、16／60）、Soap（8.9／500）。結果有多少行？","options":["2","3","4","5"],"answer":"B","why":"WHERE 先刪去存貨不多於 50 的記錄（12.5、59）。最低價：Potato chips 13.9、Candy bar 9.5、Bag of rice 62.9、Toothbrush 16、Soap 8.9。HAVING 刪去 Candy bar 和 Soap，餘 3 行。"},{"id":"a2b-q4","pts":4,"src":"教科書 p.99 課題練習第 1(c) 題","db":"quiz","sql":"SELECT AGID, MAX(LITE) FROM CONTESTANT GROUP BY AGID ORDER BY AGID","ask":"rows","verify":true,"q":"CONTESTANT 有 AGID 是 1、2、3 的參賽者，也有兩位 AGID 是 NULL（忘記註明組別）。`SELECT AGID, MAX(LITE) FROM CONTESTANT GROUP BY AGID ORDER BY AGID` 的結果有多少行？","options":["2","3","4","9"],"answer":"C","why":"GROUP BY 把所有 NULL 歸入同一組，所以有 1、2、3 和 NULL 四組。"},{"id":"a2b-q5","pts":4,"src":"教科書 p.84–85、p.88（DSE 卷二A 題型）","tags":[{"t":"trap","why":"WHERE 在分組前篩選記錄，HAVING 在分組後篩選類別；聚合函數不可放在 WHERE。"}],"q":"以下哪一句 SQL 語句**能夠**正確執行？","options":["SELECT CLASS, COUNT(*) FROM STUDENT WHERE COUNT(*) > 1 GROUP BY CLASS","SELECT CLASS, NAME, COUNT(*) FROM STUDENT GROUP BY CLASS","SELECT CLASS, AVG(SCORE) FROM STUDENT GROUP BY CLASS ORDER BY AVG(SCORE) DESC","SELECT CLASS, COUNT(*) FROM STUDENT GROUP BY CLASS WHERE SCORE >= 60"],"answer":"C","why":"A：聚合函數不可放在 WHERE；B：NAME 不在 GROUP BY 中，也不在聚合函數內；D：WHERE 要放在 GROUP BY 之前。"}]},{"id":"more","kind":"endless","title":"無限練習","gens":["sqlFunc","sqlAgg"],"intro":"隨機生成文字／時間函數及 COUNT／SUM／AVG／MAX／MIN、GROUP BY、HAVING 的題目，答案由 SQL 引擎計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]}, {"code":"選修A","title":"選修A 數據庫 自學平台","kicker":"HKDSE ICT · 選修 A","pin":"aict2026"});
