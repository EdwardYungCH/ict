"M1",2,"2025-01-20",1],["C1","M3",1,"2025-01-26",0],["C2","M2",1,"2025-01-24",0],["C2","M1",1,"2025-01-27",0],["C3","M3",1,"2025-01-22",0],["C3","M2",2,"2025-01-25",1]],["CID","MID","ETA"]]}},"sections":[{"id":"s1","title":"UNION 與 UNION ALL","pages":"教科書 p.158–162","learn":[{"pts":["**集合運算符**把兩個 SELECT 的**結果**合併成一個結果。（p.158）","**UNION**：兩個結果的所有列，**重複的列只保留一次**（如同 DISTINCT）。`SELECT SID FROM STUDENT UNION SELECT STUDENTID FROM STUDENT2`：03517 在兩個數據表都有，只出現一次，共 10 行。（p.158）","只有**完全一致**的列才算重複：同時選擇 SID 和 NAME 時，03517 Ben 和 03517 Benz 不同，兩行都保留。（p.159）","兩個結果的**欄位數目**要相同，欄名不必相同；結果用**第一個** SELECT 的欄名。但數據類型不同（DOB 與 STUDENTID）合併起來毫無意義。（p.159）","每個 SELECT 有自己的 WHERE，**不會共用**。（p.160）","**ORDER BY 只可放在最後**，排序整個合併結果，並要用**第一個**結果的欄名（`ORDER BY SID`，不是 `ORDER BY STUDENTID`）。（p.160–161）","**UNION ALL**：保留重複的列（03517 出現兩次）。想知道某個值出現的次數時使用；不用比較重複，效能較好。（p.162）","**連接 vs 合併**：連接是「橫向」把相關的數據配對（例如城市配國家，欄位增加）；合併是「縱向」把同類數據疊起來（兩個城市表變一個，行數增加）。（p.161）"]},{"sim":{"db":"union","sql":"SELECT SID, NAME FROM STUDENT UNION SELECT STUDENTID, NAME FROM STUDENT2"},"cap":"p.159：數一數 03517 出現多少次。再試把 UNION 改成 UNION ALL，或只選 SID。"},{"fix":{"bad":"SELECT SID FROM STUDENT WHERE CLASS = '3A' ORDER BY SID\nUNION\nSELECT STUDENTID FROM STUDENT2 WHERE CLASS = '3B' ORDER BY STUDENTID","good":"SELECT SID FROM STUDENT WHERE CLASS = '3A'\nUNION\nSELECT STUDENTID FROM STUDENT2 WHERE CLASS = '3B'\nORDER BY SID","why":"ORDER BY 只可在整句最後出現一次，並用第一個 SELECT 的欄名。（p.160–161）"}}],"tries":[{"id":"a3d-s1-t1","pts":4,"src":"教科書 p.160","db":"union","sql":"SELECT SID FROM STUDENT UNION SELECT STUDENTID FROM STUDENT2 WHERE CLASS = '3B'","q":"先估：結果有多少行？","ask":"rows","options":["8","1","10","11"],"why":"WHERE 只屬於第二個 SELECT：STUDENT 的 7 個 SID 全部保留，STUDENT2 只加入 3B 班的 03519，共 8 行。"}],"practice":[{"id":"a3d-s1-p1","type":"fill","pts":2,"src":"教科書 p.158、p.162","db":"union","sql":"SELECT SID FROM STUDENT UNION ALL SELECT STUDENTID FROM STUDENT2","q":"用 UNION ALL 合併兩個數據表的學生識別碼。結果有多少行？","blanks":[{"label":"行數","ask":"rows"}],"hint":"7 + 4，不移除重複。（用 UNION 則是 10 行。）"},{"id":"a3d-s1-p2","type":"mc","pts":1,"src":"教科書 p.160–161","db":"union","q":"以下哪一句**可以**正確執行？","options":["SELECT SID FROM STUDENT UNION SELECT STUDENTID FROM STUDENT2 ORDER BY STUDENTID","SELECT SID FROM STUDENT ORDER BY SID UNION SELECT STUDENTID FROM STUDENT2","SELECT SID FROM STUDENT UNION SELECT STUDENTID FROM STUDENT2 ORDER BY SID","SELECT SID, NAME FROM STUDENT UNION SELECT STUDENTID FROM STUDENT2"],"answer":2,"hint":"ORDER BY 放在最後並用第一個結果的欄名；兩邊的欄位數目要相同。"},{"id":"a3d-s1-p3","type":"complete","pts":2,"src":"教科書 p.160","db":"union","q":"列出 STUDENT 中 3A 班和 STUDENT2 中 3A 班學生的名字（重複的名字只列一次），按名字排序。","template":"SELECT NAME FROM STUDENT WHERE CLASS = '3A'\n［1］ SELECT NAME FROM STUDENT2 ［2］\nORDER BY NAME","ref":["UNION","WHERE CLASS = '3A'"],"check":{"order":true},"hint":"每個 SELECT 要有自己的 WHERE。"}]},{"id":"s2","title":"INTERSECT 與 EXCEPT；從結果中選取數據","pages":"教科書 p.163–165","learn":[{"pts":["**INTERSECT**：只傳回**同時存在於兩個結果**中的列。`SELECT SID FROM STUDENT INTERSECT SELECT STUDENTID FROM STUDENT2` 得 03517。（p.163）","同時選擇 SID 和 NAME：Ben ≠ Benz，所以 INTERSECT 沒有結果（Empty set）。（p.163）","**EXCEPT**（DSE 及部分 DBMS 寫作 **MINUS**）：第一個結果的列，**排除**同樣存在於第二個結果的列。（p.164）","同時選擇 SID 和 NAME 時，03517 Ben 與 03517 Benz 不一致，所以**不會**被排除。（p.164–165）","一句 SQL 可用多個集合運算符，例如三個 INTERSECT 找出 S1、S2、S3 都有的 SID（8）。INTERSECT 比 UNION／EXCEPT 先計算；UNION 與 EXCEPT 由左至右計算。（p.165）","**從結果中選取數據**：給結果一個**別名**，便可當作數據表使用：`SELECT COUNT(*) FROM (SELECT SID FROM STUDENT UNION SELECT STUDENTID FROM STUDENT2) u` 得 10。（p.165 擴闊視野）","`SELECT COUNT(SID) FROM STUDENT UNION SELECT COUNT(STUDENTID) FROM STUDENT2` 卻只是把 7 和 4 疊在一起，不是不同學生的人數。（p.165）"]},{"table":{"head":["運算符","文氏圖","STUDENT 與 STUDENT2 的 SID"],"rows":[["A UNION B","A ∪ B","10 個"],["A UNION ALL B","A + B（保留重複）","11 個"],["A INTERSECT B","A ∩ B","03517"],["A EXCEPT B（MINUS）","A − B","6 個（不包括 03517）"]]},"cap":"四個集合運算符（p.158–164）"},{"sim":{"db":"union","sql":"SELECT SID FROM S1 INTERSECT SELECT SID FROM S2 INTERSECT SELECT SID FROM S3"},"cap":"p.165：S1 = {4, 5, 8, 2, 1}、S2 = {1, 8, 0, 3, 7}、S3 = {2, 6, 7, 9, 8}。試把運算符改成 UNION、EXCEPT。"}],"tries":[{"id":"a3d-s2-t1","pts":4,"src":"教科書 p.165（延伸）","db":"union","sql":"SELECT SID FROM S1 EXCEPT SELECT SID FROM S2 EXCEPT SELECT SID FROM S3","q":"先估：輸出哪些 SID？","ask":{"col":"SID"},"options":["4, 5","4, 5, 2","4, 5, 8","0, 3"],"why":"S1 − S2 = {4, 5, 2}（除去 8、1）；再減 S3 = {4, 5}（除去 2）。即只屬於 S1 的數字。"}],"practice":[{"id":"a3d-s2-p1","type":"mc","pts":2,"src":"教科書 p.164–165","db":"union","verify":true,"ask":"rows","q":"以下語句的結果有多少行？","sql":"SELECT SID, NAME FROM STUDENT EXCEPT SELECT STUDENTID, NAME FROM STUDENT2","options":["6","7","3","0"],"answer":1,"hint":"只有完全一致的列才會被排除：(03517, Ben) 與 (03517, Benz) 不同。"},{"id":"a3d-s2-p2","type":"complete","pts":2,"src":"教科書 p.165 擴闊視野","db":"union","q":"點算在 STUDENT 和 STUDENT2 中擁有獨一無二的識別碼的學生人數（結果是 10）。","template":"SELECT COUNT(*) FROM (SELECT SID FROM STUDENT ［1］ SELECT STUDENTID FROM STUDENT2) ［2］","ref":["UNION","u"],"hint":"先用 UNION 移除重複，再給結果一個別名，當作數據表點算。"},{"id":"a3d-s2-p3","type":"mc","pts":1,"src":"教科書 p.165","db":"union","verify":true,"ask":{"col":"SID"},"q":"以下語句輸出哪些 SID？","sql":"SELECT SID FROM S1 INTERSECT SELECT SID FROM S3","options":["8, 2","8","2, 6, 7, 9, 8","4, 5, 1"],"answer":0,"hint":"同時在 S1 和 S3 的數字；結果按 S1 的次序列出。"}]},{"id":"s3","title":"綜合：集合運算的應用","pages":"教科書 p.166–169（例題 3.4、測試站 3.4）","learn":[{"pts":["例題 3.4：PARTICIPANT（ID, NAME, GENDER, AGE）、FOOTBALL（ID, PID, BIB, TEAM）、RELAYRACE（ID, PID, BIB, TEAM）。部分參賽者未決定參加哪個項目。（p.166）","(a) 每個號碼出現的**次數**都要列出 → `UNION ALL`，`ORDER BY BIB` 放最後。","(b) 在**其中一個**項目屬於 A 隊 → `UNION`（不是 INTERSECT），每個 SELECT 都要有 `WHERE TEAM = 'A'`。把 WHERE 放在括號外共用是錯的。","(c) 參加足球、**沒有**參加接力的女性 → 子查詢內用 `EXCEPT`：`ID IN (SELECT PID FROM FOOTBALL EXCEPT SELECT PID FROM RELAYRACE)`。不能直接「排除參加接力的人」，因為有人兩項都沒參加。","(d)「沒有**同時**參加兩個項目」≠「沒有參加任何項目」→ `ID NOT IN (SELECT PID FROM FOOTBALL INTERSECT SELECT PID FROM RELAYRACE)`。（p.167–168）","集合運算符可以放在子查詢中。"]},{"sim":{"db":"sports","sql":"SELECT NAME FROM PARTICIPANT WHERE AGE >= 22 AND ID NOT IN\n    (SELECT PID FROM FOOTBALL INTERSECT SELECT PID FROM RELAYRACE)"},"cap":"例題 3.4(d)（p.168）：Hugo 兩項都沒有參加，也符合「沒有同時參加兩個項目」。"},{"sim":{"db":"books","sql":"SELECT BNAME, PRICE FROM HBS h, BOOK b WHERE h.ISBN = b.ISBN AND PAGE >= 300\nUNION\nSELECT BNAME, PRICE FROM WBS w, BOOK b WHERE w.ISBN = b.ISBN AND PAGE >= 300\nORDER BY BNAME"},"cap":"測試站 3.4(c)（p.169）：兩間書店售價相同的書只列一次；售價不同便列兩行。"}],"tries":[{"id":"a3d-s3-t1","pts":4,"src":"教科書 p.168 例題 3.4(c)","db":"sports","sql":"SELECT NAME FROM PARTICIPANT WHERE GENDER = 'F' AND ID IN\n    (SELECT PID FROM FOOTBALL EXCEPT SELECT PID FROM RELAYRACE)","q":"先估：足球 PID 是 1、2、3、5、6；接力 PID 是 2、3、4、6、7。女性有 Amy(1)、Cara(3)、Ella(5)、Gigi(7)。輸出哪些名字？","ask":{"col":"NAME"},"options":["Amy, Ella","Amy, Cara, Ella","Cara","Amy, Ella, Gigi"],"why":"足球 EXCEPT 接力 = {1, 5}；兩人都是女性。Cara(3) 兩項都參加；Gigi(7) 只參加接力。"}],"practice":[{"id":"a3d-s3-p1","type":"complete","pts":2,"src":"教科書 p.168 例題 3.4(b)","db":"sports","q":"列出至少在其中一項比賽中屬於「A」隊的參賽者之識別碼。","template":"SELECT PID FROM FOOTBALL WHERE TEAM = 'A'\n    ［1］ SELECT PID FROM RELAYRACE ［2］","ref":["UNION","WHERE TEAM = 'A'"],"hint":"「其中一項」→ UNION；第二個 SELECT 也要有自己的 WHERE。"},{"id":"a3d-s3-p2","type":"fill","pts":2,"src":"教科書 p.169 測試站 3.4(a)","db":"books","sql":"SELECT ISBN FROM WBS WHERE PRICE \u003c 100 EXCEPT SELECT ISBN FROM HBS","q":"列出在 World Bookstore 而非 Hello Bookstore 出售、且售價低於 $100 的書本之 ISBN。結果有多少行？","blanks":[{"label":"行數","ask":"rows"}],"hint":"WBS 中低於 $100 的：9780004、9780005、9780007；它們都不在 HBS。"},{"id":"a3d-s3-p3","type":"mc","pts":1,"src":"教科書 p.169 測試站 3.4(c)","db":"books","verify":true,"ask":"rows","q":"以下語句的結果有多少行？","sql":"SELECT BNAME, PRICE FROM HBS h, BOOK b WHERE h.ISBN = b.ISBN AND PAGE >= 300\nUNION\nSELECT BNAME, PRICE FROM WBS w, BOOK b WHERE w.ISBN = b.ISBN AND PAGE >= 300","options":["3","4","5","6"],"answer":1,"hint":"HBS：Data Stories 120、Cat Tales 150；WBS：Data Stories 110、Cat Tales 150、Night Sky 99。Cat Tales 150 重複，只留一行。"}]},{"id":"s4","title":"檢視（VIEW）","pages":"教科書 p.170–181、p.186–190（例題 3.5、測試站 3.5）","learn":[{"pts":["程式中經常重用的代碼可寫成子程式；數據庫中經常重用的 SELECT 結果，可以創建**檢視（view）**——一個「**虛擬的數據表**」。（p.170）","`CREATE VIEW 檢視名 AS SELECT …`。之後 `SELECT * FROM 檢視名` 與執行那句 SELECT 的結果一模一樣。（p.175）","計算出來的欄位（例如 `SCORE1*0.4+SCORE2*0.6`、`COUNT(*)`）**一定要加別名**（FSCORE、CLUBNUM），否則很難在之後選擇。（p.175）","檢視**不儲存數據**，只參照其他數據表：更新 STUDENT 後，檢視的結果自動改變；**不須、也不應**手動更新檢視。（p.176）","`CREATE OR REPLACE VIEW`：修改現存的檢視。檢視也可以參照其他檢視。（p.179）","`DROP VIEW 檢視名`：刪除檢視。被參照的數據表或檢視刪除後，參照它的檢視便會**失效**。（p.181）","陷阱（p.178–179）：`COUNTCLUB` 用 `SELECT SID, COUNT(*) … FROM SC GROUP BY SID`，沒有學會的 Dio 根本不在 SC，所以**不在檢視中**；找「加入不多於兩個學會」的學生時便漏了他。要改用 `SC RIGHT JOIN STUDENT`，並用 `COUNT(CID)`（不是 COUNT(*)）。"]},{"sim":{"db":"view","sql":"CREATE VIEW SCORESHEET AS\n  SELECT s.SID, NAME, SEX, s.CLASS, TEACH, LANG, SCORE1*0.4+SCORE2*0.6 AS FSCORE\n  FROM STUDENT s, CLASS cl WHERE s.CLASS = cl.CLASS;\nSELECT NAME FROM SCORESHEET WHERE TEACH = 'Mr Suen' AND FSCORE \u003c 60"},"cap":"p.175–176：先創建檢視，之後的查詢便很短。試把最後一句改成 `SELECT * FROM SCORESHEET`。"},{"sim":{"db":"view","sql":"CREATE VIEW SCORESHEET AS\n  SELECT s.SID, NAME, SEX, s.CLASS, TEACH, LANG, SCORE1*0.4+SCORE2*0.6 AS FSCORE\n  FROM STUDENT s, CLASS cl WHERE s.CLASS = cl.CLASS;\nUPDATE STUDENT SET SCORE2 = SCORE2 + 10 WHERE SID = '03369';\nSELECT * FROM SCORESHEET WHERE SID = '03369'"},"cap":"p.176：只更新 STUDENT，Hans 在 SCORESHEET 的 FSCORE 便由 73 變成 79。"},{"sim":{"db":"view","sql":"CREATE VIEW COUNTCLUB AS\n  SELECT SID, COUNT(*) AS CLUBNUM FROM SC GROUP BY SID;\nCREATE OR REPLACE VIEW COUNTCLUB AS\n  SELECT s.SID, COUNT(CID) AS CLUBNUM FROM SC\n  RIGHT JOIN STUDENT s ON SC.SID = s.SID GROUP BY s.SID;\nSELECT * FROM COUNTCLUB"},"cap":"p.177–179：先用舊的 COUNTCLUB，再以 CREATE OR REPLACE VIEW 修改。刪去第二句，看看 Dio（03513）是否還在。"},{"sim":{"db":"hospital","sql":"CREATE VIEW RPNUM AS\n  SELECT r.ID, RNAME, CAPACITY, COUNT(p.ID) AS PNUM FROM ROOM r\n  LEFT JOIN PATIENT p ON r.ID = RID GROUP BY r.ID;\nSELECT RNAME FROM RPNUM WHERE PNUM \u003c CAPACITY"},"cap":"例題 3.5(a)(b)（p.187）：RPNUM 要用 r.ID 和 COUNT(p.ID)，沒有病人的病房才會是 0。"},{"h":"找出最大的聚合值（p.174）"},{"pts":["聚合函數不能嵌套：`SELECT MAX(COUNT(*)) FROM SC GROUP BY SID` 會出錯。","可把分組結果當作數據表：`SELECT MAX(TOTAL) FROM (SELECT COUNT(*) AS TOTAL FROM SC GROUP BY SID) t`；或排序後取第一行：`… ORDER BY TOTAL DESC LIMIT 1`。","有了檢視便簡單得多：`SELECT NAME FROM SCORESHEET WHERE CLUBNUM = (SELECT MAX(CLUBNUM) FROM SCORESHEET)`。（p.181）"]}],"tries":[{"id":"a3d-s4-t1","pts":4,"src":"教科書 p.178","db":"view","sql":"CREATE VIEW SCORESHEET AS\n  SELECT s.SID, NAME, SEX, s.CLASS, TEACH, LANG, SCORE1*0.4+SCORE2*0.6 AS FSCORE\n  FROM STUDENT s, CLASS cl WHERE s.CLASS = cl.CLASS;\nCREATE VIEW COUNTCLUB AS\n  SELECT SID, COUNT(*) AS CLUBNUM FROM SC GROUP BY SID;\nSELECT NAME FROM SCORESHEET WHERE FSCORE > 60 AND\n    SID IN (SELECT SID FROM COUNTCLUB WHERE CLUBNUM \u003c= 2)","q":"先估：COUNTCLUB 用 `SELECT SID, COUNT(*) AS CLUBNUM FROM SC GROUP BY SID`。最終分數 > 60 且加入不多於兩個學會的學生是誰？","ask":{"col":"NAME"},"options":["Jean, Eva, Ben","Jean, Eva, Dio, Ben","Hans, Jean, Clem, Eva, Gabe","Ivy, Jean, Ada, Eva, Finn, Ben"],"why":"FSCORE > 60 的有 Hans、Jean、Clem、Eva、Gabe、Ben；其中 CLUBNUM ≤ 2 的是 Jean、Eva、Ben。（Dio 只有 52.6 分，而且他根本不在 COUNTCLUB 中——如果條件是 FSCORE \u003c 60，他也會被漏掉。）"},{"id":"a3d-s4-t2","pts":4,"src":"教科書 p.187 例題 3.5(a) 分析","db":"hospital","sql":"SELECT RNAME, COUNT(*) AS PNUM FROM ROOM r\n    LEFT JOIN PATIENT p ON r.ID = RID GROUP BY r.ID","q":"先估：病房 B02 沒有病人。用 COUNT(*) 時，B02 的 PNUM 是多少？","ask":{"cell":[4,"PNUM"]},"options":["1","0","NULL","2"],"why":"LEFT JOIN 保留 B02，產生一行病人欄位全是 NULL 的記錄；COUNT(*) 點算行數得 1。所以書中強調要用 COUNT(p.ID)。"}],"practice":[{"id":"a3d-s4-p1","type":"mc","pts":1,"src":"教科書 p.176、p.182","q":"Hans 覆核後第二次測驗加了 10 分。應該怎樣更新？","options":["UPDATE STUDENT SET SCORE2 = SCORE2 + 10 WHERE SID = '03369'，SCORESHEET 會自動更新","UPDATE SCORESHEET SET FSCORE = FSCORE + 6 WHERE SID = '03369'","先更新 STUDENT，再更新 SCORESHEET","先 DROP VIEW SCORESHEET，再更新 STUDENT"],"answer":0,"hint":"檢視不儲存數據，只參照數據表。"},{"id":"a3d-s4-p2","type":"complete","pts":2,"src":"教科書 p.181","db":"view","q":"用 SCORESHEET 列出最終分數最高的學生之名字。","template":"CREATE VIEW SCORESHEET AS\n  SELECT s.SID, NAME, SEX, s.CLASS, TEACH, LANG, SCORE1*0.4+SCORE2*0.6 AS FSCORE\n  FROM STUDENT s, CLASS cl WHERE s.CLASS = cl.CLASS;\nSELECT NAME FROM SCORESHEET WHERE FSCORE = (SELECT ［1］ FROM SCORESHEET)","ref":["MAX(FSCORE)"],"hint":"子查詢找出最高的 FSCORE。"},{"id":"a3d-s4-p3","type":"fill","pts":2,"src":"教科書 p.188–190 測試站 3.5(d)(f)","db":"food","sql":"CREATE VIEW FORDER2 AS\n  SELECT CID, OPRICE*(1-DISCOUNT)*NUM AS TPRICE, ETA FROM FORDER f, MEAL m\n  WHERE f.MID = m.MID AND PAID = FALSE;\nCREATE VIEW CPAYMENT AS\n  SELECT CNAME, SEX, DEPOSIT, SUM(TPRICE) AS DUE\n  FROM CUSTOMER c LEFT JOIN FORDER2 f ON c.CID = f.CID GROUP BY c.CID;\nSELECT CNAME, DEPOSIT, DUE FROM CPAYMENT WHERE DEPOSIT \u003c DUE","q":"測試站 3.5(c)(d)(f)：FORDER2 只顯示未付款的訂單；CPAYMENT 的 DUE 是每位顧客未付款訂單總價之和。最後一句列出存款不足以支付的顧客。寫出結果的行數。（想一想：沒有訂單的 Sam 為甚麼不在結果中？）","blanks":[{"label":"行數","ask":"rows"}],"hint":"Ann 欠 90（存款 100）；Ken 欠 40 + 45 = 85（存款 50）；May 欠 90（存款 20）；Sam 的 DUE 是 NULL，DEPOSIT \u003c NULL 不是 TRUE。"}]},{"id":"s5","title":"索引（INDEX）","pages":"教科書 p.182–185","learn":[{"pts":["沒有索引時，DBMS 要**逐行檢查**數據表（線性檢索）：11 項記錄最壞要檢查 11 次。（p.182）","為經常搜尋的欄位（例如 NAME）建立**索引（index）**：DBMS 建立一個**索引表**，包含已排序的索引欄位及指向記錄的指標。（p.182）","索引表已排序，DBMS 便可用**對分檢索**：11 項記錄最壞只要檢查 4 次（Finn → Hans → Gabe → Guy）。（p.183–184）","記錄數目每增加一倍，最多只多檢查 1 次：N 項記錄最多約 ⌊log₂N⌋ + 1 次（1024 項最多 11 次）。","索引欄位的數據改動（Guy 改名 Gal）或加入新記錄（Hope）時，索引表**必須更新**，否則檢索不到。DBMS 會自動更新，但**需時**，而且索引表要**佔用儲存空間**。（p.184–185）","所以**只應為經常搜尋的欄位**建立索引。（p.185）","`CREATE INDEX SNAME ON STUDENT (NAME)`：SNAME 是索引名稱，STUDENT 是數據表，(NAME) 是欄位。（p.185）","刪除索引：`ALTER TABLE STUDENT DROP INDEX SNAME`（MySQL 也可寫 `DROP INDEX SNAME ON STUDENT`）。忘記索引名稱可用 `SHOW CREATE TABLE STUDENT` 查看。（p.185）"]},{"sim":{"db":"view","sql":"CREATE INDEX SNAME ON STUDENT (NAME);\nSHOW CREATE TABLE STUDENT"},"cap":"p.185：建立索引後，SHOW CREATE TABLE 會顯示 `KEY SNAME (NAME)`。試加上 `ALTER TABLE STUDENT DROP INDEX SNAME;` 再看一次。"},{"table":{"head":["","檢視（VIEW）","索引（INDEX）"],"rows":[["作用","簡化經常重用的 SQL 語句","加快搜尋（對分檢索）"],["儲存數據？","不儲存，只參照數據表","儲存已排序的索引表"],["數據改動時","結果自動改變","DBMS 要更新索引表（需時）"],["創建","CREATE VIEW … AS SELECT …","CREATE INDEX … ON 表 (欄)"],["刪除","DROP VIEW …","ALTER TABLE … DROP INDEX …"]]},"cap":"檢視與索引的比較（p.182、p.195）"}],"tries":[],"practice":[{"id":"a3d-s5-p1","type":"mc","pts":1,"src":"教科書 p.185","q":"要為數據表 EMPLOYEE 的欄位 ENAME 建立名為 ENAMEIDX 的索引。以下哪一句正確？","options":["CREATE INDEX ENAMEIDX ON EMPLOYEE (ENAME)","CREATE INDEX EMPLOYEE ON ENAMEIDX (ENAME)","CREATE INDEX ENAME ON EMPLOYEE (ENAMEIDX)","ALTER TABLE EMPLOYEE CREATE INDEX (ENAME)"],"answer":0,"hint":"CREATE INDEX 索引名稱 ON 數據表名稱 (欄位)。"},{"id":"a3d-s5-p2","type":"mc","pts":1,"src":"教科書 p.184–185","q":"以下哪一項**不是**建立索引的代價？","options":["索引表佔用額外的儲存空間","加入新記錄時要更新索引表，需時","修改索引欄位的數據時要更新索引表","以索引欄位搜尋時要逐行檢查所有記錄"],"answer":3,"hint":"索引令搜尋可以用對分檢索，不用逐行檢查。"},{"id":"a3d-s5-p3","type":"fill","pts":1,"src":"教科書 p.183–184（1024 項的答案已更正，見單元檔頭）","q":"用索引表進行對分檢索，最壞情況下要檢查多少次？","blanks":[{"label":"11 項記錄","a":"4"},{"label":"1024 項記錄","a":"11"}],"hint":"最多 ⌊log₂N⌋ + 1 次：log₂11 ≈ 3.46 → 4；log₂1024 = 10 → 11。"},{"id":"a3d-s5-p4","type":"mc","pts":1,"src":"教科書 p.185","q":"學校的 STUDENT 數據表經常以學生姓名 NAME 搜尋，很少以性別 SEX 搜尋。應為哪個欄位建立索引？","options":["只為 NAME","只為 SEX","NAME 和 SEX 都要","每個欄位都要，越多越快"],"answer":0,"hint":"索引要更新、佔空間，只應為經常搜尋的欄位建立。"},{"id":"a3d-s5-p5","type":"mc","pts":1,"src":"教科書 p.181–182","q":"檢視 SCORESHEET 參照了檢視 COUNTCLUB。執行 `DROP VIEW COUNTCLUB` 後會怎樣？","options":["SCORESHEET 失效","SCORESHEET 不受影響","SCORESHEET 也會被自動刪除，並刪除 SC 的數據","COUNTCLUB 的數據會搬到 SCORESHEET"],"answer":0,"hint":"檢視只參照其他數據表或檢視；被參照的檢視刪除了，它便無法運作。"}]},{"id":"write","kind":"write","title":"寫 SQL","pages":"教科書 p.166–190","intro":"在編輯器寫一句 SELECT 語句，可以先按 ▶ 執行自己檢查，再按「提交評核」。評核時會用另外幾組數據測試，所以不可以把答案「寫死」。","tasks":[{"id":"a3d-w1","pts":10,"title":"每個選手號碼的出現次數","src":"教科書 p.166–168 例題 3.4(a)","db":"sports","q":"列出兩個比賽項目中的所有選手號碼 BIB。如果一個號碼出現了兩次，結果中要列出兩次。號碼按遞升順序排列。","starter":"SELECT BIB FROM FOOTBALL ORDER BY BIB","ref":"SELECT BIB FROM FOOTBALL UNION ALL SELECT BIB FROM RELAYRACE ORDER BY BIB","check":{"order":true},"rules":[{"must":"UNION","msg":"要用集合運算符合併兩個數據表的結果。"}],"hint":"要保留重複的號碼：`UNION ALL`；`ORDER BY BIB` 放在整句最後。"},{"id":"a3d-w2","pts":12,"title":"未儲存於 BOOK 的書","src":"教科書 p.169 測試站 3.4(d)","db":"books","q":"由於人為錯誤，書店內部分書本的數據並未儲存於數據表 BOOK 中。列出這些書本的 ISBN（不重複）。","starter":"SELECT ISBN FROM HBS","ref":"SELECT ISBN FROM HBS UNION SELECT ISBN FROM WBS EXCEPT SELECT ISBN FROM BOOK","hint":"先把兩間書店的 ISBN 合併（UNION），再排除 BOOK 中的 ISBN（EXCEPT）；也可用 NOT IN 子查詢。"},{"id":"a3d-w3","pts":13,"title":"沒有同時參加兩個項目的參賽者","src":"教科書 p.166–168 例題 3.4(d)","db":"sports","q":"列出年齡至少 22 歲、而且**沒有同時參加**兩個比賽項目的參賽者之名字。（兩項都沒有參加的也要列出。）","starter":"SELECT NAME FROM PARTICIPANT WHERE AGE >= 22","ref":"SELECT NAME FROM PARTICIPANT WHERE AGE >= 22 AND ID NOT IN\n    (SELECT PID FROM FOOTBALL INTERSECT SELECT PID FROM RELAYRACE)","hint":"同時參加兩個項目的 PID = `SELECT PID FROM FOOTBALL INTERSECT SELECT PID FROM RELAYRACE`；把它放在 `ID NOT IN ( … )` 中。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.158–190","items":[{"id":"a3d-q1","pts":4,"src":"教科書 p.158–164","tags":[{"t":"hot","why":"DSE 卷二A 以 UNION／INTERSECT／EXCEPT（MINUS）合併兩個數據表的結果"}],"db":"union","verify":true,"ask":{"col":"SID"},"q":"以下語句輸出哪些 SID？","sql":"SELECT SID FROM S2 UNION SELECT SID FROM S3 EXCEPT SELECT SID FROM S1","options":["0, 3, 7, 6, 9","0, 3, 7","1, 8, 2","7"],"answer":"A","why":"由左至右：S2 ∪ S3 = {1, 8, 0, 3, 7, 2, 6, 9}；再減 S1 {4, 5, 8, 2, 1} = {0, 3, 7, 6, 9}。"},{"id":"a3d-q2","pts":4,"src":"教科書 p.163","tags":[{"t":"trap","why":"集合運算比較的是整行，所有選擇的欄位都要相同"}],"db":"union","verify":true,"ask":"rows","q":"以下語句的結果有多少行？","sql":"SELECT SID, NAME FROM STUDENT INTERSECT SELECT STUDENTID, NAME FROM STUDENT2","options":["0","1","4","7"],"answer":"A","why":"03517 在兩邊的名字是 Ben 和 Benz，整行不一致，所以 INTERSECT 沒有結果。"},{"id":"a3d-q3","pts":4,"src":"教科書 p.168 例題 3.4(b)","tags":[{"t":"hot","why":"DSE 卷二A 以 UNION／INTERSECT／EXCEPT（MINUS）合併兩個數據表的結果"}],"q":"以下哪一句可以列出至少在其中一個項目屬於 A 隊的參賽者識別碼？","options":["(SELECT PID FROM FOOTBALL UNION SELECT PID FROM RELAYRACE) WHERE TEAM = 'A'","SELECT PID FROM FOOTBALL WHERE TEAM = 'A' INTERSECT SELECT PID FROM RELAYRACE WHERE TEAM = 'A'","SELECT PID FROM FOOTBALL WHERE TEAM = 'A' UNION SELECT PID FROM RELAYRACE WHERE TEAM = 'A'","SELECT PID FROM FOOTBALL WHERE TEAM = 'A' UNION SELECT PID FROM RELAYRACE"],"answer":"C","why":"A：WHERE 不可以被兩個 SELECT 共用。B：INTERSECT 是兩個項目都屬於 A 隊。D：第二個 SELECT 沒有篩選隊伍。"},{"id":"a3d-q4","pts":4,"src":"教科書 p.175–182","q":"以下哪一項有關檢視（view）的描述是**錯誤**的？","options":["檢視就如虛擬的數據表，可以像數據表一樣用 SELECT 查詢","檢視可以參照其他檢視","數據表的數據更新後，要手動更新檢視","所參照的數據表被刪除後，檢視便會失效"],"answer":"C","why":"檢視不儲存數據，每次使用時才從數據表取得結果，所以會自動反映最新的數據。"},{"id":"a3d-q5","pts":4,"src":"教科書 p.187 例題 3.5(c)","db":"hospital","verify":true,"ask":{"cell":[1,"AVG(PNUM)"]},"q":"RPNUM 是例題 3.5(a) 的檢視（每間病房的病人人數 PNUM；B02 沒有病人）。以下語句的結果是什麼？","sql":"CREATE VIEW RPNUM AS\n  SELECT r.ID, RNAME, CAPACITY, COUNT(p.ID) AS PNUM FROM ROOM r\n  LEFT JOIN PATIENT p ON r.ID = RID GROUP BY r.ID;\nSELECT AVG(PNUM) FROM RPNUM WHERE RNAME \u003c> 'B01'","options":["1.33333333333","2","1.75","2.33333333333"],"answer":"A","why":"A01 有 2 人、A02 有 2 人、B02 有 0 人（排除 B01）：(2 + 2 + 0) ÷ 3 ≈ 1.33。若用 COUNT(*)，B02 會變成 1，平均便是 1.67。"}]},{"id":"more","kind":"endless","title":"無限練習","gens":["sqlSet","sqlSub"],"intro":"隨機生成 UNION／INTERSECT／EXCEPT 及子查詢題目，答案由 SQL 引擎計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]},{"id":"a4","title":"關聯式數據庫","book":"教科書 選修A 第 4 章 p.200–241","key":"A-a4-hmac-5863e7ae67","theory":false,"dbs":{"club":{"STUDENT":[["SID","NAME","SEX","CLASS","CID"],[["03493","Ada","F","3A",2],["03496","Clem","F","3B",1],["03505","Eva","F","3B",4],["03506","Gabe","M","3C",4],["03510","Finn","M","3B",1],["03513","Dio","M","3C",4],["03517","Ben","M","3A",null]],["SID"]],"CLUB":[["CID","NAME","ROOM","TEACH"],[[1,"Chess Club",501,"Mr Chan"],[2,"Art Club",402,"Mrs Lee"],[3,"English Club",203,"Mr Suen"],[4,"Science Club",502,"Mr Wong"]],["CID"]]},"keys":{"STUDE ","3C"],["03510","Finn","M","3B"],["03513","Dio","M","3C"],["03517","Ben","M","3A"],["03518","Guy","M","3D"]],["SID"]]},"roll":{"STUDENT":[["SID","NAME","SEX","CLASS"],[["03369","Hans","M","6A"],["03405","Ivy","F","6A"],["03410","Jean","F","6A"],["03493","Ada","F","5A"],["03496","Clem","F","5A"],["03505","Eva","F","5A"],["03506","Gabe","M","5A"],["03510","Finn","M","5A"],["03513","Dio","M","5A"],["03517","Ben","M","5A"]],["SID"]]},"audit":{"STUDENT":[["SID","NAME","SEX","CLASS","CNO","CID"],[["03493","Ada","F","3A",1,2],["03496","Clem","F","3B",15,1],["03505","Eva","F","3B",28,4],["03505","Gabe","M","3C",15,4],["03510","Finn","M","3B",7,5],["03513","Dio","M","3C",0,4],["03517","Ben","M","3A",9,null],["03518","Guy","X","3D",12,3],["03520","Ivy","F","3A",31,7],["03496","Jean","F","3B",3,1]]],"CLUB":[["CID","NAME","ROOM","TEACH"],[[1,"Chess Club",501,"Mr Chan"],[2,"Art Club",402,"Mrs Lee"],[3,"English Club",203,"Mr Suen"],[4,"Science Club",502,"Mr Wong"]],["CID"]]}},"sections":[{"id":"s1","title":"關聯式數據庫的元素","pages":"教科書 p.202–212","learn":[{"pts":["**關聯式數據庫**以**數據表**組織數據；數據表由欄和列組成，每一列是一項**記錄**。（p.202）","**實體**：一件實物（學生、產品）或一個概念（交易、課程），必須**獨一無二**。**實體類型**：一組擁有類似屬性的實體，例如「學生」。（p.203）","**屬性**：實體的特性，例如學生的姓名、性別。**衍生屬性**可由其他屬性計算出來，例如由出生日期計算年齡、由開店及關店時間計算營業時數。（p.204–205）","**關係**：實體之間的聯繫，用**動詞**表示，例如學生「加入」學會；在數據庫中以**外鍵碼**表示。（p.205–206）","**域**：屬性所有可能的值，同一個域的值有相同的數據類型，例如班號 `{1 .. 30}`、性別 `{'M', 'F'}`。（p.208）"]},{"table":{"head":["關聯式數據庫（表 4.1）","DBMS 中的表示"],"rows":[["實體類型","數據表"],["實體","記錄（一列，又稱元組）"],["屬性","欄位（一欄）"],["關係","外鍵碼"],["域","數據類型與限制"]]}},{"table":{"head":["數據類型（表 4.7）","關鍵字","例子"],"rows":[["整數","INT／INTEGER","0、283、-19"],["實數（浮點數／定點數）","FLOAT、DOUBLE／DECIMAL","569.1、-27.382"],["字符（固定／可變長度）","CHAR(n)／VARCHAR(n)","'1B 23'、'007=jb'"],["布爾","BOOL／BOOLEAN","0 (FALSE)、1 (TRUE)"],["日期與時間","DATE、TIME、DATETIME","'2025-12-31'、'11:30:00'"]]}},{"note":"以零開首的識別碼（例如學生編號 `03493`、六位數字 SID）要用**字符**，用整數會失去開首的 0；電話號碼 `3320-2310` 亦是字符。金額如 `30.9` 用**實數**。（p.210–211、p.219–220）"},{"sim":{"db":"club","sql":"SELECT S.NAME, C.NAME, C.ROOM\nFROM STUDENT S, CLUB C\nWHERE S.CID = C.CID"},"cap":"p.206：STUDENT 用外鍵碼 CID 參照 CLUB。按 ▶ 執行，看看每位學生加入了哪個學會。留意 Ben 的 CID 是 NULL。"}],"tries":[{"id":"a4-s1-t1","pts":4,"src":"教科書 p.206","db":"club","sql":"SELECT C.NAME\nFROM STUDENT S, CLUB C\nWHERE S.CID = C.CID AND S.NAME = 'Eva'","ask":{"cell":[1,"NAME"]},"q":"先估：Eva 加入了什麼學會？","options":["Science Club","Chess Club","Art Club","English Club"],"why":"Eva 的 CID 是 4，在 CLUB 中 CID 4 是 Science Club。"}],"practice":[{"id":"a4-s1-p1","type":"mc","pts":2,"src":"教科書 p.205 活動 4.1 第 2 題","q":"以下哪組「實體類型｜屬性 X｜屬性 Y」的搭配是**錯誤**的？","options":["書籍｜出版年份｜ISBN","貨品｜存貨數量｜價格","年齡｜患者｜性別","交易｜日期｜時間"],"answer":2,"hint":"實體類型是名詞，代表一組事物；屬性是它的特性。","why":"年齡是患者的屬性；患者才是實體類型。"},{"id":"a4-s1-p2","type":"mc","pts":2,"src":"教科書 p.207 活動 4.2 第 2 題","q":"以下哪組「實體類型 X｜實體類型 Y｜關係」的搭配是**正確**的？","options":["付款｜收款人｜Y 收到 X","作者｜書籍｜X 由 Y 撰寫","長度｜演唱會｜Y 佔用的時間為 X","僱員｜公司｜X 僱用 Y"],"answer":0,"hint":"小心主動語態和被動語態；屬性不是實體類型。","why":"作者撰寫書籍（不是由書籍撰寫）；長度是演唱會的屬性；公司僱用僱員。"},{"id":"a4-s1-p3","type":"mc","pts":1,"src":"教科書 p.209 活動 4.3 第 2 題","q":"以下哪組「屬性｜域」的搭配是**不合理**的？","options":["酒吧顧客的年齡｜不小於 18 的整數","員工職銜｜最多 60 字的字串","衣服尺碼｜{'XS', 'S', 'M', 'L', 'XL'}","一星期中的一天｜{'1970-01-01' .. '2099-12-31'} 之間的一個日期"],"answer":3,"hint":"「星期幾」只有七個可能的值。","why":"星期幾不是一個日期；域應是 {1 .. 7} 或星期一至日。"},{"id":"a4-s1-p4","type":"mc","pts":1,"src":"教科書 p.210–211 例題 4.1(c)","q":"學生識別碼 SID 是獨一無二的六位號碼，部分號碼開首為零。SID 應使用哪種數據類型？","options":["整數","字符","實數","布爾"],"answer":1,"hint":"把 012345 存為整數會變成什麼？","why":"整數會失去開首的 0，所以要用字符。"},{"id":"a4-s1-p5","type":"mc","pts":1,"src":"教科書 p.209（STUDENT.CID 的域是 {1, 2, 3, 4, NULL}）","db":"club","verify":true,"ask":"rows","sql":"SELECT DISTINCT CID FROM STUDENT","q":"以上 SQL 語句傳回多少行？","options":["3","4","5","7"],"answer":1,"hint":"DISTINCT 會去除重複的值；NULL 也算作一行。","why":"結果是 2、1、4、NULL 四行。CID 3 是合法的值（在域內），只是現時沒有學生用。"}]},{"id":"s2","title":"模式與關鍵欄位","pages":"教科書 p.212–222","learn":[{"pts":["**模式**描述數據表的欄位，例如 `STUDENT (SID, NAME, CLASS, CNO, EMAIL)`；**主關鍵碼加底線**。（p.212–213）","**候選鍵碼**：每項記錄都**獨一無二**、**不能是 NULL** 的欄位（或欄位組合），可用來識別記錄。（p.213–214）","**複合鍵**：包含多個欄位的候選鍵碼，例如 `CLASS+CNO`。複合鍵必須**最簡化**：刪除任何一個欄位都會出現重複值。`SID+EMAIL` 不是複合鍵，因為 SID 本身已是候選鍵碼。（p.215）","**主關鍵碼**：由數據庫管理員從候選鍵碼中選出；一個數據表可以有多個候選鍵碼，但**只有一個主關鍵碼**。應選不會改變的欄位：SID 比 CLASS+CNO（每年改變）和 EMAIL（可能更改）好。（p.216–217）","**外鍵碼**：表示兩個數據表的記錄之間的**關係**。主數據表的外鍵碼是**父數據表的主關鍵碼**；外鍵碼可以重複，亦可以是 NULL。一個數據表可以有多個外鍵碼。（p.217–218、p.238）"]},{"table":{"head":["","獨一無二","可以是 NULL","一個數據表有多少個"],"rows":[["候選鍵碼","✓","✗","一個或多個"],["主關鍵碼","✓","✗","只有一個"],["外鍵碼","✗（可以重複）","✓","零個或多個"]]}},{"note":"NULL 不等於 0：0 是一個數值（錢罌裏有 0 元），NULL 是「沒有數據」（根本沒有錢罌），沒有數據類型。（p.214）"},{"sim":{"db":"keys","sql":"SELECT CLASS, CNO, COUNT(*)\nFROM STUDENT\nGROUP BY CLASS, CNO\nHAVING COUNT(*) > 1"},"cap":"檢查 CLASS+CNO 在現有數據中有沒有重複：結果沒有記錄，代表沒有重複。試把 GROUP BY 和 SELECT 改為只用 CNO 或只用 CLASS。"},{"warn":"現有數據沒有重複，不代表該欄位一定是候選鍵碼：NAME 現時沒有重複值，但學校裏可能有同名的學生，所以 NAME 不是候選鍵碼。（p.214 試想想）"},{"pts":["把學生和學會的數據存於同一數據表 STUDENTCLUB：Science Club 換老師便要更新三項記錄，否則數據不一致；Art Club 唯一的學生 Ada 退學，Art Club 的數據便會消失。（p.218）","使用外鍵碼：學會的資料只存於 CLUB 一次，更新只需改一項記錄；刪除學生也不會令學會資料丟失。（p.218）"]},{"sim":{"db":"sc","sql":"UPDATE STUDENTCLUB SET CTEACH = 'Mr Suen'\nWHERE CNAME = 'Science Club'"},"cap":"p.218：Science Club 的老師由 Mr Wong 改為 Mr Suen。執行後看看有多少項記錄被更改（亮起）。"}],"tries":[{"id":"a4-s2-t1","pts":4,"src":"教科書 p.215","db":"keys","ask":"rows","sql":"SELECT CNO, COUNT(*)\nFROM STUDENT\nGROUP BY CNO\nHAVING COUNT(*) > 1","q":"先估：結果有多少行？","options":["0","1","2","7"],"why":"只有 CNO 15 出現兩次（Clem 和 Gabe），所以 CNO 單獨不能成為候選鍵碼，要與 CLASS 組成複合鍵。"}],"practice":[{"id":"a4-s2-p1","type":"mc","pts":2,"src":"教科書 p.216 活動 4.4 第 2 題","q":"以下哪組「實體類型｜候選鍵碼」的搭配是正確的？","options":["水費繳費戶口｜居家電話號碼","電腦軟件｜軟件名稱","電腦型號｜型號 + 價格","課堂｜開始時間 + 結束時間"],"answer":0,"hint":"候選鍵碼要獨一無二，而且最簡化。","why":"不同軟件可以同名；「型號 + 價格」不是最簡化；不同課堂可以在同一時間進行。（按教科書答案：一個住址只有一個水費戶口。）"},{"id":"a4-s2-p2","type":"mc","pts":1,"src":"教科書 p.215","q":"在 STUDENT (SID, NAME, CLASS, CNO, EMAIL) 中，為什麼 SID+EMAIL **不是**複合鍵？","options":["EMAIL 可能是 NULL","SID 本身已是候選鍵碼，刪除 EMAIL 也不會出現重複值，所以不是最簡化","複合鍵只可以由兩個整數欄位組成","SID 和 EMAIL 的數據類型不同"],"answer":1,"hint":"複合鍵必須最簡化。","why":"刪除 EMAIL 後 SID 仍獨一無二，所以 SID+EMAIL 不是最簡化。"},{"id":"a4-s2-p3","type":"mc","pts":2,"src":"教科書 p.220–221 例題 4.2(c)","tags":[{"t":"hot","why":"寫出模式、主關鍵碼及外鍵碼：DSE 卷二A 長題目幾乎每年都考（例如 2012 2A Q1、2014 2A Q2）。"}],"q":"GAME (ID, NAME, PNAME, GID, WEBSITE, PHONE, PRICE) 中，與發行商有關的欄位改為存於新數據表 PUBLISHER，並以發行商識別碼 PID 作 GAME 的外鍵碼。改動後 GAME 的模式及外鍵碼是什麼？（主關鍵碼均為 ID）","options":["GAME (ID, NAME, PID, GID, PRICE)；外鍵碼：GID","GAME (ID, NAME, PNAME, PID, GID, PRICE)；外鍵碼：PID, GID","GAME (ID, NAME, PID, GID, PRICE)；外鍵碼：PID, GID","GAME (ID, NAME, PID, WEBSITE, PHONE, PRICE)；外鍵碼：PID"],"answer":2,"hint":"與發行商有關的是 PNAME、WEBSITE、PHONE；GID 仍參照 GENRE。","why":"PNAME、WEBSITE、PHONE 移到 PUBLISHER (ID, NAME, WEBSITE, PHONE)；GAME 有兩個外鍵碼 PID 和 GID。"},{"id":"a4-s2-p4","type":"fill","pts":1,"src":"教科書 p.218","db":"sc","sql":"UPDATE STUDENTCLUB SET CTEACH = 'Mr Suen' WHERE CNAME = 'Science Club';\nSELECT COUNT(*) FROM STUDENTCLUB WHERE CTEACH = 'Mr Suen'","q":"Science Club 換老師後，STUDENTCLUB 有多少項記錄的 CTEACH 是 Mr Suen？（即是要更新多少項記錄）","blanks":[{"label":"記錄數目","ask":{"cell":[1,"COUNT(*)"]}}],"hint":"數數有多少位學生加入了 Science Club。"},{"id":"a4-s2-p5","type":"mc","pts":1,"src":"教科書 p.218","db":"sc","verify":true,"ask":{"cell":[1,"COUNT(*)"]},"sql":"DELETE FROM STUDENTCLUB WHERE NAME = 'Ada';\nSELECT COUNT(*) FROM STUDENTCLUB WHERE CNAME = 'Art Club'","q":"Ada 退學，她的記錄被刪除。之後還可以在 STUDENTCLUB 找到多少項有 Art Club 資料的記錄？","options":["0","1","2","3"],"answer":0,"hint":"有多少位學生加入了 Art Club？","why":"Ada 是 Art Club 唯一的學生，刪除她之後 Art Club 的房間和老師資料都消失了。"}]},{"id":"s3","title":"完整性","pages":"教科書 p.225–233","learn":[{"table":{"head":["完整性（表 4.17）","重點","違反的例子"],"rows":[["實體完整性","主關鍵碼是否存在及有效","沒有主關鍵碼；主關鍵碼有重複值或 NULL"],["參照完整性","外鍵碼是否有效","外鍵碼的值不存在於父數據表的主關鍵碼（NULL 除外）"],["域完整性","屬性的數據類型與限制","班號為 -6、關店時間為 20:90、班別為 1E"]]}},{"code":"ALTER TABLE STUDENT ADD PRIMARY KEY (SID)\n\nALTER TABLE STUDENT ADD FOREIGN KEY (CID) REFERENCES CLUB(CID)","cap":"p.225–226：定義主關鍵碼和外鍵碼後，DBMS 便會阻止違反實體完整性和參照完整性的操作。"},{"pts":["定義外鍵碼後，**不能**：插入或更新 STUDENT 令 CID 不存在於 CLUB；刪除 CLUB 中被參照的記錄；更新 CLUB 中被參照的 CID。（p.227 圖 4.6–4.9）","外鍵碼**可以是 NULL**（Ben 沒有加入學會），這不違反參照完整性。（p.226）"]},{"code":"CREATE TABLE STUDENT (\n    SID CHAR(5) PRIMARY KEY,\n    NAME VARCHAR(40),\n    SEX CHAR(1),\n    CLASS CHAR(2),\n    CNO INT,\n    CHECK (LENGTH(SID) = 5),\n    CHECK (SEX IN ('M', 'F')),\n    CHECK (CLASS IN ('1A', '1B', '1C', '1D')),\n    CHECK (CNO BETWEEN 1 AND 30)\n)","cap":"p.229：用數據類型與 CHECK 限制定義域，DBMS 便會拒絕不在域內的值（例如 CNO 為 'One' 或 -6）。"},{"sim":{"db":"club","sql":"ALTER TABLE STUDENT ADD FOREIGN KEY (CID) REFERENCES CLUB(CID);\nINSERT INTO STUDENT VALUES ('03520', 'Kit', 'M', '3C', 3)"},"cap":"先定義外鍵碼，再插入一位 CID 為 3 的學生：成功。試把 3 改為 5——DBMS 會拒絕（圖 4.6）；NULL 則可以。再試 `DELETE FROM CLUB WHERE CID = 4`（圖 4.8）。"},{"note":"如果數據表**沒有**定義限制（例如由舊系統匯入的數據），錯誤的數據便可能已經存在。這時可用 **SELECT 查出違反完整性的記錄**：重複的主關鍵碼用 `GROUP BY … HAVING COUNT(*) > 1`；無效的外鍵碼用 `NOT IN (SELECT 主關鍵碼 FROM 父數據表)`；超出域的值用 `NOT BETWEEN`、`NOT IN (…)`。"},{"sim":{"db":"seat","sql":"SELECT SNAME, CID\nFROM STUDENT\nWHERE CID NOT IN (SELECT CID FROM CLUB)"},"cap":"p.231 活動 4.6 第 2 題：找出外鍵碼 CID 無效的學生。再試把條件改為 `SROW NOT IN ('1', '2', '3', '4', '5')`，找出座位列號不在域 {1 .. 5} 內的記錄。"},{"warn":"`CID NOT IN (子查詢)` 不會選出 CID 為 NULL 的記錄（NULL 與任何值比較的結果都是 NULL）。這正好符合參照完整性：外鍵碼可以是 NULL。"},{"table":{"head":["CLASS","CLASSNO","GENDER","SNAME"],"rows":[["6A","13","F","Mary Leung"],["6A","22","M","Ben Kwok"],["6B","37","M","Gary Wu"],["6B","4","M","Ken Cheung"],["6A","15","F","Mary Leung"],["6A","22","F","Yen Koo"],["6B","13","F","Lois Law"]]}},{"sim":{"db":"act46","sql":"SELECT CLASS, CLASSNO, COUNT(*)\nFROM STUDENT\nGROUP BY CLASS, CLASSNO\nHAVING COUNT(*) > 1"},"cap":"p.230 活動 4.6 第 1 題（上表）：連 CLASS+CLASSNO 也有重複（6A, 22），所以這個數據表找不到可用的主關鍵碼。"}],"tries":[{"id":"a4-s3-t1","pts":4,"src":"教科書 p.231 活動 4.6 第 2 題","db":"seat","ask":{"col":"SNAME"},"sql":"SELECT SNAME\nFROM STUDENT\nWHERE CID NOT IN (SELECT CID FROM CLUB)","q":"先估：結果是什麼？","options":["Linda Wong","John Chau","John Chau, Linda Wong","（沒有記錄）"],"why":"Linda Wong 的 CID 是 3169，CLUB 只有 1558、3196、4453、4700，所以違反參照完整性。John Chau 的問題是 SROW 為 S（域完整性），CID 4453 是有效的。"},{"id":"a4-s3-t2","pts":4,"src":"教科書 p.227 圖 4.8","db":"club","ask":{"cell":[1,"COUNT(*)"]},"sql":"DELETE FROM CLUB WHERE CID = 4;\nSELECT COUNT(*)\nFROM STUDENT\nWHERE CID NOT IN (SELECT CID FROM CLUB)","q":"先估：假如 DBMS 沒有阻止這個刪除，之後有多少位學生的 CID 變成無效？","options":["0","1","3","4"],"why":"Eva、Gabe、Dio 的 CID 都是 4。刪除 Science Club 後，他們的外鍵碼參照不存在的記錄；Ben 的 CID 是 NULL，不計算在內。所以 DBMS 會阻止這個刪除。"}],"practice":[{"id":"a4-s3-p1","type":"mc","pts":1,"src":"教科書 p.230 活動 4.6 第 1 題","tags":[{"t":"hot","why":"指出違反哪種完整性並解釋：參考 DSE 2012 2A Q1、Q4（教科書課題練習 1、2）。"}],"q":"上面「活動 4.6 第 1 題」的數據表最有可能違反哪項／些完整性？\n(1) 實體完整性\n(2) 參照完整性\n(3) 域完整性","options":["只有 (1)","只有 (2)","只有 (1) 和 (3)","只有 (2) 和 (3)"],"answer":0,"hint":"每個欄位（甚至 CLASS+CLASSNO）都有重複值。","why":"找不到不重複的欄位或欄位組合作主關鍵碼，所以違反實體完整性；其他值看來都合理。"},{"id":"a4-s3-p5","type":"mc","pts":1,"src":"教科書 p.227 圖 4.9","db":"club","verify":true,"ask":"error","sql":"ALTER TABLE STUDENT ADD FOREIGN KEY (CID) REFERENCES CLUB(CID);\nUPDATE CLUB SET CID = 5 WHERE CID = 1","q":"執行以上兩句 SQL，第二句的結果是什麼？","options":["沒有錯誤","違反主關鍵碼限制","違反外鍵碼限制","違反 CHECK 限制"],"answer":2,"hint":"Clem 和 Finn 的 CID 是 1。","why":"父數據表中被參照的主關鍵碼不可以更改，否則 Clem 和 Finn 便參照一個不存在的學會。"},{"id":"a4-s3-p2","type":"mc","pts":2,"src":"教科書 p.231 活動 4.6 第 2 題","tags":[{"t":"hot","why":"指出違反哪種完整性並解釋：參考 DSE 2012 2A Q1、Q4（教科書課題練習 1、2）。"}],"q":"活動 4.6 第 2 題的 STUDENT (SCLN, SROW, SNAME, SEX, CID) 及 CLUB（見模擬器）最有可能違反哪項／些完整性？（SCLN、SROW 是座位的欄號和列號，由 1 至 5）\n(1) 實體完整性\n(2) 參照完整性\n(3) 域完整性","options":["只有 (1)","只有 (2)","只有 (1) 和 (3)","只有 (2) 和 (3)"],"answer":3,"hint":"SCLN+SROW 可以作主關鍵碼。","why":"CID 3169 不存在於 CLUB（參照完整性）；SROW 為 S 不在 {1 .. 5}（域完整性）；SCLN+SROW 沒有重複。"},{"id":"a4-s3-p3","type":"mc","pts":1,"src":"教科書 p.232 測試站 4.3(a)","db":"shop","verify":true,"ask":{"col":"SNAME"},"sql":"SELECT SNAME\nFROM SHOP\nWHERE SUBSTRING(CLOSE, 4, 2) > '59'","q":"以上 SQL 語句會選出哪間商店？","options":["McReynaulds","Submarine","Kenneth Fish & Chips","Sandwich Empress"],"answer":2,"hint":"SUBSTRING(CLOSE, 4, 2) 取出時間的「分鐘」兩位。","why":"20:90 的分鐘是 90，大於 59，是無效的時間。"},{"id":"a4-s3-p4","type":"mc","pts":1,"src":"教科書 p.232–233 測試站 4.3(a)、(d)","q":"關店時間 20:90 違反了哪種完整性？另外，如 SHOP 的主關鍵碼在 PRODUCT 中作外鍵碼，刪除 SHOP 的一項記錄後應怎樣做？","options":["域完整性；把該店舖出售的產品記錄一併刪除","參照完整性；把該店舖出售的產品記錄一併刪除","實體完整性；不用做任何事","域完整性；把 PRODUCT 的主關鍵碼改為 NULL"],"answer":0,"hint":"20:90 不在合理的時間範圍內。","why":"無效的值違反域完整性；刪除店舖後，PRODUCT 中參照它的記錄要一併處理，才能保持參照完整性。"}]},{"id":"s4","title":"索引與回滾","pages":"教科書 p.223–224、p.233–236","learn":[{"pts":["經常被搜尋的欄位可以建立**索引**，加快檢索。索引表只有**索引欄位**和**指向記錄的指針**，並已**排序**，所以 DBMS 可以進行**二分檢索**。（p.223）","11 項記錄的索引表，最多 4 次搜尋便找到任何一項記錄（即使 Guy 是最後一位）。n 項記錄最多約需 ⌈log₂(n+1)⌉ 次。（p.223–224）","缺點：數據更新或新增記錄時，DBMS 要同時更新索引表（需時）；索引表亦佔用儲存空間。所以**只為經常搜尋的欄位**建立索引。（p.223、p.238）"]},{"sim":{"db":"idx","sql":"SELECT NAME, SID\nFROM STUDENT\nORDER BY NAME"},"cap":"p.223：數據表按 SID 排列；以 NAME 建立的索引表就像這個結果——按 NAME 排序，並記下 SID（指針）。"},{"pts":["**回滾**：把數據庫復原至先前的狀態。管理數據庫時可能出錯而損害數據完整性，所以要**定期備份**，以便回滾。（p.233）","例子：老師想刪除 6A 學生，再把 5A 升為 6A，卻把次序倒轉——先升班再刪除，結果所有學生都被刪除。（p.233）"]},{"sim":{"db":"roll","sql":"UPDATE STUDENT SET CLASS = '6A' WHERE CLASS = '5A';\nDELETE FROM STUDENT WHERE CLASS = '6A';\nSELECT * FROM STUDENT"},"cap":"執行這兩句（次序錯了），再按「重設數據」，然後把兩句的次序對調再執行。"},{"code":"mysqldump -u root -p SCHOOL > school.sql\n\nmysql -u root -p -h localhost SCHOOL \u003c school.sql","cap":"實驗站 4.1（p.234–235）：第一行把數據庫 SCHOOL **匯出（備份）**為 SQL 檔案（內有 CREATE TABLE、INSERT INTO 語句）；第二行把檔案**匯入**，回滾數據庫。在命令提示字元輸入。"}],"tries":[{"id":"a4-s4-t1","pts":4,"src":"教科書 p.233","db":"roll","ask":{"cell":[1,"COUNT(*)"]},"sql":"UPDATE STUDENT SET CLASS = '6A' WHERE CLASS = '5A';\nDELETE FROM STUDENT WHERE CLASS = '6A';\nSELECT COUNT(*) FROM STUDENT","q":"先估：老師把兩句的次序倒轉了。最後 STUDENT 有多少項記錄？","options":["0","3","7","10"],"why":"先把 7 位 5A 學生改為 6A，於是 10 位學生全是 6A，再全部刪除，留下空表。正確次序（先刪除再升班）會剩下 7 項記錄。"}],"practice":[{"id":"a4-s4-p1","type":"fill","pts":2,"src":"教科書 p.224 活動 4.5 第 1、2 題","q":"活動 4.5 的索引表有 15 本書（按書名排序）。用二分檢索：\n(1) 找出 Three Little Pigs（第 14 項）需要搜尋多少次？\n(2) 最壞情況下需要搜尋多少次？","blanks":[{"label":"(1) 次數","a":"3","accept":["3次","3 次"]},{"label":"(2) 次數","a":"4","accept":["4次","4 次"]}],"hint":"第 1 次比較第 8 項；第 2 次比較第 12 項；第 3 次比較第 14 項。15 項 = 2⁴ − 1。"},{"id":"a4-s4-p2","type":"mc","pts":1,"src":"教科書 p.224 活動 4.5 第 3 題（挑戰）","q":"若索引表有 1000 本書，最壞情況下二分檢索需要搜尋多少次？","options":["9","10","500","1000"],"answer":1,"hint":"log₂1000 ≈ 9.97。","why":"2⁹ = 512 \u003c 1000 ≤ 1023 = 2¹⁰ − 1，所以最壞情況是 10 次。"},{"id":"a4-s4-p3","type":"mc","pts":1,"src":"教科書 p.236 測試站 4.4(a)","tags":[{"t":"hot","why":"寫出模式、主關鍵碼及外鍵碼：DSE 卷二A 長題目幾乎每年都考（例如 2012 2A Q1、2014 2A Q2）。"}],"q":"PAYMENT (TID, PAYERID, PAYEEID, AMOUNT, TTIME) 記錄付款；PAYERID、PAYEEID 是付款人及收款人在 ACCOUNT (AID, UNAME, DEPOSIT) 的帳戶識別碼。PAYMENT 的外鍵碼是什麼？","options":["TID","PAYERID","PAYERID, PAYEEID","TID, PAYERID, PAYEEID"],"answer":2,"hint":"一個數據表可以有多個外鍵碼。","why":"PAYERID 和 PAYEEID 都參照 ACCOUNT 的主關鍵碼 AID；TID 是主關鍵碼。"},{"id":"a4-s4-p4","type":"mc","pts":1,"src":"教科書 p.236 測試站 4.4(c)","q":"程式更新 10,000 筆付款時中途出錯而中止，不知停在哪裏。數據庫管理員應怎樣做？","options":["重新執行整個程式一次","把數據庫回滾至執行前的狀態（使用備份）","刪除 PAYMENT 的所有記錄","為 ACCOUNT 建立索引"],"answer":1,"hint":"有些付款可能只完成了一半。","why":"可能付款人已扣款但收款人未加款；回滾後才可以安全地重新處理。"}]},{"id":"write","kind":"write","title":"寫 SQL：數據審核","pages":"教科書 p.225–229","intro":"數據庫 `audit` 的 STUDENT (SID, NAME, SEX, CLASS, CNO, CID) 沒有設定任何限制，混入了一些錯誤的記錄。CLUB (CID, NAME, ROOM, TEACH) 的主關鍵碼是 CID。請寫 SQL 把問題找出來。系統會再用另外的數據檢查你的語句，所以不要只寫出現時看到的值。","tasks":[{"id":"a4-w1","pts":10,"title":"參照完整性：無效的學會","src":"教科書 p.226–228","db":"audit","q":"STUDENT.CID 是參照 CLUB.CID 的外鍵碼。列出 CID **不存在於 CLUB** 的學生的 NAME。CID 為 NULL 的學生沒有違反參照完整性，**不要**列出。","starter":"SELECT NAME\nFROM STUDENT","ref":"SELECT NAME\nFROM STUDENT\nWHERE CID NOT IN (SELECT CID FROM CLUB)","hint":"用子查詢 `SELECT CID FROM CLUB` 取得所有有效的 CID，再用 NOT IN。"},{"id":"a4-w2","pts":12,"title":"實體完整性：重複的主關鍵碼","src":"教科書 p.225–226","db":"audit","q":"SID 應該是 STUDENT 的主關鍵碼，但有些 SID 出現了多於一次。列出這些**重複的 SID**（每個 SID 只列一次）。","starter":"SELECT SID\nFROM STUDENT","ref":"SELECT SID\nFROM STUDENT\nGROUP BY SID\nHAVING COUNT(*) > 1","hint":"按 SID 分組，再用 HAVING 選出記錄數目大於 1 的組。"},{"id":"a4-w3","pts":13,"title":"域完整性：超出域的值","src":"教科書 p.228–229","db":"audit","q":"CNO 的域是 {1 .. 30}，SEX 的域是 {'M', 'F'}。列出 CNO **或** SEX 不在域內的學生的 NAME。","starter":"SELECT NAME\nFROM STUDENT\nWHERE CNO > 30","ref":"SELECT NAME\nFROM STUDENT\nWHERE CNO NOT BETWEEN 1 AND 30 OR SEX NOT IN ('M', 'F')","hint":"兩個條件用 OR 連接：`CNO NOT BETWEEN 1 AND 30`、`SEX NOT IN ('M', 'F')`。別忘了小於 1 的班號。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.237–241","items":[{"id":"a4-q1","pts":4,"src":"教科書 p.238–239 課題練習 1(a)（參考 DSE 2012 2A Q4）","tags":[{"t":"hot","why":"指出違反哪種完整性並解釋：參考 DSE 2012 2A Q1、Q4（教科書課題練習 1、2）。"}],"q":"員工在網上訂餐表格提交的數據存於 MEALORDER (ENAME, AGE, APPETISER, MAINCOURSE, NEEDCUTLERY)。同事指出 MEALORDER 違反了某種完整性。最合理的解釋是：","options":["參照完整性：APPETISER 不是外鍵碼","實體完整性：沒有一個欄位可作主關鍵碼（員工可能同名）","域完整性：AGE 可能是 NULL","實體完整性：ENAME 是字符，不可作主關鍵碼"],"answer":"B","why":"數據表必須有主關鍵碼；同名員工會令 ENAME 重複。可加入員工編號（例如 EID）作主關鍵碼。"},{"id":"a4-q2","pts":4,"src":"教科書 p.239–240 課題練習 2(c)（參考 DSE 2012 2A Q1）","tags":[{"t":"hot","why":"指出違反哪種完整性並解釋：參考 DSE 2012 2A Q1、Q4（教科書課題練習 1、2）。"}],"q":"PLAYER 的 TID 參照 TEAM 的主關鍵碼 TID。主辦人把某退出隊伍的記錄從 TEAM 刪去，但沒有其他行動。這可能違反哪種完整性？應怎樣解決？","options":["實體完整性；把該隊伍的 TID 改為 NULL","域完整性；把 TEAM 的 TID 改為字串","參照完整性；把 PLAYER 中屬於該隊伍的記錄刪除（或更新其 TID）","參照完整性；在 TEAM 中為 TID 建立索引"],"answer":"C","why":"PLAYER 仍有記錄的 TID 參照已不存在的隊伍。"},{"id":"a4-q3","pts":4,"src":"教科書 p.240 課題練習 2(d)、(e)","q":"球員位置只可以是 Goalkeeper、Defender、Midfielder、Forward。某記錄的 POS 是 'Attacker'。以下哪項正確？","options":["違反域完整性；可建立 POSITION (POS, POSTYPE) 數據表，以整數 POS 作外鍵碼，減少輸入錯誤及儲存空間","違反參照完整性；應刪除 POS 欄","違反實體完整性；應以 POS 作主關鍵碼","沒有違反任何完整性，因為 POS 是字串"],"answer":"A","why":"'Attacker' 不在 POS 的域內。改用 POSITION 表後，PLAYER 只存 0–3 的整數（例如 2 = Midfielder），佔用空間較少，亦可由外鍵碼限制數值。"},{"id":"a4-q4","pts":4,"src":"教科書 p.241 課題練習 3(e)（參考 DSE 2014 2A Q2）","q":"網站讓用戶按電影名稱、演員姓名或發行年份搜尋。為什麼**不應**為數據表的所有欄位都建立索引？","options":["索引會令 SELECT 結果出錯","每次新增或更新記錄都要更新所有索引表，需時較長；索引表亦佔用儲存空間","一個數據表只可以有一個索引","建立索引後便不可以再插入記錄"],"answer":"B","why":"應只為經常搜尋的欄位（FNAME、ANAME、FYEAR）建立索引。"},{"id":"a4-q5","pts":4,"src":"自擬（DSE 卷二A 子查詢與 NULL）","tags":[{"t":"trap","why":"NOT IN 遇上 NULL：外鍵碼為 NULL 的記錄不會被選出。"}],"db":"club","verify":true,"ask":{"cell":[1,"COUNT(*)"]},"sql":"INSERT INTO STUDENT VALUES ('03520', 'Kit', 'M', '3C', 5);\nSELECT COUNT(*)\nFROM STUDENT\nWHERE CID NOT IN (SELECT CID FROM CLUB)","q":"在學生與學會數據庫（Ben 的 CID 是 NULL）執行以上語句，最後的結果是什麼？","options":["0","1","2","8"],"answer":"B","why":"只有 Kit 的 CID 5 不存在於 CLUB。Ben 的 CID 是 NULL，`NULL NOT IN (…)` 的結果是 NULL，不會被計算。"}]},{"id":"more","kind":"endless","title":"無限練習","gens":["sqlSub","sqlJoin","sqlAgg"],"intro":"隨機生成子查詢、連接及分組題目（檢查外鍵碼、找出重複值都會用到），答案由模擬器計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]},{"id":"a5a","title":"實體關係圖","book":"教科書 選修A 第 5 章 p.242–276","key":"A-a5a-hmac-412ffdeba1","theory":false,"dbs":{"sch":{"SCHOOL":[["SID","SNAME","DISTRICT","PID"],[[148,"AA Academy","Tuen Mun",11],[156,"BB School","Shatin",12],[176,"CC College","Central",13]],["SID"]],"PRINCIPAL":[["PID","PNAME","TENURE"],[[11,"Tenn",5],[12,"Shani",4],[13,"Ceana",2]],["PID"]]},"tc":{"TEACHER":[["TID","TNAME","SEX","TENURE","CID"],[[143,"Adam","M",5,2],[146,"Carl","M",9,1],[161,"Ella","F",4,null],[163,"Dora","F",6,3],[167,"Bea","F",1,null]],["TID"]],"CLASS":[["CID","CNAME","ROOM"],[[1,"3A",501],[2,"3B",402],[3,"3C",203]],["CID"]]},"cs":{"STUDENT":[["SID","NAME","SEX","CID"],[["03493","Ada","F",1],["03496","Clem","F",2],["03505","Eva","F",2],["03506","Gabe","M",3],["03510","Finn","M",2]],["SID"]],"CLASS":[["CID","CNAME","ROOM"],[[1,"3A",501],[2,"3B",402],[3,"3C",203]],["CID"]]},"crime":{"CITIZEN":[["CID","NAME","SEX"],[["03493","Ada","F"],["03496","Clem","F"],["03505","Dio","M"],["03506","Gabe","M"],["03510","Finn","M"]],["CID"]],"CRIMINALRECORD":[["RID","CRIME","DATE","CID"],[[1,"DUI","2025-01-25","03505"],[2,"Fraud","2025-02-15","03510"],[3,"Arson","2025-05-12","03493"],[4,"Theft","2025-12-05","03510"]],["RID"]]},"elect":{"STUDENT":[["SID","NAME","SEX"],[["03493","Ada","F"],["03496","Clem","F"],["03505","Eva","F"],["03506","Gabe","M"],["03510","Finn","M"]],["SID"]],"ENROLMENT":[["SID","EID"],[["03493",11],["03496",1],["03496",11],["03496",12],["03505",1],["03506",11],["03506",12],["03510",12]],["SID","EID"]],"ELECTIVE":[["EID","ENAME","ROOM"],[[1,"History",602],[11,"Physics",503],[12,"ICT",304]],["EID"]]},"m1":{"STUDENT":[["SID","NAME","SEX","EIDLIST"],[["03493","Ada","F","11"],["03496","Clem","F","1,11,12"],["03505","Eva","F","1"],["03506","Gabe","M","11,12"],["03510","Finn","M","12"]],["SID"]],"ELECTIVE":[["EID","ENAME","ROOM"],[[1,"History",602],[11,"Physics",503],[12,"ICT",304]],["EID"]]},"prop":{"CITIZEN":[["CID","NAME","SEX"],[["03493","Ada","F"],["03496","Clem","F"],["03505","Dio","M"],["03506","Gabe","M"],["03510","Finn","M"]],["CID"]],"OWNERSHIP":[["CID","PID"],[["03496",283],["03505",191],["03506",191],["03510",467],["03510",468]],["CID","PID"]],"PROPERTY":[["PID","PNAME","FLOOR","ROOM"],[[191,"GG Garden",6,"B"],[283,"CC City",5,"C"],[375,"EE Estate",3,"D"],[467,"W Villa",11,"F"],[468,"W Villa",8,"A"]],["PID"]]},"lib":{"STUDENT":[["SID","NAME","SEX"],[["03493","Ada","F"],["03496","Clem","F"],["03505","Eva","F"],["03506","Gabe","M"],["03510","Finn","M"]],["SID"]],"CHECKOUT":[["SID","CDATE","DDATE","RDATE","BID"],[["03510","2025-02-11","2025-02-25","2025-02-25",1],["03496","2025-02-15","2025-03-01","2025-02-20",2],["03496","2025-02-15","2025-03-01","2025-02-23",4],["03506","2025-02-21","2025-03-07","2025-03-10",2],["03496","2025-02-23","2025-03-09","2025-02-27",3],["03506","2025-02-25","2025-03-11","2025-03-10",1]]],"BOOK":[["BID","BNAME"],[[1,"Animal Farm"],[2,"Brave New World"],[3,"Catcher in Rye"],[4,"Dracula"]],["BID"]]}},"sections":[{"id":"s1","title":"實體關係圖的元素","pages":"教科書 p.244–249","learn":[{"pts":["**實體關係圖（ER 圖）**清楚表達數據庫的實體類型、關係和屬性，幫助我們決定數據表結構。（p.244）","圖形的**顏色不重要**，形狀才重要。（p.245）"]},{"table":{"head":["圖形（表 5.3）","元素","備註"],"rows":[["長方形","實體（實體類型）","通常是名詞，例如「學生」"],["菱形","關係","通常是動詞，例如「屬於」；關係亦可擁有屬性"],["橢圓形","屬性","主關鍵碼（主屬性）加**底線**"]]}},{"er":{"entities":[{"name":"學生","attrs":["*學生識別碼","學生姓名"]},{"name":"班別","attrs":["*班別名稱","班房房號"]}],"rels":[{"a":"學生","b":"班別","name":"屬於","card":"M:1","part":"||"}]},"cap":"圖 5.1（p.244）：每個學生**必須屬於一個**班別；每個班別**有一個或多個**學生。由此得出 STUDENT (SID, SNAME, CID) 和 CLASS (CID, CLASSNAME, ROOMNUM)。"},{"pts":["把屬性「班別」改為獨立的實體「班別」（有自己的屬性班房房號），學生的屬性便不再包括班別，而是用關係「屬於」連接。（p.247 例題 5.1(e)）","**外鍵碼不會畫成屬性**：它由**關係**表示。（p.264）","修改 ER 圖時，若某屬性（例如區域的「經理」）有自己的數據，便把它變成新的實體，並加上關係（「被……管理」）。（p.249 測試站 5.1(c)）"]},{"sim":{"db":"cs","sql":"SELECT S.NAME, C.CNAME, C.ROOM\nFROM STUDENT S, CLASS C\nWHERE S.CID = C.CID"},"cap":"「學生屬於班別」這個關係，在數據庫中由 STUDENT 的外鍵碼 CID 表示。"}],"tries":[{"id":"a5a-s1-t1","pts":4,"src":"教科書 p.258 表 5.9","db":"cs","ask":"rows","sql":"SELECT S.NAME\nFROM STUDENT S, CLASS C\nWHERE S.CID = C.CID AND C.CNAME = '3B'","q":"先估：結果有多少行？","options":["1","2","3","5"],"why":"Clem、Eva、Finn 的 CID 都是 2（3B）。一個班別有多個學生——這就是「多」的一面。"}],"practice":[{"id":"a5a-s1-p1","type":"mc","pts":2,"src":"教科書 p.245–247 例題 5.1(b)","q":"學校數據庫的 ER 圖中，「學生」經關係菱形 *p* 連接實體 *q*；*q* 的屬性是「香港身份證號碼」和「老師姓名」。*p* 和 *q* 最可能是什麼？","options":["*p*：參加；*q*：運動比賽項目","*p*：被……教導；*q*：老師","*p*：老師；*q*：被……教導","*p*：屬於；*q*：班別"],"answer":1,"hint":"菱形是動詞（關係），長方形是名詞（實體）。","why":"有「老師姓名」屬性的實體是老師；學生「被……教導」。"},{"id":"a5a-s1-p2","type":"mc","pts":2,"src":"教科書 p.246–247 例題 5.1(c)","q":"例題 5.1 的 ER 圖中，「學生」（班別、學生姓名、學生識別碼）、「老師」（香港身份證號碼、老師姓名）、「運動比賽項目」（比賽項目識別碼、比賽項目名稱、開始時間、結束時間）。哪三個屬性應加底線？","options":["學生姓名、老師姓名、比賽項目名稱","班別、香港身份證號碼、比賽開始時間","學生識別碼、香港身份證號碼、比賽項目識別碼","學生識別碼、老師姓名、比賽項目識別碼"],"answer":2,"hint":"底線＝主關鍵碼：要獨一無二。","why":"姓名可以相同；識別碼和身份證號碼獨一無二。"},{"id":"a5a-s1-p3","type":"mc","pts":1,"src":"教科書 p.248 測試站 5.1(a)–(b)","q":"動物園 ER 圖有實體「動物」（動物名字＿、重量、出生日期）、「區域」（區域名稱＿、所在地、經理）、「品種」（動物品種名稱＿、進食行為）；＿表示加底線。以下哪項正確？","options":["數據庫有兩個數據表：動物、品種","「動物」的主關鍵碼是出生日期","「居住於」是一個屬性","數據庫有三個數據表；「動物」的主關鍵碼是動物名字"],"answer":3,"hint":"每個長方形對應一個數據表。","why":"三個實體 → 三個數據表；加底線的動物名字是主關鍵碼。"},{"id":"a5a-s1-p4","type":"mc","pts":1,"src":"教科書 p.245 表 5.3","q":"在 ER 圖中，哪一項描述正確？","options":["菱形代表關係，關係亦可擁有屬性","橢圓形代表實體類型","主關鍵碼以紅色標示","外鍵碼要畫成一個橢圓形屬性"],"answer":0,"hint":"外鍵碼由關係表示。","why":"長方形＝實體類型；橢圓形＝屬性（主關鍵碼加底線）；顏色不重要。"}]},{"id":"s2","title":"參與限制","pages":"教科書 p.249–254","learn":[{"pts":["**參與限制**：實體類型中是否**每個**實體都參與該關係。每種關係有兩面，每面是**強制**或**非強制**。（p.249）","**記號放在線上靠近另一個實體的位置**：`學生 ──參加──┼ 運動比賽項目` 表示每個學生**必須**參加；`學生 ──參加──○ 運動比賽項目` 表示學生**可以參加或不參加**。（p.249 表 5.4）","「必須」「每個……都」「一定」→ 強制（┼）；「可能」「可以不」「部分」→ 非強制（○）。"]},{"table":{"head":["ER 圖（表 5.5）","意思"],"rows":[["學生 ┼──參加──┼ 項目","每個學生**必須**參加；每個項目**必須**有學生參加"],["學生 ○──參加──┼ 項目","每個學生**必須**參加；項目**可以**沒有學生參加"],["學生 ┼──參加──○ 項目","學生**可以**不參加；每個項目**必須**有學生參加"],["學生 ○──參加──○ 項目","兩面都**可以**不參加"]]}},{"er":{"entities":[{"name":"老師","attrs":[]},{"name":"班別","attrs":[]}],"rels":[{"a":"老師","b":"班別","name":"獲指派至","card":"1:1","part":"|o"}]},"cap":"圖 5.5、5.12（p.251、p.257）：靠近「班別」是 ○——老師**可以不是**班主任；靠近「老師」是 ┼——每個班別**必須**有班主任。"},{"sim":{"db":"tc","sql":"SELECT TNAME, CID\nFROM TEACHER"},"cap":"p.257：非強制的一面在數據中表現為 NULL——有兩位老師的 CID 是 NULL。"},{"note":"例題 5.2(d)（p.253–254）：16 個科目 × 3 個獎項 = 48 > 40 位學生，但學生**不一定**得獎（○ 靠近獎項）；每個科目有多於 3 位學生，所以每個獎項**一定**有得主（┼ 靠近學生）：`獎項 ○──頒發予──┼ 學生`。"}],"tries":[{"id":"a5a-s2-t1","pts":4,"src":"教科書 p.257","db":"tc","ask":{"col":"TNAME"},"sql":"SELECT TNAME\nFROM TEACHER\nWHERE CID IS NULL","q":"先估：結果是什麼？","options":["Ella, Bea","Adam, Carl, Dora","Ella","（沒有記錄）"],"why":"Ella 和 Bea 不是班主任。老師「獲指派至」班別是非強制的一面，所以外鍵碼可以是 NULL。"}],"practice":[{"id":"a5a-s2-p1","type":"mc","pts":2,"src":"教科書 p.252–253 例題 5.2(a)","tags":[{"t":"hot","why":"按情境加上參與限制及基數、繪畫或修改實體關係圖：DSE 卷二A 長題目常見（教科書例題 5.2–5.3、課題練習 2）。"}],"q":"課室裏有 40 部電腦和 25 個學生。每個學生都只獲分派一部電腦。以下哪個 ER 圖正確？","options":["電腦 ┼──獲分派予──┼ 學生","電腦 ┼──獲分派予──○ 學生","電腦 ○──獲分派予──┼ 學生","電腦 ○──獲分派予──○ 學生"],"answer":1,"hint":"有部分電腦沒有分派給學生。","why":"每個學生必須有電腦（┼ 靠近電腦）；電腦可以沒有學生使用（○ 靠近學生）。"},{"id":"a5a-s2-p2","type":"mc","pts":2,"src":"教科書 p.253–254 例題 5.2(c)、測試站 5.2(a)","q":"每個學生都屬於一個班別；每班有 20 至 30 個學生。以下哪個 ER 圖正確？","options":["學生 ○──屬於──○ 班別","學生 ○──屬於──┼ 班別","學生 ┼──屬於──○ 班別","學生 ┼──屬於──┼ 班別"],"answer":3,"hint":"兩面都有「每個」。","why":"每班至少有一個學生；每個學生必須屬於一個班別。兩面都是強制。"},{"id":"a5a-s2-p3","type":"mc","pts":2,"src":"教科書 p.254 測試站 5.2(c)","tags":[{"t":"hot","why":"按情境加上參與限制及基數、繪畫或修改實體關係圖：DSE 卷二A 長題目常見（教科書例題 5.2–5.3、課題練習 2）。"}],"q":"每桌客人皆僅由一個侍應負責；每個侍應必須負責至少一桌；客人離去後，侍應會被指派至另一桌。以下哪個 ER 圖正確？","options":["侍應 ┼──負責──┼ 桌","侍應 ○──負責──┼ 桌","侍應 ┼──負責──○ 桌","侍應 ○──負責──○ 桌"],"answer":1,"hint":"客人離去後，那張桌便沒有侍應負責。","why":"每個侍應必須負責桌（┼ 靠近桌）；桌可以沒有侍應（○ 靠近侍應）。"},{"id":"a5a-s2-p4","type":"mc","pts":1,"src":"教科書 p.254 測試站 5.2(b)","q":"每位病人都被分派至一間病房；每間病房最多容納 20 位病人。ER 圖 `病房 ┼──可容納──○ 病人` 中，靠近「病人」的 ○ 表示什麼？","options":["每位病人可以不住病房","病房可以沒有病人","每間病房最多一位病人","病人必須住多於一間病房"],"answer":1,"hint":"靠近 B 的記號描述每一個 A。","why":"○ 靠近病人：每間病房**可以**沒有病人；┼ 靠近病房：每位病人**必須**被分派病房。"}]},{"id":"s3","title":"基數：一對一與一對多","pages":"教科書 p.255–259","learn":[{"pts":["**基數**：一個實體與另一實體類型中**多少個**實體有關係。線上寫 **1**（最多一個）或 **M**（多個）。（p.255 表 5.6）","**一對一（1:1）**：每個 a 最多一個 b，反之亦然，例如學校與校長、汽車與車牌。若不打算儲存校長的其他數據，可把校長名字變成學校的屬性——犧牲靈活性和細節，換取簡單結構和更佳表現。（p.255–257）","**一對多（1:M）**：每個 a 可有多個 b，每個 b 最多一個 a，例如班別與學生、市民與犯罪記錄。互換位置便是**多對一（M:1）**。（p.257–259）","實現 1:M：在「多」的一方（STUDENT）放外鍵碼，參照「一」的一方（CLASS）的主關鍵碼。**不要**把兩者合併成一個數據表，否則會重複數據並引致異常。（p.258–259）"]},{"er":{"entities":[{"name":"班別","attrs":[]},{"name":"學生","attrs":[]}],"rels":[{"a":"班別","b":"學生","name":"擁有","card":"1:M","part":"||"}]},"cap":"圖 5.14（p.258）：每個班別必須有一個或多個學生；每個學生一定只屬於一個班別。"},{"er":{"entities":[{"name":"市民","attrs":[]},{"name":"犯罪記錄","attrs":[]}],"rels":[{"a":"市民","b":"犯罪記錄","name":"擁有","card":"1:M","part":"|o"}]},"cap":"圖 5.16（p.259）：市民可以有多項或沒有犯罪記錄（○ M）；每項犯罪記錄必定只屬於一個市民（┼ 1）。"},{"sim":{"db":"crime","sql":"SELECT C.NAME, COUNT(R.RID)\nFROM CITIZEN C LEFT JOIN CRIMINALRECORD R ON C.CID = R.CID\nGROUP BY C.CID, C.NAME"},"cap":"用 LEFT JOIN 計算每位市民有多少項記錄：有 0、1、2 項——正是「○ M」。"}],"tries":[{"id":"a5a-s3-t1","pts":4,"src":"教科書 p.259 表 5.10","db":"crime","ask":"rows","sql":"SELECT C.NAME\nFROM CITIZEN C, CRIMINALRECORD R\nWHERE C.CID = R.CID","q":"先估：結果有多少行？","options":["3","4","5","9"],"why":"每項犯罪記錄配對一位市民，共 4 行（Finn 出現兩次）。沒有記錄的 Clem 和 Gabe 不會出現。"}],"practice":[{"id":"a5a-s3-p1","type":"mc","pts":2,"src":"教科書 p.259","db":"crime","verify":true,"ask":{"col":"NAME"},"sql":"SELECT NAME\nFROM CITIZEN\nWHERE CID NOT IN (SELECT CID FROM CRIMINALRECORD)","q":"以上 SQL 語句的結果是什麼？","options":["Clem, Gabe","Ada, Dio, Finn","Clem","（沒有記錄）"],"answer":0,"hint":"找出 CRIMINALRECORD 沒有出現的 CID。","why":"Clem 和 Gabe 沒有犯罪記錄，說明市民一面是非強制的。"},{"id":"a5a-s3-p2","type":"mc","pts":2,"src":"教科書 p.258","q":"班別與學生是一對多關係。在關聯式數據庫中應怎樣表示？","options":["在 CLASS 加入欄位 SID 作外鍵碼","在 STUDENT 加入欄位 CID 作外鍵碼，參照 CLASS 的主關鍵碼","把 CLASS 和 STUDENT 合併為一個數據表","在 CLASS 加入 SID1、SID2、SID3 等欄位"],"answer":1,"hint":"外鍵碼放在「多」的一方。","why":"每個學生只有一個 CID；若在 CLASS 放學生，一個班別要存多個值（違反第一範式）。"},{"id":"a5a-s3-p3","type":"mc","pts":1,"src":"教科書 p.256","q":"學校與校長是一對一關係。把校長名字直接存為 SCHOOL 的屬性（不再有 PRINCIPAL 數據表），有什麼取捨？","options":["結構較簡單、表現較好，但失去靈活性和校長的其他數據（如 TENURE）","可儲存更多校長的資料","會違反參照完整性","一定會出現更新異常"],"answer":0,"hint":"圖中 TENURE 欄被刪去。","why":"書中說此做法「犧牲了靈活性和數據的細節，但可換來簡單的結構與更佳的表現」。"},{"id":"a5a-s3-p4","type":"mc","pts":1,"src":"教科書 p.257–261","q":"以下哪一項是**一對多**關係？","options":["每輛汽車擁有一個車牌，每個車牌屬於一輛汽車","每本書由一位或多位作者撰寫，每位作者可撰寫多本書","一個外賣帳戶可以下達任意數量的訂單，每張訂單只來自一個帳戶","一位演員可以出演多部電影，一部電影有多位演員"],"answer":2,"hint":"問兩次：一個 A 對多少個 B？一個 B 對多少個 A？","why":"汽車與車牌是 1:1；作者與書、演員與電影是 M:N。"}]},{"id":"s4","title":"多對多關係及分解","pages":"教科書 p.260–276","learn":[{"pts":["**多對多（M:N）**：每個 a 可有多個 b，每個 b 亦可有多個 a，例如學生與選修科目、市民與房地產。其中一個基數通常寫作 **N**。（p.260–261）","活動 5.1（p.270–271）比較四種儲存方法：一格存多個 EID、每科一欄、ELEC1–ELEC3 欄、**另建數據表 ENROLMENT**。只有方法 4 五題都答「是」——既靈活又容易用 SQL 查詢。方法 1–3 違反第一範式。","**分解多對多關係**：加入**關聯實體類型**（連接數據表），變成兩個一對多關係：`學生 1──M 修讀 M──1 選修科目`。ENROLMENT 有兩個外鍵碼（SID、EID），主關鍵碼通常是複合鍵 SID+EID。（p.272）","關係本身的屬性（借閱日、到期日、還書日；訂購日期、數量）放在連接數據表中——缺少學生或書本，這些日期便沒有意義。（p.272–273）"]},{"er":{"entities":[{"name":"學生","attrs":[]},{"name":"選修科目","attrs":[]}],"rels":[{"a":"學生","b":"選修科目","name":"修讀","card":"M:N","part":"||"}]},"cap":"圖 5.21（p.269）：分解前。"},{"er":{"entities":[{"name":"學生","attrs":["*SID","NAME","SEX"]},{"name":"修讀","attrs":["*SID","*EID"]},{"name":"選修科目","attrs":["*EID","ENAME","ROOM"]}],"rels":[{"a":"學生","b":"修讀","name":"進行","card":"1:M","part":"||"},{"a":"修讀","b":"選修科目","name":"指定","card":"M:1","part":"||"}]},"cap":"p.272：分解後，「修讀」成為關聯實體類型（數據表 ENROLMENT）。"},{"sim":{"db":"elect","sql":"SELECT S.NAME, E.ENAME, E.ROOM\nFROM STUDENT S, ENROLMENT N, ELECTIVE E\nWHERE S.SID = N.SID AND N.EID = E.EID\nORDER BY S.NAME"},"cap":"方法 4：連接三個數據表，便可列出每個學生修讀的科目及課室。"},{"sim":{"db":"m1","sql":"SELECT NAME, EIDLIST\nFROM STUDENT\nWHERE EIDLIST LIKE '%1%'"},"cap":"方法 1：想找修讀 History（EID 1）的學生，用 LIKE '%1%' 會連 11、12 也找出來。"},{"sim":{"db":"lib","sql":"SELECT S.NAME, B.BNAME, C.CDATE, C.RDATE\nFROM STUDENT S, CHECKOUT C, BOOK B\nWHERE S.SID = C.SID AND C.BID = B.BID"},"cap":"圖 5.24（p.273）：CHECKOUT 是關聯實體類型，並有自己的屬性（借閱日、到期日、還書日）。"}],"tries":[{"id":"a5a-s4-t1","pts":4,"src":"教科書 p.270 活動 5.1 方法 1 第 3 題","db":"m1","ask":"rows","sql":"SELECT NAME\nFROM STUDENT\nWHERE EIDLIST LIKE '%1%'","q":"先估：只有 Clem 和 Eva 修讀 History（EID 1）。這句 SQL 傳回多少行？","options":["2","3","4","5"],"why":"11 和 12 都含有字符 1，所以五個學生都被選出。這就是一格存多個值難以查詢的原因。"},{"id":"a5a-s4-t2","pts":4,"src":"教科書 p.271 活動 5.1 方法 4 第 3 題","db":"elect","ask":{"col":"NAME"},"sql":"SELECT S.NAME\nFROM STUDENT S, ENROLMENT N\nWHERE S.SID = N.SID AND N.EID = 1","q":"先估：結果是什麼？","options":["Clem, Eva","Ada, Clem, Gabe","Clem","Ada, Clem, Eva, Gabe, Finn"],"why":"ENROLMENT 中 EID 為 1 的只有 03496（Clem）和 03505（Eva）。"}],"practice":[{"id":"a5a-s4-p1","type":"mc","pts":2,"src":"教科書 p.270–271 活動 5.1 方法 2","tags":[{"t":"hot","why":"把多對多關係分解為兩個一對多關係（連接數據表、複合主關鍵碼）：DSE 卷二A 常考。"}],"q":"方法 2：STUDENT (SID, NAME, SEX, HISTORY, PHYSICS, ICT)，每科一個 TRUE／FALSE 欄位。如學校開設新選修科目，會怎樣？","options":["不用修改任何數據表","只要在 ELECTIVE 加一項記錄","要在 STUDENT 加入新欄位，修改數據表結構","要刪除所有學生記錄"],"answer":2,"hint":"每一科都是一個欄位。","why":"方法 2 有重複屬性；方法 4 只需在 ELECTIVE 插入一項記錄。"},{"id":"a5a-s4-p2","type":"mc","pts":2,"src":"教科書 p.260 表 5.11","db":"elect","verify":true,"ask":{"cell":[1,"COUNT(*)"]},"sql":"SELECT COUNT(*)\nFROM ENROLMENT N, ELECTIVE E\nWHERE N.EID = E.EID AND E.ENAME = 'ICT'","q":"以上 SQL 語句的結果是什麼？","options":["1","2","3","8"],"answer":2,"hint":"ICT 的 EID 是 12。","why":"Clem、Gabe、Finn 修讀 ICT。"},{"id":"a5a-s4-p3","type":"mc","pts":1,"src":"教科書 p.274 測試站 5.4 第 1(c) 題","q":"醫生「進行治療」病人是 M:N 關係，關係有屬性「治療名稱」和「治療日期」。分解後，這兩個屬性應屬於哪個實體？","options":["醫生","病人","治療（關聯實體類型）","兩個屬性都可以刪去"],"answer":2,"hint":"這些屬性描述的是「一次治療」。","why":"分解為 `醫生 1──M 治療 M──1 病人`，治療名稱和日期是「治療」的屬性。"},{"id":"a5a-s4-p4","type":"mc","pts":1,"src":"教科書 p.275 測試站 5.4 第 3(a) 題","tags":[{"t":"hot","why":"把多對多關係分解為兩個一對多關係（連接數據表、複合主關鍵碼）：DSE 卷二A 常考。"}],"q":"店舖（SID）與書本（ISBN）之間的「出售」是 M:N 關係，並有屬性「存貨」和「價錢」。表示這關係的數據表 SELL 應是：","options":["SELL (SID, ISBN, STOCK, PRICE)，主關鍵碼 SID+ISBN，SID 和 ISBN 都是外鍵碼","SELL (SID, STOCK, PRICE)，主關鍵碼 SID","SELL (ISBN, STOCK, PRICE)，主關鍵碼 ISBN","SELL (SID, ISBN, STOCK, PRICE)，主關鍵碼 STOCK"],"answer":0,"hint":"同一本書在不同店舖有不同價錢。","why":"一間店舖可賣多本書、一本書可在多間店舖出售，所以要 SID+ISBN 才能識別一項記錄。"}]},{"id":"write","kind":"write","title":"寫 SQL 及分析","pages":"教科書 p.260–276","intro":"第 1、3 題在多對多關係的數據庫上寫 SQL（系統會再用另外的數據檢查，不要只寫出現時看到的值）；第 2 題在表格內選出答案。","tasks":[{"id":"a5a-w1","pts":10,"title":"連接三個數據表","src":"教科書 p.271 活動 5.1 方法 4","db":"elect","q":"數據庫有 STUDENT (SID, NAME, SEX)、ENROLMENT (SID, EID)、ELECTIVE (EID, ENAME, ROOM)。列出所有修讀 **ICT** 的學生的 NAME（用科目名稱 ENAME，不要直接寫 EID）。","starter":"SELECT NAME\nFROM STUDENT","ref":"SELECT S.NAME\nFROM STUDENT S, ENROLMENT N, ELECTIVE E\nWHERE S.SID = N.SID AND N.EID = E.EID AND E.ENAME = 'ICT'","hint":"三個數據表要兩個連接條件：`S.SID = N.SID`、`N.EID = E.EID`，再加 `E.ENAME = 'ICT'`。"},{"id":"a5a-w2","kind":"table","pts":12,"title":"參與限制及基數","src":"教科書 p.262–267 例題 5.3、測試站 5.3","prompt":"按情境，為每個關係「A ── 關係 ── B」選出基數（A 對 B），以及兩面是否**必須**參與。\n「每個 A 必須參與」＝每一個 A 都至少與一個 B 有關係。\n情境 1：每間公司可能擁有 0 個或任意數量的辦公室；每個辦公室由一間公司獨家擁有；每個員工一定只在一個辦公室工作；每個辦公室總有多個員工。\n情境 2：每份菜單提供多種菜式；一道菜式必須出現於一份或多份菜單；顧客必須點至少一道菜式；部分菜式從未被點。\n情境 3：班上 20 個學生各自有一個黃道十二宮星座（共 12 個）。","head":["A ── 關係 ── B","基數","每個 A 必須參與？","每個 B 必須參與？"],"opts":{"K":["1:1","1:M","M:1","M:N"],"P":["必須","可以不"]},"rows":[["公司 ── 擁有 ── 辦公室",{"sel":"K","a":"1:M"},{"sel":"P","a":"可以不"},{"sel":"P","a":"必須"}],["辦公室 ── 有 ── 員工",{"sel":"K","a":"1:M"},{"sel":"P","a":"必須"},{"sel":"P","a":"必須"}],["菜單 ── 提供 ── 菜式",{"sel":"K","a":"M:N"},{"sel":"P","a":"必須"},{"sel":"P","a":"必須"}],["菜式 ── 被……點 ── 顧客",{"sel":"K","a":"M:N"},{"sel":"P","a":"可以不"},{"sel":"P","a":"必須"}],["學生 ── 有 ── 星座",{"sel":"K","a":"M:1"},{"sel":"P","a":"必須"},{"sel":"P","a":"可以不"}]],"hint":"逐句找「每個／必須／總會」（必須）和「可能／部分／0 個」（可以不）。12 個星座不一定每個都有學生。"},{"id":"a5a-w3","pts":13,"title":"每處房地產有多少擁有人","src":"教科書 p.261 表 5.12","db":"prop","q":"數據庫有 CITIZEN (CID, NAME, SEX)、OWNERSHIP (CID, PID)、PROPERTY (PID, PNAME, FLOOR, ROOM)。列出**每一處**房地產的 PID 和擁有人數目；**沒有擁有人**的房地產（例如屬於政府）也要列出，數目為 0。","starter":"SELECT PID, COUNT(*)\nFROM OWNERSHIP\nGROUP BY PID","ref":"SELECT P.PID, COUNT(O.CID)\nFROM PROPERTY P LEFT JOIN OWNERSHIP O ON P.PID = O.PID\nGROUP BY P.PID","hint":"由 PROPERTY 開始，用 LEFT JOIN 連接 OWNERSHIP；用 `COUNT(O.CID)`（不是 COUNT(*)），沒有配對時才會是 0。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.272–276、p.306–307","items":[{"id":"a5a-q1","pts":4,"src":"教科書 p.306 課題練習 2(a)","tags":[{"t":"hot","why":"按情境加上參與限制及基數、繪畫或修改實體關係圖：DSE 卷二A 長題目常見（教科書例題 5.2–5.3、課題練習 2）。"}],"q":"大學數據庫有 STUDENT、COURSE；學生可以報讀 0 至 3 個課程，每個課程可有多位學生報讀。若不分解，學生與課程之間的關係最適合哪一項描述？","options":["1:1，兩面強制","1:M，學生一面強制","M:N，學生可以不報讀任何課程","M:1，每個課程只有一位學生"],"answer":"C","why":"一位學生可報讀多個課程，一個課程有多位學生 → M:N；學生可報讀 0 個，所以學生一面非強制。分解後要加入連接數據表 ENROL (SID, CID)。"},{"id":"a5a-q2","pts":4,"src":"教科書 p.307 課題練習 2(d)","q":"每個課程僅屬於一個學院，每個學院可以有多個課程。以下哪項正確？","options":["COURSE 與 FACULTY 是 M:N，要加入連接數據表","COURSE 與 FACULTY 是 M:1；COURSE 加入外鍵碼參照 FACULTY 的主關鍵碼","FACULTY 加入 CID1、CID2…… 等欄位","COURSE 與 FACULTY 是 1:1，應合併為一個數據表"],"answer":"B","why":"「多」的一方（COURSE）放外鍵碼。"},{"id":"a5a-q3","pts":4,"src":"教科書 p.275–276 測試站 5.4 第 3(b)–(c) 題","q":"ER 圖：`店舖 ┼M──出售──○N 書本`，`出版社 ┼1──出版──┼M 書本`（┼／○ 記號在數字旁）。以下哪項描述**錯誤**？","options":["每間店舖可能出售多本書，或沒有出售任何書","每本書可被一間或多間店舖出售","每間出版社出版一本或多本書","每本書可由多間出版社出版"],"answer":"D","why":"靠近出版社是「1」：每本書僅由一間出版社出版。"},{"id":"a5a-q4","pts":4,"src":"自擬（DSE 卷二A：分解多對多關係）","tags":[{"t":"hot","why":"把多對多關係分解為兩個一對多關係（連接數據表、複合主關鍵碼）：DSE 卷二A 常考。"}],"q":"演員與電影是 M:N 關係。分解後的連接數據表 ROLE (AID, FID, RNAME) 中，以下哪項正確？","options":["AID 是主關鍵碼，FID 是外鍵碼","AID 和 FID 都是外鍵碼，AID+FID 可作主關鍵碼","RNAME 是外鍵碼","ROLE 不需要主關鍵碼"],"answer":"B","why":"連接數據表有兩個外鍵碼，分別參照 ACTOR 和 FILM；一個演員在一部電影只演一個角色時，AID+FID 獨一無二。"},{"id":"a5a-q5","pts":4,"src":"自擬（教科書 p.261 表 5.12 數據）","tags":[{"t":"trap","why":"非強制一面：不是每個實體都出現在連接數據表中。"}],"db":"prop","verify":true,"ask":{"cell":[1,"COUNT(*)"]},"sql":"SELECT COUNT(*)\nFROM CITIZEN\nWHERE CID NOT IN (SELECT CID FROM OWNERSHIP)","q":"在市民與房地產數據庫（p.261）執行以上語句，結果是什麼？這說明了什麼？（只選數字）","options":["0","1","2","5"],"answer":"B","why":"只有 Ada 沒有擁有房地產——市民「擁有」房地產是非強制的一面（○）。"}]},{"id":"more","kind":"endless","title":"無限練習","gens":["erCard","sqlJoin","sqlSub"],"intro":"隨機生成基數判斷、多表連接及子查詢題目，答案由模擬器計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]},{"id":"a5b","title":"數據冗餘、異常與規範化","book":"教科書 選修A 第 5 章 p.277–307","key":"A-a5b-hmac-3f59b9b5fa","theory":false,"dbs":{"flat":{"STUDENT":[["SID","SNAME","CLASS","CTEACH","EID","ENAME","ETEACH","SCORE"],[["03493","Ada","3A","Mrs Au",2,"Physics","Mr Poon",0],["03496","Clem","3B","Mr Bao",1,"History","Ms Ho",78],["03496","Clem","3B","Mr Bao",2,"Physics","Mr Poon",98],["03496","Clem","3B","Mr Bao",3,"ICT","Mr Suen",89],["03505","Eva","3B","Mr Bao",1,"History","Ms Ho",83],["03506","Gabe","3C","Ms Chau",2,"Physics","Mr Poon",47],["03506","Gabe","3C","Ms Chau",3,"ICT","Mr Suen",74],["03510","Finn","3B","Mr Bao",3,"ICT","Mr Suen",53]],["SID","EID"]]},"norm":{"STUDENT":[["SID","SNAME","CLASS"],[["03493","Ada","3A"],["03496","Clem","3B"],["03505","Eva","3B"],["0350
