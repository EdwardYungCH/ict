有多少個多餘空格。"}],"tries":[{"id":"a2b-s1-t1","pts":4,"src":"教科書 p.80 測試站 2.3(c)","db":"film","sql":"SELECT FCODE, MID(FCODE, LENGTH(FCODE)-2, 2) AS PART FROM FILM WHERE FCODE IN ('T90015', 'A77')","ask":{"col":"PART"},"q":"先估：取出編號 A77 和 T90015 的「倒數第二和第三個字符」，結果依次是什麼？","options":["A7, 01","77, 00","77, 15","A7, 90"],"why":"A77 長度 3，由第 3 − 2 = 1 個字符起取 2 個：A7。T90015 長度 6，由第 4 個字符起取 2 個：01。"}],"practice":[{"id":"a2b-s1-p1","type":"mc","pts":1,"src":"教科書 p.79 例題 2.3(a)","q":"部分用戶名稱的開首和結尾有多餘空格。哪一句能**刪除**這些空格？","options":["SELECT TRIM(USERNAME) FROM USER","UPDATE USER SET USERNAME = TRIM(USERNAME)","UPDATE USER SET TRIM(USERNAME)","DELETE FROM USER WHERE USERNAME LIKE ' %'"],"answer":1,"hint":"要改動數據，便要用 UPDATE … SET 欄名 = 新的值。","why":"SELECT 只顯示結果；DELETE 會刪除整項記錄。"},{"id":"a2b-s1-p2","type":"complete","pts":2,"src":"教科書 p.79 例題 2.3(d)","db":"user","q":"班別名稱的首個字符是年級。上一學年考試不合格的學生要重讀（年級不變）。列出這些學生的用戶名稱。","template":"SELECT USERNAME FROM USER WHERE ［1］ = ［2］","ref":["MID(CLASS, 1, 1)","MID(OLDCLASS, 1, 1)"],"hint":"比較 CLASS 和 OLDCLASS 的首個字符：`MID(…, 1, 1)`（也可用 `LEFT(…, 1)`）。"},{"id":"a2b-s1-p3","type":"complete","pts":2,"src":"教科書 p.79 例題 2.3(e)","db":"user","q":"電話號碼應有 8 位。由於轉錄錯誤，部分號碼少了數字。列出這些用戶的編號和電話號碼。","template":"SELECT UID, PHONE FROM USER WHERE ［1］","ref":["LENGTH(PHONE) \u003c 8"],"hint":"檢查電話號碼的長度。"},{"id":"a2b-s1-p4","type":"fill","pts":2,"src":"教科書 p.80 測試站 2.3(d)","db":"film","sql":"SELECT LENGTH(FNAME) - LENGTH(TRIM(FNAME)) FROM FILM WHERE FCODE = '2468'","q":"編號 2468 的電影名稱開首和結尾有多餘空格。執行以下語句，多餘空格有多少個？","blanks":[{"label":"多餘空格數目","ask":{"cell":[1,"LENGTH(FNAME) - LENGTH(TRIM(FNAME))"]}}],"hint":"先在試算區執行 `SELECT FNAME, LENGTH(FNAME) FROM FILM` 看看。"}]},{"id":"s2","title":"時間函數","pages":"教科書 p.78–80","learn":[{"table":{"head":["函數","用途","例子","結果"],"rows":[["`YEAR(d)`","年份","`YEAR('2034-05-06')`","2034"],["`MONTH(d)`","月份","`MONTH('2034-05-06')`","5"],["`DAY(d)`","日子","`DAY('2034-05-06')`","6"],["`DATE(s)`","把字串轉為日期（MySQL 一般會自動轉換，用途不大）","`DATE('2034-05-06')`","2034-05-06"]]},"cap":"表 2.8 常用時間函數（p.78）"},{"pts":["函數的結果是**數字**，可以再運算或比較，例如 `YEAR(RELEASE) IN (2012, 2016, 2021)`。（p.80 測試站 2.3(a)）","不理年份的日期範圍（例如 08-23 至 09-22）：把月和日變成一個整數 `MONTH(DOB)*100 + DAY(DOB)`，再用 `BETWEEN 823 AND 922`。（p.79 例題 2.3(c)）","函數也可以用在 ORDER BY：`ORDER BY MONTH(DOB)` 按出生月份排列；`ORDER BY LENGTH(FNAME)` 按名稱長度排列。（p.79–80）"]},{"sim":{"db":"user","sql":"SELECT UID, USERNAME, DOB, MONTH(DOB)*100+DAY(DOB) AS MD FROM USER ORDER BY MD"},"cap":"把每位用戶的生日變成整數 MD（月 × 100 + 日），再排序。"}],"tries":[{"id":"a2b-s2-t1","pts":4,"src":"教科書 p.79 例題 2.3(c)","db":"user","sql":"SELECT UID FROM USER WHERE MONTH(DOB)*100+DAY(DOB) BETWEEN 823 AND 922","ask":{"col":"UID"},"q":"先估：生日在 08-23 至 09-22 之間的用戶編號是哪些？（Sarah 08-21、Ken 09-22、Zoe 08-23、Tom 09-23）","options":["8051, 14002","14002","9238, 8051, 14002","8051, 14002, 10777"],"why":"MD 分別是 821、922、823、923。BETWEEN 包括 823 和 922，所以只有 Ken（8051）和 Zoe（14002）。"}],"practice":[{"id":"a2b-s2-p1","type":"complete","pts":2,"src":"教科書 p.80 測試站 2.3(a)","db":"film","q":"展示於 2012、2016 和 2021 年上映的電影名稱。","template":"SELECT FNAME FROM FILM WHERE ［1］ IN (2012, 2016, 2021)","ref":["YEAR(RELEASE)"],"hint":"用 YEAR() 取出上映日期的年份。"},{"id":"a2b-s2-p2","type":"complete","pts":2,"src":"教科書 p.79 例題 2.3(b)","db":"user","q":"列出用戶名稱，按出生**月份**由小至大排列。","template":"SELECT USERNAME FROM USER ORDER BY ［1］","ref":["MONTH(DOB)"],"hint":"函數也可以用在 ORDER BY：`ORDER BY MONTH(DOB)`（默認是遞升，ASC 可省略）。"},{"id":"a2b-s2-p3","type":"mc","pts":2,"src":"教科書 p.100 課題練習第 3(e) 題","db":"film","verify":true,"ask":"rows","sql":"SELECT FCODE FROM FILM WHERE MONTH(RELEASE) BETWEEN 1 AND 6","q":"`SELECT FCODE FROM FILM WHERE MONTH(RELEASE) BETWEEN 1 AND 6` 列出在一月至六月之間上映的電影編號。在 FILM 執行時傳回多少行？","options":["2","3","4","5"],"answer":1,"hint":"`WHERE MONTH(RELEASE) BETWEEN 1 AND 6`。逐行看上映月份：3、6、7、9、2、11、7。","why":"3 月、6 月、2 月：共 3 行。"}]},{"id":"s3","title":"聚合函數","pages":"教科書 p.81、p.87–91","learn":[{"table":{"head":["函數","用途","例子（p.81 STUDENT）","結果"],"rows":[["`COUNT(*)`","記錄的數目","`SELECT COUNT(*) FROM STUDENT`","4"],["`COUNT(欄)`","該欄非 NULL 值的數目","`SELECT COUNT(SCORE) FROM STUDENT`","3"],["`MAX()`／`MIN()`","最大／最小值","`SELECT MAX(SCORE) …`","90"],["`SUM()`","總和","`SELECT SUM(SCORE) …`","201"],["`AVG()`","平均值","`SELECT AVG(SCORE) …`","67"]]},"cap":"表 2.9 常用聚合函數（p.81）。STUDENT：Ada 31、Clem 90、Eva 80、Gabe NULL。"},{"pts":["**聚合函數**把多項記錄匯總成一個值。除了 `COUNT(*)`，所有聚合函數都**不理會 NULL**：AVG = 201 ÷ 3 = 67，不是 201 ÷ 4。（p.81）","`SUM(SCORE) / COUNT(SCORE)` 等於 `AVG(SCORE)`；`SUM(SCORE) / COUNT(*)` 便不一樣（NULL 也計算在內）。（p.91）","聚合函數內可以放算式或其他函數，例如 `MAX(LENGTH(PNAME))` 找出最長的貨品名稱有多少個字符。（p.93 測試站 2.4(b)）"]},{"warn":"`SELECT NAME, MAX(SCORE) FROM STUDENT` **不能**找出最高分學生的名字：NAME 不是匯總的數據，與 MAX(SCORE) 沒有關係。MySQL 8.0 會出錯（ONLY_FULL_GROUP_BY）。要找最高分的學生，可用子查詢：`SELECT NAME FROM STUDENT WHERE SCORE = (SELECT MAX(SCORE) FROM STUDENT)`。（p.88–89）"},{"sim":{"db":"small","sql":"SELECT COUNT(*), COUNT(SCORE), SUM(SCORE), AVG(SCORE), SUM(SCORE)/COUNT(*) FROM STUDENT"},"cap":"比較 COUNT(*) 與 COUNT(SCORE)、AVG 與 SUM ÷ COUNT(*)。"}],"tries":[{"id":"a2b-s3-t1","pts":4,"src":"教科書 p.81 表 2.9","tags":[{"t":"trap","why":"除了 COUNT(*)，聚合函數都不理會 NULL：AVG 只除以非 NULL 值的數目。"}],"db":"small","sql":"SELECT AVG(SCORE) FROM STUDENT","ask":{"cell":[1,"AVG(SCORE)"]},"q":"先估：SCORE 是 31、90、80、NULL。`AVG(SCORE)` 是多少？","options":["50.25","67","201","NULL"],"why":"AVG 不理會 NULL：(31 + 90 + 80) ÷ 3 = 67。"},{"id":"a2b-s3-t2","pts":4,"src":"教科書 p.91","db":"class3","sql":"SELECT AVG(SCORE) FROM STUDENT WHERE CLASS = '3A' AND SID \u003c> '03493'","ask":{"cell":[1,"AVG(SCORE)"]},"q":"先估：3A 班的分數是 Ivy 45、Ada 0、Ben 86。Ada（03493）因缺席得 0 分，計算平均分時不應納入。結果是多少？","options":["65.5","131","43.5","45"],"why":"WHERE 先刪去 Ada 的記錄，再計算平均：(45 + 86) ÷ 2 = 65.5。如果不刪去，0 分會拉低平均分。"}],"practice":[{"id":"a2b-s3-p1","type":"fill","pts":2,"src":"教科書 p.81 表 2.9","db":"small","sql":"SELECT COUNT(*), COUNT(SCORE) FROM STUDENT","q":"寫出 `COUNT(*)` 和 `COUNT(SCORE)` 的值（p.81 STUDENT，Gabe 的 SCORE 是 NULL）。","blanks":[{"label":"COUNT(*)","ask":{"cell":[1,"COUNT(*)"]}},{"label":"COUNT(SCORE)","ask":{"cell":[1,"COUNT(SCORE)"]}}],"hint":"COUNT(*) 點算記錄；COUNT(欄) 只點算非 NULL 的值。"},{"id":"a2b-s3-p2","type":"complete","pts":2,"src":"教科書 p.93 測試站 2.4(b)","db":"product","q":"經理想找出最長的貨品名稱，以定下合適的欄位長度。寫出 SQL 語句，找出最長貨品名稱的字符長度。","template":"SELECT ［1］ FROM PRODUCT","ref":["MAX(LENGTH(PNAME))"],"hint":"先用 LENGTH() 計每個名稱的長度，再用 MAX()。"},{"id":"a2b-s3-p3","type":"mc","pts":1,"src":"教科書 p.91","tags":[{"t":"trap","why":"除了 COUNT(*)，聚合函數都不理會 NULL：AVG 只除以非 NULL 值的數目。"}],"q":"`SELECT CLASS, SUM(SCORE) / COUNT(SCORE) FROM STUDENT GROUP BY CLASS` 想找出什麼？","options":["每班的平均分","每班的總分","每班有分數的學生人數","全級的平均分"],"answer":0,"hint":"總和 ÷ 有分數的數目。","why":"SUM(SCORE) / COUNT(SCORE) 與 AVG(SCORE) 相同（兩者都不理會 NULL）。"},{"id":"a2b-s3-p4","type":"mc","pts":1,"src":"教科書 p.88–89 常見錯誤","q":"`SELECT NAME, MAX(SCORE) FROM STUDENT` 想找出最高分學生的名字。以下哪一項正確？","options":["可以，NAME 會是最高分學生的名字","不可以：NAME 不是匯總的數據，與 MAX(SCORE) 無關（MySQL 8.0 更會出錯）","不可以：MAX 只可以用在 HAVING","可以，但要加 DISTINCT"],"answer":1,"hint":"只有放在聚合函數內的欄位才是匯總的數據。","why":"要找最高分的學生，可用子查詢 `WHERE SCORE = (SELECT MAX(SCORE) FROM STUDENT)`（第 3 章）。"}]},{"id":"s4","title":"GROUP BY 與 HAVING","pages":"教科書 p.81–87、p.90–94","learn":[{"pts":["`GROUP BY CLASS`：CLASS 相同的記錄歸入同一組，聚合函數**每組計算一次**，結果每組一行。（p.82）","通常要一併 SELECT 用作分組的欄位，否則看不出每行是哪一組。（p.83）","SELECT 之後的欄位，要麼在 GROUP BY 之中，要麼放在聚合函數之內，否則沒有意義（MySQL 8.0 會出錯）。（p.84）","可以按多個欄位分組：`GROUP BY CLASS, SEX`；也可以按函數分組：`GROUP BY YEAR(DOB)`。（p.86–87）","`HAVING`：在分組**之後**篩選類別，例如 `HAVING COUNT(*) > 1`；`WHERE`：在分組**之前**篩選記錄。聚合函數不可以放在 WHERE。（p.84–85）","子句次序：`SELECT … FROM … WHERE … GROUP BY … HAVING … ORDER BY …`。（p.85）"]},{"sim":{"db":"school","sql":"SELECT CLASS, COUNT(*) FROM STUDENT\n    WHERE SCORE1 >= 60\n    GROUP BY CLASS\n    HAVING COUNT(*) > 1\n    ORDER BY CLASS"},"cap":"p.85：先 WHERE 選出第一次測驗合格的學生，再按班別分組點算，最後 HAVING 只留下多於一人的班別。試刪去 WHERE 或 HAVING 一行，比較結果。"},{"fix":{"bad":"SELECT CLASS, COUNT(*) FROM STUDENT WHERE COUNT(*) > 1 GROUP BY CLASS","good":"SELECT CLASS, COUNT(*) FROM STUDENT GROUP BY CLASS HAVING COUNT(*) > 1","why":"聚合函數不可放在 WHERE：WHERE 在分組之前執行，那時還未有「每組的人數」。（p.85 常見錯誤）"}}],"tries":[{"id":"a2b-s4-t1","pts":4,"src":"教科書 p.86","tags":[{"t":"hot","why":"卷二A 常考 GROUP BY／HAVING 及聚合函數，例如 DSE 2017 2A Q2、2019 2A Q3、2022 2A Q3"}],"db":"class3","sql":"SELECT CLASS, SEX, COUNT(*) FROM STUDENT GROUP BY CLASS, SEX ORDER BY CLASS, SEX","ask":"rows","q":"先估：`GROUP BY CLASS, SEX` 的結果有多少行？（3A：F、F、M；3B：F、F、F、M；3C：M、M、M）","options":["3","5","6","10"],"why":"每個（班別, 性別）組合一行：3A F、3A M、3B F、3B M、3C M，共 5 行（3C 沒有女生，所以沒有 3C F）。"}],"practice":[{"id":"a2b-s4-p1","type":"complete","pts":2,"src":"教科書 p.93 例題 2.4(d)","db":"member","q":"列出每個會員類型中，各性別會員的平均積分。（要顯示分組用的欄位）","template":"SELECT TYPEID, SEX, AVG(CREDIT) FROM MEMBER GROUP BY ［1］","ref":["TYPEID, SEX"],"hint":"按兩個欄位分組。"},{"id":"a2b-s4-p2","type":"complete","pts":2,"src":"教科書 p.93 例題 2.4(f)","db":"member","q":"找出每個月登記成為**銅級會員**（TYPEID = 0）的人數，不限年份。","template":"SELECT MONTH(REGDATE), COUNT(*) FROM MEMBER WHERE ［1］ GROUP BY ［2］","ref":["TYPEID = 0","MONTH(REGDATE)"],"hint":"先用 WHERE 篩選銅級會員，再按登記月份分組。"},{"id":"a2b-s4-p3","type":"fill","pts":1,"src":"教科書 p.93 例題 2.4(b)","db":"member","sql":"UPDATE MEMBER SET TYPEID = 3 WHERE TYPEID = 2 AND YEAR(REGDATE) \u003c= 2018; SELECT NAME FROM MEMBER WHERE TYPEID = 3","q":"把所有於 2018 年或之前登記的金級會員（TYPEID = 2）升為鑽石級（TYPEID = 3）。執行後，鑽石級會員有多少人？","blanks":[{"label":"鑽石級人數","ask":"rows"}],"hint":"原本已有 1 位鑽石級（Lam Chi）。金級會員：Chan（2017）、Lee（2019）、Tse（2018）。"},{"id":"a2b-s4-p4","type":"mc","pts":1,"src":"教科書 p.85","tags":[{"t":"trap","why":"WHERE 在分組前篩選記錄，HAVING 在分組後篩選類別；聚合函數不可放在 WHERE。"}],"q":"要列出「每班第一次測驗合格（SCORE1 >= 60）的人數，只顯示多於一人的班別」，`SCORE1 >= 60` 和 `COUNT(*) > 1` 應分別放在哪裏？","options":["兩者都放在 WHERE","兩者都放在 HAVING","SCORE1 >= 60 放在 WHERE，COUNT(*) > 1 放在 HAVING","SCORE1 >= 60 放在 HAVING，COUNT(*) > 1 放在 WHERE"],"answer":2,"hint":"篩選記錄（分組前）→ WHERE；篩選類別（分組後）→ HAVING。"}]},{"id":"write","kind":"write","title":"寫 SQL","pages":"教科書 p.99–100 課題練習","intro":"在編輯器寫一句 SELECT 語句，先按「▶ 執行」看結果，再按「提交評核」。評核會用另外的數據再測試，所以不可以只寫出現在的答案。","tasks":[{"id":"a2b-w1","tier":"必做","pts":10,"title":"描述太長或欠缺描述的手機","src":"教科書 p.100 課題練習第 2(b) 題","db":"phone","q":"PHONE 的 CAPTION 是手機的產品描述。部分描述**多於 100 個字符**，又有些手機**欠缺**產品描述（NULL）。列出這些手機的 PID。","starter":"SELECT PID FROM PHONE WHERE LENGTH(CAPTION) >= 100","ref":"SELECT PID FROM PHONE WHERE LENGTH(CAPTION) > 100 OR CAPTION IS NULL","hint":"「多於 100」不包括 100；欠缺描述要用 `CAPTION IS NULL`（LENGTH(NULL) 是 NULL，不會大於 100）。兩個情況用 OR 連接。"},{"id":"a2b-w2","tier":"進階","pts":12,"title":"每年未停產手機的售價總和","src":"教科書 p.100 課題練習第 2(d) 題","db":"phone","q":"計算**每年**開始發售的手機的售價總和，只計算**未停產**的手機（DISC = 0）。顯示年份及售價總和。","starter":"SELECT YEAR(RELEASE), SUM(PRICE) FROM PHONE","ref":"SELECT YEAR(RELEASE), SUM(PRICE) FROM PHONE WHERE DISC = 0 GROUP BY YEAR(RELEASE)","hint":"先 `WHERE DISC = 0`（或 `DISC = FALSE`），再 `GROUP BY YEAR(RELEASE)`。"},{"id":"a2b-w3","tier":"挑戰","pts":13,"title":"文學平均分 80 或以上的年齡組別","src":"教科書 p.100 課題練習第 1(e) 題","db":"quiz","q":"CONTESTANT 記錄問答比賽參賽者的資料：AGID 是年齡組別編號，LITE 是文學分數，SUBTIME 是遞交時間。\n列出所有文學**平均分 80 或以上**的年齡組別（AGID）。計算平均分時，只包括於 **2025-03-13 23:59:59 或之前**遞交答案的參賽者。","starter":"SELECT AGID FROM CONTESTANT GROUP BY AGID","ref":"SELECT AGID FROM CONTESTANT WHERE SUBTIME \u003c= '2025-03-13 23:59:59' GROUP BY AGID HAVING AVG(LITE) >= 80","hint":"遞交時間的條件是篩選**記錄**（WHERE，分組前）；平均分的條件是篩選**組別**（HAVING，分組後）。「或之前」用 `\u003c=`，「或以上」用 `>=`。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.85–99","items":[{"id":"a2b-q1","pts":4,"src":"教科書 p.99 課文總結（尋找復活蛋比賽）","tags":[{"t":"hot","why":"卷二A 常考 GROUP BY／HAVING 及聚合函數，例如 DSE 2017 2A Q2、2019 2A Q3、2022 2A Q3"}],"db":"egg","sql":"SELECT TEAM, SUM(EGG) AS TOTAL FROM CONTESTANT GROUP BY TEAM HAVING TOTAL > 5 ORDER BY TEAM","ask":"table","verify":true,"q":"CONTESTANT 的 EGG：X 隊 2、2、4；Y 隊 3、0、2；Z 隊 5、0、1。以下語句的輸出是什麼？\n`SELECT TEAM, SUM(EGG) AS TOTAL FROM CONTESTANT GROUP BY TEAM HAVING TOTAL > 5 ORDER BY TEAM`","options":["X, 8","X, 8\nZ, 6","X, 8\nY, 5\nZ, 6","Z, 6"],"answer":"B","why":"各隊總數：X 8、Y 5、Z 6。HAVING 只保留總數大於 5 的隊伍。"},{"id":"a2b-q2","pts":4,"src":"教科書 p.99 課文總結","db":"egg","sql":"SELECT SEX, AVG(EGG) AS NUM FROM CONTESTANT GROUP BY SEX ORDER BY SEX","ask":"table","verify":true,"q":"女參賽者（F）找到 2、2、4、1 隻蛋；男參賽者（M）找到 3、0、5、2、0 隻。`SELECT SEX, AVG(EGG) AS NUM FROM CONTESTANT GROUP BY SEX ORDER BY SEX` 的輸出是什麼？","options":["F, 9\nM, 10","F, 4\nM, 5","F, 2.25\nM, 2","F, 2.25\nM, 2.5"],"answer":"C","why":"F：9 ÷ 4 = 2.25；M：10 ÷ 5 = 2（0 不是 NULL，要計算在內）。"},{"id":"a2b-q3","pts":4,"src":"教科書 p.94 測試站 2.4(e)","tags":[{"t":"trap","why":"WHERE 在分組前篩選記錄，HAVING 在分組後篩選類別；聚合函數不可放在 WHERE。"}],"db":"product","sql":"SELECT PNAME, MIN(PRICE) FROM PRODUCT WHERE STOCK > 50 GROUP BY PNAME HAVING MIN(PRICE) >= 10","ask":"rows","verify":true,"q":"找出每項貨品的最低價格，只計存貨多於 50 件的倉庫，並排除最低價格低於 10 的貨品。\n`SELECT PNAME, MIN(PRICE) FROM PRODUCT WHERE STOCK > 50 GROUP BY PNAME HAVING MIN(PRICE) >= 10`\nPRODUCT 有 5 種貨品：Potato chips（13.9／216 件、12.5／40 件、14.2／120 件）、Candy bar（18.5／231、9.5／80）、Bag of rice（62.9／193、59／30）、Toothbrush（17.9／389、16／60）、Soap（8.9／500）。結果有多少行？","options":["2","3","4","5"],"answer":"B","why":"WHERE 先刪去存貨不多於 50 的記錄（12.5、59）。最低價：Potato chips 13.9、Candy bar 9.5、Bag of rice 62.9、Toothbrush 16、Soap 8.9。HAVING 刪去 Candy bar 和 Soap，餘 3 行。"},{"id":"a2b-q4","pts":4,"src":"教科書 p.99 課題練習第 1(c) 題","db":"quiz","sql":"SELECT AGID, MAX(LITE) FROM CONTESTANT GROUP BY AGID ORDER BY AGID","ask":"rows","verify":true,"q":"CONTESTANT 有 AGID 是 1、2、3 的參賽者，也有兩位 AGID 是 NULL（忘記註明組別）。`SELECT AGID, MAX(LITE) FROM CONTESTANT GROUP BY AGID ORDER BY AGID` 的結果有多少行？","options":["2","3","4","9"],"answer":"C","why":"GROUP BY 把所有 NULL 歸入同一組，所以有 1、2、3 和 NULL 四組。"},{"id":"a2b-q5","pts":4,"src":"教科書 p.84–85、p.88（DSE 卷二A 題型）","tags":[{"t":"trap","why":"WHERE 在分組前篩選記錄，HAVING 在分組後篩選類別；聚合函數不可放在 WHERE。"}],"q":"以下哪一句 SQL 語句**能夠**正確執行？","options":["SELECT CLASS, COUNT(*) FROM STUDENT WHERE COUNT(*) > 1 GROUP BY CLASS","SELECT CLASS, NAME, COUNT(*) FROM STUDENT GROUP BY CLASS","SELECT CLASS, AVG(SCORE) FROM STUDENT GROUP BY CLASS ORDER BY AVG(SCORE) DESC","SELECT CLASS, COUNT(*) FROM STUDENT GROUP BY CLASS WHERE SCORE >= 60"],"answer":"C","why":"A：聚合函數不可放在 WHERE；B：NAME 不在 GROUP BY 中，也不在聚合函數內；D：WHERE 要放在 GROUP BY 之前。"}]},{"id":"more","kind":"endless","title":"無限練習","gens":["sqlFunc","sqlAgg"],"intro":"隨機生成文字／時間函數及 COUNT／SUM／AVG／MAX／MIN、GROUP BY、HAVING 的題目，答案由 SQL 引擎計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]},{"id":"a3a","title":"連接數據表（一）：INNER、LEFT、RIGHT、FULL JOIN","book":"教科書 選修A 第 3 章 p.104–121","key":"A-a3a-hmac-d4358a57c8","theory":false,"dbs":{"flat":{"STUDENT":[["SID","NAME","SEX","CLASS","SCORE","CID","CNAME","CROOM","CTEACH"],[["03493","Ada","F","3A",0,2,"Art Club",402,"Mrs Lee"],["03496","Clem","F","3B",89,1,"Chess Club",501,"Mr Chan"],["03505","Eva","F","3B",83,4,"Science Club",502,"Mr Wong"],["03506","Gabe","M","3C",47,4,"Science Club",502,"Mr Wong"],["03510","Finn","M","3B",35,1,"Chess Club",501,"Mr Chan"],["03513","Dio","M","3C",67,4,"Science Club",502,"Mr Wong"],["03517","Ben","M","3A",86,null,null,null,null]],["SID"]]},"club":{"STUDENT":[["SID","NAME","SEX","CLASS","SCORE","CID"],[["03493","Ada","F","3A",0,2],["03496","Clem","F","3B",89,1],["03505","Eva","F","3B",83,4],["03506","Gabe","M","3C",47,4],["03510","Finn","M","3B",35,1],["03513","Dio","M","3C",67,4],["03517","Ben","M","3A",86,null]],["SID"]],"CLUB":[["CID","NAME","ROOM","TEACH"],[[1,"Chess Club",501,"Mr Chan"],[2,"Art Club",402,"Mrs Lee"],[3,"English Club",203,"Mr Suen"],[4,"Science Club",502,"Mr Wong"]],["CID"]]},"company":{"EMPLOYEE":[["ID","ENAME","DEPID","TEAMID","SALARY"],[[1,"Ada",1,1,25000],[2,"Ben",2,2,22000],[3,"Clem",1,3,32000],[4,"Dio",2,3,15000],[5,"Eva",2,2,17000]],["ID"]],"TEAM":[["ID","TNAME","LEADID","MEMNUM"],[[1,"Alpha",1,1],[2,"Beta",5,2],[3,"Gamma",3,2],[4,"Delta",null,0]],["ID"]],"DEPARTMENT":[["ID","DNAME"],[[1,"Sales"],[2,"IT"],[3,"HR"]],["ID"]]},"shop":{"PROD":[["PID","NAME","STOCK","PRICE","SID"],[["P01","Gel Pen",120,8.5,1],["P02","Fountain Pen",15,180,1],["N01","Notebook",200,12,1],["P03","Ball Pen",300,5,2],["N02","Sketch Book",40,35,2],["B01","Backpack",10,450,2],["P04","Marker Pen",80,11.5,3],["C01","Calculator",25,1280,3],["P05","Brush Pen",60,9,null],["N03","Diary",90,28,null]],["PID"]],"SHOP":[["SID","NAME","MID","LOCATION"],[[1,"Central Shop",1,"Central"],[2,"Mong Kok Shop",2,"Mong Kok"],[3,"Sha Tin Shop",1,"Sha Tin"],[4,"Tai Po Shop",3,"Tai Po"]],["SID"]],"MANR":[["MID","NAME"],[[1,"Ada"],[2,"Ben"],[3,"Clem"]],["MID"]]}},"sections":[{"id":"s1","title":"為何分拆數據表；INNER JOIN","pages":"教科書 p.104–108","learn":[{"pts":["活動 3.1：把學生和學會的數據全放在一個數據表，會出現三個問題（p.104–105）：","**更新**：科學學會搬到 301 室，要更新 **3** 項記錄（每個會員一項）；漏改一項便不一致。","**插入**：新開的數學學會未有會員，**不能**儲存（SID 是主關鍵碼，不可以是 NULL）。","**刪除**：Ada 轉校，刪除她的記錄後，她所屬的學會（只有她一個會員）的資料也一併消失。","分拆成 **STUDENT** 和 **CLUB**，以**外鍵碼** CID 連接：搬房只改 CLUB 的 **1** 項記錄；新學會直接加入 CLUB；刪除學生不影響學會。（p.105–107）","把數據儲存於多個數據表，用外鍵碼連接，便能保持數據**一致性**，並節省儲存空間。（p.107）"]},{"sim":{"db":"flat","sql":"SELECT SID, NAME, CNAME, CROOM FROM STUDENT WHERE CNAME = 'Science Club'"},"cap":"未分拆的 STUDENT（p.104）：同一個學會的會室號碼重複儲存了 3 次。"},{"er":{"entities":[{"name":"STUDENT","attrs":["*SID","NAME","SEX","CLASS","SCORE","CID"]},{"name":"CLUB","attrs":["*CID","NAME","ROOM","TEACH"]}],"rels":[{"a":"STUDENT","b":"CLUB","name":"加入","card":"M:1"}]},"cap":"分拆後（p.107）：STUDENT.CID 是外鍵碼，指向 CLUB 的主關鍵碼 CID。"},{"h":"INNER JOIN（內連接）"},{"pts":["`SELECT * FROM STUDENT INNER JOIN CLUB ON STUDENT.CID = CLUB.CID`（p.107）","`FROM` 後面的 STUDENT 是**左方數據表**，`JOIN` 後面的 CLUB 是**右方數據表**；`ON` 之後寫連接條件（外鍵碼 = 主關鍵碼）。","結果**只包括兩個數據表中相符的記錄**。`INNER JOIN` 可簡寫成 `JOIN`。","沒有學會的 Ben（CID 是 NULL）和沒有會員的 English Club **都不在結果中**。（p.108）","`SELECT *` 會列出兩個數據表的所有欄位：前 6 欄來自 STUDENT，後 4 欄來自 CLUB，所以 CID 出現兩次。"]},{"sim":{"db":"club","sql":"SELECT * FROM STUDENT INNER JOIN CLUB ON STUDENT.CID = CLUB.CID"},"cap":"p.107–108：數一數結果有多少行，誰不見了？"}],"tries":[{"id":"a3a-s1-t1","pts":4,"src":"教科書 p.107–108","db":"club","sql":"SELECT * FROM STUDENT INNER JOIN CLUB ON STUDENT.CID = CLUB.CID","q":"先估：結果有多少行？","ask":"rows","options":["6","7","8","28"],"why":"7 位學生中只有 Ben 沒有學會（CID 是 NULL，NULL = 任何值都不成立），所以 6 行；English Club 沒有會員，也不會出現。"}],"practice":[{"id":"a3a-s1-p1","type":"fill","pts":2,"src":"教科書 p.104–105 活動 3.1 個案 1","q":"科學學會（Science Club）的會室搬到 301 室。分別要更新多少項記錄？","blanks":[{"label":"未分拆（只有一個 STUDENT）","a":"3"},{"label":"分拆成 STUDENT 和 CLUB","a":"1"}],"hint":"未分拆時，每個科學學會會員的記錄都有 CROOM；分拆後只有 CLUB 的一項記錄有 ROOM。"},{"id":"a3a-s1-p2","type":"mc","pts":1,"src":"教科書 p.104–106 活動 3.1","q":"以下哪一項**不是**把學生與學會的數據分拆到兩個數據表的好處？","options":["更新學會資料時，所須更新的記錄較少","沒有會員的新學會也可以儲存","刪除學生記錄時，不會失去學會的資料","查詢學生所屬學會的名稱時，不用連接數據表"],"answer":3,"hint":"分拆後，學會名稱在另一個數據表，查詢時反而**要**連接。"},{"id":"a3a-s1-p3","type":"mc","pts":2,"src":"教科書 p.107","db":"club","verify":true,"ask":{"col":"NAME"},"q":"以下語句輸出哪些名字？","sql":"SELECT STUDENT.NAME FROM STUDENT JOIN CLUB ON STUDENT.CID = CLUB.CID WHERE TEACH = 'Mr Chan'","options":["Clem, Finn","Ada","Clem, Finn, Ben","Eva, Gabe, Dio"],"answer":0,"hint":"Mr Chan 負責 CID 1（Chess Club）。`JOIN` 就是 INNER JOIN。"}]},{"id":"s2","title":"LEFT JOIN；別名；連接後匯總","pages":"教科書 p.108–111","learn":[{"pts":["**LEFT JOIN**（左外連接，也可寫 `LEFT OUTER JOIN`）：結果包括**左方數據表的所有記錄**，再加上兩個數據表中相符的值。（p.108）","`SELECT * FROM STUDENT LEFT JOIN CLUB ON STUDENT.CID = CLUB.CID`：Ben 也在結果中，他那一行來自 CLUB 的欄位全是 **NULL**；English Club 在右方，仍然不在結果中。（p.109）","`ON` 條件兩邊的先後次序不影響結果：`ON CLUB.CID = STUDENT.CID` 一樣。（p.109）","連接後可以照常選擇欄位、用 WHERE 篩選、ORDER BY 排序。（p.109）","兩個數據表都有 **NAME**：必須寫成 `STUDENT.NAME`、`CLUB.NAME`，否則出錯（欄名不清楚）。（p.110）","**別名**：`FROM STUDENT s LEFT JOIN CLUB c`，之後用 `s.NAME`、`c.NAME`；欄位也可加別名 `c.NAME AS CLUBNAME`。（p.110）"]},{"sim":{"db":"club","sql":"SELECT SID, s.NAME, CLASS, c.NAME AS CLUBNAME, ROOM\n    FROM STUDENT s LEFT JOIN CLUB c ON s.CID = c.CID\n    WHERE SCORE >= 60\n    ORDER BY CLASS"},"cap":"p.110：獲得至少 60 分的學生及其學會。把 LEFT JOIN 改成 INNER JOIN，Ben 會怎樣？"},{"h":"連接後再分組（p.111）"},{"code":"SELECT c.NAME, AVG(SCORE)\n    FROM STUDENT s LEFT JOIN CLUB c ON s.CID = c.CID\n    WHERE s.SID \u003c> '03506'\n    GROUP BY c.CID\n    HAVING COUNT(*) > 1","cap":"處理次序：連接 → WHERE 篩走 Gabe → GROUP BY 每個學會一組（Ben 自成 NULL 一組）→ HAVING 只留人數多於 1 的組。"},{"sim":{"db":"club","sql":"SELECT c.NAME, AVG(SCORE), COUNT(*)\n    FROM STUDENT s LEFT JOIN CLUB c ON s.CID = c.CID\n    WHERE s.SID \u003c> '03506'\n    GROUP BY c.CID"},"cap":"先不加 HAVING，看看每一組的人數；再自己加上 `HAVING COUNT(*) > 1`。"},{"warn":"如果有**多於一個**學生不屬於任何學會，他們會組成 NULL 一組，HAVING COUNT(*) > 1 便不能把這組篩走——結果會多了一行 NULL 學會的平均分。（p.111）"}],"tries":[{"id":"a3a-s2-t1","pts":4,"src":"教科書 p.110","db":"club","sql":"SELECT SID, s.NAME, CLASS, c.NAME AS CLUBNAME, ROOM\n    FROM STUDENT s LEFT JOIN CLUB c ON s.CID = c.CID\n    WHERE SCORE >= 60\n    ORDER BY CLASS","q":"先估：結果第一行（ORDER BY CLASS 後）的 CLUBNAME 是什麼？","ask":{"cell":[1,"CLUBNAME"]},"options":["NULL","Art Club","Chess Club","Science Club"],"why":"3A 班有 Ada（0 分，被 WHERE 篩走）和 Ben（86 分）。Ben 沒有學會，LEFT JOIN 後 c.NAME 是 NULL。"}],"practice":[{"id":"a3a-s2-p1","type":"mc","pts":1,"src":"教科書 p.110","db":"club","q":"執行 `SELECT SID, NAME, ROOM FROM STUDENT LEFT JOIN CLUB ON STUDENT.CID = CLUB.CID` 會怎樣？","options":["列出 7 行","列出 6 行","出錯：NAME 不清楚，要寫成 STUDENT.NAME 或 CLUB.NAME","出錯：LEFT JOIN 不可以用 ON"],"answer":2,"hint":"STUDENT 和 CLUB 都有欄位 NAME。"},{"id":"a3a-s2-p2","type":"mc","pts":2,"src":"教科書 p.111","db":"club","verify":true,"ask":"table","q":"以下語句的結果是什麼？","sql":"SELECT c.NAME, AVG(SCORE)\n    FROM STUDENT s LEFT JOIN CLUB c ON s.CID = c.CID\n    WHERE s.SID \u003c> '03506'\n    GROUP BY c.CID\n    HAVING COUNT(*) > 1","options":["Chess Club, 62\nScience Club, 75","Chess Club, 62\nScience Club, 65.67","Art Club, 0\nChess Club, 62\nScience Club, 75\nNULL, 86","Chess Club, 62\nScience Club, 75\nNULL, 86"],"answer":0,"hint":"Gabe（47）被 WHERE 篩走：Science Club 剩下 83 和 67；Art Club 和 NULL 組都只有 1 人。"},{"id":"a3a-s2-p3","type":"complete","pts":2,"src":"教科書 p.108–110","db":"club","q":"列出**所有**學生的名字及其學會名稱（沒有學會的學生也要列出）。","template":"SELECT s.NAME, c.NAME FROM STUDENT s ［1］ CLUB c ON ［2］","ref":["LEFT JOIN","s.CID = c.CID"],"hint":"要保留左方數據表 STUDENT 的所有記錄。連接條件是兩個數據表的 CID 相等。"}]},{"id":"s3","title":"RIGHT JOIN 與 FULL JOIN","pages":"教科書 p.112–114","learn":[{"pts":["**RIGHT JOIN**（右外連接，也可寫 `RIGHT OUTER JOIN`）：結果包括**右方數據表的所有記錄**，再加上相符的值。（p.112）","`SELECT * FROM STUDENT RIGHT JOIN CLUB ON STUDENT.CID = CLUB.CID`：English Club 在結果中（學生的欄位是 NULL）；Ben 在左方數據表，不在結果中。（p.112–113）","把兩個數據表**對調位置**，RIGHT JOIN 便可改寫成 LEFT JOIN：`SELECT * FROM CLUB LEFT JOIN STUDENT ON CLUB.CID = STUDENT.CID`。兩個結果除了欄位次序外一模一樣。（p.113）","**FULL JOIN**（`FULL OUTER JOIN`）：包括**左方和右方數據表的所有記錄**。Ben 和 English Club 都在結果中。（p.114）","MySQL 沒有 FULL JOIN 這個關鍵字，可以用 LEFT JOIN 與 RIGHT JOIN 的結果 **UNION** 起來代替（第 3.3 節）。DSE 試題仍會用 FULL JOIN 這個寫法。（p.114）"]},{"table":{"head":["連接","左方沒有配對的記錄（Ben）","右方沒有配對的記錄（English Club）","本例行數"],"rows":[["INNER JOIN","✗","✗","6"],["LEFT JOIN","✓","✗","7"],["RIGHT JOIN","✗","✓","7"],["FULL JOIN","✓","✓","8"]]},"cap":"四種連接的比較（p.107–114）"},{"sim":{"db":"club","sql":"SELECT * FROM STUDENT RIGHT JOIN CLUB ON STUDENT.CID = CLUB.CID"},"cap":"p.112：試把 RIGHT 改成 FULL，再改成 LEFT，比較行數。"}],"tries":[{"id":"a3a-s3-t1","pts":4,"src":"教科書 p.114","db":"club","sql":"SELECT * FROM STUDENT FULL JOIN CLUB ON STUDENT.CID = CLUB.CID","q":"先估：FULL JOIN 的結果有多少行？","ask":"rows","options":["6","7","8","11"],"why":"6 行相符的記錄，加上左方的 Ben 和右方的 English Club，共 8 行。（不是 7 + 4 = 11）"}],"practice":[{"id":"a3a-s3-p1","type":"mc","pts":2,"src":"教科書 p.113","db":"club","q":"以下哪一句與 `SELECT * FROM STUDENT RIGHT JOIN CLUB ON STUDENT.CID = CLUB.CID` 得出相同的記錄（不計欄位次序）？","options":["SELECT * FROM STUDENT LEFT JOIN CLUB ON STUDENT.CID = CLUB.CID","SELECT * FROM CLUB LEFT JOIN STUDENT ON CLUB.CID = STUDENT.CID","SELECT * FROM CLUB RIGHT JOIN STUDENT ON CLUB.CID = STUDENT.CID","SELECT * FROM STUDENT INNER JOIN CLUB ON STUDENT.CID = CLUB.CID"],"answer":1,"hint":"要保留 CLUB 的所有記錄：把 CLUB 放在左方，用 LEFT JOIN。"},{"id":"a3a-s3-p2","type":"fill","pts":1,"src":"教科書 p.112","db":"club","q":"執行以下語句，寫出結果的行數和 SID 是 NULL 的那一行的學會名稱。","sql":"SELECT SID, CLUB.NAME FROM STUDENT RIGHT JOIN CLUB ON STUDENT.CID = CLUB.CID","blanks":[{"label":"行數","ask":"rows"},{"label":"SID 是 NULL 的學會","a":"English Club","accept":["english club"]}],"hint":"RIGHT JOIN 保留右方 CLUB 的全部 4 個學會；沒有會員的學會，學生欄位是 NULL。"},{"id":"a3a-s3-p3","type":"complete","pts":2,"src":"教科書 p.112–113","db":"club","q":"列出**每個學會**的名稱及其會員名字；沒有會員的學會也要列出。用 RIGHT JOIN 完成。","template":"SELECT CLUB.NAME, STUDENT.NAME FROM STUDENT ［1］ CLUB ON ［2］","ref":["RIGHT JOIN","STUDENT.CID = CLUB.CID"],"hint":"CLUB 在右方，所以用 RIGHT JOIN 保留所有學會。"}]},{"id":"s4","title":"選擇合適的連接；COUNT(*) 的陷阱","pages":"教科書 p.115–119（例題 3.1）","learn":[{"pts":["例題 3.1：EMPLOYEE（ID, ENAME, DEPID, TEAMID, SALARY）、TEAM（ID, TNAME, LEADID, MEMNUM）、DEPARTMENT（ID, DNAME）。三個數據表都有欄位 **ID**，要寫 `TEAM.ID`、`EMPLOYEE.ID`。（p.115）","先想：哪一個數據表的記錄**全部都要**出現？用文氏圖想清楚。（p.116–117）","(a)(i) 每位員工都有部門，結果**不要**沒有員工的部門：EMPLOYEE 在左方用 **LEFT JOIN 或 INNER JOIN**（RIGHT JOIN 會多了沒有員工的部門）。","(a)(ii) 部分團隊未有負責人，但每個團隊都要列出：TEAM 在左方用 **LEFT JOIN**，連接條件是 `LEADID = EMPLOYEE.ID`。","(b)(i) TEAM 的 **MEMNUM**（團隊人數）每次加入員工都要更新，容易不一致；應改用 COUNT() 計算。（p.118）","(b)(ii) **COUNT(*) 會點算 NULL 那一行**：沒有成員的團隊（Delta）在 RIGHT JOIN 後仍有一行（ENAME 是 NULL），COUNT(*) 得 1；要用 **COUNT(ENAME)**，NULL 不計，得 0。（p.118–119）","(c) **WHERE 在分組之前**篩選記錄；**HAVING 在分組之後**篩選組。「排除平均薪金低於 20000 的團隊」要用 HAVING AVG(SALARY) >= 20000。（p.119）"]},{"er":{"entities":[{"name":"EMPLOYEE","attrs":["*ID","ENAME","DEPID","TEAMID","SALARY"]},{"name":"TEAM","attrs":["*ID","TNAME","LEADID","MEMNUM"]},{"name":"DEPARTMENT","attrs":["*ID","DNAME"]}],"rels":[{"a":"EMPLOYEE","b":"TEAM","name":"屬於","card":"M:1"},{"a":"EMPLOYEE","b":"DEPARTMENT","name":"屬於","card":"M:1"},{"a":"TEAM","b":"EMPLOYEE","name":"負責人","card":"M:1"}]},"cap":"例題 3.1 的數據表（數據由本單元自訂；團隊成員與 p.118 相同）"},{"sim":{"db":"company","sql":"SELECT TNAME, COUNT(*), COUNT(ENAME) FROM EMPLOYEE\n    RIGHT JOIN TEAM ON TEAMID = TEAM.ID\n    GROUP BY TEAM.ID"},"cap":"p.118–119：比較 Delta 一組的 COUNT(*) 和 COUNT(ENAME)。"},{"fix":{"bad":"SELECT TNAME, AVG(SALARY) FROM EMPLOYEE\n    RIGHT JOIN TEAM ON TEAMID = TEAM.ID\n    WHERE SALARY >= 20000 GROUP BY TEAM.ID","good":"SELECT TNAME, AVG(SALARY) FROM EMPLOYEE\n    RIGHT JOIN TEAM ON TEAMID = TEAM.ID\n    GROUP BY TEAM.ID HAVING AVG(SALARY) >= 20000","why":"例題 3.1(c)：WHERE 先排除了薪金低於 20000 的**員工**，再計平均；題目要排除平均薪金低於 20000 的**團隊**，要用 HAVING。（沒有員工的團隊 AVG 是 NULL，HAVING 也會把它篩走。）"}}],"tries":[{"id":"a3a-s4-t1","pts":4,"src":"教科書 p.118 例題 3.1(b)(ii)","db":"company","sql":"SELECT TNAME, COUNT(*) FROM EMPLOYEE\n    RIGHT JOIN TEAM ON TEAMID = TEAM.ID\n    GROUP BY TEAM.ID ORDER BY TEAM.ID","q":"先估：結果是什麼？","ask":"table","options":["Alpha, 1\nBeta, 2\nGamma, 2\nDelta, 1","Alpha, 1\nBeta, 2\nGamma, 2\nDelta, 0","Alpha, 1\nBeta, 2\nGamma, 2","Alpha, 1\nBeta, 2\nGamma, 2\nDelta, NULL"],"why":"RIGHT JOIN 保留 Delta，那一行的 EMPLOYEE 欄位全是 NULL；COUNT(*) 點算的是行數，所以 Delta 得 1（錯誤的人數）。改用 COUNT(ENAME) 便得 0。"}],"practice":[{"id":"a3a-s4-p1","type":"mc","pts":1,"src":"教科書 p.116 例題 3.1(a)(i)","db":"company","q":"每位員工都有部門，部分部門沒有員工。要列出每位員工的名字及其部門名稱，**不要**列出沒有員工的部門。以下哪一句**不**正確？","options":["SELECT ENAME, DNAME FROM EMPLOYEE LEFT JOIN DEPARTMENT ON DEPID = DEPARTMENT.ID","SELECT ENAME, DNAME FROM EMPLOYEE INNER JOIN DEPARTMENT ON DEPID = DEPARTMENT.ID","SELECT ENAME, DNAME FROM EMPLOYEE RIGHT JOIN DEPARTMENT ON DEPID = DEPARTMENT.ID","SELECT ENAME, DNAME FROM DEPARTMENT RIGHT JOIN EMPLOYEE ON DEPID = DEPARTMENT.ID"],"answer":2,"hint":"RIGHT JOIN 會保留右方 DEPARTMENT 的所有記錄，包括沒有員工的 HR。"},{"id":"a3a-s4-p2","type":"mc","pts":2,"src":"教科書 p.116、p.119 例題 3.1(c)","db":"company","verify":true,"ask":"table","q":"經理用了以下語句。結果是什麼？","sql":"SELECT TNAME, AVG(SALARY) FROM EMPLOYEE\n    RIGHT JOIN TEAM ON TEAMID = TEAM.ID\n    WHERE SALARY >= 20000 GROUP BY TEAM.ID","options":["Alpha, 25000\nBeta, 22000\nGamma, 32000","Alpha, 25000\nGamma, 23500","Alpha, 25000\nBeta, 19500\nGamma, 23500","Alpha, 25000\nBeta, 22000\nGamma, 32000\nDelta, NULL"],"answer":0,"hint":"WHERE 先篩走 Dio（15000）、Eva（17000）和 Delta 的 NULL 行，再分組計平均。Beta 只剩 Ben。"},{"id":"a3a-s4-p3","type":"complete","pts":2,"src":"教科書 p.119 例題 3.1(b)(ii)","db":"company","q":"列出每個團隊的名稱及團隊人數（沒有成員的團隊要顯示 0）。","template":"SELECT TNAME, COUNT(［1］) FROM EMPLOYEE\n    RIGHT JOIN TEAM ON TEAMID = TEAM.ID\n    GROUP BY ［2］","ref":["ENAME","TEAM.ID"],"hint":"點算一個在沒有成員時會是 NULL 的欄位；按團隊分組（不可以用 TEAMID，因為 Delta 那一行的 TEAMID 是 NULL）。"}]},{"id":"s5","title":"綜合：連接、篩選與分組","pages":"教科書 p.120–121（測試站 3.1）","learn":[{"pts":["測試站 3.1：PROD（PID, NAME, STOCK, PRICE, SID）、SHOP（SID, NAME, MID, LOCATION）、MANR（MID, NAME）。三個數據表都有 NAME，SHOP 和 PROD 都有 SID。（p.120）","寫連接題的步驟：① 要哪些欄位？來自哪些數據表？② 哪個數據表的記錄要全部保留？→ 選 INNER／LEFT／RIGHT；③ 寫 ON 條件；④ WHERE → GROUP BY → HAVING → ORDER BY。","(a)(ii)「結果應包含不具店舖識別碼的產品」→ PROD 在左方用 LEFT JOIN。","(a)(iii) 每間店舖的產品數量：SHOP 在左方用 LEFT JOIN，點算 `COUNT(PID)`；沒有產品的店舖得 0。","(b) `MID(PID, 1, 1)` 取 PID 第 1 個字母（產品類別）；`GROUP BY SHOP.SID, MID(PID, 1, 1)` 按「店舖 + 類別」分組。（p.121）"]},{"note":"**注意**：在 LEFT JOIN 之後用 WHERE 篩選**右方**數據表的欄位（例如 `WHERE PRICE > 25`），右方是 NULL 的行會被篩走，LEFT JOIN 保留的記錄便消失了。測試站 3.1(a)(iv) 的答案因此不會列出沒有這類產品的店舖。"},{"sim":{"db":"shop","sql":"SELECT SHOP.NAME, MID(PID, 1, 1), MAX(PRICE) FROM SHOP\n    LEFT JOIN PROD ON SHOP.SID = PROD.SID\n    GROUP BY SHOP.SID, MID(PID, 1, 1)"},"cap":"測試站 3.1(b)（p.121）：每間店舖每個產品類別中最高的單價。"}],"tries":[{"id":"a3a-s5-t1","pts":4,"src":"教科書 p.121 測試站 3.1(a)(iii)","db":"shop","sql":"SELECT SHOP.NAME, COUNT(PID) FROM SHOP\n    LEFT JOIN PROD ON SHOP.SID = PROD.SID\n    GROUP BY SHOP.SID","q":"先估：Tai Po Shop（沒有任何產品）那一行的 COUNT(PID) 是什麼？","ask":{"cell":[4,"COUNT(PID)"]},"options":["0","1","NULL","不會出現這一行"],"why":"SHOP 在左方，LEFT JOIN 保留 Tai Po Shop；那一行的 PID 是 NULL，COUNT(PID) 不計 NULL，所以是 0。"}],"practice":[{"id":"a3a-s5-p1","type":"complete","pts":2,"src":"教科書 p.120 測試站 3.1(a)(ii)","db":"shop","q":"列出所有名稱以「Pen」作結，且單價低於 11.5 元的產品之名稱及店舖位置。結果應包含不具店舖識別碼的產品。","template":"SELECT PROD.NAME, LOCATION FROM PROD ［1］ SHOP ON PROD.SID = SHOP.SID\n    WHERE ［2］ AND PRICE \u003c 11.5","ref":["LEFT JOIN","PROD.NAME LIKE '%Pen'"],"hint":"PROD 在左方，要保留沒有店舖的產品。「以 Pen 作結」用 LIKE 和 %；NAME 要註明來自 PROD。"},{"id":"a3a-s5-p2","type":"mc","pts":1,"src":"教科書 p.120 測試站 3.1(a)(i)","db":"shop","verify":true,"ask":{"col":"NAME"},"q":"以下語句輸出什麼？","sql":"SELECT SHOP.NAME FROM SHOP INNER JOIN MANR ON SHOP.MID = MANR.MID\n    WHERE MANR.NAME = 'Ada'","options":["Central Shop, Sha Tin Shop","Central Shop","Ada","Central Shop, Mong Kok Shop, Sha Tin Shop"],"answer":0,"hint":"Ada 的 MID 是 1；SHOP 中 MID 是 1 的店舖有兩間。"},{"id":"a3a-s5-p3","type":"mc","pts":2,"src":"教科書 p.121 測試站 3.1(c)（答案已更正，見單元檔頭）","db":"shop","q":"經理要找出每間店舖的平均產品單價，計算時排除單價 1000 元或以上的產品。以下哪一句正確？","options":["SELECT NAME, AVG(PRICE) FROM SHOP s LEFT JOIN PROD p ON s.SID = p.SID\n    GROUP BY s.SID HAVING PRICE > 1000","SELECT s.NAME, AVG(PRICE) FROM SHOP s LEFT JOIN PROD p ON s.SID = p.SID\n    GROUP BY s.SID HAVING PRICE \u003c 1000","SELECT s.NAME, AVG(PRICE) FROM SHOP s LEFT JOIN PROD p ON s.SID = p.SID\n    WHERE PRICE \u003c 1000 GROUP BY s.SID","SELECT s.NAME, AVG(PRICE) FROM SHOP s LEFT JOIN PROD p ON s.SID = p.SID\n    WHERE PRICE > 1000 GROUP BY s.SID"],"answer":2,"hint":"排除個別**產品**（分組前）用 WHERE；NAME 兩個數據表都有，要寫 s.NAME；排除 ≥ 1000 即保留 \u003c 1000。"}]},{"id":"write","kind":"write","title":"寫 SQL","pages":"教科書 p.108–121","intro":"在編輯器寫一句 SELECT 語句，可以先按 ▶ 執行自己檢查，再按「提交評核」。評核時會用另外幾組數據測試，所以不可以把答案「寫死」。","tasks":[{"id":"a3a-w1","pts":10,"title":"每位學生的學會","src":"教科書 p.108–110","db":"club","q":"列出**所有**學生的學生識別碼 SID、名字及所屬學會的名稱（欄位名稱改為 `CLUBNAME`）；沒有學會的學生也要列出。結果按 SID 遞升排序。","starter":"SELECT SID, NAME FROM STUDENT","ref":"SELECT SID, s.NAME, c.NAME AS CLUBNAME\n    FROM STUDENT s LEFT JOIN CLUB c ON s.CID = c.CID\n    ORDER BY SID","check":{"order":true},"rules":[{"must":"JOIN","msg":"要用 JOIN 連接 STUDENT 和 CLUB。"}],"hint":"STUDENT 在左方，用 `LEFT JOIN CLUB c ON s.CID = c.CID`；兩個數據表都有 NAME，要寫 `s.NAME`、`c.NAME AS CLUBNAME`。"},{"id":"a3a-w2","pts":12,"title":"每個團隊的人數","src":"教科書 p.118–119 例題 3.1(b)(ii)","db":"company","q":"不可使用 TEAM 的 MEMNUM。列出**每個**團隊的名稱 TNAME 及其員工人數；沒有員工的團隊要顯示 0。","starter":"SELECT TNAME FROM TEAM","ref":"SELECT TNAME, COUNT(ENAME) FROM EMPLOYEE\n    RIGHT JOIN TEAM ON TEAMID = TEAM.ID\n    GROUP BY TEAM.ID","rules":[{"must":"JOIN","msg":"要連接 EMPLOYEE 和 TEAM。"},{"mustNot":"MEMNUM","msg":"不可使用 MEMNUM，要用 COUNT() 計算。"},{"must":"GROUP BY","msg":"要按團隊分組。"}],"hint":"要保留所有團隊：`TEAM LEFT JOIN EMPLOYEE` 或 `EMPLOYEE RIGHT JOIN TEAM`。用 `COUNT(ENAME)`（不是 COUNT(*)），按 `TEAM.ID` 分組。"},{"id":"a3a-w3","pts":13,"title":"店舖的平均單價","src":"教科書 p.121 測試站 3.1(c)","db":"shop","q":"列出每間（有產品的）店舖的店舖名稱及平均產品單價。計算時**排除單價 1000 元或以上**的產品。","starter":"SELECT NAME, AVG(PRICE) FROM SHOP","ref":"SELECT s.NAME, AVG(PRICE) FROM SHOP s\n    INNER JOIN PROD p ON s.SID = p.SID\n    WHERE PRICE \u003c 1000\n    GROUP BY s.SID","rules":[{"must":"GROUP BY","msg":"要按店舖分組。"}],"hint":"連接 SHOP 和 PROD（`s.SID = p.SID`）；先用 WHERE 排除貴的產品，再 `GROUP BY s.SID`。SHOP 和 PROD 都有 NAME，要寫 `s.NAME`。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.104–121","items":[{"id":"a3a-q1","pts":4,"src":"自擬（DSE 卷二A 題型）","tags":[{"t":"hot","why":"DSE 卷二A 幾乎每年都要求寫 JOIN／等連接語句，並常問結果有多少行"}],"db":"club","verify":true,"ask":"rows","q":"執行以下語句，結果有多少行？","sql":"SELECT * FROM CLUB LEFT JOIN STUDENT ON CLUB.CID = STUDENT.CID","options":["6","7","8","11"],"answer":"B","why":"CLUB 在左方：6 行相符的記錄，加上沒有會員的 English Club，共 7 行；Ben 不會出現。"},{"id":"a3a-q2","pts":4,"src":"教科書 p.118–119 例題 3.1(b)","tags":[{"t":"trap","why":"COUNT(*) 會點算外連接產生的 NULL 行"}],"db":"club","verify":true,"ask":{"cell":[3,"N"]},"q":"以下語句中，English Club（第 3 行）的 N 是多少？","sql":"SELECT c.NAME, COUNT(*) AS N FROM CLUB c\n    LEFT JOIN STUDENT s ON c.CID = s.CID\n    GROUP BY c.CID ORDER BY c.CID","options":["0","1","NULL","7"],"answer":"B","why":"English Club 沒有會員，但 LEFT JOIN 仍產生一行（學生欄位是 NULL）；COUNT(*) 點算行數，得 1。應改用 COUNT(s.SID)。"},{"id":"a3a-q3","pts":4,"src":"教科書 p.119 例題 3.1(c)","tags":[{"t":"trap","why":"WHERE 與 HAVING 混淆"}],"q":"要列出平均分高於 60 的學會名稱。以下哪一句正確？","options":["SELECT c.NAME FROM STUDENT s JOIN CLUB c ON s.CID = c.CID\n    WHERE AVG(SCORE) > 60 GROUP BY c.CID","SELECT c.NAME FROM STUDENT s JOIN CLUB c ON s.CID = c.CID\n    WHERE SCORE > 60 GROUP BY c.CID","SELECT c.NAME FROM STUDENT s JOIN CLUB c ON s.CID = c.CID\n    GROUP BY c.CID HAVING AVG(SCORE) > 60","SELECT c.NAME FROM STUDENT s JOIN CLUB c ON s.CID = c.CID\n    HAVING AVG(SCORE) > 60 GROUP BY c.CID"],"answer":"C","why":"A：聚合函數不可放在 WHERE。B：先篩走 60 分或以下的學生才計，意思不同。D：HAVING 要寫在 GROUP BY 之後。"},{"id":"a3a-q4","pts":4,"src":"教科書 p.110","db":"club","verify":true,"ask":"rows","q":"以下語句的結果有多少行？","sql":"SELECT s.NAME, c.NAME FROM STUDENT s INNER JOIN CLUB c\n    ON s.CID = c.CID WHERE c.NAME = 'Science Club' OR s.SCORE > 85","options":["3","4","5","6"],"answer":"B","why":"Science Club 有 Eva、Gabe、Dio；分數高於 85 的 Clem（Chess）和 Ben（沒有學會，INNER JOIN 已排除）。共 4 行。"},{"id":"a3a-q5","pts":4,"src":"教科書 p.116–117 例題 3.1(a)","tags":[{"t":"hot","why":"DSE 卷二A 幾乎每年都要求寫 JOIN／等連接語句，並常問結果有多少行"}],"q":"TEAM（ID, TNAME, LEADID）中部分團隊未有負責人（LEADID 是 NULL）。要列出**每個**團隊的名稱及負責人的名字。以下哪一句正確？","options":["SELECT TNAME, ENAME FROM TEAM INNER JOIN EMPLOYEE ON LEADID = EMPLOYEE.ID","SELECT TNAME, ENAME FROM TEAM LEFT JOIN EMPLOYEE ON TEAM.ID = TEAMID","SELECT TNAME, ENAME FROM TEAM LEFT JOIN EMPLOYEE ON LEADID = EMPLOYEE.ID","SELECT TNAME, ENAME FROM TEAM RIGHT JOIN EMPLOYEE ON LEADID = EMPLOYEE.ID"],"answer":"C","why":"TEAM 在左方用 LEFT JOIN 保留沒有負責人的團隊；負責人的連接條件是 LEADID = EMPLOYEE.ID（B 列出的是團隊成員）。"}]},{"id":"more","kind":"endless","title":"無限練習","gens":["sqlJoin","sqlAgg"],"intro":"隨機生成 INNER／LEFT／RIGHT JOIN 結果行數及連接後分組的題目，答案由 SQL 引擎計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]},{"id":"a3b","title":"連接數據表（二）：等連接、自連接、多個數據表、CROSS JOIN","book":"教科書 選修A 第 3 章 p.122–134","key":"A-a3b-hmac-f36c852fa1","theory":false,"dbs":{"club":{"STUDENT":[["SID","NAME","SEX","CLASS","SCORE","CID"],[["03493","Ada","F","3A",0,2],["03496","Clem","F","3B",89,1],["03505","Eva","F","3B",83,4],["03506","Gabe","M","3C",47,4],["03510","Finn","M","3B",35,1],["03513","Dio","M","3C",67,4],["03517","Ben","M","3A",86,null]],["SID"]],"CLUB":[["CID","NAME","ROOM","TEACH"],[[1,"Chess Club",501,"Mr Chan"],[2,"Art Club",402,"Mrs Lee"],[3,"English Club",203,"Mr Suen"],[4,"Science Club",502,"Mr Wong"]],["CID"]]},"club2":{"STUDENT":[["SID","NAME","SEX","CLASS","SCORE","CID"],[["03493","Ada","F","3A",0,2],["03496","Clem","F","3B",89,1],["03505","Eva","F","3B",83,4],["03506","Gabe","M","3C",47,4],["03510","Finn","M","3B",35,1],["03513","Dio","M","3C",67,4],["03517","Ben","M","3A",86,null]],["SID"]],"CLUB":[["CID","CLUBNAME","ROOM","TEACH"],[[1,"Chess Club",501,"Mr Chan"],[2,"Art Club",402,"Mrs Lee"],[3,"English Club",203,"Mr Suen"],[4,"Science Club",502,"Mr Wong"]],["CID"]]},"monitor":{"STUDENT":[["SID","NAME","SEX","CLASS","CMSID","SCORE"],[["03493","Ada","F","3A","03517",0],["03496","Clem","F","3B","03505",89],["03505","Eva","F","3B","03505",83],["03506","Gabe","M","3C","03513",47],["03510","Finn","M","3B","03505",35],["03513","Dio","M","3C","03513",67],["03517","Ben","M","3A","03517",86]],["SID"]]},"sc":{"STUDENT":[["SID","NAME","SEX","CLASS","SCORE"],[["03493","Ada","F","3A",0],["03496","Clem","F","3B",89],["03505","Eva","F","3B",83],["03506","Gabe","M","3C",47],["03510","Finn","M","3B",35],["03513","Dio","M","3C",67],["03517","Ben","M","3A",86]],["SID"]],"SC":[["SID","CID"],[["03493",2],["03496",1],["03496",2],["03496",4],["03505",4],["03506",4],["03510",1],["03513",4]],["SID","CID"]],"CLUB":[["CID","NAME","ROOM","TEACH"],[[1,"Chess Club",501,"Mr Chan"],[2,"Art Club",402,"Mrs Lee"],[3,"English Club",203,"Mr Suen"],[4,"Science Club",502,"Mr Wong"]],["CID"]]},"fruit":{"L":[["LID"],[["A"],["B"],["C"]],["LID"]],"R":[["RID"],[["D"],["E"],["F"]],["RID"]],"BUYER":[["BNAME","NA","NO"],[["Ada",4,7],["Ben",9,6],["Clem",6,7]],["BNAME"]],"SELLER":[["SNAME","PA","PO"],[["Dio",13.1,12],["Eva",11.2,13.8],["Finn",14,11.4]],["SNAME"]]},"company":{"EMPLOYEE":[["ID","ENAME","SEX","TEAMID","SALARY"],[[1,"Ada","F",1,30000],[2,"Ben","M",1,22000],[3,"Clem","F",2,26000],[4,"Dio","M",2,35000],[5,"Eva","F",2,18000],[6,"Finn","M",3,40000],[7,"Gabe","M",4,21000],[8,"Hana","F",3,27000]],["ID"]],"TEAM":[["ID","TNAME","LEADID","DEPID"],[[1,"Alpha",1,1],[2,"Beta",4,2],[3,"Gamma",6,3],[4,"Delta",7,2]],["ID"]],"DEPARTMENT":[["ID","DNAME"],[[1,"IT Support"],[2,"Sales"],[3,"IT Security"]],["ID"]]},"shop":{"PROD":[["PID","PNAME","STOCK","PRICE","SID"],[[1,"Pen",150,5,1],[2,"Ruler",80,3,1],[3,"Pen",200,5.5,2],[4,"Eraser",120,2,2],[5,"Glue",60,8,3],[6,"Tape",110,6,3],[7,"Stapler",30,25,4],[8,"Pen",140,4.5,5],[9,"Folder",90,10,5],[10,"Clip",300,1,4]],["PID"]],"SHOP":[["SID","SNAME","MID","DIST"],[[1,"Shop A",1,"Kowloon"],[2,"Shop B",2,"Kowloon"],[3,"Shop C",1,"New Territories"],[4,"Shop D",3,"Hong Kong Island"],[5,"Shop E",1,"Kowloon"]],["SID"]],"MANR":[["MID","MNAME","SEX"],[[1,"Paul","M"],[2,"Mary","F"],[3,"Kate","F"],[4,"Tom","M"]],["MID"]]}},"sections":[{"id":"s1","title":"等連接與 NATURAL JOIN","pages":"教科書 p.122–125","learn":[{"pts":["**等連接（equi-join）**：在 `FROM` 列出多個數據表（用逗號分隔），在 `WHERE` 寫連接條件。結果與 INNER JOIN 相同。（p.124）","`SELECT * FROM STUDENT, CLUB WHERE STUDENT.CID = CLUB.CID` 等於 `SELECT * FROM STUDENT INNER JOIN CLUB ON STUDENT.CID = CLUB.CID`。","等連接是 DSE 最常見的寫法，寫法短，適合連接三個或以上的數據表。但它只能做 INNER JOIN，**不能**保留沒有配對的記錄。","**NATURAL JOIN（自然連接）**：自動用兩個數據表中**名稱相同的所有欄位**連接，不寫 ON。（p.124–125）","STUDENT 和 CLUB 有**兩對**同名欄位：NAME 和 CID。NATURAL JOIN 會要求兩者都相等——學生名字當然不會等於學會名稱，所以結果是空的。把 CLUB 的 NAME 改名為 CLUBNAME 後，NATURAL JOIN 才等於以 CID 連接。（p.124–125）"]},{"h":"拆解 SQL 秘技（p.122–123）"},{"pts":["SQL 可分成四部分：**欄名選擇**（SELECT）→ **從哪個表**（FROM，包括連接）→ **條件**（WHERE；HAVING 要在分組後）→ **排序／分組**（GROUP BY、ORDER BY）。","先在題目圈出要顯示的欄位，找出它們來自哪些數據表，再找出連接這些數據表的外鍵碼。"]},{"code":"SELECT a.CName, b.PName, c.Quantity, a.Address\n    FROM Customers a, Products b, Orders c\n    WHERE b.PID = c.PID AND c.CID = a.CID\n    ORDER BY c.Quantity DESC","cap":"p.123：三個數據表要兩個連接條件。"},{"sim":{"db":"club","sql":"SELECT * FROM STUDENT NATURAL JOIN CLUB"},"cap":"p.124：STUDENT 和 CLUB 都有 NAME 和 CID。猜猜結果有多少行？再試改成等連接 `SELECT * FROM STUDENT, CLUB WHERE STUDENT.CID = CLUB.CID`。"}],"tries":[{"id":"a3b-s1-t1","pts":4,"src":"教科書 p.124","db":"club","sql":"SELECT * FROM STUDENT NATURAL JOIN CLUB","q":"先估：STUDENT 和 CLUB 都有欄位 NAME 和 CID。結果有多少行？","ask":"rows","options":["0","6","7","28"],"why":"NATURAL JOIN 要求所有同名欄位都相等：STUDENT.NAME = CLUB.NAME（學生名字 = 學會名稱）永遠不成立，所以沒有任何記錄。"}],"practice":[{"id":"a3b-s1-p1","type":"fill","pts":1,"src":"教科書 p.125","db":"club2","sql":"SELECT * FROM STUDENT NATURAL JOIN CLUB","q":"在 club2 中，CLUB 的 NAME 已改名為 CLUBNAME。以下語句的結果有多少行？","blanks":[{"label":"行數","ask":"rows"}],"hint":"現在只有 CID 同名，NATURAL JOIN 等於以 CID 做 INNER JOIN。"},{"id":"a3b-s1-p2","type":"mc","pts":2,"src":"教科書 p.124","db":"club","q":"以下哪一句的結果與 `SELECT STUDENT.NAME, ROOM FROM STUDENT INNER JOIN CLUB ON STUDENT.CID = CLUB.CID` **不同**？","options":["SELECT STUDENT.NAME, ROOM FROM STUDENT, CLUB WHERE STUDENT.CID = CLUB.CID","SELECT STUDENT.NAME, ROOM FROM STUDENT JOIN CLUB ON CLUB.CID = STUDENT.CID","SELECT STUDENT.NAME, ROOM FROM CLUB, STUDENT WHERE CLUB.CID = STUDENT.CID","SELECT STUDENT.NAME, ROOM FROM STUDENT LEFT JOIN CLUB ON STUDENT.CID = CLUB.CID"],"answer":3,"hint":"等連接、JOIN、交換數據表次序都是 INNER JOIN；LEFT JOIN 會多了 Ben。"},{"id":"a3b-s1-p3","type":"complete","pts":2,"src":"教科書 p.124","db":"club","q":"用**等連接**列出每位學生的名字及其學會的負責老師。","template":"SELECT STUDENT.NAME, TEACH FROM STUDENT, CLUB WHERE ［1］","ref":["STUDENT.CID = CLUB.CID"],"hint":"等連接的連接條件寫在 WHERE。"}]},{"id":"s2","title":"自連接","pages":"教科書 p.125–126","learn":[{"pts":["**自連接（self join）**：把一個數據表與**自己**連接。要給同一個數據表**兩個不同的別名**，例如 s1、s2，DBMS 便當作兩個數據表。（p.125）","表 3.9：STUDENT 的 CMSID 是班長的 SID。要列出每個學生及其班長的名字：`s1.CMSID = s2.SID`，s1 是學生，s2 是班長。（p.125）","自連接也可以用等連接寫法：`FROM STUDENT s1, STUDENT s2 WHERE …`。","找「分數差異小於 16」的學習夥伴：`WHERE ABS(s1.SCORE - s2.SCORE) \u003c 16`。但結果會有**自我配對**（Ada & Ada）和**重複配對**（Ben & Clem、Clem & Ben）。（p.126）","加上 `s1.SID \u003c s2.SID`：兩人的 SID 必須不同（沒有自我配對），而每對重複的配對只有一個符合「小於」（沒有重複）。（p.126 試想想）","想分數較高的學生排第一位：改用 `s1.SCORE >= s2.SCORE AND s1.SID \u003c> s2.SID`。（p.126 試想想）"]},{"sim":{"db":"monitor","sql":"SELECT s1.NAME, s2.NAME AS CMNAME FROM STUDENT s1\n    INNER JOIN STUDENT s2 ON s1.CMSID = s2.SID"},"cap":"p.125：每個學生及其班長。"},{"sim":{"db":"monitor","sql":"SELECT s1.NAME, s1.SCORE, s2.NAME, s2.SCORE\n    FROM STUDENT s1, STUDENT s2\n    WHERE ABS(s1.SCORE - s2.SCORE) \u003c 16"},"cap":"p.126：先執行看 15 行結果，再加上 `AND s1.SID \u003c s2.SID`。"}],"tries":[{"id":"a3b-s2-t1","pts":4,"src":"教科書 p.126","db":"monitor","sql":"SELECT s1.NAME, s1.SCORE, s2.NAME, s2.SCORE\n    FROM STUDENT s1, STUDENT s2\n    WHERE ABS(s1.SCORE - s2.SCORE) \u003c 16 AND s1.SID \u003c s2.SID","q":"先估：結果有多少行？（提示：沒有條件 `s1.SID \u003c s2.SID` 時有 15 行。）","ask":"rows","options":["4","7","8","15"],"why":"15 行中有 7 行是自我配對；餘下 8 行是 4 對重複配對，每對只留一行，所以是 4 行。"}],"practice":[{"id":"a3b-s2-p1","type":"mc","pts":2,"src":"教科書 p.125","db":"monitor","verify":true,"ask":{"col":"NAME"},"q":"以下語句輸出哪些名字？","sql":"SELECT s1.NAME FROM STUDENT s1, STUDENT s2\n    WHERE s1.CMSID = s2.SID AND s2.NAME = 'Eva'","options":["Clem, Eva, Finn","Clem, Finn","Eva","Eva, Eva, Eva"],"answer":0,"hint":"找出班長是 Eva 的學生；Eva 自己也是 3B 班的學生，她的班長就是她自己。"},{"id":"a3b-s2-p2","type":"complete","pts":2,"src":"教科書 p.125","db":"monitor","q":"列出每個學生的名字及其班長的分數。","template":"SELECT s1.NAME, ［1］ FROM STUDENT s1, STUDENT s2 WHERE ［2］","ref":["s2.SCORE","s1.CMSID = s2.SID"],"hint":"s2 代表班長：s1 的 CMSID 要等於 s2 的 SID。"},{"id":"a3b-s2-p3","type":"mc","pts":1,"src":"教科書 p.126 試想想","q":"在自連接中加上條件 `s1.SID \u003c s2.SID` 的作用是什麼？","options":["只移除自我配對","只移除重複配對","移除自我配對和重複配對","令分數較高的學生排在第一位"],"answer":2,"hint":"SID 相同時「\u003c」不成立；兩個方向的配對只有一個方向成立。"}]},{"id":"s3","title":"連接多於兩個數據表","pages":"教科書 p.127–128","learn":[{"pts":["學生可加入多個學會：STUDENT（SID …）、SC（SID, CID）、CLUB（CID …）。SC 是**中間的數據表**，記錄「哪個學生加入了哪個學會」。（p.127）","連接三個數據表，要**兩個連接條件**：STUDENT—SC（SID）、SC—CLUB（CID）。","用兩次 LEFT JOIN：`FROM STUDENT s LEFT JOIN SC ON SC.SID = s.SID LEFT JOIN CLUB c ON c.CID = SC.CID`——保留所有學生，Ben 的 CLUBNAME 是 NULL；Clem 加入了 3 個學會，所以佔 3 行。（p.127–128）","用等連接：`FROM STUDENT s, SC, CLUB c WHERE SC.SID = s.SID AND c.CID = SC.CID`——等連接是 INNER JOIN，**Ben 不會出現**。（p.128）","擴闊視野：`GROUP_CONCAT(c.NAME)` 配合 `GROUP BY s.SID`，可把 Clem 的三個學會合併成一格（MySQL 獨有函數）。（p.128）"]},{"er":{"entities":[{"name":"STUDENT","attrs":["*SID","NAME","SEX","CLASS","SCORE"]},{"name":"SC","attrs":["*SID","*CID"]},{"name":"CLUB","attrs":["*CID","NAME","ROOM","TEACH"]}],"rels":[{"a":"STUDENT","b":"SC","name":"","card":"1:M"},{"a":"CLUB","b":"SC","name":"","card":"1:M"}]},"cap":"學生與學會是多對多關係，用中間的數據表 SC 連接。"},{"sim":{"db":"sc","sql":"SELECT s.SID, s.NAME, c.NAME AS CLUBNAME FROM STUDENT s\n    LEFT JOIN SC ON SC.SID = s.SID\n    LEFT JOIN CLUB c ON c.CID = SC.CID"},"cap":"p.127–128：數一數 Clem 出現了多少次。"},{"sim":{"db":"sc","sql":"SELECT s.NAME, GROUP_CONCAT(c.NAME) AS CNAME FROM STUDENT s\n    LEFT JOIN SC ON SC.SID = s.SID\n    LEFT JOIN CLUB c ON c.CID = SC.CID GROUP BY s.SID"},"cap":"擴闊視野（p.128）：GROUP_CONCAT 把每組的學會名稱以逗號合併（次序可能與書中不同）。"},{"warn":"等連接漏寫其中一個連接條件，例如只寫 `WHERE SC.SID = s.SID`，SC 的每一行便會與 CLUB 的**每一行**配對（4 倍行數），結果錯得很嚴重。N 個數據表至少要 N − 1 個連接條件。"}],"tries":[{"id":"a3b-s3-t1","pts":4,"src":"教科書 p.128","db":"sc","sql":"SELECT s.SID, s.NAME, c.NAME AS CLUBNAME FROM STUDENT s, SC, CLUB c\n    WHERE SC.SID = s.SID AND c.CID = SC.CID","q":"先估：用等連接連接三個數據表，結果有多少行？","ask":"rows","options":["7","8","9","28"],"why":"SC 有 8 行，每行都配對到一個學生和一個學會，所以是 8 行。用兩次 LEFT JOIN 則有 9 行（多了 Ben）。"}],"practice":[{"id":"a3b-s3-p1","type":"fill","pts":2,"src":"自擬（p.127–128 延伸）","db":"sc","sql":"SELECT s.NAME, c.NAME FROM STUDENT s, SC, CLUB c\n    WHERE SC.SID = s.SID","q":"以下等連接漏寫了 SC 與 CLUB 的連接條件。結果有多少行？","blanks":[{"label":"行數","ask":"rows"}],"hint":"SC 與 STUDENT 配對得 8 行，每行再與 CLUB 的 4 行全部配對。"},{"id":"a3b-s3-p2","type":"complete","pts":2,"src":"教科書 p.127–128","db":"sc","q":"用等連接列出所有加入了 Science Club 的學生之名字。","template":"SELECT s.NAME FROM STUDENT s, SC, CLUB c\n    WHERE SC.SID = s.SID AND ［1］ AND ［2］ = 'Science Club'","ref":["c.CID = SC.CID","c.NAME"],"hint":"要再寫 SC 與 CLUB 的連接條件；學會名稱是 c.NAME。"},{"id":"a3b-s3-p3","type":"mc","pts":1,"src":"教科書 p.128","db":"sc","verify":true,"ask":"table","q":"以下語句的結果是什麼？","sql":"SELECT s.NAME, COUNT(SC.CID) FROM STUDENT s\n    LEFT JOIN SC ON SC.SID = s.SID\n    WHERE s.CLASS = '3A' GROUP BY s.SID","options":["Ada, 1\nBen, 0","Ada, 1\nBen, 1","Ada, 1","Ada, 1\nBen, NULL"],"answer":0,"hint":"Ben 沒有加入學會，LEFT JOIN 後 SC.CID 是 NULL，COUNT(SC.CID) 得 0。"}]},{"id":"s4","title":"CROSS JOIN","pages":"教科書 p.129–130","learn":[{"pts":["**CROSS JOIN（交叉連接）**：不用外鍵碼，把左方數據表的**每一行**與右方數據表的**每一行**配對。（p.129）","結果行數 = 左方行數 × 右方行數。L（3 行）CROSS JOIN R（3 行）得 9 行。","實際用途（p.129–130）：3 個買家（各要若干蘋果 NA、橙 NO）× 3 個賣家（蘋果價 PA、橙價 PO）——列出每個買家向每個賣家購買的總價 `PA*NA+PO*NO AS COST`，再 `ORDER BY BNAME, COST`，每個買家的第一行就是最便宜的賣家。","略去 CROSS JOIN 關鍵字也可以：`FROM BUYER, SELLER`（沒有 WHERE 連接條件）就是 CROSS JOIN。（p.130）","所以等連接漏寫連接條件，其實就變成了 CROSS JOIN。"]},{"sim":{"db":"fruit","sql":"SELECT BNAME, SNAME, PA*NA+PO*NO AS COST FROM BUYER\n    CROSS JOIN SELLER ORDER BY BNAME, COST"},"cap":"p.130：找出每個買家應向哪位賣家購買。"}],"tries":[{"id":"a3b-s4-t1","pts":4,"src":"教科書 p.130","db":"fruit","sql":"SELECT BNAME, SNAME, PA*NA+PO*NO AS COST FROM BUYER\n    CROSS JOIN SELLER ORDER BY BNAME, COST","q":"先估：Ben（9 個蘋果、6 個橙）應向哪位賣家購買？即結果第 4 行的 SNAME。","ask":{"cell":[4,"SNAME"]},"options":["Dio","Eva","Finn","Ben"],"why":"Dio：9 × 13.1 + 6 × 12.0 = 189.9；Eva：9 × 11.2 + 6 × 13.8 = 183.6；Finn：9 × 14.0 + 6 × 11.4 = 194.4。Eva 最便宜。"}],"practice":[{"id":"a3b-s4-p1","type":"fill","pts":2,"src":"教科書 p.129","db":"fruit","sql":"SELECT * FROM BUYER, SELLER","q":"BUYER 有 3 行，SELLER 有 3 行。以下語句的結果有多少行？","blanks":[{"label":"行數","ask":"rows"}],"hint":"沒有連接條件 = CROSS JOIN。"},{"id":"a3b-s4-p2","type":"mc","pts":1,"src":"教科書 p.130","db":"fruit","verify":true,"ask":{"cell":[1,"COST"]},"q":"Clem 向 Finn 購買的總價是多少？","sql":"SELECT PA*NA+PO*NO AS COST FROM BUYER CROSS JOIN SELLER WHERE BNAME = 'Clem' AND SNAME = 'Finn'","options":["163.8","162.6","163.4","177.6"],"answer":0,"hint":"6 × 14.0 + 7 × 11.4。"},{"id":"a3b-s4-p3","type":"complete","pts":2,"src":"教科書 p.130","db":"fruit","q":"只列出 Ada 向每位賣家購買的總價（欄位名稱 COST），由最便宜排到最貴。","template":"SELECT SNAME, PA*NA+PO*NO AS COST FROM BUYER, SELLER\n    WHERE BNAME = 'Ada' ORDER BY ［1］","ref":["COST"],"check":{"order":true},"hint":"可以用欄位的別名排序，遞升是預設次序。"}]},{"id":"s5","title":"綜合：三個數據表","pages":"教科書 p.131–134（例題 3.2、測試站 3.2）","learn":[{"pts":["例題 3.2：EMPLOYEE（ID, ENAME, SEX, TEAMID, SALARY）、TEAM（ID, TNAME, LEADID, DEPID）、DEPARTMENT（ID, DNAME）。每位員工都有團隊、每個團隊至少一位員工、每個部門至少一個團隊——所以用 INNER JOIN／等連接不會缺少數據。（p.131–132）","三個數據表都有 ID，要用別名：`FROM EMPLOYEE e, TEAM t, DEPARTMENT d WHERE TEAMID = t.ID AND DEPID = d.ID`。","(b) 按團隊點算人數：`GROUP BY t.ID`。(d) 部門名稱以「IT」開首：`DNAME LIKE 'IT%'`，按部門分組，`ORDER BY SUM(SALARY) DESC`。(e) 按部門**和**性別分組：`GROUP BY d.ID, SEX`。（p.133）","(c) 同一個數據表 EMPLOYEE 要用兩次（團隊成員 e、團隊負責人 l）：`FROM EMPLOYEE e, TEAM t, EMPLOYEE l WHERE e.TEAMID = t.ID AND LEADID = l.ID`。（p.132–133）"]},{"sim":{"db":"company","sql":"SELECT DNAME, TNAME, COUNT(*) FROM DEPARTMENT d, TEAM t, EMPLOYEE e\n    WHERE d.ID = DEPID AND TEAMID = t.ID\n    GROUP BY t.ID ORDER BY t.ID"},"cap":"例題 3.2(b)（p.133）：每個部門的名稱、團隊名稱和人數。只按 t.ID 分組也可選擇 DNAME：每個團隊只屬於一個部門（DEPID = d.ID）。"},{"sim":{"db":"shop","sql":"SELECT COUNT(PID) FROM PROD p, SHOP s, MANR m\n    WHERE p.SID = s.SID AND s.MID = m.MID AND SEX = 'F'"},"cap":"測試站 3.2(a)（p.134）：由女經理管理的店舖所售產品的數量。"}],"tries":[{"id":"a3b-s5-t1","pts":4,"src":"教科書 p.133 例題 3.2(d)","db":"company","sql":"SELECT DNAME, SUM(SALARY) FROM DEPARTMENT d, TEAM t, EMPLOYEE e\n    WHERE d.ID = DEPID AND TEAMID = t.ID AND DNAME LIKE 'IT%'\n    GROUP BY d.ID ORDER BY SUM(SALARY) DESC","q":"先估：結果是什麼？","ask":"table","options":["IT Security, 67000\nIT Support, 52000","IT Support, 52000\nIT Security, 67000","IT Security, 67000\nSales, 100000\nIT Support, 52000","IT Security, 40000\nIT Support, 30000"],"why":"IT Support 有 Alpha（Ada 30000、Ben 22000）= 52000；IT Security 有 Gamma（Finn 40000、Hana 27000）= 67000。按總和遞降排序。"}],"practice":[{"id":"a3b-s5-p1","type":"complete","pts":2,"src":"教科書 p.133 例題 3.2(c)","db":"company","q":"列出每位員工的名字及其所屬團隊的負責人名字（別名 LNAME），按員工的識別碼遞升排序。","template":"SELECT e.ENAME, l.ENAME AS LNAME FROM EMPLOYEE e, TEAM t, EMPLOYEE l\n    WHERE ［1］ AND ［2］ ORDER BY e.ID","ref":["e.TEAMID = t.ID","LEADID = l.ID"],"check":{"order":true},"hint":"e 是團隊成員：e 的 TEAMID 連到 TEAM；TEAM 的 LEADID 連到負責人 l。"},{"id":"a3b-s5-p2","type":"fill","pts":2,"src":"教科書 p.134 測試站 3.2(c)","db":"shop","sql":"SELECT DIST, AVG(PRICE) FROM PROD p, SHOP s, MANR m\n    WHERE p.SID = s.SID AND s.MID = m.MID AND MNAME = 'Paul' GROUP BY DIST ORDER BY DIST","q":"計算在各地區中，由經理 Paul 管理的店舖所售產品之平均單價。寫出結果的行數及 Kowloon 的平均單價。","blanks":[{"label":"行數","ask":"rows"},{"label":"Kowloon 的平均單價","ask":{"cell":[1,"AVG(PRICE)"]}}],"hint":"Paul 管理 Shop A（Kowloon）、Shop C（New Territories）、Shop E（Kowloon）。Kowloon：5、3、4.5、10 的平均。"},{"id":"a3b-s5-p3","type":"mc","pts":1,"src":"教科書 p.132 例題 3.2 分析","q":"例題 3.2 為什麼可以放心用等連接，而不用 LEFT JOIN？","options":["等連接比 LEFT JOIN 快","每位員工都有團隊、每個團隊都有員工、每個部門都有團隊，沒有記錄會因找不到配對而消失","三個數據表都有欄位 ID","LEFT JOIN 不能連接三個數據表"],"answer":1,"hint":"等連接 = INNER JOIN，只會失去沒有配對的記錄。"}]},{"id":"write","kind":"write","title":"寫 SQL","pages":"教科書 p.125–134","intro":"在編輯器寫一句 SELECT 語句，可以先按 ▶ 執行自己檢查，再按「提交評核」。評核時會用另外幾組數據測試，所以不可以把答案「寫死」。","tasks":[{"id":"a3b-w1","pts":10,"title":"學生與班長","src":"教科書 p.125 表 3.9","db":"monitor","q":"列出每個學生的名字、班別，以及其班長的名字（欄位名稱改為 `CMNAME`）。只列出**不是**班長本人的學生。","starter":"SELECT NAME, CLASS FROM STUDENT","ref":"SELECT s1.NAME, s1.CLASS, s2.NAME AS CMNAME FROM STUDENT s1, STUDENT s2\n    WHERE s1.CMSID = s2.SID AND s1.SID \u003c> s2.SID","hint":"自連接：`FROM STUDENT s1, STUDENT s2 WHERE s1.CMSID = s2.SID`。學生不是班長本人，即 s1 的 SID 與 s2 的 SID 不同。"},{"id":"a3b-w2","pts":12,"title":"部門、團隊與平均薪金","src":"教科書 p.131–133 例題 3.2(b)","db":"company","q":"列出每個部門的名稱 DNAME、團隊名稱 TNAME 及該團隊的平均薪金，按團隊識別碼遞升排序。","starter":"SELECT DNAME FROM DEPARTMENT","ref":"SELECT DNAME, TNAME, AVG(SALARY) FROM DEPARTMENT d, TEAM t, EMPLOYEE e\n    WHERE d.ID = DEPID AND TEAMID = t.ID\n    GROUP BY t.ID ORDER BY t.ID","check":{"order":true},"rules":[{"must":"GROUP BY","msg":"要按團隊分組。"}],"hint":"三個數據表要兩個連接條件：`d.ID = DEPID`、`TEAMID = t.ID`；`GROUP BY t.ID ORDER BY t.ID`。"},{"id":"a3b-w3","pts":13,"title":"經理的庫存總和","src":"教科書 p.134 測試站 3.2(b)","db":"shop","q":"列出各經理所管理的店舖裏所有產品的庫存數量總和。結果顯示經理名字 MNAME 及總和，按經理名字的字母順序排序。（沒有店舖的經理不用列出。）","starter":"SELECT MNAME FROM MANR ORDER BY MNAME","ref":"SELECT MNAME, SUM(STOCK) FROM PROD p, SHOP s, MANR m\n    WHERE p.SID = s.SID AND s.MID = m.MID\n    GROUP BY m.MID ORDER BY MNAME","check":{"order":true},"rules":[{"must":"SUM(","msg":"要用 SUM() 計算庫存總和。"}],"hint":"PROD—SHOP 用 SID 連接，SHOP—MANR 用 MID 連接；`GROUP BY m.MID ORDER BY MNAME`。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.122–134","items":[{"id":"a3b-q1","pts":4,"src":"教科書 p.129（DSE 題型）","tags":[{"t":"trap","why":"漏寫連接條件，等連接變成 CROSS JOIN"}],"q":"數據表 P 有 5 行，Q 有 4 行。`SELECT * FROM P, Q` 的結果有多少行？","options":["4","5","9","20"],"answer":"D","why":"沒有連接條件即 CROSS JOIN：5 × 4 = 20 行。"},{"id":"a3b-q2","pts":4,"src":"教科書 p.124–125","db":"club2","verify":true,"ask":"rows","q":"club2 的 CLUB 欄位是 CID, CLUBNAME, ROOM, TEACH。以下語句的結果有多少行？","sql":"SELECT NAME, CLUBNAME FROM STUDENT NATURAL JOIN CLUB WHERE TEACH = 'Mr Wong'","options":["0","1","3","7"],"answer":"C","why":"現在只有 CID 同名，NATURAL JOIN 等於以 CID 連接；Mr Wong 負責 Science Club，有 Eva、Gabe、Dio。"},{"id":"a3b-q3","pts":4,"src":"教科書 p.126","tags":[{"t":"hot","why":"DSE 卷二A 經常要求以等連接連接兩至三個數據表"}],"db":"monitor","verify":true,"ask":"rows","q":"以下語句列出同班同學的配對。結果有多少行？","sql":"SELECT s1.NAME, s2.NAME FROM STUDENT s1, STUDENT s2\n    WHERE s1.CLASS = s2.CLASS AND s1.SID \u003c s2.SID","options":["3","5","10","17"],"answer":"B","why":"3A：Ada–Ben（1 對）；3B：Clem、Eva、Finn（3 對）；3C：Gabe–Dio（1 對）。共 5 對。"},{"id":"a3b-q4","pts":4,"src":"教科書 p.127–128","tags":[{"t":"hot","why":"DSE 卷二A 經常要求以等連接連接兩至三個數據表"}],"q":"STUDENT（SID, NAME）、SC（SID, CID）、CLUB（CID, NAME）。要列出**所有**學生的名字及其學會名稱（沒有學會的學生也要列出）。以下哪一句正確？","options":["SELECT s.NAME, c.NAME FROM STUDENT s, SC, CLUB c WHERE s.SID = SC.SID AND SC.CID = c.CID","SELECT s.NAME, c.NAME FROM STUDENT s LEFT JOIN SC ON s.SID = SC.SID LEFT JOIN CLUB c ON SC.CID = c.CID","SELECT s.NAME, c.NAME FROM STUDENT s LEFT JOIN CLUB c ON s.SID = c.CID","SELECT s.NAME, c.NAME FROM STUDENT s NATURAL JOIN SC NATURAL JOIN CLUB c"],"answer":"B","why":"A 是 INNER JOIN，沒有學會的學生會消失；C 的連接條件錯誤；D 中 STUDENT 與 CLUB 都有 NAME，NATURAL JOIN 會把 NAME 也當作連接欄位。"},{"id":"a3b-q5","pts":4,"src":"教科書 p.133 例題 3.2(e)","db":"company","verify":true,"ask":"rows","q":"以下語句的結果有多少行？","sql":"SELECT DNAME, SEX, AVG(SALARY) FROM DEPARTMENT d, TEAM t, EMPLOYEE e\n    WHERE d.ID = DEPID AND TEAMID = t.ID\n    GROUP BY d.ID, SEX ORDER BY DNAME, SEX","options":["3","5","6","8"],"answer":"C","why":"按「部門 + 性別」分組：IT Security（F、M）、IT Support（F、M）、Sales（F、M），共 6 組。"}]},{"id":"more","kind":"endless","title":"無限練習","gens":["sqlJoin","sqlWhere"],"intro":"隨機生成連接結果行數及篩選題目，答案由 SQL 引擎計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]},{"id":"a3c","title":"子查詢：IN、EXISTS、ANY、ALL","book":"教科書 選修A 第 3 章 p.134–157","key":"A-a3c-hmac-3ba03210ab","theory":false,"dbs":{"sub":{"STUDENT":[["SID","NAME","SEX","CLASS","SCORE"],[["03493","Ada","F","3A",0],["03496","Clem","F","3B",89],["03505","Eva","F","3B",83],["03506","Gabe","M","3C",47],["03510","Finn","M","3B",35],["03513","Dio","M","3C",67],["03517","Ben","M","3A",86]],["SID"]],"SC":[["SID","CID"],[["03493",2],["03496",1],["03496",2],["03496",4],["03505",4],["03506",4],["03510",1],["03513",4]],["SID","CID"]],"CLUB":[["CID","NAME","ROOM","TEACH"],[[1,"Chess Club",501,"Mr Chan"],[2,"Art Club",402,"Mrs Lee"],[3,"English Club",203,"Mr Suen"],[4,"Science Club",502,"Mr Wong"]],["CID"]],"STUDENT2":[["SID","NAME","SEX","CLASS","SCORE"],[["03518","Xing","M","3A",83],["03519","Yen","F","3B",47],["03520","Zack","M","3B",null]],["SID"]]},"any":{"STUDENT":[["SID","NAME","SEX","CLASS","SCORE"],[["03493","Ada","F","3A",0],["03496","Clem","F","3B",89],["03505","Eva","F","3B",83],["03506","Gabe","M","3C",47],["03510","Finn","M","3B",35],["03513","Dio","M","3C",67],["03517","Ben","M","3A",86]],["SID"]],"STUDENT2":[["SID","NAME","SEX","CLASS","SCORE"],[["03518","Xing","M","3A",83],["03519","Yen","F","3B",47],["03520","Zack","M","3B",60]],["SID"]]},"ins":{"STUDENT":[["SID","NAME","SEX","CLASS","SCORE"],[["03493","Ada","F","3A",0],["03496","Clem","F","3B",89],["03505","Eva","F","3B",83],["03506","Gabe","M","3C",47],["03510","Finn","M","3B",35],["03513","Dio","M","3C",67],["03517","Ben","M","3A",86]],["SID"]],"STUDENT2":[["ID","NAME","SEX","CLASS","DOB"],[["03518","Xing","M","3A","2015-05-01"],["03519","Yen","F","3B","2015-01-05"],["03520","Zack","M","3C","2015-02-15"]],["ID"]]},"cat":{"CAT":[["ID","BID","HID","NAME","AGE","WEIGHT"],[[1,1,1,"Mochi",3,7],[2,2,1,"Coco",5,5],[3,1,1,"Luna",7,6],[4,3,1,"Kiki",2,4.2],[5,1,2,"Snow",4,6.8],[6,2,2,"Max",6,6.1],[7,4,2,"Bella",9,4],[8,3,3,"Tom",1,3.5],[9,4,3,"Nana",3,5],[10,3,3,"Lucky",8,4.1]],["ID"]],"BREED":[["ID","NAME","WEIGHT"],[[1,"Ragdoll",6.5],[2,"British Shorthair",5.5],[3,"Siamese",4],[4,"Persian",4.5]],["ID"]],"HOTEL":[["ID","NAME","CAPACITY"],[[1,"Alpha",3],[2,"Beta",4],[3,"Gamma",2],[4,"Delta",2]],["ID"]]},"game":{"PLAYER":[["ID","NAME","LEVEL","GOLD"],[[1,"Tom",12,500],[2,"Jerry",15,300],[3,"Amy",20,800],[4,"Ken",9,100],[5,"Mia",25,450],[6,"Leo",18,0]],["ID"]],"CLASS":[["ID","NAME","COST","MAXHP","STR"],[[1,"戰士",100,500,80],[2,"弓箭手",120,300,95],[3,"火魔法師",200,250,110],[4,"黑魔法師",250,220,120],[5,"騎士",300,600,90]],["ID"]],"ARMY":[["ID","OWNER","CID","HP"],[[1,1,1,500],[2,1,2,280],[3,2,3,250],[4,3,4,100],[5,3,1,450],[6,3,5,600],[7,4,1,480],[8,5,2,300],[9,5,2,120]],["ID"]]}},"sections":[{"id":"s1","title":"子查詢：找出最高分的學生","pages":"教科書 p.134–136","learn":[{"pts":["`SELECT MAX(SCORE) FROM STUDENT` 可以找出最高分（89），但**找不到是誰**取得最高分。（p.134）","常見錯誤：`SELECT NAME, MAX(SCORE) FROM STUDENT`——NAME 不是匯總的數據，與 MAX(SCORE) 沒有關係。舊版 MySQL 會隨便給一個名字（例如 Ada）；MySQL 8.0 預設會**報錯**。（p.134–135）","做法：先找出最高分，再找誰取得這個分數。把 `89` 換成用括號括起的查詢：（p.136）","`SELECT NAME, SCORE FROM STUDENT WHERE SCORE = (SELECT MAX(SCORE) FROM STUDENT)`","**子查詢（subquery）**：在一個查詢中利用另一個查詢的結果。括號內的子查詢先執行。","提示：用 `=`、`>`、`\u003c` 等比較運算符時，子查詢必須傳回**單一的值**，否則出錯。（p.136）"]},{"sim":{"db":"sub","sql":"SELECT NAME, SCORE FROM STUDENT WHERE SCORE = (SELECT MAX(SCORE) FROM STUDENT)"},"cap":"p.136：試把 MAX 改成 MIN；再試執行 `SELECT NAME, MAX(SCORE) FROM STUDENT`，看看錯誤訊息。"}],"tries":[{"id":"a3c-s1-t1","pts":4,"src":"教科書 p.136","db":"sub","sql":"SELECT NAME, SCORE FROM STUDENT WHERE SCORE > (SELECT AVG(SCORE) FROM STUDENT)","q":"先估：哪些學生的分數比所有學生的平均分高？","ask":{"col":"NAME"},"options":["Clem, Eva, Dio, Ben","Clem, Eva, Ben","Clem","Ada, Gabe, Finn"],"why":"平均分 = (0 + 89 + 83 + 47 + 35 + 67 + 86) ÷ 7 = 407 ÷ 7 ≈ 58.1；高於 58.1 的有 Clem、Eva、Dio、Ben。"}],"practice":[{"id":"a3c-s1-p1","type":"complete","pts":2,"src":"教科書 p.136","db":"sub","q":"列出取得**最低分**的學生之名字和分數。","template":"SELECT NAME, SCORE FROM STUDENT WHERE SCORE = ［1］","ref":["(SELECT MIN(SCORE) FROM STUDENT)"],"hint":"子查詢要用括號括起，傳回一個值。"},{"id":"a3c-s1-p2","type":"mc","pts":1,"src":"教科書 p.136 提示","db":"sub","q":"執行 `SELECT NAME FROM STUDENT WHERE SCORE = (SELECT SCORE FROM STUDENT2)` 會怎樣？（STUDENT2 有 3 行）","options":["列出與任何一位插班生同分的學生","列出與所有插班生同分的學生","出錯：= 之後的子查詢傳回多於一個值","沒有結果，但不會出錯"],"answer":2,"hint":"比較運算符後的子查詢只可傳回單一的值；多個值要用 IN、ANY 或 ALL。"},{"id":"a3c-s1-p3","type":"mc","pts":2,"src":"自擬（p.136 延伸）","db":"sub","verify":true,"ask":"table","q":"以下語句的結果是什麼？","sql":"SELECT NAME, SCORE FROM STUDENT\n    WHERE CLASS = '3B' AND SCORE \u003c (SELECT AVG(SCORE) FROM STUDENT WHERE CLASS = '3B')","options":["Finn, 35","Eva, 83\nFinn, 35","Ada, 0\nGabe, 47\nFinn, 35","Clem, 89\nEva, 83"],"answer":0,"hint":"3B 班的平均分 = (89 + 83 + 35) ÷ 3 = 69；3B 班中低於 69 的只有 Finn。"}]},{"id":"s2","title":"IN 與 NOT IN；用子查詢修改數據","pages":"教科書 p.137–140","learn":[{"pts":["**IN**：檢查一個值是否出現在子查詢的結果中。子查詢可以代替連接，令語句更簡單。（p.137–138）","至少加入了一個學會、且分數高於 70 的學生：連接寫法要 DISTINCT（Clem 在 SC 有三行）——`SELECT DISTINCT s.NAME FROM STUDENT s, SC WHERE s.SID = SC.SID AND SCORE > 70`；子查詢寫法：`SELECT NAME FROM STUDENT WHERE SCORE > 70 AND SID IN (SELECT SID FROM SC)`。（p.137–138）","IN 之後的子查詢只可選擇**一個**欄位。（p.138 提示）","**NOT IN**：檢查值**不在**子查詢結果中。未加入任何學會的學生：`SELECT NAME FROM STUDENT WHERE SID NOT IN (SELECT SID FROM SC)`，等於 `LEFT JOIN SC … WHERE SC.CID IS NULL`。（p.138–139）","子查詢也可用於 **INSERT、UPDATE、DELETE**（p.139–140）：","`INSERT INTO STUDENT (SELECT ID, NAME, SEX, CLASS, 0 FROM STUDENT2)`——欄位**數目**相同即可，名稱不必相同。","`UPDATE STUDENT SET SCORE = NULL WHERE SID IN (SELECT ID FROM STUDENT2)`；`DELETE FROM STUDENT WHERE SID IN (SELECT ID FROM STUDENT2)`。"]},{"sim":{"db":"sub","sql":"SELECT NAME FROM STUDENT WHERE SCORE > 70 AND SID IN (SELECT SID FROM SC)"},"cap":"p.138：Ben 86 分，但他不在 SC 中。"},{"sim":{"db":"ins","sql":"INSERT INTO STUDENT (SELECT ID, NAME, SEX, CLASS, 0 FROM STUDENT2);\nSELECT * FROM STUDENT"},"cap":"p.139：把插班生加入 STUDENT。再試在 INSERT 後加上 `UPDATE STUDENT SET SCORE = NULL WHERE SID IN (SELECT ID FROM STUDENT2);`。"}],"tries":[{"id":"a3c-s2-t1","pts":4,"src":"教科書 p.139–140","db":"ins","sql":"INSERT INTO STUDENT (SELECT ID, NAME, SEX, CLASS, 0 FROM STUDENT2);\nUPDATE STUDENT SET SCORE = NULL WHERE SID IN (SELECT ID FROM STUDENT2);\nSELECT COUNT(*), COUNT(SCORE), AVG(SCORE) FROM STUDENT","q":"先估：插入 3 位插班生並把他們的分數改為 NULL 後，結果是什麼？","ask":"table","options":["10, 7, 58.1428571429","10, 10, 40.7","7, 7, 58.1428571429","10, 7, 40.7"],"why":"COUNT(*) 點算全部 10 行；COUNT(SCORE) 和 AVG(SCORE) 都不計 NULL，所以仍是原本 7 位學生：407 ÷ 7。若分數仍是 0，平均分便會被拉低到 40.7——這就是書中把分數改為 NULL 的原因。"}],"practice":[{"id":"a3c-s2-p1","type":"complete","pts":2,"src":"教科書 p.139","db":"sub","q":"用子查詢列出尚未加入任何學會的學生之名字。","template":"SELECT NAME FROM STUDENT WHERE SID ［1］ (SELECT ［2］ FROM SC)","ref":["NOT IN","SID"],"hint":"「不在加入了學會的學生名單中」。子查詢只選擇一個欄位。"},{"id":"a3c-s2-p2","type":"mc","pts":1,"src":"教科書 p.137","db":"sub","verify":true,"ask":"rows","q":"以下語句（**沒有** DISTINCT）的結果有多少行？","sql":"SELECT s.NAME FROM STUDENT s, SC WHERE s.SID = SC.SID AND SCORE > 70","options":["2","3","4","5"],"answer":2,"hint":"Clem 在 SC 有 3 行，Eva 有 1 行。這就是連接寫法要加 DISTINCT 的原因。"},{"id":"a3c-s2-p3","type":"fill","pts":2,"src":"教科書 p.140","db":"ins","sql":"INSERT INTO STUDENT (SELECT ID, NAME, SEX, CLASS, 0 FROM STUDENT2);\nDELETE FROM STUDENT WHERE SID IN (SELECT ID FROM STUDENT2 WHERE CLASS \u003c> '3C');\nSELECT NAME FROM STUDENT WHERE SCORE = 0","q":"先插入插班生，再刪除部分插班生。最後輸出哪些名字？（用「, 」分隔）","blanks":[{"label":"名字","ask":{"col":"NAME"}}],"hint":"只刪除不是 3C 班的插班生（Xing、Yen）；Zack 在 3C 班，留下。原有學生中 Ada 也是 0 分。"}]},{"id":"s3","title":"EXISTS、NOT EXISTS 與 NULL 陷阱","pages":"教科書 p.140–143","learn":[{"pts":["**EXISTS**：檢查子查詢**有沒有結果**（有任何一行便是 TRUE）。（p.140）","`SELECT NAME, SCORE FROM STUDENT s WHERE EXISTS (SELECT 1 FROM STUDENT2 s2 WHERE s.SCORE = s2.SCORE)`：對 STUDENT 的**每一行**，子查詢都用該行的 s.SCORE 重新執行一次（**關聯子查詢**）。結果：Eva 83、Gabe 47。（p.141）","`SELECT 1` 中的 1 可以換成任何值或欄位——EXISTS 只看有沒有行，不看內容。（p.141）","大部分 IN 都可以改寫成 EXISTS：上例等於 `WHERE SCORE IN (SELECT SCORE FROM STUDENT2)`。（p.141）","**NOT EXISTS**：子查詢**沒有**結果時是 TRUE。結果：Ada、Clem、Finn、Dio、Ben。（p.142）","**陷阱**：改用 `SCORE NOT IN (SELECT SCORE FROM STUDENT2)` 卻**沒有任何結果**！因為 STUDENT2 中 Zack 的分數是 NULL：（p.142–143）","`89 NOT IN (83, 47, NULL)` = `89 \u003c> 83 AND 89 \u003c> 47 AND 89 \u003c> NULL` = TRUE AND TRUE AND **NULL** = NULL（不是 TRUE），所以不會列出。","`83 IN (83, 47, NULL)` = TRUE OR … = TRUE，所以 IN 不受 NULL 影響。"]},{"sim":{"db":"sub","sql":"SELECT NAME, SCORE FROM STUDENT s WHERE NOT EXISTS\n    (SELECT 1 FROM STUDENT2 s2 WHERE s.SCORE = s2.SCORE)"},"cap":"p.142：再試改寫成 `SELECT NAME, SCORE FROM STUDENT WHERE SCORE NOT IN (SELECT SCORE FROM STUDENT2)`，比較結果。"},{"warn":"子查詢的結果可能有 NULL 時，**不要**用 NOT IN，改用 NOT EXISTS，或在子查詢加上 `WHERE SCORE IS NOT NULL`。"}],"tries":[{"id":"a3c-s3-t1","pts":4,"src":"教科書 p.142","db":"sub","sql":"SELECT NAME, SCORE FROM STUDENT WHERE SCORE NOT IN (SELECT SCORE FROM STUDENT2)","q":"先估：STUDENT2 的分數是 83、47、NULL。結果有多少行？","ask":"rows","options":["0","2","5","7"],"why":"每個 SCORE 與 NULL 比較都得 NULL，令 NOT IN 的結果不是 TRUE，所以一行也沒有。NOT EXISTS 則有 5 行。"}],"practice":[{"id":"a3c-s3-p1","type":"complete","pts":2,"src":"教科書 p.142–143","db":"sub","q":"修正 NOT IN 的語句：在子查詢中排除 NULL，令結果與 NOT EXISTS 相同（5 行）。","template":"SELECT NAME, SCORE FROM STUDENT WHERE SCORE NOT IN (SELECT SCORE FROM STUDENT2 WHERE ［1］)","ref":["SCORE IS NOT NULL"],"hint":"判斷 NULL 要用 IS NOT NULL，不可以用 \u003c> NULL。"},{"id":"a3c-s3-p2","type":"mc","pts":2,"src":"教科書 p.141","db":"sub","verify":true,"ask":{"col":"NAME"},"q":"以下語句輸出哪些名字？","sql":"SELECT NAME FROM STUDENT s WHERE EXISTS\n    (SELECT 1 FROM STUDENT2 s2 WHERE s2.CLASS = s.CLASS AND s2.SCORE > s.SCORE)","options":["Ada","Ada, Finn","Ada, Eva, Finn","Ada, Clem, Eva, Finn, Ben"],"answer":1,"hint":"找出「同班的插班生中有人比他高分」的學生。3A：Xing 83 > Ada 0（但 \u003c Ben 86）；3B：Yen 47 > Finn 35；Zack 的 NULL 比較不成立。"},{"id":"a3c-s3-p3","type":"mc","pts":1,"src":"教科書 p.141","q":"在 `WHERE EXISTS (SELECT 1 FROM STUDENT2 s2 WHERE s.SCORE = s2.SCORE)` 中，把 `SELECT 1` 改成 `SELECT NAME` 會怎樣？","options":["結果不變","出錯","結果變成插班生的名字","結果變成空"],"answer":0,"hint":"EXISTS 只檢查子查詢有沒有行，不理會選擇了甚麼。"}]},{"id":"s4","title":"ANY 與 ALL","pages":"教科書 p.143–151","learn":[{"pts":["**ANY**（也可寫 **SOME**）：與子查詢中**任何一個**值比較，只要有一個成立便是 TRUE（即用 OR 連接）。（p.143）","`CLASS = ANY (SELECT CLASS FROM STUDENT2)` = `CLASS = '3A' OR CLASS = '3B' OR CLASS = '3B'` = `CLASS IN (…)`。（p.144）","IN 後面可以是一列數值 `IN ('3A', '3B')`；但 ANY、ALL 後面**必須是子查詢**，`= ANY ('3A', '3B')` 會出錯。（p.144、p.148）","`\u003c> ANY` **不等於** NOT IN：CLASS 不可能同時是 3A 和 3B，所以 `\u003c> ANY` 對每個學生都成立（毫無意義）。（p.144）","`SCORE > ANY (…)`：比**至少一位**（部分）插班生高分 = 比**最低分**高：`SCORE > (SELECT MIN(SCORE) …)`。日常說「比任何一個都高」其實是「全部」，SQL 的 ANY 不是這個意思！（p.145–146）","`SCORE \u003c ANY (…)` = 比最高分低：`SCORE \u003c (SELECT MAX(SCORE) …)`。（p.146–147）","**ALL**：與子查詢中**所有**值比較，全部成立才是 TRUE（即用 AND 連接）。（p.147）","`\u003c> ALL` = NOT IN；`= ALL` 不等於 IN（CLASS 不可能同時等於 3A 和 3B，永遠不成立）。（p.148–149）","`SCORE > ALL (…)` = 比最高分高：`> (SELECT MAX(SCORE) …)`；`SCORE \u003c ALL (…)` = 比最低分低：`\u003c (SELECT MIN(SCORE) …)`。（p.149–151）"]},{"table":{"head":["寫法","意思","等於"],"rows":[["= ANY","等於其中一個","IN"],["\u003c> ALL","與每一個都不同","NOT IN"],["> ANY","比至少一個大","> MIN"],["\u003c ANY","比至少一個小","\u003c MAX"],["> ALL","比全部都大","> MAX"],["\u003c ALL","比全部都小","\u003c MIN"],["\u003c> ANY","幾乎永遠成立","（毫無意義）"],["= ALL","（多於一個不同值時）永遠不成立","（毫無意義）"]]},"cap":"ANY 與 ALL 一覽（p.143–151）"},{"sim":{"db":"any","sql":"SELECT NAME, SCORE FROM STUDENT WHERE SCORE > ANY (SELECT SCORE FROM STUDENT2)"},"cap":"p.145：插班生是 83、47、60 分。再試 `\u003c ANY`、`> ALL`、`\u003c ALL`。"}],"tries":[{"id":"a3c-s4-t1","pts":4,"src":"教科書 p.146–147","db":"any","sql":"SELECT NAME, SCORE FROM STUDENT WHERE SCORE \u003c ANY (SELECT SCORE FROM STUDENT2)","q":"先估：插班生是 83、47、60 分。哪些學生的分數「\u003c ANY」插班生？","ask":{"col":"NAME"},"options":["Ada, Gabe, Finn, Dio","Ada, Finn","Ada, Gabe, Finn","Clem, Eva, Ben"],"why":"\u003c ANY = 比最高分（83）低：Ada 0、Gabe 47、Finn 35、Dio 67。Eva 83 不比 83 低。Dio 同時在 > ANY 和 \u003c ANY 的結果中。"}],"practice":[{"id":"a3c-s4-p1","type":"mc","pts":2,"src":"教科書 p.149–150","db":"any","verify":true,"ask":{"col":"NAME"},"q":"以下語句輸出哪些名字？","sql":"SELECT NAME FROM STUDENT WHERE SCORE > ALL (SELECT SCORE FROM STUDENT2)","options":["Clem, Ben","Clem, Eva, Ben","Clem, Eva, Dio, Ben","Clem"],"answer":0,"hint":"> ALL = 比最高分 83 高（Eva 83 不算）。"},{"id":"a3c-s4-p2","type":"fill","pts":1,"src":"教科書 p.144","db":"any","sql":"SELECT NAME FROM STUDENT WHERE CLASS \u003c> ANY (SELECT CLASS FROM STUDENT2)","q":"插班生的班別是 3A、3B、3B。以下語句的結果有多少行？","blanks":[{"label":"行數","ask":"rows"}],"hint":"`\u003c> ANY` 用 OR 連接：CLASS \u003c> 3A OR CLASS \u003c> 3B，每個學生都至少符合一個。"},{"id":"a3c-s4-p3","type":"complete","pts":2,"src":"教科書 p.146","db":"any","q":"不用 ANY，改寫 `SELECT NAME, SCORE FROM STUDENT WHERE SCORE > ANY (SELECT SCORE FROM STUDENT2)`，結果要相同。","template":"SELECT NAME, SCORE FROM STUDENT WHERE SCORE > (SELECT ［1］ FROM STUDENT2)","ref":["MIN(SCORE)"],"hint":"比至少一位插班生高分 = 比分數最低的插班生高分。"}]},{"id":"s5","title":"綜合：子查詢還是連接？","pages":"教科書 p.152–157（例題 3.3、測試站 3.3）","learn":[{"pts":["例題 3.3：CAT（ID, BID, HID, NAME, AGE, WEIGHT）、BREED（ID, NAME, WEIGHT）、HOTEL（ID, NAME, CAPACITY）。同一題可以用連接，也可以用 IN、ANY、EXISTS 子查詢。（p.152–153）","(a) 住在 Alpha 酒店的貓之品種：連接寫法要 **DISTINCT**（同一品種可能有多隻貓）；子查詢寫法 `SELECT NAME FROM BREED WHERE ID IN (SELECT BID FROM CAT, HOTEL h WHERE HID = h.ID AND h.NAME = 'Alpha')`。","主查詢**不能**選擇子查詢內的欄位：`SELECT NAME, h.NAME FROM BREED WHERE ID IN (SELECT … HOTEL h …)` 會出錯。（p.153 提示）","(c) 超出容量的酒店：`SELECT NAME FROM HOTEL h WHERE (SELECT COUNT(c.ID) FROM CAT c WHERE HID = h.ID) > CAPACITY`——子查詢放在比較的**左邊**也可以。（p.154）","(d) 年齡比所有布偶貓的平均年齡大的布偶貓：`AGE > (SELECT AVG(c2.AGE) FROM CAT c2 WHERE c2.BID = b.ID)`。（p.154）","(e) 沒有布偶貓居住的酒店，要用 **NOT IN**；寫成 `ID IN (… b.NAME \u003c> 'Ragdoll')` 是錯的——它列出「住了至少一隻非布偶貓」的酒店，這些酒店仍可能有布偶貓，而且沒有貓的酒店會被漏掉。（p.154）","有時連接比子查詢簡單，例如 (b) 要比較貓與其品種的體重。（p.153 提示）"]},{"sim":{"db":"cat","sql":"SELECT NAME FROM HOTEL WHERE ID NOT IN\n    (SELECT HID FROM CAT, BREED b WHERE BID = b.ID AND b.NAME = 'Ragdoll')"},"cap":"例題 3.3(e)（p.154）：再把 `NOT IN` 改成 `IN`、`=` 改成 `\u003c>`，比較錯誤寫法的結果。"},{"sim":{"db":"game","sql":"SELECT NAME, COUNT(a.ID) FROM PLAYER p LEFT JOIN ARMY a ON OWNER = p.ID\n    WHERE LEVEL > (SELECT AVG(LEVEL) FROM PLAYER)\n    GROUP BY p.ID ORDER BY LEVEL DESC"},"cap":"測試站 3.3(d)（p.157）：連接、子查詢、分組一起用。"}],"tries":[{"id":"a3c-s5-t1","pts":4,"src":"教科書 p.154 例題 3.3(c)","db":"cat","sql":"SELECT NAME FROM HOTEL h WHERE (SELECT COUNT(c.ID) FROM CAT c WHERE HID = h.ID) > CAPACITY","q":"先估：Alpha、Beta、Gamma、Delta 的容量是 3、4、2、2，分別住了 4、3、3、0 隻貓。輸出哪些酒店？","ask":{"col":"NAME"},"options":["Alpha, Gamma","Alpha","Alpha, Beta, Gamma","Gamma, Delta"],"why":"對每間酒店，子查詢點算住在該酒店的貓（關聯子查詢）：Alpha 4 > 3、Gamma 3 > 2。"}],"practice":[{"id":"a3c-s5-p1","type":"complete","pts":2,"src":"教科書 p.153 例題 3.3(b)（比較符號已更正，見單元檔頭）","db":"cat","q":"列出住在 Beta 酒店、且體重**超出**該品種全球平均重量的貓之名字。","template":"SELECT c.NAME FROM CAT c, BREED b, HOTEL h\n    WHERE BID = b.ID AND HID = h.ID AND h.NAME = 'Beta' AND ［1］","ref":["c.WEIGHT > b.WEIGHT"],"hint":"CAT 和 BREED 都有 WEIGHT，要寫 c.WEIGHT 和 b.WEIGHT。"},{"id":"a3c-s5-p2","type":"mc","pts":2,"src":"教科書 p.154 例題 3.3(e)","db":"cat","verify":true,"ask":{"col":"NAME"},"q":"以下是例題 3.3(e) 的**錯誤**寫法。它輸出什麼？（正確答案是 Gamma, Delta）","sql":"SELECT NAME FROM HOTEL WHERE ID IN\n    (SELECT HID FROM CAT, BREED b WHERE BID = b.ID AND b.NAME \u003c> 'Ragdoll')","options":["Alpha, Beta, Gamma","Gamma, Delta","Gamma","Alpha, Beta, Gamma, Delta"],"answer":0,"hint":"Alpha、Beta 都住了非布偶貓（也住了布偶貓）；Delta 沒有貓，不會在子查詢中出現。"},{"id":"a3c-s5-p3","type":"fill","pts":1,"src":"教科書 p.156 測試站 3.3(a)","db":"game","sql":"SELECT COUNT(ID) FROM PLAYER WHERE ID IN\n    (SELECT OWNER FROM ARMY a, CLASS c WHERE CID = c.ID AND STR > 90)","q":"點算擁有力量高於 90 的軍隊之玩家人數。","blanks":[{"label":"人數","ask":{"cell":[1,"COUNT(ID)"]}}],"hint":"力量高於 90 的兵種：弓箭手 95、火魔法師 110、黑魔法師 120（騎士 90 不算）。IN 令擁有多隊的玩家只計一次。"}]},{"id":"write","kind":"write","title":"寫 SQL","pages":"教科書 p.136–157","intro":"在編輯器寫一句 SELECT 語句，可以先按 ▶ 執行自己檢查，再按「提交評核」。評核時會用另外幾組數據測試，所以不可以把答案「寫死」。","tasks":[{"id":"a3c-w1","pts":10,"title":"最高分的學生","src":"教科書 p.136","db":"sub","q":"列出 STUDENT 中取得**最高分**的學生之名字 NAME 和班別 CLASS（可能多於一人）。不可把分數直接寫在語句中。","starter":"SELECT NAME, CLASS FROM STUDENT","ref":"SELECT NAME, CLASS FROM STUDENT WHERE SCORE = (SELECT MAX(SCORE) FROM STUDENT)","rules":[{"must":"MAX(","msg":"要用子查詢 SELECT MAX(SCORE) 找出最高分。"}],"hint":"`WHERE SCORE = (SELECT MAX(SCORE) FROM STUDENT)`。"},{"id":"a3c-w2","pts":12,"title":"沒有軍隊的玩家","src":"教科書 p.157 測試站 3.3(f)","db":"game","q":"**不連接數據表**，用子查詢列出沒有任何軍隊的玩家之名字。","starter":"SELECT NAME FROM PLAYER","ref":"SELECT NAME FROM PLAYER WHERE ID NOT IN (SELECT OWNER FROM ARMY)","rules":[{"mustNot":"JOIN","msg":"這題不可連接數據表，要用子查詢。"}],"hint":"ARMY 的 OWNER 是擁有軍隊的玩家 ID：`WHERE ID NOT IN (SELECT OWNER FROM ARMY)`（也可用 NOT EXISTS）。"},{"id":"a3c-w3","pts":13,"title":"高於平均等級的玩家","src":"教科書 p.157 測試站 3.3(d)","db":"game","q":"列出等級高於所有玩家平均等級的玩家之名字，以及他們各自擁有的軍隊數量（沒有軍隊顯示 0）。結果按等級遞降排序。","starter":"SELECT NAME FROM PLAYER ORDER BY LEVEL DESC","ref":"SELECT NAME, COUNT(a.ID) FROM PLAYER p LEFT JOIN ARMY a ON OWNER = p.ID\n    WHERE LEVEL > (SELECT AVG(LEVEL) FROM PLAYER)\n    GROUP BY p.ID ORDER BY LEVEL DESC","check":{"order":true},"rules":[{"must":"AVG(","msg":"要用子查詢計算平均等級。"},{"must":"GROUP BY","msg":"要按玩家分組點算軍隊。"}],"hint":"PLAYER 在左方 `LEFT JOIN ARMY a ON OWNER = p.ID`；`WHERE LEVEL > (SELECT AVG(LEVEL) FROM PLAYER)`；`COUNT(a.ID)` 不計 NULL。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.134–157","items":[{"id":"a3c-q1","pts":4,"src":"教科書 p.142–143（延伸到 ALL）","tags":[{"t":"trap","why":"子查詢結果含 NULL 時，NOT IN 和 ALL 都會失效"}],"db":"sub","verify":true,"ask":"rows","q":"STUDENT2 的分數是 83、47、NULL。以下語句的結果有多少行？","sql":"SELECT NAME FROM STUDENT WHERE SCORE > ALL (SELECT SCORE FROM STUDENT2)","options":["0","2","4","7"],"answer":"A","why":"ALL 用 AND 連接：89 > 83 AND 89 > 47 AND 89 > NULL = TRUE AND TRUE AND NULL = NULL，不是 TRUE。所以連 Clem 和 Ben 也不會列出。"},{"id":"a3c-q2","pts":4,"src":"教科書 p.145 常見錯誤","tags":[{"t":"trap","why":"把 SQL 的 ANY 誤解為「全部」"}],"q":"`SELECT NAME FROM STUDENT WHERE SCORE > ANY (SELECT SCORE FROM STUDENT2)` 列出的是什麼學生？","options":["分數比所有插班生都高的學生","分數比至少一位插班生高的學生","分數與某插班生相同的學生","分數比所有插班生都低的學生"],"answer":"B","why":"ANY 用 OR 連接：只要比其中一位（即比分數最低的一位）高便成立。"},{"id":"a3c-q3","pts":4,"src":"教科書 p.144、p.148","q":"以下哪一句會**出錯**？","options":["SELECT NAME FROM STUDENT WHERE CLASS IN ('3A', '3B')","SELECT NAME FROM STUDENT WHERE CLASS = ANY ('3A', '3B')","SELECT NAME FROM STUDENT WHERE CLASS = ANY (SELECT CLASS FROM STUDENT2)","SELECT NAME FROM STUDENT WHERE CLASS \u003c> ALL (SELECT CLASS FROM STUDENT2)"],"answer":"B","why":"ANY、ALL 後面必須是子查詢；只有 IN 可以接一列數值。"},{"id":"a3c-q4","pts":4,"src":"教科書 p.141","tags":[{"t":"hot","why":"DSE 卷二A 常考以子查詢找最高／最低值的記錄，以及 IN／NOT IN／EXISTS"}],"db":"sub","verify":true,"ask":{"col":"NAME"},"q":"以下語句輸出哪些名字？","sql":"SELECT NAME FROM CLUB c WHERE NOT EXISTS\n    (SELECT 1 FROM SC WHERE SC.CID = c.CID)","options":["English Club","Art Club, English Club","Chess Club, Art Club, Science Club","沒有結果"],"answer":"A","why":"對每個學會，子查詢找 SC 中屬於該學會的記錄；只有 English Club 找不到任何記錄。"},{"id":"a3c-q5","pts":4,"src":"教科書 p.153 例題 3.3(a) 提示","tags":[{"t":"hot","why":"DSE 卷二A 常考以子查詢找最高／最低值的記錄，以及 IN／NOT IN／EXISTS"}],"q":"以下哪一句**不能**列出住在 Alpha 酒店的貓之品種名稱（不重複）？","options":["SELECT NAME FROM BREED WHERE ID IN (SELECT BID FROM CAT, HOTEL h WHERE HID = h.ID AND h.NAME = 'Alpha')","SELECT NAME FROM BREED WHERE ID = ANY (SELECT BID FROM CAT, HOTEL h WHERE HID = h.ID AND h.NAME = 'Alpha')","SELECT DISTINCT b.NAME FROM CAT c, BREED b, HOTEL h WHERE BID = b.ID AND HID = h.ID AND h.NAME = 'Alpha'","SELECT NAME, h.NAME FROM BREED WHERE ID IN (SELECT BID FROM CAT, HOTEL h WHERE HID = h.ID AND h.NAME = 'Alpha')"],"answer":"D","why":"主查詢不能選擇子查詢內數據表的欄位（h.NAME），會出錯。"}]},{"id":"more","kind":"endless","title":"無限練習","gens":["sqlSub","sqlAgg"],"intro":"隨機生成 IN／EXISTS 子查詢及聚合函數題目，答案由 SQL 引擎計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]},{"id":"a3d","title":"合併結果、檢視及索引","book":"教科書 選修A 第 3 章 p.158–190","key":"A-a3d-hmac-902ca35d23","theory":false,"dbs":{"union":{"STUDENT":[["SID","NAME","SEX","CLASS","SCORE"],[["03493","Ada","F","3A",0],["03496","Clem","F","3B",89],["03505","Eva","F","3B",83],["03506","Gabe","M","3C",47],["03510","Finn","M","3B",35],["03513","Dio","M","3C",67],["03517","Ben","M","3A",86]],["SID"]],"STUDENT2":[["STUDENTID","NAME","SEX","CLASS","DOB"],[["03517","Benz","M","3A","2015-05-12"],["03518","Xing","M","3A","2015-05-01"],["03519","Yen","F","3B","2015-01-05"],["03520","Zack","M","3D","2015-02-15"]],["STUDENTID"]],"S1":[["SID"],[[4],[5],[8],[2],[1]],["SID"]],"S2":[["SID"],[[1],[8],[0],[3],[7]],["SID"]],"S3":[["SID"],[[2],[6],[7],[9],[8]],["SID"]]},"sports":{"PARTICIPANT":[["ID","NAME","GENDER","AGE"],[[1,"Amy","F",21],[2,"Bob","M",23],[3,"Cara","F",24],[4,"Dan","M",19],[5,"Ella","F",22],[6,"Fred","M",25],[7,"Gigi","F",22],[8,"Hugo","M",30]],["ID"]],"FOOTBALL":[["ID","PID","BIB","TEAM"],[[1,1,7,"A"],[2,2,10,"A"],[3,3,9,"B"],[4,5,11,"B"],[5,6,5,"A"]],["ID"]],"RELAYRACE":[["ID","PID","BIB","TEAM"],[[1,2,3,"B"],[2,3,7,"A"],[3,4,9,"A"],[4,6,2,"B"],[5,7,4,"A"]],["ID"]]},"books":{"BOOK":[["ISBN","BNAME","AUTHOR","PAGE"],[["9780001","Data Stories","Lee",320],["9780002","SQL Basics","Chan",180],["9780003","Cat Tales","Wong",41
