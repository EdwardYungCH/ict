項便會不一致"],["插入異常","沒有一個實體類型的數據，便無法插入另一個實體類型的數據","插班生未選科，EID 只能是 NULL，但主關鍵碼 SID+EID 不能是 NULL"],["刪除異常","刪除一個實體類型的數據，導致另一個實體類型的數據丟失","3A 唯一的學生 Ada 退學，3A 班主任是誰便無從得知"]]}},{"sim":{"db":"flat","sql":"UPDATE STUDENT SET ETEACH = 'Mrs Lee'\nWHERE ENAME = 'ICT'"},"cap":"p.279：Mrs Lee 代替 Mr Suen 教授 ICT。執行後看看要更新多少項記錄；若只更新其中一項，便出現更新異常。"},{"warn":"例題 5.4(a)（p.281）：Adam 改為擁有另一物業。因主關鍵碼是 CID+PID，Adam 與舊物業只有一項記錄，更新**不會**不一致；但舊物業只由 Adam 擁有，改動後舊物業的數據便丟失——這是**刪除異常**，不是更新異常。"}],"tries":[{"id":"a5b-s1-t1","pts":4,"src":"教科書 p.279","db":"flat","ask":{"cell":[1,"COUNT(*)"]},"sql":"UPDATE STUDENT SET ETEACH = 'Mrs Lee' WHERE ENAME = 'ICT';\nSELECT COUNT(*) FROM STUDENT WHERE ETEACH = 'Mrs Lee'","q":"先估：要保持數據一致，Mrs Lee 接手 ICT 時要更新多少項記錄？","options":["1","2","3","8"],"why":"Clem、Gabe、Finn 三項 ICT 記錄都存有教師名字。數據重複得越多，更新異常的機會越大。"}],"practice":[{"id":"a5b-s1-p1","type":"mc","pts":2,"src":"教科書 p.280 表 5.15","db":"flat","verify":true,"ask":{"cell":[1,"COUNT(*)"]},"tags":[{"t":"hot","why":"辨別更新／插入／刪除異常並舉例：DSE 卷二A 常考（教科書例題 5.4、測試站 5.5）。"}],"sql":"DELETE FROM STUDENT WHERE SNAME = 'Ada';\nSELECT COUNT(*) FROM STUDENT WHERE CLASS = '3A'","q":"Ada 退學，她的記錄被刪除。之後 STUDENT 還有多少項 3A 班的記錄？","options":["0","1","2","7"],"answer":0,"hint":"3A 班有多少個學生？","why":"3A 的班主任資料（Mrs Au）也隨之丟失——刪除異常。"},{"id":"a5b-s1-p2","type":"mc","pts":2,"src":"教科書 p.281–282 例題 5.4(b)、(c)","db":"citizen","verify":true,"ask":{"cell":[1,"COUNT(*)"]},"tags":[{"t":"hot","why":"辨別更新／插入／刪除異常並舉例：DSE 卷二A 常考（教科書例題 5.4、測試站 5.5）。"}],"sql":"SELECT COUNT(*)\nFROM CITIZEN\nWHERE PADDRESS LIKE 'CC City%'","q":"CC City 被重新命名為 CC Court。以上語句找出須要更新的記錄數目，結果是什麼？","options":["1","2","3","8"],"answer":1,"hint":"CC City 有兩個物業。","why":"CC City 11/F Flat C 和 CC City 15/F Flat D 各一項記錄，須更新兩項，可能出現更新異常。"},{"id":"a5b-s1-p3","type":"mc","pts":1,"src":"教科書 p.283 測試站 5.5(c)","db":"prod","verify":true,"ask":{"col":"PNAME"},"sql":"SELECT PNAME\nFROM PROD\nWHERE SID IN (SELECT SID\n              FROM PROD\n              GROUP BY SID\n              HAVING COUNT(*) = 1)","q":"以上語句找出「移除後會令店舖數據丟失」的產品。結果是什麼？","options":["Smartphone","Board game","Dollhouse","Smartphone, Dollhouse"],"answer":0,"hint":"哪間店舖只出售一種產品？","why":"FastTech 只出售 Smartphone；移除它，FastTech 的地點和店主資料便丟失——刪除異常。"},{"id":"a5b-s1-p4","type":"mc","pts":1,"src":"教科書 p.283 測試站 5.5(d)","q":"PROD (PID, CAT, PNAME, SID, PRICE, STOCK, SNAME, SLOCAT, SKNAME) 的主關鍵碼是 PID+SID。以下哪個情況會出現**插入異常**？","options":["HappyToy 的桌上遊戲減價","經理要加入一間尚未出售任何產品的新店舖","HomeZone 更換店主","移除 Smartphone"],"answer":1,"hint":"主關鍵碼不能有 NULL。","why":"新店舖沒有 PID，無法插入。減價只改一項記錄，沒有異常；換店主是更新異常；移除 Smartphone 是刪除異常。"}]},{"id":"s2","title":"第一範式與功能相關性","pages":"教科書 p.283–286","learn":[{"pts":["**規範化**：用特定方式設計數據庫，以減低數據冗餘度、防止異常、提升靈活度。常見等級：1NF、2NF、3NF。（p.283）","**第一範式（1NF）**：(1) 每個屬性**不得包含多於一個值**；(2) **不得有重複屬性**（例如 ENAME1、ENAME2、ENAME3，或 LM1、LM2、LM3）。（p.283–284）","規範化為 1NF：把多值分拆成**多項記錄**，例如 Clem 的「History, Physics, ICT」分拆為三項記錄，主關鍵碼變成 `SID+ENAME`。（p.285）","**功能相關性** `X → Y`：知道 X 的值，便能獨一無二地決定 Y 的值。例如 `CLASS → CTEACH`：知道班別便知道班主任，但不能知道學生姓名。（p.285–286）"]},{"table":{"head":["SID","SNAME","CLASS","CTEACH","ENAME"],"rows":[["03493","Ada","3A","Mrs Au","Physics"],["03496","Clem","3B","Mr Bao","History, Physics, ICT"],["03505","Eva","3B","Mr Bao","History"],["03506","Gabe","3C","Ms Chau","Physics, ICT"],["03510","Finn","3B","Mr Bao","ICT"]]},"cap":"p.284：ENAME 有多於一個值，不符合 1NF。"},{"sim":{"db":"flat","sql":"SELECT CLASS, COUNT(DISTINCT CTEACH)\nFROM STUDENT\nGROUP BY CLASS"},"cap":"用數據檢查 `CLASS → CTEACH`：每個班別只對應 1 個班主任。試把 CTEACH 改為 SNAME。（注意：樣本數據只能「反證」一個功能相關性；相關性本身要根據數據的意義決定。）"},{"pts":["p.286 試想想：`SID → {SNAME, CLASS}`；`{SID, EID} → SCORE`（要知道某學生某科的分數，兩者缺一不可）。","由 `SID → CLASS` 和 `CLASS → CTEACH`，可推出 `SID → CTEACH`。由 SID 出發能推出的所有屬性稱為 SID 的**閉包**。"]}],"tries":[{"id":"a5b-s2-t1","pts":4,"src":"教科書 p.286","db":"flat","ask":{"col":"CLASS"},"sql":"SELECT CLASS\nFROM STUDENT\nGROUP BY CLASS\nHAVING COUNT(DISTINCT SNAME) > 1","q":"先估：結果是什麼？","options":["3B","3B, 3C","3A, 3B, 3C","（沒有記錄）"],"why":"3B 有 Clem、Eva、Finn 三個不同的姓名，所以 CLASS → SNAME **不**成立。3C 雖然有兩項記錄，但都是 Gabe。"}],"practice":[{"id":"a5b-s2-p1","type":"mc","pts":2,"src":"教科書 p.294–295 例題 5.5(a)","q":"ACTOR 有 7 項記錄，主關鍵碼 ID+FID。其中兩項記錄的 AWARD 各存了兩個獎項（例如 Aria 的「Best Actress (IFCS), Best Actress (OFCS)」）。轉換為第一範式後有多少項記錄？","options":["7","8","9","11"],"answer":2,"hint":"每個獎項成為獨立的一項記錄。","why":"兩項記錄各多出一項：7 + 2 = 9。"},{"id":"a5b-s2-p2","type":"mc","pts":1,"src":"教科書 p.297 測試站 5.6(a)","tags":[{"t":"hot","why":"指出功能相關性、判斷範式及規範化至 3NF（寫出模式、主關鍵碼、外鍵碼）：DSE 卷二A 長題目幾乎每年都考。"}],"q":"CITY (CTID, CTNAME, TIMEZONE, AREA, POPULATION, LM1, LM2, LM3, CC, CNAME, HOS, CONTINENT)，LM1–LM3 是城市地標的名稱。CITY 符合第一範式嗎？","options":["符合，因為每格只有一個值","不符合，因為 LM1、LM2、LM3 是重複屬性","不符合，因為 CTID 是主關鍵碼","符合，因為沒有部分功能相關性"],"answer":1,"hint":"1NF 有兩條規則。","why":"重複屬性違反 1NF；改為另建 LANDMARK (LMID, LMNAME, CTID) 數據表，便可容許多於三個地標。"},{"id":"a5b-s2-p3","type":"fd","pts":2,"src":"教科書 p.286 試想想、p.290","ask":"closure:SID","attrs":"SID SNAME CLASS CTEACH EID ENAME ETEACH SCORE","fds":"SID->SNAME,CLASS; CLASS->CTEACH; EID->ENAME,ETEACH; SID,EID->SCORE","q":"功能相關性：SID → SNAME, CLASS；CLASS → CTEACH；EID → ENAME, ETEACH；SID, EID → SCORE。知道 SID，可以決定哪些屬性（SID 的閉包）？","options":["SID, SNAME, CLASS","SID, SNAME, CLASS, CTEACH","SID, SNAME, CLASS, CTEACH, SCORE","SID, SNAME, CLASS, CTEACH, EID, ENAME, ETEACH, SCORE"],"answer":1,"hint":"先加入 SNAME、CLASS；有了 CLASS 便可再加入 CTEACH。SCORE 需要 SID 和 EID。"}]},{"id":"s3","title":"第二範式","pages":"教科書 p.286–289","learn":[{"pts":["**第二範式（2NF）**：(1) 符合 1NF；(2) **沒有部分功能相關性**。（p.285）","**完全功能相關性**：所有非主關鍵碼屬性都依賴於**整個**主關鍵碼，例如 ELECTIVE 的 `EID → {ENAME, ETEACH}`。（p.286）","**部分功能相關性**：有非主關鍵碼屬性只依賴於**部分**主關鍵碼。主關鍵碼 SID+EID 中，`SID → {SNAME, CLASS, CTEACH}`、`EID → {ENAME, ETEACH}` 都只依賴一部分；只有 SCORE 依賴整個 SID+EID。（p.287）","只有主關鍵碼是**複合鍵**時，才可能有部分功能相關性。（p.287）","規範化為 2NF：按功能相關性把數據表一分為三——STUDENT (SID, SNAME, CLASS, CTEACH)、ELECTIVE (EID, ENAME, ETEACH)、ENROL (SID, EID, SCORE)。（p.288）"]},{"sim":{"db":"flat","sql":"SELECT DISTINCT SID, SNAME, CLASS, CTEACH\nFROM STUDENT"},"cap":"用 SELECT DISTINCT 從未規範化的數據表「抽出」2NF 的 STUDENT 數據表：重複的記錄消失了。"},{"pts":["活動 5.2（p.289）：規範化前，取消 ICT 會出現刪除異常、Gabe 改名會出現更新異常、接收插班生會出現插入異常；規範化後三種情況都**不會**出現異常。"]}],"tries":[{"id":"a5b-s3-t1","pts":4,"src":"教科書 p.288","db":"flat","ask":"rows","sql":"SELECT DISTINCT EID, ENAME, ETEACH\nFROM STUDENT","q":"先估：結果有多少行？","options":["1","3","5","8"],"why":"只有三個選修科目，DISTINCT 去除重複後就是 2NF 的 ELECTIVE 數據表。"}],"practice":[{"id":"a5b-s3-p1","type":"fd","pts":2,"src":"教科書 p.287","ask":"keys","tags":[{"t":"hot","why":"指出功能相關性、判斷範式及規範化至 3NF（寫出模式、主關鍵碼、外鍵碼）：DSE 卷二A 長題目幾乎每年都考。"}],"attrs":"SID SNAME CLASS CTEACH EID ENAME ETEACH SCORE","fds":"SID->SNAME,CLASS,CTEACH; EID->ENAME,ETEACH; SID,EID->SCORE","q":"STUDENT (SID, SNAME, CLASS, CTEACH, EID, ENAME, ETEACH, SCORE) 的功能相關性：SID → SNAME, CLASS, CTEACH；EID → ENAME, ETEACH；SID, EID → SCORE。候選鍵碼是什麼？","options":["SID","EID","SID, EID","SID, EID, SCORE"],"answer":2,"hint":"要能推出所有屬性，而且最簡化。","why":"SID 推不出 ENAME、SCORE；EID 推不出 SNAME；SID+EID 便足夠，SCORE 是多餘的。"},{"id":"a5b-s3-p2","type":"fd","pts":1,"src":"教科書 p.287","ask":"nf","attrs":"SID SNAME CLASS CTEACH EID ENAME ETEACH SCORE","fds":"SID->SNAME,CLASS,CTEACH; EID->ENAME,ETEACH; SID,EID->SCORE","q":"同一個 STUDENT 數據表（假設每格只有一個值）最高符合哪一個範式？","options":["1NF","2NF","3NF"],"answer":0,"hint":"SNAME 只依賴 SID（主關鍵碼的一部分）。","why":"有部分功能相關性，所以不符合 2NF。"},{"id":"a5b-s3-p3","type":"complete","pts":2,"src":"教科書 p.288","db":"flat","q":"再進一步規範化至 3NF 時，STUDENT 只保留 SID、SNAME、CLASS（CTEACH 移到 CLASSLIST）。從未規範化的 STUDENT 抽出這個數據表：三個欄位依此次序，每位學生只出現一次。","template":"SELECT ［1］\nFROM STUDENT","ref":["DISTINCT SID, SNAME, CLASS"],"hint":"Clem 和 Gabe 在原表有多項記錄，要用 DISTINCT。"}]},{"id":"s4","title":"第三範式與非規範化","pages":"教科書 p.290–297","learn":[{"pts":["**第三範式（3NF）**：(1) 符合 2NF；(2) **沒有遞移功能相關性**。（p.290）","**遞移功能相關性**：非主關鍵碼屬性依賴於**其他非主關鍵碼屬性**。例如 `SID → CLASS`、`CLASS → CTEACH`，所以 `SID → CTEACH` 是經 CLASS「轉介」而來的。（p.290）","規範化為 3NF：把 `CLASS → CTEACH` 抽出成 CLASSLIST (CLASS, CTEACH)；STUDENT 保留 CLASS 作**外鍵碼**。（p.291）","一句記住：每個非主關鍵碼屬性都依賴「**主關鍵碼、整個主關鍵碼、只依賴主關鍵碼**」。"]},{"table":{"head":["規則（p.305）","1NF","2NF","3NF"],"rows":[["每個屬性不包含多於一個值","✓","✓","✓"],["不包含重複屬性","✓","✓","✓"],["沒有部分功能相關性","","✓","✓"],["沒有遞移功能相關性","","","✓"]]}},{"warn":"教科書 p.291 的 CLASSLIST 印了 5 行（3B 重複三次），但 CLASS 是主關鍵碼，不能重複；正確的 CLASSLIST 只有 3 行。本單元的數據庫已更正。"},{"pts":["**非規範化**：為了更快提取數據，刻意保留數據冗餘，例如把四個數據表的連接結果存成一個數據表 STUDENTDE。適合數據不常更新、只經常被提取的情況。（p.292–293）","好處：提取更快、SQL 更簡單。壞處：需要更多儲存空間、難以靈活管理，並可能出現更新、插入、刪除異常。（p.294 表 5.20）"]},{"sim":{"db":"norm","sql":"SELECT s.SID, SNAME, c.CLASS, CTEACH, e.EID, ENAME, ETEACH, SCORE\nFROM STUDENT s, CLASSLIST c, ENROL en, ELECTIVE e\nWHERE s.SID = en.SID AND en.EID = e.EID AND s.CLASS = c.CLASS"},"cap":"p.292：把 3NF 的四個數據表連接，便還原出原本的數據。實驗站 5.1 把這個結果用 `INSERT INTO STUDENTDE (SELECT …)` 存起來。"}],"tries":[{"id":"a5b-s4-t1","pts":4,"src":"教科書 p.292","db":"norm","ask":"rows","sql":"SELECT s.SID, SNAME, c.CLASS, CTEACH, e.EID, ENAME, ETEACH, SCORE\nFROM STUDENT s, CLASSLIST c, ENROL en, ELECTIVE e\nWHERE s.SID = en.SID AND en.EID = e.EID AND s.CLASS = c.CLASS","q":"先估：這句四表連接傳回多少行？","options":["5","8","18","40"],"why":"ENROL 的每項記錄配對一個學生、一個班別、一個科目，所以共 8 行，與原本的 STUDENT 相同。"}],"practice":[{"id":"a5b-s4-p1","type":"fd","pts":1,"src":"教科書 p.296 例題 5.5(d)","ask":"nf","tags":[{"t":"hot","why":"指出功能相關性、判斷範式及規範化至 3NF（寫出模式、主關鍵碼、外鍵碼）：DSE 卷二A 長題目幾乎每年都考。"}],"attrs":"FID FNAME FYEAR GENRE GDESC","fds":"FID->FNAME,FYEAR,GENRE; GENRE->GDESC","q":"FILM (FID, FNAME, FYEAR, GENRE) 加入欄位 GDESC（電影類型的描述）。功能相關性：FID → FNAME, FYEAR, GENRE；GENRE → GDESC。FILM 現在最高符合哪一個範式？","options":["1NF","2NF","3NF"],"answer":1,"hint":"GDESC 依賴非主關鍵碼屬性 GENRE。","why":"主關鍵碼只有 FID，沒有部分功能相關性（2NF）；但 FID → GENRE → GDESC 是遞移功能相關性，所以不再符合 3NF。"},{"id":"a5b-s4-p2","type":"mc","pts":2,"src":"教科書 p.298 測試站 5.6(e)","tags":[{"t":"hot","why":"指出功能相關性、判斷範式及規範化至 3NF（寫出模式、主關鍵碼、外鍵碼）：DSE 卷二A 長題目幾乎每年都考。"}],"q":"CITY (CTID, CTNAME, TIMEZONE, AREA, POPULATION, CC, CNAME, HOS, CONTINENT) 已符合 2NF；CC 是國家地區代碼，CNAME、HOS、CONTINENT 是國家的資料。規範化至 3NF 後的模式是（＿ 表示主關鍵碼）：","options":["CITY (CTID＿, CTNAME, TIMEZONE, AREA, POPULATION)；COUNTRY (CC＿, CNAME, HOS, CONTINENT)","CITY (CTID＿, CTNAME, TIMEZONE, AREA, POPULATION, CC)；COUNTRY (CC＿, CNAME, HOS, CONTINENT)","CITY (CTID＿, CTNAME, TIMEZONE, AREA, POPULATION, CC, CNAME)；COUNTRY (CC＿, HOS, CONTINENT)","CITY (CTID＿, CC＿, CTNAME, TIMEZONE, AREA, POPULATION)；COUNTRY (CC＿, CNAME, HOS, CONTINENT)"],"answer":1,"hint":"CITY 要保留 CC 作外鍵碼，才可以連接到 COUNTRY。","why":"遞移相關 CTID → CC → CNAME, HOS, CONTINENT；把 CC 的資料抽出，CITY 保留 CC 作外鍵碼。"},{"id":"a5b-s4-p3","type":"mc","pts":1,"src":"教科書 p.291–292（CLASSLIST 照書中印出 5 行）","db":"normbad","verify":true,"ask":"rows","sql":"SELECT s.SID, SNAME, c.CLASS, CTEACH, e.EID, ENAME, ETEACH, SCORE\nFROM STUDENT s, CLASSLIST c, ENROL en, ELECTIVE e\nWHERE s.SID = en.SID AND en.EID = e.EID AND s.CLASS = c.CLASS","q":"若 CLASSLIST 照書中印出的 5 行（3B 重複三次），同一句四表連接會傳回多少行？","options":["5","8","18","40"],"answer":2,"hint":"3B 的學生每項記錄會配對到三行 CLASSLIST。","why":"Ada 1 + Clem 3×3 + Eva 1×3 + Gabe 2 + Finn 1×3 = 18。主關鍵碼重複（違反實體完整性）會令連接結果出現重複記錄。"},{"id":"a5b-s4-p4","type":"mc","pts":1,"src":"教科書 p.294 表 5.20、p.298 測試站 5.6(f)","q":"以下哪一項是**非規範化**的好處？","options":["需要較少儲存空間","不會出現更新異常","提取數據更快，SQL 語句更簡單","管理數據更靈活"],"answer":2,"hint":"非規範化不用連接多個數據表。","why":"其餘三項都是規範化的好處。"}]},{"id":"s5","title":"數據私隱：存取權限與檢視","pages":"教科書 p.298–302","learn":[{"pts":["**數據私隱**：個人資料只可用於**原本的收集目的**，並避免披露予未經授權人士。（p.298）","**用戶存取權限**：不同身份只獲授權進行需要的操作。數據庫模式設計員：CREATE、DROP、ALTER；帳戶管理員：INSERT、UPDATE、DELETE、SELECT；顧客：只可 UPDATE 及 SELECT 自身帳戶的數據。（p.299 表 5.22）","**檢視（VIEW）**限制用戶只能看到部分數據（某些記錄或某些欄位）。（p.299–300）"]},{"sim":{"db":"acct","sql":"CREATE VIEW AFILM AS\n    (SELECT * FROM ACCOUNT WHERE ATYPE IN (0, 1));\nSELECT * FROM AFILM"},"cap":"建立檢視後，客戶服務員只查詢 AFILM，看不到劇集帳戶（p.300；數據自擬）。試再建立只有 AID、USERNAME、ATYPE 三欄的檢視。"},{"sim":{"db":"game","sql":"SELECT PNAME, HKID, SEX, PNUM\nFROM P\nWHERE TNUM = (SELECT TNUM\n              FROM P\n              WHERE PNUM = '579')"},"cap":"例題 5.6(a)（p.300–301）：用 Kara 的參賽者編號找出她的隊友。但網頁顯示隊友的**香港身份證號碼**，侵犯數據私隱——應從 SELECT 中刪去 HKID。"}],"tries":[{"id":"a5b-s5-t1","pts":4,"src":"教科書 p.300–301 例題 5.6(a)","db":"game","ask":"rows","sql":"SELECT PNAME, HKID, SEX, PNUM\nFROM P\nWHERE TNUM = (SELECT TNUM\n              FROM P\n              WHERE PNUM = '579')","q":"先估：結果有多少行？","options":["1","3","4","7"],"why":"子查詢找出 Kara 的隊伍編號 2；隊伍 2 有 Connor、Kara、Alice、Markus 四人（包括 Kara 自己）。"}],"practice":[{"id":"a5b-s5-p1","type":"mc","pts":1,"src":"教科書 p.300","db":"acct","verify":true,"ask":"rows","sql":"CREATE VIEW AFILM AS\n    (SELECT * FROM ACCOUNT WHERE ATYPE IN (0, 1));\nSELECT * FROM AFILM","q":"檢視 AFILM 中有多少項記錄？","options":["2","3","4","6"],"answer":1,"hint":"ATYPE 0、1 是電影。","why":"amy88、cat_c、eva_e 三個帳戶。"},{"id":"a5b-s5-p2","type":"mc","pts":1,"src":"教科書 p.301 例題 5.6(c)","q":"每位參賽者只可以編輯自己在數據庫中的數據。應賦予他們哪項存取權限？（CREATE、INSERT、ALTER、UPDATE、DROP、DELETE）","options":["CREATE","INSERT","UPDATE","DELETE"],"answer":2,"hint":"CREATE、ALTER、DROP 用於設計數據庫；INSERT、DELETE 用於管理記錄。","why":"編輯已有的記錄只需要 UPDATE。"},{"id":"a5b-s5-p3","type":"fill","pts":1,"src":"教科書 p.302 測試站 5.7(a)","db":"health","sql":"SELECT AVG(HEIGHT)\nFROM STUDENT\nWHERE SEX = 'F' AND AGE BETWEEN 11 AND 14","q":"執行測試站 5.7(a) 的語句（數據自擬），年齡介乎 11 至 14 歲的女學生的平均身高是多少？","blanks":[{"label":"AVG(HEIGHT)","ask":{"cell":[1,"AVG(HEIGHT)"]}}],"hint":"BETWEEN 包括 11 和 14；Cathy 16 歲、Gigi 10 歲不計。"},{"id":"a5b-s5-p4","type":"mc","pts":1,"src":"教科書 p.302 測試站 5.7(b)、(d)","q":"學生身體檢查的數據存於 STUDENT。以下哪項正確？","options":["醫生可用這些數據為醫療服務做定向廣告，因為數據是他收集的","用數據做定向廣告並非原本的收集目的，會侵犯數據私隱；只負責搜索和匯出數據的研究人員應獲 SELECT 權限","研究人員應獲 CREATE 和 DELETE 權限","只要用檢視，便可以把數據用於任何目的"],"answer":1,"hint":"數據只可用於原本的收集目的。","why":"定向廣告不是原本目的；研究人員只需讀取數據（SELECT）。"}]},{"id":"write","kind":"write","title":"寫 SQL：規範化數據表","pages":"教科書 p.286–293","intro":"第 1 題用未規範化的數據庫 `flat`；第 2、3 題用 3NF 的數據庫 `norm`：STUDENT (SID, SNAME, CLASS)、CLASSLIST (CLASS, CTEACH)、ELECTIVE (EID, ENAME, ETEACH)、ENROL (SID, EID, SCORE)。系統會再用另外的數據檢查你的語句。","tasks":[{"id":"a5b-w1","pts":10,"title":"抽出 CLASSLIST（3NF）","src":"教科書 p.291","db":"flat","q":"未規範化的 STUDENT (SID, SNAME, CLASS, CTEACH, EID, ENAME, ETEACH, SCORE) 中有 `CLASS → CTEACH`。寫 SQL 產生 3NF 的 CLASSLIST 數據表：列出 CLASS 和 CTEACH，**每個班別只出現一次**（不要像教科書 p.291 那樣重複）。","starter":"SELECT CLASS, CTEACH\nFROM STUDENT","ref":"SELECT DISTINCT CLASS, CTEACH\nFROM STUDENT","hint":"用 DISTINCT 去除重複的記錄。"},{"id":"a5b-w2","pts":12,"title":"連接 3NF 數據表","src":"教科書 p.292","db":"norm","q":"列出所有修讀 **Physics** 的學生的 SNAME 及其**班主任** CTEACH（用科目名稱 ENAME，不要直接寫 EID）。","starter":"SELECT SNAME\nFROM STUDENT","ref":"SELECT s.SNAME, c.CTEACH\nFROM STUDENT s, CLASSLIST c, ENROL en, ELECTIVE e\nWHERE s.SID = en.SID AND en.EID = e.EID AND s.CLASS = c.CLASS AND e.ENAME = 'Physics'","hint":"四個數據表需要三個連接條件，再加 `e.ENAME = 'Physics'`。"},{"id":"a5b-w3","pts":13,"title":"每科人數及最高分","src":"自擬（教科書 p.288 ELECTIVE、ENROL）","db":"norm","q":"列出每個選修科目的 ENAME、修讀人數及最高分 SCORE（三個欄位依此次序）。","starter":"SELECT ENAME, COUNT(*)\nFROM ELECTIVE","ref":"SELECT e.ENAME, COUNT(*), MAX(en.SCORE)\nFROM ELECTIVE e, ENROL en\nWHERE e.EID = en.EID\nGROUP BY e.ENAME","hint":"連接 ELECTIVE 和 ENROL，再按 ENAME 分組；用 COUNT(*) 和 MAX(SCORE)。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.305–307","items":[{"id":"a5b-q1","pts":4,"src":"教科書 p.305–306 課題練習 1(b)","tags":[{"t":"hot","why":"指出功能相關性、判斷範式及規範化至 3NF（寫出模式、主關鍵碼、外鍵碼）：DSE 卷二A 長題目幾乎每年都考。"}],"q":"診所數據表 RECORD (PID, PNAME, SEX, AGE, DID, DNAME, DOA, DIAG)：PID／DID 是病人／醫生的識別碼，DOA 是預約日期，DIAG 是診斷。SEX 和 DNAME 分別依賴於哪個屬性？","options":["SEX 依賴 PNAME；DNAME 依賴 DOA","SEX 依賴 PID；DNAME 依賴 DID","兩者都依賴 PID+DID","SEX 依賴 DID；DNAME 依賴 PID"],"answer":"B","why":"PID → PNAME, SEX, AGE；DID → DNAME。病人可能同名，所以不是 PNAME。"},{"id":"a5b-q2","pts":4,"src":"教科書 p.306 課題練習 1(c)","tags":[{"t":"hot","why":"指出功能相關性、判斷範式及規範化至 3NF（寫出模式、主關鍵碼、外鍵碼）：DSE 卷二A 長題目幾乎每年都考。"}],"q":"把 RECORD 規範化至第三範式，以下哪一組數據表最合適？","options":["PATIENT (PID, PNAME, SEX, AGE)；DOCTOR (DID, DNAME)；APPOINTMENT (PID, DID, DOA, DIAG)","PATIENT (PID, PNAME, SEX, AGE, DNAME)；APPOINTMENT (PID, DID, DOA, DIAG)","PATIENT (PID, PNAME)；DOCTOR (DID, DNAME, SEX)；APPOINTMENT (PID, DID, DOA, DIAG, AGE)","RECORD (PID, PNAME, SEX, AGE, DID, DNAME, DOA, DIAG) 已是 3NF"],"answer":"A","why":"病人和醫生的資料各成一表；APPOINTMENT 以 PID、DID 作外鍵碼，保存每次預約的日期和診斷。"},{"id":"a5b-q3","pts":4,"src":"教科書 p.306 課題練習 2(b)","tags":[{"t":"trap","why":"沒有遞移功能相關性不代表符合 3NF：必須先符合 1NF、2NF。"}],"q":"ENROL (SID, CID1, CID2, CID3) 記錄學生報讀的課程。有人說「數據表沒有遞移功能相關性，所以符合第三範式」。為什麼這說法錯誤？","options":["因為 SID 不可以是主關鍵碼","CID1、CID2、CID3 是重複屬性，連第一範式也不符合","因為有部分功能相關性 CID1 → CID2","因為 3NF 不容許外鍵碼"],"answer":"B","why":"3NF 必須先符合 1NF 和 2NF。應改為 ENROL (SID, CID)，主關鍵碼 SID+CID。"},{"id":"a5b-q4","pts":4,"src":"教科書 p.307 課題練習 3(a)、(c)","tags":[{"t":"hot","why":"指出功能相關性、判斷範式及規範化至 3NF（寫出模式、主關鍵碼、外鍵碼）：DSE 卷二A 長題目幾乎每年都考。"}],"q":"QUESTION (YEAR, QUESTION, MARK, TCODE, TOTALMARK) 記錄每年考卷的題目：YEAR+QUESTION 是主關鍵碼，TOTALMARK 是該年考卷的總分。這個數據表為何不符合 3NF？","options":["YEAR → TOTALMARK 是部分功能相關性，所以連 2NF 也不符合","TCODE → MARK 是遞移功能相關性","MARK 有多於一個值","主關鍵碼不可以是複合鍵"],"answer":"A","why":"總分只依賴年份（主關鍵碼的一部分）；應把它抽出成 PAPER (YEAR, TOTALMARK)。"},{"id":"a5b-q5","pts":4,"src":"教科書 p.282 測試站 5.5(a)–(b)","tags":[{"t":"hot","why":"辨別更新／插入／刪除異常並舉例：DSE 卷二A 常考（教科書例題 5.4、測試站 5.5）。"}],"db":"prod","verify":true,"ask":{"cell":[1,"COUNT(*)"]},"sql":"SELECT COUNT(*)\nFROM PROD\nWHERE SNAME = 'HomeZone'","q":"HomeZone 的店主由 Cadan 換為 Abby。為避免更新異常，要更新多少項記錄？（以上語句計算）","options":["1","3","4","9"],"answer":"C","why":"HomeZone 出售四種產品，店主名字重複了四次；只更新一項便會出現更新異常。"}]},{"id":"more","kind":"endless","title":"無限練習","gens":["fdKey","fdNf","sqlDml"],"intro":"隨機生成候選鍵碼、範式判斷及 INSERT／UPDATE／DELETE 題目，答案由設計引擎及模擬器計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]},{"id":"a6","title":"綜合練習","book":"教科書 選修A 綜合練習 p.308–312（溫習第 1–5 章）","key":"A-a6-hmac-c82dcfa8e9","theory":false,"dbs":{"hr":{"EMPLOYEE":[["EID","ENAME","DEPT_ID"],[["E01","Alan Chan","D001"],["E02","Betty Lee","D001"],["E03","Calvin Cheung","D002"],["E04","Daisy Wong","D002"],["E05","Eric Ho","D002"],["E06","Fiona Lam","D003"],["E07","Gary Chow","D003"],["E08","Helen Ng","D001"]]],"DEPARTMENT":[["DEPT_ID","DEPT_NAME","DEPT_MANAGER"],[["D001","人力資源部","E01"],["D002","銷售部","E04"],["D003","資訊科技部","E07"]]],"ATTENDANCE":[["EID","ATT_DATE","ATT_TIME"],[["E01","2023-03-01","08:52:00"],["E01","2023-03-02","09:03:00"],["E01","2023-03-03","08:47:00"],["E01","2023-03-06","08:58:00"],["E02","2022-12-30","08:55:00"],["E02","2023-03-01","09:10:00"],["E02","2023-03-02","08:59:00"],["E02","2023-03-03","09:00:00"],["E03","2022-12-29","08:40:00"],["E03","2022-12-30","08:45:00"],["E03","2022-12-31","08:50:00"],["E03","2023-01-02","09:15:00"],["E04","2023-01-03","08:30:00"],["E04","2023-02-01","08:35:00"],["E04","2023-03-01","08:31:00"],["E04","2023-12-29","08:33:00"],["E04","2024-01-02","08:32:00"],["E05","2023-03-01","09:20:00"],["E05","2023-03-02","09:05:00"],["E06","2024-01-02","08:57:00"],["E06","2024-01-03","08:56:00"],["E06","2024-01-04","08:58:00"],["E06","2024-01-05","08:55:00"],["E07","2023-05-02","08:41:00"],["E07","2023-05-03","08:42:00"],["E07","2023-05-04","08:43:00"],["E07","2023-05-05","08:44:00"],["E07","2023-05-08","08:45:00"]]]},"shop":{"PRODUCT":[["PRODUCTID","PRODUCTNAME","BRAND","PRICE","STOCK"],[["P3001","Smart Watch","Apple",399,50],["P3002","Earbuds","Sony",199,0],["P3003","Power Bank","Anker",159,12],["P3004N","Fold Phone","Samsung",899,8],["P3005","Tablet","Apple",499,0],["P3006N","Smart Ring","Oura",299,20],["P3007","Keyboard","Logi",129,5]]],"ORDERS":[["ORDERID","ORDERDATE","CUSTOMERID","PAYMENTMETHOD","TOTAL"],[["O1001","2021-12-31","C2001","現金",399],["O1002","2022-01-05","C2001","信用卡",598],["O1003","2022-01-18","C2002","信用卡",1197],["O1004","2022-01-31","C2003","八達通",318],["O1005","2022-02-01","C2001","信用卡",899],["O1006","2022-03-28","C2002","現金",499],["O1007","2022-05-10","C2001","八達通",159],["O1008","2022-06-12","C2003","信用卡",798]]],"PRODUCTORDER":[["PRODUCTID","ORDERID","QUANTITY"],[["P3001","O1001",1],["P3001","O1002",1],["P3002","O1002",1],["P3001","O1003",3],["P3003","O1004",2],["P3004N","O1005",1],["P3005","O1006",1],["P3003","O1007",1],["P3005","O1008",1],["P3006N","O1008",1]]]},"mart":{"CUSTOMER":[["CUSTOMERID","CUSTOMERNAME","EMAIL"],[["C1001","Lee Siu Ming","johnlee@abcdabee.com"],["C1002","Wong Ka Yan","kywong@mail.com"],["C2001","Chan Tai Man","tmchan@mail.com"],["C2002","Ho Wong Fat","hwf@mail.com"],["C2003","Cheung Mei","mei@mail.com"]]],"PRODUCT":[["PRODUCTID","PRODUCTNAME","SUPPLIER","PRICE"],[["P1001","ABC Fruit","XYZ Co",2.5],["P1002","Milk","Fresh Farm",12.9],["P1003","Bread","Garden",9.5],["P2001","Apple Juice","XYZ Co",4],["P2002","Cookies","Jolly",15.9],["P2003","Rice","Golden",59.9]]],"SALES":[["TRANSACTIONID","TRANSDATE","CUSTOMERID","PRODUCTID","QUANTITY","AMOUNT"],[["T1001","2022-03-28","C1001","P1001",3,7.5],["T1002","2022-03-28","C2001","P2002",1,15.9],["T1003","2022-03-29","C2001","P1003",2,19],["T1004","2022-03-30","C2001","P2002",2,31.8],["T1005","2022-03-30","C1002","P1001",4,10],["T1006","2022-04-01","C2002","P1001",2,5],["T1007","2022-04-02","C2001","P1001",1,2.5],["T1008","2022-04-02","C1001","P1002",1,12.9],["T1009","2022-04-03","C2003","P1003",1,9.5]]]}},"sections":[{"id":"s1","title":"單一數據表查詢與函數","pages":"教科書 p.18–27、66–80；綜合練習 p.310–311 第 9(a)(b)(c)、10(a)(f) 題","learn":[{"pts":["本單元用綜合練習第 8–10 題的數據表（示例數據由本單元補上）：`hr`（員工上班）、`shop`（ABC 企業產品訂單）、`mart`（XYZ 超市銷售）。","基本格式：`SELECT 欄位 FROM 數據表 WHERE 條件 ORDER BY 欄位 [ASC|DESC]`。`DISTINCT` 去除重複的行。（p.18–21）","`LIKE`：`%` 代表任何數目（包括零個）的字符，`_` 代表剛好一個字符。「包含 Wong」寫 `LIKE '%Wong%'`；「以 N 結尾」寫 `LIKE '%N'`。（p.66–）","與 NULL 比較要寫 `IS NULL`／`IS NOT NULL`，不可寫 `= NULL`。","常用函數：`LENGTH()`、`MID(s, 開始, 個數)`、`LEFT()`、`RIGHT()`、`UPPER()`、`LOWER()`、`TRIM()`；日期：`YEAR()`、`MONTH()`、`DAY()`。（p.77–78）","改數據用 DML：`UPDATE … SET … WHERE …`、`DELETE FROM … WHERE …`、`INSERT INTO … VALUES (…)`。忘記 `WHERE` 會改動**所有**記錄。（p.17、26–27）"]},{"table":{"head":["綜合練習題目","參考答案（本單元自擬）"],"rows":[["9(a) 列出所有產品的名稱和識別碼","`SELECT PRODUCTNAME, PRODUCTID FROM PRODUCT`"],["9(b) 新產品（PRODUCTID 以 N 結尾）價格加 $10","`UPDATE PRODUCT SET PRICE = PRICE + 10 WHERE PRODUCTID LIKE '%N'`"],["9(c) 列出完全售罄產品的名稱","`SELECT PRODUCTNAME FROM PRODUCT WHERE STOCK = 0`"],["10(a) 名字包含 Wong 的顧客","`SELECT CUSTOMERNAME FROM CUSTOMER WHERE CUSTOMERNAME LIKE '%Wong%'`"],["10(f) P2001 價格改為 $3.5","`UPDATE PRODUCT SET PRICE = 3.5 WHERE PRODUCTID = 'P2001'`"]]}},{"warn":"9(b) 也可寫 `WHERE RIGHT(PRODUCTID, 1) = 'N'`。寫 `LIKE 'N%'` 是「以 N 開首」，寫 `LIKE '%N%'` 會把中間有 N 的編號也包括在內，都不對。"},{"sim":{"db":"shop","sql":"UPDATE PRODUCT\nSET PRICE = PRICE + 10\nWHERE PRODUCTID LIKE '%N';\nSELECT * FROM PRODUCT"},"cap":"綜合練習 9(b)（p.310）：執行後，被改動的記錄會亮起。按「重設數據」可還原。"},{"fix":{"bad":"SELECT CUSTOMERNAME FROM CUSTOMER WHERE CUSTOMERNAME = '%Wong%'","good":"SELECT CUSTOMERNAME FROM CUSTOMER WHERE CUSTOMERNAME LIKE '%Wong%'","why":"`%` 只在 `LIKE` 中才是萬用字符；用 `=` 會找名字剛好是「%Wong%」的顧客。"}}],"tries":[{"id":"a6-s1-t1","pts":4,"src":"綜合練習 p.311 第 10(a) 題","db":"mart","sql":"SELECT CUSTOMERNAME\nFROM CUSTOMER\nWHERE CUSTOMERNAME LIKE '%Wong%'","ask":{"col":"CUSTOMERNAME"},"q":"先估：輸出哪些名字？","options":["Wong Ka Yan","Wong Ka Yan, Ho Wong Fat","Ho Wong Fat","Wong Ka Yan, Ho Wong Fat, Cheung Mei"],"why":"`%Wong%` 表示 Wong 前後可以有任何字符（包括沒有），所以姓 Wong 和名字中間有 Wong 的都符合。若只要「姓 Wong」，應寫 `LIKE 'Wong%'`。"}],"practice":[{"id":"a6-s1-p1","type":"complete","pts":2,"src":"綜合練習 p.310 第 9(b) 題","db":"shop","label":"補完 SQL","q":"新發布產品的 PRODUCTID 以 'N' 結尾。把這些產品的價格提高 $10。","template":"UPDATE PRODUCT\nSET PRICE = ［1］\nWHERE PRODUCTID LIKE ［2］;\nSELECT * FROM PRODUCT","ref":["PRICE + 10","'%N'"],"hint":"新價格是舊價格加 10；「以 N 結尾」：N 前面可以有任何字符。"},{"id":"a6-s1-p2","type":"mc","pts":2,"src":"自擬（LIKE 的 _）","db":"shop","verify":true,"ask":"rows","q":"以下語句輸出多少行？","sql":"SELECT PRODUCTID, PRODUCTNAME\nFROM PRODUCT\nWHERE PRODUCTID LIKE 'P300_'","options":["2","5","7","0"],"answer":1,"hint":"`_` 剛好代表一個字符：P3004N、P3006N 有 6 個字符，不符合。","why":"P3001、P3002、P3003、P3005、P3007 符合，共 5 行。"},{"id":"a6-s1-p3","type":"fill","pts":2,"src":"自擬（參考教科書 p.78–80 例題 2.3）","db":"mart","q":"寫出以下語句的輸出。","sql":"SELECT MID(CUSTOMERNAME, 1, 4) AS A, LENGTH(EMAIL) AS B, MONTH(TRANSDATE) AS C\nFROM CUSTOMER, SALES\nWHERE CUSTOMER.CUSTOMERID = SALES.CUSTOMERID AND TRANSACTIONID = 'T1005'","blanks":[{"label":"A","ask":{"cell":[1,"A"]}},{"label":"B","ask":{"cell":[1,"B"]}},{"label":"C","ask":{"cell":[1,"C"]}}],"hint":"T1005 的顧客是 C1002。MID 由第 1 個字符起取 4 個；LENGTH 包括 @ 和 . 。"}]},{"id":"s2","title":"聚合函數、GROUP BY 與 HAVING","pages":"教科書 p.81–92；綜合練習 p.309–311 第 8(b)(iii)、9(d)(e)、10(b)(d) 題","learn":[{"pts":["聚合函數：`COUNT(*)`（記錄數目）、`COUNT(欄)`（不計 NULL）、`COUNT(DISTINCT 欄)`（不同值的數目）、`SUM`、`AVG`、`MAX`、`MIN`。聚合函數不計 NULL。（p.81–90）","`GROUP BY`：把欄位值相同的記錄歸入同一組，每組輸出一行。`SELECT` 中沒有被聚合的欄位都要寫在 `GROUP BY`。（p.81–）","`WHERE` 在分組**前**篩選記錄；`HAVING` 在分組**後**篩選組別。聚合函數不可寫在 `WHERE`。","「某年某月」：`YEAR(ORDERDATE) = 2022 AND MONTH(ORDERDATE) = 1`，或 `ORDERDATE BETWEEN '2022-01-01' AND '2022-01-31'`。","「超過」是 `>`，「至少」是 `>=`，「未超過」是 `\u003c=` —— DSE 常在這裏扣分。"]},{"table":{"head":["綜合練習題目","參考答案（本單元自擬）"],"rows":[["8(b)(iii) 有上班記錄的員工數量","`SELECT COUNT(DISTINCT EID) FROM ATTENDANCE`"],["9(d) 2022 年 1 月所有訂單的總收入","`SELECT SUM(TOTAL) FROM ORDERS WHERE YEAR(ORDERDATE) = 2022 AND MONTH(ORDERDATE) = 1`"],["9(e) 2022 年至少下過 3 個訂單的客戶（原題：過去一年）","`SELECT CUSTOMERID FROM ORDERS WHERE YEAR(ORDERDATE) = 2022 GROUP BY CUSTOMERID HAVING COUNT(*) >= 3`"],["10(b) 所有產品中最高的價格","`SELECT MAX(PRICE) FROM PRODUCT`"],["10(d) 交易次數超過 50 次的產品（本單元改為 2 次）","`SELECT PRODUCTID, COUNT(*) FROM SALES GROUP BY PRODUCTID HAVING COUNT(*) > 2`"]]}},{"fix":{"bad":"SELECT PRODUCTID FROM SALES WHERE COUNT(*) > 2 GROUP BY PRODUCTID","good":"SELECT PRODUCTID, COUNT(*) FROM SALES GROUP BY PRODUCTID HAVING COUNT(*) > 2","why":"聚合函數不可用在 `WHERE`；分組後的條件要寫在 `HAVING`。題目要求「顯示產品 ID 和交易次數」，`SELECT` 也要有 `COUNT(*)`。"}},{"warn":"8(b)(iii)「有上班記錄的員工數量」：`COUNT(*)` 計算的是上班記錄的數目（每人很多筆），要用 `COUNT(DISTINCT EID)`。"},{"sim":{"db":"shop","sql":"SELECT CUSTOMERID, COUNT(*)\nFROM ORDERS\nWHERE YEAR(ORDERDATE) = 2022\nGROUP BY CUSTOMERID"},"cap":"先看每位客戶 2022 年的訂單數目，再加上 `HAVING COUNT(*) >= 3`。試把 WHERE 刪去，看看 C2001 的數目有何改變。"}],"tries":[{"id":"a6-s2-t1","pts":4,"src":"綜合練習 p.309 第 8(b)(iii) 題","db":"hr","sql":"SELECT COUNT(*), COUNT(DISTINCT EID)\nFROM ATTENDANCE","ask":"table","q":"先估：輸出是什麼？","options":["28, 7","28, 8","7, 7","8, 8"],"why":"ATTENDANCE 有 28 筆上班記錄；不同的 EID 只有 7 個（E08 沒有上班記錄，不會出現在 ATTENDANCE）。題目問「員工數量」，答案是 `COUNT(DISTINCT EID)`。"}],"practice":[{"id":"a6-s2-p1","type":"complete","pts":2,"src":"綜合練習 p.310 第 9(d) 題","db":"shop","label":"補完 SQL","q":"找出 2022 年 1 月份所有訂單產生的總收入。","template":"SELECT ［1］\nFROM ORDERS\nWHERE ［2］","ref":["SUM(TOTAL)","YEAR(ORDERDATE) = 2022 AND MONTH(ORDERDATE) = 1"],"hint":"總收入是 TOTAL 的總和；條件要同時限制年份和月份（2021-12-31、2022-02-01 都不應計算）。"},{"id":"a6-s2-p2","type":"mc","pts":2,"src":"綜合練習 p.310 第 9(e) 題（改編）","db":"shop","verify":true,"ask":{"col":"CUSTOMERID"},"q":"以下語句的輸出是什麼？","sql":"SELECT CUSTOMERID\nFROM ORDERS\nWHERE YEAR(ORDERDATE) = 2022\nGROUP BY CUSTOMERID\nHAVING COUNT(*) >= 3","options":["C2001","C2001, C2002","C2002, C2003","C2001, C2002, C2003"],"answer":0,"hint":"C2001 的 O1001 在 2021 年，先被 WHERE 剔除。","why":"2022 年：C2001 有 3 張訂單（O1002、O1005、O1007），C2002、C2003 各 2 張。"},{"id":"a6-s2-p3","type":"mc","pts":2,"src":"綜合練習 p.311 第 10(d) 題（改編）","db":"mart","verify":true,"ask":"table","q":"以下語句的輸出是什麼？","sql":"SELECT PRODUCTID, COUNT(*)\nFROM SALES\nGROUP BY PRODUCTID\nHAVING COUNT(*) >= 2\nORDER BY PRODUCTID","options":["P1001, 4","P1001, 4\nP1003, 2\nP2002, 2","P1001, 4\nP1002, 1\nP1003, 2\nP2002, 2","P1001, 10\nP1003, 3\nP2002, 3"],"answer":1,"hint":"COUNT(*) 數的是交易記錄數目，不是 QUANTITY 的總和；>= 2 包括剛好 2 次。","why":"P1001 有 4 筆交易，P1003、P2002 各 2 筆，P1002 只有 1 筆。"}]},{"id":"s3","title":"連接、子查詢與集合運算","pages":"教科書 p.104–169；綜合練習 p.309–311 第 8(b)(i)(ii)(v)、9(f)、10(c) 題","learn":[{"pts":["連接兩個數據表：`FROM A, B WHERE A.k = B.k` 或 `FROM A INNER JOIN B ON A.k = B.k`。N 個數據表要 N − 1 個連接條件。（p.104–107）","`LEFT JOIN`：保留左表所有記錄，沒有配對的右表欄位是 NULL。配合 `WHERE 右表.k IS NULL` 可找出「沒有……」的記錄。（p.108）","同一個數據表可以用兩次（給不同別名），例如 8(b)(ii)：員工 `E` 和經理 `M` 都在 EMPLOYEE。","子查詢：`IN`／`NOT IN`、`EXISTS`／`NOT EXISTS`、`= (SELECT MAX(…))`、`> (SELECT AVG(…))`。（p.134–157）","集合運算：`UNION`（合併、去除重複）、`INTERSECT`（兩邊都有）、`MINUS`／`EXCEPT`（在左邊而不在右邊）。（p.158–169）","連接後同一個值可能重複出現，題目要「列出產品名稱」時要考慮 `DISTINCT`。"]},{"table":{"head":["綜合練習題目","參考答案（本單元自擬）"],"rows":[["8(b)(i) 銷售部員工的姓名和部門，按姓名升序","`SELECT E.ENAME, D.DEPT_NAME FROM EMPLOYEE E, DEPARTMENT D WHERE E.DEPT_ID = D.DEPT_ID AND D.DEPT_NAME = '銷售部' ORDER BY E.ENAME`"],["8(b)(ii) 人力資源部員工的姓名及其部門經理的姓名","`SELECT E.ENAME, M.ENAME FROM EMPLOYEE E, DEPARTMENT D, EMPLOYEE M WHERE E.DEPT_ID = D.DEPT_ID AND D.DEPT_MANAGER = M.EID AND D.DEPT_NAME = '人力資源部'`"],["9(f) `SELECT PRODUCTID FROM PRODUCT MINUS SELECT PRODUCTID FROM PRODUCTORDER` 的目的","列出從未被訂購（沒有出現在任何訂單）的產品識別碼"],["10(c) 向顧客 C2001 出售的產品名稱，按字母順序","`SELECT DISTINCT P.PRODUCTNAME FROM SALES S, PRODUCT P WHERE S.PRODUCTID = P.PRODUCTID AND S.CUSTOMERID = 'C2001' ORDER BY P.PRODUCTNAME`"]]}},{"sim":{"db":"hr","sql":"SELECT E.ENAME, M.ENAME AS MANAGER\nFROM EMPLOYEE E, DEPARTMENT D, EMPLOYEE M\nWHERE E.DEPT_ID = D.DEPT_ID\n  AND D.DEPT_MANAGER = M.EID\n  AND D.DEPT_NAME = '人力資源部'"},"cap":"綜合練習 8(b)(ii)（p.309）：EMPLOYEE 用了兩次，E 是員工，M 是經理。"},{"note":"「找出沒有……」的四種寫法（結果相同）：`NOT IN (子查詢)`、`LEFT JOIN … WHERE … IS NULL`、`NOT EXISTS (相關子查詢)`、`MINUS`。用 `NOT IN` 時，子查詢的欄位不可有 NULL。"},{"sim":{"db":"shop","sql":"SELECT PRODUCTID FROM PRODUCT\nWHERE PRODUCTID NOT IN (SELECT PRODUCTID\n                        FROM PRODUCTORDER)"},"cap":"與 9(f) 的 MINUS 語句結果相同。（MySQL 不接受 MINUS，上機要改寫成 NOT IN 或 EXCEPT。）"}],"tries":[{"id":"a6-s3-t1","pts":4,"src":"綜合練習 p.309 第 8(b)(ii) 題","db":"hr","sql":"SELECT E.ENAME, M.ENAME AS MANAGER\nFROM EMPLOYEE E, DEPARTMENT D, EMPLOYEE M\nWHERE E.DEPT_ID = D.DEPT_ID\n  AND D.DEPT_MANAGER = M.EID\n  AND D.DEPT_NAME = '人力資源部'","ask":"rows","q":"先估：結果有多少行？","options":["1","3","4","8"],"why":"人力資源部（D001）有 E01、E02、E08 三名員工，每人一行，經理都是 Alan Chan（經理本人也是部門員工，所以也會出現）。"},{"id":"a6-s3-t2","pts":4,"src":"綜合練習 p.310 第 9(f) 題","db":"shop","sql":"SELECT PRODUCTID FROM PRODUCT\nMINUS\nSELECT PRODUCTID FROM PRODUCTORDER","ask":{"col":"PRODUCTID"},"q":"先估：輸出是什麼？","options":["P3007","P3002, P3005","P3004N, P3006N, P3007","P3001, P3003, P3005"],"why":"MINUS 保留在 PRODUCT 中、但不在 PRODUCTORDER 中的 PRODUCTID，即從未被訂購的產品：只有 P3007。（P3002、P3005 是售罄，與訂購無關。）"}],"practice":[{"id":"a6-s3-p1","type":"complete","pts":3,"src":"綜合練習 p.311 第 10(c) 題","db":"mart","label":"補完 SQL","q":"列出向顧客 'C2001' 出售的產品名稱，按產品名稱的字母順序排列（每個名稱只列一次）。","template":"SELECT ［1］ P.PRODUCTNAME\nFROM SALES S, PRODUCT P\nWHERE ［2］\n  AND S.CUSTOMERID = 'C2001'\nORDER BY ［3］","ref":["DISTINCT","S.PRODUCTID = P.PRODUCTID","P.PRODUCTNAME"],"check":{"order":true},"hint":"C2001 買了兩次 Cookies；兩個數據表要一個連接條件。"},{"id":"a6-s3-p2","type":"mc","pts":2,"src":"自擬（參考教科書 p.108–111 LEFT JOIN）","db":"hr","verify":true,"ask":{"col":"ENAME"},"q":"以下語句的輸出是什麼？","sql":"SELECT E.ENAME\nFROM EMPLOYEE E LEFT JOIN ATTENDANCE A\n  ON E.EID = A.EID\nWHERE A.EID IS NULL","options":["Helen Ng","Fiona Lam, Helen Ng","Eric Ho, Helen Ng","Alan Chan, Betty Lee, Calvin Cheung, Daisy Wong, Eric Ho, Fiona Lam, Gary Chow"],"answer":0,"hint":"A.EID IS NULL：在 ATTENDANCE 中完全找不到配對的員工。","why":"只有 E08 Helen Ng 沒有任何上班記錄。Fiona Lam 在 2023 年沒有上班，但 2024 年有記錄，所以有配對。"},{"id":"a6-s3-p3","type":"fill","pts":2,"src":"自擬（子查詢）","db":"shop","q":"以下語句輸出多少行？","sql":"SELECT PRODUCTNAME\nFROM PRODUCT\nWHERE PRICE > (SELECT AVG(PRICE)\n               FROM PRODUCT)","blanks":[{"label":"行數","ask":"rows"}],"hint":"先計算子查詢：7 件產品的平均價格是多少？"}]},{"id":"s4","title":"數據庫設計：鍵碼、完整性、實體關係圖、規範化","pages":"教科書 p.170–185、202–237、244–297；綜合練習 p.308–312 第 1–7、8(a)、11 題","learn":[{"h":"鍵碼與完整性（第 8(a)、1 題）"},{"pts":["**主關鍵碼**：獨一無二、不可為 NULL、最簡化；可以由多個欄位組成（複合鍵）。**外鍵碼**：參照另一個數據表的主關鍵碼。（p.213–222）","**實體完整性**：主關鍵碼存在而且有效；**參照完整性**：外鍵碼的值必須在父數據表中存在（或為 NULL）；**域完整性**：數據類型和限制。（p.225–232）","第 1 題：員工離職而被刪除，但 SHOP 的經理欄（外鍵碼）仍指向他 → 違反**參照完整性**。做法：先把該商店的經理改為另一名員工（或 NULL），才刪除員工記錄（或設定 ON DELETE 動作）。"]},{"table":{"head":["第 8(a) 題","主關鍵碼","外鍵碼"],"rows":[["EMPLOYEE","EID","DEPT_ID（參照 DEPARTMENT）"],["ATTENDANCE","(EID, ATT_DATE)","EID（參照 EMPLOYEE）"],["DEPARTMENT","DEPT_ID","DEPT_MANAGER（參照 EMPLOYEE.EID）"]]}},{"warn":"ATTENDANCE 中 EID 會重複（每天一筆），單獨 EID 不能做主關鍵碼；同一員工每天只有一筆上班記錄，所以 (EID, ATT_DATE) 才是主關鍵碼。"},{"h":"檢視、索引、衍生屬性、回滾（第 2–4 題）"},{"table":{"head":["概念","要點"],"rows":[["檢視 view（p.170–181、299）","虛擬的數據表。優點：簡化經常重用的複雜查詢；只讓用戶看到部分欄位／記錄，保障數據私隱。"],["索引 index（p.182–185、223）","優點：加快檢索（可用二分檢索）。缺點：需要額外儲存空間；插入／更新數據時要同時更新索引，較慢。只為經常搜尋的欄位（例如姓名）建立索引。"],["衍生屬性（p.204）","可由其他屬性計算出來，例如由 DOE（僱用日期）和今天日期計算 LOE（僱用期限）。優點：查詢時不用每次計算；缺點：佔用空間，而且日子過去後數值會過時，要不斷更新，否則數據不一致。"],["回滾 rollback（p.233–）","把數據庫復原至先前的狀態（例如交易出錯後取消）。要定期備份；回滾後，之後的合法更新亦可能一併消失。"]]}},{"h":"實體關係圖（第 5–7 題）"},{"pts":["第 5 題：員工與部門是**多對多**（員工可在多個部門工作，部門有多名員工）；「部門由一位員工管理」是另一個關係（每個部門有一名經理）。","第 7 題：「選科紀錄」連接一個課程和一個學生並有成績 → 把學生與課程的多對多關係**分解**為兩個一對多關係。（p.260–276）"]},{"er":{"entities":[{"name":"STUDENT","attrs":["*SID","SNAME"]},{"name":"ENROLMENT","attrs":["*SID","*CID","GRADE"]},{"name":"COURSE","attrs":["*CID","CNAME","CREDIT"]},{"name":"LECTURER","attrs":["*LID","LNAME"]}],"rels":[{"a":"STUDENT","b":"ENROLMENT","name":"進行","card":"1:M"},{"a":"ENROLMENT","b":"COURSE","name":"屬於","card":"M:1"},{"a":"LECTURER","b":"COURSE","name":"教授","card":"M:N"}]},"cap":"第 7 題（p.309）參考答案。題目不要求屬性，這裏加上方便理解。"},{"h":"規範化（第 11 題）"},{"pts":["1NF：每個屬性只有一個值、沒有重複屬性；2NF：再沒有**部分**功能相關性；3NF：再沒有**遞移**功能相關性。（p.283–291）","第 11 題的借書紀錄：一名用戶有多筆借書（重複組），每筆有 ISBN、書名、DDC、借書日、到期日。NAME 只依賴 HKID、書名只依賴 ISBN（部分功能相關性）；ISBN → DDC → 種類（遞移功能相關性）。所以要拆成四個數據表。"]},{"code":"USER     (HKID, NAME, GENDER, PHONE, EMAIL)          主關鍵碼：HKID\nCATEGORY (DDC, CATEGORY)                             主關鍵碼：DDC\nBOOK     (ISBN, TITLE, DDC)                          主關鍵碼：ISBN；外鍵碼：DDC\nLOAN     (HKID, ISBN, BORROW_DATE, DUE_DATE)          主關鍵碼：(HKID, ISBN, BORROW_DATE)；\n                                                      外鍵碼：HKID、ISBN","cap":"第 11 題（p.312）參考答案（3NF）。同一用戶可以再借同一本書（陳大文兩次借《豬命何在？》），所以借書日要放進主關鍵碼。"},{"sim":{"db":"hr","sql":"DELETE FROM EMPLOYEE WHERE EID = 'E04';\nSELECT DEPT_ID, DEPT_MANAGER\nFROM DEPARTMENT\nWHERE DEPT_MANAGER NOT IN (SELECT EID FROM EMPLOYEE)"},"cap":"模擬第 1 題：本練習的數據表沒有設定外鍵碼限制，刪除經理後，DEPARTMENT 便出現「孤兒」外鍵碼 —— 這就是參照完整性受到破壞。"}],"tries":[{"id":"a6-s4-t1","pts":4,"src":"綜合練習 p.308 第 1 題（改用第 8 題的數據表）","db":"hr","sql":"DELETE FROM EMPLOYEE WHERE EID = 'E04';\nSELECT DEPT_ID, DEPT_MANAGER\nFROM DEPARTMENT\nWHERE DEPT_MANAGER NOT IN (SELECT EID FROM EMPLOYEE)","ask":"table","q":"先估：刪除 E04 後，SELECT 的輸出是什麼？（數據表沒有設定外鍵碼限制）","options":["D002, E04","D001, E01\nD002, E04\nD003, E07","D001, E01\nD003, E07","（沒有輸出）E04 已被刪除"],"why":"E04 是銷售部（D002）的經理。刪除後 DEPT_MANAGER = 'E04' 找不到對應員工，違反參照完整性。若有設定外鍵碼限制，DBMS 會拒絕這次刪除。"}],"practice":[{"id":"a6-s4-p1","type":"fd","pts":1,"src":"綜合練習 p.309 第 8(a) 題","q":"ATTENDANCE (EID, ATT_DATE, ATT_TIME)：同一員工每天只有一筆上班記錄。候選鍵碼是什麼？","attrs":"EID ATT_DATE ATT_TIME","fds":"EID ATT_DATE -> ATT_TIME","ask":"keys","options":["EID","ATT_DATE","EID ATT_DATE","EID ATT_DATE ATT_TIME"]},{"id":"a6-s4-p2","type":"fd","pts":2,"src":"綜合練習 p.312 第 11 題","q":"把第 11 題的借書紀錄寫成一個數據表（屬性如下）。HKID 決定用戶資料；ISBN 決定書名和 DDC；DDC 決定種類；同一用戶在同一日借同一本書只有一筆記錄。候選鍵碼是什麼？","attrs":"HKID NAME ISBN TITLE DDC CATEGORY BDATE DUEDATE","fds":"HKID -> NAME; ISBN -> TITLE DDC; DDC -> CATEGORY; HKID ISBN BDATE -> DUEDATE","ask":"keys","options":["HKID ISBN","HKID ISBN BDATE","ISBN BDATE","HKID BDATE DUEDATE"]},{"id":"a6-s4-p3","type":"fd","pts":1,"src":"綜合練習 p.312 第 11 題","q":"上題的數據表（已是 1NF）最高符合哪個範式？","attrs":"HKID NAME ISBN TITLE DDC CATEGORY BDATE DUEDATE","fds":"HKID -> NAME; ISBN -> TITLE DDC; DDC -> CATEGORY; HKID ISBN BDATE -> DUEDATE","ask":"nf","options":["1NF","2NF","3NF"]},{"id":"a6-s4-p4","type":"mc","pts":2,"src":"綜合練習 p.309 第 7 題","q":"第 7 題：每個選科紀錄都與一個課程和一個學生相關聯，並包括一個成績。以下哪項最能表示學生、選科紀錄、課程之間的關係？","options":["學生 1:M 選科紀錄，選科紀錄 M:1 課程","學生 M:1 選科紀錄，選科紀錄 1:M 課程","學生 1:1 選科紀錄，選科紀錄 1:1 課程","學生 M:N 課程，不需要選科紀錄"],"answer":0,"hint":"一名學生有多個選科紀錄；一個選科紀錄只屬於一個課程。","why":"學生與課程本是多對多；「選科紀錄」帶有自己的屬性（成績），把它分解為兩個一對多關係（教科書 p.260–276）。"}]},{"id":"write","kind":"write","title":"寫 SQL：DSE 長題","pages":"綜合練習 p.309–311 第 8(b)(iv)(v)、10(c) 題","tasks":[{"id":"a6-w1","pts":10,"title":"向 C2001 出售的產品","db":"mart","q":"綜合練習 p.311 第 10(c) 題。\n\n使用 `mart` 數據庫，寫一句 SQL：列出曾經向顧客 `'C2001'` 出售的**產品名稱**，按產品名稱的字母順序（升序）排列。每個產品名稱只列一次。","starter":"SELECT PRODUCTNAME\nFROM PRODUCT","ref":"SELECT DISTINCT P.PRODUCTNAME\nFROM SALES S, PRODUCT P\nWHERE S.PRODUCTID = P.PRODUCTID\n  AND S.CUSTOMERID = 'C2001'\nORDER BY P.PRODUCTNAME","check":{"order":true},"hint":"產品名稱在 PRODUCT，顧客在 SALES：兩個數據表要用 PRODUCTID 連接。C2001 買過兩次同一產品，要用 DISTINCT。"},{"id":"a6-w2","pts":12,"title":"2023 年上班超過 3 次的員工","db":"hr","q":"綜合練習 p.309 第 8(b)(iv) 題（原題「超過 15 次」，本題改為 3 次）。\n\n使用 `hr` 數據庫，寫一句 SQL：列出 **2023 年**有**超過 3 次**上班記錄的員工姓名（ENAME）。\n\n留意：2022 年、2024 年的記錄不計；剛好 3 次的不算「超過」。","starter":"SELECT ENAME\nFROM EMPLOYEE","ref":"SELECT E.ENAME\nFROM EMPLOYEE E, ATTENDANCE A\nWHERE E.EID = A.EID\n  AND YEAR(A.ATT_DATE) = 2023\nGROUP BY E.EID, E.ENAME\nHAVING COUNT(*) > 3","rules":[{"must":"GROUP BY","msg":"要按員工分組（GROUP BY）才可計算每人的次數。"}],"hint":"先用 WHERE 只保留 2023 年的記錄（YEAR(ATT_DATE) = 2023），再 GROUP BY 員工，最後 HAVING COUNT(*) > 3。姓名在 EMPLOYEE，要連接。"},{"id":"a6-w3","pts":13,"title":"2023 年上班不超過 3 天的員工（包括從未上班）","db":"hr","q":"綜合練習 p.309 第 8(b)(v) 題（原題「未超過 15 天」，本題改為 3 天）。\n\n使用 `hr` 數據庫，寫一句 SQL：列出 2023 年上班天數**未超過 3 天**的員工姓名（ENAME）。\n\n留意：2023 年**完全沒有**上班記錄的員工（0 天）也要列出。","starter":"SELECT E.ENAME\nFROM EMPLOYEE E, ATTENDANCE A\nWHERE E.EID = A.EID\n  AND YEAR(A.ATT_DATE) = 2023\nGROUP BY E.EID, E.ENAME\nHAVING COUNT(*) \u003c= 3","ref":"SELECT ENAME\nFROM EMPLOYEE\nWHERE EID NOT IN (SELECT EID\n                  FROM ATTENDANCE\n                  WHERE YEAR(ATT_DATE) = 2023\n                  GROUP BY EID\n                  HAVING COUNT(*) > 3)","hint":"起始語句用了連接，0 天的員工在 2023 年沒有配對記錄，所以不會出現。換個角度：先用子查詢找出「超過 3 天」的員工 EID（即 w2），再用 NOT IN 找出其餘的員工。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"綜合練習 p.308–310","items":[{"id":"a6-q1","pts":3,"src":"綜合練習 p.308 第 1(a) 題","tags":[{"t":"hot","why":"完整性（實體、參照、域）是卷二A 甲部常見短答題。"}],"q":"零售連鎖公司用 SHOP 和 STAFF 儲存數據，SHOP 有一欄記錄經理的員工編號（外鍵碼）。一名身為經理的員工離職，其 STAFF 記錄被刪除，管理員沒有採取其他行動。可能會違反哪種完整性？","options":["實體完整性：STAFF 的主關鍵碼變成 NULL","參照完整性：SHOP 的經理外鍵碼指向不存在的員工","域完整性：經理欄的數據類型不正確","不會違反任何完整性"],"answer":"B","why":"外鍵碼的值必須在父數據表（STAFF）中存在。員工被刪除後，SHOP 中仍記錄他的編號，便違反參照完整性（p.226）。"},{"id":"a6-q2","pts":3,"src":"綜合練習 p.308 第 1(b) 題","q":"承上題，應採取什麼行動以解決問題？","options":["刪除 SHOP 數據表","把 STAFF 的主關鍵碼改為允許 NULL","先把該商店的經理更新為另一名員工（或暫設為 NULL），才刪除該員工的記錄","在 STAFF 為員工姓名建立索引"],"answer":"C","why":"先更新 SHOP 中參照該員工的外鍵碼，確保每個外鍵碼都有對應記錄，才刪除員工。"},{"id":"a6-q3","pts":3,"src":"綜合練習 p.308 第 2(b)(c) 題","q":"以下哪項是使用索引的**缺點**？","options":["不能再用 WHERE 檢索該欄位","需要額外儲存空間，而且插入或更新記錄時要同時更新索引","令數據表不能設定主關鍵碼","令 SELECT 的結果次序錯誤"],"answer":"B","why":"索引加快檢索，但要佔用空間，而且改動數據時 DBMS 需時更新索引（p.223、182–185）。只應為經常搜尋的非關鍵欄位（例如姓名）建立索引。"},{"id":"a6-q4","pts":3,"src":"綜合練習 p.308 第 2(a) 題","q":"以下哪項**不是**使用檢視（view）的優點？","options":["簡化經常重用的複雜查詢","只讓某些用戶看到部分欄位或記錄，保障數據私隱","檢視會另外複製一份數據，所以原數據表損壞時可用作備份","用戶可以像使用數據表一樣查詢檢視"],"answer":"C","why":"檢視是「虛擬的數據表」，不會另存一份數據（p.170），不能當作備份。"},{"id":"a6-q5","pts":3,"src":"綜合練習 p.308 第 3 題","tags":[{"t":"trap","why":"考生常只答「可以計算出來」，沒有說明由哪些屬性計算。"}],"q":"EMPLOYEE 儲存了 DOE（僱用日期）和 LOE（僱用期限）。以下哪項說明最正確？","options":["LOE 是主關鍵碼，因為每名員工的僱用期限都不同","LOE 是衍生屬性，可由 DOE 和今天的日期計算；儲存它可省去每次計算，但數值會隨時間過時，須不斷更新","LOE 是外鍵碼，參照 DOE","DOE 是衍生屬性，可由 LOE 計算，因此應刪除 DOE"],"answer":"B","why":"衍生屬性可由其他屬性計算出來（p.204）。優點：查詢較快、SQL 較簡單；缺點：佔用空間，而且不更新便會與 DOE 不一致。"},{"id":"a6-q6","pts":3,"src":"綜合練習 p.308 第 4 題","q":"一筆信用卡轉帳交易完成後，發現要取消。應該對數據庫採取什麼行動？","options":["DROP TABLE，再重新建立數據表","回滾（rollback）：把數據庫復原至交易前的狀態","為交易數據表建立索引","建立一個只顯示該交易的檢視"],"answer":"B","why":"回滾把數據庫復原至先前的狀態（p.233）。要留意：若用舊備份回滾，備份之後其他合法的交易也可能一併消失，導致數據不完整或不一致。"},{"id":"a6-q7","pts":2,"src":"綜合練習 p.310 第 9(f) 題","db":"shop","tags":[{"t":"hot","why":"DSE 卷二A 幾乎每年都考「找出沒有……」及子查詢；2025 5(b)(iii) 超過一半考生在子查詢和 MAX 上遇到困難。"}],"q":"`SELECT PRODUCTID FROM PRODUCT MINUS SELECT PRODUCTID FROM PRODUCTORDER` 的目的是什麼？","sql":"SELECT PRODUCTID FROM PRODUCT\nMINUS\nSELECT PRODUCTID FROM PRODUCTORDER","options":["列出所有已售罄的產品識別碼","列出最少被訂購的產品識別碼","列出從未被任何訂單訂購的產品識別碼","列出曾被訂購的產品識別碼"],"answer":"C","why":"MINUS（EXCEPT）保留在第一個結果、但不在第二個結果中的值。在本單元的數據，結果是 P3007。"}]},{"id":"more","kind":"endless","title":"無限練習","gens":["sqlAgg","sqlJoin","sqlSub","fdNf"],"intro":"隨機生成分組、連接、子查詢及範式題目，答案由模擬器計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]}]});
