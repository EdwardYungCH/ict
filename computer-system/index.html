const h = (tag, attrs = {}, html) => { const e = document.createElement(tag); Object.entries(attrs).forEach(([k, v]) => { if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else e.setAttribute(k, v); }); if (html !== undefined) e.innerHTML = html; return e; };
// localStorage 只存「分類選擇」「連續答對」「最高紀錄」；鍵名以 blab- 開頭；失敗時照常運作
const LS = { get(k, d) { try { const v = localStorage.getItem("blab-" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem("blab-" + k, JSON.stringify(v)); } catch (e) {} } };
const MODES = [
  { id: "dev", name: "設備", note: "第 1 章：輸入、輸出及儲存設備的分類；規格屬哪種設備；按情境選設備及「A 勝於 B 的優點」。",

  { id: "hw", name: "硬件", note: "第 2 章：CPU 部件與寄存器、系統匯流排、機器周期（提取─譯碼─執行周期）、記憶體與儲存、CPU 規格。",
    tips: "<b>答題提醒：</b>DSE 稱現行指令寄存器（CIR）為「指令寄存器（IR）」；時鐘頻率寫「每秒的時鐘周期數目」，不要寫「每秒執行的指令數目」（2016 甲20）。" },
  { id: "calc", name: "計算", note: "儲存容量（1 KB = 1,024 字節）、單位換算、掃描影像、像素密度、長寬比、時鐘周期、打印時間。點陣圖、音頻、視頻的檔案大小及傳輸時間見《位元練習室》。",
    tips: "<b>答題提醒：</b>每步一行，先寫算式再寫答案及單位（2017 乙2(b)、2018 乙3(b) 評卷須展示計算）；儲存容量用 1,024（2020 乙3(a)(ii) 報告：弱者錯用 1,000）。" },
  { id: "sw", name: "軟件", note: "第 3 章：系統軟件與應用軟件、操作系統功能及用戶界面、實用程式與驅動程式、運作方式（成批、實時、並行、分布式、虛擬化）。",
    tips: "<b>答題提醒：</b>用準確術語：寫「操作系統」不寫「系統」（2025 乙7(b)(ii) 報告）；判斷成批／實時要說明「何時處理」，不可只抄情境（2023 乙5(b)(i)）。" },
];
const S = { mode: "dev", q: null, cat: null, type: null, n: 0, answered: false, right: 0, total: 0, streak: LS.get("streak", 0), best: LS.get("best", 0), sel: null, on: {} };
if (typeof S.streak !== "number") S.streak = 0; if (typeof S.best !== "number") S.best = 0;
const CATS = (m) => GEN[m];
const hsh = (() => { try { return location.hash.replace("#", ""); } catch (e) { return ""; } })(); if (MODES.some((x) => x.id === hsh)) S.mode = hsh;
MODES.forEach((m) => { S.on[m.id] = new Set(CATS(m.id).filter((c) => !c.ext).map((c) => c.id)); });
(() => { const saved = LS.get("filter", null); if (!saved || typeof saved !== "object") return; MODES.forEach((m) => { if (!Array.isArray(saved[m.id])) return; const ids = new Set(CATS(m.id).map((c) => c.id)); S.on[m.id] = new Set(saved[m.id].filter((x) => ids.has(x))); }); })();
const saveFilter = () => { const o = {}; MODES.forEach((m) => { o[m.id] = [...S.on[m.id]]; }); LS.set("filter", o); };
const md = (s) => esc(s).replace(/`([^`]+)`/g, (m, a) => "<code>" + a + "</code>");
const hintHTML = (c) => { const x = HINTS[c.id]; if (!x) return ""; return "<h4>方法：" + esc(c.name) + "</h4><ol>" + x[0].map((t) => "<li>" + esc(t) + "</li>").join("") + "</ol>" + (x[1] ? '<div class="ex">例：' + esc(x[1]) + "</div>" : ""); };
const nav = $("modes");
MODES.forEach((m) => { const b = h("button", { type: "button", "data-id": m.id, text: m.name }); b.addEventListener("click", () => { if (S.mode === m.id) return; S.mode = m.id; try { history.replaceState(null, "", "#" + m.id); } catch (e) {} renderNav(); renderFilter(); next(); buildExplorer(); }); nav.appendChild(b); });
function renderNav() { [...nav.children].forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.id === S.mode))); const m = MODES.find((x) => x.id === S.mode); $("mode-note").textContent = m.note; $("tips").innerHTML = m.tips;
  $("explorer").hidden = !(S.mode === "hw" || S.mode === "calc"); $("ex-title").textContent = S.mode === "hw" ? "機器周期模擬器：逐步看寄存器的變化" : "單位對照表"; }
function renderCount() { const all = CATS(S.mode).length, on = S.on[S.mode].size, el = $("fcount"); el.textContent = on === all ? "全部 " + all + " 個分類" : "已選 " + on + "／" + all + " 個分類"; el.classList.toggle("partial", on !== all); }
function renderFilter() {
  const box = $("fchips"); box.innerHTML = "";
  CATS(S.mode).forEach((c) => { const b = h("button", { type: "button", class: "chip", "aria-pressed": String(S.on[S.mode].has(c.id)), "data-id": c.id }, '<span class="cid">' + c.id + "</span> " + esc(c.name) + (c.ext ? '<span class="tag">延伸</span>' : ""));
    b.addEventListener("click", () => { const set = S.on[S.mode]; set.has(c.id) ? set.delete(c.id) : set.add(c.id); b.setAttribute("aria-pressed", String(set.has(c.id))); saveFilter(); renderCount(); afterFilter(); }); box.appendChild(b); });
  renderCount();
}
function afterFilter() { if (!S.on[S.mode].size) { showEmpty(); return; } if (!S.q || !S.cat || !S.on[S.mode].has(S.cat.id)) next(); }
$("f-all").addEventListener("click", () => { S.on[S.mode] = new Set(CATS(S.mode).map((c) => c.id)); saveFilter(); renderFilter(); afterFilter(); });
$("f-none").addEventListener("click", () => { S.on[S.mode] = new Set(); saveFilter(); renderFilter(); afterFilter(); });
function renderScore() { $("sc-right").textContent = S.right; $("sc-total").textContent = S.total; $("sc-streak").textContent = S.streak; $("sc-best").textContent = S.best; }
function showEmpty() { S.q = null; S.cat = null; $("qtype").textContent = ""; $("qno").textContent = "";
  $("prompt").innerHTML = '<p class="empty">請在上方「分類篩選」選擇至少一個分類。</p>'; $("input-area").innerHTML = ""; $("feedback").hidden = true;
  $("btn-check").disabled = true; $("btn-show").disabled = true; $("btn-next").disabled = true; $("filter").open = true; $("btn-hint").hidden = true; $("hintbox").hidden = true; }

// ---------- 作答區 ----------
function renderInput(q) {
  const area = $("input-area"); area.innerHTML = ""; S.sel = null;
  if (q.input.kind === "choice") {
    const box = h("div", { class: "choices" + (q.input.opts.length > 4 || q.input.opts.some((o) => o.length > 22) ? " wide" : "") });
    q.input.opts.forEach((o) => { const b = h("button", { type: "button", class: "choice", "aria-pressed": "false", text: o });
      b.addEventListener("click", () => { if (S.answered) return; S.sel = o; box.querySelectorAll(".choice").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); }); box.appendChild(b); });
    area.appendChild(box); return;
  }
  const wrap = h("div", { class: "parts" });
  q.input.parts.forEach((p, k) => {
    const row = h("div", { class: "part" }), id = "ans-" + k, cls = p.type === "reg" && p.fmt === "text" ? "l" : p.type === "reg" && p.fmt === "bin" ? "b" : "n";
    row.innerHTML = (p.label ? '<label for="' + id + '">' + esc(p.label) + "</label>" : "") + '<input id="' + id + '" type="text" class="' + cls + '" data-p="' + k + '" autocomplete="off" autocapitalize="off" spellcheck="false"' + (p.type === "num" ? ' inputmode="decimal"' : p.type === "order" || (p.type === "reg" && p.fmt !== "text") ? ' inputmode="numeric"' : "") + (p.label ? "" : ' aria-label="' + esc(p.sfx || "答案") + '"') + (p.ph ? ' placeholder="' + esc(p.ph) + '"' : p.type === "reg" && p.fmt === "bin" ? ' placeholder="0000 0000"' : "") + ">" + (p.sfx ? '<span class="sfx">' + esc(p.sfx) + "</span>" : "") + (p.dp ? '<span class="sfx">（兩位小數）</span>' : "");
    wrap.appendChild(row);
  });
  area.appendChild(wrap);
  area.querySelectorAll("input").forEach((inp) => inp.addEventListener("keydown", (ev) => { if (ev.key === "Enter") { ev.preventDefault(); S.answered ? next() : check(); } }));
}
const readParts = (q) => q.input.parts.map((p, k) => $("input-area").querySelector('input[data-p="' + k + '"]').value);

// ---------- 出題、核對 ----------
function next() {
  const pool = CATS(S.mode).filter((c) => S.on[S.mode].has(c.id)); if (!pool.length) { showEmpty(); return; }
  let c = pick(pool); if (pool.length > 1 && S.cat && c.id === S.cat.id && coin(0.7)) c = pick(pool.filter((x) => x.id !== S.cat.id));
  const t = pick(c.types); let q = null;
  for (let i = 0; i < 8 && !q; i++) { try { q = t.fn(); } catch (e) { q = null; } }
  if (!q) { $("prompt").innerHTML = '<p class="empty">未能產生題目，請按「跳過此題」。</p>'; return; }
  S.cat = c; S.type = t; S.q = q; S.n++; S.answered = false; $("btn-next").disabled = false;
  $("qtype").textContent = MODES.find((m) => m.id === S.mode).name + " · " + c.id + " " + c.name + " · " + t.name; $("qno").textContent = "第 " + S.n + " 題";
  $("hintbox").innerHTML = hintHTML(c); $("btn-hint").hidden = !$("hintbox").innerHTML; setHint(false); updNext();
  $("prompt").innerHTML = q.prompt;
  renderInput(q); $("feedback").hidden = true; $("btn-check").disabled = false; $("btn-show").disabled = false;
}
function finish(correct, revealed, results, raws) {

  LS.set("streak", S.streak); LS.set("best", S.best); renderScore();
  const q = S.q, area = $("input-area"); let extra = "";

    if (!revealed && !correct && q.input.why && q.input.why[S.sel]) extra += '<p class="trap">' + md(q.input.why[S.sel]) + "</p>";
  } else {
    q.input.parts.forEach((p, k) => {
      const r = results ? results[k] : null, x = area.querySelector('input[data-p="' + k + '"]'); x.readOnly = true; if (r) x.classList.add(r.ok ? "ok" : "no");
      if (r && !r.ok && !revealed) { const tm = GR.trap(p, raws[k]); if (tm) extra += '<p class="trap">' + md(tm) + "</p>"; if (r.msg) extra += '<p class="trap">' + md(r.msg) + "</p>"; }

  const bs = $("btn-sim"); if (bs) bs.addEventListener("click", () => { SIM.load(q.sim); $("explorer").open = true; buildExplorer(); try { $("explorer").scrollIntoView({ block: "start" }); } catch (e) {} });
  updNext(); try { $("btn-next").focus({ preventScroll: true }); } catch (e) {}
}
function warn(msg) { const fb = $("feedback"); fb.className = "feedback bad"; fb.hidden = false; fb.innerHTML = '<div class="verdict">' + msg + "</div>"; }
function check() {

function setHint(open) { $("hintbox").hidden = !open; $("btn-hint").setAttribute("aria-expanded", String(open)); }
$("btn-hint").addEventListener("click", () => setHint($("hintbox").hidden));

let skipTimer = null;
function updNext(confirming) { const b = $("btn-next"); clearTimeout(skipTimer); b.classList.remove("primary", "ghost", "skip", "confirm");
  if (S.answered) { b.classList.add("primary"); b.textContent = "下一題 →"; }

$("btn-next").addEventListener("click", () => { if (S.answered || $("btn-next").classList.contains("confirm")) return next(); updNext(true); });

// =================== 機器周期模擬器（試算區） ===================
const SIM_DEMO = { mem: { 100: "LOAD 105", 101: "ADD 106", 102: "STORE 107", 105: 23, 106: 42, 107: 0 }, pc: 100, acc: 0, addrs: [100, 101, 102, 105, 106, 107], bin: false };

const SIM = { P: SIM_DEMO, i: -1, snaps: [], custom: false,
  load(p) { this.P = p; this.custom = p !== SIM_DEMO; this.i = -1; const n = p.addrs.filter((a) => typeof p.mem[a] === "string").length; try { this.snaps = CPU.run(p.mem, p.pc, p.acc, n).snaps; } catch (e) { this.snaps = []; } } };
SIM.load(SIM_DEMO);
function buildExplorer() {
  const body = $("explorer-body"); body.innerHTML = "";
  if (S.mode === "calc") {
    body.innerHTML = '<div class="sbx">' + mini(["項目", "換算"], [["儲存容量", "1 字節 = 8 位元；1 KB = 1,024 字節；1 MB = 1,024 KB；1 GB = 1,024 MB；1 TB = 1,024 GB"], ["時鐘頻率", "1 kHz = 10³ Hz；1 MHz = 10⁶ Hz；1 GHz = 10⁹ Hz"], ["時間", "1 ms = 10⁻³ 秒；1 μs = 10⁻⁶ 秒；1 ns = 10⁻⁹ 秒；1 ps = 10⁻¹² 秒"], ["時鐘周期", "時鐘周期 = 1 ÷ 時鐘頻率"], ["掃描影像", "每邊像素 = 吋 × dpi；未壓縮檔案大小 = 闊 × 高 × 色深 ÷ 8（字節）"], ["像素密度", "√(闊² + 高²) ÷ 屏幕尺寸（吋），單位 ppi"], ["傳輸率（只作對照，屬 C a）", "1 kbps = 1,000 bps；1 Mbps = 10⁶ bps；GB 是字節、Gbps 是位元"]], { th: true, cls: "ref" }) + '<p class="small">出處：教科書 p.17、p.29、表2.11 p.68、p.75；傳輸率及檔案傳輸時間見《位元練習室》。</p></div>';

  const hl = s ? [s.step <= 4 ? (s.step >= 3 ? s.MAR : null) : s.step >= 6 ? s.MAR : null].filter((x) => x !== null) : [];
  const desc = s ? "指令 " + (s.ins + 1) + "：" + SIM_DESC[s.step - 1] : "開始：PC = " + (P0.bin ? bin8(P0.pc) : P0.pc) + "，累加器 = " + (P0.bin ? bin8(P0.acc) : P0.acc) + "。按「下一步」逐步執行。";
  body.innerHTML = '<div class="sbx"><p class="small">' + (SIM.custom ? "以下是上一題的程式。" : "以下是示範程式。") + "每按一次「下一步」執行表2.9 的一個步驟（執行階段按 2012 乙3(d)(i)，與筆記相同）。</p>" +
    '<div class="row2">' + memHTML(mem, P0.addrs, P0.bin, hl) + '<div class="simr">' + regHTML(R0, P0.bin) + '<div class="msg" id="sim-desc">' + esc(desc) + "</div></div></div>" +
    '<div class="row"><button type="button" class="btn primary sm" id="sim-step"' + (SIM.i >= SIM.snaps.length - 1 ? " disabled" : "") + '>下一步</button><button type="button" class="btn ghost sm" id="sim-reset">重新開始</button>' + (SIM.custom ? '<button type="button" class="btn ghost sm" id="sim-demo">改用示範程式</button>' : "") + "</div></div>";
  $("sim-step").addEventListener("click", () => { if (SIM.i < SIM.snaps.length - 1) { SIM.i++; buildExplorer(); } });
  $("sim-reset").addEventListener("click", () => { SIM.i = -1; buildExplorer(); });
  if ($("sim-demo")) $("sim-demo").addEventListener("click", () => { SIM.load(SIM_DEMO); buildExplorer(); });
}
$("explorer").addEventListener("toggle", () => { if ($("explorer").open) buildExplorer(); });

// 測試用：以正確或錯誤答案填寫目前的題目（不會自動核對）
window.__blab = {
  fill(ok) { const q = S.q; if (!q || S.answered) return false; const area = $("input-area");
    if (q.input.kind === "choice") { const t = ok ? q.input.answer : q.input.opts.find((o) => o !== q.input.answer); [...area.querySelectorAll(".choice")].find((b) => b.textContent === t).click(); return true; }
    q.input.parts.forEach((p, k) => { area.querySelector('input[data-p="' + k + '"]').value = GR.fill(p, ok || k > 0); }); return true; },
  only(id) { S.on[S.mode] = new Set([id]); renderFilter(); next(); }, cats: () => CATS(S.mode).map((c) => c.id), types: (id) => CATS(S.mode).find((c) => c.id === id).types.map((t) => t.name),
  onlyType(id, name) { S.on[S.mode] = new Set([id]); renderFilter(); for (let i = 0; i < 60; i++) { next(); if (S.type.name === name) return true; } return false; },
  mode: (m) => [...nav.children].find((b) => b.dataset.id === m).click(),
  state: () => ({ mode: S.mode, cat: S.cat && S.cat.id, type: S.type && S.type.name, answered: S.answered, right: S.right, total: S.total, streak: S.streak, best: S.best, on: [...S.on[S.mode]], kind: S.q && S.q.input.kind }),
};
renderNav(); renderFilter(); renderScore(); next();
})();
