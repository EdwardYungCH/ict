src":"教科書 p.32 測試站 4.4","label":"偽代碼 → Python","q":"`DrawNumber ← 一個隨機在 1 至 100 之內的整數，包含首尾兩數`、`輸出 DrawNumber`","template":"import random\nDrawNumber = random.［1］(1, 100)\nprint(DrawNumber)","ref":["randint"],"tests":[{"inputs":""}],"fixRandom":{"randint":4},"hint":"隨機整數，包括首尾兩數。","_exp":[{"out":"4\n","err":null}]},{"id":"u2-s4-p3","type":"mc","pts":1,"src":"教科書 p.32 表 4.9","q":"擲骰子要得到 1 至 6 的整數（包括 1 和 6）。應該用哪一句？","options":["random.randint(1, 6)","random.randint(1, 7)","random.uniform(1, 6)","random.random() * 6"],"answer":0,"hint":"randint 包括首尾兩數；uniform 和 random 給浮點數。","_right":0},{"id":"u2-s4-p4","type":"mc","pts":1,"src":"教科書 p.30 提示","q":"執行以下程式會出現哪一種錯誤？","code":"y = math.sqrt(16)\nprint(y)","ask":{"error":true},"options":["SyntaxError","NameError","ValueError","沒有錯誤"],"answer":1,"verify":true,"hint":"用函數庫的函數前要先匯入。","_right":1}]},{"id":"write","kind":"write","title":"寫程式","pages":"教科書 p.27–29 測試站 4.2","intro":"在編輯器寫 Python，可以先按 ▶ 自己測試，再按「提交評核」。輸入數據每行一個，按次序交給每一個 input()。提示字串和輸出文字要和題目完全一樣。","tasks":[{"id":"u2-w1","tier":"必做","title":"秒數轉換為分鐘","pts":10,"src":"教科書 p.29 測試站 4.2 第 4 題","q":"小柔的計時器以「秒」作單位。輸入秒數（整數），輸出分鐘和秒。輸出範例：\n`Input the number of seconds: 125`\n`Your record is 2 minute(s) and 5 second(s).`","prompt":"小柔的計時器以「秒」作單位。輸入秒數（整數），輸出分鐘和秒。輸出範例：\n`Input the number of seconds: 125`\n`Your record is 2 minute(s) and 5 second(s).`","starter":"time = int(input(\"Input the number of seconds: \"))\n","ref":"time = int(input(\"Input the number of seconds: \"))\nminutes = time // 60\nseconds = time % 60\nprint(\"Your record is\", minutes, \"minute(s) and\", seconds, \"second(s).\")","tests":[{"inputs":"125"},{"inputs":"60"},{"inputs":"59"},{"inputs":"0"},{"inputs":"3600"},{"inputs":"61"}],"hint":"分鐘 = time // 60；秒 = time % 60。用「,」分隔各項，print 會自動加空白格。","_exp":[{"out":"Input the number of seconds: 125\nYour record is 2 minute(s) and 5 second(s).\n","err":null},{"out":"Input the number of seconds: 60\nYour record is 1 minute(s) and 0 second(s).\n","err":null},{"out":"Input the number of seconds: 59\nYour record is 0 minute(s) and 59 second(s).\n","err":null},{"out":"Input the number of seconds: 0\nYour record is 0 minute(s) and 0 second(s).\n","err":null},{"out":"Input the number of seconds: 3600\nYour record is 60 minute(s) and 0 second(s).\n","err":null},{"out":"Input the number of seconds: 61\nYour record is 1 minute(s) and 1 second(s).\n","err":null}],"_sample":"Input the number of seconds: 125\nYour record is 2 minute(s) and 5 second(s).\n"},{"id":"u2-w2","tier":"進階","title":"BMI 計算機","pts":12,"src":"教科書 p.29 測試站 4.2 第 3 題","q":"BMI = 體重（kg）÷ 身高（m）²。輸出範例：\n`This is a BMI Calculator!`\n`Please enter your height in meters: 1.74`\n`Please enter your weight in kg: 69`\n`Your BMI is 22.79032897344431`","prompt":"BMI = 體重（kg）÷ 身高（m）²。輸出範例：\n`This is a BMI Calculator!`\n`Please enter your height in meters: 1.74`\n`Please enter your weight in kg: 69`\n`Your BMI is 22.79032897344431`","starter":"print(\"This is a BMI Calculator!\")\nheight = input(\"Please enter your height in meters: \")\nweight = input(\"Please enter your weight in kg: \")\n","ref":"print(\"This is a BMI Calculator!\")\nheight = float(input(\"Please enter your height in meters: \"))\nweight = float(input(\"Please enter your weight in kg: \"))\nbmi = weight / (height**2)\nprint(\"Your BMI is\", bmi)","tests":[{"inputs":"1.74\n69"},{"inputs":"1.6\n50"},{"inputs":"1.8\n80"},{"inputs":"1.5\n45"},{"inputs":"2\n100"}],"check":{"out":true,"nums":true},"hint":"input() 得到字串，要先用 float() 轉換；身高要先平方：`weight / (height**2)`。","_exp":[{"out":"This is a BMI Calculator!\nPlease enter your height in meters: 1.74\nPlease enter your weight in kg: 69\nYour BMI is 22.79032897344431\n","err":null},{"out":"This is a BMI Calculator!\nPlease enter your height in meters: 1.6\nPlease enter your weight in kg: 50\nYour BMI is 19.531249999999996\n","err":null},{"out":"This is a BMI Calculator!\nPlease enter your height in meters: 1.8\nPlease enter your weight in kg: 80\nYour BMI is 24.691358024691358\n","err":null},{"out":"This is a BMI Calculator!\nPlease enter your height in meters: 1.5\nPlease enter your weight in kg: 45\nYour BMI is 20.0\n","err":null},{"out":"This is a BMI Calculator!\nPlease enter your height in meters: 2\nPlease enter your weight in kg: 100\nYour BMI is 25.0\n","err":null}],"_sample":"This is a BMI Calculator!\nPlease enter your height in meters: 1.74\nPlease enter your weight in kg: 69\nYour BMI is 22.79032897344431\n"},{"id":"u2-w3","tier":"挑戰","title":"圓柱體的體積及表面面積","pts":13,"src":"教科書 p.27 測試站 4.2 第 1 題","q":"輸入圓柱體的**直徑** d 和高度 h，輸出體積（πr²h）和表面面積（2πrh + 2πr²），r = d ÷ 2，**π 用 `PI = 3.14`**。輸出範例：\n`Please enter the diameter of the cylinder: 5.5`\n`Please enter the height of the cylinder: 10`\n`The volume of the cylinder is: 237.4625`\n`The surface area of the cylinder is: 220.1925`","prompt":"輸入圓柱體的**直徑** d 和高度 h，輸出體積（πr²h）和表面面積（2πrh + 2πr²），r = d ÷ 2，**π 用 `PI = 3.14`**。輸出範例：\n`Please enter the diameter of the cylinder: 5.5`\n`Please enter the height of the cylinder: 10`\n`The volume of the cylinder is: 237.4625`\n`The surface area of the cylinder is: 220.1925`","starter":"d = float(input(\"Please enter the diameter of the cylinder: \"))\nh = float(input(\"Please enter the height of the cylinder: \"))\nPI = 3.14\n","ref":"d = float(input(\"Please enter the diameter of the cylinder: \"))\nh = float(input(\"Please enter the height of the cylinder: \"))\nPI = 3.14\nvol = PI * ((d/2)**2) * h\narea = 2 * PI * (d/2) * h + 2 * PI * (d/2)**2\nprint(\"The volume of the cylinder is:\", vol)\nprint(\"The surface area of the cylinder is:\", area)","tests":[{"inputs":"5.5\n10"},{"inputs":"2\n1"},{"inputs":"0\n5"},{"inputs":"10\n0.5"},{"inputs":"3\n7"}],"check":{"out":true,"nums":true},"hint":"輸入的是直徑，半徑是 `d/2`；r² 寫成 `(d/2)**2`。","_exp":[{"out":"Please enter the diameter of the cylinder: 5.5\nPlease enter the height of the cylinder: 10\nThe volume of the cylinder is: 237.4625\nThe surface area of the cylinder is: 220.1925\n","err":null},{"out":"Please enter the diameter of the cylinder: 2\nPlease enter the height of the cylinder: 1\nThe volume of the cylinder is: 3.14\nThe surface area of the cylinder is: 12.56\n","err":null},{"out":"Please enter the diameter of the cylinder: 0\nPlease enter the height of the cylinder: 5\nThe volume of the cylinder is: 0.0\nThe surface area of the cylinder is: 0.0\n","err":null},{"out":"Please enter the diameter of the cylinder: 10\nPlease enter the height of the cylinder: 0.5\nThe volume of the cylinder is: 39.25\nThe surface area of the cylinder is: 172.7\n","err":null},{"out":"Please enter the diameter of the cylinder: 3\nPlease enter the height of the cylinder: 7\nThe volume of the cylinder is: 49.455000000000005\nThe surface area of the cylinder is: 80.07\n","err":null}],"_sample":"Please enter the diameter of the cylinder: 5.5\nPlease enter the height of the cylinder: 10\nThe volume of the cylinder is: 237.4625\nThe surface area of the cylinder is: 220.1925\n"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.16–32、p.66","items":[{"id":"u2-q1","pts":3,"src":"教科書 p.66 課題練習 選擇題 1","verify":true,"q":"此 Python 程式的輸出是什麼？","code":"name = \"Billy\"\nprint(\"name\")","options":["Billy","\"Billy\"","name","\"name\""],"answer":"C","why":"括號內是帶引號的字串 \"name\"，照樣列印文字 name，不是變量的值（p.18 常見錯誤）。","_right":2},{"id":"u2-q2","pts":3,"src":"教科書 p.66 課題練習 選擇題 2","verify":true,"q":"此 Python 程式的輸出是什麼？","code":"name = \"Peter\"\nage = 23\nprint(name, \"is\", age)","options":["Peter is 23","Peter \"is\" 23","Peter is 23.0","執行錯誤"],"answer":"A","why":"「,」分隔的各項之間加一個空白格；age 是整數，列印 23。","_right":0},{"id":"u2-q3","pts":3,"src":"教科書 p.66 課題練習 選擇題 3","tags":[{"t":"trap","why":"「/」的結果必定是浮點數：6 / 2 是 3.0，不是 3。"}],"q":"變量 C 的值屬於什麼數據類型？","code":"A = 15\nB = 2.0\nB = int(A / B)\nC = A // B","options":["整數","浮點數","字串","布爾"],"answer":"A","why":"A / B 是 7.5，int() 後 B 是整數 7；15 // 7 兩個都是整數，C 是整數 2。","_right":0},{"id":"u2-q4","pts":4,"src":"自擬（p.16 表 4.3）","verify":true,"q":"以下程式的輸出是什麼？","code":"print(7 // 2 * 2 + 7 % 2)","options":["7","8","7.0","3"],"answer":"A","why":"7 // 2 = 3，3 * 2 = 6，7 % 2 = 1，6 + 1 = 7。","_right":0},{"id":"u2-q5","pts":4,"src":"自擬（p.13、p.30）","verify":true,"q":"以下程式的輸出是什麼？","code":"x = 2.7\nprint(int(x) + round(x))","options":["5","6","5.4","4"],"answer":"A","why":"int(2.7) 捨去小數得 2；round(2.7) 得 3；2 + 3 = 5。","_right":0},{"id":"u2-q6","pts":3,"src":"自擬（p.24–25 輸入語句）","verify":true,"inputs":"3\n4","q":"用家輸入 `3` 和 `4`。以下程式的輸出是什麼？（不計輸入時 Shell 顯示的兩行）","code":"a = input()\nb = int(input())\nprint(a + str(b + 1))","ask":{"expr":"a + str(b + 1)"},"options":["35","8","3 5","TypeError"],"answer":"A","why":"a 是字串 \"3\"；b + 1 = 5，轉成字串後連接得 \"35\"。","_right":0}]},{"id":"more","kind":"endless","title":"無限練習","gens":["pyArith","pyCast","pyPrint"],"intro":"隨機生成運算（+ - * / // % ** 及運算次序）、轉換數據類型及 print 輸出題目，答案由 Python 計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]}, {"code":"D2","title":"D2 Python 自學平台","kicker":"HKDSE ICT · 必修 D2","pin":"d2ict2026"});
