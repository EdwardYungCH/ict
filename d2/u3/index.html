 valid student ID? (Y/N): Y\nAre you our member? (Y/N): N\nStudent: HKD 150\n","err":null},{"out":"Please input your age: 26\nDo you hold a valid student ID? (Y/N): Y\nAre you our member? (Y/N): Y\nAdult (Member): HKD 180\n","err":null},{"out":"Please input your age: 40\nDo you hold a valid student ID? (Y/N): N\nAre you our member? (Y/N): N\nAdult: HKD 200\n","err":null}],"_sample":"Please input your age: 8\nDo you hold a valid student ID? (Y/N): N\nAre you our member? (Y/N): Y\nChildren/Elderly: HKD 100\n"},{"id":"u3-w3","tier":"進階","title":"閏年判斷","pts":13,"src":"自擬（布爾邏輯，DSE 常見題材）","q":"輸入年份 `year`（整數），判斷是否閏年：\n• 可被 4 整除**而且**不可被 100 整除，是閏年；\n• **或者**可被 400 整除，也是閏年。\n是閏年輸出 `Leap year`，否則輸出 `Not a leap year`。\n提示：「可被 4 整除」即 `year % 4 == 0`。","starter":"year = int(input())\n","ref":"year = int(input())\nif (year % 4 == 0 and year % 100 != 0) or year % 400 == 0:\n    print(\"Leap year\")\nelse:\n    print(\"Not a leap year\")","tests":[{"inputs":"2024"},{"inputs":"2023"},{"inputs":"1900"},{"inputs":"2000"},{"inputs":"2100"},{"inputs":"1996"}],"hint":"一個 if 加 and／or：`(year % 4 == 0 and year % 100 != 0) or year % 400 == 0`。1900 可被 100 整除但不可被 400 整除，所以不是閏年；2000 是。","_exp":[{"out":"2024\nLeap year\n","err":null},{"out":"2023\nNot a leap year\n","err":null},{"out":"1900\nNot a leap year\n","err":null},{"out":"2000\nLeap year\n","err":null},{"out":"2100\nNot a leap year\n","err":null},{"out":"1996\nLeap year\n","err":null}],"_sample":"2024\nLeap year\n"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.66–67","items":[{"id":"u3-q1","pts":3,"src":"教科書 p.66 課題練習 選擇題 4","tags":[{"t":"hot","why":"DSE 卷一常考空運行含 if／嵌套 if 的程式（例如 2020 1B Q2 交換變量求差）"}],"q":"以下程式用以尋找 A 和 B 之間的絕對差異，但尚未完成。哪一項最適合填上空格？","code":"A = int(input())\nB = int(input())\nif ______ :\n    temp = A\n    A = B\n    B = temp\nprint(A-B)","options":["A >= B","B = A","B-1 >= A","以上皆非"],"answer":"C","why":"B 較大時才要交換。A、B 是整數，`B-1 >= A` 即 `B > A`。A 會在 A 較大時交換，得出負數；B 用了賦值運算符 `=`，是語法錯誤。","_right":2},{"id":"u3-q2","pts":4,"src":"教科書 p.66 課題練習 選擇題 5","tags":[{"t":"trap","why":"範圍兩端是否包括、and 與 or 混淆"}],"q":"分數 X 必須在 0 至 100 之間（包括 0 和 100），否則輸出 \"Not a valid input\"。哪一項條件可以填上空格？","code":"name = input(\"Name: \")\nX = int(input(\"X: \"))\nif ______ :\n    print(name, \"has a score of\", X)\nelse:\n    print(\"Not a valid input\")","options":["X > 0 and X \u003c= 100","X >= 0 and X \u003c 100","X > -1 or X \u003c 101","X > -1 and X \u003c 101"],"answer":"D","why":"X 是整數，`X > -1` 即 `X >= 0`，`X \u003c 101` 即 `X \u003c= 100`。A 漏了 0，B 漏了 100；C 用 or，任何整數都成立。","_right":3},{"id":"u3-q3","pts":3,"src":"教科書 p.67 課題練習 選擇題 6","q":"程式比較運動員 A、B、C 跑 100 米的時間；result 代表跑得最快（時間最短）的時間。哪一項可以填上空格？","code":"A = float(input(\"A:\"))\nB = float(input(\"B:\"))\nC = float(input(\"C:\"))\nif ______ :\n    result = B\nelse:\n    result = A\nif result > C:\n    result = C\n    print(result)\nelse:\n    print(result)","options":["result > A","result > B","A \u003c B","A > B"],"answer":"D","why":"時間越短越快。A 比 B 慢（A > B）才取 B。A、B 選項用到未賦值的 result（NameError）；C 方向相反。","_right":3},{"id":"u3-q4","pts":3,"src":"教科書 p.67 課題練習 選擇題 8","tags":[{"t":"hot","why":"DSE 卷一常考空運行含 if／嵌套 if 的程式（例如 2020 1B Q2 交換變量求差）"}],"q":"輸入 member = 1、gold = 0，輸出是什麼？（只看 print 的輸出）","code":"member = int(input())\ngold = int(input())\nif (member == 1):\n    if (gold == 1):\n        print(\"30% off\")\n    else:\n        print(\"10% off\")\nelse:\n    print(\"No discount\")","options":["30% off","10% off","No discount","30% off No discount"],"answer":"B","why":"member == 1 成立，進入內層；gold == 1 不成立，執行內層的 else：10% off。外層 else 不會執行。","_right":1},{"id":"u3-q5","pts":4,"src":"自擬（多個 if 與 if-elif 的分別）","tags":[{"t":"trap","why":"獨立的 if 每個都會檢查，後面的賦值會蓋過前面"}],"verify":true,"q":"以下程式的輸出是什麼？","code":"mark = 90\ngrade = \"F\"\nif mark >= 85:\n    grade = \"A\"\nif mark >= 70:\n    grade = \"B\"\nif mark >= 50:\n    grade = \"C\"\nprint(grade)","options":["A","B","C","F"],"answer":"C","why":"三個都是獨立的 if（不是 elif），全部都會檢查；90 符合三個條件，最後一個把 grade 改成 C。要得 A，第二、三個應改為 elif。","_right":2},{"id":"u3-q6","pts":3,"src":"自擬（運算次序 not → and → or）","verify":true,"q":"以下程式的輸出是什麼？","code":"x = 5\ny = 0\nprint(x > 3 and y > 0 or not y == 1)","options":["True","False","None","SyntaxError"],"answer":"A","why":"先計 not：`not y == 1` = not False = True；再計 and：True and False = False；最後 or：False or True = True。","_right":0}]},{"id":"more","kind":"endless","title":"無限練習","gens":["pyIf","pyBool","pyArith"],"intro":"隨機生成 if／elif／else 的輸出題、and／or／not 的真假題及算術運算題，答案由電腦計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]}, {"code":"D2","title":"D2 Python 自學平台","kicker":"HKDSE ICT · 必修 D2","pin":"d2ict2026"});
