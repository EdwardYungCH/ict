 while parsing`，意思一樣：括號沒有關上。"}],"tries":[{"id":"u1-s1-t1","pts":4,"src":"教科書 p.8–9 實驗站 4.1","code":"print(\"3 + 4\")\nprint(3 + 4)","q":"先估：輸出是什麼？","options":["3 + 4\n7","7\n7","3 + 4\n3 + 4","7\n3 + 4"],"why":"有引號是字串，原樣輸出；沒有引號是算式，先計算再輸出。","_right":0,"_ans":"3 + 4\n7"}],"practice":[{"id":"u1-s1-p1","type":"mc","pts":2,"src":"教科書 p.9–10 活動 4.1","q":"以下哪一句可以正確輸出 Hello World!？","options":["print(Hello World!)","Print(\"Hello World!\")","print(\"Hello World!\")","print\"Hello World!\""],"answer":2,"hint":"小寫 print、括號、字串放在引號內。","_right":2},{"id":"u1-s1-p2","type":"mc","pts":2,"src":"教科書 p.10 活動 4.1 例 4","q":"執行以下程式會出現哪一種錯誤？","code":"print(\"Hello World!\"","ask":{"error":true},"options":["SyntaxError","NameError","ValueError","沒有錯誤"],"answer":0,"verify":true,"hint":"數一數括號。語法錯誤時，程式一行也不會執行。","_right":0},{"id":"u1-s1-p3","type":"complete","pts":2,"src":"教科書 p.9 實驗站 4.1 第 7 步","label":"補完程式","q":"補完程式，令 Shell 輸出兩行：`Hello World!` 和 `Python is fun`。","template":"［1］(\"Hello World!\")\nprint(［2］)","ref":["print","\"Python is fun\""],"tests":[{"inputs":""}],"hint":"第二行的文字要放在引號內。"}]},{"id":"s2","title":"變量、關鍵字與識別符","pages":"教科書 p.11–12、p.16","learn":[{"pts":["**變量**用來儲存數據。Python 以 `=` 作為**賦值運算符**：`length = 12` 把 12 放入變量 length。（p.12）","`=` 先計算右邊，再存入左邊；**右邊的新值會取代變量原有的值**。它不是數學的「等於」，所以 `x = x + 1` 是合理的。（p.16）","宣告變量名稱後，該名稱便成為它的**識別符（identifier）**。（p.11）","**關鍵字（保留字）**由程式語言保留，有預定意義，不可用作變量名稱，例如 `and`、`or`、`for`、`while`、`if`、`else`、`import`、`True`、`False`。Thonny 用紫色顯示關鍵字。（p.11）","教科書也把 `print` 列為關鍵字；嚴格來說，Python 3 的 `print` 是**內置函數**，不是關鍵字。但也不應用 print 作變量名稱。","變量未賦值便使用 → **NameError**。"]},{"h":"命名變量的規則（必修 D 第 2.1 節）"},{"table":{"head":["規則","可以","不可以"],"rows":[["只用英文字母、數字、底線 _","total_mark","total-mark、total mark"],["不可以數字開頭","mark2","2mark"],["不可以是關鍵字","for_count","for、import"],["區分大小寫","SUBJECT 和 subject 是兩個不同的變量",""]]}},{"note":"好的名稱要有意義：`price` 比 `p` 易明白。兩個英文字可用底線連接，例如 `total_mark`。"},{"sim":{"code":"a = 5\nb = a\na = 10\nprint(a)\nprint(b)","step":true,"open":["vars","trace"]},"cap":"按「下一步」：`b = a` 只是把當時 a 的值（5）複製給 b，之後改 a 不會影響 b。"}],"tries":[{"id":"u1-s2-t1","pts":4,"src":"自擬（p.16 賦值）","code":"x = 3\nx = x + 2\ny = x * 2\nx = 1\nprint(y)","q":"先估：輸出是什麼？","options":["10","2","6","5"],"why":"x 先變成 5，y = 5 * 2 = 10；之後 x 改為 1，不會影響已計算好的 y。","_right":0,"_ans":"10"}],"practice":[{"id":"u1-s2-p1","type":"mc","pts":1,"src":"教科書 p.11","q":"以下哪一個是**有效**的變量名稱？","options":["2nd_score","total score","for","score_2"],"answer":3,"hint":"不可數字開頭、不可有空格、不可是關鍵字。","_right":3},{"id":"u1-s2-p2","type":"mc","pts":1,"src":"教科書 p.11","q":"以下哪一個**不可以**用作變量名稱？","options":["_count","Mark1","while","myName"],"answer":2,"hint":"哪一個是關鍵字？","_right":2},{"id":"u1-s2-p3","type":"fill","pts":2,"src":"自擬（常見錯誤：交換兩個變量）","q":"程式想交換 a 和 b 的值。執行後 a 和 b 各是多少？","code":"a = 4\nb = 7\na = b\nb = a","blanks":[{"label":"a","ask":{"var":"a"}},{"label":"b","ask":{"var":"b"}}],"hint":"第 3 行之後，a 原來的 4 已被取代。","_ans":["7","7"]},{"id":"u1-s2-p4","type":"mc","pts":2,"src":"仿教科書 p.17 活動 4.3","q":"執行以下程式會出現哪一種錯誤？","code":"SUBJECT = \"ICT\"\nprint(subject)","ask":{"error":true},"options":["SyntaxError","NameError","ValueError","沒有錯誤"],"answer":1,"verify":true,"hint":"Python 區分大小寫。","_right":1}]},{"id":"s3","title":"數據類型與 type()","pages":"教科書 p.11–12","learn":[{"table":{"head":["Python 數據類型","數據","例子"],"rows":[["整數（int）","整數，包括正負數","288、-101"],["浮點數（float）","整數及小數，包括正負數","56.5、-30.0、-0.382"],["布爾（bool）","只可能是 True 或 False","True、False"],["字串（str）","一串字符：字母、數字、特別符號","\"abc\"、\"P%ssword123\"、\"1\"、\"k\""]]},"cap":"表 4.1 常見的數據類型（p.11）"},{"pts":["**數據類型**定義變量儲存的值是哪種類型；電腦據此分配記憶體，也決定可以做哪些運算而不出錯。（p.11）","Python 不用先宣告數據類型：賦值時，按數據自動為變量**標籤**數據類型。（p.12）","`type()` 函數傳回數據類型，例如 `print(type(12))` 輸出 `\u003cclass 'int'>`。（p.12）","同一個變量可以隨時改存另一種類型的數據。（p.12）","`12.0` 有小數點，是 float；`\"12\"` 有引號，是 str；`True` 第一個字母大寫、不加引號，`\"True\"` 是字串。","Python 把字符當作長度為 1 的字串（`\"k\"` 也是 str）。（p.11 提示）"]},{"sim":{"code":"length = 12\nprint(length)\nprint(type(length))\n\nlength = 12.0\nprint(length)\nprint(type(length))\n\nlength = \"Th  \" + 16` → **TypeError**；要寫 `\"Age: \" + str(16)`。","預告（p.24）：`input()` 取得的數據一定是**字串**，要計算便要用 `int()` 或 `float()` 轉換。"]},{"h":"活動 4.2：除錯（數據類型）（p.14–15）"},{"fix":{"bad":"length = \"12.1\"\nlength = int(length)","good":"length = \"12.1\"\nlength = float(length)\nlength = int(length)","why":"帶小數的字串不能直接轉換成整數（ValueError）；先轉換成浮點數，再轉換成整數。"}},{"pts":["例 2：`int(\"ten\")` → **ValueError**：字串內的文字不能轉換成數字。"]},{"h":"常數（p.15）"},{"pts":["有些值是固定的，例如 π = 3.14159。擁有固定數據的變量稱為**常數（constant）**。","Python 其實也把常數當作變量，可以隨時改變；所以約定俗成**以全大寫字母命名**，例如 `PI = 3.14159`，提醒程式員不應更改。"]},{"table":{"head":["錯誤類型","原因","例子"],"rows":[["SyntaxError","寫法不符合 Python 語法","print\"Hi\"、print(\"Hi\""],["NameError","名稱未定義","Print(\"Hi\")、未賦值便 print(mark)"],["ValueError","值的內容不能轉換","int(\"12.1\")、int(\"ten\")"],["TypeError","數據類型不能這樣運算","\"Age: \" + 16"]]},"cap":"本課見到的錯誤類型"},{"sim":{"code":"length = \"12.1\"\nprint(length)\nprint(type(length))\nlength = int(length)\nprint(length)\nprint(type(length))","open":["vars"]},"cap":"活動 4.2 例 1（p.14）：按 ▶ 看錯誤信息，再按上面的方法改正。"}],"tries":[{"id":"u1-s4-t1","pts":4,"src":"教科書 p.13 程式碼 A","tags":[{"t":"trap","why":"int() 把浮點數的小數部分捨去（向零截斷），不是四捨五入：int(7.9) 是 7，int(-2.8) 是 -2。"}],"code":"length = 7.9\nlength = int(length)\nprint(length)","q":"先估：輸出是什麼？","options":["7","8","7.0","8.0"],"why":"int() 直接捨去小數部分，結果是整數 7。","_right":0,"_ans":"7"},{"id":"u1-s4-t2","pts":4,"src":"自擬（p.14 str()）","code":"x = str(12) + \"3\"\nprint(x)","q":"先估：輸出是什麼？","options":["123","15","12 3","12"],"why":"兩個字串用 + 連接，\"12\" + \"3\" 得 \"123\"。","_right":0,"_ans":"123"}],"practice":[{"id":"u1-s4-p1","type":"mc","pts":1,"src":"教科書 p.15 活動 4.2 例 2","q":"執行以下程式會出現哪一種錯誤？","code":"length = \"ten\"\nlength = int(length)\nprint(length * length)","ask":{"error":true},"options":["SyntaxError","NameError","ValueError","沒有錯誤"],"answer":2,"verify":true,"hint":"字串內的文字不能轉換成數字。","_right":2},{"id":"u1-s4-p2","type":"mc","pts":1,"src":"自擬（p.14）","q":"執行以下程式會出現哪一種錯誤？","code":"print(\"Age: \" + 16)","ask":{"error":true},"options":[" .9–10 活動 4.1、p.14","q":"程式讀入姓名和年齡，應輸出兩行，例如輸入 `Amy` 和 `16`：\n`Hello, Amy`\n`Next year: 17`\n但最後一行出錯。請改正程式（不要改 input() 那兩行）。","prompt":"程式讀入姓名和年齡，應輸出兩行，例如輸入 `Amy` 和 `16`：\n`Hello, Amy`\n`Next year: 17`\n但最後一行出錯。請改正程式（不要改 input() 那兩行）。","starter":"name = input(\"Name: \")\nage = input(\"Age: \")\nprint(\"Hello, \" + name)\nprint(\"Next year: \" + age + 1)","ref":"name = input(\"Name: \")\nage = input(\"Age: \")\nprint(\"Hello, \" + name)\nprint(\"Next year: \" + str(int(age) + 1))","tests":[{"inputs":"Amy\n16"},{"inputs":"Chan Tai Man\n15"},{"inputs":"Ben\n0"},{"inputs":"Grandma\n99"}],"hint":"age 是字串：先 `int(age) + 1`，再用 `str()` 轉回字串才可以和 \"Next year: \" 連接。"},{"id":"u1-w3","tier":"挑戰","title":"分數變身","pts":13,"src":"仿教科書 p.14 活動 4.2","q":"輸入一個帶小數的分數（例如 `87.6`）。輸出三行：\n1. 轉換成浮點數後的值，例如 `87.6`\n2. 用 `int()` 取得的整數部分，例如 `87`\n3. 整數部分後面加上「分」，例如 `87分`","prompt":"輸入一個帶小數的分數（例如 `87.6`）。輸出三行：\n1. 轉換成浮點數後的值，例如 `87.6`\n2. 用 `int()` 取得的整數部分，例如 `87`\n3. 整數部分後面加上「分」，例如 `87分`","starter":"s = input(\"Mark: \")\nprint(int(s))","ref":"s = input(\"Mark: \")\nmark = float(s)\nprint(mark)\nwhole = int(mark)\nprint(whole)\nprint(str(whole) + \"分\")","tests":[{"inputs":"87.6"},{"inputs":"100.0"},{"inputs":"0.5"},{"inputs":"59.99"},{"inputs":"-3.7"}],"rules":[{"must":"float(","msg":"要用 float() 先把字串轉換成浮點數"}],"hint":"`int(\"87.6\")` 會 ValueError（活動 4.2），要先 `float(s)`；`int()` 捨去小數部分，-3.7 變 -3。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.9–15","items":[{"id":"u1-q1","pts":4,"src":"自擬（p.11 識別符）","q":"以下哪一個是 Python 中**有效**的變量名稱？","options":["my-score","if","_total2","3rd"],"answer":"C","why":"可以底線開頭；不可有「-」、不可是關鍵字、不可數字開頭。","_right":2},{"id":"u1-q2","pts":4,"src":"自擬（p.13–14 轉換數據類型）","tags":[{"t":"trap","why":"有引號的是字串：「\"15\"」不是整數。"}],"verify":true,"q":"以下程式的輸出是什麼？","code":"a = \"10\"\nb = int(a) + 5\nprint(str(b) + a)","options":["1510","25","15 10","TypeError"],"answer":"A","why":"b = 15；str(15) + \"10\" 是字串連接，得 \"1510\"。","_right":0},{"id":"u1-q3","pts":4,"src":"自擬（p.14 活動 4.2、p.24）","verify":true,"ask":{"error":true},"inputs":"3.5","q":"用戶輸入 `3.5`。執行以下程式會出現哪一種錯誤？","code":"num = int(input())\nprint(num * 2)","options":["SyntaxError","NameError","ValueError","沒有錯誤"],"answer":"C","why":"input() 得到字串 \"3.5\"，int() 不能直接轉換帶小數的字串。","_right":2},{"id":"u1-q4","pts":4,"src":"自擬（p.11–12 變量）","q":"關於 Python 的變量，以下哪些正確？\n(1) 變量名稱區分大小寫\n(2) 運用變量前必須先宣告它的數據類型\n(3) 同一個變量可以先後儲存不同數據類型的值","options":["只有 (1)","只有 (1) 和 (3)","只有 (2) 和 (3)","(1)、(2) 和 (3)"],"answer":"B","why":"Python 賦值時自動標籤數據類型，不用先宣告（要先宣告的是 C++）。","_right":1},{"id":"u1-q5","pts":4,"src":"自擬（p.12–14）","tags":[{"t":"trap","why":"int() 把浮點數的小數部分捨去（向零截斷），不是四捨五入：int(7.9) 是 7，int(-2.8) 是 -2。"}],"verify":true,"ask":{"expr":"type(x).__name__"},"q":"執行以下程式後，x 的數據類型是什麼？","code":"x = 9.99\nx = int(x)\nx = str(x)","options":["float","int","str","bool"],"answer":"C","why":"變量可以改存另一類型的值；最後一次賦值的是字串 \"9\"。","_right":2}]},{"id":"more","kind":"endless","title":"無限練習","gens":["pyCast","pyErr","pyPrint"],"intro":"隨機生成轉換數據類型、錯誤類型及 print 輸出題目，答案由 Python 計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]},{"id":"u2","title":"運算、輸入輸出與函數","book":"教科書 D2 第 4 章 p.16–32（另有 p.66 課題練習）","key":"D2-u2-hmac-15c12d762a","sections":[{"id":"s1","title":"數學運算符","pages":"教科書 p.16","learn":[{"pts":["可以把**運算算式**的結果儲存於變量：偽代碼 `變量 ← 算式`，Python `變量 = 算式`。（表 4.2）","算式由**數據**（數字、變量或常數）和**數學運算符**組成，例如 `2 * PI * radius`。"]},{"table":{"head":["算法","偽代碼","Python","例句","y 的值"],"rows":[["加法","+","+","y = 1 + 2","3"],["減法","-","-","y = 1 - 2","-1"],["乘法","* 或 ×","*","y = 2 * 3","6"],["除法","/ 或 ÷","/","y = 5 / 2\ny = 6 / 2","2.5\n3.0"],["整數除法（商數）","DIV","//","y = 10 // 3\ny = 4 // 1.5","3\n2.0"],["模數（餘數）","MOD","%","y = 10 % 3\ny = 3.5 % 3","1\n0.5"],["指數","^","**","y = 2 ** 3","8"]]},"cap":"表 4.3 常見的數學運算符（p.16）"},{"pts":["**`/` 無論能否除盡，結果必定是浮點數**：`6 / 2` 是 `3.0`。","`//` 輸出除法的**商數**，`%` 輸出**餘數**：10 ÷ 3 商 3 餘 1。","算式中只要有一個浮點數，`//`、`%` 的結果也是浮點數：`4 // 1.5` 是 `2.0`。","運算次序：先括號，再 `**`，再 `*`、`/`、`//`、`%`（由左至右），最後 `+`、`-`。","`10 / 3` 在 Python 實際顯示 `3.3333333333333335`（教科書簡寫為 3.33333）。浮點數的最後一位可能有誤差。","`//` 是**向下取整**：`-7 // 2` 是 `-4`（數線上較小的整數），`-7 % 2` 是 `1`。"]},{"sim":{"code":"print(10 / 3)\nprint(10 // 3)\nprint(10 % 3)\nprint(6 / 2)\nprint(4 // 1.5)\nprint(2 ** 3)\nprint(2 + 3 * 4 ** 2)"},"cap":"按 ▶，逐行對照表 4.3。"}],"tries":[{"id":"u2-s1-t1","pts":4,"src":"教科書 p.16 表 4.3","tags":[{"t":"trap","why":"「/」的結果必定是浮點數：6 / 2 是 3.0，不是 3。"}],"code":"print(17 // 5)\nprint(17 % 5)\nprint(6 / 2)","q":"先估：輸出是什麼？","options":["3\n2\n3.0","3\n2\n3","3.4\n2\n3.0","2\n3\n3.0"],"why":"17 ÷ 5 商 3 餘 2；「/」的結果必定是浮點數。","_right":0,"_ans":"3\n2\n3.0"},{"id":"u2-s1-t2","pts":4,"src":"教科書 p.16 表 4.3","code":"print(4 // 1.5)","q":"先估：輸出是什麼？","options":["2","2.0","2.6666666666666665","3"],"why":"4 ÷ 1.5 商 2；因為 1.5 是浮點數，結果也是浮點數 2.0。","_right":1,"_ans":"2.0"}],"practice":[{"id":"u2-s1-p1","type":"fill","pts":3,"src":"教科書 p.16 表 4.3","q":"寫出每個變量的值（照 Python 顯示的寫法，留意 .0）。","code":"a = 5 / 2\nb = 5 // 2\nc = 7 % 4\nd = 3 ** 2","blanks":[{"label":"a","ask":{"var":"a"}},{"label":"b","ask":{"var":"b"}},{"label":"c","ask":{"var":"c"}},{"label":"d","ask":{"var":"d"}}],"hint":"「/」必定是浮點數；「//」商數；「%」餘數；「**」次方。","_ans":["2.5","2","3","9"]},{"id":"u2-s1-p2","type":"mc","pts":1,"src":"自擬（運算次序）","q":"以下程式的輸出是什麼？","code":"print(2 + 3 * 4 ** 2)","options":["50","400","144","194"],"answer":0,"verify":true,"hint":"先 4 ** 2，再乘 3，最後加 2。","_right":0},{"id":"u2-s1-p3","type":"mc","pts":2,"src":"自擬（// 與負數）","tags":[{"t":"trap","why":"「//」向下取整：-7 // 2 是 -4，不是 -3。"}],"q":"以下程式的輸出是什麼？","code":"print(-7 // 2)","options":["-3","-4","-3.5","3"],"answer":1,"verify":true,"hint":"-3.5 向下取整（向數線左邊）。","_right":1}]},{"id":"s2","title":"賦值、除錯與註解","pages":"教科書 p.16–21","learn":[{"table":{"head":["複合賦值運算符","縮寫","相等於"],"rows":[["+=","y += 2","y = y + 2"],["-=","y -= 3","y = y - 3"],["*=","y *= 4","y = y * 4"],["/=","y /= 5","y = y / 5"],["%=","y %= 6","y = y % 6"]]},"cap":"表 4.4 常見的複合賦值運算符（p.17 擴闊視野）"},{"note":"`y = y * (y + 2)` 可寫成 `y *= (y + 2)`（教科書說「只可以」；其實括號可省略，`y *= y + 2` 也一樣，因 {"inputs":"60"},{"inputs":"59"},{"inputs":"0"},{"inputs":"3600"},{"inputs":"61"}],"hint":"分鐘 = time // 60；秒 = time % 60。用「,」分隔各項，print 會自動加空白格。"},{"id":"u2-w2","tier":"進階","title":"BMI 計算機","pts":12,"src":"教科書 p.29 測試站 4.2 第 3 題","q":"BMI = 體重（kg）÷ 身高（m）²。輸出範例：\n`This is a BMI Calculator!`\n`Please enter your height in meters: 1.74`\n`Please enter your weight in kg: 69`\n`Your BMI is 22.79032897344431`","prompt":"BMI = 體重（kg）÷ 身高（m）²。輸出範例：\n`This is a BMI Calculator!`\n`Please enter your height in meters: 1.74`\n`Please enter your weight in kg: 69`\n`Your BMI is 22.79032897344431`","starter":"print(\"This is a BMI Calculator!\")\nheight = input(\"Please enter your height in meters: \")\nweight = input(\"Please enter your weight in kg: \")\n","ref":"print(\"This is a BMI Calculator!\")\nheight = float(input(\"Please enter your height in meters: \"))\nweight = float(input(\"Please enter your weight in kg: \"))\nbmi = weight / (height**2)\nprint(\"Your BMI is\", bmi)","tests":[{"inputs":"1.74\n69"},{"inputs":"1.6\n50"},{"inputs":"1.8\n80"},{"inputs":"1.5\n45"},{"inputs":"2\n100"}],"check":{"out":true,"nums":true},"hint":"input() 得到字串，要先用 float() 轉換；身高要先平方：`weight / (height**2)`。"},{"id":"u2-w3","tier":"挑戰","title":"圓柱體的體積及表面面積","pts":13,"src":"教科書 p.27 測試站 4.2 第 1 題","q":"輸入圓柱體的**直徑** d 和高度 h，輸出體積（πr²h）和表面面積（2πrh + 2πr²），r = d ÷ 2，**π 用 `PI = 3.14`**。輸出範例：\n`Please enter the diameter of the cylinder: 5.5`\n`Please enter the height of the cylinder: 10`\n`The volume of the cylinder is: 237.4625`\n`The surface area of the cylinder is: 220.1925`","prompt":"輸入圓柱體的**直徑** d 和高度 h，輸出體積（πr²h）和表面面積（2πrh + 2πr²），r = d ÷ 2，**π 用 `PI = 3.14`**。輸出範例：\n`Please enter the diameter of the cylinder: 5.5`\n`Please enter the height of the cylinder: 10`\n`The volume of the cylinder is: 237.4625`\n`The surface area of the cylinder is: 220.1925`","starter":"d = float(input(\"Please enter the diameter of the cylinder: \"))\nh = float(input(\"Please enter the height of the cylinder: \"))\nPI = 3.14\n","ref":"d = float(input(\"Please enter the diameter of the cylinder: \"))\nh = float(input(\"Please enter the height of the cylinder: \"))\nPI = 3.14\nvol = PI * ((d/2)**2) * h\narea = 2 * PI * (d/2) * h + 2 * PI * (d/2)**2\nprint(\"The volume of the cylinder is:\", vol)\nprint(\"The surface area of the cylinder is:\", area)","tests":[{"inputs":"5.5\n10"},{"inputs":"2\n1"},{"inputs":"0\n5"},{"inputs":"10\n0.5"},{"inputs":"3\n7"}],"check":{"out":true,"nums":true},"hint":"輸入的是直徑，半徑是 `d/2`；r² 寫成 `(d/2)**2`。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.16–32、p.66","items":[{"id":"u2-q1","pts":3,"src":"教科書 p.66 課題練習 選擇題 1","verify":true,"q":"此 Python 程式的輸出是什麼？","code":"name = \"Billy\"\nprint(\"name\")","options":["Billy","\"Billy\"","name","\"name\""],"answer":"C","why":"括號內是帶引號的字串 \"name\"，照樣列印文字 name，不是變量的值（p.18 常見錯誤）。","_right":2},{"id":"u2-q2","pts":3,"src":"教科書 p.66 課題練習 選擇題 2","verify":true,"q":"此 Python 程式的輸出是什麼？","code":"name = \"Peter\"\nage = 23\nprint(name, \"is\", age)","options":["Peter is 23","Peter \"is\" 23","Peter is 23.0","執行錯誤"],"answer":"A","why":"「,」分隔的各項之間加一個空白格；age 是整數，列印 23。","_right":0},{"id":"u2-q3","pts":3,"src":"教科書 p.66 課題練習 選擇題 3","tags":[{"t":"trap","why":"「/」的結果必定是浮點數：6 / 2 是 3.0，不是 3。"}],"q":"變量 C 的值屬於什麼數據類型？","code":"A = 15\nB = 2.0\nB = int(A / B)\nC = A // B","options":["整數","浮點數","字串","布爾"],"answer":"A","why":"A / B 是 7.5，int() 後 B 是整數 7；15 // 7 兩個都是整數，C 是整數 2。","_right":0},{"id":"u2-q4","pts":4,"src":"自擬（p.16 表 4.3）","verify":true,"q":"以下程式的輸出是什麼？","code":"print(7 // 2 * 2 + 7 % 2)","options":["7","8","7.0","3"],"answer":"A","why":"7 // 2 = 3，3 * 2 = 6，7 % 2 = 1，6 + 1 = 7。","_right":0},{"id":"u2-q5","pts":4,"src":"自擬（p.13、p.30）","verify":true,"q":"以下程式的輸出是什麼？","code":"x = 2.7\nprint(int(x) + round(x))","options":["5","6","5.4","4"],"answer":"A","why":"int(2.7) 捨去小數得 2；round(2.7) 得 3；2 + 3 = 5。","_right":0},{"id":"u2-q6","pts":3,"src":"自擬（p.24–25 輸入語句）","verify":true,"inputs":"3\n4","q":"用家輸入 `3` 和 `4`。以下程式的輸出是什麼？（不計輸入時 Shell 顯示的兩行）","code":"a = input()\nb = int(input())\nprint(a + str(b + 1))","ask":{"expr":"a + str(b + 1)"},"options":["35","8","3 5","TypeError"],"answer":"A","why":"a 是字串 \"3\"；b + 1 = 5，轉成字串後連接得 \"35\"。","_right":0}]},{"id":"more","kind":"endless","title":"無限練習","gens":["pyArith","pyCast","pyPrint"],"intro":"隨機生成運算（+ - * / // % ** 及運算次序）、轉換數據類型及 print 輸出題目，答案由 Python 計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]},{"id":"u3","title":"選擇：if、elif、else 與布爾邏輯","book":"教科書 D2 第 4 章 p.33–51（另有 p.66–67 課題練習）","key":"D2-u3-hmac-de5e03f3eb","sections":[{"id":"s1","title":"關係運算符與 if、if-else","pages":"教科書 p.33–37","learn":[{"pts":["**選擇控制結構**：程式按條件，在**對分**（兩條路）或**多向**（多條路）之中選一條路走。（p.33）","**布爾算式**：結果只有 `True`（真）或 `False`（假），屬布爾數據類型。用**關係運算符**建立，例如 `mark >= 50`。（p.33）"]},{"table":{"head":["偽代碼","Python","意義","例子","mark 是 50 時"],"rows":[["=","`==`","等於","`mark == 50`","True"],["\u003c","`\u003c`","小於","`mark \u003c 50`","False"],["≤","`\u003c=`","小於或等於","`mark \u003c= 50`","True"],[">","`>`","大於","`mark > 50`","False"],["≥","`>=`","大於或等於","`mark >= 50`","True"],["≠ 或 \u003c>","`!=`","不相等","`mark != 50`","False"]]},"cap":"表 4.10 Python 的關係運算符（p.33）"},{"warn":"**`==` 與 `=` 不同**（p.33）：`==` 是關係運算符，只判斷真或假；`=` 是賦值運算符，把右邊的值放進左邊的變量。`if mark = 100:` 是**語法錯誤**。"},{"h":"if 與 if-else（p.34–35）"},{"pts":["`if 條件:` 條件成立（True）→ 執行縮排了的「則」部分；不成立 → 跳過。","`else:` 條件不成立時才執行「否則」部分。兩條路**只會走其中一條**。","每個分支開頭的那一行最後要有**冒號 `:`**。（p.34 提示）","**縮排**表示哪些語句屬於哪個分支；`else` 要和對應的 `if` 對齊。Thonny 中按 Tab／Shift + Tab 加入或移除縮排。（p.36）"]},{"sim":{"code":"mark = int(input(\"Mark: \"))\nif mark >= 50:\n    print(\"Pass\")\n    print(\"Promoted\")\nelse:\n    print(\"Fail\")\n    print(\"Repeated\")","inputs":"70","step":true,"open":["vars"]},"cap":"p.36 的縮排例子。按「下一步」看程式走哪一條路；再改輸入 30 試試。"},{"fix":{"bad":"mark = 70\nif mark >= 50:\n    print(\"Pass\")\nelse:\n    print(\"Work hard next time\")\nprint(\"Fail\")","good":"mark = 70\nif mark >= 50:\n    print(\"Pass\")\nelse:\n    print(\"Work hard next time\")\n    print(\"Fail\")","why":"活動 4.6（p.37）：左邊能運行，但 `print(\"Fail\")` 沒有縮排，不屬於 else，所以一定會執行，輸出 Pass 和 Fail——這是**邏輯錯誤**。"}}],"tries":[{"id":"u3-s1-t1","pts":4,"src":"教科書 p.37 活動 4.6 第 5 題","code":"mark = 70\nif mark >= 50:\n    print(\"Pass\")\nelse:\n    print(\"Work hard next time\")\nprint(\"Fail\")","q":"先估：輸出是什麼？","options":["Pass","Pass\nFail","Work hard next time\nFail","Fail"],"why":"70 >= 50 成立，輸出 Pass；最後一行沒有縮排，不屬於 else，所以無論如何都會輸出 Fail。","_right":1,"_ans":"Pass\nFail"}],"practice":[{"id":"u3-s1-p1","type":"fill","pts":2,"src":"教科書 p.33 表 4.10","q":"`mark` 是 50。寫出每個布爾算式的結果（True 或 False）。","code":"mark = 50","blanks":[{"label":"mark >= 50","ask":{"expr":"mark >= 50"}},{"label":"mark != 50","ask":{"expr":"mark != 50"}},{"label":"mark \u003c 50","ask":{"expr":"mark \u003c 50"}}],"hint":"50 >= 50 包括「等於」，所以成立。","_ans":["True","False","False"]},{"id":"u3-s1-p2","type":"mc","pts":2,"src":"教科書 p.36 活動 4.6 第 1 題","q":"執行這個程式會出現哪一種錯誤？","code":"mark = 70\nif mark >= 50\n    print(\"Pass\")","ask":{"error":true},"verify":true,"options":["SyntaxError","NameError","IndentationError","沒有錯誤"],"answer":0,"hint":"條件後面少了什麼符號？","why":"`if mark >= 50` 後面少了冒號 `:`，是語法錯誤，程式一行也不會執行。","_right":0},{"id":"u3-s1-p3","type":"mc","pts":2,"src":"教科書 p.37 活動 4.6 第 6 題","q":"執行這個程式會出現哪一種錯誤？","code":"name = \"Jenny\"\nmark = 70\nif mark == 100:\n    message = \"You got full marks!\"\nprint(name, message)","ask":{"error":true},"verify":true,"options":["SyntaxError","NameError","TypeError","沒有錯誤"],"answer":1,"hint":"條件不成立時，`message` 有沒有被賦值？","why":"70 == 100 不成立，「則」部分被跳過，`message` 從未被賦值；第 5 行用到它便出現運行時錯誤 NameError。","_right":1}]},{"id":"s2","title":"對分選擇的應用：最低價與交換變量","pages":"教科書 p.38–40","learn":[{"pts":["**例題 4.2 找最低價**：先假設第一個價錢最低，逐一和「挑戰者」比較，較低的留下來；最後留下來的就是最低。（p.38）","要找四個數中最小的，只要多加一句 `if d \u003c min:`。（p.39 想像）","**交換兩個變量**要用暫存變量：`temp = X`、`X = Y`、`Y = temp`。只寫 `X = Y`、`Y = X` 會令兩個變量都變成 Y 的值。（p.40 測試站 4.5）"]},{"sim":{"code":"a = float(input(\"Price of shop A: \"))\nb = float(input(\"Price of shop B: \"))\nc = float(input(\"Price of shop C: \"))\nif a \u003c b:\n    min = a\nelse:\n    min = b\nif c \u003c min:\n    min = c\nprint(\"The lowest price is\", min)","inputs":"10\n8.9\n9.9","step":true,"open":["vars"]},"cap":"例題 4.2（p.39）。按「下一步」看 `min` 怎樣由 10.0 變成 8.9。"},{"note":"教科書用 `min` 作變量名稱。程式可以運行，但 `min` 本來是 Python 的內置函數（找最小值），之後便不能再用 `min()`。自己寫程式時，用 `lowest` 之類的名稱較好。"},{"code":"X = int(input())\nY = int(input())\nif Y > X:\n    temp = X\n    X = Y\n    Y = temp\nprint(X - Y)","cap":"測試站 4.5（p.40，參考 DSE 2020 1B Q2）：如果 Y 較大便交換，所以 X − Y 一定不是負數——輸出兩數之差。"}],"tries":[{"id":"u3-s2-t1","pts":4,"src":"教科書 p.38 例題 4.2 輸出範例 2","code":"a = float(input(\"Price of shop A: \"))\nb = float(input(\"Price of shop B: \"))\nc = float(input(\"Price of shop C: \"))\nif a \u003c b:\n    min = a\nelse:\n    min = b\nif c \u003c min:\n    min = c\nprint(\"The lowest price is\", min)","inputs":"89.9\n99.9\n59.9","q":"先估：輸入 89.9、99.9、59.9，最後一行輸出是什麼？（Shell 也會顯示三行輸入提示）","options":["Price of shop A: 89.9\nPrice of shop B: 99.9\nPrice of shop C: 59.9\nThe lowest price is 59.9","Price of shop A: 89.9\nPrice of shop B: 99.9\nPrice of shop C: 59.9\nThe lowest price is 89.9","Price of shop A: 89.9\nPrice of shop B: 99.9\nPrice of shop C: 59.9\nThe lowest price is 99.9","Price of shop A: 89.9\nPrice of shop B: 99.9\nPrice of shop C: 59.9\nThe lowest price is 59"],"why":"89.9 \u003c 99.9，min = 89.9；59.9 \u003c 89.9，min = 59.9。float 輸入，輸出保留 .9。","_right":0,"_ans":"Price of shop A: 89.9\nPrice of shop B: 99.9\nPrice of shop C: 59.9\nThe lowest price is 59.9"}],"practice":[{"id":"u3-s2-p1","type":"complete","pts":2,"src":"教科書 p.40 測試站 4.5(a)","label":"補完程式","q":"第 4 至 6 行用暫存變量 temp 交換 X 和 Y 的值。補完第 5、6 行。會用測試站 4.5(b) 表中的數據測試。","template":"X = int(input())\nY = int(input())\nif Y > X:\n    temp = X\n    ［1］\n    ［2］\nprint(X-Y)","ref":["X = Y","Y = temp"],"tests":[{"inputs":"1\n6"},{"inputs":"9\n2"},{"inputs":"-5\n1"},{"inputs":"-3\n-10"},{"inputs":"3\n-5"},{"inputs":"-20\n-7"}],"hint":"X 的舊值已存在 temp：先把 Y 給 X，再把 temp 給 Y。"},{"id":"u3-s2-p2","type":"fill","pts":2,"src":"教科書 p.40 測試站 4.5(b)(i)","q":"輸入 X = -20、Y = -7。輸出是什麼？","code":"X = int(input())\nY = int(input())\nif Y > X:\n    temp = X\n    X = Y\n    Y = temp\nprint(X-Y)","inputs":"-20\n-7","blanks":[{"label":"輸出","ask":"out"}],"hint":"-7 > -20，所以會交換：X = -7、Y = -20。","_ans":["-20\n-7\n13"]},{"id":"u3-s2-p3","type":"complete","pts":2,"src":"教科書 p.40 測試站 4.5(c)","label":"補完程式","q":"改用 if-else，不交換變量，同樣輸出兩數之差。補完兩個 print。","template":"X = int(input())\nY = int(input())\nif Y > X:\n    print(［1］)\nelse:\n    print(［2］)","ref":["Y-X","X-Y"],"tests":[{"inputs":"1\n6"},{"inputs":"9\n2"},{"inputs":"-3\n-10"},{"inputs":"4\n4"}],"hint":"大的減小的。Y 較大時用 Y − X。"}]},{"id":"s3","title":"多向選擇：嵌套 if 與 if-elif-else","pages":"教科書 p.41–47","learn":[{"pts":["**嵌套結構**：把一個條件語句放進另一個條件語句的分支內。內層的 if 要多縮排一層。（p.41）","**if-elif-else**：由上而下逐個檢查條件，遇到**第一個**成立的便執行那部分，然後整個語句結束；全部不成立才執行 else。（p.42）","Python 的關鍵字是 `elif`（不是 elseif、else if）。","**條件次序很重要**：例題 4.3 由高至低檢查 `>= 3.60`、`>= 3.00`……；去到第二個條件時已知 GGPA \u003c 3.60，所以只需寫下限。（p.43）","同一個問題也可以寫成多層嵌套 if，但縮排層次多，較容易出錯。（p.45）"]},{"sim":{"code":"ggpa = float(input())\nif ggpa >= 3.60:\n    result = \"First Class Honours\"\nelif ggpa >= 3.00:\n    result = \"Second Class Honours (Division One)\"\nelif ggpa >= 2.40:\n    result = \"Second Class Honours (Division Two)\"\nelif ggpa >= 1.70:\n    result = \"Third Class Honours\"\nelse:\n    result = \"Pass\"\nprint(result)","inputs":"2.75","step":true,"open":["vars"]},"cap":"例題 4.3 榮譽等級（p.44）。試輸入 3.60、3.59、1.70、1.69 等邊界值。"},{"warn":"如果把 `elif ggpa >= 1.70` 放在最前面，3.8 分也會得到 Third Class Honours——第一個成立的條件「搶先」了。由嚴到寬（由高至低）排列條件。"},{"code":"num = int(input(\"Please input your class number: \"))\ngroup = num % 4\nif group == 1:\n    print(\"You are in group RED\")\nelif group == 2:\n    print(\"You are in group ORANGE\")\nelif group == 3:\n    print(\"You are in group GREEN\")\nelse:\n    print(\"You are in group BLUE\")","cap":"測試站 4.6 第 2 題（p.47）：學號除以 4 的餘數決定社。學號 4、8、12…… 的餘數是 0（不是 4），所以最後可寫 `else` 或 `elif group == 0`，但不可寫 `elif group == 4`。"}],"tries":[{"id":"u3-s3-t1","pts":4,"src":"教科書 p.44 例題 4.3","code":"ggpa = float(input())\nif ggpa >= 3.60:\n    result = \"First Class Honours\"\nelif ggpa >= 3.00:\n    result = \"Second Class Honours (Division One)\"\nelif ggpa >= 2.40:\n    result = \"Second Class Honours (Division Two)\"\nelif ggpa >= 1.70:\n    result = \"Third Class Honours\"\nelse:\n    result = \"Pass\"\nprint(result)","inputs":"3.00","q":"先估：輸入 3.00，輸出是什麼？（第一行是輸入的回顯）","options":["3.00\nFirst Class Honours","3.00\nSecond Class Honours (Division One)","3.00\nSecond Class Honours (Division Two)","3.00\nPass"],"why":"3.00 >= 3.60 不成立；3.00 >= 3.00 成立（包括等於），便停止檢查。","_right":1,"_ans":"3.00\nSecond Class Honours (Division One)"},{"id":"u3-s3-t2","pts":4,"src":"教科書 p.47 測試站 4.6 第 2 題","code":"num = int(input(\"Please input your class number: \"))\ngroup = num % 4\nif group == 1:\n    print(\"You are in group RED\")\nelif group == 2:\n    print(\"You are in group ORANGE\")\nelif group == 3:\n    print(\"You are in group GREEN\")\nelse:\n    print(\"You are in group BLUE\")","inputs":"23","q":"先估：輸入 23，輸出是什麼？","options":["Please input your class number: 23\nYou are in group GREEN","Please input your class number: 23\nYou are in group RED","Please input your class number: 23\nYou are in group BLUE","Please input your class number: 23\nYou are in group ORANGE"],"why":"23 % 4 = 3（23 = 4 × 5 + 3），所以是 GREEN。","_right":0,"_ans":"Please input your class number: 23\nYou are in group GREEN"}],"practice":[{"id":"u3-s3-p1","type":"complete","pts":3,"src":"教科書 p.46 測試站 4.6 第 1 題","label":"補完程式","q":"按 BMI 輸出健康狀況：少於 18.5 → Underweight；18.5–22.9 → Normal weight；23–24.9 → Overweight；25 或以上 → Obesity。會用邊界值測試。","template":"bmi = float(input())\nif bmi \u003c 18.5:\n    print(\"Underweight\")\nelif ［1］:\n    print(\"Normal weight\")\nelif ［2］:\n    print(\"Overweight\")\n［3］\n    print(\"Obesity\")","ref":["bmi \u003c 23","bmi \u003c 25","else:"],"tests":[{"inputs":"17"},{"inputs":"18.5"},{"inputs":"22.9"},{"inputs":"23"},{"inputs":"24.9"},{"inputs":"25"},{"inputs":"31.2"}],"hint":"去到第二個條件時已知 bmi >= 18.5，只需寫上限。教科書寫 `bmi \u003c= 22.9`；用 `bmi \u003c 23` 更準確（22.95 也會分對）。最後一個用 else。"},{"id":"u3-s3-p2","type":"complete","pts":2,"src":"教科書 p.47 測試站 4.6 第 2 題","label":"補完程式","q":"學號 1 → RED、2 → ORANGE、3 → GREEN、4 → BLUE、5 → RED…… 補完程式。","template":"num = int(input(\"Please input your class number: \"))\ngroup = ［1］\nif group == 1:\n    print(\"You are in group RED\")\nelif group == 2:\n    print(\"You are in group ORANGE\")\nelif group == 3:\n    print(\"You are in group GREEN\")\n［2］\n    print(\"You are in group BLUE\")","ref":["num % 4","else:"],"tests":[{"inputs":"1"},{"inputs":"6"},{"inputs":"23"},{"inputs":"4"},{"inputs":"40"}],"hint":"每 4 人循環一次：用 % 4 求餘數。學號 4 的餘數是 0。"},{"id":"u3-s3-p3","type":"mc","pts":2,"src":"自擬（條件次序）","q":"輸入 90，輸出是什麼？","code":"mark = int(input())\nif mark >= 50:\n    grade = \"B\"\nelif mark >= 85:\n    grade = \"A\"\nelse:\n    grade = \"F\"\nprint(grade)","inputs":"90","verify":true,"options":["90\nB","90\nA","90\nA\nB","90\nF"],"answer":0,"hint":"if-elif 只執行第一個成立的分支。","why":"90 >= 50 已成立，得 B，後面的 elif 不會再檢查。條件次序寫錯了，應先檢查 >= 85。","_right":0}]},{"id":"s4","title":"布爾邏輯：and、or、not","pages":"教科書 p.48–51","learn":[{"pts":["**布爾運算符**（又稱**邏輯運算符**）把多於一個條件結合成**複合布爾算式**。（p.48）","`and`：兩個條件**都**成立才是 True。`or`：**任何一個**成立便是 True。`not`：把 True 變 False、False 變 True。","Python 的 `and`、`or`、`not` 必須是**小寫**。（p.48 提示）","**範圍**用 and：`X >= 0 and X \u003c= 100`（0 至 100，包括兩端）。**範圍以外**用 or：`age \u003c= 11 or age >= 65`。","同一算式有 not、and、or 時，先計 `not`，再計 `and`，最後計 `or`；不肯定便加括號。"]},{"table":{"head":["X","Y","X and Y","X or Y","not X"],"rows":[["True","True","True","True","False"],["True","False","False","True","False"],["False","True","False","True","True"],["False","False","False","False","True"]]},"cap":"表 4.12–4.14 真值表（p.48）"},{"sim":{"code":"age = int(input(\"Please input your age: \"))\nisStudent = input(\"Do you hold a valid student ID? (Y/N): \")\nif isStudent == \"Y\":\n    isStudent = True\nelse:\n    isStudent = False\nif (age \u003c= 11) or (age >= 65):\n    print(\"Children/Elderly: HKD 100\")\nelif (age \u003c= 25) and (isStudent == True):\n    print(\"Student: HKD 150\")\nelse:\n    print(\"Adult: HKD 200\")","inputs":"20\nY","step":true,"open":["vars"]},"cap":"例題 4.4 戲院售票機（p.49）：小童（11 歲或以下）／長者（65 歲或以上）HKD 100；25 歲或以下並持有效學生證 HKD 150；其他成人 HKD 200。"},{"note":"`isStudent == True` 可以簡寫為 `isStudent`，因為它本身已是布爾值。教科書在條件外加了括號，例如 `if((age \u003c= 11) or (age >= 65)):`，加不加都可以。"}],"tries":[{"id":"u3-s4-t1","pts":4,"src":"教科書 p.49 例題 4.4","code":"age = int(input(\"Please input your age: \"))\nisStudent = input(\"Do you hold a valid student ID? (Y/N): \")\nif isStudent == \"Y\":\n    isStudent = True\nelse:\n    isStudent = False\nif (age \u003c= 11) or (age >= 65):\n    print(\"Children/Elderly: HKD 100\")\nelif (age \u003c= 25) and (isStudent == True):\n    print(\"Student: HKD 150\")\nelse:\n    print(\"Adult: HKD 200\")","inputs":"26\nY","q":"先估：26 歲並持有學生證，最後一行輸出是什麼？","options":["Please input your age: 26\nDo you hold a valid student ID? (Y/N): Y\nStudent: HKD 150","Please input your age: 26\nDo you hold a valid student ID? (Y/N): Y\nAdult: HKD 200","Please input your age: 26\nDo you hold a valid student ID? (Y/N): Y\nChildren/Elderly: HKD 100","Please input your age: 26\nDo you hold a valid student ID? (Y/N): Y\nStudent: HKD 150\nAdult: HKD 200"],"why":"26 \u003c= 25 不成立，`and` 要兩個條件都成立，所以不是學生票，落到 else：成人票。","_right":1,"_ans":"Please input your age: 26\nDo you hold a valid student ID? (Y/N): Y\nAdult: HKD 200"}],"practice":[{"id":"u3-s4-p1","type":"fill","pts":2,"src":"教科書 p.48 表 4.11–4.14","q":"A = 1、B = 2。寫出每個算式的結果（True 或 False）。","code":"A = 1\nB = 2","blanks":[{"label":"(A == 1) and (B > 2)","ask":{"expr":"(A == 1) and (B > 2)"}},{"label":"(A == 1) or (B > 2)","ask":{"expr":"(A == 1) or (B > 2)"}},{"label":"not (A == 1)","ask":{"expr":"not (A == 1)"}}],"hint":"B > 2 是 False（2 不大於 2）。","_ans":["False","True","False"]},{"id":"u3-s4-p2","type":"complete","pts":2,"src":"教科書 p.49 例題 4.4","label":"補完條件","q":"補完售票機的兩個條件。會用 11、12、25、26、64、65 歲等邊界值測試。","template":"age = int(input(\"Please input your age: \"))\nisStudent = input(\"Do you hold a valid student ID? (Y/N): \")\nif ［1］:\n    print(\"Children/Elderly: HKD 100\")\nelif ［2］:\n    print(\"Student: HKD 150\")\nelse:\n    print(\"Adult: HKD 200\")","ref":["age \u003c= 11 or age >= 65","age \u003c= 25 and isStudent == \"Y\""],"tests":[{"inputs":"11\nN"},{"inputs":"12\nY"},{"inputs":"25\nY"},{"inputs":"25\nN"},{"inputs":"26\nY"},{"inputs":"64\nN"},{"inputs":"65\nY"}],"hint":"小童「或」長者用 or；學生要年齡「及」學生證兩個條件都符合，用 and。這裏 isStudent 是字串 \"Y\"／\"N\"。"},{"id":"u3-s4-p3","type":"mc","pts":2,"src":"自擬（範圍條件）","q":"範圍是 1 至 10（包括 1 和 10）。要判斷 `x` **不在**這個範圍內，以下哪個條件正確？","options":["x \u003c 1 or x > 10","x \u003c 1 and x > 10","x \u003c= 1 or x >= 10","not (x \u003c 1 or x > 10)"],"answer":0,"hint":"一個數不可能同時小於 1 又大於 10。","why":"範圍以外是「太小 或 太大」。`and` 永遠是 False；C 把 1 和 10 也當作範圍外；D 剛好是「在範圍內」。","_right":0}]},{"id":"write","kind":"write","title":"寫程式","pages":"教科書 p.39、p.50–51","intro":"在編輯器寫 Python，先按 ▶ 執行自己測試，再按「提交評核」。輸入：每次 input() 讀一行。輸出要和題目的範例一模一樣（包括大小楷和空格）。","tasks":[{"id":"u3-w1","tier":"必做","title":"最低價在哪間商舖","pts":10,"src":"教科書 p.39 例題 4.2 想像第 1 題","q":"承例題 4.2，輸入三間商舖 A、B、C 的價錢，輸出最低價**和**商舖名稱。\n用變量 `shop` 記錄商舖名稱。如果價錢相同，取**較前**的商舖（用 `\u003c` 比較便會這樣）。\n範例：輸入 10、8.9、9.9，最後一行輸出 `The lowest price is 8.9 at shop B`","starter":"a = float(input(\"Price of shop A: \"))\nb = float(input(\"Price of shop B: \"))\nc = float(input(\"Price of shop C: \"))\n","ref":"a = float(input(\"Price of shop A: \"))\nb = float(input(\"Price of shop B: \"))\nc = float(input(\"Price of shop C: \"))\nlowest = a\nshop = \"A\"\nif b \u003c lowest:\n    lowest = b\n    shop = \"B\"\nif c \u003c lowest:\n    lowest = c\n    shop = \"C\"\nprint(\"The lowest price is\", lowest, \"at shop\", shop)","tests":[{"inputs":"10\n8.9\n9.9"},{"inputs":"89.9\n99.9\n59.9"},{"inputs":"5\n7\n9"},{"inputs":"6\n6\n6"},{"inputs":"12.5\n9.9\n9.9"}],"rules":[{"must":"if","msg":"要用 if 比較價錢"},{"mustNot":"min(","msg":"這題不可用 min()，要自己比較"}],"hint":"先假設 A 最低：`lowest = a`、`shop = \"A\"`。之後 `if b \u003c lowest:` 便同時更新 lowest 和 shop；C 也一樣。"},{"id":"u3-w2","tier":"必做","title":"戲院售票機（VIP 會員）","pts":12,"src":"教科書 p.50–51 例題 4.4 第 2 題","q":"小童（11 歲或以下）／長者（65 歲或以上）：`Children/Elderly: HKD 100`\n學生（25 歲或以下並持有效學生證）：會員 `Student (Member): HKD 120`，非會員 `Student: HKD 150`\n成人：會員 `Adult (Member): HKD 180`，非會員 `Adult: HKD 200`\n三個輸入已寫好（Y 或 N）。用 and／or 及嵌套 if 完成程式。","starter":"age = int(input(\"Please input your age: \"))\nisStudent = input(\"Do you hold a valid student ID? (Y/N): \")\nisMember = input(\"Are you our member? (Y/N): \")\n","ref":"age = int(input(\"Please input your age: \"))\nisStudent = input(\"Do you hold a valid student ID? (Y/N): \")\nisMember = input(\"Are you our member? (Y/N): \")\nif age \u003c= 11 or age >= 65:\n    print(\"Children/Elderly: HKD 100\")\nelif age \u003c= 25 and isStudent == \"Y\":\n    if isMember == \"Y\":\n        print(\"Student (Member): HKD 120\")\n    else:\n        print(\"Student: HKD 150\")\nelse:\n    if isMember == \"Y\":\n        print(\"Adult (Member): HKD 180\")\n    else:\n        print(\"Adult: HKD 200\")","tests":[{"inputs":"8\nN\nY"},{"inputs":"65\nN\nN"},{"inputs":"25\nY\nY"},{"inputs":"16\nY\nN"},{"inputs":"26\nY\nY"},{"inputs":"40\nN\nN"}],"hint":"先用 `if age \u003c= 11 or age >= 65:`；`elif age \u003c= 25 and isStudent == \"Y\":` 之內再用 `if isMember == \"Y\":` 分會員和非會員；else（成人）之內也一樣。"},{"id":"u3-w3","tier":"進階","title":"閏年判斷","pts":13,"src":"自擬（布爾邏輯，DSE 常見題材）","q":"輸入年份 `year`（整數），判斷是否閏年：\n• 可被 4 整除**而且**不可被 100 整除，是閏年；\n• **或者**可被 400 整除，也是閏年。\n是閏年輸出 `Leap year`，否則輸出 `Not a leap year`。\n提示：「可被 4 整除」即 `year % 4 == 0`。","starter":"year = int(input())\n","ref":"year = int(input())\nif (year % 4 == 0 and year % 100 != 0) or year % 400 == 0:\n    print(\"Leap year\")\nelse:\n    print(\"Not a leap year\")","tests":[{"inputs":"2024"},{"inputs":"2023"},{"inputs":"1900"},{"inputs":"2000"},{"inputs":"2100"},{"inputs":"1996"}],"hint":"一個 if 加 and／or：`(year % 4 == 0 and year % 100 != 0) or year % 400 == 0`。1900 可被 100 整除但不可被 400 整除，所以不是閏年；2000 是。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.66–67","items":[{"id":"u3-q1","pts":3,"src":"教科書 p.66 課題練習 選擇題 4","tags":[{"t":"hot","why":"DSE 卷一常考空運行含 if／嵌套 if 的程式（例如 2020 1B Q2 交換變量求差）"}],"q":"以下程式用以尋找 A 和 B 之間的絕對差異，但尚未完成。哪一項最適合填上空格？","code":"A = int(input())\nB = int(input())\nif ______ :\n    temp = A\n    A = B\n    B = temp\nprint(A-B)","options":["A >= B","B = A","B-1 >= A","以上皆非"],"answer":"C","why":"B 較大時才要交換。A、B 是整數，`B-1 >= A` 即 `B > A`。A 會在 A 較大時交換，得出負數；B 用了賦值運算符 `=`，是語法錯誤。","_right":2},{"id":"u3-q2","pts":4,"src":"教科書 p.66 課題練習 選擇題 5","tags":[{"t":"trap","why":"範圍兩端是否包括、and 與 or 混淆"}],"q":"分數 X 必須在 0 至 100 之間（包括 0 和 100），否則輸出 \"Not a valid input\"。哪一項條件可以填上空格？","code":"name = input(\"Name: \")\nX = int(input(\"X: \"))\nif ______ :\n    print(name, \"has a score of\", X)\nelse:\n    print(\"Not a valid input\")","options":["X > 0 and X \u003c= 100","X >= 0 and X \u003c 100","X > -1 or X \u003c 101","X > -1 and X \u003c 101"],"answer":"D","why":"X 是整數，`X > -1` 即 `X >= 0`，`X \u003c 101` 即 `X \u003c= 100`。A 漏了 0，B 漏了 100；C 用 or，任何整數都成立。","_right":3},{"id":"u3-q3","pts":3,"src":"教科書 p.67 課題練習 選擇題 6","q":"程式比較運動員 A、B、C 跑 100 米的時間；result 代表跑得最快（時間最短）的時間。哪一項可以填上空格？","code":"A = float(input(\"A:\"))\nB = float(input(\"B:\"))\nC = float(input(\"C:\"))\nif ______ :\n    result = B\nelse:\n    result = A\nif result > C:\n    result = C\n    print(result)\nelse:\n    print(result)","options":["result > A","result > B","A \u003c B","A > B"],"answer":"D","why":"時間越短越快。A 比 B 慢（A > B）才取 B。A、B 選項用到未賦值的 result（NameError）；C 方向相反。","_right":3},{"id":"u3-q4","pts":3,"src":"教科書 p.67 課題練習 選擇題 8","tags":[{"t":"hot","why":"DSE 卷一常考空運行含 if／嵌套 if 的程式（例如 2020 1B Q2 交換變量求差）"}],"q":"輸入 member = 1、gold = 0，輸出是什麼？（只看 print 的輸出）","code":"member = int(input())\ngold = int(input())\nif (member == 1):\n    if (gold == 1):\n        print(\"30% off\")\n    else:\n        print(\"10% off\")\nelse:\n    print(\"No discount\")","options":["30% off","10% off","No discount","30% off No discount"],"answer":"B","why":"member == 1 成立，進入內層；gold == 1 不成立，執行內層的 else：10% off。外層 else 不會執行。","_right":1},{"id":"u3-q5","pts":4,"src":"自擬（多個 if 與 if-elif 的分別）","tags":[{"t":"trap","why":"獨立的 if 每個都會檢查，後面的賦值會蓋過前面"}],"verify":true,"q":"以下程式的輸出是什麼？","code":"mark = 90\ngrade = \"F\"\nif mark >= 85:\n    grade = \"A\"\nif mark >= 70:\n    grade = \"B\"\nif mark >= 50:\n    grade = \"C\"\nprint(grade)","options":["A","B","C","F"],"answer":"C","why":"三個都是獨立的 if（不是 elif），全部都會檢查；90 符合三個條件，最後一個把 grade 改成 C。要得 A，第二、三個應改為 elif。","_right":2},{"id":"u3-q6","pts":3,"src":"自擬（運算次序 not → and → or）","verify":true,"q":"以下程式的輸出是什麼？","code":"x = 5\ny = 0\nprint(x > 3 and y > 0 or not y == 1)","options":["True","False","None","SyntaxError"],"answer":"A","why":"先計 not：`not y == 1` = not False = True；再計 and：True and False = False；最後 or：False or True = True。","_right":0}]},{"id":"more","kind":"endless","title":"無限練習","gens":["pyIf","pyBool","pyArith"],"intro":"隨機生成 if／elif／else 的輸出題、and／or／not 的真假題及算術運算題，答案由電腦計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]},{"id":"u4","title":"迭代：for、range 與 while","book":"教科書 D2 第 4 章 p.52–60（另有 p.67–68 課題練習）","key":"D2-u4-hmac-7890d7a0ba","sections":[{"id":"s1","title":"for 循環與 range()","pages":"教科書 p.52–54","learn":[{"pts":["**迭代**又稱**循環**：重複執行某段語句，直至不再符合循環條件。被重複的語句叫**循環體**。（p.52）","`for` 循環用一個變量作**循環計數器**，指定循環體重複的次數。（p.52）","偽代碼 `設 i 由 1 至 5` 在 Python 寫成 `for i in range(1, 5+1):`——**最終值要加 1**，因為循環條件是「i \u003c 最終值 + 1」。（p.52–53 提示）","`range()` 的參數只可以是整數。（p.53 提示）"]},{"table":{"head":["range()","意思","例子","包含的數"],"rows":[["`range(end)`","由 0 開始，每次加 1，到 end 為止（**不包括** end）","`range(4)`","0, 1, 2, 3"],["`range(start, end)`","由 start 開始，每次加 1（不包括 end）","`range(2, 5)`","2, 3, 4"],["`range(start, end, step)`","由 start 開始，每次加 step（不包括 end）","`range(2, 10, 3)`","2, 5, 8"],["","step 是負數便遞減","`range(8, 2, -3)`","8, 5"]]},"cap":"range() 函數（p.53）"},{"sim":{"code":"for i in range(1, 6):\n    print(3 * i)","step":true,"open":["vars","trace"]},"cap":"p.53：1 至 5 的值逐一代入 i，每次執行循環體 `print(3 * i)`。若寫成 `range(1, 5)`，i = 5 不符合條件，便少了 15。"},{"note":"重複次數（step 是 1 時）= end − start。例如 `range(3, 6)` 執行 3 次。遞減時 `range(5, -1, -1)` 包括 0，共 6 次。"}],"tries":[{"id":"u4-s1-t1","pts":4,"src":"教科書 p.54 活動 4.7","code":"for k in range(5, 0, -1):\n    print(k)","q":"先估：輸出是什麼？","options":["5\n4\n3\n2\n1","5\n4\n3\n2\n1\n0","4\n3\n2\n1\n0","（沒有輸出）"],"why":"由 5 開始每次減 1，到 0 為止但不包括 0。","_right":0,"_ans":"5\n4\n3\n2\n1"},{"id":"u4-s1-t2","pts":4,"src":"教科書 p.54 活動 4.7","code":"for i in range(5):\n    print(i * 2)","ask":{"count":2},"q":"先估：`print(i * 2)` 執行了多少次？","options":["4","5","6","10"],"why":"`range(5)` 是 0, 1, 2, 3, 4，共 5 個數，輸出 0 2 4 6 8。","_right":1,"_ans":"5"}],"practice":[{"id":"u4-s1-p1","type":"fill","pts":2,"src":"教科書 p.54 活動 4.7","q":"空運行，寫出輸出（每個數一行）及循環體重複的次數。","code":"for i in range(5, -1, -1):\n    print(i)","blanks":[{"label":"輸出","ask":"out"},{"label":"重複次數","ask":{"count":2}}],"hint":"end 是 -1，不包括 -1，所以會去到 0。","_ans":["5\n4\n3\n2\n1\n0","6"]},{"id":"u4-s1-p2","type":"fill","pts":2,"src":"教科書 p.53 range() 表","q":"寫出每個 `list(range(...))` 的結果（Python 寫法，例如 `[0, 1, 2]`）。","code":"a = list(range(2, 10, 3))\nb = list(range(8, 2, -3))\nc = list(range(3))","blanks":[{"label":"a","ask":{"var":"a"}},{"label":"b","ask":{"var":"b"}},{"label":"c","ask":{"var":"c"}}],"hint":"由 start 開始加 step，未到 end 便停（不包括 end）。","_ans":["[2, 5, 8]","[8, 5]","[0, 1, 2]"]},{"id":"u4-s1-p3","type":"trace","pts":3,"src":"教科書 p.54 活動 4.7 最後一題","q":"完成追蹤表（每次循環結束時的值）及寫出最後一行的輸出。","code":"total = 0\nfor i in range(0, 6):\n    total = total + i * 5\n    print(total)\nprint(total / 5)","spec":{"mode":"iter","cols":["i","total"],"out":true},"hint":"每次加 i × 5：0、5、10、15、20、25。最後 `/` 除法得浮點數 15.0。","_trace":{"mode":"iter","cols":[{"key":"i","label":"i"},{"key":"total","label":"total"},{"key":"__out","label":"輸出"}],"rows":[{"label":"循環前","line":2,"cells":[{"v":"","changed":false},{"v":"0","changed":true},{"v":"","changed":false}]},{"label":"第 1 次","line":2,"cells":[{"v":"0","changed":true},{"v":"0","changed":false},{"v":"0","changed":true}]},{"label":"第 2 次","line":2,"cells":[{"v":"1","changed":true},{"v":"5","changed":true},{"v":"5","changed":true}]},{"label":"第 3 次","line":2,"cells":[{"v":"2","changed":true},{"v":"15","changed":true},{"v":"15","changed":true}]},{"label":"第 4 次","line":2,"cells":[{"v":"3","changed":true},{"v":"30","changed":true},{"v":"30","changed":true}]},{"label":"第 5 次","line":2,"cells":[{"v":"4","changed":true},{"v":"50","changed":true},{"v":"50","changed":true}]},{"label":"第 6 次","line":2,"cells":[{"v":"5","changed":true},{"v":"75","changed":true},{"v":"75","changed":true}]}]}}]},{"id":"s2","title":"for 循環的應用：星星、倍數、求和、階乘","pages":"教科書 p.55–56","learn":[{"pts":["**列印 n 次**：`for i in range(0, n):` 或 `range(n)`。`print(\"*\", end = \"\")` 印完不換行，星星便排在同一行。（p.55 測試站 4.7 第 1 題）","**首 X 個 Y 的倍數**：`for i in range(1, X+1):` 輸出 `Y * i`。（p.55 第 2 題）","**求總和（Σ）**：總和變量先設為 **0**，每次加上 n。（p.56 第 3 題）","**階乘 n!**：乘積變量先設為 **1**（設 0 的話乘甚麼都是 0）。0! = 1：n 是 0 時 `range(1, 1)` 一次也不執行，結果正好是 1。（p.56 第 4 題）"]},{"sim":{"code":"k = int(input())\nsummation = 0\nfor n in range(1, k+1):\n    summation = summation + n\nprint(summation)","inputs":"5","step":true,"open":["vars","trace"]},"cap":"測試站 4.7 第 3 題（p.56）：1 + 2 + 3 + 4 + 5 = 15。"},{"warn":"累加變量要在循環**之前**設定初始值。如果把 `summation = 0` 放進循環體，每次都會被重設，最後只得到 k。"}],"tries":[{"id":"u4-s2-t1","pts":4,"src":"教科書 p.55 測試站 4.7 第 1 題","code":"amount = float(input(\"Please input an amount: \"))\nstar = int(amount // 10)\nfor i in range(0, star):\n    print(\"*\", end = \"\")","inputs":"91.1","q":"先估：輸入 91.1，輸出是什麼？","options":["Please input an amount: 91.1\n*********","Please input an amount: 91.1\n**********","Please input an amount: 91.1\n********","Please input an amount: 91.1\n*\n*\n*\n*\n*\n*\n*\n*\n*"],"why":"91.1 // 10 = 9.0，int() 得 9，印 9 粒星；`end = \"\"` 令星星不換行。","_right":0,"_ans":"Please input an amount: 91.1\n*********"}],"practice":[{"id":"u4-s2-p1","type":"complete","pts":2,"src":"教科書 p.55 測試站 4.7 第 2 題","label":"補完程式","q":"輸入 X 和 Y，輸出首 X 個 Y 的倍數，例如 X = 4、Y = 3 → `The result is: 3 6 9 12`。","template":"X = int(input(\"X: \"))\nY = int(input(\"Y: \"))\nprint(\"The result is: \", end = \"\")\nfor i in range(［1］):\n    print(［2］, \"\", end = \"\")","ref":["1, X+1","Y * i"],"tests":[{"inputs":"4\n3"},{"inputs":"1\n7"},{"inputs":"5\n10"},{"inputs":"0\n5"}],"hint":"i 由 1 到 X（所以 end 是 X+1），每次輸出 Y × i。"},{"id":"u4-s2-p2","type":"complete","pts":2,"src":"教科書 p.56 測試站 4.7 第 3 題","label":"補完程式","q":"輸入正整數 k，輸出 1 + 2 + … + k。","template":"k = int(input())\nsummation = ［1］\nfor n in range(［2］):\n    ［3］\nprint(summation)","ref":["0","1, k+1","summation = summation + n"],"tests":[{"inputs":"5"},{"inputs":"1"},{"inputs":"10"},{"inputs":"100"}],"hint":"總和由 0 開始；n 由 1 到 k。"},{"id":"u4-s2-p3","type":"complete","pts":3,"src":"教科書 p.56 測試站 4.7 第 4 題","label":"補完程式","q":"輸入非負整數 n，輸出 n!（0! = 1）。","template":"n = int(input())\nfactorial = ［1］\nfor i in range(［2］):\n    ［3］\nprint(factorial)","ref":["1","1, n+1","factorial = factorial * i"],"tests":[{"inputs":"5"},{"inputs":"0"},{"inputs":"1"},{"inputs":"10"}],"hint":"乘積由 1 開始；n 是 0 時循環不執行，輸出 1。"}]},{"id":"s3","title":"while 循環","pages":"教科書 p.57–58","learn":[{"pts":["**while 循環**：先判斷條件；成立便執行循環體，然後**再判斷**。只要條件一直成立，循環體便不斷執行。（p.57）","寫法：`while 條件:`，循環體要縮排。","循環體內一定要有語句**改變條件中的變量**，否則條件永遠成立，變成**無限循環**（邏輯錯誤）。","**for**：已知重複次數；**while**：重複次數未知，視乎條件（例如直至餘數小於除數）。"]},{"sim":{"code":"num = 17\nwhile num \u003c 100:\n    print(num)\n    num = num + 17","step":true,"open":["vars","trace"]},"cap":"p.57 例句。num 變成 102 時，102 \u003c 100 不成立，離開循環，所以 102 不會輸出。"},{"code":"t = int(input())\nd = int(input())\nr = t\nwhile r >= d:\n    r = r - d\nprint(r)","cap":"測試站 4.8 第 2 題（p.58）：不斷減去 d，直至不夠減。剩下的 r 就是 **t 除以 d 的餘數**；循環體執行的次數就是**商數**（被除數 = 商數 × 除數 + 餘數）。"},{"warn":"如果漏寫 `num = num + 17`，num 永遠是 17，程式會一直輸出 17，停不下來。在 Thonny 按「停止」可中止程式。"}],"tries":[{"id":"u4-s3-t1","pts":4,"src":"教科書 p.58 測試站 4.8 第 2(a) 題","code":"t = int(input())\nd = int(input())\nr = t\nwhile r >= d:\n    r = r - d\nprint(r)","inputs":"13\n5","q":"先估：輸入 13 和 5，最後輸出的 r 是多少？","options":["13\n5\n3","13\n5\n2","13\n5\n8","13\n5\n-2"],"why":"13 → 8 → 3；3 >= 5 不成立，離開循環。13 ÷ 5 = 2 餘 3。","_right":0,"_ans":"13\n5\n3"}],"practice":[{"id":"u4-s3-p1","type":"complete","pts":2,"src":"教科書 p.58 測試站 4.8 第 1 題","label":"補完程式","q":"輸入 X 和 Y，輸出 X 以內（包括 X）所有 Y 的倍數，每個一行。","template":"X = int(input())\nY = int(input())\nnum = Y\nwhile ［1］:\n    print(num)\n    ［2］","ref":["num \u003c= X","num = num + Y"],"tests":[{"inputs":"20\n3"},{"inputs":"12\n4"},{"inputs":"5\n7"},{"inputs":"10\n10"}],"hint":"「以內」包括 X，用 `\u003c=`；每次加 Y，否則會無限循環。"},{"id":"u4-s3-p2","type":"trace","pts":3,"src":"教科書 p.58 測試站 4.8 第 2 題","q":"輸入 t = 20、d = 6。完成追蹤表。","code":"t = int(input())\nd = int(input())\nr = t\nwhile r >= d:\n    r = r - d\nprint(r)","inputs":"20\n6","spec":{"mode":"stmt","cols":["t","d","r"],"out":true},"hint":"20 → 14 → 8 → 2；2 >= 6 不成立。","_trace":{"mode":"stmt","cols":[{"key":"t","label":"t"},{"key":"d","label":"d"},{"key":"r","label":"r"},{"key":"__out","label":"輸出"}],"rows":[{"label":"t = int(input())","line":1,"cells":[{"v":"20","changed":true},{"v":"","changed":false},{"v":"","changed":false},{"v":"","changed":false}]},{"label":"d = int(input())","line":2,"cells":[{"v":"20","changed":false},{"v":"6","changed":true},{"v":"","changed":false},{"v":"","changed":false}]},{"label":"r = t","line":3,"cells":[{"v":"20","changed":false},{"v":"6","changed":false},{"v":"20","changed":true},{"v":"","changed":false}]},{"label":"r = r - d","line":5,"cells":[{"v":"20","changed":false},{"v":"6","changed":false},{"v":"14","changed":true},{"v":"","changed":false}]},{"label":"r = r - d","line":5,"cells":[{"v":"20","changed":false},{"v":"6","changed":false},{"v":"8","changed":true},{"v":"","changed":false}]},{"label":"r = r - d","line":5,"cells":[{"v":"20","changed":false},{"v":"6","changed":false},{"v":"2","changed":true},{"v":"","changed":false}]},{"label":"print(r)","line":6,"cells":[{"v":"20","changed":false},{"v":"6","changed":false},{"v":"2","changed":false},{"v":"2","changed":true}]}]}},{"id":"u4-s3-p3","type":"mc","pts":2,"src":"教科書 p.58 測試站 4.8 第 2(b) 題","q":"上面這個程式（t、d、r）的目的是什麼？","options":["找出 t 除以 d 的餘數","找出 t 除以 d 的商數","找出 t 和 d 的差","找出 t 和 d 中較小的數"],"answer":0,"hint":"試想想 r 與 t 和 d 的關係：10 和 3 → 1；13 和 5 → 3。","why":"不斷減去 d，剩下不夠減的部分就是餘數，等於 `t % d`（t、d 是正整數時）。","_right":0}]},{"id":"s4","title":"前測與後測循環","pages":"教科書 p.59–60","learn":[{"pts":["**前測循環**：先檢查條件，成立才執行循環體——`for` 和 `while` 都是。循環體**可能一次也不執行**。（p.59）","**後測循環**：先執行循環體，再檢查條件，循環體**最少執行一次**——偽代碼的「執行…當」和「重複…直至」。（p.59）","**Python 沒有後測循環的語句**。做法：先在循環前執行一次循環體，再接一個 while 循環。（p.59 圖 4.3）","「重複…直至 條件」= 條件**不成立**便繼續，所以轉成 while 時要寫**相反**的條件：`直至 X > 0` → `while X \u003c= 0:`。"]},{"sim":{"code":"num = float(input())\nwhile num \u003c= 0:\n    num = float(input())\nprint(\"OK:\", num)","inputs":"-3\n0\n5","step":true,"open":["vars"]},"cap":"例題 4.5（p.60）：輸入錯誤（不是正數）便要求重新輸入，直至輸入正數。最後一行是加上去的，方便看結果。"},{"table":{"head":["","前測循環","後測循環"],"rows":[["何時檢查條件","執行循環體之前","執行循環體之後"],["循環體最少執行","0 次","1 次"],["例子","for、while","執行…當、重複…直至（Python 用 while 模擬）"]]},"cap":"前測與後測循環（p.59）"}],"tries":[{"id":"u4-s4-t1","pts":4,"src":"教科書 p.60 例題 4.5","code":"num = float(input())\nwhile num \u003c= 0:\n    num = float(input())\nprint(\"OK:\", num)","inputs":"-3\n0\n5","ask":{"count":3},"q":"先估：依次輸入 -3、0、5。第 3 行（循環體內的 input）執行了多少次？","options":["1","2","3","0"],"why":"第 1 行讀 -3；-3 \u003c= 0，第 3 行讀 0；0 \u003c= 0 仍成立，再讀 5；5 \u003c= 0 不成立。第 3 行共 2 次。注意 0 不是正數。","_right":1,"_ans":"2"}],"practice":[{"id":"u4-s4-p1","type":"complete","pts":2,"src":"教科書 p.69 長題目第 3 題（改編）","label":"補完程式","q":"用 Python 改寫這個「執行…當」後測循環：`sum ← 0`、`i ← 0`、`執行`（`sum ← sum + 5`、`i ← i + 1`）`當 (i \u003c 5)`、`輸出 sum`。\n做法：先執行一次循環體，再用 while。","template":"total = 0\ni = 0\ntotal = total + 5\ni = i + 1\nwhile ［1］:\n    total = total + 5\n    ［2］\nprint(total)","ref":["i \u003c 5","i = i + 1"],"tests":[{"inputs":""}],"hint":"「執行…當」的條件成立便繼續，所以 while 用同一個條件。循環體要更新 i。（變量用 total，避免蓋過內置函數 sum()。）"},{"id":"u4-s4-p2","type":"mc","pts":2,"src":"自擬（前測循環）","q":"以下程式的輸出是什麼？","code":"x = 10\nwhile x \u003c 5:\n    print(x)\n    x = x + 1\nprint(\"End\")","verify":true,"options":["End","10\nEnd","5\nEnd","（無限循環）"],"answer":0,"hint":"while 是前測循環：先檢查條件。","why":"一開始 10 \u003c 5 已不成立，循環體一次也不執行，只輸出 End。","_right":0}]},{"id":"write","kind":"write","title":"寫程式","pages":"教科書 p.55–60","intro":"在編輯器寫 Python，先按 ▶ 執行自己測試，再按「提交評核」。輸入：每次 input() 讀一行。這部分的 input() 不用提示文字。","tasks":[{"id":"u4-w1","tier":"必做","title":"乘數表","pts":10,"src":"自擬（for 循環，參考 p.55 測試站 4.7 第 2 題）","q":"輸入整數 `n`，用 **for 循環**輸出 n 的乘數表（1 至 9），每行格式：`n x i = 答案`。\n例如輸入 3，輸出 `3 x 1 = 3`、`3 x 2 = 6`……直至 `3 x 9 = 27`，共 9 行。","starter":"n = int(input())\n","ref":"n = int(input())\nfor i in range(1, 10):\n    print(n, \"x\", i, \"=\", n * i)","tests":[{"inputs":"3"},{"inputs":"1"},{"inputs":"12"},{"inputs":"0"},{"inputs":"-2"}],"rules":[{"must":"for","msg":"要用 for 循環"}],"hint":"`for i in range(1, 10):`（不包括 10），`print(n, \"x\", i, \"=\", n * i)`——逗號之間會自動加一個空格。"},{"id":"u4-w2","tier":"必做","title":"用減法求商數和餘數","pts":12,"src":"教科書 p.58 測試站 4.8 第 2 題（延伸）","q":"輸入正整數 `t`（被除數）和 `d`（除數）。**不可用 `//` 和 `%`**，用 while 循環不斷減去 d，計算商數 `q` 和餘數 `r`。\n輸出兩行：第一行商數，第二行餘數。\n例如輸入 13、5，輸出 `2` 和 `3`。","starter":"t = int(input())\nd = int(input())\nr = t\nq = 0\n","ref":"t = int(input())\nd = int(input())\nr = t\nq = 0\nwhile r >= d:\n    r = r - d\n    q = q + 1\nprint(q)\nprint(r)","tests":[{"inputs":"13\n5"},{"inputs":"10\n3"},{"inputs":"2\n2"},{"inputs":"3\n7"},{"inputs":"20\n10"},{"inputs":"0\n4"}],"rules":[{"must":"while","msg":"要用 while 循環"},{"mustNot":"//","msg":"不可用 // 運算符"},{"mustNot":"%","msg":"不可用 % 運算符"}],"hint":"測試站 4.8 的程式已求出餘數 r；商數就是循環體執行的次數，在循環體內加一句 `q = q + 1`。"},{"id":"u4-w3","tier":"進階","title":"有效輸入與數字和","pts":13,"src":"教科書 p.60 例題 4.5（延伸）","q":"輸入一個整數 `n`；如果不是正數（≤ 0），便要求重新輸入，直至輸入正數（例題 4.5 的做法）。\n然後用 while 循環計算 n 每個位的**數字和**並輸出。\n例如輸入 -5、0、1234，輸出 `10`（1 + 2 + 3 + 4）。\n提示：`n % 10` 是個位數字，`n // 10` 去掉個位。","starter":"n = int(input())\n","ref":"n = int(input())\nwhile n \u003c= 0:\n    n = int(input())\ntotal = 0\nwhile n > 0:\n    total = total + n % 10\n    n = n // 10\nprint(total)","tests":[{"inputs":"1234"},{"inputs":"-5\n0\n1234"},{"inputs":"100"},{"inputs":"-1\n99999"},{"inputs":"7"}],"rules":[{"must":"while","msg":"要用 while 循環"}],"hint":"第一個 while：`while n \u003c= 0:` 內再 `n = int(input())`。第二個 while：`while n > 0:` 內把 `n % 10` 加進 total，再 `n = n // 10`。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.67–68","items":[{"id":"u4-q1","pts":3,"src":"教科書 p.67 課題練習 選擇題 7","tags":[{"t":"hot","why":"DSE 卷一每年都有空運行循環程式的題目（輸出／執行次數）"}],"verify":true,"q":"以下 Python 程式的輸出是什麼？","code":"for i in range(1, 5, 2):\n    print(\"A\")","options":["A\nA","AA","AAAAA","A\nA\nA"],"answer":"A","why":"`range(1, 5, 2)` 是 1, 3，共 2 次；print 每次換行，所以 A 分兩行。","_right":0},{"id":"u4-q2","pts":4,"src":"教科書 p.67 課題練習 選擇題 9","tags":[{"t":"hot","why":"DSE 卷一每年都有空運行循環程式的題目（輸出／執行次數）"},{"t":"trap","why":"> 與 >= 差一次；for 循環的 range 在開始時已決定，之後改 X 不影響次數"}],"q":"輸出結果是「AAAAA」。以下哪項最適合填入空格？","code":"X = 5\n______\n    print(\"A\", end=\"\")\n    X = X - 1","options":["for i in range(0, X, -1):","for i in range(1, X):","while (X > 0):","while (X >= 0):"],"answer":"C","why":"X 由 5 減到 1 共 5 次。A：由 0 遞減到 5，一次也不執行；B：1 至 4 只得 4 次；D：連 X = 0 也執行，共 6 次。","_right":2},{"id":"u4-q3","pts":3,"src":"教科書 p.68 課題練習 選擇題 10","tags":[{"t":"trap","why":"total 是浮點數，// 的結果也是浮點數"}],"q":"VIP 客戶消費 50 元得 1 分，往後每消費 10 元多得 1 分。以下哪項可以取代第 5 至第 7 行，計算出相同的積分？","code":"total = float(input())\npoints = 0\nif (total >= 50):\n    total = total - 40\n    while (total >= 10):\n        total = total - 10\n        points += 1\nprint(points)","options":["points = total % 10","points = total // 10","points = total - 10","points = total / 10"],"answer":"B","why":"「不斷減 10 並計次數」就是整數除法 `//`。注意：total 是浮點數，所以 B 得出的是 3.0 而原程式輸出 3——數值相同，但輸出格式不同（教科書沒有說明）。要完全一樣可寫 `points = int(total // 10)`。D 會得出 3.5 之類的小數。","_right":1},{"id":"u4-q4","pts":3,"src":"教科書 p.68 課題練習 選擇題 11","q":"下列哪個偽代碼可以代替以下 Python 程式？","code":"X = int(input(\"X: \"))\nwhile X \u003c= 0:\n    X = int(input(\"X:\"))","options":["執行 / 輸入 X / 當 X >= 0","執行 / 輸入 X / 當 X \u003c 0","重複 / 輸入 X / 直至 X \u003c 0","重複 / 輸入 X / 直至 X > 0"],"answer":"D","why":"程式先輸入一次，X \u003c= 0 便再輸入，即「直至 X > 0」。若用「執行…當」，條件應是 `當 X \u003c= 0`，A、B 都不對（B 漏了 0）。","_right":3},{"id":"u4-q5","pts":3,"src":"教科書 p.68 課題練習 選擇題 12","q":"以下程式計算首 X 個雙數的總和（2 + 4 + … + 2X）。以下哪項修改可以使程式計算出首 X 個單數的總和？","code":"X = int(input())\nsum = 0\nfor i in range(1, X+1):\n    sum = sum + 2 * i","options":["第 2 行改為 sum = 1","第 3 行改為 for i in range(1, X):","第 4 行改為 sum = sum + 2 * i - 1","第 4 行改為 sum = sum + i"],"answer":"C","why":"第 i 個單數是 2i − 1：1, 3, 5, …。A 只是多加 1；B 少了一個雙數；D 是 1 + 2 + … + X。","_right":2},{"id":"u4-q6","pts":4,"src":"自擬（DSE 式 range 遞減空運行）","tags":[{"t":"hot","why":"DSE 卷一每年都有空運行循環程式的題目（輸出／執行次數）"}],"verify":true,"q":"以下程式的輸出是什麼？","code":"count = 0\nfor i in range(10, 0, -3):\n    count = count + i\nprint(count)","options":["22","18","12","15"],"answer":"A","why":"`range(10, 0, -3)` 是 10, 7, 4, 1（不包括 0）；10 + 7 + 4 + 1 = 22。","_right":0}]},{"id":"more","kind":"endless","title":"無限練習","gens":["pyRange","pyFor","pyWhile"],"intro":"隨機生成 range() 成員／個數、for 循環累加及 while 循環輸出題，答案由電腦計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]},{"id":"u5","title":"列表基本運作","book":"教科書 D2 第 5 章 p.76–91（另有 p.154 課題練習）","key":"D2-u5-hmac-3ea3a98a84","theory":false,"sections":[{"id":"s1","title":"陣列與列表；索引由 0 開始","pages":"教科書 p.76–79","learn":[{"pts":["**一維陣列（1D array）**：有次序地儲存一連串**同一種數據類型**的數據；配合循環，處理大量數據更容易。（p.76）","Python 沒有陣列，但可用**列表（list）**達到相似效果。列表的項目可以屬不同數據類型；本課只放同一種類型，當作陣列使用。（p.76）","建立列表：直接賦值，例如 `list1 = [\"David\", \"Lily\", \"Ben\"]`、`list2 = [34, 23, 90, 56, 100]`。`print(type(list1))` 輸出 `\u003cclass 'list'>`。（p.76）","**初始化（initialisation）**：先建立列表並給預設值，才可以存取項目。`list3 = [0]*10` 建立 10 個 0；`list4 = [\"\"]*5` 建立 5 個空字串。（p.77）","**偽代碼的陣列索引由 1 開始；Python 列表索引由 0 開始。** `list1[0]` 是 `\"David\"`，`list2[2]` 是 `90`。（p.78）","長度為 `N` 的列表，最後索引是 `N-1`。（p.78 提示）"]},{"table":{"head":["list2","34","23","90","56","100"],"rows":[["Python 索引","0","1","2","3","4"],["偽代碼索引","1","2","3","4","5"]]},"cap":"同一個列表，兩種索引（p.76–78）"},{"warn":"**DSE 陷阱**：讀偽代碼題時 `A[1]` 是第一項；寫 Python 時 `A[0]` 才是第一項。把偽代碼「設 i 由 1 至 5」直接改成 `range(1, 6)` 便會漏了第一項，還會超出範圍。"},{"note":"擴闊視野（p.79）：陣列存放在連續的記憶體，程式只記下**起始位址**（指針）。項目位址 = 起始位址 + 索引，第一項距離起始位址 0，所以索引由 0 開始。例如 arr 起始位址 3046，`arr[3]` 在 3046 + 3 = 3049。"},{"sim":{"code":"list1 = [\"David\", \"Lily\", \"Ben\"]\nlist2 = [34, 23, 90, 56, 100]\nlist3 = [0]*10\nprint(list1[0])\nprint(list2[2])\nprint(type(list1))","open":["vars"],"step":true},"cap":"p.76–78 的例子。按「下一步」，在變量表看看三個列表。"}],"tries":[{"id":"u5-s1-t1","pts":4,"src":"教科書 p.78","code":"list2 = [34, 23, 90, 56, 100]\nlist2[0] = 28\nlist2[1] = list2[2] - 5\nprint(list2)","q":"先估：輸出是什麼？","options":["[28, 85, 90, 56, 100]","[28, 18, 90, 56, 100]","[34, 85, 90, 56, 100]","[28, 23, 85, 56, 100]"],"why":"list2[2] 是 90（索引由 0 開始），90 − 5 = 85 放入 list2[1]。若以為 list2[2] 是 23 便會選錯。","_right":0,"_ans":"[28, 85, 90, 56, 100]"}],"practice":[{"id":"u5-s1-p1","type":"fill","pts":1,"src":"教科書 p.80 輸出指定項目","q":"寫出輸出。","code":"list1 = [\"David\", \"Lily\", \"Ben\"]\nprint(list1[1])\nprint(list1[0])","blanks":[{"label":"輸出","ask":"out"}],"hint":"list1[1] 是第 2 項。","_ans":["Lily\nDavid"]},{"id":"u5-s1-p2","type":"mc","pts":2,"src":"教科書 p.78 提示","tags":[{"t":"trap","why":"偽代碼的陣列索引由 1 開始；Python 列表索引由 0 開始，長度 N 的列表最後索引是 N − 1（p.78）。"}],"q":"`fees` 有 8 個項目。以下哪一項是**最後一項**？","options":["fees[8]","fees[7]","fees[9]","fees[1]"],"answer":1,"hint":"長度 N 的列表，最後索引是 N − 1。","_right":1},{"id":"u5-s1-p3","type":"mc","pts":1,"src":"教科書 p.78 常見錯誤","q":"執行以下程式時會出現什麼錯誤？","code":"list1 = []\nlist1[0] = \"David\"","ask":{"error":true},"options":["沒有錯誤","IndexError","NameError","TypeError"],"answer":1,"verify":true,"hint":"空列表（empty list）沒有任何項目，不能用索引賦值。","_right":1},{"id":"u5-s1-p4","type":"fill","pts":1,"src":"教科書 p.78 試想想","q":"寫出 `list(range(0, 5))` 的結果，即 `range(0, 5)` 包含的數列。","code":"r = list(range(0, 5))","blanks":[{"label":"r","ask":{"var":"r"}}],"hint":"由 0 開始，不包括 5。","_ans":["[0, 1, 2, 3, 4]"]}]},{"id":"s2","title":"更新、輸出及複製列表","pages":"教科書 p.77–84","learn":[{"pts":["**更新項目**：`list2[0] = 28`；也可先讀取再運算：`list2[1] = list2[2] - 5`。（p.78）","用 for 循環逐一賦值：`for i in range(0, 5):` → `list2[i] = i`。（p.78）","**逐一輸出**：`for i in range(0, 5):` → `print(list2[i])`。（p.80）","擴闊視野：`print(list2)` 一次輸出整個列表（有方括號及逗號）；`for item in list1:` 也可逐一取出項目。（p.80）","**複製列表**：先 `new_list = [0]*5`，再用 for 循環 `new_list[i] = list2[i]`。（p.81）","擴闊視野：列表是**動態**的，長度可以改變。`list1 = list1 + [\"David\"]` 或 `list2.append(\"Ken\")` 都會在末端加入項目。（p.77）"]},{"sim":{"code":"list2 = [34, 23, 90, 56, 100]\nnew_list = [0]*5\nfor i in range(0, 5):\n    new_list[i] = list2[i]\nnew_list[0] = 99\nprint(list2)\nprint(new_list)","open":["vars"],"step":true},"cap":"用循環複製（p.81）：改 new_list 不會影響 list2。"},{"warn":"`new_list = list2` **不是**複製：兩個名稱指向同一個列表，改 `new_list[0]`，`list2[0]` 也會變。"},{"code":"list1 = []\nlist1 = list1 + [\"David\"]\nlist1 = list1 + [\"Lily\"]\nlist2 = []\nlist2.append(\"Ken\")\nlist2.append(\"Frank\")\nprint(list1)\nprint(list2)","cap":"兩種加入項目的方法（p.77 擴闊視野）。注意 `list1 + \"David\"` 會出 TypeError：列表只可以和列表相加。"}],"tries":[{"id":"u5-s2-t1","pts":4,"src":"教科書 p.82 活動 5.2","code":"even = [2, 4, 6, 8, 10]\nfor i in range(0, 4):\n    even[i] = even[i] + even[i+1]\n    print(even[i])","q":"先估：輸出是什麼？","options":["6\n10\n14\n18","6\n10\n14\n18\n10","2\n6\n10\n14","6\n16\n30\n48"],"why":"每次加上「後一項」，後一項還未被更新：2+4、4+6、6+8、8+10。","_right":0,"_ans":"6\n10\n14\n18"},{"id":"u5-s2-t2","pts":4,"src":"教科書 p.82 活動 5.2","code":"odd = [1, 3, 5, 7, 9]\nfor i in range(1, 5):\n    odd[i] = odd[i] + odd[i-1]\n    print(odd[i])","q":"先估：輸出是什麼？","options":["4\n8\n12\n16","4\n9\n16\n25","1\n4\n9\n16\n25","3\n5\n7\n9"],"why":"這次加上「前一項」，而前一項**已經更新**：3+1=4、5+4=9、7+9=16、9+16=25。","_right":1,"_ans":"4\n9\n16\n25"}],"practice":[{"id":"u5-s2-p1","type":"trace","pts":2,"src":"教科書 p.82 活動 5.2","q":"空運行以下程式，完成追蹤表（每次循環一行）。","code":"original_list = [10, 12, 19, 25]\nnew_list = [0]*4\nfor i in range(0, 4):\n    new_list[i] = original_list[3-i]\n    print(new_list[i])","spec":{"mode":"iter","cols":["i","new_list"],"out":true},"hint":"i = 0 時取 original_list[3]。","_trace":{"mode":"iter","cols":[{"key":"i","label":"i"},{"key":"new_list","label":"new_list"},{"key":"__out","label":"輸出"}],"rows":[{"label":"循環前","line":3,"cells":[{"v":"","changed":false},{"v":"[0, 0, 0, 0]","changed":true},{"v":"","changed":false}]},{"label":"第 1 次","line":3,"cells":[{"v":"0","changed":true},{"v":"[25, 0, 0, 0]","changed":true},{"v":"25","changed":true}]},{"label":"第 2 次","line":3,"cells":[{"v":"1","changed":true},{"v":"[25, 19, 0, 0]","changed":true},{"v":"19","changed":true}]},{"label":"第 3 次","line":3,"cells":[{"v":"2","changed":true},{"v":"[25, 19, 12, 0]","changed":true},{"v":"12","changed":true}]},{"label":"第 4 次","line":3,"cells":[{"v":"3","changed":true},{"v":"[25, 19, 12, 10]","changed":true},{"v":"10","changed":true}]}]}},{"id":"u5-s2-p2","type":"complete","pts":1,"src":"教科書 p.83 測試站 5.1 第 1 題","label":"補完程式","q":"把列表的值更新為由 0 開始的首五個雙數，並逐行輸出（0、2、4、6、8）。","template":"num = [0, 0, 0, 0, 0]\nfor i in range(0, ［1］):\n    num[i] = ［2］\n    print(num[i])","ref":["5","i * 2"],"tests":[{"inputs":""}],"hint":"Python 的 range 不包括終值；偽代碼則寫「由 0 至 4」。"},{"id":"u5-s2-p3","type":"complete","pts":2,"src":"教科書 p.83 測試站 5.1 第 2 題","label":"補完程式","q":"湯先生要向八位客戶每人加收行政費 $50。完成程式（最後一行輸出整個列表）。","template":"fees = [1050, 1000, 2000, 2500, 2800, 1800, 1500, 1400]\nfor index in range(［1］, ［2］):\n    ［3］\nprint(fees)","ref":["0","8","fees[index] = fees[index] + 50"],"tests":[{"inputs":""}],"check":{"out":true,"vars":["fees"]},"hint":"索引 0 至 7，所以 range(0, 8)。偽代碼答案是「設 index 由 0 至 7」。"},{"id":"u5-s2-p4","type":"complete","pts":2,"src":"教科書 p.84 測試站 5.1 第 4 題","label":"補完程式","q":"Mike 未能出席，由弟弟 Stephen 代替。更新列表，再逐行輸出（Stephen、Amy、Billy）。","template":"team = [\"Mike\", \"Amy\", \"Billy\"]\nteam[［1］] = ［2］\nfor i in range(0, ［3］):\n    print(team[i])","ref":["0","\"Stephen\"","3"],"tests":[{"inputs":""}],"hint":"Mike 在索引 0；三個項目，range(0, 3)。"}]},{"id":"s3","title":"除錯：超出範圍與倒序輸出","pages":"教科書 p.78、p.81–85","learn":[{"pts":["不存在於列表中的項目不能被存取：**空列表**（`[]`）沒有項目；`[0]*5` 只有索引 0–4，用 `list2[5]` 便**超出範圍（out of range）**。（p.78 常見錯誤）","Python 會顯示運行時錯誤 **IndexError: list index out of range**，並停在出錯那一行；之前的輸出照樣出現。","小心 `num[i+1]`、`num[i-1]` 這類寫法：要檢查 i 在**第一次**和**最後一次**循環時，索引是否仍在 0 至 N − 1 之內。（p.81 活動 5.1）","**倒序輸出**：`for i in range(4, -1, -1):` 得 i = 4、3、2、1、0；或 `for i in range(0, 5):` 配 `print(num[4-i])`。（p.85 測試站 5.1 第 5 題）"]},{"sim":{"code":"num = [10, 15, 20, 25, 30, 35, 40]\nfor i in range(0, 7):\n    num[i] = num[i] + num[i+1]\n    print(num[i])","open":["vars"],"step":true},"cap":"活動 5.1（p.81）：執行到 i = 6 時，`num[7]` 不存在 → IndexError。把 `range(0, 7)` 改成 `range(0, 6)` 便可。"},{"fix":{"bad":"age = [34, 23, 81, 56, 8]\nfor i in range(1, 6):\n    print(age[i])","good":"age = [34, 23, 81, 56, 8]\nfor i in range(0, 5):\n    print(age[i])","why":"照搬偽代碼「由 1 至 5」：漏了 age[0]，還要讀取不存在的 age[5]。（p.81 活動 5.1）"}}],"tries":[{"id":"u5-s3-t1","pts":4,"src":"教科書 p.81 活動 5.1","code":"sec = [1.1, 0.98, 0.99]\nfor i in range(3, -1, -1):\n    print(sec[i])","ask":{"error":true},"q":"先估：執行時會出現什麼錯誤？","options":["沒有錯誤","IndexError","SyntaxError","ValueError"],"why":"第一次循環 i = 3，sec[3] 不存在（只有索引 0–2）。應寫 range(2, -1, -1)。","_right":1,"_ans":"IndexError"}],"practice":[{"id":"u5-s3-p1","type":"mc","pts":1,"src":"教科書 p.81 活動 5.1","q":"以下程式無法運行，原因是什麼？","code":"height = []\nheight[0] = 175\nheight[1] = 180\nheight[2] = 165","options":["列表名稱不可以叫 height","建立的列表沒有任何項目","175 不是整數","要先輸出 height"],"answer":1,"hint":"可以改為 `height = [0]*3`，或用 `height.append(175)`。","_right":1},{"id":"u5-s3-p2","type":"fill","pts":2,"src":"教科書 p.82 活動 5.2","q":"空運行，寫出輸出。","code":"sec = [1.1, 0.98, 0.99]\nfor i in range(2, -1, -1):\n    print(sec[i])","blanks":[{"label":"輸出","ask":"out"}],"hint":"i = 2、1、0（不包括 -1）。","_ans":["0.99\n0.98\n1.1"]},{"id":"u5-s3-p3","type":"complete","pts":3,"src":"教科書 p.85 測試站 5.1 第 5 題","label":"補完程式","q":"讀取五個整數，按輸入次序存入列表，再**倒序**逐行輸出。會用多組數據測試。","template":"num = [0, 0, 0, 0, 0]\nfor i in range(0, ［1］):\n    num[i] = int(input(\"Input an integer: \"))\nprint(\"The inputted integers are:\")\nfor i in range(［2］):\n    ［3］","ref":["5","4, -1, -1","print(num[i])"],"tests":[{"inputs":"10\n5\n20\n15\n0"},{"inputs":"1\n2\n3\n4\n5"}],"hint":"倒序：i 由 4 下至 0，`range(4, -1, -1)`。另一寫法：`range(0, 5)` 配 `print(num[4-i])`。"}]},{"id":"s4","title":"列表運算：總和、平均值、len()","pages":"教科書 p.86–91","learn":[{"pts":["**求總和**：`total = 0`，用 for 循環逐一 `total = total + time[i]`。（p.86）","**求平均值**：總和 ÷ 列表長度。用 `/` 的結果一定是浮點數。（p.86）","每次數據數目不同時，不要把 8 寫死：用 **`len()`** 取得列表長度 `N = len(time)`，再 `range(0, N)`、`total/N`。（p.87）","例題 5.1：重複輸入，**輸入 -1 代表完成**（-1 不放入列表），用 while 循環；每次 `time = time + [record]`。（p.88）","測試站 5.2：**平均偏差** = Σ|xᵢ − mean| ÷ n；**標準差** = √(Σ(xᵢ − mean)² ÷ n)，要 `import math` 用 `math.sqrt()`。（p.90–91）"]},{"sim":{"code":"time = [15.1, 14.9, 15.6, 16.1, 16.8, 17.0, 16.9, 16.5]\ntotal = 0\nfor i in range(0, 8):\n    total = total + time[i]\nprint(total)\navg = total/8\nprint(avg)","open":["vars"],"step":true},"cap":"800 米跑每 100 米的時間（p.86）：總和 128.9，平均 16.1125。"},{"sim":{"code":"time = []\nrecord = float(input(\"Input a record (input -1 to exit): \"))\nwhile record != -1:\n    time = time + [record]\n    record = float(input(\"Input a record (input -1 to exit): \"))\nprint(\"Your record:\", time)\ntotal = 0\nN = len(time)\nfor i in range(0, N):\n    total = total + time[i]\nprint(total)\navg = total/N\nprint(avg)","inputs":"14.9\n15.5\n16.1\n15.8\n-1","open":["vars"]},"cap":"例題 5.1（p.88–89）完整程式。輸入 -1 結束。"}],"tries":[{"id":"u5-s4-t1","pts":4,"src":"教科書 p.90 測試站 5.2(a)","code":"mark = [80, 90, 75, 60]\ntotal = 0\nfor i in range(0, 4):\n    total = total + mark[i]\navg = total/len(mark)\nprint(avg)","q":"先估：輸出是什麼？","options":["76","76.25","76.3","305"],"why":"總和 305，305 / 4 = 76.25。","_right":1,"_ans":"76.25"}],"practice":[{"id":"u5-s4-p1","type":"complete","pts":2,"src":"教科書 p.88–89 例題 5.1(a)(b)","label":"補完程式","q":"輸入每 100 米的時間，輸入 -1 代表完成；之後輸出總時間及平均時間。會用多組數據測試。","template":"time = []\nrecord = float(input())\nwhile ［1］:\n    time = ［2］\n    record = float(input())\ntotal = 0\nN = ［3］\nfor i in range(0, N):\n    total = total + time[i]\nprint(total)\nprint(total/N)","ref":["record != -1","time + [record]","len(time)"],"tests":[{"inputs":"14.9\n15.5\n16.1\n15.8\n-1"},{"inputs":"12\n-1"},{"inputs":"10\n20\n-1"}],"hint":"`time + record` 會出 TypeError，要寫 `time + [record]`。"},{"id":"u5-s4-p2","type":"complete","pts":2,"src":"教科書 p.90 測試站 5.2(b)","label":"補完程式","q":"已知平均分 `avg`，計算平均偏差（mean deviation）。","template":"mark = [80, 90, 75, 60]\navg = 76.25\nmean_dev = 0\nfor i in range(0, 4):\n    if (mark[i] > avg):\n        mean_dev = ［1］\n    else:\n        mean_dev = ［2］\nmean_dev = mean_dev/4\nprint(mean_dev)","ref":["mean_dev + (mark[i] - avg)","mean_dev + (avg - mark[i])"],"tests":[{"inputs":""}],"hint":"兩個分支都要得到正數的差（絕對值）。"},{"id":"u5-s4-p3","type":"fill","pts":1,"src":"教科書 p.91 測試站 5.2(c)","q":"執行以下計算標準差的程式，寫出輸出。","code":"import math\nmark = [80, 90, 75, 60]\navg = 76.25\nsd = 0\nfor i in range(0, 4):\n    if (mark[i] > avg):\n        sd = sd + (mark[i] - avg) ** 2\n    else:\n        sd = sd + (avg - mark[i]) ** 2\nsd = math.sqrt(sd/4)\nprint(sd)","blanks":[{"label":"輸出","ask":"out"}],"hint":"可以按 ▶ 執行看看。想一想：平方之後正負一樣，其實不需要 if。","_ans":["10.825317547305483"]},{"id":"u5-s4-p4","type":"mc","pts":2,"src":"教科書 p.87","q":"以下程式的輸出是什麼？","code":"time = [1, 2, 3, 4]\nprint(len(time))","options":["3","4","10","[1, 2, 3, 4]"],"answer":1,"verify":true,"hint":"len() 傳回項目數目。","_right":1}]},{"id":"write","kind":"write","title":"寫程式","pages":"教科書 p.85–91","intro":"在編輯器寫 Python，可以先按「▶ 執行」自己測試，再按「提交評核」。每次 `input()` 讀一行輸入。輸出要和要求完全一樣（包括提示文字）。","tasks":[{"id":"u5-w1","tier":"必做","pts":10,"title":"倒序列印五個整數","src":"教科書 p.85 測試站 5.1 第 5 題","q":"讀取五個整數（提示文字 `Input an integer: `），按輸入次序存入列表 `num`。然後輸出 `The inputted integers are:`，再**倒序**逐行輸出五個整數。","starter":"num = [0, 0, 0, 0, 0]\nfor i in range(0, 5):\n    num[i] = int(input(\"Input an integer: \"))\n","ref":"num = [0, 0, 0, 0, 0]\nfor i in range(0, 5):\n    num[i] = int(input(\"Input an integer: \"))\nprint(\"The inputted integers are:\")\nfor i in range(4, -1, -1):\n    print(num[i])","tests":[{"inputs":"10\n5\n20\n15\n0"},{"inputs":"1\n2\n3\n4\n5"},{"inputs":"-7\n0\n0\n8\n-7"},{"inputs":"100\n99\n98\n97\n96"}],"check":{"out":true,"vars":["num"]},"rules":[{"must":"for","msg":"要用 for 循環倒序輸出。"}],"hint":"`range(4, -1, -1)` 得 4、3、2、1、0。另一寫法：`range(0, 5)` 配 `num[4-i]`。"},{"id":"u5-w2","tier":"進階","pts":12,"title":"跑步記錄：總時間和平均時間","src":"教科書 p.88–89 例題 5.1","q":"重複讀取時間（`float(input(\"Input a record (input -1 to exit): \"))`），輸入 **-1** 代表完成。把時間存入列表 `time`，然後：\n• 輸出 `Your record:` 和列表（`print(\"Your record:\", time)`）\n• 如果沒有任何記錄，輸出 `No record` 便結束\n• 否則輸出 `Total amount of time:` 和總和，再輸出 `Average time:` 和平均值（同樣用 print 的逗號）\n例如輸入 14.9、15.5、16.1、15.8、-1，最後兩行是 `Total amount of time: 62.3` 和 `Average time: 15.575`。","starter":"time = []\nrecord = float(input(\"Input a record (input -1 to exit): \"))\n","ref":"time = []\nrecord = float(input(\"Input a record (input -1 to exit): \"))\nwhile record != -1:\n    time = time + [record]\n    record = float(input(\"Input a record (input -1 to exit): \"))\nprint(\"Your record:\", time)\nN = len(time)\nif N == 0:\n    print(\"No record\")\nelse:\n    total = 0\n    for i in range(0, N):\n        total = total + time[i]\n    print(\"Total amount of time:\", total)\n    print(\"Average time:\", total/N)","tests":[{"inputs":"14.9\n15.5\n16.1\n15.8\n-1"},{"inputs":"-1"},{"inputs":"12.5\n-1"},{"inputs":"10\n20\n30\n-1"}],"check":{"out":true,"nums":true},"rules":[{"must":"while","msg":"要用 while 循環重複讀取，直至輸入 -1。"}],"hint":"`while record != -1:` 內先把 record 加入列表，再讀下一個。之後用 `len(time)` 判斷有沒有記錄（否則除以 0 → ZeroDivisionError）。"},{"id":"u5-w3","tier":"挑戰","pts":13,"title":"平均分、平均偏差、標準差","src":"教科書 p.90–91 測試站 5.2","q":"先輸入學生人數 n（n ≥ 1），再逐行輸入 n 個測驗成績（整數，不用提示文字），存入列表 `mark`。逐行輸出：\n1. 平均分\n2. 平均偏差 = Σ|xᵢ − mean| ÷ n\n3. 標準差 = √(Σ(xᵢ − mean)² ÷ n)\n三個數都用 `round(…, 2)` 後才輸出。\n例如輸入 4、80、90、75、60，輸出 `76.25`、`8.75`、`10.83`。","starter":"import math\nn = int(input())\nmark = []\n","ref":"import math\nn = int(input())\nmark = []\nfor i in range(0, n):\n    mark.append(int(input()))\ntotal = 0\nfor i in range(0, n):\n    total = total + mark[i]\navg = total/n\nmean_dev = 0\nsd = 0\nfor i in range(0, n):\n    mean_dev = mean_dev + abs(mark[i] - avg)\n    sd = sd + (mark[i] - avg) ** 2\nprint(round(avg, 2))\nprint(round(mean_dev/n, 2))\nprint(round(math.sqrt(sd/n), 2))","tests":[{"inputs":"4\n80\n90\n75\n60"},{"inputs":"1\n55"},{"inputs":"3\n70\n70\n70"},{"inputs":"8\n2\n4\n4\n4\n5\n5\n7\n9"},{"inputs":"2\n0\n100"}],"check":{"out":true,"nums":true},"hint":"先求平均分，才可以計算偏差，所以成績要先存入列表。`abs()` 可代替書中的 if…else；平方要用 `** 2`。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.76–91、p.154","items":[{"id":"u5-q1","pts":4,"src":"教科書 p.154 課題練習 選擇題 1","tags":[{"t":"trap","why":"偽代碼的陣列索引由 1 開始；Python 列表索引由 0 開始，長度 N 的列表最後索引是 N − 1（p.78）。"}],"verify":true,"q":"以下 Python 程式的輸出是什麼？","code":"list = [10, 23, 55]\nprint(list[2])","options":["10","23","55","list[2]"],"answer":"C","why":"索引由 0 開始，list[2] 是第 3 項 55。（用 `list` 作變量名稱會遮蓋內置的 list()，自己寫程式時最好避免。）","_right":2},{"id":"u5-q2","pts":4,"src":"教科書 p.154 課題練習 選擇題 2","q":"`list[0]` 和 `list[1]` 的數據類型分別是什麼？","code":"list = [0] * 2\nlist[0] = \"0\"\nlist[1] = \"integer\"","options":["整數，字串","字串，整數","字串，字串","整數，整數"],"answer":"C","why":"兩項都被賦值為有引號的字串；\"0\" 不是整數 0。","_right":2},{"id":"u5-q3","pts":4,"src":"教科書 p.154 課題練習 選擇題 3","q":"程式記錄一班學生的體重，用戶必須輸入 `-1` 才能終止。哪項最適合填上〔空格〕？","code":"list = []\nweight = float(input())\n〔空格〕\n    list = list + [weight]\n    weight = float(input())\nprint(list)","options":["while weight == -1:","while weight != -1:","if weight == -1:","if weight != -1:"],"answer":"B","why":"要重複輸入（while），而且不是 -1 時才繼續。","_right":1},{"id":"u5-q4","pts":4,"src":"教科書 p.154 課題練習 選擇題 4","q":"程式計算學生的平均身高。哪項最適合填上〔空格〕？","code":"list2 = []\ni = 0\ntotal = 0\nheight = float(input())\nwhile height != -1:\n    list2 = list2 + [height]\n    〔空格〕\n    height = float(input())\nprint(\"The mean is\", total/i)","options":["total = total + height","total = total - height","total = total + height ／ i = i + 1（兩行）","total = total + height ／ i = i - 1（兩行）"],"answer":"C","why":"要累加總和，同時用 i 數算人數；只累加 total 的話 i 一直是 0 → ZeroDivisionError。","_right":2},{"id":"u5-q5","pts":4,"src":"自擬（DSE 風格，參考 p.82 活動 5.2）","tags":[{"t":"hot","why":"DSE 卷一甲部幾乎每年都有空運行陣列／列表算法的題目。"},{"t":"trap","why":"偽代碼的陣列索引由 1 開始；Python 列表索引由 0 開始，長度 N 的列表最後索引是 N − 1（p.78）。"}],"verify":true,"q":"以下程式的輸出是什麼？","code":"A = [3, 1, 4, 1, 5]\nfor i in range(1, 5):\n    A[i] = A[i] * A[i-1]\nprint(A[4])","options":["5","15","60","12"],"answer":"C","why":"A 變成 [3, 3, 12, 12, 60]：每項乘上已更新的前一項。","_right":2}]},{"id":"more","kind":"endless","title":"無限練習","gens":["pyList","pyListAlgo"],"intro":"隨機生成列表索引、len、更新項目及用循環求總和的題目，答案由 Python 計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]},{"id":"u6","title":"列表算法：檢索、點算、最大最小、排序檢查、加入刪除","book":"教科書 D2 第 5 章 p.92–114、p.133–143（另有 p.155–156 課題練習）","key":"D2-u6-hmac-e223164a7f","theory":false,"sections":[{"id":"s1","title":"線性檢索：for 與 while","pages":"教科書 p.92–98","learn":[{"pts":["**線性檢索（linear search）**：由第一項開始，逐一檢查列表項目是否等於目標值。（p.92）","用 **for 循環**：先 `found = False`，找到便 `found = True`，最後輸出 found。偽代碼「設 i 由 0 至 N-1」→ Python `range(0, N)`。（p.92）","found 用**布爾**數據類型，因為結果只有「找到」或「找不到」。Python 必須寫 `True`／`False`（大楷 T、F）。（p.92 提示、試想想）","`input()` 取得的是**字串**；要找整數便要 `int(input())`。編號如 `\"002\"` 有前置零，所以用字串儲存，不可轉成整數。（p.92–93）","找出**第一個**目標值的索引：用 **while 循環**，條件 `i \u003c N and found == False`，找到便停止，不用再查下去（省時間）。找不到時 index 保持 **-1**。（p.94）","兩個「排位相通」的列表（例如 `contact_name` 與 `contact_no`）：在第一個列表找到索引 pos，用同一個 pos 讀取第二個列表。（p.96、p.98）"]},{"sim":{"code":"rank = [\"6012\", \"0122\", \"1122\", \"7201\", \"5402\"]\nrunner_num = input(\"Please input your number: \")\nindex = -1\ni = 0\nwhile i \u003c 5 and index == -1:\n    if runner_num == rank[i]:\n        index = i\n    i = i + 1\nif index != -1:\n    print(\"Congratulation! Your rank is\", index+1)\nelse:\n    print(\"Work hard next year.\")","inputs":"0122","open":["vars"],"step":true},"cap":"例題 5.3(b)（p.95）：找到便停止。排名 = 索引 + 1（因為索引由 0 開始）。"},{"warn":"**常見錯誤**：顯示排名時寫 `index` 而不是 `index+1`；或把 while 條件寫成 `i \u003c= 5`，找不到時會讀取 `rank[5]` → IndexError。"}],"tries":[{"id":"u6-s1-t1","pts":4,"src":"教科書 p.94 例題 5.3(a)","code":"rank = [\"6012\", \"0122\", \"1122\", \"7201\", \"5402\"]\nrunner_num = input(\"Please input your number: \")\nfound = False\ni = 0\nwhile i \u003c 5 and found == False:\n    if runner_num == rank[i]:\n        found = True\n    i = i + 1\nprint(i)","inputs":"1122","ask":{"var":"i"},"q":"先估：輸入 1122，最後輸出的 i 是多少？","options":["2","3","5","4"],"why":"1122 在索引 2；找到後 i 仍會加 1 變成 3，然後條件 found == False 不成立，離開循環。","_right":1,"_ans":"3"}],"practice":[{"id":"u6-s1-p1","type":"complete","pts":2,"src":"教科書 p.93 例題 5.2","label":"補完程式","q":"查看同學是否得到獎學金。會用多組數據測試。","template":"scholarship = [\"002\", \"134\", \"192\"]\napplication_num = input(\"Please input your number: \")\nfound = False\nfor i in range(［1］, ［2］):\n    if ［3］:\n        found = True\nif ［4］:\n    print(\"Congratulation!\")\nelse:\n    print(\"Sorry, you are not on the list.\")","ref":["0","3","application_num == scholarship[i]","found == True"],"tests":[{"inputs":"192"},{"inputs":"204"},{"inputs":"002"},{"inputs":"2"}],"hint":"三個項目，索引 0–2，所以 range(0, 3)。"},{"id":"u6-s1-p2","type":"mc","pts":1,"src":"教科書 p.93 想像","q":"假設用 `int(input())` 讀取用戶輸入的 `002`（即 `int(\"002\")`）。輸出是什麼？","code":"scholarship = [\"002\", \"134\", \"192\"]\nnum = int(\"002\")\nprint(num in scholarship)","options":["True","False","002","出現 ValueError"],"answer":1,"verify":true,"hint":"int(\"002\") 得 2（前置零消失），整數 2 不等於字串 \"002\"。所以編號要用字串。","_right":1},{"id":"u6-s1-p3","type":"complete","pts":2,"src":"教科書 p.98 測試站 5.3","label":"補完程式","q":"電話簿：輸入名字，顯示電話號碼。會用多組數據測試。","template":"contact_name = [\"Mary\", \"Peter\", \"Smith\", \"Yvonne\", \"Yee\"]\ncontact_no = [\"9319 1919\", \"9836 1234\", \"6456 3210\", \"2715 5432\", \"5432 9876\"]\nsearch_name = input(\"Search contact: \")\npos = -1\ni = 0\nwhile i \u003c 5 and ［1］:\n    if search_name == contact_name[i]:\n        ［2］\n    i = i + 1\nif ［3］:\n    print(\"The phone no of\", search_name, \"is\", ［4］)\nelse:\n    print(\"Not found in the contact list.\")","ref":["pos == -1","pos = i","pos != -1","contact_no[pos]"],"tests":[{"inputs":"Yvonne"},{"inputs":"Tony"},{"inputs":"Mary"},{"inputs":"Yee"}],"hint":"用 pos 同時做「旗標」和記錄位置：-1 代表未找到。"},{"id":"u6-s1-p4","type":"fill","pts":1,"src":"教科書 p.97 例題 5.3(d)","q":"7201 號之後是否緊接 5402 號？寫出輸出。","code":"rank = [\"6012\", \"0122\", \"1122\", \"7201\", \"5402\"]\nsearch_num1 = \"7201\"\nsearch_num2 = \"5402\"\npair = False\nfor i in range(0, 4):\n    if rank[i] == search_num1 and rank[i+1] == search_num2:\n        pair = True\nif pair == True:\n    print(\"This pair is found!\")\nelse:\n    print(\"This pair is not found!\")","blanks":[{"label":"輸出","ask":"out"}],"hint":"注意 range(0, 4)：用到 rank[i+1]，i 最大只可以是 3。","_ans":["This pair is found!"]}]},{"id":"s2","title":"點算項目","pages":"教科書 p.99–102","learn":[{"pts":["**點算**：`count = 0`，逐一檢查，符合條件便 `count = count + 1`。（p.99）","條件可以是「大於某數」「小於某數」「等於某值」，例如 100 分的人數、不及格人數。（p.99–100）","要列出**學號**而不是索引：學號 = 索引 + 1，即 `print(i+1)`。（p.100 例題 5.4(c)）","挑戰：**最長連勝**——遇到 \"W\" 便 `count + 1`，並和最高記錄比較；遇到 \"L\" 便把 count 歸零。（p.102 測試站 5.4 第 2 題）"]},{"sim":{"code":"mark = [87, 45, 79, 100, 50, 35, 90, 100, 60, 80]\npassing_mark = 50\nfail = 0\nfor i in range(0, 10):\n    if mark[i] \u003c passing_mark:\n        fail = fail + 1\n        print(i+1)\nprint(fail)","open":["vars"],"step":true},"cap":"例題 5.4(b)(c)（p.100）：數算並列出不及格同學的學號。50 分剛好及格，`\u003c` 不包括 50。"}],"tries":[{"id":"u6-s2-t1","pts":4,"src":"教科書 p.101 測試站 5.4 第 1(b) 題","code":"rank = [11, 20, 5, 2, 3, 1, 4, 6, 2, 5]\ntop3 = 0\nfor i in range(0, 10):\n    if rank[i] \u003c= 3:\n        top3 = top3 + 1\nprint(top3)","q":"先估：小美取得頭三名的次數是多少？","options":["3","4","5","2"],"why":"2、3、1、2 共 4 次。注意要用 `\u003c= 3`。","_right":1,"_ans":"4"}],"practice":[{"id":"u6-s2-p1","type":"complete","pts":2,"src":"教科書 p.100 例題 5.4(a)","label":"補完程式","q":"找出有多少位同學取得 100 分。","template":"mark = [87, 45, 79, 100, 50, 35, 90, 100, 60, 80]\nsearch_mark = 100\nfound = ［1］\nfor i in range(0, 10):\n    if ［2］:\n        found = ［3］\nprint(found)","ref":["0","mark[i] == search_mark","found + 1"],"tests":[{"inputs":""}],"hint":"這裏 found 是計數器（整數），不是布爾值。"},{"id":"u6-s2-p2","type":"mc","pts":1,"src":"教科書 p.100 例題 5.4(c)","tags":[{"t":"trap","why":"偽代碼「設 i 由 0 至 N-1」對應 Python `range(0, N)`；學生常寫成 range(0, N-1) 漏了最後一項，或照搬偽代碼由 1 開始。"}],"q":"要列印不及格同學的**學號**（mark[0] 是 1 號同學），空格應填什麼？","code":"for i in range(0, 10):\n    if mark[i] \u003c passing_mark:\n        print(〔空格〕)","options":["i","i+1","i-1","mark[i]"],"answer":1,"hint":"學號比索引大 1。","_right":1},{"id":"u6-s2-p3","type":"trace","pts":2,"src":"教科書 p.102 測試站 5.4 第 2 題（縮短數據）","q":"空運行最長連勝程式，完成追蹤表（每次循環一行）。","code":"winlose = [\"W\", \"L\", \"W\", \"W\", \"L\", \"W\"]\nwinstreak = 0\ncount = 0\nfor i in range(0, len(winlose)):\n    if winlose[i] == \"W\":\n        count = count + 1\n        if count > winstreak:\n            winstreak = count\n    if winlose[i] == \"L\":\n        count = 0\nprint(\"The longest winning streak is\", winstreak)","spec":{"mode":"iter","cols":["i","count","winstreak"],"out":true},"hint":"count 是「目前」連勝；winstreak 是「最高」連勝。","_trace":{"mode":"iter","cols":[{"key":"i","label":"i"},{"key":"count","label":"count"},{"key":"winstreak","label":"winstreak"},{"key":"__out","label":"輸出"}],"rows":[{"label":"循環前","line":4,"cells":[{"v":"","changed":false},{"v":"0","changed":true},{"v":"0","changed":true},{"v":"","changed":false}]},{"label":"第 1 次","line":4,"cells":[{"v":"0","changed":true},{"v":"1","changed":true},{"v":"1","changed":true},{"v":"","changed":false}]},{"label":"第 2 次","line":4,"cells":[{"v":"1","changed":true},{"v":"0","changed":true},{"v":"1","changed":false},{"v":"","changed":false}]},{"label":"第 3 次","line":4,"cells":[{"v":"2","changed":true},{"v":"1","changed":true},{"v":"1","changed":false},{"v":"","changed":false}]},{"label":"第 4 次","line":4,"cells":[{"v":"3","changed":true},{"v":"2","changed":true},{"v":"2","changed":true},{"v":"","changed":false}]},{"label":"第 5 次","line":4,"cells":[{"v":"4","changed":true},{"v":"0","changed":true},{"v":"2","changed":false},{"v":"","changed":false}]},{"label":"第 6 次","line":4,"cells":[{"v":"5","changed":true},{"v":"1","changed":true},{"v":"2","changed":false},{"v":"","changed":false}]}]}}]},{"id":"s3","title":"找出最大或最小的值","pages":"教科書 p.103–106","learn":[{"pts":["方法：用變量**暫存第一項** `largest = the_list[0]`，再由索引 **1** 開始逐一比較；發現較大的便更新。（p.103）","為什麼由 1 開始？第 0 項已經放進 largest，和自己比較沒有意義（由 0 開始也不會出錯，只是多比較一次）。","不要把 largest 設為 0：如果全部都是負數，答案便會錯。","同一個循環可以同時找最大和最小：寫兩個 `if`。（p.104 例題 5.5(a)）","要知道**是誰**：同時記下索引 `lowest_no = i`，最後輸出 `lowest_no+1`。（p.104 例題 5.5(b)）","可能有多人同分：先找出最高分，再用第二個循環列出所有 `mark[i] == highest_mark` 的人。（p.105 例題 5.5(c)）"]},{"sim":{"code":"mark = [87, 85, 79, 100, 50, 35, 90, 100, 60, 80]\nhighest_mark = mark[0]\nfor i in range(1, 10):\n    if mark[i] > highest_mark:\n        highest_mark = mark[i]\nprint(\"The following student(s) got the highest mark:\")\nfor i in range(0, 10):\n    if mark[i] == highest_mark:\n        print(i+1)","open":["vars"],"step":true},"cap":"例題 5.5(a)(c)（p.104–105）。書中 print 一行缺右括號，這裏已改正。"}],"tries":[{"id":"u6-s3-t1","pts":4,"src":"教科書 p.104 例題 5.5(b)","code":"mark = [87, 85, 79, 100, 50, 35, 90, 100, 60, 80]\nlowest_mark = mark[0]\nlowest_no = 0\nfor i in range(1,
