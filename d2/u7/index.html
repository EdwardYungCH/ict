1] == \" \":\n        ch = name[i]\n        if ch >= \"a\" and ch \u003c= \"z\":\n            ch = chr(ord(ch) - 32)\n        initials = initials + ch\nprint(initials)","tests":[{"inputs":"chan tai man"},{"inputs":"Peter Chan"},{"inputs":"a"},{"inputs":"Lee siu Ming"},{"inputs":"z y x"}],"rules":[{"mustNot":"upper(","msg":"請用 ord() 和 chr() 轉換大楷，不可用 upper()。"},{"mustNot":"split","msg":"請用循環逐個字符處理，不可用 split()。"},{"must":"chr(","msg":"要用 chr() 把 ASCII 轉回字符。"}],"hint":"一個字符是詞語的第一個字母，當它是索引 0，或前一個字符（`name[i-1]`）是空格。細楷轉大楷：`chr(ord(ch) - 32)`。","_exp":[{"out":"Name: chan tai man\nCTM\n","err":null},{"out":"Name: Peter Chan\nPC\n","err":null},{"out":"Name: a\nA\n","err":null},{"out":"Name: Lee siu Ming\nLSM\n","err":null},{"out":"Name: z y x\nZYX\n","err":null}],"_sample":"Name: chan tai man\nCTM\n"},{"id":"u7-w3","tier":"挑戰","pts":13,"title":"設立密碼","src":"仿教科書 p.129–131 測試站 5.10","q":"輸入密碼兩次。按以下次序檢查，只輸出**第一個**符合的訊息：\n1. 兩次不相同 → `Not match`\n2. 少於 8 個字符 → `Too short`\n3. 有空格 → `No space allowed`\n4. 沒有數字 → `Need a digit`\n5. 以上都沒有 → `OK`","starter":"password = input(\"Password: \")\npassword_2 = input(\"Again: \")\n","ref":"password = input(\"Password: \")\npassword_2 = input(\"Again: \")\nnospace = True\ndigit = False\nfor ch in password:\n    if ch == \" \":\n        nospace = False\n    if ch >= \"0\" and ch \u003c= \"9\":\n        digit = True\nif password != password_2:\n    print(\"Not match\")\nelif len(password) \u003c 8:\n    print(\"Too short\")\nelif nospace == False:\n    print(\"No space allowed\")\nelif digit == False:\n    print(\"Need a digit\")\nelse:\n    print(\"OK\")","tests":[{"inputs":"abc12345\nabc12345"},{"inputs":"abc12345\nabc1234"},{"inputs":"abc1234\nabc1234"},{"inputs":"abcdefg1\nabcdefg1"},{"inputs":"abc 12345\nabc 12345"},{"inputs":"abcdefgh\nabcdefgh"}],"hint":"先用一個循環找出「有沒有空格」和「有沒有數字」兩個旗標，然後用 if / elif / else 按次序輸出。8 個字符剛好合格（邊界值）。","_exp":[{"out":"Password: abc12345\nAgain: abc12345\nOK\n","err":null},{"out":"Password: abc12345\nAgain: abc1234 "（49）。","_right":3},{"id":"u7-q5","pts":4,"src":"自擬（考點：教科書 p.119–120 對稱字）","q":"以下程式的目的是什麼？","code":"s = input()\nt = \"\"\nfor i in range(len(s) - 1, -1, -1):\n    t = t + s[i]\nprint(t == s)","options":["檢查 s 是否全是細楷字母","檢查 s 是否對稱字（倒轉後與原本相同）","輸出 s 倒轉後的字串","點算 s 的字符數目"],"answer":"B","why":"循環由最後一個字符倒數到索引 0，t 是 s 倒轉後的字串；輸出的是 t == s 的結果（True／False），不是 t 本身。","_right":1}]},{"id":"more","kind":"endless","title":"無限練習","gens":["pyStr","pyAscii"],"intro":"隨機生成字串索引、切片、len、ord／chr 及字串比較題目，答案由 Python 計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]}, {"code":"D2","title":"D2 Python 自學平台","kicker":"HKDSE ICT · 必修 D2","pin":"d2ict2026"});
