而不出錯。（p.11）","Python 不用先宣告數據類型：賦值時，按數據自動為變量**標籤**數據類型。（p.12）","`type()` 函數傳回數據類型，例如 `print(type(12))` 輸出 `\u003cclass 'int'>`。（p.12）","同一個變量可以隨時改存另一種類型的數據。（p.12）","`12.0` 有小數點，是 float；`\"12\"` 有引號，是 str；`True` 第一個字母大寫、不加引號，`\"True\"` 是字串。","Python 把字符當作長度為 1 的字串（`\"k\"` 也是 str）。（p.11 提示）"]},{"sim":{"code":"length = 12\nprint(length)\nprint(type(length))\n\nlength = 12.0\nprint(length)\nprint(type(length))\n\nlength = \"The length is twelve\"\nprint(length)\nprint(type(length))","open":["vars"],"_run":{"out":"12\n\u003cclass 'int'>\n12.0\n\u003cclass 'float'>\nThe length is twelve\n\u003cclass 'str'>\n","err":null,"vrepr":{"length":"'The length is twelve'"},"files":{}}},"cap":"同一個變量 length 被標籤成三種數據類型（p.12）。"}],"tries":[{"id":"u1-s3-t1","pts":4,"src":"教科書 p.12","tags":[{"t":"trap","why":"有引號的是字串：「\"15\"」不是整數。"}],"code":"x = \"3.5\"\nprint(type(x))","q":"先估：輸出是什麼？","options":["\u003cclass 'str'>","\u003cclass 'float'>","\u003cclass 'int'>","3.5"],"why":"3.5 放在引號內，是字串。","_right":0,"_ans":"\u003cclass 'str'>","_run":{"out":"\u003cclass 'str'>\n","err":null,"vrepr":{"x":"'3.5'"},"files":{},"steps":[{"l":1,"v":{},"o":0},{"l":2,"v":{"x":"'3.5'"},"o":0}],"cut":false}}],"practice":[{"id":"u1-s3-p1","type":"fill","pts":3,"src":"教科書 p.11 表 4.1","q":"寫出每個變量的數據類型（int、float、bool 或 str）。","code":"a = 288\nb = -30.0\nc = \"1\"\nd = False","blanks":[{"label":"a","ask":{"expr":"type(a).__name__"}},{"label":"b","ask":{"expr":"type(b).__name__"}},{"label":"c","ask":{"expr":"type(c).__name__"}},{"label":"d","ask":{"expr":"type(d).__name__"}}],"hint":"看小數點和引號。","_ans":["int","float","str","bool"]},{"id":"u1-s3-p2","type":"mc","pts":1,"src":"教科書 p.11","q":"以下哪一個值是**浮點數（float）**？","options":["7","\"7.0\"","7.0","True"],"answer":2,"hint":"有小數點、沒有引號。","_right":2},{"id":"u1-s3-p3","type":"mc","pts":1,"src":"教科書 p.12","q":"以下程式的輸出是什麼？","code":"ok = \"False\"\nprint(type(ok))","options":["\u003cclass 'bool'>","\u003cclass 'str'>","False","\u003cclass 'int'>"],"answer":1,"verify":true,"hint":"留意引號。","_right":1},{"id":"u1-s3-p4","type":"mc","pts":1,"src":"教科書 p.11","q":"以下哪一句把布爾值「真」存入變量 passed？","options":["passed = true","passed = \"True\"","passed = True","passed = TRUE"],"answer":2,"hint":"第一個字母大寫，不加引號。","_right":2}]},{"id":"s4","title":"轉換數據類型與常數","pages":"教科書 p.13–15","learn":[{"table":{"head":["函數","目的","例子","結果"],"rows":[["int()","轉換成整數","int(\"12\")、int(12.1)","12、12"],["float()","轉換成浮點數","float(\"12\")、float(12)","12.0、12.0"],["str()","轉換成字串","str(12)、str(12.1)","\"12\"、\"12.1\""]]},"cap":"轉換數據類型（type casting）（p.13–14）"},{"pts":["`int()` 把浮點數的**小數部分捨去**：`int(12.1)` 是 12，`int(7.9)` 是 7（不是四捨五入）。教科書說「向下捨入」；負數時其實是向零截斷：`int(-2.8)` 是 -2。","`print()` 字串時不會顯示引號：`print(str(12))` 輸出 `12`，要用 `type()` 才看到是 str。（p.14）","字串和數字不可以直接用 `+` 連接：`\"Age: \" + 16` → **TypeError**；要寫 `\"Age: \" + str(16)`。","預告（p.24）：`input()` 取得的數據一定是**字串**，要計算便要用 `int()` 或 `float()` 轉換。"]},{"h":"活動 4.2：除錯（數據類型）（p.14–15）"},{"fix":{"bad":"length = \"12.1\"\nlength = int(length)","good":"length = \"12.1\"\nlength = float(length)\nlength = int(length)","why":"帶小數的字串不能直接轉換成整數（ValueError）；先轉換成浮點數，再轉換成整數。"}},{"pts":["例 2：`int(\"ten\")` → **ValueError**：字串內的文字不能轉換成數字。"]},{"h":"常數（p.15）"},{"pts":["有些值是固定的，例如 π = 3.14159。擁有固定數據的變量稱為**常數（constant）**。","Python 其實也把常數當作變量，可以隨時改變；所以約定俗成**以全大寫字母命名**，例如 `PI = 3.14159`，提醒程式員不應更改。"]},{"table":{"head":["錯誤類型","原因","例子"],"rows":[["SyntaxError","寫法不符合 Python 語法","print\"Hi\"、print(\"Hi\""],["NameError","名稱未定義","Print(\"Hi\")、未賦值便 print(mark)"],["ValueError","值的內容不能轉換","int(\"12.1\")、int(\"ten\")"],["TypeError","數據類型不能這樣運算","\"Age: \" + 16"]]},"cap":"本課見到的錯誤類型"},{"sim":{"code":"length = \"12.1\"\nprint(length)\nprint(type(length))\nlength = int(length)\nprint(length)\nprint(type(length))","open":["vars"],"_run":{"out":"12.1\n\u003cclass 'str'>\n","err":{"type":"ValueError","line":4,"msg":"invalid literal for int() with base 10: '12.1'","tb":[{"line":4,"fn":"\u003cmodule>"}]},"vrepr":{"length":"'12.1'"},"files":{}}},"cap":"活動 4.2 例 1（p.14）：按 ▶ 看錯誤信息，再按上面的方法改正 ar: \" 連接。","_exp":[{"out":"Name: Amy\nAge: 16\nHello, Amy\nNext year: 17\n","err":null},{"out":"Name: Chan Tai Man\nAge: 15\nHello, Chan Tai Man\nNext year: 16\n","err":null},{"out":"Name: Ben\nAge: 0\nHello, Ben\nNext year: 1\n","err":null},{"out":"Name: Grandma\nAge: 99\nHello, Grandma\nNext year: 100\n","err":null}],"_sample":"Name: Amy\nAge: 16\nHello, Amy\nNext year: 17\n"},{"id":"u1-w3","tier":"挑戰","title":"分數變身","pts":13,"src":"仿教科書 p.14 活動 4.2","q":"輸入一個帶小數的分數（例如 `87.6`）。輸出三行：\n1. 轉換成浮點數後的值，例如 `87.6`\n2. 用 `int()` 取得的整數部分，例如 `87`\n3. 整數部分後面加上「分」，例如 `87分`","prompt":"輸入一個帶小數的分數（例如 `87.6`）。輸出三行：\n1. 轉換成浮點數後的值，例如 `87.6`\n2. 用 `int()` 取得的整數部分，例如 `87`\n3. 整數部分後面加上「分」，例如 `87分`","starter":"s = input(\"Mark: \")\nprint(int(s))","ref":"s = input(\"Mark: \")\nmark = float(s)\nprint(mark)\nwhole = int(mark)\nprint(whole)\nprint(str(whole) + \"分\")","tests":[{"inputs":"87.6"},{"inputs":"100.0"},{"inputs":"0.5"},{"inputs":"59.99"},{"inputs":"-3.7"}],"rules":[{"must":"float(","msg":"要用 float() 先把字串轉換成浮點數"}],"hint":"`int(\"87.6\")` 會 ValueError（活動 4.2），要先 `float(s)`；`int()` 捨去小數部分，-3.7 變 -3。","_exp":[{"out":"Mark: 87.6\n87.6\n87\n87分\n","err":null},{"out":"Mark: 100.0\n100.0\n100\n100分\n","err":null},{"out":"Mark: 0.5\n0.5\n0\n0分\n","err":null},{"out":"Mark: 59.99\n59.99\n59\n59分\n","err":null},{"out":"Mark: -3.7\n-3.7\n-3\n-3分\n","err":null}],"_sample":"Mark: 87.6\n87.6\n87\n87分\n"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.9–15","items":[{"id":"u1-q1","pts":4,"src":"自擬（p.11 識別符）","q":"以下哪一個是 Python 中**有效**的變量名稱？","options":["my-score","if","_total2","3rd"],"answer":"C","why":"可以底線開頭；不可有「-」、不可是關鍵字、不可數字開頭。","_right":2},{"id":"u1-q2","pts":4,"src":"自擬（p.13–14 轉換數據類型）","tags":[{"t":"trap","why":"有引號的是字串：「\"15\"」不是整數。"}],"verify":true,"q":"以下程式的輸出是什麼？","code":"a = \"10\"\nb = int(a) + 5\nprint(str(b) + a)","options":["1510","25","15 10","TypeError"],"answer":"A","why":"b = 15；str(15) + \"10\" 是字串連接，得 \"1510\"。","_right":0},{"id":"u1-q3","pts":4,"src":"自擬（p.14 活動 4.2、p.24）","verify":true,"ask":{"error":true},"inputs":"3.5","q":"用戶輸入 `3.5`。執行以下程式會出現哪一種錯誤？","code":"num = int(input())\nprint(num * 2)","options":["SyntaxError","NameError","ValueError","沒有錯誤"],"answer":"C","why":"input() 得到字串 \"3.5\"，int() 不能直接轉換帶小數的字串。","_right":2},{"id":"u1-q4","pts":4,"src":"自擬（p.11–12 變量）","q":"關於 Python 的變量，以下哪些正確？\n(1) 變量名稱區分大小寫\n(2) 運用變量前必須先宣告它的數據類型\n(3) 同一個變量可以先後儲存不同數據類型的值","options":["只有 (1)","只有 (1) 和 (3)","只有 (2) 和 (3)","(1)、(2) 和 (3)"],"answer":"B","why":"Python 賦值時自動標籤數據類型，不用先宣告（要先宣告的是 C++）。","_right":1},{"id":"u1-q5","pts":4,"src":"自擬（p.12–14）","tags":[{"t":"trap","why":"int() 把浮點數的小數部分捨去（向零截斷），不是四捨五入：int(7.9) 是 7，int(-2.8) 是 -2。"}],"verify":true,"ask":{"expr":"type(x).__name__"},"q":"執行以下程式後，x 的數據類型是什麼？","code":"x = 9.99\nx = int(x)\nx = str(x)","options":["float","int","str","bool"],"answer":"C","why":"變量可以改存另一類型的值；最後一次賦值的是字串 \"9\"。","_right":2}]},{"id":"more","kind":"endless","title":"無限練習","gens":["pyCast","pyErr","pyPrint"],"intro":"隨機生成轉換數據類型、錯誤類型及 print 輸出題目，答案由 Python 計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]}, {"code":"D2","title":"D2 Python 自學平台","kicker":"HKDSE ICT · 必修 D2","pin":"d2ict2026"});
