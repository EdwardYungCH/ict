*，否則條件永遠成立，變成**無限循環**（邏輯錯誤）。","**for**：已知重複次數；**while**：重複次數未知，視乎條件（例如直至餘數小於除數）。"]},{"sim":{"code":"num = 17\nwhile num \u003c 100:\n    print(num)\n    num = num + 17","step":true,"open":["vars","trace"],"_run":{"out":"17\n34\n51\n68\n85\n","err":null,"vrepr":{"num":"102"},"files":{},"steps":[{"l":1,"v":{},"o":0},{"l":2,"v":{"num":"17"},"o":0},{"l":3,"v":{"num":"17"},"o":0},{"l":4,"v":{"num":"17"},"o":3},{"l":2,"v":{"num":"34"},"o":3},{"l":3,"v":{"num":"34"},"o":3},{"l":4,"v":{"num":"34"},"o":6},{"l":2,"v":{"num":"51"},"o":6},{"l":3,"v":{"num":"51"},"o":6},{"l":4,"v":{"num":"51"},"o":9},{"l":2,"v":{"num":"68"},"o":9},{"l":3,"v":{"num":"68"},"o":9},{"l":4,"v":{"num":"68"},"o":12},{"l":2,"v":{"num":"85"},"o":12},{"l":3,"v":{"num":"85"},"o":12},{"l":4,"v":{"num":"85"},"o":15},{"l":2,"v":{"num":"102"},"o":15}],"cut":false}},"cap":"p.57 例句。num 變成 102 時，102 \u003c 100 不成立，離開循環，所以 102 不會輸出。"},{"code":"t = int(input())\nd = int(input())\nr = t\nwhile r >= d:\n    r = r - d\nprint(r)","cap":"測試站 4.8 第 2 題（p.58）：不斷減去 d，直至不夠減。剩下的 r 就是 **t 除以 d 的餘數**；循環體執行的次數就是**商數**（被除數 = 商數 × 除數 + 餘數）。"},{"warn":"如果漏寫 `num = num + 17`，num 永遠是 17，程式會一直輸出 17，停不下來。在 Thonny 按「停止」可中止程式。"}],"tries":[{"id":"u4-s3-t1","pts":4,"src":"教科書 p.58 測試站 4.8 第 2(a) 題","code":"t = int(input())\nd = int(input())\nr = t\nwhile r >= d:\n    r = r - d\nprint(r)","inputs":"13\n5","q":"先估：輸入 13 和 5，最後輸出的 r 是多少？","options":["13\n5\n3","13\n5\n2","13\n5\n8","13\n5\n-2"],"why":"13 → 8 → 3；3 >= 5 不成立，離開循環。13 ÷ 5 = 2 餘 3。","_right":0,"_ans":"13\n5\n3","_run":{"out":"13\n5\n3\n","err":null,"vrepr":{"t":"13","d":"5","r":"3"},"files":{},"steps":[{"l":1,"v":{},"o":0},{"l":2,"v":{"t":"13"},"o":3},{"l":3,"v":{"t":"13","d":"5"},"o":5},{"l":4,"v":{"t":"13","d":"5","r":"13"},"o":5},{"l":5,"v":{"t":"13","d":"5","r":"13"},"o":5},{"l":4,"v":{"t":"13","d":"5","r":"8"},"o":5},{"l":5,"v":{"t":"13","d":"5","r":"8"},"o":5},{"l":4,"v":{"t":"13","d":"5","r":"3"},"o":5},{"l":6,"v":{"t":"13","d":"5","r":"3"},"o":5}],"cut":false}}],"practice":[{"id":"u4-s3-p1","type":"complete","pts":2,"src":"教科書 p.58 測試站 4.8 第 1 題","label":"補完程式","q":"輸入 X 和 Y，輸出 X 以內（包括 X）所有 Y 的倍數，每個一行。","template":"X = int(input())\nY = int(input())\nnum = Y\nwhile ［1］:\n    print(num)\n    ［2］","ref":["num \u003c= X","num = num + Y"],"tests":[{"inputs":"20\n3"},{"inputs":"12\n4"},{"inputs":"5\n7"},{"inputs":"10\n10"}],"hint":"「以內」包括 X，用 `\u003c=`；每次加 Y，否則會無限循環。","_exp":[{"out":"20\n3\n3\n6\n9\n12\n15\n18\n","err":null},{"out":"12\n4\n4\n8\n12\n","err":null},{"out":"5\n7\n","err":null},{"out":"10\n10\n10\n","err":null}]},{"id":"u4-s3-p2","type":"trace","pts":3,"src":"教科書 p.58 測試站 4.8 第 2 題","q":"輸入 t = 20、d = 6。完成追蹤表。","code":"t = int(input())\nd = int(input())\nr = t\nwhile r >= d:\n    r = r - d\nprint(r)","inputs":"20\n6","spec":{"mode":"stmt","cols":["t","d","r"],"out":true},"hint":"20 → 14 → 8 → 2；2 >= 6 不成立。","_trace":{"mode":"stmt","cols":[{"key":"t","label":"t"},{"key":"d","label":"d"},{"key":"r","label":"r"},{"key":"__out","label":"輸出"}],"rows":[{"label":"t = int(input())","line":1,"cells":[{"v":"20","changed":true},{"v":"","changed":false},{"v":"","changed":false},{"v":"","changed":false}]},{"label":"d = int(input())","line":2,"cells":[{"v":"20","changed":false},{"v":"6","changed":true},{"v":"","changed":false},{"v":"","changed":false}]},{"label":"r = t","line":3,"cells":[{"v":"20","changed":false},{"v":"6","changed":false},{"v":"20","changed":true},{"v":"","changed":false}]},{"label":"r = r - d","line":5,"cells":[{"v":"20","changed":false},{"v":"6","changed":false},{"v":"14","changed":true},{"v":"","changed":false}]},{"label":"r = r - d","line":5,"cells":[{"v":"20","changed":false},{"v":"6","changed":false},{"v":"8","changed":true},{"v":"","changed":false}]},{"label":"r = r - d","line":5,"cells":[{"v":"20","changed":false},{"v":"6","changed":false},{"v":"2","changed":true},{"v":"","changed":false}]},{"label":"print(r)","line":6,"cells":[{"v":"20","changed":false},{"v":"6","changed":false},{"v":"2","changed":false},{"v":"2","changed":true}]}]}},{"id":"u4-s3-p3","type":"mc","pts":2,"src":"教科書 p.58 測試站 4.8 第 2(b) 題","q":"上面這個程式（t、d、r）的目的是什麼？","options":["找出 t 除以 d 的餘數","找出 t 除以 d 的商數","找出 t 和 d 的差","找出 t 和 d 中較小的數"],"answer":0,"hint":"試想想 r 與 t 和 d 的關係：10 和 3 → 1；13 和 5 → 3。","why":"不斷減去 d，剩下不夠減的部分就是餘數，等於 `t % d`（t、d 是正整數時）。","_right":0}]},{"id":"s4","title":"前測與後測循環","pages":"教科書 p.59–60","learn":[{"pts":["**前測循環**：先檢查條件，成立才執行循環體——`for` 和 `while` 都是。循環體**可能一次也不執行**。（p.59）","**後測循環**：先執行循環體，再檢查條件，循環體**最少執行一次**——偽代碼的「執行…當」和「重複…直至」。（p.59）","**Python 沒有後測循環的語句**。做法：先在循環前執行一次循環體，再接一個 while 循環。（p.59 圖 4.3）","「重複…直至 條件」= 條件**不成立**便繼續，所以轉成 while 時要寫**相反**的條件：`直至 X > 0` → `while X \u003c= 0:`。"]},{"sim":{"code":"num = float(input())\nwhile num \u003c= 0:\n    num = float(input())\nprint(\"OK:\", num)","inputs":"-3\n0\n5","step":true,"open":["vars"],"_run":{"out":"-3\n0\n5\nOK: 5.0\n","err":null,"vrepr":{"num":"5.0"},"files":{},"steps":[{"l":1,"v":{},"o":0},{"l":2,"v":{"num":"-3.0"},"o":3},{"l":3,"v":{"num":"-3.0"},"o":3},{"l":2,"v":{"num":"0.0"},"o":5},{"l":3,"v":{"num":"0.0"},"o":5},{"l":2,"v":{"num":"5.0"},"o":7},{"l":4,"v":{"num":"5.0"},"o":7}],"cut":false}},"cap":"例題 4.5（p.60）：輸入錯誤（不是正數）便要求重新輸入，直至輸入正數。最後一行是加上去的，方便看結果。"},{"table":{"head":["","前測循環","後測循環"],"rows":[["何時檢查條件","執行循環體之前","執行循環體之後"],["循環體最少執行","0 次","1 次"],["例子","for、while","執行…當、重複…直至（Python 用 while 模擬）"]]},"cap":"前測與後測循環（p.59）"}],"tries":[{"id":"u4-s4-t1","pts":4,"src":"教科書 p.60 例題 4.5","code":"num = float(input())\nwhile num \u003c= 0:\n    num = float(input())\nprint(\"OK:\", num)","inputs":"-3\n0\n5","ask":{"count":3},"q":"先估：依次輸入 -3、0、5。第 3 行（循環體內的 input）執行了多少次？","options":["1","2","3","0"],"why":"第 1 行讀 -3；-3 \u003c= 0，第 3 行讀 0；0 \u003c= 0 仍成立，再讀 5；5 \u003c= 0 不成立。第 3 行共 2 次。注意 0 不是正數。","_right":1,"_ans":"2","_run":{"out":"-3\n0\n5\nOK: 5.0\n","err":null,"vrepr":{"num":"5.0"},"files":{},"steps":[{"l":1,"v":{},"o":0},{"l":2,"v":{"num":"-3.0"},"o":3},{"l":3,"v":{"num":"-3.0"},"o":3},{"l":2,"v":{"num":"0.0"},"o":5},{"l":3,"v":{"num":"0.0"},"o":5},{"l":2,"v":{"num":"5.0"},"o":7},{"l":4,"v":{"num":"5.0"},"o":7}],"cut":false}}],"practice":[{"id":"u4-s4-p1","type":"complete","pts":2,"src":"教科書 p.69 長題目第 3 題（改編）","label":"補完程式","q":"用 Python 改寫這個「執行…當」後測循環：`sum ← 0`、`i ← 0`、`執行`（`sum ← sum + 5`、`i ← i + 1`）`當 (i \u003c 5)`、`輸出 sum`。\n做法：先執行一次循環體，再用 while。","template":"total = 0\ni = 0\ntotal = total + 5\ni = i + 1\nwhile ［1］:\n    total = total + 5\n    ［2］\nprint(total)","ref":["i \u003c 5","i = i + 1"],"tests":[{"inputs":""}],"hint":"「執行…當」的條件成立便繼續，所以 while 用同一個條件。循環體要更新 i。（變量用 total，避免蓋過內置函數 sum()。）","_exp":[{"out":"25\n","err":null}]},{"id":"u4-s4-p2","type":"mc","pts":2,"src":"自擬（前測循環）","q":"以下程式的輸出是什麼？","code":"x = 10\nwhile x \u003c 5:\n    print(x)\n    x = x + 1\nprint(\"End\")","verify":true,"options":["End","10\nEnd","5\nEnd","（無限循環）"],"answer":0,"hint":"while 是前測循環：先檢查條件。","why":"一開始 10 \u003c 5 已不成立，循環體一次也不執行，只輸出 End。","_right":0}]},{"id":"write","kind":"write","title":"寫程式","pages":"教科書 p.55–60","intro":"在編輯器寫 Python，先按 ▶ 執行自己測試，再按「提交評核」。輸入：每次 input() 讀一行。這部分的 input() 不用提示文字。","tasks":[{"id":"u4-w1","tier":"必做","title":"乘數表","pts":10,"src":"自擬（for 循環，參考 p.55 測試站 4.7 第 2 題）","q":"輸入整數 `n`，用 **for 循環**輸出 n 的乘數表（1 至 9），每行格式：`n x i = 答案`。\n例如輸入 3，輸出 `3 x 1 = 3`、`3 x 2 = 6`……直至 `3 x 9 = 27`，共 9 行。","starter":"n = int(input())\n","ref":"n = int(input())\nfor i in range(1, 10):\n    print(n, \"x\", i, \"=\", n * i)","tests":[{"inputs":"3"},{"inputs":"1"},{"inputs":"12"},{"inputs":"0"},{"inputs":"-2"}],"rules":[{"must":"for","msg":"要用 for 循環"}],"hint":"`for i in range(1, 10):`（不包括 10），`print(n, \"x\", i, \"=\", n * i)`——逗號之間會自動加一個空格。","_exp":[{"out":"3\n3 x 1 = 3\n3 x 2 = 6\n3 x 3 = 9\n3 x 4 = 12\n3 x 5 = 15\n3 x 6 = 18\n3 x 7 = 21\n3 x 8 = 24\n3 x 9 = 27\n","err":null},{"out":"1\n1 x 1 = 1\n1 x 2 = 2\n1 x 3 = 3\n1 x 4 = 4\n1 x 5 = 5\n1 x 6 = 6\n1 x 7 = 7\n1 x 8 = 8\n1 x 9 = 9\n","err":null},{"out":"12\n12 x 1 = 12\n12 x 2 = 24\n12 x 3 = 36\n12 x 4 = 48\n12 x 5 = 60\n12 x 6 = 72\n12 x 7 = 84\n12 x 8 = 96\n12 x 9 = 108\n","err":null},{"out":"0\n0 x 1 = 0\n0 x 2 = 0\n0 x 3 = 0\n0 x 4 = 0\n0 x 5 = 0\n0 x 6 = 0\n0 x 7 = 0\n0 x 8 = 0\n0 x 9 = 0\n","err":null},{"out":"-2\n-2 x 1 = -2\n-2 x 2 = -4\n-2 x 3 = -6\n-2 x 4 = -8\n-2 x 5 = -10\n-2 x 6 = -12\n-2 x 7 = -14\n-2 x 8 = -16\n-2 x 9 = -18\n","err":null}],"_sample":"3\n3 x 1 = 3\n3 x 2 = 6\n3 x 3 = 9\n3 x 4 = 12\n3 x 5 = 15\n3 x 6 = 18\n3 x 7 = 21\n3 x 8 = 24\n3 x 9 = 27\n"},{"id":"u4-w2","tier":"必做","title":"用減法求商數和餘數","pts":12,"src":"教科書 p.58 測試站 4.8 第 2 題（延伸）","q":"輸入正整數 `t`（被除數）和 `d`（除數）。**不可用 `//` 和 `%`**，用 while 循環不斷減去 d，計算商數 `q` 和餘數 `r`。\n輸出兩行：第一行商數，第二行餘數。\n例如輸入 13、5，輸出 `2` 和 `3`。","starter":"t = int(input())\nd = int(input())\nr = t\nq = 0\n","ref":"t = int(input())\nd = int(input())\nr = t\nq = 0\nwhile r >= d:\n    r = r - d\n    q = q + 1\nprint(q)\nprint(r)","tests":[{"inputs":"13\n5"},{"inputs":"10\n3"},{"inputs":"2\n2"},{"inputs":"3\n7"},{"inputs":"20\n10"},{"inputs":"0\n4"}],"rules":[{"must":"while","msg":"要用 while 循環"},{"mustNot":"//","msg":"不可用 // 運算符"},{"mustNot":"%","msg":"不可用 % 運算符"}],"hint":"測試站 4.8 的程式已求出餘數 r；商數就是循環體執行的次數，在循環體內加一句 `q = q + 1`。","_exp":[{"out":"13\n5\n2\n3\n","err":null},{"out":"10\n3\n3\n1\n","err":null},{"out":"2\n2\n1\n0\n","err":null},{"out":"3\n7\n0\n3\n","err":null},{"out":"20\n10\n2\n0\n","err":null},{"out":"0\n4\n0\n0\n","err":null}],"_sample":"13\n5\n2\n3\n"},{"id":"u4-w3","tier":"進階","title":"有效輸入與數字和","pts":13,"src":"教科書 p.60 例題 4.5（延伸）","q":"輸入一個整數 `n`；如果不是正數（≤ 0），便要求重新輸入，直至輸入正數（例題 4.5 的做法）。\n然後用 while 循環計算 n 每個位的**數字和**並輸出。\n例如輸入 -5、0、1234，輸出 `10`（1 + 2 + 3 + 4）。\n提示：`n % 10` 是個位數字，`n // 10` 去掉個位。","starter":"n = int(input())\n","ref":"n = int(input())\nwhile n \u003c= 0:\n    n = int(input())\ntotal = 0\nwhile n > 0:\n    total = total + n % 10\n    n = n // 10\nprint(total)","tests":[{"inputs":"1234"},{"inputs":"-5\n0\n1234"},{"inputs":"100"},{"inputs":"-1\n99999"},{"inputs":"7"}],"rules":[{"must":"while","msg":"要用 while 循環"}],"hint":"第一個 while：`while n \u003c= 0:` 內再 `n = int(input())`。第二個 while：`while n > 0:` 內把 `n % 10` 加進 total，再 `n = n // 10`。","_exp":[{"out":"1234\n10\n","err":null},{"out":"-5\n0\n1234\n10\n","err":null},{"out":"100\n1\n","err":null},{"out":"-1\n99999\n45\n","err":null},{"out":"7\n7\n","err":null}],"_sample":"1234\n10\n"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.67–68","items":[{"id":"u4-q1","pts":3,"src":"教科書 p.67 課題練習 選擇題 7","tags":[{"t":"hot","why":"DSE 卷一每年都有空運行循環程式的題目（輸出／執行次數）"}],"verify":true,"q":"以下 Python 程式的輸出是什麼？","code":"for i in range(1, 5, 2):\n    print(\"A\")","options":["A\nA","AA","AAAAA","A\nA\nA"],"answer":"A","why":"`range(1, 5, 2)` 是 1, 3，共 2 次；print 每次換行，所以 A 分兩行。","_right":0},{"id":"u4-q2","pts":4,"src":"教科書 p.67 課題練習 選擇題 9","tags":[{"t":"hot","why":"DSE 卷一每年都有空運行循環程式的題目（輸出／執行次數）"},{"t":"trap","why":"> 與 >= 差一次；for 循環的 range 在開始時已決定，之後改 X 不影響次數"}],"q":"輸出結果是「AAAAA」。以下哪項最適合填入空格？","code":"X = 5\n______\n    print(\"A\", end=\"\")\n    X = X - 1","options":["for i in range(0, X, -1):","for i in range(1, X):","while (X > 0):","while (X >= 0):"],"answer":"C","why":"X 由 5 減到 1 共 5 次。A：由 0 遞減到 5，一次也不執行；B：1 至 4 只得 4 次；D：連 X = 0 也執行，共 6 次。","_right":2},{"id":"u4-q3","pts":3,"src":"教科書 p.68 課題練習 選擇題 10","tags":[{"t":"trap","why":"total 是浮點數，// 的結果也是浮點數"}],"q":"VIP 客戶消費 50 元得 1 分，往後每消費 10 元多得 1 分。以下哪項可以取代第 5 至第 7 行，計算出相同的積分？","code":"total = float(input())\npoints = 0\nif (total >= 50):\n    total = total - 40\n    while (total >= 10):\n        total = total - 10\n        points += 1\nprint(points)","options":["points = total % 10","points = total // 10","points = total - 10","points = total / 10"],"answer":"B","why":"「不斷減 10 並計次數」就是整數除法 `//`。注意：total 是浮點數，所以 B 得出的是 3.0 而原程式輸出 3——數值相同，但輸出格式不同（教科書沒有說明）。要完全一樣可寫 `points = int(total // 10)`。D 會得出 3.5 之類的小數。","_right":1},{"id":"u4-q4","pts":3,"src":"教科書 p.68 課題練習 選擇題 11","q":"下列哪個偽代碼可以代替以下 Python 程式？","code":"X = int(input(\"X: \"))\nwhile X \u003c= 0:\n    X = int(input(\"X:\"))","options":["執行 / 輸入 X / 當 X >= 0","執行 / 輸入 X / 當 X \u003c 0","重複 / 輸入 X / 直至 X \u003c 0","重複 / 輸入 X / 直至 X > 0"],"answer":"D","why":"程式先輸入一次，X \u003c= 0 便再輸入，即「直至 X > 0」。若用「執行…當」，條件應是 `當 X \u003c= 0`，A、B 都不對（B 漏了 0）。","_right":3},{"id":"u4-q5","pts":3,"src":"教科書 p.68 課題練習 選擇題 12","q":"以下程式計算首 X 個雙數的總和（2 + 4 + … + 2X）。以下哪項修改可以使程式計算出首 X 個單數的總和？","code":"X = int(input())\nsum = 0\nfor i in range(1, X+1):\n    sum = sum + 2 * i","options":["第 2 行改為 sum = 1","第 3 行改為 for i in range(1, X):","第 4 行改為 sum = sum + 2 * i - 1","第 4 行改為 sum = sum + i"],"answer":"C","why":"第 i 個單數是 2i − 1：1, 3, 5, …。A 只是多加 1；B 少了一個雙數；D 是 1 + 2 + … + X。","_right":2},{"id":"u4-q6","pts":4,"src":"自擬（DSE 式 range 遞減空運行）","tags":[{"t":"hot","why":"DSE 卷一每年都有空運行循環程式的題目（輸出／執行次數）"}],"verify":true,"q":"以下程式的輸出是什麼？","code":"count = 0\nfor i in range(10, 0, -3):\n    count = count + i\nprint(count)","options":["22","18","12","15"],"answer":"A","why":"`range(10, 0, -3)` 是 10, 7, 4, 1（不包括 0）；10 + 7 + 4 + 1 = 22。","_right":0}]},{"id":"more","kind":"endless","title":"無限練習","gens":["pyRange","pyFor","pyWhile"],"intro":"隨機生成 range() 成員／個數、for 循環累加及 while 循環輸出題，答案由電腦計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]}, {"code":"D2","title":"D2 Python 自學平台","kicker":"HKDSE ICT · 必修 D2","pin":"d2ict2026"});
