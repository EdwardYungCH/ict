<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>術語閃卡 | ICT 學習資源中心</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<header class="site-header">
  <h1>🗂 術語閃卡</h1>
  <p>點擊卡片翻轉查看定義，鞏固各課題重要詞彙</p>
</header>
<main>
  <a class="back-link" href="../index.html">← 返回主頁</a>

  <div class="quiz-progress" id="progress" style="text-align:center;"></div>

  <div class="flashcard-scene">
    <div class="flashcard" id="flashcard">
      <div class="flashcard-face front" id="front"></div>
      <div class="flashcard-face back" id="back"></div>
    </div>
  </div>

  <div class="flashcard-controls">
    <button class="btn secondary" id="prevBtn">← 上一張</button>
    <button class="btn secondary" id="shuffleBtn">🔀 隨機排序</button>
    <button class="btn" id="nextBtn">下一張 →</button>
  </div>

</main>
<footer class="site-footer">ICT 學習資源中心</footer>

<script src="../assets/js/flashcards-data.js"></script>
<script>
(function () {
  let cards = FLASHCARDS.slice();
  let index = 0;
  let flipped = false;

  const progressEl = document.getElementById("progress");
  const flashcardEl = document.getElementById("flashcard");
  const frontEl = document.getElementById("front");
  const backEl = document.getElementById("back");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const shuffleBtn = document.getElementById("shuffleBtn");

  function render() {
    flipped = false;
    flashcardEl.classList.remove("flipped");
    const card = cards[index];
    frontEl.textContent = card.term;
    backEl.textContent = card.definition;
    progressEl.textContent = `第 ${index + 1} / ${cards.length} 張`;
  }

  function flip() {
    flipped = !flipped;
    flashcardEl.classList.toggle("flipped", flipped);
  }

  function next() {
    index = (index + 1) % cards.length;
    render();
  }

  function prev() {
    index = (index - 1 + cards.length) % cards.length;
    render();
  }

  function shuffle() {
    for (let i = cards.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [cards[i], cards[j]] = [cards[j], cards[i]];
    }
    index = 0;
    render();
  }

  flashcardEl.addEventListener("click", flip);
  nextBtn.addEventListener("click", next);
  prevBtn.addEventListener("click", prev);
  shuffleBtn.addEventListener("click", shuffle);

  render();
})();
</script>
</body>
</html>
