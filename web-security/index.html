<!doctype html><html><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>網頁與保安練習室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --sunk:#E3E9E6; --ink:#17262A; --muted:#566A6E; --line:#C9D4D0;
  --accent:#0E7466; --accent-ink:#FFFFFF; --led:#E39B10; --led-ink:#1A1204;
  --hl:rgba(227,155,16,.18); --str:#9A4A06; --tg:#1F5FA8; --at:#7A3E9D;
  --good:#1F7A3A; --good-bg:#E3F3E7; --bad:#B3261E; --bad-bg:#FBE7E5;
  --pub:#D6ECF7; --pub-ink:#164A6B; --pub-line:#5C9CC4; --priv:#FBE6C4; --priv-ink:#6E4306; --priv-line:#D39A3A;
  --paper:#FFFFFF; --warn-bg:#FFF4D9; --warn-line:#E3B04B;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1618; --surface:#162226; --sunk:#1D2C31; --ink:#E2ECE9; --muted:#95A9AB; --line:#2C3E43;
    --accent:#35BFA9; --accent-ink:#0B1413; --led:#F4B23C; --led-ink:#1A1204;
    --hl:rgba(244,178,60,.16); --str:#F2B880; --tg:#8CC4F2; --at:#D7A8F0;
    --good:#5BD17E; --good-bg:#15301F; --bad:#FF8A80; --bad-bg:#3A1A18;
    --pub:#1E4157; --pub-ink:#CDE7F8; --pub-line:#4F8DB5; --priv:#4A3514; --priv-ink:#FBE0B2; --priv-line:#C08A2E;
    --paper:#FFFFFF; --warn-bg:#3A3018; --warn-line:#B88A2E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1618; --surface:#162226; --sunk:#1D2C31; --ink:#E2ECE9; --muted:#95A9AB; --line:#2C3E43;
  --accent:#35BFA9; --accent-ink:#0B1413; --led:#F4B23C; --led-ink:#1A1204;
  --hl:rgba(244,178,60,.16); --str:#F2B880; --tg:#8CC4F2; --at:#D7A8F0;
  --good:#5BD17E; --good-bg:#15301F; --bad:#FF8A80; --bad-bg:#3A1A18;
  --pub:#1E4157; --pub-ink:#CDE7F8; --pub-line:#4F8DB5; --priv:#4A3514; --priv-ink:#FBE0B2; --priv-line:#C08A2E;
  --paper:#FFFFFF; --warn-bg:#3A3018; --warn-line:#B88A2E; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;margin:0;overflow-x:hidden}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
.wrap>*,.card>*{min-width:0}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
h1{font-size:30px;font-weight:900;margin:0;letter-spacing:.02em;text-wrap:balance}
h1 .bits{display:inline-block;white-space:nowrap;font-family:var(--mono);font-weight:600;color:var(--accent);font-size:.7em;margin-left:.4em;letter-spacing:.04em}
.score{display:flex;gap:16px;font-variant-numeric:tabular-nums}
.score div{display:flex;flex-direction:column;align-items:flex-end}
.score b{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.1}
.score span{font-size:12px;color:var(--muted)}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav button{font:inherit;font-size:15px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
nav button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--led);outline-offset:2px}
.topic-note{font-size:14px;color:var(--muted);margin:-6px 0 0}
.warnbar{border:1px solid var(--warn-line);border-left-width:5px;background:var(--warn-bg);border-radius:10px;padding:10px 14px;font-size:14px;line-height:1.7}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.qtype{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--accent)}
.qno{font-family:var(--mono);font-size:12px;color:var(--muted)}
.qright{display:flex;align-items:center;gap:12px;margin-left:auto}
.hintbtn{font:inherit;font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid var(--led);background:transparent;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.hintbtn::before{content:"?";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--led);color:var(--led-ink);font-family:var(--mono);font-size:12px}
.hintbtn[aria-expanded="true"]{background:var(--led);color:var(--led-ink)}
.hintbtn[aria-expanded="true"]::before{background:var(--led-ink);color:var(--led)}
.hintbox{border:1px solid var(--led);border-left-width:4px;border-radius:10px;padding:12px 14px;background:var(--sunk);font-size:15px;line-height:1.7;display:flex;flex-direction:column;gap:6px}
.hintbox h4{margin:0;font-size:13px;letter-spacing:.06em;color:var(--muted)}
.hintbox ol,.hintbox ul{margin:0;padding-left:1.3em}
.hintbox p{margin:0}
.prompt{font-size:17px;line-height:1.7;display:flex;flex-direction:column;gap:10px;min-width:0}
.prompt p{margin:0}
.mono{font-family:var(--mono);font-weight:600;letter-spacing:.02em}
.small{font-size:14px;color:var(--muted)}
.scn{background:var(--sunk);border-radius:10px;padding:12px 14px;line-height:1.75}
.files{font-size:14px;color:var(--muted)}
.files{overflow-wrap:anywhere}
.files code{font-family:var(--mono);color:var(--ink);background:var(--sunk);border-radius:5px;padding:0 5px;white-space:nowrap}
code.k{font-family:var(--mono);font-size:.92em;background:var(--sunk);border-radius:5px;padding:0 5px}
/* 程式碼 */
.code{font-family:var(--mono);font-size:14px;line-height:1.65;background:var(--sunk);border-radius:10px;padding:10px 0;overflow-x:auto;max-width:100%}
.code .ln{display:flex;white-space:pre;padding-right:14px;min-width:fit-content}
.code .no{width:2.6em;flex:0 0 auto;text-align:right;padding-right:.9em;color:var(--muted);user-select:none;font-size:12px;opacity:.75;line-height:inherit}
.tg{color:var(--tg);font-weight:600}.at{color:var(--at)}.st{color:var(--str)}.cm{color:var(--muted);font-style:italic}
/* 作答 */
.answer-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.answer-row label,.flab{font-size:14px;color:var(--muted)}
input[type=text],input[type=number]{font-family:var(--mono);font-size:19px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:min(320px,100%)}
input.sm{font-size:17px;padding:6px 10px;width:6.5em;text-align:center}
input.ok{border-color:var(--good);background:var(--good-bg)}
input.no{border-color:var(--bad);background:var(--bad-bg)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px}
.choices.one{grid-template-columns:1fr}
.choice{font:inherit;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-width:0;line-height:1.55}
.choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.choice.pre{font-family:var(--mono);font-size:13px;white-space:pre;overflow-x:auto;line-height:1.5}
.choice.ok{border-color:var(--good);background:var(--good-bg)}
.choice.no{border-color:var(--bad);background:var(--bad-bg)}
.choices.wide{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.qpart{display:flex;flex-direction:column;gap:8px}
.qpart h3{margin:0;font-size:15px}
.btn{font:inherit;font-weight:700;padding:10px 18px;border-radius:10px;border:1px solid var(--accent);cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#btn-next{margin-left:auto}
#btn-next.skip{border-color:var(--line);color:var(--muted);font-weight:500}
#btn-next.confirm{border-color:var(--bad);color:var(--bad);font-weight:700}
.feedback{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.feedback.good{background:var(--good-bg)}
.feedback.bad{background:var(--bad-bg)}
.feedback .verdict{font-weight:700}
.feedback.good .verdict{color:var(--good)}
.feedback.bad .verdict{color:var(--bad)}
.feedback p{margin:0}
.feedback .code{background:var(--surface)}
.iolab{font-size:13px;color:var(--muted);margin:0 0 2px}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.steps li{line-height:1.65}
.why{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:3px;font-size:15px}
.tips{font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:14px}
.tips b{color:var(--ink)}
/* 篩選 */
.filter{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.filter summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:10px 14px;font-weight:700;font-size:15px}
.filter summary::-webkit-details-marker{display:none}
.filter summary::after{content:"▾";color:var(--muted);transition:transform .15s}
.filter[open] summary::after{transform:rotate(180deg)}
.fcount{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--muted);margin-left:auto}
.fcount.partial{color:var(--accent);font-weight:600}
.fbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.fact{display:flex;flex-wrap:wrap;gap:8px}
.fgroup{display:flex;flex-direction:column;gap:6px}
.fgroup h3{margin:0;font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;line-height:1.4;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sunk);border-color:var(--accent);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}
.chip[aria-pressed="true"]::before{content:"✓ ";color:var(--accent);font-weight:700}
.mini{font:inherit;font-size:13px;padding:4px 12px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.mini:disabled{opacity:.45;cursor:default}
.fhint{margin:0;font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:16px}
/* HTML 實驗枱 */
.lab{display:grid;grid-template-columns:1fr;gap:12px;min-width:0}
@media (min-width:760px){.lab{grid-template-columns:1fr 1fr}}
.ed-wrap{display:flex;flex-direction:column;gap:6px;min-width:0}
.ed-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
textarea.ed{display:block;font-family:var(--mono);font-size:14px;line-height:1.6;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-height:300px;resize:vertical;white-space:pre;overflow-x:auto;tab-size:4}
.pv{display:flex;flex-direction:column;min-width:0}
.pvbar{display:flex;align-items:center;gap:10px;background:var(--sunk);border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;padding:6px 10px;font-size:12px;color:var(--muted);min-height:31px}
.dots{display:inline-flex;gap:4px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.pv iframe,.ropt iframe,.shot iframe{display:block;width:100%;border:1px solid var(--line);background:var(--paper)}
.pv iframe{height:300px;border-radius:0 0 10px 10px}
.pvnote{margin:6px 0 0;font-size:12px;color:var(--muted);line-height:1.5}
.shot{max-width:100%}
.shot iframe{border-radius:10px}
/* 看代碼選顯示 */
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.ropt{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.ropt .lt{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--muted)}
.ropt iframe{pointer-events:none;border-radius:6px}
.ropt[aria-checked="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.ropt[aria-checked="true"] .lt{color:var(--accent)}
.ropt.ok{border-color:var(--good);background:var(--good-bg)}
.ropt.no{border-color:var(--bad);background:var(--bad-bg)}
/* 密碼匙 */
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:8px}
.kc{font:inherit;font-size:14px;line-height:1.35;display:flex;align-items:center;gap:8px;text-align:left;padding:9px 10px;border-radius:10px;cursor:grab;border:1px solid;min-width:0}
.kc.pub{background:var(--pub);color:var(--pub-ink);border-color:var(--pub-line)}
.kc.priv{background:var(--priv);color:var(--priv-ink);border-color:var(--priv-line)}
.kc[aria-pressed="true"]{box-shadow:0 0 0 3px var(--led)}
.kc.used{opacity:.5}
.kc svg{flex:0 0 auto}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.slot{font:inherit;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:left;padding:10px;border-radius:12px;border:2px dashed var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-height:88px}
.slot .sl{font-size:13px;font-weight:700;color:var(--muted)}
.slot .sv{font-size:14px;color:var(--muted)}
.slot.drag{border-color:var(--accent);background:var(--sunk)}
.slot .kc{cursor:pointer}
.slot.ok{border-style:solid;border-color:var(--good);background:var(--good-bg)}
.slot.no{border-style:solid;border-color:var(--bad);background:var(--bad-bg)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.flow b{color:var(--ink)}
/* 次序 */
.seq{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.seq li button{font:inherit;width:100%;text-align:left;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;border:1px solid var(--accent);background:var(--sunk);color:var(--ink);cursor:pointer;line-height:1.55}
.seq li button::before{counter-increment:s;content:counter(s);flex:0 0 auto;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--mono);font-weight:700;font-size:13px}
.seq .ph{font-size:14px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.seq li.ok button{border-color:var(--good);background:var(--good-bg)}
.seq li.no button{border-color:var(--bad);background:var(--bad-bg)}
.pool{display:flex;flex-direction:column;gap:6px}
.pool .choice:disabled{opacity:.4;cursor:default}
/* 能／不能、規則 */
.tg-rows{display:flex;flex-direction:column;gap:8px}
.tg-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;justify-content:space-between;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.tg-row .tx{flex:1 1 220px;min-width:0;line-height:1.55}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:0 0 auto}
.seg button{font:inherit;font-size:14px;padding:5px 14px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.tg-row.ok{border-color:var(--good);background:var(--good-bg)}
.tg-row.no{border-color:var(--bad);background:var(--bad-bg)}
.tg-row .rs{font-size:13px;color:var(--muted);flex-basis:100%}
.pwdbox{font-family:var(--mono);font-size:20px;font-weight:600;background:var(--sunk);border-radius:8px;padding:4px 12px;width:fit-content;max-width:100%;overflow-wrap:anywhere}
.prof{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px}
.prof b{font-family:var(--mono)}
/* 工具 */
.tool{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.tool h4{margin:0;font-size:15px}
.trow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.trow label{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tool textarea{font-family:var(--mono);font-size:16px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-height:3.2em;resize:vertical}
.out{font-family:var(--mono);font-size:16px;background:var(--sunk);border-radius:8px;padding:8px 12px;overflow-wrap:anywhere;min-height:2.4em;white-space:pre-wrap}
.stepper{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.stepper button{font:inherit;font-family:var(--mono);font-size:18px;font-weight:600;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.stepper b{font-family:var(--mono);font-size:18px;color:var(--ink);min-width:2ch;text-align:center}
.atab{overflow-x:auto;max-width:100%}
.atab table{border-collapse:collapse;font-family:var(--mono);font-size:13px}
.atab td,.atab th{border:1px solid var(--line);padding:2px 5px;text-align:center;min-width:1.7em}
.atab th{background:var(--sunk);font-weight:500;color:var(--muted);font-family:var(--sans);font-size:12px;white-space:nowrap}
.res{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;align-items:baseline}
.res dt{color:var(--muted);font-size:14px}
.res dd{margin:0;font-family:var(--mono);overflow-wrap:anywhere}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.rlist li{display:flex;gap:10px;align-items:baseline;line-height:1.55}
.rlist .mk{flex:0 0 auto;font-family:var(--mono);font-weight:700;width:1.4em;text-align:center}
.rlist .y{color:var(--good)}.rlist .n{color:var(--bad)}.rlist .z{color:var(--muted)}
.habits{margin:0;padding-left:1.2em;font-size:14px;color:var(--muted)}
.sci{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:15px;color:var(--muted)}
@media (max-width:480px){h1{font-size:24px}.prompt{font-size:16px}.card{padding:18px 14px 16px}.score{gap:12px}.score b{font-size:19px}textarea.ed{min-height:220px}.pv iframe{height:240px}}
@media (prefers-reduced-motion:reduce){.filter summary::after{transition:none}}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <span class="eyebrow">HKDSE ICT · 必修 C c / C d</span>
      <h1>網頁與保安練習室<span class="bits">&lt;html&gt;</span></h1>
    </div>

  const threatQ = (grp) => () => {
    const t = pick(THREATS.filter((x) => x.g === grp)), si = R(0, t.s.length - 1), N = pick(NAMES), scn = t.s[si](N);
    const others = THREATS.filter((x) => x !== t && !t.x.includes(x.n) && !x.x.includes(t.n));
    const same = shuffle(others.filter((x) => x.g === t.g)).slice(0, 2), names = shuffle([t.n, ...same.map((x) => x.n), ...shuffle(others.filter((x) => !same.includes(x))).slice(0, 3 - same.length).map((x) => x.n)]);
    const okM = t.noM ? null : (t.oks ? t.oks[si] : t.ok[0]), wr = t.noM ? [] : shuffle(t.w).slice(0, 3), mOpts = t.noM ? [] : shuffle([okM, ...wr.map((x) => x[0])]);
    let c1, c2;
    const ex = [`威脅：${t.n}。${t.why}`]; if (!t.noM) ex.push(`措施：${okM}。${t.ok[1]}`);
    return { prompt: `<div class="scn">${scn}</div>`, input: { kind: "custom" }, explain: ex,
      mount(area) { c1 = choiceBox(area, names, { label: "(a) 這是哪一種威脅？" }); if (!t.noM) c2 = choiceBox(area, mOpts, { one: true, label: "(b) " + (t.mq || MS) }); },
      value: () => { const a = c1.get(), b = t.noM ? "-" : c2.get(); return a && b ? [a, b] : null; },
      grade: (v) => { const ok = v[0] === t.n && (t.noM || v[1] === okM); return { ok, note: wr.length ? `<p class="iolab">其他措施為甚麼不合適</p><ul class="why">${wr.map((x) => `<li><b>${esc(x[0])}</b>：${esc(x[1])}</li>`).join("")}</ul>` : "" }; },
      fill(ok) { c1.set(ok ? t.n : names.find((x) => x !== t.n)); if (!t.noM) c2.set(ok ? okM : mOpts.find((x) => x !== okM)); },
      after(revealed, res) { c1.mark(t.n); if (!t.noM) c2.mark(okM); if (revealed && wr.length) $("feedback").insertAdjacentHTML("beforeend", `<p class="iolab">其他措施為甚麼不合適</p><ul class="why">${wr.map((x) => `<li><b>${esc(x[0])}</b>：${esc(x[1])}</li>`).join("")}</ul>`); } };

    { id: "key", name: "用哪一把密碼匙", note: "按情境把四把密碼匙放到「加密（簽署）」及「解密（核實）」格。可按密碼匙再按格子，或直接拖放。", tips: "<b>答題句式：</b>「小芬使用志强的公開密碼匙加密文件；志强使用自己的私人密碼匙解密文件。」每把密碼匙要寫明是<b>誰的</b>（DSE 乙部常考，每題 2 分）。" },
    { id: "threat", name: "威脅與對策", note: "讀情境，認出威脅的名稱，再選最合適的措施；另有勒索軟件「立即要做」的次序題，及「措施能做到甚麼」。", tips: "<b>提示：</b>措施要針對情境中的威脅。防火牆過濾數據包、阻止未經授權存取；防毒軟件以病毒識別碼找出惡意軟件；SSL／HTTPS 只加密傳送中的數據。" },
    { id: "calc", name: "加密計算", note: "凱撒密碼的加密及解密（教科書活動 6.1），以及密碼匙長度與最長破解時間（教科書例題 6.1）。", tips: "<b>提示：</b>最長破解時間 ＝ 2<sup>n</sup> ÷ 每秒嘗試次數（秒）；一年按 365 日（31,536,000 秒）計。下方有凱撒密碼工具及破解時間計算器。", ex: "工具：凱撒密碼及破解時間計算器", exOpen: true },
    { id: "pwd", name: "密碼檢查", note: "按 DSE 評卷參考的密碼規則逐條檢查。下方的密碼檢查器可自由試，但只可用虛構的密碼。", tips: "<b>提示：</b>題目已給的規則不能再寫；屏蔽密碼欄、限制登入次數、SSL、權標不是「密碼規則」（DSE 2017 乙5(c)(i)）。", ex: "密碼檢查器（只用虛構密碼）", exOpen: true },
  ];

  // =================== 狀態 ===================
  const S = { mode: "lab", q: null, entry: null, n: 0, answered: false, right: 0, total: 0, streak: 0, best: 0, on: {} };
  const hsh = location.hash.replace("#", ""); if (MODES.some((x) => x.id === hsh)) S.mode = hsh;
  MODES.forEach((m) => { S.on[m.id] = new Set(ENTRIES[m.id].map((e) => e.name)); });
  try { const saved = JSON.parse(localStorage.getItem("wslab-filter") || "{}");
    Object.keys(saved).forEach((id) => { if (!ENTRIES[id] || !Array.isArray(saved[id])) return; const names = new Set(ENTRIES[id].map((e) => e.name)); const keep = saved[id].filter((n) => names.has(n)); if (keep.length) S.on[id] = new Set(keep); }); } catch (e) {}
  const saveFilter = () => { try { const o = {}; Object.keys(S.on).forEach((id) => { o[id] = [...S.on[id]]; }); localStorage.setItem("wslab-filter", JSON.stringify(o)); } catch (e) {} };

  const nav = $("modes"); const built = {};
  MODES.forEach((m) => { const b = document.createElement("button"); b.type = "button"; b.textContent = m.name; b.dataset.id = m.id;
    b.addEventListener("click", () => { S.mode = m.id; try { history.replaceState(null, "", "#" + m.id); } catch (e) {} renderNav(); renderFilter(); next(); }); nav.appendChild(b); });
  function renderNav() { [...nav.children].forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.id === S.mode)));
    const m = MODES.find((x) => x.id === S.mode); $("mode-note").textContent = m.note; $("tips").innerHTML = m.tips; $("pwd-warn").hidden = S.mode !== "pwd";
    const ex = $("explorer"); ex.hidden = !m.ex;
    if (m.ex) { $("ex-title").textContent = m.ex; const body = $("explorer-body"); body.innerHTML = "";
      if (!built[m.id]) { built[m.id] = document.createElement("div"); built[m.id].className = "fbody"; built[m.id].style.padding = "0"; body.appendChild(built[m.id]); EXPLORERS[m.id](built[m.id]); } else body.appendChild(built[m.id]); ex.open = !!m.exOpen || ex.dataset.mode === m.id && ex.open; ex.dataset.mode = m.id; } }
  function renderCount() { const all = ENTRIES[S.mode].length, on = S.on[S.mode].size, el = $("fcount"); el.textContent = on === all ? `全部 ${all} 種題型` : `已選 ${on}／${all} 種`; el.classList.toggle("partial", on !== all); }
  function renderFilter() {
    const box = $("fchips"); box.innerHTML = ""; const list = ENTRIES[S.mode], groups = [];
    list.forEach((e) => { let g = groups.find((x) => x.name === e.group); if (!g) { g = { name: e.group, items: [] }; groups.push(g); } g.items.push(e); });
    groups.forEach((g) => { const wrap = document.createElement("div"); wrap.className = "fgroup";
      if (g.name) { const h = document.createElement("h3"); h.textContent = g.name; wrap.appendChild(h);
        if (groups.length > 1) { const only = document.createElement("button"); only.type = "button"; only.className = "mini"; only.textContent = `只練「${g.name}」`;
          only.addEventListener("click", () => { S.on[S.mode] = new Set(g.items.map((x) => x.name)); saveFilter(); renderFilter(); afterFilter(); }); h.appendChild(only); } }
      const chips = document.createElement("div"); chips.className = "chips";
      g.items.forEach((e) => { const c = document.createElement("button"); c.type = "button"; c.className = "chip"; c.textContent = e.name; c.setAttribute("aria-pressed", String(S.on[S.mode].has(e.name)));
        c.addEventListener("click", () => { const set = S.on[S.mode]; set.has(e.name) ? set.delete(e.name) : set.add(e.name); c.setAttribute("aria-pressed", String(set.has(e.name))); saveFilter(); renderCount(); afterFilter(); }); chips.appendChild(c); });
      wrap.appendChild(chips); box.appendChild(wrap); });
    renderCount(); }
  function afterFilter() { if (!S.on[S.mode].size) { showEmpty(); return; } if (!S.q || !S.entry || !S.on[S.mode].has(S.entry.name)) next(); }
  $("f-all").addEventListener("click", () => { S.on[S.mode] = new Set(ENTRIES[S.mode].map((e) => e.name)); saveFilter(); renderFilter(); afterFilter(); });
  $("f-none").addEventListener("click", () => { S.on[S.mode] = new Set(); saveFilter(); renderFilter(); afterFilter(); });
  function renderScore() { $("sc-right").textContent = S.right; $("sc-total").textContent = S.total; $("sc-streak").textContent = S.streak; $("sc-best").textContent = S.best; }
  function showEmpty() { S.q = null; S.entry = null; $("qtype").textContent = ""; $("qno").textContent = "";
    $("prompt").innerHTML = '<p class="empty">請在上方「題型篩選」選擇至少一種題型。</p>'; $("input-area").innerHTML = ""; $("feedback").hidden = true;
    $("btn-check").disabled = true; $("btn-show").disabled = true; $("btn-next").disabled = true; $("filter").open = true; $("btn-hint").hidden = true; $("hintbox").hidden = true; }

  function next() {
    const pool = ENTRIES[S.mode].filter((e) => S.on[S.mode].has(e.name)); if (!pool.length) { showEmpty(); return; }
    let e = pick(pool); if (pool.length > 1 && S.entry && e.name === S.entry.name) e = pick(pool.filter((x) => x.name !== S.entry.name));
    S.entry = e; S.q = e.fn(); S.n++; S.answered = false; $("btn-next").disabled = false;
    const q = S.q; $("qtype").textContent = (e.group ? e.group + " · " : "") + e.name; $("qno").textContent = `第 ${S.n} 題`;
    $("hintbox").innerHTML = q.hint || e.hint || ""; $("btn-hint").hidden = !$("hintbox").innerHTML; setHint(false); updNext();
    $("prompt").innerHTML = q.prompt; const area = $("input-area"); area.innerHTML = ""; $("feedback").hidden = true; $("btn-check").disabled = false; $("btn-show").disabled = false;
    if (q.input.kind === "text") {
      area.innerHTML = `<div class="answer-row"><label for="ans">你的答案</label><input id="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${q.input.ph || ""}"></div>`;
      $("ans").addEventListener("keydown", (ev) => { if (ev.key === "Enter") { ev.preventDefault(); S.answered ? next() : check(); } });
    } else q.mount(area);
  }
  function current() { const q = S.q; return q.input.kind === "text" ? $("ans").value : q.value(); }
  function finish(correct, revealed, res) {
    S.answered = true; $("btn-check").disabled = true; $("btn-show").disabled = true;
    if (!revealed) { S.total++; if (correct) { S.right++; S.streak++; if (S.streak > S.best) S.best = S.streak; } else S.streak = 0; } else S.streak = 0;
    renderScore(); const q = S.q;
    if (q.input.kind === "text") { $("ans").readOnly = true; if (!revealed) $("ans").classList.add(correct ? "ok" : "no"); }
    const fb = $("feedback"); fb.className = "feedback " + (correct ? "good" : "bad"); fb.hidden = false;
    const head = revealed ? "答案" : correct ? "答對了" : "未答對";
    fb.innerHTML = `<div class="verdict">${head}${q.show ? "：" + q.show : ""}</div>${res && res.note ? res.note : ""}${q.post && !correct ? q.post : ""}<ol class="steps">${q.explain.map((x) => `<li>${esc(x).replace(/&lt;(\/?su[bp])&gt;/g, "<$1>")}</li>`).join("")}</ol>`;
    if (q.after) q.after(revealed, res);
    updNext(); $("btn-next").focus({ preventScroll: true });
  }
  function warn(msg) { const fb = $("feedback"); fb.className = "feedback bad"; fb.hidden = false; fb.innerHTML = `<div class="verdict">${msg}</div>`; }
  function check() {
    if (S.answered || !S.q) return; const a = current(), q = S.q;
    if (a === null || a === undefined || (typeof a === "string" && a.trim() === "")) { warn("請先完成作答，或按「顯示答案」。"); return; }
    let ok, res = null;
    if (q.input.kind === "text") ok = q.cmp ? q.cmp(a) : a.trim() === q.answer;
    else { res = q.grade(a); ok = res.ok; }
    finish(ok, false, res);
  }
  function setHint(open) { $("hintbox").hidden = !open; $("btn-hint").setAttribute("aria-expanded", String(open)); }
  $("btn-hint").addEventListener("click", () => setHint($("hintbox").hidden));
  $("btn-check").addEventListener("click", check);
  $("btn-show").addEventListener("click", () => { if (!S.answered && S.q) finish(false, true, null); });
  let skipTimer = null;
  function updNext(confirming) { const b = $("btn-next"); clearTimeout(skipTimer); b.classList.remove("primary", "ghost", "skip", "confirm");
    if (S.answered) { b.classList.add("primary"); b.textContent = "下一題 →"; }
    else if (confirming) { b.classList.add("ghost", "confirm"); b.textContent = "再按一次確認跳過"; skipTimer = setTimeout(() => updNext(false), 3000); }
    else { b.classList.add("ghost", "skip"); b.textContent = "跳過此題"; } }
  $("btn-next").addEventListener("click", () => { if (S.answered || $("btn-next").classList.contains("confirm")) return next(); updNext(true); });

  // 測試用：以正確或錯誤答案填寫目前的題目（不會自動核對）
  window.__wslab = { fill(ok) { const q = S.q; if (!q || S.answered) return false; if (q.input.kind === "text") $("ans").value = ok ? q.answer : "999 wrong"; else q.fill(ok); return true; },
    only(name) { S.on[S.mode] = new Set([name]); renderFilter(); next(); }, entries: () => ENTRIES[S.mode].map((e) => e.name), mode: (m) => [...nav.children].find((b) => b.dataset.id === m).click(),
    docs: () => (S.q && S.q.docs ? S.q.docs() : null) };

  renderNav(); renderFilter(); renderScore(); next();
})();
</script>
