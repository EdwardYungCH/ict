[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;margin:0}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:18px}

.pill.aa{background:var(--aa)}.pill.ab{background:var(--ab)}.pill.ac{background:var(--ac)}

.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.stem{font-size:19px;line-height:1.7;font-weight:500}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;display:flex;gap:10px}
.opt b{font-family:var(--mono);color:var(--muted)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.exp{border-radius:10px;padding:12px 14px;background:var(--sunk);font-size:15px}
.exp strong.ok{color:var(--good)} .exp strong.no{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;padding:10px 18px;border-radius:10px;border:1px solid var(--accent);cursor:pointer;background:transparent;color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.summary h2{margin:0;font-size:22px}
.big{font-family:var(--mono);font-size:44px;font-weight:600;color:var(--accent);line-height:1}
.review{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.review li{border-left:4px solid var(--bad);padding:6px 12px;background:var(--bg);border-radius:0 8px 8px 0}
.review small{color:var(--muted)}
.flash{perspective:1200px}
.fc{position:relative;min-height:230px;border:0;padding:0;width:100%;background:transparent;cursor:pointer;font:inherit;color:inherit}
.face{position:absolute;inset:0;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;backface-visibility:hidden;transition:transform .45s}
.face.back{transform:rotateY(180deg);background:var(--sunk)}
.fc.flipped .front{transform:rotateY(180deg)} .fc.flipped .back{transform:rotateY(360deg)}
.term{font-size:34px;font-weight:900}
.en{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--accent)}
.def{font-size:17px;max-width:52ch}
.hint{font-size:13px;color:var(--muted)}
.fcnav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.note{font-size:14px;color:var(--muted)}
.note a{color:var(--accent)}
@media (max-width:480px){h1{font-size:24px}.stem{font-size:17px}.term{font-size:28px}}
@media (prefers-reduced-motion:reduce){.face,.bar i{transition:none}}
</style>

    ["aa", "從業員", "personnel", "使用及維護資訊系統的人，例如收銀員、系統管理員。"],
    ["aa", "數碼化", "digitisation", "把實物或模擬資料轉換成電腦可以處理的數碼數據。"],
    ["aa", "資訊時代", "Information Age", "資訊及通訊科技普及，資訊的產生、傳播及取得變得迅速和容易的時代。"],
    ["aa", "知識型社會", "knowledge-based society", "知識成為推動經濟及社會發展主要動力的社會。"],
    ["aa", "資訊素養", "information literacy", "有效地搜尋、評估、整理及合乎道德地使用資訊的能力。"],
    ["ab", "欄位", "field", "一項資料，例如「姓名」、「班別」。"],
    ["ab", "記錄", "record", "同一對象的所有欄位，例如一位學生的全部資料。"],
    ["ab", "檔案", "file", "同類記錄的集合，例如全校學生資料表。"],
    ["ab", "數據庫", "database", "多個相關檔案的集合。"],
    ["ab", "順序存取", "sequential access", "由頭開始逐一讀取直至找到所需記錄，例如磁帶。"],
    ["ab", "直接存取", "direct access", "直接跳到所需記錄，例如硬碟、SSD。"],
    ["ab", "有效性檢驗", "validation check", "檢查輸入的數據是否合理，例如範圍檢查、格式檢查。"],
    ["ab", "驗證", "verification", "檢查輸入的數據是否與原始資料相同，例如雙重輸入、校對。"],
    ["ab", "雙重輸入", "double entry", "把數據輸入兩次，由電腦比較兩次是否相同。"],
    ["ab", "檢查數位", "check digit", "由編號其他數字按規則計算、附在末端的數字，用來偵測輸入錯誤。"],
    ["ab", "奇偶檢驗", "parity check", "加一個檢驗位令 1 的總數為偶數或奇數，用來偵測傳送錯誤。"],
    ["ab", "換位錯誤", "transposition error", "把數字的次序對調，例如把 57 輸入為 75。"],
    ["ab", "無用輸入，無用輸出", "GIGO（garbage in, garbage out）", "輸入錯誤的數據，輸出的資訊也會錯誤。"],
    ["ac", "模擬數據", "analog data", "連續變化的數值，例如聲音、溫度。"],
    ["ac", "數碼數據", "digital data", "以不連續的 0 和 1 表示的數據。"],
    ["ac", "位元", "bit", "二進制的一個數位，0 或 1。"],
    ["ac", "字節", "byte", "8 個位元。1 KB ＝ 1024 字節。"],
    ["ac", "十六進制", "hexadecimal", "以 0–9 及 A–F 表示的數字系統；1 位十六進制等於 4 位元。"],
    ["ac", "二進制補碼", "two's complement", "表示負整數的方法：反轉所有位元再加 1。"],
    ["ac", "溢出誤差", "overflow error", "結果超出可表示的範圍，所得結果錯誤。"],
    ["ac", "字符集", "character set", "一組字符及其編碼，例如 ASCII、大五碼、統一碼。"],
    ["ac", "統一碼", "Unicode", "可表示世界上大部分語言字符的字符集，例如 UTF-8。"],
    ["ac", "解像度", "resolution", "圖像的像素數目（寬 × 高）。"],
    ["ac", "色深", "colour depth", "每個像素使用的位元數；8 位元可表示 256 種顏色。"],
    ["ac", "取樣率", "sampling rate", "每秒對聲音取樣的次數，例如 44,100 Hz。"],
    ["ac", "有損壓縮", "lossy compression", "刪去部分資料以縮小檔案，不能完全還原，例如 JPG、MP3。"],
    ["ac", "無損壓縮", "lossless compression", "解壓後與原檔完全相同，例如 PNG、ZIP。"],
  ];

  const S = { mode: "quiz", topic: "all", round: [], i: 0, score: 0, wrong: [], answered: false, cards: [], ci: 0 };
  try { const t = localStorage.getItem("clab-topic"); if (["all", "aa", "ab", "ac"].includes(t)) S.topic = t; } catch (e) {}
  if (location.hash === "#cards") S.mode = "cards";

  const chips = $("chips");
  [["all", "全部"], ["aa", "A a"], ["ab", "A b"], ["ac", "A c"]].forEach(([k, n]) => { const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = n; b.dataset.k = k;
    b.addEventListener("click", () => { S.topic = k; try { localStorage.setItem("clab-topic", k); } catch (e) {} renderChips(); S.mode === "quiz" ? newRound() : newDeck(); }); chips.appendChild(b); });
  const renderChips = () => [...chips.querySelectorAll(".chip")].forEach(b => b.setAttribute("aria-pressed", String(b.dataset.k === S.topic)));
  const pool = (arr) => arr.filter(x => S.topic === "all" || x[0] === S.topic);
  const pill = (t) => `<span class="pill ${t}">${TOP[t]}</span>`;
  const md = (s) => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");

  // ---------- quiz ----------
  function newRound() { S.round = shuffle(pool(Q)).slice(0, 10).map(q => ({ q, opts: shuffle([q[2], ...q[3]]) })); S.i = 0; S.score = 0; S.wrong = []; showQ(); }
  function showQ() {
    const el = $("quiz"); const n = S.round.length;
    if (S.i >= n) return summary();
    const { q, opts } = S.round[S.i]; S.answered = false;
    el.innerHTML = `<div class="qmeta">${pill(q[0])}<span class="progress">第 ${S.i + 1} ／ ${n} 題　答對 ${S.score}</span></div>
      <div class="bar"><i style="width:${S.i / n * 100}%"></i></div>
      <div class="stem">${md(q[1])}</div>
      <div class="opts">${opts.map((o, k) => `<button type="button" class="opt" data-o="${k}"><b>${"ABCD"[k]}</b><span>${o}</span></button>`).join("")}</div>
      <div id="exp"></div>`;
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => choose(+b.dataset.o)));
  }
  function choose(k) {
    if (S.answered) return; S.answered = true;
    const { q, opts } = S.round[S.i]; const ok = opts[k] === q[2];
    if (ok) S.score++; else S.wrong.push(q);
    $("quiz").querySelectorAll(".opt").forEach((b, j) => { b.disabled = true; if (opts[j] === q[2]) b.classList.add("right"); else if (j === k) b.classList.add("wrong"); });
    $("exp").innerHTML = `<div class="exp"><strong class="${ok ? "ok" : "no"}">${ok ? "答對了。" : `未答對。答案是「${q[2]}」。`}</strong> ${q[4]}</div>
      <div class="row" style="margin-top:12px"><button type="button" class="btn primary" id="go">${S.i + 1 >= S.round.length ? "查看結果" : "下一題 →"}</button></div>`;
    $("go").addEventListener("click", () => { S.i++; showQ(); }); $("go").focus({ preventScroll: true });
  }
  function summary() {
    const n = S.round.length;
    $("quiz").innerHTML = `<div class="summary" style="display:flex;flex-direction:column;gap:14px">
      <h2>本回合完成</h2><div><span class="big">${S.score}</span><span class="progress">　／ ${n} 題答對</span></div>
      ${S.wrong.length ? `<div>需要重溫的概念：</div><ul class="review">${S.wrong.map(q => `<li>${md(q[1])}<br><small>答案：${q[2]}　｜　${q[4]}</small></li>`).join("")}</ul>` : `<div>全部答對，可以試試其他範圍。</div>`}
      <div class="row"><button type="button" class="btn primary" id="again">再來一回合</button><button type="button" class="btn" id="tocards">溫習詞彙卡</button></div></div>`;
    $("again").addEventListener("click", newRound); $("tocards").addEventListener("click", () => setMode("cards"));
  }

  // ---------- flashcards ----------
  function newDeck() { S.cards = pool(F); S.ci = 0; showCard(); }
  function showCard() { const c = S.cards[S.ci]; $("fc").classList.remove("flipped");
    $("fc-pill").className = `pill ${c[0]}`; $("fc-pill").textContent = TOP[c[0]]; $("fc-term").textContent = c[1]; $("fc-en").textContent = c[2]; $("fc-def").textContent = c[3];
    $("fc-pos").textContent = `${S.ci + 1} ／ ${S.cards.length}`; }
  $("fc").addEventListener("click", () => $("fc").classList.toggle("flipped"));
  $("fc-next").addEventListener("click", () => { S.ci = (S.ci + 1) % S.cards.length; showCard(); });
  $("fc-prev").addEventListener("click", () => { S.ci = (S.ci - 1 + S.cards.length) % S.cards.length; showCard(); });
  $("fc-shuffle").addEventListener("click", () => { S.cards = shuffle(S.cards); S.ci = 0; showCard(); });
  document.addEventListener("keydown", (e) => { if (S.mode !== "cards") return;
    if (e.key === "ArrowRight") $("fc-next").click(); else if (e.key === "ArrowLeft") $("fc-prev").click();
    else if (e.key === " " && document.activeElement === document.body) { e.preventDefault(); $("fc").click(); } });

  function setMode(m) { S.mode = m; $("tab-quiz").setAttribute("aria-pressed", String(m === "quiz")); $("tab-cards").setAttribute("aria-pressed", String(m === "cards"));
    $("quiz").hidden = m !== "quiz"; $("cards").hidden = m !== "cards"; m === "quiz" ? newRound() : newDeck(); }
  $("tab-quiz").addEventListener("click", () => setMode("quiz"));
  $("tab-cards").addEventListener("click", () => setMode("cards"));
  renderChips(); setMode(S.mode);
})();
</script>
</body>
</html>
