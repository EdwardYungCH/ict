<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ICT 自學練習室</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
:root{--bg:#EEF2F0;--surface:#FFFFFF;--ink:#17262A;--muted:#566A6E;--line:#C9D4D0;--accent:#0E7466;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme: dark){:root{--bg:#0E1618;--surface:#162226;--ink:#E2ECE9;--muted:#95A9AB;--line:#2C3E43;--accent:#35BFA9;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:40px 48px;display:flex;flex-direction:column;gap:20px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
h1{font-size:32px;font-weight:900;margin:0}
p{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
a.tile{display:flex;flex-direction:column;gap:8px;padding:22px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none}
a.tile:hover,a.tile:focus-visible{border-color:var(--accent);outline:none}
.tile b{font-size:21px}
.tile code{font-family:var(--mono);color:var(--accent);font-size:14px}
.tile span{color:var(--muted);font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <div><div class="eyebrow">HKDSE ICT · 中四 · 必修 A a – A c</div><h1>ICT 自學練習室</h1></div>
  <p>兩個練習室的題目都是即時生成，可以重複練習。答完會顯示解說，成績只會保存在你自己的裝置上。</p>
  <div class="grid">
    <a class="tile" href="concept-lab.html"><code>概念</code><b>概念練習室</b><span>A a–A c 概念選擇題（每回合 10 題）及中英詞彙卡。</span></a>
    <a class="tile" href="bit-lab.html"><code>0100 0001</code><b>位元練習室</b><span>進制互換、二進制補碼、位元計算、字符編碼、奇偶檢驗及檢查數位。</span></a>
  </div>
</div>
</body>
</html>
