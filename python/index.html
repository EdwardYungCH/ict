<!doctype html><html><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Python 程式練習室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --sunk:#E3E9E6; --ink:#17262A; --muted:#566A6E; --line:#C9D4D0;
  --accent:#0E7466; --accent-ink:#FFFFFF; --led:#E39B10; --led-ink:#1A1204; --led-glow:rgba(227,155,16,.35);
  --hl:rgba(227,155,16,.18); --str:#9A4A06; --cur:#F6F1E4;
  --good:#1F7A3A; --good-bg:#E3F3E7; --bad:#B3261E; --bad-bg:#FBE7E5;
  --b1:#CFE6F5; --b1-ink:#164A6B; --b2:#DDEFD3; --b2-ink:#2C5A1B; --b3:#EADCF4; --b3-ink:#5A2C77;
  --bx:#F6D3CF; --bx-ink:#8A1F17; --hatch:rgba(179,38,30,.18);
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1618; --surface:#162226; --sunk:#1D2C31; --ink:#E2ECE9; --muted:#95A9AB; --line:#2C3E43;
    --accent:#35BFA9; --accent-ink:#0B1413; --led:#F4B23C; --led-ink:#1A1204; --led-glow:rgba(244,178,60,.35);
    --hl:rgba(244,178,60,.16); --str:#F2B880; --cur:#232B22;
    --good:#5BD17E; --good-bg:#15301F; --bad:#FF8A80; --bad-bg:#3A1A18;
    --b1:#24506B; --b1-ink:#CDE7F8; --b2:#2F5426; --b2-ink:#D2F0C4; --b3:#4B3266; --b3-ink:#EAD6F8;
    --bx:#4A2220; --bx-ink:#FFB4AC; --hatch:rgba(255,138,128,.2); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1618; --surface:#162226; --sunk:#1D2C31; --ink:#E2ECE9; --muted:#95A9AB; --line:#2C3E43;
  --accent:#35BFA9; --accent-ink:#0B1413; --led:#F4B23C; --led-ink:#1A1204; --led-glow:rgba(244,178,60,.35);
  --hl:rgba(244,178,60,.16); --str:#F2B880; --cur:#232B22;
  --good:#5BD17E; --good-bg:#15301F; --bad:#FF8A80; --bad-bg:#3A1A18;
  --b1:#24506B; --b1-ink:#CDE7F8; --b2:#2F5426; --b2-ink:#D2F0C4; --b3:#4B3266; --b3-ink:#EAD6F8;
  --bx:#4A2220; --bx-ink:#FFB4AC; --hatch:rgba(255,138,128,.2); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;margin:0}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
.wrap>*,.card>*{min-width:0}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
h1{font-size:30px;font-weight:900;margin:0;letter-spacing:.02em;text-wrap:balance}
h1 .bits{display:inline-block;white-space:nowrap;font-family:var(--mono);font-weight:600;color:var(--accent);font-size:.7em;margin-left:.4em;letter-spacing:.04em}
.score{display:flex;gap:16px;font-variant-numeric:tabular-nums}
.score div{display:flex;flex-direction:column;align-items:flex-end}
.score b{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.1}
.score span{font-size:12px;color:var(--muted)}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav button{font:inherit;font-size:15px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
nav button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--led);outline-offset:2px}
.topic-note{font-size:14px;color:var(--muted);margin:-6px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.qtype{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--accent)}
.qno{font-family:var(--mono);font-size:12px;color:var(--muted)}
.qright{display:flex;align-items:center;gap:12px;margin-left:auto}
.hintbtn{font:inherit;font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid var(--led);background:transparent;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.hintbtn::before{content:"?";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--led);color:var(--led-ink);font-family:var(--mono);font-size:12px}
.hintbtn[aria-expanded="true"]{background:var(--led);color:var(--led-ink)}
.hintbtn[aria-expanded="true"]::before{background:var(--led-ink);color:var(--led)}
.hintbox{border:1px solid var(--led);border-left-width:4px;border-radius:10px;padding:12px 14px;background:var(--sunk);font-size:15px;line-height:1.7;display:flex;flex-direction:column;gap:6px}
.hintbox h4{margin:0;font-size:13px;letter-spacing:.06em;color:var(--muted)}
.hintbox ol{margin:0;padding-left:1.3em}
.hintbox .ex{font-family:var(--mono);font-size:14px;background:var(--surface);border-radius:8px;padding:6px 10px;width:fit-content;max-width:100%;overflow-x:auto;white-space:pre}
.prompt{font-size:17px;line-height:1.7;display:flex;flex-direction:column;gap:10px;min-width:0}
.prompt p{margin:0}
.mono{font-family:var(--mono);font-weight:600;letter-spacing:.02em}
.small{font-size:14px;color:var(--muted)}
.scroll{overflow-x:auto;max-width:100%}
/* 程式碼 */
.code{font-family:var(--mono);font-size:15px;line-height:1.7;background:var(--sunk);border-radius:10px;padding:10px 0;overflow-x:auto;max-width:100%}
.code .ln{display:flex;white-space:pre;padding-right:14px;border-left:3px solid transparent;min-width:fit-content}
.code .no{width:2.6em;flex:0 0 auto;text-align:right;padding-right:.9em;color:var(--muted);user-select:none;font-size:12px;opacity:.75;line-height:inherit}
.code .ln.hl{background:var(--hl);border-left-color:var(--led)}
.code .kw{color:var(--accent);font-weight:600}
.code .st{color:var(--str)}
.code .cm{color:var(--muted);font-style:italic}
.io{font-family:var(--mono);font-size:15px;line-height:1.6;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;white-space:pre;overflow-x:auto;max-width:100%;margin:0}
.io .er{color:var(--bad);font-weight:600}
.io .muted{color:var(--muted);font-family:var(--sans);font-size:14px}
.iolab{font-size:13px;color:var(--muted);margin:0 0 4px}
.stdin{display:inline-block;font-family:var(--mono);font-weight:700;background:var(--sunk);border-radius:6px;padding:0 7px;margin:0 2px}
/* 作答 */
.answer-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.answer-row label,.flab{font-size:14px;color:var(--muted)}
input[type=text]{font-family:var(--mono);font-size:20px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:min(260px,100%)}
input.sm{font-size:17px;padding:6px 10px;width:5.5em;text-align:center}
textarea{display:block;font-family:var(--mono);font-size:17px;line-height:1.55;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-height:7.5em;resize:vertical;white-space:pre;overflow-x:auto}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.choice{font:inherit;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-width:0}
.choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.choice.pre{font-family:var(--mono);font-size:14px;white-space:pre;overflow-x:auto;line-height:1.5}
.choice.ok{border-color:var(--good);background:var(--good-bg)}
.choice.no{border-color:var(--bad);background:var(--bad-bg)}
.choices.wide{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.qpart{display:flex;flex-direction:column;gap:8px}
.qpart h3{margin:0;font-size:15px}
.btn{font:inherit;font-weight:700;padding:10px 18px;border-radius:10px;border:1px solid var(--accent);cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:6px 12px;font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#btn-next{margin-left:auto}
#btn-next.skip{border-color:var(--line);color:var(--muted);font-weight:500}
#btn-next.confirm{border-color:var(--bad);color:var(--bad);font-weight:700}
.feedback{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.feedback.good{background:var(--good-bg)}
.feedback.bad{background:var(--bad-bg)}
.feedback .verdict{font-weight:700}
.feedback.good .verdict{color:var(--good)}
.feedback.bad .verdict{color:var(--bad)}
.feedback .io{background:var(--surface)}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.steps li{line-height:1.6}
.cmp-out{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.diff .x{background:var(--bad-bg);color:var(--bad)}
.tips{font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:14px}
.tips b{color:var(--ink)}
/* 篩選 */
.filter{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.filter summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:10px 14px;font-weight:700;font-size:15px}
.filter summary::-webkit-details-marker{display:none}
.filter summary::after{content:"▾";color:var(--muted);transition:transform .15s}
.filter[open] summary::after{transform:rotate(180deg)}
.fcount{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--muted);margin-left:auto}
.fcount.partial{color:var(--accent);font-weight:600}
.fbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.fact{display:flex;flex-wrap:wrap;gap:8px}
.fgroup{display:flex;flex-direction:column;gap:6px}
.fgroup h3{margin:0;font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;line-height:1.4;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sunk);border-color:var(--accent);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}
.chip[aria-pressed="true"]::before{content:"✓ ";color:var(--accent);font-weight:700}
.mini{font:inherit;font-size:13px;padding:4px 12px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.fhint{margin:0;font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:16px}
/* range() 與索引 */
.rx{display:flex;flex-direction:column;gap:12px}
.rx-ctl{display:flex;flex-wrap:wrap;gap:8px 14px}
.stepper{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.stepper button{font:inherit;font-family:var(--mono);font-size:18px;font-weight:600;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.stepper button:disabled{opacity:.4;cursor:default}
.stepper b{font-family:var(--mono);font-size:18px;color:var(--ink);min-width:2ch;text-align:center}
.cells{display:flex;gap:4px;overflow-x:auto;max-width:100%;padding:16px 2px 4px}
.cellx{flex:0 0 auto;width:46px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.cellx .ix{font-family:var(--mono);font-size:12px;color:var(--muted)}
.cellx .vx{width:46px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:var(--mono);font-weight:600}
.cellx.ghost .vx{border-style:dashed;color:var(--muted);background:transparent;font-weight:400;font-size:12px}
.cellx.hit .vx{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cellx.err .vx{background:var(--bad-bg);border:2px solid var(--bad);color:var(--bad)}
.cellx .ord{position:absolute;top:-14px;font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:700}
.cellx.err .ord{color:var(--bad)}
.ivals{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.iv{font-family:var(--mono);font-weight:600;font-size:15px;padding:1px 9px;border-radius:999px;background:var(--sunk);color:var(--ink)}
.iv.err{background:var(--bad-bg);color:var(--bad)}
.iv.skip{opacity:.5;text-decoration:line-through}
.target{border-left:4px solid var(--accent);background:var(--sunk);border-radius:8px;padding:8px 12px}
/* 測試數據 */
.nlwrap{overflow-x:auto;max-width:100%;padding-bottom:4px}
.nl{position:relative;padding-top:30px}
.nl.stag{padding-top:44px}
.band{display:flex;height:30px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.band>*{border:0;padding:0;margin:0;font:inherit;display:grid;place-items:center;min-width:0;position:relative}
.band button{cursor:pointer}
.band button:hover{filter:brightness(.93)}
.band .k{border-left:1px solid var(--surface)}
.band .gap,.band .tail{font-size:12px;color:var(--muted)}
.br0{background:var(--b1);color:var(--b1-ink)}.br1{background:var(--b2);color:var(--b2-ink)}.br2{background:var(--b3);color:var(--b3-ink)}.br3{background:var(--b1);color:var(--b1-ink)}
.brx{background:repeating-linear-gradient(135deg,var(--bx) 0 6px,var(--hatch) 6px 10px);color:var(--bx-ink)}
.ticks{position:relative;height:20px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%);top:2px}
.ticks span.c{color:var(--ink);font-weight:700}
.marks{position:absolute;left:0;right:0;top:0;height:30px}
.nl.stag .marks{height:44px}
.mk.up{bottom:18px}
.mk{position:absolute;transform:translateX(-50%);bottom:4px;font-family:var(--mono);font-size:11px;font-weight:700;background:var(--led);color:var(--led-ink);border-radius:999px;padding:0 5px;white-space:nowrap}
.mk::after{content:"";position:absolute;left:50%;bottom:-6px;border:3px solid transparent;border-top-color:var(--led);transform:translateX(-50%)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
.tvt{width:100%;border-collapse:collapse;font-size:15px}
.tvt th,.tvt td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:middle}
.tvt th{font-size:12px;color:var(--muted);font-weight:500}
.tvt td.v{font-family:var(--mono);font-weight:700;font-size:17px;width:3.4em}
.tvt td.o{font-family:var(--mono);font-size:13px}
.tvt.pre .o{display:none}
@media (max-width:480px){.tg{font-size:13px;padding:2px 8px}.tvt td.v{font-size:16px;width:2.8em}}
.tvt td.r{width:1.6em;font-weight:700}
.tvt td.r.ok{color:var(--good)}.tvt td.r.no{color:var(--bad)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tg{font:inherit;font-size:14px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer}
.tg[aria-pressed="true"].n{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
.tg[aria-pressed="true"].e{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:700}
.tg[aria-pressed="true"].b{background:var(--hl);border-color:var(--led);color:var(--ink);font-weight:700}
.rm{font:inherit;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;padding:0 6px}
.cov{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px;font-size:14px}
.cov>div{background:var(--sunk);border-radius:10px;padding:8px 12px}
.cov h4{margin:0 0 4px;font-size:13px;color:var(--muted)}
.cov ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.cov .y{color:var(--good);font-weight:700}.cov .n{color:var(--bad);font-weight:700}
.addrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* 比較次數 */
.stp{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px}
.stp-ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.algs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.alg{display:flex;flex-direction:column;gap:6px;min-width:0}
.alg h4{margin:0;font-size:14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.alg .cnt{font-family:var(--mono);font-size:14px;color:var(--muted)}
.alg .cnt b{font-size:20px;color:var(--ink)}
.alg .msg{font-size:14px;min-height:3.2em;background:var(--sunk);border-radius:8px;padding:6px 10px}
.alg .code{font-size:14px}
.ptr1{color:var(--accent)}.ptr2{color:var(--led)}
.cellx .p{position:absolute;top:-15px;font-family:var(--mono);font-size:11px;font-weight:700;display:flex;gap:4px}
.cellx.p1 .vx{box-shadow:inset 0 0 0 2px var(--accent)}
.cellx.p2 .vx{box-shadow:inset 0 -4px 0 var(--led)}
.cellx.p1.p2 .vx{box-shadow:inset 0 0 0 2px var(--accent),inset 0 -5px 0 var(--led)}
.lockmsg{font-size:14px;color:var(--muted);margin:0}
table.bw{border-collapse:collapse;font-size:15px}
.bw th,.bw td{border:1px solid var(--line);padding:6px 10px;text-align:center}
.bw th{background:var(--sunk);font-weight:500;font-size:13px}
.bw input.ok{border-color:var(--good);background:var(--good-bg)}
.bw input.no{border-color:var(--bad);background:var(--bad-bg)}
input.sm.ok{border-color:var(--good);background:var(--good-bg)}
input.sm.no{border-color:var(--bad);background:var(--bad-bg)}
@media (max-width:480px){h1{font-size:24px}.prompt{font-size:16px}.card{padding:18px 14px 16px}.code{font-size:14px}.score{gap:12px}.score b{font-size:19px}textarea{font-size:16px}.cellx,.cellx .vx{width:40px}}
@media (prefers-reduced-motion:reduce){.filter summary::after{transition:none}}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <span class="eyebrow">HKDSE ICT · 必修 D c / D d</span>
      <h1>Python 程式練習室<span class="bits">print()</span></h1>
    </div>
    <div class="score" aria-live="polite">
      <div><b id="sc-right">0</b><span>答對</span></div>
      <div><b id="sc-total">0</b><span>已答</span></div>
      <div><b id="sc-streak">0</b><span>連續答對</span></div>
      <div><b id="sc-best">0</b><span>最佳紀錄</span></div>
    </div>

<script>
(() => {
/*GEN:BEGIN*/
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const coin = (p = 0.5) => Math.random() < p;
const J = (...a) => a.join("\n");
const pyS = (v) => (typeof v === "string" ? "'" + v + "'" : typeof v === "boolean" ? (v ? "True" : "False") : String(v));
const pyList = (a) => "[" + a.map(pyS).join(", ") + "]";
const srcList = (a) => "[" + a.map((v) => (typeof v === "string" ? '"' + v + '"' : String(v))).join(", ") + "]";
const pyF = (x) => (Number.isInteger(x) ? x + ".0" : String(x));
const pyB = (b) => (b ? "True" : "False");
const distinct = (n, a, b) => { const s = new Set(); while (s.size < n) s.add(R(a, b)); return [...s]; };
const rangeVals = (s, e, st = 1) => { const o = []; if (st > 0) for (let i = s; i < e; i += st) o.push(i); else if (st < 0) for (let i = s; i > e; i += st) o.push(i); return o; };
const rangeSrc = (s, e, st) => (st === 1 || st === undefined ? `range(${s}, ${e})` : `range(${s}, ${e}, ${st})`);
const NAMES = ["Amy", "Ben", "Chloe", "David", "Eric", "Fiona", "Gary", "Helen", "Ivan", "Jacky"];
const WORDS = ["PYTHON", "LAPTOP", "SCHOOL", "GARDEN", "ROCKET", "CAMERA", "WINDOW", "DRAGON", "ORANGE", "PLANET", "APPLE", "HELLO", "TIGER", "PIZZA", "CHAIR", "MOUSE"];

// =================== 1. 輸出預測：模板 ===================
// 每個模板傳回 { code, stdin（用家輸入，可無）, out（Python 實際輸出，逐字）, ex（解說） }
const OUT = [
  // ---- print 輸出 ----
  { g: "print 輸出", n: "print 的逗號", f: () => { const name = pick(NAMES), mark = R(40, 99), g = pick(["Hi", "Hello"]);
    return { code: J(`name = "${name}"`, `mark = ${mark}`, `print("${g}", name)`, `print("Your mark is", mark)`), out: `${g} ${name}\nYour mark is ${mark}\n`,
      ex: ["print() 內以逗號分隔的項目，輸出時之間自動加一個空格。", `第 3 行：${g} 與 name 的值 ${name} 之間有一個空格。`, "每個 print() 完成後自動換行，所以第 4 行的輸出在下一行。"] }; } },
  { g: "print 輸出", n: 'end="" 不換行', f: () => { const [a, b] = pick([["Hi", "Bye"], ["Good", "Night"], ["Tic", "Toe"], ["Ping", "Pong"]]), name = pick(NAMES);
    return { code: J(`name = "${name}"`, `print("${a}", end="")`, `print(name, end="")`, `print("${b}")`, `print("End")`), out: `${a}${name}${b}\nEnd\n`,
      ex: ['end="" 令 print() 完成後不換行，下一個 print() 的內容緊接在同一行，中間沒有空格。', `第 2 至 4 行的輸出合成一行：${a}${name}${b}`, '第 4 行沒有 end=""，完成後換行，所以 End 在下一行。'] }; } },
  { g: "print 輸出", n: "逗號與 end 混合", f: () => { const a = R(2, 9), b = R(2, 9);
    return { code: J(`a = ${a}`, `b = ${b}`, `print(a, b, end="")`, `print(a + b)`, `print("a + b =", a + b)`), out: `${a} ${b}${a + b}\na + b = ${a + b}\n`,
      ex: [`第 3 行：a、b 以逗號分隔，輸出「${a} ${b}」；end="" 令下一個 print() 接在同一行。`, `第 4 行輸出 ${a + b}，緊貼在 ${b} 後面（沒有空格），然後換行。`, `第 5 行：字串 "a + b =" 照印，逗號後自動加空格，再印出 ${a + b}。`] }; } },
  { g: "print 輸出", n: "字串合併 +", f: () => { const [f, l] = pick([["Tai", "Man"], ["Siu", "Ming"], ["Mei", "Ling"], ["Ka", "Yan"], ["Chi", "Keung"]]);
    return { code: J(`first = "${f}"`, `last = "${l}"`, `print(first + last)`, `print(first, last)`, `print(first + " " + last + "!")`), out: `${f}${l}\n${f} ${l}\n${f} ${l}!\n`,
      ex: ["+ 把兩個字串直接接起來，中間不會自動加空格：" + f + l + "。", "逗號分隔的項目之間會自動加一個空格：" + f + " " + l + "。", '第 5 行自己加入 " "（空格）及 "!"。'] }; } },
  // ---- 運算與變量 ----
  { g: "運算與變量", n: "// 與 %", f: () => { const b = R(2, 9), a = R(b * 2, 99);
    return { code: J(`a = ${a}`, `b = ${b}`, `print(a // b, a % b)`, `print(b // a, b % a)`), out: `${Math.floor(a / b)} ${a % b}\n0 ${b}\n`,
      ex: [`${a} ÷ ${b} ＝ ${Math.floor(a / b)} 餘 ${a % b}：// 是整數除法（商），% 是餘數（模數）。`, `${b} ÷ ${a}：因為 ${b} 小於 ${a}，商是 0，餘數是 ${b} 本身。`] }; } },
  { g: "運算與變量", n: "分鐘換算", f: () => { const t = R(61, 599), h = Math.floor(t / 60), m = t % 60;
    return { code: J(`total = ${t}`, "hours = total // 60", "minutes = total % 60", 'print(hours, "h", minutes, "min")'), out: `${h} h ${m} min\n`,
      ex: [`${t} // 60 ＝ ${h}（有多少個完整的 60 分鐘）`, `${t} % 60 ＝ ${m}（餘下的分鐘）`, "print() 的四個項目之間各加一個空格。"] }; } },
  { g: "運算與變量", n: "拆開數位", f: () => { const n = R(100, 999), a = Math.floor(n / 100), b = Math.floor(n / 10) % 10, c = n % 10;
    return { code: J(`n = ${n}`, "print(n // 100)", "print(n // 10 % 10)", "print(n % 10)"), out: `${a}\n${b}\n${c}\n`,
      ex: [`n // 100 ＝ ${a}（百位）`, `// 與 % 優先次序相同，由左至右計算：n // 10 ＝ ${Math.floor(n / 10)}，再 % 10 ＝ ${b}（十位）`, `n % 10 ＝ ${c}（個位）`] }; } },
  { g: "運算與變量", n: "/ 的結果是浮點數", f: () => { let a, b; if (coin(0.6)) { b = pick([2, 4, 8]); a = R(b + 1, 60); } else { b = pick([3, 5, 6]); a = b * R(2, 12); }
    return { code: J(`a = ${a}`, `b = ${b}`, "print(a / b)", "print(a // b)", "print(a % b)"), out: `${pyF(a / b)}\n${Math.floor(a / b)}\n${a % b}\n`,
      ex: [`a / b ＝ ${pyF(a / b)}：「/」的結果一定是浮點數${Number.isInteger(a / b) ? "，即使整除也會寫成 " + pyF(a / b) : ""}。`, `a // b ＝ ${Math.floor(a / b)}（整數除法，只取商）`, `a % b ＝ ${a % b}（餘數）`] }; } },
  { g: "運算與變量", n: "運算次序", f: () => { const a = R(2, 9), b = R(2, 9), c = R(2, 5);
    return { code: J(`a = ${a}`, `b = ${b}`, `c = ${c}`, "print(a + b * c)", "print((a + b) * c)", "print(c ** 2 - a)"), out: `${a + b * c}\n${(a + b) * c}\n${c * c - a}\n`,
      ex: [`先乘後加：${a} + ${b} × ${c} ＝ ${a} + ${b * c} ＝ ${a + b * c}`, `括號先計：(${a} + ${b}) × ${c} ＝ ${a + b} × ${c} ＝ ${(a + b) * c}`, `** 是乘冪，最先計算：${c} ** 2 ＝ ${c * c}，再減 ${a} ＝ ${c * c - a}`] }; } },
  { g: "運算與變量", n: "交換兩個變量", f: () => { const [x, y] = distinct(2, 1, 20);
    return { code: J(`x = ${x}`, `y = ${y}`, "temp = x", "x = y", "y = temp", "print(x, y)"), out: `${y} ${x}\n`,
      ex: [`temp = x：temp 是 ${x}`, `x = y：x 變成 ${y}`, `y = temp：y 變成 ${x}`, "temp 先保存 x 原本的值，交換時才不會遺失。"] }; } },
  { g: "運算與變量", n: "重新賦值", f: () => { const n0 = R(2, 9), m = R(2, 5), d = R(1, 9), v1 = n0 * m, v2 = v1 - d, v3 = v2 + v2;
    return { code: J(`n = ${n0}`, `n = n * ${m}`, `n = n - ${d}`, "n = n + n", "print(n)"), out: `${v3}\n`,
      ex: ["每一行先用 n 的舊值計算右邊，再把結果存回 n：", `n = ${n0} × ${m} ＝ ${v1}`, `n = ${v1} − ${d} ＝ ${v2}`, `n = ${v2} + ${v2} ＝ ${v3}`] }; } },
  // ---- 數據類型 ----
  { g: "數據類型", n: '字串 "4" + "5"', f: () => { const x = R(1, 9), y = R(1, 9), xy = Number(`${x}${y}`);
    return { code: J(`x = "${x}"`, `y = "${y}"`, "print(x + y)", "print(int(x) + int(y))", "print(int(x + y) + 1)"), out: `${x}${y}\n${x + y}\n${xy + 1}\n`,
      ex: [`x、y 是字串，x + y 是把字串接起來：「${x}${y}」。`, `int() 把字串轉換為整數，才可相加：${x} + ${y} ＝ ${x + y}`, `x + y 先得字串 "${x}${y}"，int() 轉為 ${xy}，再加 1 ＝ ${xy + 1}`] }; } },
  { g: "數據類型", n: "input() 傳回字串", f: () => { const a = R(10, 49), b = R(10, 49);
    return { code: J("a = input()", "b = input()", "print(a + b)", "print(int(a) + int(b))"), stdin: [String(a), String(b)], out: `${a}${b}\n${a + b}\n`,
      ex: ["input() 取得的一定是字串，所以 a + b 是把兩個字串接起來：" + a + b + "。", `轉換為整數後才是數學上的相加：${a} + ${b} ＝ ${a + b}`, "寫程式時要計算，記得 int(input()) 或 float(input())。"] }; } },
  { g: "數據類型", n: "int() 與 float()", f: () => { const w = R(1, 20), d = R(1, 9);
    return { code: J(`price = ${w}.${d}`, "whole = int(price)", "print(whole)", "print(whole * 2)", "print(float(whole))"), out: `${w}\n${w * 2}\n${w}.0\n`,
      ex: [`int(${w}.${d}) ＝ ${w}：把小數部分去掉（這裏是正數，即捨去小數）。`, `whole * 2 ＝ ${w * 2}（整數）`, `float(${w}) ＝ ${w}.0：轉為浮點數，輸出時有 .0`] }; } },
  { g: "數據類型", n: "type()", f: () => { const a = R(2, 20), b = R(2, 9), k = R(2, 9);
    const items = [
      [`${b * k} / ${b}`, "float", pyF(k), "「/」的結果一定是浮點數"], [`${a} // ${b}`, "int", String(Math.floor(a / b)), "「//」兩個整數相除，結果是整數"],
      [`"${a}"`, "str", String(a), "有引號，是字串；print() 輸出時不會印出引號"], [`${a} > ${b}`, "bool", pyB(a > b), "比較的結果是布爾值 True 或 False"],
      [`float(${a})`, "float", a + ".0", "float() 轉為浮點數"], [`str(${a}) + str(${b})`, "str", `${a}${b}`, "str() 轉為字串，+ 把字串接起來"],
      [`int("${a}") + ${b}`, "int", String(a + b), 'int("' + a + '") 轉為整數後才相加']];
    const [e, t, v, why] = pick(items);
    return { code: J(`x = ${e}`, "print(type(x))", "print(x)"), out: `<class '${t}'>\n${v}\n`, ex: [`${why}：x 的數據類型是 ${t}，值是 ${v}。`, `type() 的輸出格式是 <class '${t}'>。`] }; } },
  { g: "數據類型", n: "str() 與字串合併", f: () => { const age = R(10, 18);
    return { code: J(`age = ${age}`, 'print("I am " + str(age) + " years old")', 'print("Next year:", age + 1)', "print(str(age) + str(1))"), out: `I am ${age} years old\nNext year: ${age + 1}\n${age}1\n`,
      ex: ["字串與整數不可直接用 + 合併，要先用 str() 轉為字串；字串內已有空格，所以輸出有空格。", `用逗號時毋須轉換：age + 1 ＝ ${age + 1}，前面自動加一個空格。`, `str(${age}) + str(1) 是把字串接起來：${age}1`] }; } },
  { g: "數據類型", n: "float(input())", f: () => { const k = R(1, 9), w = R(2, 9), L = k + 0.5;
    return { code: J("length = float(input())", "width = int(input())", "print(length * width)", "print(width / 2)"), stdin: [`${k}.5`, String(w)], out: `${pyF(L * w)}\n${pyF(w / 2)}\n`,
      ex: [`length 是浮點數 ${k}.5，浮點數 × 整數 ＝ 浮點數：${k}.5 × ${w} ＝ ${pyF(L * w)}`, `width / 2 ＝ ${pyF(w / 2)}（「/」的結果一定是浮點數）`] }; } },
  // ---- 選擇 ----
  { g: "選擇", n: "if-elif-else", f: () => { const hi = pick([70, 75, 80]), lo = pick([45, 50, 55]), m = pick([hi - 1, hi, hi + 1, lo - 1, lo, lo + 1, R(0, 100)]);
    const g = m >= hi ? "A" : m >= lo ? "B" : "C";
    return { code: J(`mark = ${m}`, `if mark >= ${hi}:`, '    print("A")', `elif mark >= ${lo}:`, '    print("B")', "else:", '    print("C")', 'print("End")'), out: `${g}\nEnd\n`,
      ex: [`mark >= ${hi}？${pyB(m >= hi)}` + (m >= hi ? " → 輸出 A，其餘分支不再檢查" : ""), ...(m >= hi ? [] : [`mark >= ${lo}？${pyB(m >= lo)}` + (m >= lo ? " → 輸出 B" : " → 執行 else，輸出 C")]), "最後一行不在 if 結構內（沒有縮排），一定執行：End"] }; } },
  { g: "選擇", n: "and、or、not", f: () => { const v = R(0, 2);
    if (v === 0) { const age = R(9, 15), h = R(130, 150), ok = age >= 12 && h >= 140;
      return { code: J(`age = ${age}`, `height = ${h}`, "if age >= 12 and height >= 140:", '    print("Ride OK")', "else:", '    print("Not allowed")'), out: (ok ? "Ride OK" : "Not allowed") + "\n",
        ex: [`age >= 12：${pyB(age >= 12)}；height >= 140：${pyB(h >= 140)}`, `and 要兩個條件都是 True，結果才是 True → ${pyB(ok)}`] }; }
    if (v === 1) { const age = pick([R(5, 11), R(12, 64), R(65, 80), 11, 12, 64, 65]), ok = age < 12 || age >= 65;
      return { code: J(`age = ${age}`, "if age < 12 or age >= 65:", '    print("Discount")', "else:", '    print("Full price")'), out: (ok ? "Discount" : "Full price") + "\n",
        ex: [`age < 12：${pyB(age < 12)}；age >= 65：${pyB(age >= 65)}`, `or 只要其中一個條件是 True，結果便是 True → ${pyB(ok)}`] }; }
    const mem = coin(), n = R(2, 9), price = n * 10, pay = mem ? price - 5 : price;
    return { code: J(`member = ${pyB(mem)}`, `price = ${price}`, "if not member:", '    print("Please join us")', "else:", "    price = price - 5", "print(price)"), out: (mem ? "" : "Please join us\n") + `${pay}\n`,
      ex: [`member 是 ${pyB(mem)}，not member 是 ${pyB(!mem)}。`, mem ? "條件不成立，執行 else：price 減 5 ＝ " + pay : "條件成立，輸出 Please join us；price 不變", "最後一行沒有縮排，一定執行：輸出 " + pay] }; } },
  { g: "選擇", n: "以 % 判斷", f: () => { const n = R(10, 60), d = pick([2, 3, 5]), r = n % d;
    return { code: J(`n = ${n}`, `if n % ${d} == 0:`, `    print(n, "is a multiple of ${d}")`, "else:", `    print(n, "remainder", n % ${d})`), out: r === 0 ? `${n} is a multiple of ${d}\n` : `${n} remainder ${r}\n`,

  { g: "選擇", n: "多個 if 與 if-elif", f: () => { const x = R(0, 9), kw = pick(["if", "elif"]); const outs = [];
    if (kw === "if") { if (x > 6) outs.push("A"); if (x > 3) outs.push("B"); if (x > 0) outs.push("C"); } else { if (x > 6) outs.push("A"); else if (x > 3) outs.push("B"); else if (x > 0) outs.push("C"); }

        `x > 6：${pyB(x > 6)}；x > 3：${pyB(x > 3)}；x > 0：${pyB(x > 0)}`, "最後的 print 沒有縮排，一定執行。"] }; } },
  { g: "選擇", n: "嵌套 if", f: () => { const a = R(1, 9), b = coin(0.3) ? a : R(1, 9); const o = a > b ? "a is larger" : a === b ? "same" : "b is larger";
    return { code: J(`a = ${a}`, `b = ${b}`, "if a > b:", '    print("a is larger")', "else:", "    if a == b:", '        print("same")', "    else:", '        print("b is larger")', "print(a + b)"), out: `${o}\n${a + b}\n`,

  // ---- 循環 ----
  { g: "循環", n: 'range() 與 end=" "', f: () => { const a = R(0, 5), b = a + R(2, 6), v = rangeVals(a, b);
    return { code: J(`for i in range(${a}, ${b}):`, '    print(i, end=" ")', 'print("End")'), out: v.map((x) => x + " ").join("") + "End\n",

  { g: "循環", n: "range() 的遞增量", f: () => { const a = R(0, 5), s = R(2, 4), b = a + s * R(2, 4) + R(0, s - 1), v = rangeVals(a, b, s);
    return { code: J(`for i in range(${a}, ${b}, ${s}):`, "    print(i)"), out: v.join("\n") + "\n",

// =================== 2. range() 與索引 ===================

      ["由最後一項倒序輸出至第一項", rangeVals(n - 1, -1, -1), [n - 1, -1, -1]],
      ["只輸出索引是雙數（0、2、4…）的項目", rangeVals(0, n, 2), [0, n, 2]],
      ["只輸出索引是單數（1、3、5…）的項目", rangeVals(1, n, 2), [1, n, 2]],
      [`由索引 ${b} 倒序輸出至索引 ${a - 1}`, rangeVals(b, a - 2, -1), [b, a - 2, -1]],
      ["只輸出最後三項", rangeVals(n - 3, n), [n - 3, n, 1]]]);
    return { list, text: T[0], seq: T[1], canon: T[2] }; },
  count: () => { const k = R(0, 9); let s, e, st;
    if (k < 4) { st = 1; s = R(0, 6); e = s + R(1, 7); } else if (k < 7) { st = R(2, 4); s = R(0, 5); e = s + R(3, 12); } else if (k < 9) { st = -R(1, 3); s = R(5, 12); e = s - R(2, 10); } else { st = pick([1, -1]); s = R(3, 8); e = st > 0 ? s - R(0, 3) : s + R(0, 3); }

  crash: () => { const n = R(4, 6), list = mkList(n);

// 一個值的類別是否正確：邊界必須判斷正確；分界值兩邊及其他值要分正常／錯誤；分界值本身（條件中的數）可只標「邊界」
const tagOK = (sc, v, t) => { const valid = sc.valid(v), bd = sc.isB(v);
  if (t.n && t.e) return false; if (!!t.b !== bd) return false;
  if (sc.consts.includes(v)) return !(t.n && !valid) && !(t.e && valid);
  return valid ? !!t.n && !t.e : !!t.e && !t.n; };
const needTags = (sc, v) => { const valid = sc.valid(v), bd = sc.isB(v); const a = [];
  if (!(bd && sc.consts.includes(v))) a.push(valid ? "正常" : "錯誤"); if (bd) a.push("邊界"); return a; };
const reps = (sc) => { const K = sc.keys, out = [K[0] - 10]; for (let i = 0; i + 1 < K.length; i++) if (K[i + 1] - K[i] > 1) out.push(Math.round((K[i] + K[i + 1]) / 2)); out.push(K[K.length - 1] + 10); return out; };

    { id: "out", name: "輸出預測", note: "讀程式，寫出輸出：print 的逗號與 end=\"\"、// 與 %、數據類型轉換、選擇、循環、列表及字串。", tips: "<b>提示：</b>每行輸出寫一行；行末的空格不影響判分，但項目之間的空格要準確。逗號會自動加空格，+ 不會。" },
    { id: "rng", name: "range() 與索引", note: "調整 range() 的起始值、最終值及遞增量，觀察 i 的值及列表的哪些項目被存取；超出範圍會出現 IndexError。", tips: "<b>提示：</b>最終值不包括在內；有 N 個項目的列表，索引是 0 至 N − 1。下方的探索器可以自由試。" },
    { id: "tst", name: "測試數據", note: "正常數據值、錯誤數據值、邊界數據值（邊際個案）：找出分界值，設計能測試所有分支的測試數據。", tips: "<b>提示：</b>整數題中，分界值兩邊即分界值 −1 及 +1。分界值本身只標「邊界」亦可；分界值兩邊的值要同時標正常或錯誤（教科書 6.1）。" },
    { id: "err", name: "錯誤類型", note: "分辨語法錯誤、運行時錯誤及邏輯錯誤，並找出要修改的一行。", tips: "<b>提示：</b>錯誤信息以 Python 3.11 顯示；Thonny 內置的舊版本 Python 字眼可能不同（例如只寫 invalid syntax），但錯誤的類型相同。" },
    { id: "cmp", name: "比較次數", note: "逐步執行兩個算法，數比較次數，填寫最好情況及最差情況，比較哪個較有效率。", tips: "<b>答題句式：</b>「算法 2 較有效率，因為它找到目標後便離開循環，比較次數較少。」" },
  ];

  // =================== 狀態 ===================
  const S = { hintOpen: false, mode: "out", q: null, entry: null, n: 0, answered: false, right: 0, total: 0, streak: 0, best: 0, sel: null, on: {} };
  const hsh = location.hash.replace("#", ""); if (MODES.some((x) => x.id === hsh)) S.mode = hsh;
  MODES.forEach((m) => { S.on[m.id] = new Set(ENTRIES[m.id].map((e) => e.name)); });
  try { const saved = JSON.parse(localStorage.getItem("pylab-filter") || "{}");
    Object.keys(saved).forEach((id) => { if (!ENTRIES[id] || !Array.isArray(saved[id])) return; const names = new Set(ENTRIES[id].map((e) => e.name)); const keep = saved[id].filter((n) => names.has(n)); if (keep.length) S.on[id] = new Set(keep); }); } catch (e) {}
  const saveFilter = () => { try { const o = {}; Object.keys(S.on).forEach((id) => { o[id] = [...S.on[id]]; }); localStorage.setItem("pylab-filter", JSON.stringify(o)); } catch (e) {} };

  const nav = $("modes");
  MODES.forEach((m) => { const b = document.createElement("button"); b.type = "button"; b.textContent = m.name; b.dataset.id = m.id;
    b.addEventListener("click", () => { S.mode = m.id; try { history.replaceState(null, "", "#" + m.id); } catch (e) {} renderNav(); renderFilter(); next(); }); nav.appendChild(b); });
  let explorerBuilt = false;
  function renderNav() { [...nav.children].forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.id === S.mode)));
    const m = MODES.find((x) => x.id === S.mode); $("mode-note").textContent = m.note; $("tips").innerHTML = m.tips;
    $("explorer").hidden = S.mode !== "rng";
    if (S.mode === "rng" && !explorerBuilt) { explorerBuilt = true; RangeBox($("explorer-body"), { list: ["A", "B", "C", "D", "E"], s: 0, e: 5, st: 1, free: true }); } }
  function renderCount() { const all = ENTRIES[S.mode].length, on = S.on[S.mode].size, el = $("fcount"); el.textContent = on === all ? `全部 ${all} 種題型` : `已選 ${on}／${all} 種`; el.classList.toggle("partial", on !== all); }
  function renderFilter() {
    const box = $("fchips"); box.innerHTML = ""; const list = ENTRIES[S.mode], groups = [];
    list.forEach((e) => { let g = groups.find((x) => x.name === e.group); if (!g) { g = { name: e.group, items: [] }; groups.push(g); } g.items.push(e); });
    groups.forEach((g) => { const wrap = document.createElement("div"); wrap.className = "fgroup";
      if (g.name) { const h = document.createElement("h3"); h.textContent = g.name; wrap.appendChild(h);
        if (groups.length > 1) { const only = document.createElement("button"); only.type = "button"; only.className = "mini"; only.textContent = `只練「${g.name}」`;
          only.addEventListener("click", () => { S.on[S.mode] = new Set(g.items.map((x) => x.name)); saveFilter(); renderFilter(); afterFilter(); }); h.appendChild(only); } }
      const chips = document.createElement("div"); chips.className = "chips";
      g.items.forEach((e) => { const c = document.createElement("button"); c.type = "button"; c.className = "chip"; c.textContent = e.name; c.setAttribute("aria-pressed", String(S.on[S.mode].has(e.name)));
        c.addEventListener("click", () => { const set = S.on[S.mode]; set.has(e.name) ? set.delete(e.name) : set.add(e.name); c.setAttribute("aria-pressed", String(set.has(e.name))); saveFilter(); renderCount(); afterFilter(); }); chips.appendChild(c); });
      wrap.appendChild(chips); box.appendChild(wrap); });
    renderCount(); }
  function afterFilter() { if (!S.on[S.mode].size) { showEmpty(); return; } if (!S.q || !S.entry || !S.on[S.mode].has(S.entry.name)) next(); }
  $("f-all").addEventListener("click", () => { S.on[S.mode] = new Set(ENTRIES[S.mode].map((e) => e.name)); saveFilter(); renderFilter(); afterFilter(); });
  $("f-none").addEventListener("click", () => { S.on[S.mode] = new Set(); saveFilter(); renderFilter(); afterFilter(); });
  function renderScore() { $("sc-right").textContent = S.right; $("sc-total").textContent = S.total; $("sc-streak").textContent = S.streak; $("sc-best").textContent = S.best; }
  function showEmpty() { S.q = null; S.entry = null; $("qtype").textContent = ""; $("qno").textContent = "";
    $("prompt").innerHTML = '<p class="empty">請在上方「題型篩選」選擇至少一種題型。</p>'; $("input-area").innerHTML = ""; $("feedback").hidden = true;
    $("btn-check").disabled = true; $("btn-show").disabled = true; $("btn-next").disabled = true; $("filter").open = true; $("btn-hint").hidden = true; $("hintbox").hidden = true; }

  function next() {
    const pool = ENTRIES[S.mode].filter((e) => S.on[S.mode].has(e.name)); if (!pool.length) { showEmpty(); return; }
    let e = pick(pool); if (pool.length > 1 && S.entry && e.name === S.entry.name) e = pick(pool.filter((x) => x.name !== S.entry.name));
    S.entry = e; S.q = e.fn(); S.n++; S.answered = false; S.sel = null; $("btn-next").disabled = false;
    const q = S.q; $("qtype").textContent = (e.group ? e.group + " · " : "") + e.name; $("qno").textContent = `第 ${S.n} 題`;
    $("hintbox").innerHTML = hintHTML(e); $("btn-hint").hidden = !$("hintbox").innerHTML; setHint(false); updNext();
    $("prompt").innerHTML = q.prompt; const area = $("input-area"); area.innerHTML = ""; $("feedback").hidden = true; $("btn-check").disabled = false; $("btn-show").disabled = false;
    if (q.input.kind === "text") {
      area.innerHTML = `<div class="answer-row"><label for="ans">你的答案</label><input id="ans" type="text" autocomplete="off" spellcheck="false" placeholder="${q.input.ph || ""}"></div>`;
      $("ans").addEventListener("keydown", (ev) => { if (ev.key === "Enter") { ev.preventDefault(); S.answered ? next() : check(); } });
    } else if (q.input.kind === "area") {
      area.innerHTML = '<label for="ans" class="flab">你的答案（每行輸出寫一行）</label><textarea id="ans" spellcheck="false" autocomplete="off" autocapitalize="off" rows="4"></textarea>';
    } else if (q.input.kind === "choice") {
      const box = document.createElement("div"); box.className = "choices" + (q.input.pre ? " wide" : "");
      q.input.opts.forEach((o) => { const b = document.createElement("button"); b.type = "button"; b.className = "choice" + (q.input.pre ? " pre" : ""); if (q.input.mono) b.style.fontFamily = "var(--mono)"; b.textContent = o; b.setAttribute("aria-pressed", "false");
        b.addEventListener("click", () => { if (S.answered) return; S.sel = o; box.querySelectorAll(".choice").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); }); box.appendChild(b); });
      area.appendChild(box);
    } else q.mount(area);
  }
  function current() { const q = S.q; if (q.input.kind === "text" || q.input.kind === "area") return $("ans").value; if (q.input.kind === "choice") return S.sel; return q.value(); }
  function finish(correct, revealed, res) {
    S.answered = true; $("btn-check").disabled = true; $("btn-show").disabled = true;
    if (!revealed) { S.total++; if (correct) { S.right++; S.streak++; if (S.streak > S.best) S.best = S.streak; } else S.streak = 0; } else S.streak = 0;
    renderScore(); const q = S.q;
    if (q.input.kind === "choice") $("input-area").querySelectorAll(".choice").forEach((b) => { if (b.textContent === q.answer) b.classList.add("ok"); else if (b.textContent === S.sel) b.classList.add("no"); });
    if (q.input.kind === "text" || q.input.kind === "area") $("ans").readOnly = true;
    if (q.after) q.after(revealed, res);
    const fb = $("feedback"); fb.className = "feedback " + (correct ? "good" : "bad"); fb.hidden = false;
    const head = revealed ? "答案" : correct ? "答對了" : "未答對";
    let extra = res && res.note ? res.note : "";
    if (q.input.kind === "area" && !correct && !revealed) { const mine = normOut($("ans").value), right = normOut(q.answer), n = Math.max(mine.length, right.length);
      extra = `<p class="iolab">逐行對照（✗ 表示這一行不同）</p><pre class="io diff">${Array.from({ length: n }, (_, i) => { const a = mine[i] === undefined ? "（沒有這一行）" : mine[i], same = mine[i] === right[i]; return `${same ? "✓" : '<span class="x">✗</span>'} ${esc(a)}`; }).join("\n")}</pre>`; }
    fb.innerHTML = `<div class="verdict">${head}${q.show && q.input.kind !== "area" ? "：" + q.show : ""}</div>${q.input.kind === "area" ? `<p class="iolab">正確輸出</p>${q.show}` : ""}${extra}<ol class="steps">${q.explain.map((x) => `<li>${x}</li>`).join("")}</ol>`;
    updNext(); $("btn-next").focus({ preventScroll: true });
  }
  function warn(msg) { const fb = $("feedback"); fb.className = "feedback bad"; fb.hidden = false; fb.innerHTML = `<div class="verdict">${msg}</div>`; }
  function check() {
    if (S.answered || !S.q) return; const a = current(), q = S.q;
    if (a === null || a === undefined || (typeof a === "string" && a.trim() === "")) { warn("請先作答，或按「顯示答案」。"); return; }
    let ok, res = null;
    if (q.input.kind === "text") ok = a.trim().replace(/\s+/g, "") === q.answer;
    else if (q.input.kind === "area") { const x = normOut(a), y = normOut(q.answer); ok = x.length === y.length && x.every((l, i) => l === y[i]); }
    else if (q.input.kind === "choice") ok = a === q.answer;
    else { res = q.grade(a); ok = res.ok; }
    finish(ok, false, res);
  }
  function setHint(open) { $("hintbox").hidden = !open; $("btn-hint").setAttribute("aria-expanded", String(open)); }
  $("btn-hint").addEventListener("click", () => setHint($("hintbox").hidden));
  $("btn-check").addEventListener("click", check);
  $("btn-show").addEventListener("click", () => { if (!S.answered && S.q) finish(false, true, null); });
  let skipTimer = null;
  function updNext(confirming) { const b = $("btn-next"); clearTimeout(skipTimer); b.classList.remove("primary", "ghost", "skip", "confirm");
    if (S.answered) { b.classList.add("primary"); b.textContent = "下一題 →"; }
    else if (confirming) { b.classList.add("ghost", "confirm"); b.textContent = "再按一次確認跳過"; skipTimer = setTimeout(() => updNext(false), 3000); }
    else { b.classList.add("ghost", "skip"); b.textContent = "跳過此題"; } }
  $("btn-next").addEventListener("click", () => { if (S.answered || $("btn-next").classList.contains("confirm")) return next(); updNext(true); });

  // 測試用：以正確或錯誤答案填寫目前的題目（不會自動核對）
  window.__pylab = { fill(ok) { const q = S.q; if (!q || S.answered) return false;
      if (q.input.kind === "text" || q.input.kind === "area") $("ans").value = ok ? q.answer : "999\nwrong";
      else if (q.input.kind === "choice") { const t = ok ? q.answer : q.input.opts.find((o) => o !== q.answer); [...$("input-area").querySelectorAll(".choice")].find((b) => b.textContent === t).click(); }
      else q.fill(ok); return true; },
    only(name) { S.on[S.mode] = new Set([name]); renderFilter(); next(); }, entries: () => ENTRIES[S.mode].map((e) => e.name), mode: (m) => [...nav.children].find((b) => b.dataset.id === m).click() };

  renderNav(); renderFilter(); renderScore(); next();
})();
</script>
