<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>位元練習室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --sunk:#E3E9E6; --ink:#17262A; --muted:#566A6E; --line:#C9D4D0;
  --accent:#0E7466; --accent-ink:#FFFFFF; --led:#E39B10; --led-glow:rgba(227,155,16,.35); --led-off:#D6DDDA;
  --good:#1F7A3A; --good-bg:#E3F3E7; --bad:#B3261E; --bad-bg:#FBE7E5;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1618; --surface:#162226; --sunk:#1D2C31; --ink:#E2ECE9; --muted:#95A9AB; --line:#2C3E43;
    --accent:#35BFA9; --accent-ink:#0B1413; --led:#F4B23C; --led-glow:rgba(244,178,60,.35); --led-off:#2A3A3F;
    --good:#5BD17E; --good-bg:#15301F; --bad:#FF8A80; --bad-bg:#3A1A18; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1618; --surface:#162226; --sunk:#1D2C31; --ink:#E2ECE9; --muted:#95A9AB; --line:#2C3E43;
  --accent:#35BFA9; --accent-ink:#0B1413; --led:#F4B23C; --led-glow:rgba(244,178,60,.35); --led-off:#2A3A3F;
  --good:#5BD17E; --good-bg:#15301F; --bad:#FF8A80; --bad-bg:#3A1A18; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;margin:0}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
h1{font-size:30px;font-weight:900;margin:0;letter-spacing:.02em;text-wrap:balance}
h1 .bits{display:inline-block;white-space:nowrap;font-family:var(--mono);font-weight:600;color:var(--accent);font-size:.7em;margin-left:.4em;letter-spacing:.08em}
.score{display:flex;gap:16px;font-variant-numeric:tabular-nums}
.score div{display:flex;flex-direction:column;align-items:flex-end}
.score b{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.1}
.score span{font-size:12px;color:var(--muted)}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav button{font:inherit;font-size:15px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
nav button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
nav button:focus-visible,.btn:focus-visible,.bit:focus-visible,input:focus-visible,.choice:focus-visible{outline:3px solid var(--led);outline-offset:2px}
.topic-note{font-size:14px;color:var(--muted);margin:-6px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.qtype{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--accent);text-transform:uppercase}
.qno{font-family:var(--mono);font-size:12px;color:var(--muted)}
.prompt{font-size:18px;line-height:1.7}
.prompt .num,.mono{font-family:var(--mono);font-weight:600;letter-spacing:.03em}
sub{font-size:.7em}
.given{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:.08em;background:var(--sunk);border-radius:10px;padding:10px 14px;display:inline-block;overflow-x:auto;max-width:100%}
.bitrow{display:flex;flex-direction:column;gap:6px;overflow-x:auto;padding-bottom:4px}
.bits{display:flex;gap:6px}
.bit{width:44px;height:52px;flex:0 0 auto;border-radius:8px;border:1px solid var(--line);background:var(--led-off);color:var(--muted);font-family:var(--mono);font-size:22px;font-weight:600;cursor:pointer;transition:background .12s,box-shadow .12s}
.bit.on{background:var(--led);color:#1A1204;border-color:var(--led);box-shadow:0 0 12px var(--led-glow)}
.bit.gap{margin-left:10px}
.weights{display:flex;gap:6px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.weights span{width:44px;flex:0 0 auto;text-align:center}
.weights span.gap{margin-left:10px}
.bitval{font-size:14px;color:var(--muted)}
.answer-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=text]{font-family:var(--mono);font-size:20px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:min(260px,100%)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.choice{font:inherit;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.btn{font:inherit;font-weight:700;padding:10px 18px;border-radius:10px;border:1px solid var(--accent);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent)}
.feedback{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.feedback.good{background:var(--good-bg)}
.feedback.bad{background:var(--bad-bg)}
.feedback .verdict{font-weight:700}
.feedback.good .verdict{color:var(--good)}
.feedback.bad .verdict{color:var(--bad)}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.steps li{line-height:1.6}
.swatch{display:inline-block;width:1.4em;height:1.4em;border-radius:4px;vertical-align:-.3em;border:1px solid var(--line);margin-left:.3em}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.tips{font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:14px}
.tips b{color:var(--ink)}
@media (max-width:480px){h1{font-size:24px}.bit{width:34px;height:44px;font-size:18px}.weights span{width:34px}.given{font-size:20px}.prompt{font-size:16px}}
@media (prefers-reduced-motion:reduce){.bit{transition:none}}
</style>
<style>[hidden]{display:none!important} body{margin:0} img{max-width:100%}</style>
</head>
<body>
<nav style="max-width:860px;margin:0 auto;padding:12px 16px 0;font-size:14px"><a href="index.html" style="color:var(--accent)">← 返回首頁</a></nav>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="eyebrow">HKDSE ICT · 必修 A b / A c</span>
      <h1>位元練習室<span class="bits">0100 0001</span></h1>
    </div>
    <div class="score" aria-live="polite">
      <div><b id="sc-right">0</b><span>答對</span></div>
      <div><b id="sc-total">0</b><span>已答</span></div>
      <div><b id="sc-streak">0</b><span>連續答對</span></div>
      <div><b id="sc-best">0</b><span>最佳紀錄</span></div>
    </div>
  </header>

  <nav id="modes" aria-label="練習類別"></nav>
  <p class="topic-note" id="mode-note"></p>

  <section class="card" id="card" aria-live="polite">
    <div class="qhead"><span class="qtype" id="qtype"></span><span class="qno" id="qno"></span></div>
    <div class="prompt" id="prompt"></div>
    <div id="input-area"></div>
    <div class="actions">
      <button class="btn primary" id="btn-check" type="button">核對答案</button>
      <button class="btn ghost" id="btn-show" type="button">顯示答案</button>
      <button class="btn ghost" id="btn-next" type="button">下一題 →</button>
    </div>
    <div id="feedback" hidden></div>
    <div class="tips" id="tips"></div>
  </section>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const bin = (n, w) => n.toString(2).padStart(w, "0");
  const hex = (n, w = 2) => n.toString(16).toUpperCase().padStart(w, "0");
  const grp = (s) => s.replace(/(.{4})(?=.)/g, "$1 ");
  const sub = (s, b) => `<span class="mono">${s}</span><sub>${b}</sub>`;
  const norm = (s) => String(s).replace(/[−–]/g, "-").toUpperCase().replace(/[\s₂₁₆]/g, "").replace(/^0X/, "").replace(/^#/, "").replace(/，/g, ",");
  const fmt = (n) => n.toLocaleString("en-US");
  const tc = (v, w = 8) => bin(v < 0 ? (1 << w) + v : v, w);

  // ---------- question generators ----------
  // each returns {type, prompt, input:{kind:'text'|'bits'|'choice', ...}, answer, accept?, explain:[...], tips}
  const G = {};

  // 進制互換
  G.base = [
    () => { const w = pick([8, 8, 12]); const n = R(1, (1 << w) - 1); const b = bin(n, w); const h = hex(n, w / 4);
      return { type: "二進制 → 十六進制", prompt: `把以下二進制數字轉換為十六進制：<div class="given">${grp(b)}<sub>2</sub></div>`,
        input: { kind: "text", ph: "例如 A3" }, answer: h, show: sub(h, 16),
        explain: [`由右至左每 4 位一組：${grp(b)}`, ...b.match(/.{4}/g).map(g => `${g} → ${parseInt(g, 2).toString(16).toUpperCase()}（${parseInt(g, 2)}）`), `答案：${h}<sub>16</sub>`] }; },
    () => { const n = R(1, 255); const h = hex(n); const b = bin(n, 8);
      return { type: "十六進制 → 二進制", prompt: `把 ${sub(h, 16)} 轉換為 8 位元二進制。點按下方的位元開關作答。`,
        input: { kind: "bits", w: 8 }, answer: b, show: sub(grp(b), 2),
        explain: [...h.split("").map(d => `${d} → ${bin(parseInt(d, 16), 4)}`), `合併：${grp(b)}<sub>2</sub>`] }; },
    () => { const n = R(1, 255); const b = bin(n, 8); const w = [128, 64, 32, 16, 8, 4, 2, 1];
      return { type: "二進制 → 十進制", prompt: `把以下二進制數字轉換為十進制：<div class="given">${grp(b)}<sub>2</sub></div>`,
        input: { kind: "text", ph: "十進制數值" }, answer: String(n), show: String(n),
        explain: [`把位值為 1 的位置相加：${b.split("").map((c, i) => c === "1" ? w[i] : null).filter(x => x !== null).join(" + ")} ＝ ${n}`] }; },
    () => { const n = R(1, 255); const b = bin(n, 8); const w = [128, 64, 32, 16, 8, 4, 2, 1];
      const parts = []; let r = n; w.forEach(x => { if (r >= x) { parts.push(x); r -= x; } });
      return { type: "十進制 → 二進制", prompt: `把十進制數字 <span class="num">${n}</span> 轉換為 8 位元二進制。`,
        input: { kind: "bits", w: 8 }, answer: b, show: sub(grp(b), 2),
        explain: [`由最大的位值開始減：${n} ＝ ${parts.join(" + ")}`, `對應位置設為 1：${grp(b)}<sub>2</sub>`] }; },
    () => { const n = R(16, 255); const h = hex(n);
      return { type: "十進制 → 十六進制", prompt: `把十進制數字 <span class="num">${n}</span> 轉換為十六進制。`,
        input: { kind: "text", ph: "例如 7F" }, answer: h, show: sub(h, 16),
        explain: [`${n} ÷ 16 ＝ ${Math.floor(n / 16)} 餘 ${n % 16}`, `商 ${Math.floor(n / 16)} → ${h[0]}，餘數 ${n % 16} → ${h[1]}`, `答案：${h}<sub>16</sub>`] }; },
    () => { const n = R(16, 255); const h = hex(n);
      return { type: "十六進制 → 十進制", prompt: `把 ${sub(h, 16)} 轉換為十進制。`,
        input: { kind: "text", ph: "十進制數值" }, answer: String(n), show: String(n),
        explain: [`${h[0]} × 16 ＋ ${h[1]} × 1 ＝ ${parseInt(h[0], 16)} × 16 ＋ ${parseInt(h[1], 16)} ＝ ${n}`] }; },
  ];

  // 二進制補碼
  G.tc = [
    () => { const v = R(-128, 127) || -1; const b = tc(v); const steps = v >= 0
        ? [`${v} 是正數，直接轉換為二進制：${grp(b)}`]
        : [`先寫出 ${-v} 的 8 位元二進制：${grp(bin(-v, 8))}`, `把所有位元反轉：${grp(bin(~(-v) & 255, 8))}`, `再加 1：${grp(b)}`, `另一方法：256 − ${-v} ＝ ${256 + v} ＝ ${grp(b)}`];
      return { type: "十進制 → 8 位元補碼", prompt: `以 8 位元二進制補碼表示 <span class="num">${v}</span>。`,
        input: { kind: "bits", w: 8, weights: ["−128", "64", "32", "16", "8", "4", "2", "1"] }, answer: b, show: sub(grp(b), 2), explain: steps }; },
    () => { const v = R(-128, 127); const b = tc(v); const w = [-128, 64, 32, 16, 8, 4, 2, 1];
      const terms = b.split("").map((c, i) => c === "1" ? w[i] : null).filter(x => x !== null);
      return { type: "8 位元補碼 → 十進制", prompt: `以下是一個 8 位元二進制補碼數字。它的十進制數值是多少？<div class="given">${grp(b)}</div>`,
        input: { kind: "text", ph: "可以是負數" }, answer: String(v), show: String(v),
        explain: [`補碼中最左一位的位值是 −128。`, `${terms.length ? terms.join(" + ").replace(/\+ -/g, "− ") : "0"} ＝ ${v}`] }; },
    () => { const n = pick([4, 5, 6, 8, 10, 12, 16]); const which = pick(["最小值", "最大值"]); const min = -(2 ** (n - 1)), max = 2 ** (n - 1) - 1;
      const ans = which === "最小值" ? min : max;
      return { type: "補碼的範圍", prompt: `${n} 位元二進制補碼可表示的<b>${which}</b>是多少？`,
        input: { kind: "text", ph: "十進制數值" }, answer: String(ans), show: fmt(ans),
        explain: [`範圍：−2<sup>n−1</sup> 至 2<sup>n−1</sup> − 1`, `n ＝ ${n}：${fmt(min)} 至 ${fmt(max)}`, `負數比正數多一個，因為 0 佔用了一個非負數的位置。`] }; },
    () => { let a, b, s; const want = Math.random() < 0.5;
      for (;;) { a = R(-128, 127); b = R(-128, 127); s = a + b; if ((s > 127 || s < -128) === want) break; }
      const over = s > 127 || s < -128; const raw = ((a & 255) + (b & 255)) & 255;
      return { type: "溢出判斷", prompt: `以 8 位元二進制補碼計算 <span class="num">${a}</span> ＋ <span class="num">${b}</span>，會否出現溢出誤差？<div class="given" style="font-size:18px">${grp(tc(a))}<br>+ ${grp(tc(b))}</div>`,
        input: { kind: "choice", opts: ["會溢出", "不會溢出"] }, answer: over ? "會溢出" : "不會溢出", show: over ? "會溢出" : "不會溢出",
        explain: [`真正的結果是 ${s}；8 位元補碼的範圍是 −128 至 127。`, over ? `${s} 超出範圍，所以溢出。8 位元的結果 ${grp(bin(raw, 8))} 代表 ${raw > 127 ? raw - 256 : raw}，是錯誤的。` : `${s} 在範圍之內，沒有溢出。多出的進位（如有）會被捨棄，不等於溢出。`,
          `快速判斷：兩個<b>同號</b>的數相加，結果卻變成<b>異號</b>，便是溢出；異號相加一定不會溢出。`] }; },
  ];

  // 位元與組合
  G.bits = [
    () => { const k = pick([R(5, 30), R(50, 500), R(600, 5000), R(10000, 70000)]); const n = Math.ceil(Math.log2(k));
      return { type: "最少需要多少位元", prompt: `某系統要為 <span class="num">${fmt(k)}</span> 件物品各編配一個不同的二進制編號。每個編號最少需要多少位元？`,
        input: { kind: "text", ph: "位元數" }, answer: String(n), show: `${n} 位元`,
        explain: [`找最小的 n 使 2<sup>n</sup> ≥ ${fmt(k)}`, `2<sup>${n - 1}</sup> ＝ ${fmt(2 ** (n - 1))} < ${fmt(k)} ≤ 2<sup>${n}</sup> ＝ ${fmt(2 ** n)}`, `所以需要 ${n} 位元。`] }; },
    () => { const d = R(2, 4); const n = 16 ** d;
      return { type: "十六進制編號的數量", prompt: `某遊戲以 <span class="num">${d}</span> 位十六進制數字作編號（${"0".repeat(d)}<sub>16</sub> 至 ${"F".repeat(d)}<sub>16</sub>）。最多可以有多少個不同的編號？`,
        input: { kind: "text", ph: "數量" }, answer: String(n), show: fmt(n),
        explain: [`每位有 16 個可能：16<sup>${d}</sup> ＝ ${fmt(n)}`, `亦即 ${4 * d} 位元：2<sup>${4 * d}</sup> ＝ ${fmt(n)}`] }; },
    () => { const c = [R(0, 255), R(0, 255), R(0, 255)]; const code = c.map(x => hex(x)).join(""); const i = R(0, 2); const nm = ["紅", "綠", "藍"][i];
      return { type: "網頁顏色碼", prompt: `顏色碼 <span class="num">#${code}</span><span class="swatch" style="background:#${code}"></span> 的格式是 #RRGGBB。<b>${nm}色</b>成分的十進制數值是多少？`,
        input: { kind: "text", ph: "0–255" }, answer: String(c[i]), show: String(c[i]),
        explain: [`${nm}色成分：${code.substr(i * 2, 2)}<sub>16</sub>`, `${code[i * 2]} × 16 ＋ ${code[i * 2 + 1]} ＝ ${parseInt(code[i * 2], 16)} × 16 ＋ ${parseInt(code[i * 2 + 1], 16)} ＝ ${c[i]}`] }; },
    () => { const k = pick([2, 4, 8, 16, 256]); const bpp = Math.log2(k); const [w, h] = pick([[8, 8], [16, 16], [32, 32], [64, 48], [100, 80], [320, 240]]); const bytes = w * h * bpp / 8;
      return { type: "點陣圖大小", prompt: `一幅未經壓縮的點陣圖，解像度為 <span class="num">${w} × ${h}</span>，每個像素可顯示 <span class="num">${k}</span> 種顏色。圖像數據需要多少<b>字節</b>（不計檔案標頭）？`,
        input: { kind: "text", ph: "字節" }, answer: String(bytes), show: `${fmt(bytes)} 字節`,
        explain: [`${k} 種顏色需要 ${bpp} 位元（2<sup>${bpp}</sup> ＝ ${k}）`, `${w} × ${h} × ${bpp} ＝ ${fmt(w * h * bpp)} 位元`, `÷ 8 ＝ ${fmt(bytes)} 字節`] }; },
  ];

  // 字符編碼
  const EN = ["ICT", "Hi", "DSE", "OK", "Go", "Wi-Fi", "PDF", "HTML", "Day", "Top"];
  const ZH = ["資訊", "科技", "電腦", "學校", "考試", "同學", "數據", "運動會", "你好", "早晨", "圖書館", "功課"];
  G.chars = [
    () => { const parts = shuffle([pick(EN), pick(ZH)]); const sp = Math.random() < 0.5; const s = parts.join(sp ? " " : "");
      const en = [...s].filter(ch => ch.charCodeAt(0) < 128).length, zh = [...s].length - en; const enc = pick(["UTF-8", "大五碼", "UTF-16"]);
      const per = { "UTF-8": [1, 3], "大五碼": [1, 2], "UTF-16": [2, 2] }[enc]; const ans = en * per[0] + zh * per[1];
      return { type: "字符編碼與檔案大小", prompt: `以 <b>${enc}</b> 儲存字串「<span class="mono">${s}</span>」需要多少字節？（不計檔案標頭）`,
        note: `英文字母、符號及空格：UTF-8 及大五碼佔 1 字節；常用中文字：UTF-8 佔 3 字節、大五碼佔 2 字節；UTF-16 每個字符佔 2 字節。`,
        input: { kind: "text", ph: "字節" }, answer: String(ans), show: `${ans} 字節`,
        explain: [`英文字母、符號及空格共 ${en} 個；中文字共 ${zh} 個。`, `${enc}：${en} × ${per[0]} ＋ ${zh} × ${per[1]} ＝ ${ans} 字節`] }; },
    () => { const base = pick([["A", 0x41], ["a", 0x61]]); const off = R(1, 25); const ch = String.fromCharCode(base[1] + off); const code = base[1] + off; const asBin = Math.random() < 0.5;
      return { type: "ASCII 碼", prompt: `已知 '${base[0]}' 的 ASCII 碼是 ${sub(hex(base[1]), 16)}。'<span class="mono">${ch}</span>' 的 ASCII 碼以${asBin ? " 8 位元二進制" : "十六進制"}表示是甚麼？`,
        input: asBin ? { kind: "bits", w: 8 } : { kind: "text", ph: "例如 4B" }, answer: asBin ? bin(code, 8) : hex(code), show: asBin ? sub(grp(bin(code, 8)), 2) : sub(hex(code), 16),
        explain: [`字母的編碼是連續的：'${ch}' 在 '${base[0]}' 之後第 ${off} 個。`, `${hex(base[1])}<sub>16</sub> ＋ ${off} ＝ ${base[1]} ＋ ${off} ＝ ${code} ＝ ${hex(code)}<sub>16</sub>${asBin ? ` ＝ ${grp(bin(code, 8))}<sub>2</sub>` : ""}`] }; },
    () => { const q = pick([
        ["統一碼（Unicode）", "可表示世界上大部分語言的字符集是", ["ASCII", "大五碼", "國標碼", "統一碼（Unicode）"], "統一碼包含多種語言的字符；大五碼只支援繁體中文及英文，國標碼主要支援簡體中文。"],
        ["大五碼", "香港常用來表示繁體中文、每個中文字佔 2 字節的編碼是", ["ASCII", "大五碼", "國標碼", "UTF-8"], "國標碼主要用於簡體中文；UTF-8 的常用中文字佔 3 字節。"],
        ["128", "7 位元 ASCII 最多可表示多少個字符？", ["127", "128", "255", "256"], "2⁷ ＝ 128。"],
        ["會出現亂碼", "以大五碼儲存的文件，用國標碼開啟時通常會", ["自動轉換為簡體字", "會出現亂碼", "檔案大小加倍", "正常顯示"], "兩種編碼的代碼不同，不能互換，因此會顯示亂碼。"]]);
      return { type: "字符集概念", prompt: q[1], input: { kind: "choice", opts: q[2] }, answer: q[0], show: q[0], explain: [q[3]] }; },
  ];

  // 數據控制
  G.ctrl = [
    () => { const d = R(1, 127); const b = bin(d, 7); const kind = pick(["偶", "奇"]); const ones = b.split("").filter(c => c === "1").length;
      const p = kind === "偶" ? ones % 2 : 1 - ones % 2;
      return { type: "計算同位位元", prompt: `以下 7 位元數據採用<b>${kind}同位</b>，檢驗位加在最左方。檢驗位應是 0 還是 1？<div class="given">? ${b.slice(0, 3)} ${b.slice(3)}</div>`,
        input: { kind: "choice", opts: ["0", "1"] }, answer: String(p), show: `${p}（完整位元組：${grp(p + b)}）`,
        explain: [`數據中有 ${ones} 個 1。`, `${kind}同位要求連同檢驗位在內，1 的總數為${kind}數，所以檢驗位是 ${p}。`] }; },
    () => { const kind = pick(["偶", "奇"]); let bytes = [];
      const good = () => { const d = bin(R(1, 127), 7); const o = d.split("").filter(c => c === "1").length; const p = kind === "偶" ? o % 2 : 1 - o % 2; return p + d; };
      const badIdx = R(0, 3); for (let i = 0; i < 4; i++) { let x = good(); if (i === badIdx) { const k = R(0, 7); x = x.slice(0, k) + (x[k] === "1" ? "0" : "1") + x.slice(k + 1); } bytes.push(x); }
      const opts = bytes.map(grp); const ans = opts[badIdx];
      return { type: "找出出錯的位元組", prompt: `某系統採用<b>${kind}同位</b>（檢驗位在最左方）。下列哪個接收到的位元組<b>一定</b>出現錯誤？`,
        input: { kind: "choice", opts, mono: true }, answer: ans, show: ans,
        explain: [...opts.map(o => `${o}：${o.split("").filter(c => c === "1").length} 個 1`), `${kind}同位要求 1 的總數為${kind}數，只有 ${ans} 不符合。`, `注意：其他位元組只是「沒有偵測到錯誤」，若有兩個位元同時出錯，奇偶檢驗是偵測不到的。`] }; },
    () => { const sch = pick([
        { name: "首四位數字之和除以 10 的餘數", w: [1, 1, 1, 1], m: 10 },
        { name: "(4×d1 ＋ 3×d2 ＋ 2×d3 ＋ 1×d4) 除以 10 的餘數", w: [4, 3, 2, 1], m: 10 },
        { name: "(5×d1 ＋ 4×d2 ＋ 3×d3 ＋ 2×d4) 除以 11 的餘數（餘數 10 以 X 表示）", w: [5, 4, 3, 2], m: 11 }]);
      const d = [R(0, 9), R(0, 9), R(0, 9), R(0, 9)]; const s = d.reduce((a, x, i) => a + x * sch.w[i], 0); const r = s % sch.m; const c = r === 10 ? "X" : String(r);
      const ask = Math.random() < 0.5;
      if (ask) return { type: "計算檢查數位", prompt: `某編號的檢查數位 C ＝ ${sch.name}。首四位是 <span class="num">${d.join("")}</span>，檢查數位是甚麼？`,
        input: { kind: "text", ph: "一位數字或 X" }, answer: c, show: `${c}（完整編號 ${d.join("")}${c}）`,
        explain: [`${d.map((x, i) => sch.w[i] === 1 ? x : `${sch.w[i]}×${x}`).join(" ＋ ")} ＝ ${s}`, `${s} ÷ ${sch.m} 的餘數 ＝ ${r}${r === 10 ? "，以 X 表示" : ""}`] };
      let shown = c; const valid = Math.random() < 0.5; if (!valid) { const alt = (r + R(1, sch.m - 1)) % sch.m; shown = alt === 10 ? "X" : String(alt); }
      return { type: "判斷編號是否有效", prompt: `某編號的檢查數位 C ＝ ${sch.name}。編號 <span class="num">${d.join("")}${shown}</span> 是否有效？`,
        input: { kind: "choice", opts: ["有效", "無效"] }, answer: valid ? "有效" : "無效", show: valid ? "有效" : "無效",
        explain: [`${d.map((x, i) => sch.w[i] === 1 ? x : `${sch.w[i]}×${x}`).join(" ＋ ")} ＝ ${s}，餘數 ${r}${r === 10 ? "（X）" : ""}`, valid ? `與檢查數位 ${shown} 相同，所以有效。` : `與檢查數位 ${shown} 不同，所以無效。`] }; },
    () => { const q = pick([
        ["另一個有效編號", "檢查數位不能偵測以下哪種錯誤？", ["輸錯其中一位數字", "另一個有效編號", "漏打一位數字", "多打一位數字"], "另一個有效編號本身符合計算規則，檢查數位會吻合，要靠驗證（例如雙重輸入）才能發現。"],
        ["偶數個位元出錯", "奇偶檢驗不能偵測以下哪種情況？", ["一個位元出錯", "三個位元出錯", "偶數個位元出錯", "檢驗位本身出錯"], "偶數個位元改變後，1 的數目奇偶性不變。"],
        ["雙重輸入", "職員把 65 分錯誤輸入為 56 分。以下哪種方法最能偵測這個錯誤？", ["範圍檢查", "類型檢查", "雙重輸入", "長度檢查"], "56 是合理數值，有效性檢驗不能發現；雙重輸入屬驗證，可以發現兩次輸入不一致。"],
        ["數字之和不變", "以「數字之和除以 10 的餘數」作檢查數位，不能偵測相鄰數字對調，原因是", ["數字之和不變", "餘數必定是 0", "對調後編號變長", "檢查數位在最後"], "對調不會改變數字之和，因此檢查數位不變；加權計算可以改善。"]]);
      return { type: "數據控制概念", prompt: q[1], input: { kind: "choice", opts: shuffle(q[2]) }, answer: q[0], show: q[0], explain: [q[3]] }; },
  ];

  const MODES = [
    { id: "base", name: "進制互換", note: "二進制、十進制、十六進制之間的轉換。二進制與十六進制互換時，每 4 位一組，毋須經過十進制。", tips: "<b>提示：</b>1 位十六進制 ＝ 4 位元。點按位元開關可以開或關該位元，下方數字是每個位置的位值。" },
    { id: "tc", name: "二進制補碼", note: "以 8 位元二進制補碼表示正負整數、補碼的範圍，以及判斷溢出誤差。", tips: "<b>提示：</b>補碼最左一位的位值是負數（8 位元是 −128）。同號相加結果變號，便是溢出。" },
    { id: "bits", name: "位元與組合", note: "n 位元可表示的樣式數量、最少需要的位元數、網頁顏色碼及點陣圖大小。", tips: "<b>提示：</b>n 位元有 2ⁿ 種樣式；k 種狀態最少需要 n 位元，使 2ⁿ ≥ k。" },
    { id: "chars", name: "字符編碼", note: "ASCII、大五碼、統一碼（UTF-8／UTF-16）的字節計算及概念。", tips: "<b>提示：</b>逐類點算字符，空格和符號也是字符。題目會提供每種字符所佔的字節數。" },
    { id: "ctrl", name: "奇偶與檢查數位", note: "奇偶檢驗、檢查數位的計算，以及它們能或不能偵測的錯誤。", tips: "<b>提示：</b>奇偶檢驗只能偵測奇數個位元出錯；檢查數位不能偵測另一個有效編號。" },
  ];

  // ---------- state ----------
  const S = { mode: "base", q: null, n: 0, answered: false, right: 0, total: 0, streak: 0, best: 0, sel: null, bits: [] };
  try { S.best = +localStorage.getItem("bitlab-best") || 0; } catch (e) {}
  try { const m = localStorage.getItem("bitlab-mode"); if (MODES.some(x => x.id === m)) S.mode = m; } catch (e) {}
  const h = location.hash.replace("#", ""); if (MODES.some(x => x.id === h)) S.mode = h;

  const nav = $("modes");
  MODES.forEach(m => { const b = document.createElement("button"); b.type = "button"; b.textContent = m.name; b.dataset.id = m.id;
    b.addEventListener("click", () => { S.mode = m.id; try { localStorage.setItem("bitlab-mode", m.id); } catch (e) {} renderNav(); next(); }); nav.appendChild(b); });
  function renderNav() { [...nav.children].forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === S.mode)));
    const m = MODES.find(x => x.id === S.mode); $("mode-note").textContent = m.note; $("tips").innerHTML = m.tips; }

  function renderScore() { $("sc-right").textContent = S.right; $("sc-total").textContent = S.total; $("sc-streak").textContent = S.streak; $("sc-best").textContent = S.best; }

  function next() {
    S.q = pick(G[S.mode])(); S.n++; S.answered = false; S.sel = null;
    const q = S.q; $("qtype").textContent = q.type; $("qno").textContent = `第 ${S.n} 題`;
    $("prompt").innerHTML = q.prompt + (q.note ? `<p style="font-size:14px;color:var(--muted);margin:8px 0 0">${q.note}</p>` : "");
    const area = $("input-area"); area.innerHTML = ""; $("feedback").hidden = true; $("btn-check").disabled = false; $("btn-show").disabled = false;
    if (q.input.kind === "text") {
      const row = document.createElement("div"); row.className = "answer-row";
      row.innerHTML = `<label for="ans" class="bitval">你的答案</label><input id="ans" type="text" autocomplete="off" spellcheck="false" placeholder="${q.input.ph || ""}">`;
      area.appendChild(row); const inp = $("ans"); inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); S.answered ? next() : check(); } }); inp.focus({ preventScroll: true });
    } else if (q.input.kind === "bits") {
      const w = q.input.w; S.bits = Array(w).fill(0);
      const wt = q.input.weights || Array.from({ length: w }, (_, i) => String(2 ** (w - 1 - i)));
      const box = document.createElement("div"); box.className = "bitrow";
      box.innerHTML = `<div class="bits" role="group" aria-label="位元開關">${S.bits.map((_, i) => `<button type="button" class="bit${i % 4 === 0 && i ? " gap" : ""}" data-i="${i}" aria-label="第 ${i + 1} 位" aria-pressed="false">0</button>`).join("")}</div>
        <div class="weights" aria-hidden="true">${wt.map((x, i) => `<span class="${i % 4 === 0 && i ? "gap" : ""}">${x}</span>`).join("")}</div>
        <div class="bitval" id="bitval"></div>`;
      area.appendChild(box);
      box.querySelectorAll(".bit").forEach(btn => btn.addEventListener("click", () => { if (S.answered) return; const i = +btn.dataset.i; S.bits[i] ^= 1;
        btn.classList.toggle("on", !!S.bits[i]); btn.textContent = S.bits[i]; btn.setAttribute("aria-pressed", String(!!S.bits[i])); updBits(); }));
      updBits();
    } else {
      const box = document.createElement("div"); box.className = "choices";
      q.input.opts.forEach(o => { const b = document.createElement("button"); b.type = "button"; b.className = "choice"; if (q.input.mono) b.style.fontFamily = "var(--mono)";
        b.textContent = o; b.setAttribute("aria-pressed", "false");
        b.addEventListener("click", () => { if (S.answered) return; S.sel = o; box.querySelectorAll(".choice").forEach(x => x.setAttribute("aria-pressed", String(x === b))); });
        box.appendChild(b); });
      area.appendChild(box);
    }
  }
  function updBits() { const s = S.bits.join(""); const el = $("bitval"); if (el) el.textContent = `目前：${grp(s)}`; }

  function current() { const q = S.q; if (q.input.kind === "text") return ($("ans").value || "").trim(); if (q.input.kind === "bits") return S.bits.join(""); return S.sel; }

  function finish(correct, revealed) {
    S.answered = true; $("btn-check").disabled = true; $("btn-show").disabled = true;
    if (!revealed) { S.total++; if (correct) { S.right++; S.streak++; if (S.streak > S.best) { S.best = S.streak; try { localStorage.setItem("bitlab-best", S.best); } catch (e) {} } } else S.streak = 0; }
    else S.streak = 0;
    renderScore();
    const fb = $("feedback"); fb.className = "feedback " + (correct ? "good" : "bad"); fb.hidden = false;
    const head = revealed ? "答案" : correct ? "答對了" : "未答對";
    fb.innerHTML = `<div class="verdict">${head}：${S.q.show}</div><ol class="steps">${S.q.explain.map(x => `<li>${x}</li>`).join("")}</ol>`;
    $("btn-next").focus({ preventScroll: true });
  }
  function check() {
    if (S.answered) return; const a = current();
    if (a === null || a === "") { const fb = $("feedback"); fb.className = "feedback bad"; fb.hidden = false; fb.innerHTML = `<div class="verdict">請先作答，或按「顯示答案」。</div>`; return; }
    const q = S.q; let ok;
    if (q.input.kind === "text") ok = norm(a).replace(/,/g, "") === norm(q.answer); else ok = a === q.answer;
    finish(ok, false);
  }
  $("btn-check").addEventListener("click", check);
  $("btn-show").addEventListener("click", () => { if (!S.answered) finish(false, true); });
  $("btn-next").addEventListener("click", next);

  renderNav(); renderScore(); next();
})();
</script>
</body>
</html>
