<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>位元練習室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --sunk:#E3E9E6; --ink:#17262A; --muted:#566A6E; --line:#C9D4D0;
  --accent:#0E7466; --accent-ink:#FFFFFF; --led:#E39B10; --led-glow:rgba(227,155,16,.35); --led-off:#D6DDDA;
  --good:#1F7A3A; --good-bg:#E3F3E7; --bad:#B3261E; --bad-bg:#FBE7E5;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1618; --surface:#162226; --sunk:#1D2C31; --ink:#E2ECE9; --muted:#95A9AB; --line:#2C3E43;
    --accent:#35BFA9; --accent-ink:#0B1413; --led:#F4B23C; --led-glow:rgba(244,178,60,.35); --led-off:#2A3A3F;
    --good:#5BD17E; --good-bg:#15301F; --bad:#FF8A80; --bad-bg:#3A1A18; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1618; --surface:#162226; --sunk:#1D2C31; --ink:#E2ECE9; --muted:#95A9AB; --line:#2C3E43;
  --accent:#35BFA9; --accent-ink:#0B1413; --led:#F4B23C; --led-glow:rgba(244,178,60,.35); --led-off:#2A3A3F;
  --good:#5BD17E; --good-bg:#15301F; --bad:#FF8A80; --bad-bg:#3A1A18; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;margin:0}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
h1{font-size:30px;font-weight:900;margin:0;letter-spacing:.02em;text-wrap:balance}
h1 .bits{display:inline-block;white-space:nowrap;font-family:var(--mono);font-weight:600;color:var(--accent);font-size:.7em;margin-left:.4em;letter-spacing:.08em}
.score{display:flex;gap:16px;font-variant-numeric:tabular-nums}
.score div{display:flex;flex-direction:column;align-items:flex-end}
.score b{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.1}
.score span{font-size:12px;color:var(--muted)}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav button{font:inherit;font-size:15px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
nav button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
nav button:focus-visible,.btn:focus-visible,.bit:focus-visible,input:focus-visible,.choice:focus-visible{outline:3px solid var(--led);outline-offset:2px}
.topic-note{font-size:14px;color:var(--muted);margin:-6px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.qtype{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--accent);text-transform:uppercase}
.qno{font-family:var(--mono);font-size:12px;color:var(--muted)}
.qright{display:flex;align-items:center;gap:12px;margin-left:auto}
.hintbtn{font:inherit;font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid var(--led);background:transparent;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.hintbtn::before{content:"?";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--led);color:#1A1204;font-family:var(--mono);font-size:12px}
.hintbtn[aria-expanded="true"]{background:var(--led);color:#1A1204}
.hintbtn[aria-expanded="true"]::before{background:#1A1204;color:var(--led)}
.hintbtn:focus-visible{outline:3px solid var(--led);outline-offset:2px}
.hintbox{border:1px solid var(--led);border-left-width:4px;border-radius:10px;padding:12px 14px;background:var(--sunk);font-size:15px;line-height:1.7;display:flex;flex-direction:column;gap:6px}
.hintbox h4{margin:0;font-size:13px;letter-spacing:.06em;color:var(--muted)}
.hintbox ol,.hintbox ul{margin:0;padding-left:1.3em}
.hintbox .ex{font-family:var(--mono);font-size:14px;background:var(--surface);border-radius:8px;padding:6px 10px;width:fit-content;max-width:100%;overflow-x:auto;white-space:pre}
.prompt{font-size:18px;line-height:1.7}
.prompt .num,.mono{font-family:var(--mono);font-weight:600;letter-spacing:.03em}
sub{font-size:.7em}
.given{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:.08em;background:var(--sunk);border-radius:10px;padding:10px 14px;display:block;width:fit-content;margin-top:6px;overflow-x:auto;max-width:100%}
.bitrow{display:flex;flex-direction:column;gap:6px;overflow-x:auto;padding-bottom:4px}
.bits{display:flex;gap:6px}
.bit{width:44px;height:52px;flex:0 0 auto;border-radius:8px;border:1px solid var(--line);background:var(--led-off);color:var(--muted);font-family:var(--mono);font-size:22px;font-weight:600;cursor:pointer;transition:background .12s,box-shadow .12s}
.bit.on{background:var(--led);color:#1A1204;border-color:var(--led);box-shadow:0 0 12px var(--led-glow)}
.bit.gap{margin-left:10px}
.weights{display:flex;gap:6px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.weights span{width:44px;flex:0 0 auto;text-align:center}
.weights span.gap{margin-left:10px}
.bitval{font-size:14px;color:var(--muted)}
.answer-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=text]{font-family:var(--mono);font-size:20px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:min(260px,100%)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.choice{font:inherit;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.btn{font:inherit;font-weight:700;padding:10px 18px;border-radius:10px;border:1px solid var(--accent);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent)}
.feedback{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.feedback.good{background:var(--good-bg)}
.feedback.bad{background:var(--bad-bg)}
.feedback .verdict{font-weight:700}
.feedback.good .verdict{color:var(--good)}
.feedback.bad .verdict{color:var(--bad)}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.steps li{line-height:1.6}
.swatch{display:inline-block;width:1.4em;height:1.4em;border-radius:4px;vertical-align:-.3em;border:1px solid var(--line);margin-left:.3em}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#btn-next{margin-left:auto}
#btn-next.skip{border-color:var(--line);color:var(--muted);font-weight:500}
#btn-next.confirm{border-color:var(--bad);color:var(--bad);font-weight:700}
.tips{font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:14px}
.tips b{color:var(--ink)}
@media (max-width:480px){h1{font-size:24px}.bit{width:34px;height:44px;font-size:18px}.weights span{width:34px}.given{font-size:20px}.prompt{font-size:16px}}
@media (prefers-reduced-motion:reduce){.bit{transition:none}}
.filter{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.filter summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:10px 14px;font-weight:700;font-size:15px}
.filter summary::-webkit-details-marker{display:none}
.filter summary::after{content:"▾";color:var(--muted);transition:transform .15s}
.filter[open] summary::after{transform:rotate(180deg)}
.filter summary:focus-visible{outline:3px solid var(--led);outline-offset:2px;border-radius:12px}
.fcount{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--muted);margin-left:auto}
.fcount.partial{color:var(--accent);font-weight:600}
.fbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.fact{display:flex;flex-wrap:wrap;gap:8px}
.fgroup{display:flex;flex-direction:column;gap:6px}
.fgroup h3{margin:0;font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;line-height:1.4;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sunk);border-color:var(--accent);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}
.chip[aria-pressed="true"]::before{content:"✓ ";color:var(--accent);font-weight:700}
.chip:focus-visible,.mini:focus-visible{outline:3px solid var(--led);outline-offset:2px}
.mini{font:inherit;font-size:13px;padding:4px 12px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.fhint{margin:0;font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:16px}
.vs{display:grid;width:fit-content;grid-template-columns:auto auto repeat(var(--w),auto) auto;row-gap:2px;align-items:end;font-family:var(--mono);font-weight:600;background:var(--sunk);border-radius:10px;padding:10px 14px;max-width:100%;overflow-x:auto;line-height:1.3}
.prompt .vs{font-size:22px;margin-top:6px}
.steps .vs{font-size:16px;margin:4px 0}
.vs span{min-width:1.25ch;text-align:center}
.vs span.g{padding-left:.8ch}
.vs .lab{font-family:var(--sans);font-size:.75em;color:var(--muted);padding-right:.5ch;text-align:right}
.vs .co{padding-right:.45ch}
.vs .cy{font-size:.6em;color:var(--bad)}
.vs .rl{border-top:2px solid var(--ink);padding-top:2px}
.vs .cut{color:var(--bad);text-decoration:line-through}
.vs .bad{color:var(--bad)}
.vs .nt{font-family:var(--sans);font-weight:400;font-size:.7em;color:var(--muted);padding-left:1.2ch;text-align:left;white-space:nowrap}
.stmts{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:16px}
.choices.monoc{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.bitrow .chunk{display:flex;flex-direction:column;gap:6px}
.bitrow.wide{gap:12px}
@media (max-width:480px){.prompt .vs{font-size:18px}.bit{width:30px}.weights span{width:30px;font-size:9px;letter-spacing:-.03em}.bit.gap,.weights span.gap{margin-left:8px}}
</style>

<style>[hidden]{display:none!important} body{margin:0} img{max-width:100%}</style>
</head>
<body>
<nav style="max-width:860px;margin:0 auto;padding:12px 16px 0;font-size:14px"><a href="index.html" style="color:var(--accent)">← 返回首頁</a></nav>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="eyebrow">HKDSE ICT · 必修 A b / A c</span>
      <h1>位元練習室<span class="bits">0100 0001</span></h1>
    </div>
    <div class="score" aria-live="polite">
      <div><b id="sc-right">0</b><span>答對</span></div>
      <div><b id="sc-total">0</b><span>已答</span></div>
      <div><b id="sc-streak">0</b><span>連續答對</span></div>
      <div><b id="sc-best">0</b><span>最佳紀錄</span></div>
    </div>
  </header>

  <nav id="modes" aria-label="練習類別"></nav>
  <p class="topic-note" id="mode-note"></p>

  <details class="filter" id="filter">
    <summary><span>題型篩選</span><span class="fcount" id="fcount"></span></summary>
    <div class="fbody">
      <div class="fact"><button type="button" class="mini" id="f-all">全選</button><button type="button" class="mini" id="f-none">全部取消</button></div>
      <div id="fchips"></div>
      <p class="fhint">點按題型可加入或移除。只會出已選的題型，選擇會記在這部裝置上。</p>
    </div>
  </details>

  <section class="card" id="card" aria-live="polite">
    <div class="qhead"><span class="qtype" id="qtype"></span><div class="qright"><span class="qno" id="qno"></span><button class="hintbtn" id="btn-hint" type="button" aria-expanded="false" aria-controls="hintbox">提示：計算方法</button></div></div>
    <div class="prompt" id="prompt"></div>
    <div class="hintbox" id="hintbox" hidden></div>
    <div id="input-area"></div>
    <div class="actions">
      <button class="btn primary" id="btn-check" type="button">核對答案</button>
      <button class="btn ghost" id="btn-show" type="button">顯示答案</button>
      <button class="btn ghost skip" id="btn-next" type="button">跳過此題</button>
    </div>
    <div id="feedback" hidden></div>
    <div class="tips" id="tips"></div>
  </section>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const bin = (n, w) => n.toString(2).padStart(w, "0");
  const hex = (n, w = 2) => n.toString(16).toUpperCase().padStart(w, "0");
  const grp = (s) => s.replace(/\B(?=(.{4})+$)/g, " ");
  const sub = (s, b) => `<span class="mono">${s}</span><sub>${b}</sub>`;
  const norm = (s) => String(s).replace(/[−–]/g, "-").toUpperCase().replace(/[\s₂₁₆]/g, "").replace(/^0X/, "").replace(/^#/, "").replace(/，/g, ",");
  const fmt = (n) => n.toLocaleString("en-US");
  const tc = (v, w = 8) => bin(v < 0 ? (1 << w) + v : v, w);

  // ---------- question generators ----------
  // each returns {type, prompt, input:{kind:'text'|'bits'|'choice', ...}, answer, accept?, explain:[...], tips}
  const G = {};

  // 進制互換
  G.base = [
    () => { const w = pick([8, 8, 12]); const n = R(1, (1 << w) - 1); const b = bin(n, w); const h = hex(n, w / 4);
      return { type: "二進制 → 十六進制", prompt: `把以下二進制數字轉換為十六進制：<div class="given">${grp(b)}<sub>2</sub></div>`,
        input: { kind: "text", ph: "例如 A3" }, answer: h, show: sub(h, 16),
        explain: [`由右至左每 4 位一組：${grp(b)}`, ...b.match(/.{4}/g).map(g => `${g} → ${parseInt(g, 2).toString(16).toUpperCase()}（${parseInt(g, 2)}）`), `答案：${h}<sub>16</sub>`] }; },
    () => { const n = R(1, 255); const h = hex(n); const b = bin(n, 8);
      return { type: "十六進制 → 二進制", prompt: `把 ${sub(h, 16)} 轉換為 8 位元二進制。點按下方的位元開關作答。`,
        input: { kind: "bits", w: 8 }, answer: b, show: sub(grp(b), 2),
        explain: [...h.split("").map(d => `${d} → ${bin(parseInt(d, 16), 4)}`), `合併：${grp(b)}<sub>2</sub>`] }; },
    () => { const n = R(1, 255); const b = bin(n, 8); const w = [128, 64, 32, 16, 8, 4, 2, 1];
      return { type: "二進制 → 十進制", prompt: `把以下二進制數字轉換為十進制：<div class="given">${grp(b)}<sub>2</sub></div>`,
        input: { kind: "text", ph: "十進制數值" }, answer: String(n), show: String(n),
        explain: [`把位值為 1 的位置相加：${b.split("").map((c, i) => c === "1" ? w[i] : null).filter(x => x !== null).join(" + ")} ＝ ${n}`] }; },
    () => { const n = R(1, 255); const b = bin(n, 8); const w = [128, 64, 32, 16, 8, 4, 2, 1];
      const parts = []; let r = n; w.forEach(x => { if (r >= x) { parts.push(x); r -= x; } });
      return { type: "十進制 → 二進制", prompt: `把十進制數字 <span class="num">${n}</span> 轉換為 8 位元二進制。`,
        input: { kind: "bits", w: 8 }, answer: b, show: sub(grp(b), 2),
        explain: [`由最大的位值開始減：${n} ＝ ${parts.join(" + ")}`, `對應位置設為 1：${grp(b)}<sub>2</sub>`] }; },
    () => { const n = R(16, 255); const h = hex(n);
      return { type: "十進制 → 十六進制", prompt: `把十進制數字 <span class="num">${n}</span> 轉換為十六進制。`,
        input: { kind: "text", ph: "例如 7F" }, answer: h, show: sub(h, 16),
        explain: [`${n} ÷ 16 ＝ ${Math.floor(n / 16)} 餘 ${n % 16}`, `商 ${Math.floor(n / 16)} → ${h[0]}，餘數 ${n % 16} → ${h[1]}`, `答案：${h}<sub>16</sub>`] }; },
    () => { const n = R(16, 255); const h = hex(n);
      return { type: "十六進制 → 十進制", prompt: `把 ${sub(h, 16)} 轉換為十進制。`,
        input: { kind: "text", ph: "十進制數值" }, answer: String(n), show: String(n),
        explain: [`${h[0]} × 16 ＋ ${h[1]} × 1 ＝ ${parseInt(h[0], 16)} × 16 ＋ ${parseInt(h[1], 16)} ＝ ${n}`] }; },
  ];

  // 二進制補碼
  // 二進制補碼（每個題型：name 用於篩選及顯示，group 用於分組）
  const sv = (b) => parseInt(b, 2) - (b[0] === "1" ? 2 ** b.length : 0);
  const sN = (v) => String(v).replace("-", "−");
  const pN = (v) => (v < 0 ? `（${sN(v)}）` : sN(v));
  const lim = (w) => [-(2 ** (w - 1)), 2 ** (w - 1) - 1];
  const tcw = (w) => Array.from({ length: w }, (_, i) => (i === 0 ? "−" + 2 ** (w - 1) : String(2 ** (w - 1 - i))));
  const inv = (s) => s.replace(/[01]/g, (c) => (c === "0" ? "1" : "0"));
  const wrap = (n, w) => bin(((n % 2 ** w) + 2 ** w) % 2 ** w, w);
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const RV = (w, o = {}) => { const [mn, mx] = lim(w); let v; do { v = R(o.min ?? mn, o.max ?? mx); } while (o.nz && v === 0); return v; };
  const isOver = (s, w) => { const [mn, mx] = lim(w); return s < mn || s > mx; };
  const hasCarry = (a, b, w) => parseInt(tc(a, w), 2) + parseInt(tc(b, w), 2) >= 2 ** w;
  // 直式加法（格線排版）。A、B 為位元字串；o.carry 顯示進位；o.result 顯示結果
  const vsum = (A, B, o = {}) => {
    const w = A.length; let c = 0; const res = [], cin = [];
    for (let i = w - 1; i >= 0; i--) { const s = +A[i] + +B[i] + c; res[i] = String(s % 2); cin[i] = c; c = s >> 1; }
    const cells = (arr, cls = "") => arr.map((x, i) => `<span class="${cls}${i && (w - i) % 4 === 0 ? " g" : ""}">${x}</span>`).join("");
    let h = `<div class="vs" style="--w:${w}">`;
    if (o.carry) h += `<span class="lab">進位</span><span class="co"></span>${cells(cin.map((x) => (x ? "1" : "")), "cy")}<span class="nt"></span>`;
    h += `<span class="lab"></span><span class="co"></span>${cells(A.split(""))}<span class="nt">${o.na || ""}</span>`;
    h += `<span class="lab">${o.op || "+"}</span><span class="co"></span>${cells(B.split(""))}<span class="nt">${o.nb || ""}</span>`;
    if (o.result) h += `<span class="lab"></span><span class="co rl${c ? " cut" : ""}">${c ? "1" : ""}</span>${cells(res, "rl" + (o.bad ? " bad" : ""))}<span class="nt">${o.nr || ""}${c ? "　最左進位捨棄" : ""}</span>`;
    return h + "</div>";
  };
  const verdict = (a, b, w) => {

  // ---------- 提示：每個題型的計算方法（按題型名稱） ----------
  const HINTS = {
    "二進制 → 十六進制": [["由右至左每 4 位一組，不足 4 位在左邊補 0。", "每組換成一個十六進制位：0000–1001 是 0–9，1010 是 A … 1111 是 F。"], "1011 0110\n  B    6   → B6"],
    "十六進制 → 二進制": [["每個十六進制位換成 4 位元（位值 8 4 2 1）。", "A＝10、B＝11、C＝12、D＝13、E＝14、F＝15。"], "3C → 0011 1100"],
    "二進制 → 十進制": [["寫出每個位置的位值：128 64 32 16 8 4 2 1。", "把位元是 1 的位值相加。"], "0101 0011 → 64 + 16 + 2 + 1 = 83"],
    "十進制 → 二進制": [["由最大的位值（128）開始比較。", "放得下就寫 1 並減去該位值；放不下就寫 0。", "亦可用短除法：連續除以 2，由下而上讀餘數。"], "83 = 64 + 16 + 2 + 1 → 0101 0011"],
    "十進制 → 十六進制": [["把數字除以 16。", "商是左邊一位，餘數是右邊一位（10–15 寫成 A–F）。"], "183 ÷ 16 = 11 餘 7 → B7"],
    "十六進制 → 十進制": [["左邊一位 × 16，再加上右邊一位。", "A–F 先換成 10–15。"], "B7 = 11 × 16 + 7 = 183"],
    "十進制 → 補碼數字": [["正數：直接轉為二進制，左邊補 0 至指定位元。", "負數：① 取它的正數轉為二進制 ② 補 0 至指定位元 ③ 反碼（0、1 互換）④ 加 1。", "另一方法（負數）：2ⁿ − 正數，再轉為二進制。"], "−44（8 位元）\n0010 1100   44\n1101 0011   反碼\n1101 0100   加 1"],
    "補碼數字 → 十進制": [["首位的位值是負數：4 位元是 −8，8 位元是 −128。", "其餘位值照常，把位元是 1 的位值相加。"], "1101 0100 = −128 + 64 + 16 + 4 = −44"],
    "二進制 → 指定位元補碼": [["① 左邊補 0 至指定位元。", "② 反碼。", "③ 加 1。", "一定要先補 0 才反碼，否則首位會變成 0。"], "−10110₂（8 位元）\n0001 0110   補 0\n1110 1001   反碼\n1110 1010   加 1"],
    "補碼與補碼數字": [["「X 的二進制補碼數字」：X 本身用補碼表示出來的樣子。", "「X 的二進制補碼」：對 X 反碼加 1，即 −X 的補碼數字（只用於正數 X）。", "先看清楚題目有沒有「數字」二字。"], "0000 1001   9 的補碼數字\n1111 0111   9 的補碼（即 −9）"],
    "負補碼 → 正數（減 1、反碼）": [["① 把補碼數字減 1。", "② 反碼，得到它的正數。", "③ 原本的數字就是這個正數加上負號。"], "1101 0100\n1101 0011   減 1\n0010 1100   反碼 = 44 → 原數是 −44"],
    "同一組位元，兩種讀法": [["無符號整數：所有位值都是正數，直接相加。", "補碼數字：首位位值是負數。", "首位是 1 時：補碼數值 = 無符號數值 − 2ⁿ（8 位元減 256）。"], "1010 0001\n無符號 161；補碼 161 − 256 = −95"],
    "符號延伸": [["看首位：首位是 0 就在左邊補 0，首位是 1 就補 1。", "數值保持不變。"], "1011（−5）→ 1111 1011（−5）"],
    "補碼的範圍": [["n 位元補碼的範圍是 −2ⁿ⁻¹ 至 2ⁿ⁻¹ − 1。", "負數比正數多一個。"], "4 位元：−8 至 7\n8 位元：−128 至 127"],
    "特別樣式與 −128 特例": [["最大值：首位 0，其餘全部是 1。", "最小值：首位 1，其餘全部是 0。", "0：全部是 0；−1：全部是 1。", "最小值「反碼加 1」後會得回自己，因為它的相反數超出範圍。"], "1000 0000 → 反碼 0111 1111 → 加 1 → 1000 0000"],
    "補碼數字排序": [["① 先分正負：首位是 1 的（負數）一定較小。", "② 同號的，比較其餘位元，較大的數值也較大。", "最穩妥：逐個轉為十進制再排。"], "1000(−8) < 1111(−1) < 0100(4) < 0111(7)"],
    "概念判斷（DSE 句子題）": [["逐句判斷，再選出正確的組合。", "常考：0 只有一種表示；範圍是 −2ⁿ⁻¹ 至 2ⁿ⁻¹ − 1；最小值是 1000…0；最左進位不等於溢出；異號相加不會溢出；只反碼不是相反數。"], ""],
    "溢出判斷": [["方法一：轉為十進制相加，看結果是否超出範圍（8 位元：−128 至 127）。", "方法二：兩個同號的數相加，結果卻變成異號 → 溢出。", "一正一負相加一定不會溢出；最左進位捨棄，不等於溢出。"], "0110 0100 + 0011 0010 = 1001 0110\n正 + 正 得負 → 溢出"],
    "補碼加法：計出結果": [["由右至左逐位相加：1 + 1 = 10（寫 0 進 1）；1 + 1 + 1 = 11（寫 1 進 1）。", "只保留指定的位元數，最左多出的進位捨棄。", "結果是 0 的話，兩個數必須互為相反數（反碼加 1）。"], "  1111 1111   (−1)\n+ 0000 0001   (1)\n 10000 0000 → 0000 0000"],
    "哪項加法會溢出（選擇題）": [["先刪去一正一負的選項，它們一定不會溢出。", "其餘的轉為十進制相加，看結果是否超出範圍。"], ""],
    "加 1、減 1 的邊界": [["補碼的數值像一個圓圈：最大值再加 1 會變成最小值。", "加一個正數，只有正數才可能溢出；減一個正數，只有負數才可能溢出。", "1111 1111（−1）加 1 有進位，但結果 0 正確，沒有溢出。"], "0111 1111 + 1 = 1000 0000\n127 + 1 → −128（溢出）"],
    "以加法做減法": [["A − B = A + (−B)。", "把 B 反碼加 1，得到 −B。", "A 與 −B 相加，捨棄最左進位。", "判斷溢出時，看 A 和 −B 的符號。"], "20 − 60 = 20 + (−60)\n0001 0100 + 1100 0100 = 1101 1000 (−40)"],
    "三種表示法（延伸）": [["負數的表示：符號及值 → 首位改為 1；一補碼 → 所有位元反轉；二補碼 → 反轉再加 1。", "範圍：符號及值和一補碼是 −127 至 127；二補碼是 −128 至 127。"], "−5\n1000 0101   符號及值\n1111 1010   一補碼\n1111 1011   二補碼"],
    "最少需要多少位元": [["找最小的 n，使 2ⁿ ≥ 物品數量。", "常用：2⁸ = 256，2¹⁰ = 1,024，2¹⁶ = 65,536。"], "500 件：2⁸ = 256 < 500 ≤ 2⁹ = 512 → 9 位元"],
    "十六進制編號的數量": [["每位十六進制數字有 16 個可能。", "d 位 → 16ᵈ 個編號，亦即 2⁴ᵈ。"], "3 位：16³ = 4,096"],
    "網頁顏色碼": [["#RRGGBB：每兩位是一種顏色成分的十六進制值（紅、綠、藍）。", "十進制 = 左位 × 16 + 右位。"], "#3A…：紅色 3A = 3 × 16 + 10 = 58"],
    "點陣圖大小": [["① k 種顏色需要 n 位元，使 2ⁿ = k。", "② 闊 × 高 × n = 位元。", "③ ÷ 8 = 字節。"], "32 × 32，16 種顏色\n32 × 32 × 4 = 4,096 位元 ÷ 8 = 512 字節"],
    "字符編碼與檔案大小": [["分開數英文字母（包括空格、符號）和中文字的數目。", "各自乘以每個字符的字節數，再相加。", "UTF-8：英文 1、中文 3；大五碼：英文 1、中文 2；UTF-16：每個字符 2。"], "「Hi 你好」UTF-8：3 × 1 + 2 × 3 = 9 字節"],
    "ASCII 碼": [["字母的編碼是連續的：'A' = 41₁₆（65），'a' = 61₁₆（97）。", "目標字母 = 基準編碼 + 相隔幾個字母，再轉為所需進制。"], "'D' = 41₁₆ + 3 = 44₁₆ = 0100 0100"],
    "字符集概念": [["ASCII：7 位元，128 個字符，只有英文。", "大五碼：繁體中文；國標碼：簡體中文；統一碼：世界上大部分語言。", "用錯編碼開啟文件會出現亂碼。"], ""],
    "計算同位位元": [["數一數數據中 1 的數目。", "偶同位：令 1 的總數（連檢驗位）是偶數。", "奇同位：令 1 的總數（連檢驗位）是奇數。"], "偶同位，數據有 3 個 1 → 檢驗位是 1"],
    "找出出錯的位元組": [["逐個位元組數 1 的數目（包括檢驗位）。", "不符合同位要求的，一定出錯。", "符合的只代表偵測不到錯誤（兩個位元同時出錯是偵測不到的）。"], ""],
    "計算檢查數位": [["按題目的公式計算（例如加權和）。", "求除以指定數字的餘數；除以 11 時，餘數 10 以 X 表示。"], "4×1 + 3×2 + 2×3 + 1×4 = 20，20 ÷ 10 餘 0 → 0"],
    "判斷編號是否有效": [["用編號的首幾位，按公式重新計算檢查數位。", "與編號最後一位比較：相同便有效，不同便無效。"], ""],
    "數據控制概念": [["奇偶檢驗只能偵測奇數個位元出錯。", "檢查數位不能偵測輸入了另一個有效編號。", "驗證（例如雙重輸入）檢查輸入的數據是否與來源一致。"], ""],
  };
  const hintHTML = (name) => { const h = HINTS[name]; if (!h) return "";
    return `<h4>計算方法：${esc(name)}</h4><ol>${h[0].map(x => `<li>${esc(x)}</li>`).join("")}</ol>${h[1] ? `<div class="ex">例：${h[1].includes("\n") ? "\n" : ""}${esc(h[1])}</div>` : ""}`; };

  // ---------- 題型清單（名稱用於篩選及顯示） ----------
  const named = (group, names, fns) => fns.map((fn, i) => ({ group, name: names[i], fn }));
  const ENTRIES = {
    base: named(null, ["二進制 → 十六進制", "十六進制 → 二進制", "二進制 → 十進制", "十進制 → 二進制", "十進制 → 十六進制", "十六進制 → 十進制"], G.base),
    tc: TC,
    bits: named(null, ["最少需要多少位元", "十六進制編號的數量", "網頁顏色碼", "點陣圖大小"], G.bits),
    chars: named(null, ["字符編碼與檔案大小", "ASCII 碼", "字符集概念"], G.chars),
    ctrl: named(null, ["計算同位位元", "找出出錯的位元組", "計算檢查數位", "判斷編號是否有效", "數據控制概念"],
      [G.ctrl[0], G.ctrl[1], () => G.ctrl[2](true), () => G.ctrl[2](false), G.ctrl[3]]),
  };

  const MODES = [
    { id: "base", name: "進制互換", note: "二進制、十進制、十六進制之間的轉換。二進制與十六進制互換時，每 4 位一組，毋須經過十進制。", tips: "<b>提示：</b>1 位十六進制 ＝ 4 位元。點按位元開關可以開或關該位元，下方數字是每個位置的位值。" },
    { id: "tc", name: "二進制補碼", note: "補碼的轉換、範圍及概念、加法與溢出誤差（4 位元及 8 位元），另有三種表示法的延伸題。可在「題型篩選」只練習指定題型。", tips: "<b>提示：</b>補碼最左一位的位值是負數（8 位元是 −128）。同號相加結果變號，便是溢出；最左有進位不等於溢出。" },
    { id: "bits", name: "位元與組合", note: "n 位元可表示的樣式數量、最少需要的位元數、網頁顏色碼及點陣圖大小。", tips: "<b>提示：</b>n 位元有 2ⁿ 種樣式；k 種狀態最少需要 n 位元，使 2ⁿ ≥ k。" },
    { id: "chars", name: "字符編碼", note: "ASCII、大五碼、統一碼（UTF-8／UTF-16）的字節計算及概念。", tips: "<b>提示：</b>逐類點算字符，空格和符號也是字符。題目會提供每種字符所佔的字節數。" },
    { id: "ctrl", name: "奇偶與檢查數位", note: "奇偶檢驗、檢查數位的計算，以及它們能或不能偵測的錯誤。", tips: "<b>提示：</b>奇偶檢驗只能偵測奇數個位元出錯；檢查數位不能偵測另一個有效編號。" },
  ];

  // ---------- state ----------
  const S = { hintOpen: false, mode: "base", q: null, entry: null, n: 0, answered: false, right: 0, total: 0, streak: 0, best: 0, sel: null, bits: [], on: {} };
  try { S.best = +localStorage.getItem("bitlab-best") || 0; } catch (e) {}
  try { const m = localStorage.getItem("bitlab-mode"); if (MODES.some(x => x.id === m)) S.mode = m; } catch (e) {}
  const hsh = location.hash.replace("#", ""); if (MODES.some(x => x.id === hsh)) S.mode = hsh;
  // 題型篩選：每個類別各自記住已選的題型名稱
  MODES.forEach(m => { S.on[m.id] = new Set(ENTRIES[m.id].map(e => e.name)); });
  try { const saved = JSON.parse(localStorage.getItem("bitlab-filter") || "{}");
    Object.keys(saved).forEach(id => { if (!ENTRIES[id] || !Array.isArray(saved[id])) return; const names = new Set(ENTRIES[id].map(e => e.name));
      const keep = saved[id].filter(n => names.has(n)); if (keep.length) S.on[id] = new Set(keep); }); } catch (e) {}
  const saveFilter = () => { try { const o = {}; Object.keys(S.on).forEach(id => { o[id] = [...S.on[id]]; }); localStorage.setItem("bitlab-filter", JSON.stringify(o)); } catch (e) {} };

  const nav = $("modes");
  MODES.forEach(m => { const b = document.createElement("button"); b.type = "button"; b.textContent = m.name; b.dataset.id = m.id;
    b.addEventListener("click", () => { S.mode = m.id; try { localStorage.setItem("bitlab-mode", m.id); } catch (e) {} renderNav(); renderFilter(); next(); }); nav.appendChild(b); });
  function renderNav() { [...nav.children].forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === S.mode)));
    const m = MODES.find(x => x.id === S.mode); $("mode-note").textContent = m.note; $("tips").innerHTML = m.tips; }

  function renderCount() {
    const all = ENTRIES[S.mode].length, on = S.on[S.mode].size; const el = $("fcount");
    el.textContent = on === all ? `全部 ${all} 種題型` : `已選 ${on}／${all} 種`; el.classList.toggle("partial", on !== all);
  }
  function renderFilter() {
    const box = $("fchips"); box.innerHTML = ""; const list = ENTRIES[S.mode]; const groups = [];
    list.forEach(e => { let g = groups.find(x => x.name === e.group); if (!g) { g = { name: e.group, items: [] }; groups.push(g); } g.items.push(e); });
    groups.forEach(g => {
      const wrap = document.createElement("div"); wrap.className = "fgroup";
      if (g.name) { const h = document.createElement("h3"); h.textContent = g.name; wrap.appendChild(h); }
      const chips = document.createElement("div"); chips.className = "chips";
      g.items.forEach(e => { const c = document.createElement("button"); c.type = "button"; c.className = "chip"; c.textContent = e.name;
        c.setAttribute("aria-pressed", String(S.on[S.mode].has(e.name)));
        c.addEventListener("click", () => { const set = S.on[S.mode]; set.has(e.name) ? set.delete(e.name) : set.add(e.name);
          c.setAttribute("aria-pressed", String(set.has(e.name))); saveFilter(); renderCount(); afterFilter(); });
        chips.appendChild(c); });
      if (g.name && groups.length > 1) { const only = document.createElement("button"); only.type = "button"; only.className = "mini"; only.textContent = `只練「${g.name}」`;
        only.addEventListener("click", () => { S.on[S.mode] = new Set(g.items.map(x => x.name)); saveFilter(); renderFilter(); afterFilter(); });
        const head = wrap.querySelector("h3"); head.style.display = "flex"; head.style.alignItems = "center"; head.style.gap = "10px"; head.appendChild(only); }
      wrap.appendChild(chips); box.appendChild(wrap);
    });
    renderCount();
  }
  function afterFilter() { // 目前題目的題型被移除、或之前沒有可選題型時，換一題
    if (!S.on[S.mode].size) { showEmpty(); return; }
    if (!S.q || !S.entry || !S.on[S.mode].has(S.entry.name)) next();
  }
  $("f-all").addEventListener("click", () => { S.on[S.mode] = new Set(ENTRIES[S.mode].map(e => e.name)); saveFilter(); renderFilter(); afterFilter(); });
  $("f-none").addEventListener("click", () => { S.on[S.mode] = new Set(); saveFilter(); renderFilter(); afterFilter(); });

  function renderScore() { $("sc-right").textContent = S.right; $("sc-total").textContent = S.total; $("sc-streak").textContent = S.streak; $("sc-best").textContent = S.best; }

  function showEmpty() {
    S.q = null; S.entry = null; $("qtype").textContent = ""; $("qno").textContent = "";
    $("prompt").innerHTML = `<p class="empty">請在上方「題型篩選」選擇至少一種題型。</p>`; $("input-area").innerHTML = ""; $("feedback").hidden = true;
    $("btn-check").disabled = true; $("btn-show").disabled = true; $("btn-next").disabled = true; $("filter").open = true;
    $("btn-hint").hidden = true; $("hintbox").hidden = true;
  }

  function next() {
    const pool = ENTRIES[S.mode].filter(e => S.on[S.mode].has(e.name));
    if (!pool.length) { showEmpty(); return; }
    let e = pick(pool); if (pool.length > 1 && S.entry && e.name === S.entry.name) e = pick(pool.filter(x => x.name !== S.entry.name));
    S.entry = e; S.q = e.fn(); S.n++; S.answered = false; S.sel = null; $("btn-next").disabled = false;
    const q = S.q; $("qtype").textContent = e.name; $("qno").textContent = `第 ${S.n} 題`;
    $("hintbox").innerHTML = hintHTML(e.name); $("btn-hint").hidden = !HINTS[e.name]; S.hintOpen = false; setHint(false); updNext();
    $("prompt").innerHTML = q.prompt + (q.note ? `<p style="font-size:14px;color:var(--muted);margin:8px 0 0">${q.note}</p>` : "");
    const area = $("input-area"); area.innerHTML = ""; $("feedback").hidden = true; $("btn-check").disabled = false; $("btn-show").disabled = false;
    if (q.input.kind === "text") {
      const row = document.createElement("div"); row.className = "answer-row";
      row.innerHTML = `<label for="ans" class="bitval">你的答案</label><input id="ans" type="text" autocomplete="off" spellcheck="false" placeholder="${q.input.ph || ""}">`;
      area.appendChild(row); const inp = $("ans"); inp.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); S.answered ? next() : check(); } }); inp.focus({ preventScroll: true });
    } else if (q.input.kind === "bits") {
      const w = q.input.w; S.bits = Array(w).fill(0);
      const wt = q.input.weights || Array.from({ length: w }, (_, i) => String(2 ** (w - 1 - i)));
      const chunks = []; for (let s0 = 0; s0 < w; s0 += 8) chunks.push([s0, Math.min(w, s0 + 8)]); // 多於 8 位元時分行顯示，每行 8 位
      const gap = (i, s0) => (i > s0 && (w - i) % 4 === 0 ? " gap" : "");
      const box = document.createElement("div"); box.className = "bitrow" + (w > 8 ? " wide" : "");
      box.innerHTML = chunks.map(([s0, e0]) => { const idx = []; for (let i = s0; i < e0; i++) idx.push(i);
        return `<div class="chunk"><div class="bits" role="group" aria-label="位元開關 ${s0 + 1}–${e0}">${idx.map(i => `<button type="button" class="bit${gap(i, s0)}" data-i="${i}" aria-label="第 ${i + 1} 位" aria-pressed="false">0</button>`).join("")}</div>
        <div class="weights" aria-hidden="true">${idx.map(i => `<span class="${gap(i, s0).trim()}">${wt[i]}</span>`).join("")}</div></div>`; }).join("") + `<div class="bitval" id="bitval"></div>`;
      area.appendChild(box);
      box.querySelectorAll(".bit").forEach(btn => btn.addEventListener("click", () => { if (S.answered) return; const i = +btn.dataset.i; S.bits[i] ^= 1;
        btn.classList.toggle("on", !!S.bits[i]); btn.textContent = S.bits[i]; btn.setAttribute("aria-pressed", String(!!S.bits[i])); updBits(); }));
      updBits();
    } else {
      const box = document.createElement("div"); box.className = "choices" + (q.input.mono ? " monoc" : "");
      q.input.opts.forEach(o => { const b = document.createElement("button"); b.type = "button"; b.className = "choice"; if (q.input.mono) b.style.fontFamily = "var(--mono)";
        b.textContent = o; b.setAttribute("aria-pressed", "false");
        b.addEventListener("click", () => { if (S.answered) return; S.sel = o; box.querySelectorAll(".choice").forEach(x => x.setAttribute("aria-pressed", String(x === b))); });
        box.appendChild(b); });
      area.appendChild(box);
    }
  }
  function updBits() { const s = S.bits.join(""); const el = $("bitval"); if (el) el.textContent = `目前：${grp(s)}`; }

  function current() { const q = S.q; if (q.input.kind === "text") return ($("ans").value || "").trim(); if (q.input.kind === "bits") return S.bits.join(""); return S.sel; }

  function finish(correct, revealed) {
    S.answered = true; $("btn-check").disabled = true; $("btn-show").disabled = true;
    if (!revealed) { S.total++; if (correct) { S.right++; S.streak++; if (S.streak > S.best) { S.best = S.streak; try { localStorage.setItem("bitlab-best", S.best); } catch (e) {} } } else S.streak = 0; }
    else S.streak = 0;
    renderScore();
    const fb = $("feedback"); fb.className = "feedback " + (correct ? "good" : "bad"); fb.hidden = false;
    const head = revealed ? "答案" : correct ? "答對了" : "未答對";
    fb.innerHTML = `<div class="verdict">${head}：${S.q.show}</div><ol class="steps">${S.q.explain.map(x => `<li>${x}</li>`).join("")}</ol>`;
    updNext(); $("btn-next").focus({ preventScroll: true });
  }
  function check() {
    if (S.answered || !S.q) return; const a = current();
    if (a === null || a === "") { const fb = $("feedback"); fb.className = "feedback bad"; fb.hidden = false; fb.innerHTML = `<div class="verdict">請先作答，或按「顯示答案」。</div>`; return; }
    const q = S.q; let ok;
    if (q.input.kind === "text") { const g = norm(a).replace(/,/g, ""); ok = [q.answer, ...(q.accept || [])].some(x => g === norm(x)); } else ok = a === q.answer;
    finish(ok, false);
  }
  function setHint(open) { $("hintbox").hidden = !open; $("btn-hint").setAttribute("aria-expanded", String(open)); }
  $("btn-hint").addEventListener("click", () => { S.hintOpen = $("hintbox").hidden; setHint(S.hintOpen); });
  $("btn-check").addEventListener("click", check);
  $("btn-show").addEventListener("click", () => { if (!S.answered && S.q) finish(false, true); });
  // 防止誤按：未作答時按鈕是「跳過此題」，要按兩次才會換題；作答後才變成「下一題」
  let skipTimer = null;
  function updNext(confirming) {
    const b = $("btn-next"); clearTimeout(skipTimer); b.classList.remove("primary", "ghost", "skip", "confirm");
    if (S.answered) { b.classList.add("primary"); b.textContent = "下一題 →"; }
    else if (confirming) { b.classList.add("ghost", "confirm"); b.textContent = "再按一次確認跳過"; skipTimer = setTimeout(() => updNext(false), 3000); }
    else { b.classList.add("ghost", "skip"); b.textContent = "跳過此題"; }
  }
  $("btn-next").addEventListener("click", () => {
    if (S.answered) return next();
    if ($("btn-next").classList.contains("confirm")) return next();
    updNext(true);
  });

  renderNav(); renderFilter(); renderScore(); next();
})();
</script>
</body>
</html>
