D1.unit({"id":"u8","title":"追蹤表","book":"教科書 D1 第 3 章 p.110–121（另有 p.166 課題練習）","key":"D1-u8-hmac-7e3b19d40f","sections":[{"id":"s1","title":"逐句追蹤表","pages":"教科書 p.110–111","learn":[{"pts":["算法有循環和選擇時，單憑目測和心算容易出錯。（p.110）","**追蹤表（trace table）**逐步追蹤變量的值、輸入和輸出，有助理解算法，甚至找出錯處。（p.110）","逐句追蹤表：每一行偽代碼一行，只寫改變了的值（不變可留空）。（p.111 提示）","考試時可用簡化版：只寫新值，把舊值刪去。（p.110 旁註）"]},{"sim":{"code":"A ← 1\nB ← 2\nC ← A + B\n輸出 C\nA ← B + C\n輸出 A\nB ← C + A\n輸出 A, B, C","open":["trace"]},"cap":"活動 3.2 第 1 題（p.111）：逐步執行，看追蹤表怎樣一行一行填上。"}],"tries":[{"id":"u8-s1-t1","pts":5,"src":"教科書 p.111 活動 3.2 第 1 題","code":"A ← 1\nB ← 2\nC ← A + B\n輸出 C\nA ← B + C\n輸出 A\nB ← C + A\n輸出 A, B, C","q":"先估：整個算法的輸出是什麼？（所有輸出按次序，用空格分隔）","options":["3 5 5 8 3","3 5 5 6 3","3 3 5 8 3","3 5 8"],"open":["trace"],"why":"C = 3 → 輸出 3；A = 5 → 輸出 5；B = 3 + 5 = 8 → 輸出 5 8 3。"}],"practice":[{"id":"u8-s1-p1","type":"trace","pts":3,"src":"教科書 p.111 活動 3.2 第 2 題","label":"追蹤表填格","code":"A ← 1\nB ← 2\nC ← A * B\nA ← B + C\nB ← C + A\n輸出 A, B, C","spec":{"mode":"stmt","cols":["A","B","C"]},"hint":"`B ← C + A` 用的是 A 的新值。"},{"id":"u8-s1-p2","type":"mc","pts":3,"src":"教科書 p.110","q":"以下哪一項**不是**追蹤表的作用？","options":["逐步理解算法","追蹤變量的值","找出算法的錯處","令算法執行得更快"],"answer":3,"hint":"追蹤表是幫人理解算法的工具。"}]},{"id":"s2","title":"每次循環一行","pages":"教科書 p.112–116","learn":[{"pts":["有循環時逐句追蹤會很冗長；可以**每次循環寫一行**：「進入循環前」，然後「完成 i = 1 的循環體後」……（p.112）","for 循環：第一欄寫循環計數器 i。（p.112）","while 循環：第一欄改寫**循環條件的結果**（True／False），最後一行 False 表示沒有進入下一次循環——可以數到循環次數。（p.113 例題 3.1）","後測循環：先寫循環體的結果，**最後一欄**才寫條件。（p.114）"]},{"sim":{"code":"X ← 4\nY ← 3\n當 Y \u003c 10\n    Y ← X - Y\n    X ← X + Y\n    輸出 X","open":["trace"]},"cap":"例題 3.1（p.113）：追蹤表已選「每次循環一行」，第一欄是條件 Y \u003c 10。"}],"tries":[{"id":"u8-s2-t1","pts":5,"src":"教科書 p.113 例題 3.1","code":"X ← 4\nY ← 3\n當 Y \u003c 10\n    Y ← X - Y\n    X ← X + Y\n    輸出 X","q":"先估：輸出是什麼？","options":["5 9 14 23 37","5 9 14 23","5 9 14 23 37 60","37"],"open":["trace"],"why":"第五次循環後 Y = 14，條件 14 \u003c 10 不成立，沒有第六次。"}],"practice":[{"id":"u8-s2-p1","type":"trace","pts":3,"src":"教科書 p.114 測試站 3.1 第 1 題（參考 DSE 2017 1A Q31）","label":"追蹤表填格","q":"完成追蹤表（每次循環一行）。","code":"X ← 0\n設 k 由 1 至 5\n    X ← X + k * k\n輸出 X","spec":{"mode":"iter","cols":["X"]},"hint":"X = 1 + 4 + 9 + 16 + 25。"},{"id":"u8-s2-p2","type":"mc","pts":3,"src":"教科書 p.116 測試站 3.1 第 4 題（參考 DSE 2019 1A Q32）","verify":true,"ask":{"count":5},"q":"有多少個字串 \"Loop\" 會被輸出？","code":"X ← 15\nY ← 2\n當 X > Y\n    X ← X + 1\n    Y ← Y + Y\n    輸出 \"Loop\"","options":["2","4","8","32"],"hint":"Y：2 → 4 → 8 → 16 → 32；X：15 → 16 → 17 → 18 → 19。"}]},{"id":"s3","title":"後測循環與輸入","pages":"教科書 p.114–117","learn":[{"pts":["「重複…直至」：先執行循環體，再檢查條件；條件**成立才離開**。（p.115 第 3 題）","循環中有「輸入」時，按次序把每組輸入填進追蹤表。（p.116 第 5 題）","可以反過來推算：由輸出倒推用家的輸入。（p.117 第 6(d) 題）"]},{"sim":{"code":"輸入 X, Y\n重複\n    X ← X + 10\n    Y ← X - Y\n    Z ← X + Y\n    輸出 Y\n直至 Z > 50\n輸出 X","inputs":"5, 8","open":["trace"]},"cap":"測試站 3.1 第 6 題（p.117，參考 DSE 2012 1B Q3）：原題是流程圖，這裏寫成等效偽代碼。"}],"tries":[{"id":"u8-s3-t1","pts":5,"src":"教科書 p.115 測試站 3.1 第 3 題","code":"X ← 1\nY ← 3\nZ ← 0\n重複\n    X ← X + Y\n    Y ← X + X\n    Z ← Z + 1\n直至 Y > 20\n輸出 X, Z","q":"先估：輸出是什麼？","options":["4 1","12 2","36 3","108 4"],"open":["trace"],"why":"第一次：X = 4、Y = 8、Z = 1（8 > 20 不成立）；第二次：X = 12、Y = 24、Z = 2（成立，離開）。"}],"practice":[{"id":"u8-s3-p1","type":"fill","pts":4,"src":"教科書 p.116 測試站 3.1 第 5 題","q":"用戶依次輸入「70, 80」、「50, 90」及「45, 100」。Z 的輸出值是什麼？","code":"Z ← 0\n設 N 由 1 至 3\n    輸入 X, Y\n    Z ← Z + X * 0.6 + Y * 0.4\n輸出 Z","inputs":"70, 80, 50, 90, 45, 100","blanks":[{"label":"Z","ask":"out"}],"hint":"74 + 66 + 67。"},{"id":"u8-s3-p2","type":"complete","pts":3,"src":"教科書 p.117 測試站 3.1 第 6(b) 題","label":"補完偽代碼","q":"加入變量 count，計算有多少個 Y 被輸出。會用多組數據測試。","template":"count ← ［1］\n輸入 X, Y\n重複\n    X ← X + 10\n    Y ← X - Y\n    Z ← X + Y\n    輸出 Y\n    count ← ［2］\n直至 Z > 50\n輸出 X\n輸出 count","ref":["0","count + 1"],"tests":[{"inputs":"5, 8"},{"inputs":"1, 9"},{"inputs":"45, 2"}],"hint":"每輸出一個 Y，count 加 1。"}]},{"id":"s4","title":"循環內及循環後的選擇","pages":"教科書 p.118–121","learn":[{"pts":["循環體內有決策時，追蹤表要加一欄寫**每次的判斷結果**（例如 i \u003c 3）。（p.118 例題 3.2）","決策在循環**之外**時，可以用兩個追蹤表：先追蹤循環，再追蹤循環後的選擇。（p.119）","計算循環次數的變量（例如 Z ← Z + 1）可以記錄循環執行了多少次。（p.119）"]},{"sim":{"code":"X ← 2\nY ← 3\n設 i 由 1 至 4\n    如果 i \u003c 3 則\n        X ← X * 2\n        輸出 i\n    否則\n        Y ← Y * 2\n        Z ← X + Y\n輸出 Z","open":["trace"]},"cap":"例題 3.2 第 1 題（p.118，參考 DSE 2020 1A Q32）：追蹤表多了一欄「i \u003c 3」。"}],"tries":[{"id":"u8-s4-t1","pts":5,"src":"教科書 p.118 例題 3.2 第 1 題","code":"X ← 2\nY ← 3\n設 i 由 1 至 4\n    如果 i \u003c 3 則\n        X ← X * 2\n        輸出 i\n    否則\n        Y ← Y * 2\n        Z ← X + Y\n輸出 Z","q":"先估：輸出是什麼？","options":["1 2 20","1 2 14 20","1 2 3 4 20","2 4 20"],"open":["trace"],"why":"i = 1、2 輸出 i；i = 3、4 只計算 Z，Z 最後是 8 + 12 = 20，循環後才輸出。"}],"practice":[{"id":"u8-s4-p1","type":"trace","pts":3,"src":"教科書 p.120 測試站 3.2 第 1 題（參考 DSE 2020 1A Q32）","label":"追蹤表填格","q":"用家輸入「1, 2」。完成追蹤表。","code":"輸入 X, Y\n設 N 由 1 至 4\n    如果 N \u003c 3 則\n        輸出 N + 1\n    否則\n        Z ← X + Y\n        Y ← Y + X\n        X ← Z\n        輸出 Z","inputs":"1, 2","spec":{"mode":"iter","cols":["X","Y","Z"]},"hint":"N = 3 時：Z = 3、Y = 3、X = 3。"},{"id":"u8-s4-p2","type":"mc","pts":3,"src":"教科書 p.120 測試站 3.2 第 2 題","verify":true,"inputs":"1, 2","q":"用家輸入了「1, 2」。輸出會是什麼？","code":"輸入 X, Y\n設 N 由 1 至 6\n    如果 N \u003c= 2 則\n        輸出 X\n    否則如果 N \u003c= 4 則\n        Y ← X + Y\n        輸出 Y\n    否則\n        X ← Y + 2\n        輸出 X","options":["1 1 3 5 5 5","1 1 3 5 5 7","1 1 3 4 6 6","1 1 3 4 6 8"],"hint":"N = 5、6 時，X 都是 Y + 2，Y 已不再改變。"}]},{"id":"write","kind":"write","title":"寫算法","pages":"教科書 p.115–117","intro":"在編輯器寫偽代碼，可以先按「▶ 下一步」並打開追蹤表自己測試，再按「提交評核」。","tasks":[{"id":"u8-w1","tier":"必做","title":"平方數之和（while 循環）","pts":20,"src":"教科書 p.115 測試站 3.1 第 1(c) 題","prompt":"輸入 `N`，用 **while 循環**計算 1² + 2² + … + N² 並輸出。\n例如輸入 5，輸出 55。","starter":"輸入 N\nX ← 0\n","ref":"輸入 N\nX ← 0\nk ← N\n當 k > 0\n    X ← X + k * k\n    k ← k - 1\n輸出 X","rules":[{"re":"^當 ","msg":"這題要用 while 循環（「當 條件」）。"}],"tests":[{"inputs":"5","show":true},{"inputs":"1"},{"inputs":"3"},{"inputs":"10"},{"inputs":"0"}],"hint":"可以由 N 倒數：`k ← N`、`當 k > 0`，循環體內 `X ← X + k * k` 和 `k ← k - 1`。也可以由 1 數上去。"},{"id":"u8-w2","tier":"進階","title":"計算輸出了多少個 Y","pts":10,"src":"教科書 p.117 測試站 3.1 第 6 題（參考 DSE 2012 1B Q3）","prompt":"寫出完整算法：輸入 X、Y；重複「X 加 10；Y ← X − Y；Z ← X + Y；輸出 Y」，直至 Z > 50。最後輸出 X，再輸出 count（輸出了多少個 Y）。","starter":"count ← 0\n輸入 X, Y\n","ref":"count ← 0\n輸入 X, Y\n重複\n    X ← X + 10\n    Y ← X - Y\n    Z ← X + Y\n    輸出 Y\n    count ← count + 1\n直至 Z > 50\n輸出 X\n輸出 count","tests":[{"inputs":"5, 8","show":true},{"inputs":"1, 9"},{"inputs":"45, 2"},{"inputs":"0, 0"}],"hint":"用「重複…直至 Z > 50」；count 在循環體內加 1。"},{"id":"u8-w3","tier":"挑戰","title":"數 \"Loop\"","pts":5,"src":"教科書 p.116 測試站 3.1 第 4 題","prompt":"輸入 X 和 Y（Y 大於 0）。當 X > Y 時重複：X 加 1、Y 變成 Y + Y。最後輸出循環執行了多少次。\n例如輸入 15, 2，輸出 4。","starter":"輸入 X, Y\n","ref":"輸入 X, Y\nn ← 0\n當 X > Y\n    X ← X + 1\n    Y ← Y + Y\n    n ← n + 1\n輸出 n","tests":[{"inputs":"15, 2","show":true},{"inputs":"1, 2"},{"inputs":"16, 2"},{"inputs":"100, 3"}],"hint":"加一個計數變量，循環前設為 0。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.110、p.115–117、p.166","items":[{"id":"u8-q1","pts":4,"src":"教科書 p.115 測試站 3.1 第 2 題（參考 DSE 2017 1A Q31）","tags":[{"t":"hot","why":"空運行迴圈算法的輸出：2013 甲30（72%）、2014 甲33（69%）、2015 甲31（67%）、2017 甲31（77%）、2020 甲31（68%）"}],"verify":true,"q":"Y 的輸出值是什麼？","code":"X ← 1\nY ← 1\n當 X \u003c= 10\n    X ← X + 1\n    Y ← Y + 2\n輸出 Y","options":["1","19","21","23"],"answer":"C","why":"循環執行 10 次（X 由 1 至 10），Y = 1 + 2 × 10 = 21。"},{"id":"u8-q2","pts":4,"src":"教科書 p.110 活動 3.1","tags":[{"t":"hot","why":"空運行迴圈算法的輸出：2013 甲30（72%）、2014 甲33（69%）、2015 甲31（67%）、2017 甲31（77%）、2020 甲31（68%）"}],"verify":true,"q":"以下算法的輸出是什麼？","code":"X ← 2\nY ← 3\n設 i 由 1 至 6\n    如果 i \u003c 3 則\n        X ← X + 1\n        Y ← X - Y\n        輸出 Y\n    否則\n        Z ← X + Y\n        X ← Z + 2\n        輸出 Z","options":["0 4 8 14 20 26","0 4 8 14 24 42","0 4 4 6 8 12","0 4 8 12 16 20"],"answer":"A","why":"i = 1：X = 3、Y = 0；i = 2：X = 4、Y = 4；之後 Y 不變（4），每次 Z = X + Y、X = Z + 2：8、14、20、26。"},{"id":"u8-q3","pts":4,"src":"教科書 p.166 課題練習 選擇題 1","verify":true,"q":"以下算法的輸出是什麼？","code":"A ← 19\nB ← 3\n重複\n    A ← A - B\n    輸出 \"1\"\n直至 B > A","options":["1","11111","111111","1111111"],"answer":"C","why":"A：16、13、10、7、4、1，第六次後 3 > 1 成立。"},{"id":"u8-q4","pts":4,"src":"教科書 p.117 測試站 3.1 第 6(a) 題（參考 DSE 2012 1B Q3）","verify":true,"inputs":"5, 8","q":"用家輸入 X = 5 和 Y = 8。算法的輸出是什麼？","code":"輸入 X, Y\n重複\n    X ← X + 10\n    Y ← X - Y\n    Z ← X + Y\n    輸出 Y\n直至 Z > 50\n輸出 X","options":["7 18 17 35","7 18 17","7 18 35","15 25 35"],"answer":"A","why":"Z：22、43、52；Z = 52 時離開，最後輸出 X = 35。"},{"id":"u8-q5","pts":4,"src":"教科書 p.115 測試站 3.1 第 1(c) 題（參考 DSE 2018 1A Q30）","q":"以下算法要計算 5² + 4² + 3² + 2² + 1²。空格應填上什麼條件？","code":"X ← 0\nk ← 5\n當 ＿＿＿＿\n    X ← X + k * k\n    k ← k - 1\n輸出 X","options":["k > 0","k \u003c 5","k >= 5","k = 0"],"answer":"A","why":"k 由 5 減至 1 都要執行；k = 0 時停止（k >= 1、k >= 0 亦可）。"}]},{"id":"more","kind":"endless","title":"無限練習","gens":["forloop","whileloop","postloop","ifelse"],"intro":"隨機生成循環空運行題目；建議在紙上畫追蹤表再作答。答案由模擬器計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]});
