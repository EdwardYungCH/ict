D1.unit({"id":"u6","title":"布爾邏輯","book":"教科書 D1 第 2 章 p.60–73（另有 p.101、p.104、p.106 課題練習）","key":"D1-u6-hmac-c4a8e1f739","sections":[{"id":"s1","title":"AND、OR、NOT 與真值表","pages":"教科書 p.60–63","learn":[{"pts":["多於一個條件時，除了嵌套條件語句，還可用**布爾運算符**把條件結合成**複合布爾算式**。（p.60）","布爾運算符又稱**邏輯運算符**：AND（及）、OR（或）、NOT（不成立）。（p.60 表 2.10）","**AND**：兩個算式**同時**成立，結果才是 True；只要一個不成立便是 False。（p.62）","**OR**：只要**一個**成立，結果便是 True；兩個都不成立才是 False。（p.62）","**NOT**：把結果反轉。（p.63）","**真值表**列出所有條件結果的組合及運算後的結果。（p.62）"]},{"table":{"head":["X","Y","X AND Y","X OR Y","NOT X"],"rows":[["True","True","True","True","False"],["True","False","False","True","False"],["False","True","False","True","True"],["False","False","False","False","True"]]},"cap":"表 2.14–2.16 真值表（p.63）"},{"note":"擴闊視野（p.62）：日常說「咖啡或茶？」通常只可以選一樣（排斥性的 OR）；程式中的 OR 是**兼容性**的——兩個都成立時，X OR Y 也是 True。"},{"sim":{"code":"A ← 1\nB ← 5\nr1 ← (A = 1) AND (B > 2)\nr2 ← (A = 1) OR (B > 2)\nr3 ← NOT (A = 1)\n輸出 r1, r2, r3","open":[]},"cap":"表 2.11–2.13 的例子：逐步執行，「說明」會列出每個條件的結果。"}],"tries":[{"id":"u6-s1-t1","pts":5,"src":"教科書 p.61 實驗站 2.1（SHERLOCKED）","code":"a ← True\ns ← False\n輸出 a AND s, a OR s, NOT a","q":"先估：只按下了「a」鍵（a 為 True，s 為 False）。輸出是什麼？","options":["False True False","True True False","False False True","True False False"],"why":"AND 要兩個都成立 → False；OR 一個成立便可 → True；NOT a → False。"}],"practice":[{"id":"u6-s1-p1","type":"fill","pts":4,"src":"教科書 p.63 表 2.15","label":"真值表","q":"完成 OR 運算符的真值表。","code":"r1 ← True OR True\nr2 ← True OR False\nr3 ← False OR True\nr4 ← False OR False","blanks":[{"label":"True OR True","ask":{"var":"r1"}},{"label":"True OR False","ask":{"var":"r2"}},{"label":"False OR True","ask":{"var":"r3"}},{"label":"False OR False","ask":{"var":"r4"}}],"hint":"只要一個是 True，OR 的結果便是 True。"},{"id":"u6-s1-p2","type":"mc","pts":2,"src":"教科書 p.62 擴闊視野","q":"程式中，X 和 Y 都是 True。`X OR Y` 的結果是什麼？","options":["True","False","出錯，因為 OR 只可以有一個成立","視乎程式語言"],"answer":0,"hint":"程式中的 OR 是兼容性的。"}]},{"id":"s2","title":"複合布爾算式與優先次序","pages":"教科書 p.64–67","learn":[{"pts":["先處理**括號**內的算式，跟數學一樣。（p.64 備註）","方法：用真值表**逐層分拆**，先算最內層，再把結果帶到外層。（p.64）","沒有括號時，優先次序是 **NOT > AND > OR**（類似「先乘除，後加減」）。（p.67）","例：`NOT X OR Y AND Z` 要解讀成 `(NOT X) OR (Y AND Z)`。（p.67）","捷徑：AND 中有一個 False → 整個 False；OR 中有一個 True → 整個 True。（p.65 想像）"]},{"fix":"教科書 p.64 例題 2.6 選項 C 的分析表，第三欄表頭印作「(A > B) OR (B > 1)」，應為「(A > B) OR (B \u003c 1)」（欄中數值 False 是按 B \u003c 1 計算的）。"},{"sim":{"code":"A ← 1\nB ← 2\n如果 ((A > B) OR (B > 1)) AND (A \u003c= 1) 則\n    輸出 \"真\"\n否則\n    輸出 \"假\"","open":[]},"cap":"例題 2.6 第 1 題選項 B（A = 1、B = 2）。逐步執行時，「說明」會由內至外列出每一層的結果。"}],"tries":[{"id":"u6-s2-t1","pts":5,"src":"教科書 p.67 擴闊視野（優先次序）","code":"X ← True\nY ← False\nZ ← True\n輸出 NOT X OR Y AND Z","q":"先估：沒有括號，輸出是什麼？","options":["True","False"],"why":"先 NOT，再 AND，最後 OR：(NOT X) OR (Y AND Z) = False OR False = False。"}],"practice":[{"id":"u6-s2-p1","type":"fill","pts":3,"src":"教科書 p.65 例題 2.6 想像","q":"A = 1、B = 2。以下兩個算式的結果是 True 還是 False？","code":"A ← 1\nB ← 2\nr1 ← (A > B) AND ((B \u003c 1) OR (A > 1))\nr2 ← ((NOT(B > A)) AND (B \u003c 1)) OR (A \u003c= 1)","blanks":[{"label":"r1","ask":{"var":"r1"}},{"label":"r2","ask":{"var":"r2"}}],"hint":"r1：AND 左邊 A > B 已是 False。r2：OR 右邊 A \u003c= 1 已是 True。"},{"id":"u6-s2-p2","type":"mc","pts":3,"src":"教科書 p.67 測試站 2.5 第 1 題（參考 DSE 2020 1A Q5）","q":"A = 1 和 B = 1，下列哪些布爾算式的結果是「真」？\n(1) `(A > B) OR (B > A)`\n(2) `(A > -1) AND (A = B)`\n(3) `(A >= B) AND (B >= A)`","options":["只有 (1) 和 (2)","只有 (2) 和 (3)","只有 (1) 和 (3)","(1)、(2) 和 (3)"],"answer":1,"hint":"A 和 B 相等：A > B 和 B > A 都不成立。"}]},{"id":"s3","title":"數線與數值範圍","pages":"教科書 p.69–70","learn":[{"pts":["用**數線**找出不等式的數值範圍：實心點包括該數，空心點不包括。（p.69）","`80 \u003c= mark AND mark \u003c= 90`：兩段範圍**重疊**的部分（80 至 90）。（p.69）","`mark \u003c 0 OR 100 \u003c mark`：0 以左**加上** 100 以右。（p.69）","`NOT(0 \u003c= mark)` 即 `mark \u003c 0`。（p.69）","溫氏圖表示兩個集合的關係；數線表示一個數值的範圍。（p.69 提示）"]},{"fix":"教科書 p.69 NOT(0 \u003c= mark) 的數線，陰影在 0 左方，但箭咀印成指向右方，應指向左方。"},{"sim":{"code":"輸入 mark\n如果 mark \u003c 0 OR mark > 100 則\n    輸出 \
