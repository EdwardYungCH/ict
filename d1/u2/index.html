D1.unit({"id":"u2","title":"拆解問題與計算思維","book":"教科書 D1 第 1 章 p.10–24（另有 p.28 課題練習）","key":"D1-u2-hmac-9b51c3e8d2","writeLabel":"分析題","sections":[{"id":"s1","title":"拆解問題：由上而下","pages":"教科書 p.10","learn":[{"pts":["**拆解問題（decomposition）**：把問題拆成數個細小、容易處理的**子問題**，再逐個擊破。（p.10）","這是**由上而下（top-down）**／**分而治之（divide-and-conquer）**的策略。（p.10）","**模組化設計**：把程式細分為許多子程式（**模組**），模組可以獨立並**重複使用**，提高管理程式的效率。（p.10 提示）","例子：「製作一份全日早餐」拆成製作茄汁豆、製作多士、沖調咖啡、炒蛋；每次只集中解決一個子問題。（p.10 圖 1.5）"]}],"practice":[{"id":"u2-s1-p1","type":"mc","pts":4,"src":"教科書 p.28 課題練習 選擇題 5","q":"以下哪項**不是**拆解問題的好處？","options":["能使複雜的問題變得容易處理。","能使錯誤不會出現。","能加快測試過程。","能提高解決問題的效率。"],"answer":1,"hint":"拆解問題不能保證沒有錯誤。"},{"id":"u2-s1-p2","type":"mc","pts":4,"src":"教科書 p.28 課題練習 選擇題 6","q":"小傑想估計自己上班路程的需時。以下哪項是拆解問題的例子？","options":["親身前往辦公室一次，並記住所需時間。","將路線分為步行和駕車，分別估計所需時間。","嘗試不同的公共交通工具。","尋找其他方式前往辦公室。"],"answer":1,"hint":"拆解＝分成幾個較小的部分分別處理。"}]},{"id":"s2","title":"逐步求精與結構圖","pages":"教科書 p.11–12","learn":[{"pts":["**精益求精／逐步求精法（stepwise refinement）**：把已拆開的模組再進一步分拆。（p.11）","例子：「製作多士」再拆成將麵包切片、烤成多士、塗上牛油、塗上果醬。（p.11 圖 1.6）","拆解時，有些模組正好是 IPO 周期的各部分：加入咖啡粉及熱水（輸入）→ 開始滴漏（處理）→ 倒出咖啡（輸出）。（p.11）","**結構圖**用階層表示由上而下拆解的結果。（p.12 例題 1.2）"]},{"h":"例題 1.2：計算梯形面積（p.12）"},{"table":{"head":["輸入","處理","輸出"],"rows":[["上底 a、下底 b、高 h","運算：A = (a + b) × h ÷ 2","梯形面積 A"]]}},{"note":"結構圖：頂層「計算梯形的面積」→ 第二層「取得數據」「運算」「顯示面積」→「取得數據」之下有上底、下底、高度；「運算」之下有加數、乘數、除數。在「分析題」一節要自己把結構圖填好。"}],"practice":[{"id":"u2-s2-p1","type":"mc","pts":4,"src":"教科書 p.11","q":"把「製作多士」再分拆為「將麵包切片、將麵包烤成多士、塗上牛油、塗上果醬」，稱為什麼？","options":["模式識別","逐步求精","抽象化","由下而上"],"answer":1,"hint":"把已拆開的模組再拆。"},{"id":"u2-s2-p2","type":"mc","pts":4,"src":"教科書 p.11 B 輸入、處理和輸出模組","q":"沖調咖啡的模組中，「倒出咖啡」屬於 IPO 周期的哪一部分？","options":["輸入","處理","輸出","以上皆不是"],"answer":2,"hint":"最後得到的結果。"}]},{"id":"s3","title":"模式識別：由下而上","pages":"教科書 p.13–17","learn":[{"pts":["有些問題有**共同元素**；把相似問題歸類、以類近方法處理，避免重複解難。（p.13）","**模式識別（pattern recognition）**：發掘不同問題中相似的規律。（p.13）","例子：即溶咖啡和即溶朱古力的沖法相同（加粉 → 加熱水 → 攪拌），只要換「粉末」這個**變量**。（p.13 活動 1.3）","按身高排序和按體重排序只差一個變量，方法可以沿用。（p.14–15 活動 1.4）","把相似問題歸納成一個大問題，稱為**由下而上（bottom-up）**的策略。（p.16）","正多邊形：重複「前進、轉外角」；外角 = 360 ÷ 邊數。（p.16 提示）"]},{"table":{"head":["","正三角形","正四邊形","正 n 邊形"],"rows":[["重複次數","3","4","n"],["每次轉","360 ÷ 3 = 120 度","360 ÷ 4 = 90 度","360 ÷ n 度"]]},"cap":"實驗站 1.1 用 Scratch 繪畫正多邊形（p.15–16）"}],"practice":[{"id":"u2-s3-p1","type":"fill","pts":4,"src":"教科書 p.14 活動 1.4 第 2 題","label":"填充","q":"參考「按身高由矮至高排序」的方法，寫出「按體重由輕至重排序」的方法：\n(1) 列出所有學生的［①］後，從中找出［②］，抽出來排在第一。\n(2) 從剩下的學生之中找出最輕的，抽出來排在第二。\n(3) 如此類推，便可將全班學生由［③］排序。","blanks":[{"label":"①","value":"體重"},{"label":"②","value":"最輕的","accept":["最輕","最輕的學生"]},{"label":"③","value":"輕至重","accept":["輕到重"]}],"hint":"只需要把「身高」換成「體重」、「矮」換成「輕」。"},{"id":"u2-s3-p2","type":"mc","pts":4,"src":"教科書 p.17 測試站 1.3 第 1 題","q":"小明想編寫程式，把收藏品的估算價值按大至小排序。他曾用編程解決過以下問題，參考哪一個最可能幫助他？","options":["更新收藏品的估算價值","計算收藏品的估算價值總額","找出他測驗的平均分數","把他不同測驗的分數記錄，並按高至低順序排列"],"answer":3,"hint":"找一個同樣要「排序」的問題。"}]},{"id":"s4","title":"計算思維與抽象化","pages":"教科書 p.18–19","learn":[{"pts":["周以真（Jeannette M. Wing）2006 年重新定義**計算思維**：運用計算機科學的基礎概念來解決問題、設計系統及理解人類行為。（p.18）","計算思維與閱讀、寫作、算術同樣重要。（p.18）","四個重點：**拆解問題、模式識別、抽象化、算法設計**。（p.18 圖 1.11）","**抽象化（abstraction）**：過濾不必要的資訊、化繁為簡。（p.19）","例子：港鐵路綫圖不按真實地形繪畫，但足以幫人計劃旅程，反而更清晰。（p.19）"]}],"practice":[{"id":"u2-s4-p1","type":"mc","pts":4,"src":"教科書 p.18 圖 1.11","q":"以下哪一項**不是**計算思維的四個重點之一？","options":["拆解問題","模式識別","抽象化","編製文件"],"answer":3,"hint":"四個重點：拆解問題、模式識別、抽象化、算法設計。"},{"id":"u2-s4-p2","type":"mc","pts":4,"src":"教科書 p.19","q":"港鐵路綫圖把綫路畫成直線、車站等距排列，隱去了真實地理位置。這是計算思維中的哪一項？","options":["拆解問題","模式識別","抽象化","算法設計"],"answer":2,"hint":"過濾不必要的資訊。"}]},{"id":"s5","title":"用戶界面與線框稿","pages":"教科書 p.20–24","learn":[{"pts":["從 IPO 周期知道程式要什麼輸入、輸出，便可以用**線框稿**起草用戶界面及元件。（p.20）","BMI 程式的**輸入元件**：兩個文字輸入盒（體重、身高）及一個按鈕；**輸出元件**：一個文字標籤顯示 BMI。（p.20 圖 1.14）","把文字輸入盒設定為「僅限數字」，可以**減低輸入錯誤**。（p.22 試想想）","修改輸入盒的「提示」，讓用戶知道要輸入什麼資料及單位。（p.23 試想想）","實驗站 1.2–1.3 用 App Inventor 實作 BMI 程式：按鈕被點選 → 讀取輸入 → 計算 → 顯示結果。（p.21–24）"]},{"table":{"head":["元件","類別","作用"],"rows":[["文字輸入盒「Enter your weight (in kg) here」","輸入元件","輸入體重"],["文字輸入盒「Enter your height (in m) here」","輸入元件","輸入身高"],["按鈕「Calculate」","輸入元件","遞交數據進行運算"],["標籤「Your BMI is:」","輸出元件","顯示 BMI"]]},"cap":"圖 1.14 BMI 程式的線框稿（p.20）"}],"practice":[{"id":"u2-s5-p1","type":"mc","pts":4,"src":"教科書 p.20 圖 1.14","q":"BMI 程式的線框稿中，按鈕「Calculate」屬於哪一類元件？","options":["輸入元件","輸出元件","處理元件","不屬於任何元件"],"answer":0,"hint":"用戶按它來遞交數據。"},{"id":"u2-s5-p2","type":"mc","pts":4,"src":"教科書 p.22 試想想","q":"為什麼要限制 BMI 程式的文字輸入盒只可輸入數字？","options":["令程式更美觀","減低輸入錯誤","加快網絡速度","節省儲存空間"],"answer":1,"hint":"體重和身高只會是數字。"}]},{"id":"write","kind":"write","title":"分析題","pages":"教科書 p.11–12、p.16","intro":"在表格內選出或填寫答案，按「提交評核」自動批改。答錯兩次後可以看答案，但只得 1 分。","tasks":[{"id":"u2-w1","kind":"table","tier":"必做","title":"結構圖：計算梯形面積","pts":15,"src":"教科書 p.12 例題 1.2 (b)","prompt":"用由上而下的策略拆解「計算梯形的面積」。為每個模組選出它在結構圖中的**上一層**模組。","head":["模組","上一層模組"],"opts":{"T":["計算梯形的面積","取得數據","運算","顯示面積"]},"rows":[["取得數據",{"sel":"T","a":"計算梯形的面積"}],["運算",{"sel":"T","a":"計算梯形的面積"}],["顯示面積",{"sel":"T","a":"計算梯形的面積"}],["上底長度（a）",{"sel":"T","a":"取得數據"}],["下底長度（b）",{"sel":"T","a":"取得數據"}],["高度（h）",{"sel":"T","a":"取得數據"}],["加數",{"sel":"T","a":"運算"}],["乘數",{"sel":"T","a":"運算"}],["除數",{"sel":"T","a":"運算"}]],"hint":"第二層三個模組都直接屬於頂層；a、b、h 是要取得的數據；加、乘、除屬於運算。"},{"id":"u2-w2","kind":"table","tier":"進階","title":"逐步求精：全日早餐","pts":10,"src":"教科書 p.11 圖 1.6","prompt":"「製作一份全日早餐」第一步求精得到四個模組。第二步求精後，以下步驟分別屬於哪一個模組？","head":["步驟","屬於哪個模組"],"opts":{"B":["製作茄汁豆","製作多士","沖調咖啡","炒蛋"]},"rows":[["將麵包切片",{"sel":"B","a":"製作多士"}],["塗上牛油",{"sel":"B","a":"製作多士"}],["塗上果醬",{"sel":"B","a":"製作多士"}],["煲水",{"sel":"B","a":"沖調咖啡"}],["加入咖啡粉",{"sel":"B","a":"沖調咖啡"}],["開始滴漏",{"sel":"B","a":"沖調咖啡"}]],"hint":"想想每個步驟在弄哪一樣食物。"},{"id":"u2-w3","kind":"table","tier":"挑戰","title":"模式識別：正多邊形","pts":10,"src":"教科書 p.15–17 實驗站 1.1、測試站 1.3","prompt":"機械車重複「前進 10 厘米，右轉 X 度」便可以走出正多邊形。填寫每種圖形的**重複次數**和**每次轉的角度**（外角 = 360 ÷ 邊數）。","head":["圖形","重複次數","每次轉（度）"],"rows":[["正三邊形",{"text":true,"a":"3"},{"text":true,"a":"120"}],["正四邊形",{"text":true,"a":"4"},{"text":true,"a":"90"}],["正五邊形",{"text":true,"a":"5"},{"text":true,"a":"72"}],["正六邊形",{"text":true,"a":"6"},{"text":true,"a":"60"}],["正十二邊形",{"text":true,"a":"12"},{"text":true,"a":"30"}]],"hint":"邊數就是重複次數；角度 = 360 ÷ 邊數。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.10–19","items":[{"id":"u2-q1","pts":5,"src":"教科書 p.17 測試站 1.3 第 2 題","q":"以下程式令機械車行走直角路線。應如何修改，令機械車行走**正方形**？\n開始\n重複 2 次\n　　前進 10 厘米\n　　右轉 90 度","options":["將重複次數改為 4 次","將右轉角度改為 360 度","將前進距離改為 40 厘米","將右轉改為左轉"],"answer":"A","why":"正方形有 4 條邊，每次轉 90 度，只需重複 4 次。"},{"id":"u2-q2","pts":5,"src":"教科書 p.17 試想想","q":"承上題，如何修改程式令機械車行走**正三角形**？","options":["重複 3 次，右轉 60 度","重複 3 次，右轉 120 度","重複 6 次，右轉 60 度","重複 3 次，右轉 180 度"],"answer":"B","why":"外角 = 360 ÷ 3 = 120 度。"},{"id":"u2-q3","pts":5,"src":"教科書 p.10、p.16","q":"把繪畫正三角形、正四邊形等程式歸納成一個「繪畫正 n 邊形」的程式，運用了哪一種策略？","options":["由上而下","由下而上","逐步求精","分而治之"],"answer":"B","why":"把相似的問題歸納成一個大問題，是由下而上的策略。"},{"id":"u2-q4","pts":5,"src":"教科書 p.10 提示","q":"以下哪一項是模組化設計的好處？","options":["程式不會出現任何錯誤","模組可以獨立並重複使用","程式不需要測試","程式一定執行得較快"],"answer":"B","why":"模組可以獨立並重複使用，提高管理程式的效率。"},{"id":"u2-q5","pts":5,"src":"教科書 p.18–19","q":"設計網上地圖的「捷運路線」模式時，只顯示車站和綫路、隱去街道和建築物。這主要運用了計算思維中的哪一項？","options":["拆解問題","模式識別","抽象化","算法設計"],"answer":"C","why":"過濾不必要的資訊、化繁為簡，就是抽象化。"}]},{"id":"report","kind":"report","title":"交功課"}]});
