D1.unit({"id":"u3","title":"算法、變量與賦值","book":"教科書 D1 第 2 章 p.32–41（另有 p.100–101、p.103 課題練習）","key":"D1-u3-hmac-5b8e21c74d","sections":[{"id":"s1","title":"算法與空運行","pages":"教科書 p.32–33","learn":[{"pts":["**算法（algorithm）**：按照特定次序解決問題的步驟。（p.32）","食譜是「製作奄列」的算法，輸出是奄列；洗衣機說明書是「洗衣服」的算法，輸出是乾淨衣物。（p.32）","**空運行（dry run）**：逐步跟着算法做，從而推斷它的目的和輸出。（p.32）","機械和電腦可以自行運行算法，這個自動化過程大大減輕人類的工作量。（p.33）"]},{"note":"空運行小技巧：把每個變量想像成一個寫上名字的盒子，每做一句，就更新盒內的值。（p.37 類比）"},{"sim":{"code":"A ← 3\nB ← A + 6\nC ← A * B\n輸出 A, B, C","open":[]},"cap":"試按「▶ 下一步」：右邊「變量」會顯示每個盒子的值，橙色是剛改變了的盒子。（p.39 活動 2.2）"}],"tries":[{"id":"u3-s1-t1","pts":4,"src":"教科書 p.39 活動 2.2（第 1 題）","code":"A ← 7\nA ← 10\n輸出 A","q":"先估：以下算法的輸出是什麼？","options":["7","10","17","7 10"],"why":"`A ← 10` 會取代 A 原有的值 7，所以最後輸出 10。"}],"practice":[{"id":"u3-s1-p1","type":"mc","pts":2,"src":"教科書 p.32","q":"「空運行」是指什麼？","options":["逐步跟着算法做，推斷它的目的和輸出","把算法寫成電腦程式","讓電腦不停重複執行同一個算法","執行一個沒有輸出的程式"],"answer":0,"hint":"空運行（dry run）是「理解」算法的過程。"},{"id":"u3-s1-p2","type":"mc","pts":2,"src":"教科書 p.32 試想想","q":"洗衣機的使用說明書（打開上蓋 → 放入衣物 → 關蓋 → 按「啟動」→ 等待機器停止 → 取出衣物）是一個算法。它的**輸出**是什麼？","options":["洗衣機","乾淨衣物","「啟動」按鈕","使用說明書"],"answer":1,"hint":"輸出是算法完成後得到的結果。"}]},{"id":"s2","title":"偽代碼與流程圖","pages":"教科書 p.34–35、p.45","learn":[{"pts":["表達算法的三種方式：日常文字、**偽代碼**、**流程圖**。（p.34）","**偽代碼（pseudocode）**：用簡單文字及關鍵詞（語句）表達算法，例如 `輸入`、`輸出`、`←`。（p.34）","**流程圖（flowchart）**：用特定圖形符號，以箭咀連結起來表達算法。（p.34）"]},{"symbols":[{"kind":"term","text":"開始","name":"開始／結束","desc":"圓角長方形"},{"kind":"proc","text":"A ← 21","name":"處理／賦值","desc":"長方形"},{"kind":"io","text":"輸入 A, B","name":"輸入／輸出","desc":"平行四邊形"},{"kind":"dec","text":"A = B","name":"決策","desc":"菱形（有「是」「否」兩個出口）"},{"kind":"mod","text":"調用 ProcedureABC","name":"模組","desc":"兩側有直線的長方形"}]},{"p":"表 2.1 常用的偽代碼及流程圖符號（p.34）。"},{"h":"例題 2.1：計算 BMI（p.35）"},{"table":{"head":["輸入","處理","輸出"],"rows":[["體重（kg）、身高（m）","BMI = 體重 ÷ 身高²","BMI"]]},"cap":"輸入 — 處理 — 輸出周期"},{"pts":["輸入語句：`輸入 weight, height`","賦值語句：`bmi ← weight/(height*height)`（偽代碼沒有次方符號，身高² 寫成 `height*height`）","輸出語句：`輸出 bmi`","**序列**控制結構：程式按編寫次序，由上而下逐句執行。（p.45）"]},{"sim":{"code":"輸入 weight, height\nbmi ← weight/(height*height)\n輸出 bmi","inputs":"60, 1.7","open":["flow"]},"cap":"按「▶ 下一步」，流程圖會用橙色標示走過的路線。可以改「輸入數據」再試。"}],"tries":[{"id":"u3-s2-t1","pts":4,"src":"教科書 p.35 例題 2.1","code":"輸入 weight, height\nbmi ← weight/(height*height)\n輸出 bmi","inputs":"60, 1.7","fixedInputs":true,"q":"先估：輸入 `60, 1.7` 時，輸出是什麼？（答案取 4 位小數）","options":["35.2941","60","20.7612","0.0482"],"open":["flow"],"why":"60 ÷ (1.7 × 1.7) = 60 ÷ 2.89 ≈ 20.7612。括號令 `height*height` 先計算。"}],"practice":[{"id":"u3-s2-p1","type":"mc","pts":2,"src":"教科書 p.34 表 2.1","q":"流程圖中，`輸入 weight, height` 應該畫在哪一種符號內？","options":["長方形","菱形","平行四邊形","圓角長方形"],"answer":2,"hint":"輸入和輸出共用同一種符號。"},{"id":"u3-s2-p2","type":"complete","pts":3,"src":"教科書 p.35 例題 2.1","label":"補完偽代碼","q":"補完計算 BMI 的算法（BMI = 體重 ÷ 身高²）。會用多組數據測試你的算式。","template":"輸入 weight, height\nbmi ← ［1］\n輸出 bmi","ref":["weight/(height*height)"],"tests":[{"inputs":"60, 1.7"},{"inputs":"45, 1.5"},{"inputs":"80, 2"}],"hint":"身高² 要寫成 `height*height`，並用括號包住，否則會先做除法。"}]},{"id":"s3","title":"變量與賦值","pages":"教科書 p.36–37","learn":[{"pts":["**變量（variable）**：電腦記憶體內儲存數據的位置，像寫上名字的盒子。（p.36–37）","變量名稱是程式用來辨別變量的**識別符（identifier）**；名稱要反映用途，`weight` 比 `A` 易明白。（p.36）","計算 BMI 的程式用了 3 個變量：`weight`、`height`、`bmi`。（p.36 試想想）","**賦值（assignment）**：把數據放入指定變量；偽代碼用賦值運算符 `←`。（p.37）"]},{"table":{"head":["偽代碼","意思"],"rows":[["`輸入 price`","接收用戶的輸入，放入變量 price"],["`price ← 8000`","把 8000 放入變量 price"],["`new ← price`","把變量 price 的值**複製**到變量 new"]]},"cap":"表 2.2 常見的賦值方法（p.37）"},{"warn":"常見錯誤：`new ← price` 是「複製」，不是「轉移」——執行後 price 的值不變。（p.37 旁註）"},{"p":"變量命名規則（例如不能以數字開首）會在單元 4 學習。"},{"sim":{"code":"price ← 8000\nnew ← price\n輸出 price, new","open":[]},"cap":"逐步執行，留意 price 盒子在第 2 步之後有沒有改變。"}],"tries":[{"id":"u3-s3-t1","pts":4,"src":"教科書 p.37 表 2.2","code":"price ← 8000\nnew ← price\n輸出 price, new","q":"先估：輸出是什麼？","options":["8000 8000","0 8000","8000 0","8000"],"why":"`new ← price` 把 price 的值複製到 new，price 仍然是 8000。"}],"practice":[{"id":"u3-s3-p1","type":"mc","pts":3,"src":"教科書 p.37","q":"`new ← price` 的意思是什麼？","options":["把變量 new 的值複製到變量 price","把變量 price 的值轉移到變量 new，price 變成沒有值","把變量 price 的值複製到變量 new","比較 new 和 price 是否相等"],"answer":2,"hint":"`←` 右邊的值放入左邊的變量；右邊的變量不會改變。"},{"id":"u3-s3-p2","type":"fill","pts":2,"src":"教科書 p.36 試想想","q":"例題 2.1 計算 BMI 的程式運用了多少個變量？","code":"輸入 weight, height\nbmi ← weight/(height*height)\n輸出 bmi","blanks":[{"label":"變量數目","value":"3","accept":["3個","三","三個"]}],"hint":"數一數出現過的變量名稱。"}]},{"id":"s4","title":"運算算式與追蹤表","pages":"教科書 p.38–39","learn":[{"pts":["一般賦值語句：`變量 ← 算式`；**右邊的新值會取代變量原有的值**。（p.38）","運算算式由數據（數字、變量或常數）及**數學運算符**組成，例如 `2 * PI * radius`。（p.38 圖 2.5）","數學運算符：加 `+`、減 `-`、乘 `*`（部分題目寫 `×`）、除 `/`。（p.38 表 2.3）","`new ← price + 5`：先讀 price 的值，加 5，結果放入 new。（p.38 表 2.4）","`price ← price + 1`：先讀 price 的值，加 1，結果**放回** price。（p.38 表 2.4）","空運行時用**追蹤表**逐句記錄變量的值；先填改變了的值，再填其餘不變的值。（p.39 提示）"]},{"h":"例題 2.2 第 1 題（p.39）"},{"sim":{"code":"A ← 2\nB ← 5\nA ← B - A\nA ← A * B\nB ← A - B\n輸出 A","open":["trace"]},"cap":"打開了「追蹤表」：每執行一句，便多填一行。粗體是該句改變了的值。"}],"tries":[{"id":"u3-s4-t1","pts":4,"src":"教科書 p.39 活動 2.2（第 3 題）","code":"A ← 6\nB ← A/2\nA ← 8\n輸出 A, B","q":"先估：輸出是什麼？","options":["8 4","8 3","6 3","3 8"],"open":["trace"],"why":"B 賦值時取了 A/2 = 3；之後 A 改為 8，但 B 不會自動更新，仍然是 3。（p.39 旁註）"}],"practice":[{"id":"u3-s4-p1","type":"trace","pts":4,"src":"教科書 p.39 例題 2.2 第 1 題","label":"追蹤表填格","code":"A ← 2\nB ← 5\nA ← B - A\nA ← A * B\nB ← A - B\n輸出 A","spec":{"mode":"stmt","cols":["A","B"]},"hint":"每一行只會改變 `←` 左邊的變量；`輸出` 不會改變變量。"},{"id":"u3-s4-p2","type":"fill","pts":3,"src":"教科書 p.41 測試站 2.1 第 3 題（挑戰題）","q":"以下算法的輸出是什麼？（用空格分隔）","code":"A ← 1\nB ← 2\nC ← A + B\nA ← B + C\nB ← C + A\n輸出 A, B, C","blanks":[{"label":"輸出","ask":"out"}],"hint":"`B ← C + A` 用的是 A 的**新**值。"}]},{"id":"s5","title":"交換兩個變量","pages":"教科書 p.40","learn":[{"pts":["要交換兩個變量的值，要用一個暫存變量（例如 `temp`）。（p.40 例題 2.2 第 2 題）","三步：① `temp ← X` ② `X ← Y` ③ `Y ← temp`。","只寫 `X ← Y`、`Y ← X` 不能交換：第一句已經用 Y 的值**取代**了 X 原本的值。（p.40 想像）","類比：要交換一杯水和一杯橙汁，必須先準備第三隻杯。（p.40）","交換（swapping）在排序問題中經常出現。（p.40 備註）"]},{"sim":{"code":"X ← 3\nY ← 9\ntemp ← X\nX ← Y\nY ← temp","open":["trace"]},"cap":"例題 2.2 第 2 題（p.40）：逐步執行，看 temp 怎樣暫存 X 的值。"}],"tries":[{"id":"u3-s5-t1","pts":4,"src":"教科書 p.40 想像","code":"X ← 3\nY ← 9\nX ← Y\nY ← X\n輸出 X, Y","q":"先估：以下算法沒有用 temp。輸出是什麼？","options":["9 3","3 9","9 9","3 3"],"open":["trace"],"why":"`X ← Y` 之後 X 已變成 9，原本的 3 不見了；`Y ← X` 再把 9 放入 Y。"}],"practice":[{"id":"u3-s5-p1","type":"trace","pts":4,"src":"教科書 p.103 長題目 1 (a)(b)","label":"追蹤表填格","q":"空運行以下算法，完成追蹤表（只需填寫改變了的值），並寫出輸出。教科書沒有附這題的答案，網站答案由模擬器計算。","code":"A ← 5\nB ← 7\nC ← A\nA ← B\nB ← C\nC ← (A - C) × B\n輸出 A, C, B","spec":{"mode":"stmt","cols":["A","B","C"]},"hint":"首 5 句其實是用 C 作暫存變量，交換 A 和 B。"}]},{"id":"write","kind":"write","title":"寫算法","pages":"教科書 p.35、p.40","intro":"在編輯器寫偽代碼，可以先按「▶ 下一步」自己測試，再按「提交評核」。系統會用多組測試數據檢查；不通過時會說明是哪一組數據、期望輸出和你的輸出。","tasks":[{"id":"u3-w1","tier":"必做","title":"計算 BMI","pts":20,"src":"教科書 p.35 例題 2.1","prompt":"輸入體重 `weight`（kg）及身高 `height`（m），計算並輸出 BMI。\nBMI = 體重 ÷ 身高²","starter":"輸入 weight, height\n","ref":"輸入 weight, height\nbmi ← weight/(height*height)\n輸出 bmi","tests":[{"inputs":"60, 1.7","show":true},{"inputs":"45, 1.5"},{"inputs":"80, 2"},{"inputs":"52.5, 1.62"}],"hint":"`bmi ← weight/(height*height)`——記得括號，最後要 `輸出 bmi`。"},{"id":"u3-w2","tier":"進階","title":"交換兩個變量","pts":10,"src":"教科書 p.40 例題 2.2 第 2 題","prompt":"程式輸入兩個數值到 `X` 和 `Y`。在中間加入語句，**交換** X 和 Y 的值，最後輸出 X, Y。\n不可以改動第一行和最後一行。","starter":"輸入 X, Y\n\n輸出 X, Y","ref":"輸入 X, Y\ntemp ← X\nX ← Y\nY ← temp\n輸出 X, Y","check":{"vars":["X","Y"]},"rules":[{"re":"^輸入 X, ?Y$","msg":"請保留第一行「輸入 X, Y」。"},{"re":"^輸出 X, ?Y$","msg":"請保留最後一行「輸出 X, Y」。"}],"tests":[{"inputs":"3, 9","show":true},{"inputs":"5, -2"},{"inputs":"7, 7"},{"inputs":"100, 1"}],"hint":"先用 `temp ← X` 暫存 X 的值。"},{"id":"u3-w3","tier":"挑戰","title":"三個變量循環移位","pts":5,"src":"延伸：教科書 p.40 交換算法","prompt":"程式輸入三個數值到 `A`、`B`、`C`。在中間加入語句，令\n`A` 得到 B 原本的值、`B` 得到 C 原本的值、`C` 得到 A 原本的值，最後輸出 A, B, C。\n例如輸入 1, 2, 3，輸出 2 3 1。不可以改動第一行和最後一行。","starter":"輸入 A, B, C\n\n輸出 A, B, C","ref":"輸入 A, B, C\ntemp ← A\nA ← B\nB ← C\nC ← temp\n輸出 A, B, C","check":{"vars":["A","B","C"]},"rules":[{"re":"^輸入 A, ?B, ?C$","msg":"請保留第一行「輸入 A, B, C」。"},{"re":"^輸出 A, ?B, ?C$","msg":"請保留最後一行「輸出 A, B, C」。"}],"tests":[{"inputs":"1, 2, 3","show":true},{"inputs":"10, 20, 30"},{"inputs":"4, 4, 9"},{"inputs":"-1, 0, 8"}],"hint":"只需要一個 temp：先暫存 A，然後由 A 開始逐個「向前」複製。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.41、p.100–101","items":[{"id":"u3-q1","pts":4,"src":"教科書 p.41 測試站 2.1 第 1 題（參考 DSE 2019 卷一甲部第 30 題，答對率 81%）","q":"下列算法的輸出是什麼？","code":"A ← 1\nB ← 2\nC ← A + B\nA ← 6\nB ← 8\n輸出 C","options":["3","7","8","14"],"answer":"A","verify":true,"why":"C 在第 3 句已計算為 3；之後改變 A、B 不會改變 C。"},{"id":"u3-q2","pts":4,"src":"教科書 p.41 測試站 2.1 第 2 題","q":"下列算法的輸出是什麼？","code":"A ← 3\nB ← 5\nC ← A * B\nA ← A + 1\nB ← B - 1\nC ← A * B\n輸出 A, B, C","options":["3　5　15","3　4　12","4　5　20","4　4　16"],"answer":"D","verify":true,"why":"A = 4、B = 4，最後一句重新計算 C = 4 × 4 = 16。"},{"id":"u3-q3","pts":4,"src":"教科書 p.100 課題練習 選擇題 1","q":"以下算法的輸出是什麼？","code":"A ← 5\nB ← 7\nA ← B - 2\nC ← B\nB ← C\n輸出 B, A, C","options":["5, 7, 7","7, 5, 7","5, 5, 5","7, 7, 5"],"answer":"B","verify":true,"why":"留意輸出次序是 B, A, C。"},{"id":"u3-q4","pts":4,"src":"教科書 p.100 課題練習 選擇題 2","q":"以下算法的輸出是什麼？","code":"E ← 0\nF ← 1\nG ← 2\nE ← G × F\nF ← F + E\nG ← E × F\n輸出 G","options":["3","2","6","0"],"answer":"C","verify":true,"why":"E = 2 × 1 = 2；F = 1 + 2 = 3；G = 2 × 3 = 6。"},{"id":"u3-q5","pts":4,"src":"教科書 p.101 課題練習 選擇題 4","q":"以下算法的目的是什麼？","code":"輸入 A\n輸入 B\ntemp ← B\nA ← temp\nB ← A","options":["對調 A 和 B 的數值","把 B 轉成 A 的數值","把 A 轉成 B 的數值","以上皆非"],"answer":"C","why":"例如輸入 3、8：temp = 8，A = 8，B = 8。A 變成和 B 一樣，即「把 A 轉成 B 的數值」；兩個值並沒有對調（已用 tools/test_engine.js 核對）。"}]},{"id":"more","kind":"endless","title":"無限練習","gens":["seq","swap","inout"],"intro":"按教科書題型（p.39 活動 2.2、p.40–41）隨機生成空運行題目，答案由模擬器計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]});
