D1.unit({"id":"u7","title":"迭代（循環）","book":"教科書 D1 第 2 章 p.73–94、p.98–99（另有 p.102 課題練習）","key":"D1-u7-hmac-5f0d2b97ac","sections":[{"id":"s1","title":"迭代與 for 循環","pages":"教科書 p.73–79","learn":[{"pts":["**迭代（iteration）**又稱**循環（loop）**：重複執行某段語句，直至不再符合循環條件。（p.73）","被重複執行的語句稱為**循環體（loop body）**。（p.73）","**for 循環**：變量由起始值遞增（`由 1 至 10`）或遞減（`由 10 下至 1`）到最終值，決定循環體重複的次數。（p.75）","這個變量是**循環計數器**，常用 i、j、k；循環體內也可以用它來運算，例如 `輸出 3 * i`。（p.75–76）","重複次數 = 最終值 − 起始值 + 1（遞減時是 起始值 − 最終值 + 1）。（p.77 活動 2.6）","流程圖：`i ← 起始值` → 判斷 `i \u003c= 最終值` → 循環體 → `i ← i + 1` → 返回判斷。所以循環**完結後 i = 最終值 + 1**。（p.75 表 2.17）","典型用法：繪畫正多邊形——重複「向前畫、轉外角」。（p.79）"]},{"sim":{"code":"設 i 由 1 至 5\n    輸出 3 * i","open":["flow","trace"]},"cap":"輸出首五個 3 的倍數（p.76）。看流程圖怎樣在「i \u003c= 5」與循環體之間繞圈。"}],"tries":[{"id":"u7-s1-t1","pts":4,"src":"教科書 p.77 活動 2.6 第 2(c) 題","code":"k ← 10\n設 i 由 1 至 4\n    k ← k + 1\n輸出 k","q":"先估：輸出是什麼？","options":["13","14","15","4"],"open":["trace"],"why":"循環體執行 4 次，k 由 10 加到 14。"}],"practice":[{"id":"u7-s1-p1","type":"fill","pts":3,"src":"教科書 p.77 活動 2.6 第 1 題","q":"空運行以下算法，寫出輸出（用空格分隔）及循環體重複的次數。","code":"設 n 由 10 下至 0\n    輸出 n","blanks":[{"label":"輸出","ask":"out"},{"label":"重複次數","ask":{"count":1}}],"hint":"10 下至 0 包括 0：10 − 0 + 1。"},{"id":"u7-s1-p2","type":"complete","pts":2,"src":"教科書 p.77 活動 2.6 第 2(a) 題","label":"補完偽代碼","q":"用 for 循環寫出與「輸出 1 * 5、輸出 2 * 5 …… 輸出 7 * 5」對等的偽代碼。","template":"設 i 由 1 至 ［1］\n    輸出 i * ［2］","ref":["7","5"],"tests":[{"inputs":""}],"hint":"共 7 行；每行都乘 5。"}]},{"id":"s2","title":"while 循環與無限循環","pages":"教科書 p.80–81、p.99","learn":[{"pts":["**while 循環**：先判斷條件；成立便執行循環體，然後再判斷。只要條件一直成立，循環體就不斷執行。（p.80）","寫法：`當 {條件}`，循環體縮排。（p.80 表 2.18）","**無限循環**：邏輯錯誤令循環條件永遠成立，例如 `當 i \u003c 10` 但循環體寫成 `i ← i - 1`。（p.81、p.99）","無限循環時，循環之後的語句（例如 `輸出 X`）永遠不會執行。（p.81）","擴闊視野：有程式刻意用 `當 True` 造成無限循環（相當於 Scratch「重複無限次」）。（p.81）"]},{"sim":{"code":"i ← 1\n當 i \u003c 10\n    輸出 i\n    i ← i - 1","open":[]},"cap":"常見錯誤（p.99）：按「⏩ 執行到底」，模擬器執行 5,000 步後會判斷為無限循環並說明原因。把最後一行改成 `i ← i + 1` 便正確。"}],"tries":[{"id":"u7-s2-t1","pts":4,"src":"教科書 p.80","code":"num ← 17\n當 num \u003c 100\n    輸出 num\n    num ← num + 17","q":"先估：輸出是什麼？","options":["17 34 51 68 85","17 34 51 68 85 102","34 51 68 85","17"],"open":["trace"],"why":"num 變成 102 時，條件 102 \u003c 100 不成立，離開循環，所以 102 不會輸出。"}],"practice":[{"id":"u7-s2-p1","type":"mc","pts":3,"src":"教科書 p.82 測試站 2.8 第 1 題（參考 2012 Practice Paper 1A Q33）","q":"以下哪個輸入值，可以避免無限循環的發生？","code":"num ← 1\n輸入 X\n當 num \u003c= 5\n    num ← num * X","options":["任何整數","任何正數","0","-2"],"answer":3,"hint":"X 是 1、0 或 -1 時，num 永遠不會大於 5。試用 -2：1 → -2 → 4 → -8 → 16。"},{"id":"u7-s2-p2","type":"fill","pts":2,"src":"教科書 p.83 測試站 2.8 第 2 題","q":"輸入 X 為 3。最後輸出的 Z 是多少？","code":"輸入 X\nY ← 0\nZ ← 0\n設 i 由 1 至 10\n    Y ← Y + X\n    輸出 Y\n    Z ← Z + Y\n輸出 Z","inputs":"3","blanks":[{"label":"Z","ask":{"var":"Z"}}],"hint":"Z = 3 + 6 + 9 + … + 30。"}]},{"id":"s3","title":"for 與 while；執行…當","pages":"教科書 p.82–85","learn":[{"pts":["**for 循環**：已知循環體的**重複次數**（例如跑 10 個圈）。（p.82）","**while 循環**：重複次數**未知**，只要條件成立就繼續（例如體能許可便一直跑）。（p.82）","for 循環可以改寫成 while 循環：先 `i ← 1`，條件 `i \u003c= 10`，循環體最後加 `i ← i + 1`。（p.83 測試站 2.8 第 3 題）","**「執行…當」循環**：循環體**先執行一次**，再判斷條件；條件成立便再執行。（p.84）","例子：夾公仔機投下 5 個硬幣才啟動機械夾。（p.85）"]},{"sim":{"code":"coins ← 0\n執行\n    投下硬幣\n    coins ← coins + 1\n當 coins \u003c 5\n啟動機械夾","open":["flow"]},"cap":"夾公仔機（p.85）。「投下硬幣」「啟動機械夾」是文字描述的步驟，模擬器當作一個步驟，不改變變量。"}],"tries":[{"id":"u7-s3-t1","pts":4,"src":"教科書 p.85 測試站 2.9","code":"A ← 10\n執行\n    A ← A - 3\n    輸出 A\n當 A > 10","ask":{"count":3},"q":"先估：「輸出 A」會被執行多少次？","options":["0","1","2","3"],"open":["flow"],"why":"後測循環最少執行一次：輸出 7；之後 7 > 10 不成立，離開循環。"}],"practice":[{"id":"u7-s3-p1","type":"complete","pts":3,"src":"教科書 p.83 測試站 2.8 第 3 題","label":"補完偽代碼","q":"把「設 i 由 1 至 10」的算法改寫為 while 循環。會用多組數據測試。","template":"輸入 X\nY ← 0\nZ ← 0\ni ← 1\n當 ［1］\n    Y ← Y + X\n    輸出 Y\n    Z ← Z + Y\n    ［2］\n輸出 Z","ref":["i \u003c= 10","i ← i + 1"],"tests":[{"inputs":"3"},{"inputs":"5"},{"inputs":"-2"}],"hint":"條件要令循環體執行 10 次；循環體最後要更新 i，否則會無限循環。"},{"id":"u7-s3-p2","type":"mc","pts":2,"src":"教科書 p.82","q":"運動員以「跑 10 個圈」為目標。最適合用哪一種循環？","options":["for 循環","while 循環","無限循環","不需要循環"],"answer":0,"hint":"重複次數已知。"}]},{"id":"s4","title":"重複…直至；前測與後測","pages":"教科書 p.86–89、p.98–99","learn":[{"pts":["**「重複…直至」循環**：循環體先執行一次，條件**不成立**便再執行，**直至條件成立**為止。（p.86）","「執行…當」與「重複…直至」只差在條件：`當 NOT (條件)` 等於 `直至 條件`。（p.86 提示）","**前測循環**：先檢查條件再執行循環體，循環體**可能一次也不執行**（while、for）。（p.88）","**後測循環**：先執行循環體再檢查條件，循環體**最少執行一次**（執行…當、重複…直至）。（p.88）","例子：猜數字遊戲——玩家先猜一次，猜不中便再輸入，直至猜中。（p.87）"]},{"table":{"head":["","前測循環","後測循環"],"rows":[["何時檢查條件","執行循環體之前","執行循環體之後"],["循環體最少執行","0 次","1 次"],["例子","while、for","執行…當、重複…直至"]]},"cap":"表 2.21 循環控制結構的分類（p.88）"},{"sim":{"code":"輸入 secret\n重複\n    輸入 guess\n直至 guess = secret\n輸出 \"Bingo!\"","inputs":"7, 3, 9, 7","open":["flow"]},"cap":"猜數字遊戲（p.87）。第一個輸入是秘密數字，之後是玩家每次猜的數字。"}],"tries":[{"id":"u7-s4-t1","pts":4,"src":"教科書 p.87","code":"輸入 secret\n重複\n    輸入 guess\n直至 guess = secret\n輸出 \"Bingo!\"","inputs":"7, 3, 9, 7","fixedInputs":true,"ask":{"count":2},"q":"先估：秘密數字是 7，玩家依次猜 3、9、7。「輸入 guess」執行了多少次？","options":["1","2","3","4"],"open":["flow"],"why":"猜 3、猜 9 都不中，要再猜；第 3 次猜 7 才中，條件成立，離開循環。"}],"practice":[{"id":"u7-s4-p1","type":"complete","pts":3,"src":"教科書 p.87 活動 2.7","label":"補完偽代碼","q":"把猜數字遊戲改為使用「執行…當」循環。會用多組數據測試。","template":"輸入 secret\n執行\n    輸入 guess\n當 ［1］\n輸出 \"Bingo!\"","ref":["guess \u003c> secret"],"tests":[{"inputs":"7, 3, 9, 7"},{"inputs":"5, 5"},{"inputs":"2, 8, 2"}],"hint":"「執行…當」在條件成立時繼續：猜錯時要繼續。"},{"id":"u7-s4-p2","type":"mc","pts":2,"src":"教科書 p.88 提示","q":"以下哪一種循環的循環體**最少執行一次**？","options":["for 循環","while 循環","重複…直至循環","以上皆是"],"answer":2,"hint":"後測循環。"}]},{"id":"s5","title":"循環中的選擇","pages":"教科書 p.89–94","learn":[{"pts":["循環體內可以有條件語句，例如找最大的數、猜數字時提示太大或太小。（p.91–93）","輸入有效性檢查：分數超出 0–100 便要求再輸入，直到有效（後測循環）。（p.91 測試站 2.10 第 3 題）","條件「是」「否」互換時，判定框要寫相反的條件（數線上的範圍互補）。（p.91 第 4 題）"]},{"sim":{"code":"輸入 mNum\n重複\n    輸入 num\n    如果 num > mNum 則\n        mNum ← num\n直至 num = 0\n輸出 mNum","i
