D1.unit({"id":"u1","title":"界定及分析問題","book":"教科書 D1 第 1 章 p.2–9、p.25（另有 p.28 課題練習）","key":"D1-u1-hmac-2e7a94c15b","writeLabel":"分析題","sections":[{"id":"s1","title":"界定問題","pages":"教科書 p.4–6","learn":[{"pts":["問題不夠具體便難以解決：朋友只說「我不懂使用這個手機」，你不知道他是不懂安裝程式還是不懂打電話。（p.4）","用編程解決問題，第一步**不是**寫程式，而是**界定問題及其範圍**。（p.4）","類比：考試先要理解題目的範圍和意思，才能有效作答。（p.4）","思考工具：**六何法（5W1H）**、**腦圖（mind map）**。（p.4）","也可以做研究：**市場調查、訪問、閱讀參考資料**。（p.5）"]},{"table":{"head":["六何","問題","例子"],"rows":[["WHEN","網上商店的營業時間？","24 小時運作？全年無休？"],["WHERE","能在哪些平台上運作？","手機、平板電腦、桌上電腦"],["WHY","為什麼要設立網上商店？","購物更方便、提高銷量"],["WHAT","網上商店有什麼元素？","商品種類、產品資訊、聊天機器人"],["WHO","目標顧客群包括？","願意網上用信用卡的人；20–40 歲"],["HOW","網上商店要如何運作？","有送貨服務嗎？有會員制度嗎？"]]},"cap":"活動 1.1 以六何法界定網上商店的服務（p.5）"}],"practice":[{"id":"u1-s1-p1","type":"mc","pts":4,"src":"教科書 p.4","q":"用編程解決問題時，第一步應該做什麼？","options":["直接編寫程式","界定問題及其範圍","測試及除錯","設計流程圖"],"answer":1,"hint":"「問題本身的界定，要比其解決方法更為重要。」"},{"id":"u1-s1-p2","type":"mc","pts":4,"src":"教科書 p.4–5","q":"以下哪一項**不是**界定問題時常用的方法？","options":["六何法","腦圖","市場調查及訪問","編寫程式碼"],"answer":3,"hint":"界定問題時還未開始寫程式。"},{"id":"u1-s1-p3","type":"mc","pts":4,"src":"教科書 p.28 課題練習 選擇題 1","q":"志強打算開發一個學習日語的應用程式。在**編寫程式之前**，他應該先做什麼？\n(1) 設計應用程式的算法\n(2) 決定該應用程式可以提供給用戶的服務\n(3) 推廣該應用程式","options":["只有 (1)","只有 (2)","只有 (1) 和 (2)","(1)、(2) 和 (3)"],"answer":2,"hint":"推廣要等程式完成後才做。"},{"id":"u1-s1-p4","type":"mc","pts":3,"src":"教科書 p.5 活動 1.1","q":"「網上商店的目標顧客群包括哪些人？」屬於六何法的哪一項？","options":["WHEN（何時）","WHERE（何地）","WHY（為何）","WHAT（何事）","WHO（何人）","HOW（如何）"],"answer":4,"hint":"問的是「人」。"}]},{"id":"s2","title":"分析問題：輸入—處理—輸出","pages":"教科書 p.7–9","learn":[{"pts":["**分析問題**：界定範圍後，從不同角度找出解決方案的具體細節。（p.7）","**輸入—處理—輸出周期（IPO）**是分析問題的框架。（p.7）","**輸入**：程式要用的數據；**處理**：程式用的方法或步驟；**輸出**：程式傳回的資訊。（p.7 提示）","複雜的問題可能要多次運用 IPO 周期分析。（p.7 提示）"]},{"table":{"head":["輸入","處理","輸出"],"rows":[["體重（kg）、身高（m）","運算：BMI = 體重 ÷ 身高²","BMI"],["BMI","條件判斷，找出所屬類別","BMI 類別（過輕／正常／過重／肥胖）"]]},"cap":"BMI 計算器的兩個 IPO 周期（p.7）"},{"note":"活動 1.2（p.8–9）：按揭計算機和循線機械車也可以用 IPO 分析——會在「分析題」一節練習。"}],"practice":[{"id":"u1-s2-p1","type":"mc","pts":4,"src":"教科書 p.7","q":"在 BMI 計算器中，「BMI = 體重 ÷ 身高²」屬於 IPO 周期的哪一部分？","options":["輸入","處理","輸出","以上皆不是"],"answer":1,"hint":"處理是程式用的方法或步驟。"},{"id":"u1-s2-p2","type":"mc","pts":4,"src":"教科書 p.28 課題練習 選擇題 3","q":"以下哪一組輸入—處理—輸出周期是最可行的？（次序：輸入；處理；輸出）","options":["體重和身高；計算；BMI","產品的價格；排序；商店位置","咖啡；沖泡；咖啡豆","最高身高；搜索；最輕體重"],"answer":0,"hint":"輸出要能由輸入經處理得出。"},{"id":"u1-s2-p3","type":"mc","pts":4,"src":"教科書 p.28 課題練習 選擇題 4","q":"IPO 周期：輸入「詞彙」；處理（空白）；輸出「詞彙的定義」。以下哪個過程符合這個周期？","options":["尋找合適的字典","檢查拼字或印刷錯誤","將輸入的詞彙與相應的定義相匹配","搜索類似的詞彙"],"answer":2,"hint":"處理要把輸入變成輸出。"},{"id":"u1-s2-p4","type":"mc","pts":3,"src":"教科書 p.28 課題練習 選擇題 2","q":"製作學生的成績單時，以下哪項是**不需要**的？","options":["學生所學的科目","學生最喜歡的科目","學生的姓名","計算科目成績的公式"],"answer":1,"hint":"成績單要顯示什麼？"}]},{"id":"s3","title":"解難程序","pages":"教科書 p.25","learn":[{"pts":["運用編程解決問題大致分為**六個步驟**。（p.25 圖 1.19）","① **界定問題**：了解要提供什麼服務。","② **分析問題**：運作流程、輸入和輸出、處理方法。","③ **設計算法**：用流程圖等方法列明每個步驟。","④ **開發程式**：按算法編寫程式。","⑤ **測試及除錯**：檢查有沒有錯誤並改良程式。","⑥ **編製文件**：用日常語言描述程式各部分的運作，方便日後更新。"]},{"note":"教科書註明新課程文件已移除這部分，但它有助預覽整個流程；歷屆試題（2017 卷一甲部第 30 題）曾考步驟的次序。"}],"practice":[{"id":"u1-s3-p1","type":"mc","pts":4,"src":"教科書 p.25 圖 1.19","q":"「運用日常語言描述程式每個部分的運作和應用方法，以便日後更新系統」是解難程序的哪一步？","options":["分析問題","設計算法","測試及除錯","編製文件"],"answer":3,"hint":"最後一步。"},{"id":"u1-s3-p2","type":"mc","pts":3,"src":"教科書 p.28 課題練習 選擇題 8","q":"在解難程序中，完成算法設計**之後**，還需要進行哪項／些行動？\n(1) 測試和除錯\n(2) 開發程式\n(3) 定義問題","options":["只有 (1)","只有 (3)","只有 (1) 和 (2)","(1)、(2) 和 (3)"],"answer":2,"hint":"定義問題在設計算法之前。"},{"id":"u1-s3-p3","type":"mc","pts":3,"src":"教科書 p.25 圖 1.19","q":"「檢測系統運作有沒有錯誤並改良程式」之前的一步是什麼？","options":["界定問題","設計算法","開發程式","編製文件"],"answer":2,"hint":"先寫好程式，才可以測試。"}]},{"id":"write","kind":"write","title":"分析題","pages":"教科書 p.5、p.8–9、p.29","intro":"在表格內選出答案，按「提交評核」自動批改。答錯兩次後可以看答案，但只得 1 分。","tasks":[{"id":"u1-w1","kind":"table","tier":"必做","title":"IPO：按揭計算機及循線車","pts":15,"src":"教科書 p.8–9 活動 1.2","prompt":"為以下兩個程式選出輸入、處理和輸出。\n按揭計算機：計算每月供款及利息。\n循線機械車：左右兩邊的紅外線感應器偵測黑線，車身偏了便轉彎返回黑線。","head":["程式","輸入","處理","輸出"],"opts":{"I":["貸款本金、年利率、還款期（付款次數）","左右循線感應器偵測到的數據","兩條直角邊的長度 a 和 b","步行的步數"],"P":["運算（按揭公式）","判斷車身相對黑線的位置","運算：c = √(a² + b²)","運算：卡路里 = 步數 ÷ 1000 × 100"],"O":["每月供款及利息","控制摩打，令機械車循線而行","斜邊長度 c","消耗了的卡路里"]},"rows":[["按揭計算機",{"sel":"I","a":"貸款本金、年利率、還款期（付款次數）"},{"sel":"P","a":"運算（按揭公式）"},{"sel":"O","a":"每月供款及利息"}],["循線機械車",{"sel":"I","a":"左右循線感應器偵測到的數據"},{"sel":"P","a":"判斷車身相對黑線的位置"},{"sel":"O","a":"控制摩打，令機械車循線而行"}]],"hint":"輸入是程式「收到」的數據；輸出是程式最後「給出」的結果或動作。"},{"id":"u1-w2","kind":"table","tier":"進階","title":"IPO：畢氏定理及計步器","pts":10,"src":"教科書 p.9 測試站 1.2 第 2 題；p.29 長題目 2（教科書沒有附答案）","prompt":"為以下兩個程式選出輸入、處理和輸出。\n畢氏定理：計算直角三角形斜邊 c 的長度（c² = a² + b²）。\n健身手環：假設步行 1000 步消耗 100 卡路里，計算消耗了的卡路里。","head":["程式","輸入","處理","輸出"],"opts":{"I":["貸款本金、年利率、還款期（付款次數）","左右循線感應器偵測到的數據","兩條直角邊的長度 a 和 b","步行的步數"],"P":["運算（按揭公式）","判斷車身相對黑線的位置","運算：c = √(a² + b²)","運算：卡路里 = 步數 ÷ 1000 × 100"],"O":["每月供款及利息","控制摩打，令機械車循線而行","斜邊長度 c","消耗了的卡路里"]},"rows":[["計算斜邊",{"sel":"I","a":"兩條直角邊的長度 a 和 b"},{"sel":"P","a":"運算：c = √(a² + b²)"},{"sel":"O","a":"斜邊長度 c"}],["健身手環卡路里",{"sel":"I","a":"步行的步數"},{"sel":"P","a":"運算：卡路里 = 步數 ÷ 1000 × 100"},{"sel":"O","a":"消耗了的卡路里"}]],"hint":"計步器的感應器提供的是步數。"},{"id":"u1-w3","kind":"table","tier":"挑戰","title":"六何法：小食部網上訂餐","pts":10,"src":"仿教科書 p.5 活動 1.1","prompt":"學校打算為小食部設立網上訂餐系統。以下每條問題屬於六何法的哪一項？","head":["問題","六何法"],"opts":{"W":["WHEN（何時）","WHERE（何地）","WHY（為何）","WHAT（何事）","WHO（何人）","HOW（如何）"]},"rows":[["學生最遲可以在什麼時候訂餐？",{"sel":"W","a":"WHEN（何時）"}],["系統可以在學校的平板電腦和學生手機上使用嗎？",{"sel":"W","a":"WHERE（何地）"}],["為什麼要用網上訂餐取代排隊買飯？",{"sel":"W","a":"WHY（為何）"}],["系統要提供哪些餐點和資訊？",{"sel":"W","a":"WHAT（何事）"}],["使用者包括學生、老師還是家長？",{"sel":"W","a":"WHO（何人）"}],["學生怎樣付款和取餐？",{"sel":"W","a":"HOW（如何）"}]],"hint":"留意每條問題問的是時間、地點、原因、事物、人物還是方法。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.6、p.9、p.25、p.28","items":[{"id":"u1-q1","pts":5,"src":"教科書 p.6 例題 1.1（參考 DSE 2014 1A Q30）","tags":[{"t":"hot","why":"界定問題範圍：2014 甲30（答對率 73%）、2015 甲33（70%）、2022 甲32（74%）"}],"q":"某咖啡店老闆打算提供線上銷售服務，並要求 IT 同事為客戶建構一個網站。IT 同事首先需要做什麼？","options":["編寫網頁程式","估計項目所需的人手和時間","定義服務範圍","參考其他相關網站"],"answer":"C","why":"第一步必定是界定問題範圍，例如賣咖啡豆還是預訂咖啡、有沒有送貨、要不要會員功能。"},{"id":"u1-q2","pts":5,"src":"教科書 p.6 測試站 1.1（參考 DSE 2015 1A Q33）","tags":[{"t":"hot","why":"界定問題範圍：2014 甲30（答對率 73%）、2015 甲33（70%）、2022 甲32（74%）"}],"q":"解決專題研習中的問題時，為什麼需要準確界定問題的範圍？\n(1) 若誤解問題，就會使用錯誤的解決方法\n(2) 能夠通過流程圖清楚展現方案\n(3) 能把大問題細分為子問題","options":["只有 (1)","只有 (3)","只有 (1) 和 (3)","(1)、(2) 和 (3)"],"answer":"C","why":"流程圖用於設計算法，不是界定問題範圍的原因。"},{"id":"u1-q3","pts":5,"src":"教科書 p.9 測試站 1.2 第 1 題（參考 DSE 2012 1A Q1）","q":"小欣想利用程式計算文具店的利潤。以下哪項是與這個程式相關的「輸入」？\n(1) 文具店的利潤\n(2) 文具的成本\n(3) 文具的銷售","options":["只有 (1)、(2)","只有 (1)、(3)","只有 (2)、(3)","(1)、(2) 和 (3)"],"answer":"C","why":"利潤是計算出來的結果，屬輸出。"},{"id":"u1-q4","pts":5,"src":"教科書 p.25 測試站 1.4（參考 DSE 2017 1A Q30，答對率 78%）","q":"以下哪一個是解難程序的正確次序？\n(1) 進行測試及除錯\n(2) 定義問題\n(3) 編寫程式\n(4) 算法設計","options":["(2) → (4) → (1) → (3)","(2) → (4) → (3) → (1)","(4) → (2) → (1) → (3)","(4) → (2) → (3) → (1)"],"answer":"B","why":"定義問題 → 設計算法 → 編寫程式 → 測試及除錯。"},{"id":"u1-q5","pts":5,"src":"教科書 p.28 課題練習 選擇題 7","q":"如要找到班中身高最高的學生，需要採取以下哪個／些步驟？\n(1) 測量學生的身高\n(2) 列出所有學生的名字\n(3) 比較學生的身高","options":["只有 (1)","只有 (2)","只有 (1) 和 (3)","(1)、(2) 和 (3)"],"answer":"C","why":"找最高只需要身高數據並作比較；列出所有名字不是必要步驟。"}]},{"id":"report","kind":"report","title":"交功課"}]});
</script>
