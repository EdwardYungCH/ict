D1.teacher({"units":[{"id":"u3","title":"算法、變量與賦值","book":"教科書 D1 第 2 章 p.32–41（另有 p.100–101、p.103 課題練習）","key":"D1-u3-hmac-5b8e21c74d","sections":[{"id":"s1","title":"算法與空運行","pages":"教科書 p.32–33","learn":[{"pts":["**算法（algorithm）**：按照特定次序解決問題的步驟。（p.32）","食譜是「製作奄列」的算法，輸出是奄列；洗衣機說明書是「洗衣服」的算法，輸出是乾淨衣物。（p.32）","**空運行（dry run）**：逐步跟着算法做，從而推斷它的目的和輸出。（p.32）","機械和電腦可以自行運行算法，這個自動化過程大大減輕人類的工作量。（p.33）"]},{"note":"空運行小技巧：把每個變量想像成一個寫上名字的盒子，每做一句，就更新盒內的值。（p.37 類比）"},{"sim":{"code":"A ← 3\nB ← A + 6\nC ← A * B\n輸出 A, B, C","open":[]},"cap":"試按「▶ 下一步」：右邊「變量」會顯示每個盒子的值，橙色是剛改變了的盒子。（p.39 活動 2.2）"}],"tries":[{"id":"u3-s1-t1","pts":4,"src":"教科書 p.39 活動 2.2（第 1 題）","code":"A ← 7\nA ← 10\n輸出 A","q":"先估：以下算法的輸出是什麼？","options":["7","10","17","7 10"],"why":"`A ← 10` 會取代 A 原有的值 7，所以最後輸出 10。"}],"practice":[{"id":"u3-s1-p1","type":"mc","pts":2,"src":"教科書 p.32","q":"「空運行」是指什麼？","options":["逐步跟着算法做，推斷它的目的和輸出","把算法寫成電腦程式","讓電腦不停重複執行同一個算法","執行一個沒有輸出的程式"],"answer":0,"hint":"空運行（dry run）是「理解」算法的過程。"},{"id":"u3-s1-p2","type":"mc","pts":2,"src":"教科書 p.32 試想想","q":"洗衣機的使用說明書（打開上蓋 → 放入衣物 → 關蓋 → 按「啟動」→ 等待機器停止 → 取出衣物）是一個算法。它的**輸出**是什麼？","options":["洗衣機","乾淨衣物","「啟動」按鈕","使用說明書"],"answer":1,"hint":"輸出是算法完成後得到的結果。"}]},{"id":"s2","title":"偽代碼與流程圖","pages":"教科書 p.34–35、p.45","learn":[{"pts":["表達算法的三種方式：日常文字、**偽代碼**、**流程圖**。（p.34）","**偽代碼（pseudocode）**：用簡單文字及關鍵詞（語句）表達算法，例如 `輸入`、`輸出`、`←`。（p.34）","**流程圖（flowchart）**：用特定圖形符號，以箭咀連結起來表達算法。（p.34）"]},{"symbols":[{"kind":"term","text":"開始","name":"開始／結束","desc":"圓角長方形"},{"kind":"proc","text":"A ← 21","name":"處理／賦值","desc":"長方形"},{"kind":"io","text":"輸入 A, B","name":"輸入／輸出","desc":"平行四邊形"},{"kind":"dec","text":"A = B","name":"決策","desc":"菱形（有「是」「否」兩個出口）"},{"kind":"mod","text":"調用 ProcedureABC","name":"模組","desc":"兩側有直線的長方形"}]},{"p":"表 2.1 常用的偽代碼及流程圖符號（p.34）。"},{"h":"例題 2.1：計算 BMI（p.35）"},{"table":{"head":["輸入","處理","輸出"],"rows":[["體重（kg）、身高（m）","BMI = 體重 ÷ 身高²","BMI"]]},"cap":"輸入 — 處理 — 輸出周期"},{"pts":["輸入語句：`輸入 weight, height`","賦值語句：`bmi ← weight/(height*height)`（偽代碼沒有次方符號，身高² 寫成 `height*height`）","輸出語句：`輸出 bmi`","**序列**控制結構：程式按編寫次序，由上而下逐句執行。（p.45）"]},{"sim":{"code":"輸入 weight, height\nbmi ← weight/(height*height)\n輸出 bmi","inputs":"60, 1.7","open":["flow"]},"cap":"按「▶ 下一步」，流程圖會用橙色標示走過的路線。可以改「輸入數據」再試。"}],"tries":[{"id":"u3-s2-t1","pts":4,"src":"教科書 p.35 例題 2.1","code":"輸入 weight, height\nbmi ← weight/(height*height)\n輸出 bmi","inputs":"60, 1.7","fixedInputs":true,"q":"先估：輸入 `60, 1.7` 時，輸出是什麼？（答案取 4 位小數）","options":["35.2941","60","20.7612","0.0482"],"open":["flow"],"why":"60 ÷ (1.7 × 1.7) = 60 ÷ 2.89 ≈ 20.7612。括號令 `height*height` 先計算。"}],"practice":[{"id":"u3-s2-p1","type":"mc","pts":2,"src":"教科書 p.34 表 2.1","q":"流程圖中，`輸入 weight, height` 應該畫在哪一種符號內？","options":["長方形","菱形","平行四邊形","圓角長方形"],"answer":2,"hint":"輸入和輸出共用同一種符號。"},{"id":"u3-s2-p2","type":"complete","pts":3,"src":"教科書 p.35 例題 2.1","label":"補完偽代碼","q":"補完計算 BMI 的算法（BMI = 體重 ÷ 身高²）。會用多組數據測試你的算式。","template":"輸入 weight, height\nbmi ← ［1］\n輸出 bmi","ref":["weight/(height*height)"],"tests":[{"inputs":"60, 1.7"},{"inputs":"45, 1.5"},{"inputs":"80, 2"}],"hint":"身高² 要寫成 `height*height`，並用括號包住，否則會先做除法。"}]},{"id":"s3","title":"變量與賦值","pages":"教科書 p.36–37","learn":[{"pts":["**變量（variable）**：電腦記憶體內儲存數據的位置，像寫上名字的盒子。（p.36–37）","變量名稱是程式用來辨別變量的**識別符（identifier）**；名稱要反映用途，`weight` 比 `A` 易明白。（p.36）","計算 BMI 的程式用了 3 個變量：`weight`、`height`、`bmi`。（p.36 試想想）","**賦值（assignment）**：把數據放入指定變量；偽代碼用賦值運算符 `←`。（p.37）"]},{"table":{"head":["偽代碼","意思"],"rows":[["`輸入 price`","接收用戶的輸入，放入變量 price"],["`price ← 8000`","把 8000 放入變量 price"],["`new ← price`","把變量 price 的值**複製**到變量 new"]]},"cap":"表 2.2 常見的賦值方法（p.37）"},{"warn":"常見錯誤：`new ← price` 是「複製」，不是「轉移」——執行後 price 的值不變。（p.37 旁註）"},{"p":"變量命名規則（例如不能以數字開首）會在單元 4 學習。"},{"sim":{"code":"price ← 8000\nnew ← price\n輸出 price, new","open":[]},"cap":"逐步執行，留意 price 盒子在第 2 步之後有沒有改變。"}],"tries":[{"id":"u3-s3-t1","pts":4,"src":"教科書 p.37 表 2.2","code":"price ← 8000\nnew ← price\n輸出 price, new","q":"先估：輸出是什麼？","options":["8000 8000","0 8000","8000 0","8000"],"why":"`new ← price` 把 price 的值複製到 new，price 仍然是 8000。"}],"practice":[{"id":"u3-s3-p1","type":"mc","pts":3,"src":"教科書 p.37","q":"`new ← price` 的意思是什麼？","options":["把變量 new 的值複製到變量 price","把變量 price 的值轉移到變量 new，price 變成沒有值","把變量 price 的值複製到變量 new","比較 new 和 price 是否相等"],"answer":2,"hint":"`←` 右邊的值放入左邊的變量；右邊的變量不會改變。"},{"id":"u3-s3-p2","type":"fill","pts":2,"src":"教科書 p.36 試想想","q":"例題 2.1 計算 BMI 的程式運用了多少個變量？","code":"輸入 weight, height\nbmi ← weight/(height*height)\n輸出 bmi","blanks":[{"label":"變量數目","value":"3","accept":["3個","三","三個"]}],"hint":"數一數出現過的變量名稱。"}]},{"id":"s4","title":"運算算式與追蹤表","pages":"教科書 p.38–39","learn":[{"pts":["一般賦值語句：`變量 ← 算式`；**右邊的新值會取代變量原有的值**。（p.38）","運算算式由數據（數字、變量或常數）及**數學運算符**組成，例如 `2 * PI * radius`。（p.38 圖 2.5）","數學運算符：加 `+`、減 `-`、乘 `*`（部分題目寫 `×`）、除 `/`。（p.38 表 2.3）","`new ← price + 5`：先讀 price 的值，加 5，結果放入 new。（p.38 表 2.4）","`price ← price + 1`：先讀 price 的值，加 1，結果**放回** price。（p.38 表 2.4）","空運行時用**追蹤表**逐句記錄變量的值；先填改變了的值，再填其餘不變的值。（p.39 提示）"]},{"h":"例題 2.2 第 1 題（p.39）"},{"sim":{"code":"A ← 2\nB ← 5\nA ← B - A\nA ← A * B\nB ← A - B\n輸出 A","open":["trace"]},"cap":"打開了「追蹤表」：每執行一句，便多填一行。粗體是該句改變了的值。"}],"tries":[{"id":"u3-s4-t1","pts":4,"src":"教科書 p.39 活動 2.2（第 3 題）","code":"A ← 6\nB ← A/2\nA ← 8\n輸出 A, B","q":"先估：輸出是什麼？","options":["8 4","8 3","6 3","3 8"],"open":["trace"],"why":"B 賦值時取了 A/2 = 3；之後 A 改為 8，但 B 不會自動更新，仍然是 3。（p.39 旁註）"}],"practice":[{"id":"u3-s4-p1","type":"trace","pts":4,"src":"教科書 p.39 例題 2.2 第 1 題","label":"追蹤表填格","code":"A ← 2\nB ← 5\nA ← B - A\nA ← A * B\nB ← A - B\n輸出 A","spec":{"mode":"stmt","cols":["A","B"]},"hint":"每一行只會改變 `←` 左邊的變量；`輸出` 不會改變變量。"},{"id":"u3-s4-p2","type":"fill","pts":3,"src":"教科書 p.41 測試站 2.1 第 3 題（挑戰題）","q":"以下算法的輸出是什麼？（用空格分隔）","code":"A ← 1\nB ← 2\nC ← A + B\nA ← B + C\nB ← C + A\n輸出 A, B, C","blanks":[{"label":"輸出","ask":"out"}],"hint":"`B ← C + A` 用的是 A 的**新**值。"}]},{"id":"s5","title":"交換兩個變量","pages":"教科書 p.40","learn":[{"pts":["要交換兩個變量的值，要用一個暫存變量（例如 `temp`）。（p.40 例題 2.2 第 2 題）","三步：① `temp ← X` ② `X ← Y` ③ `Y ← temp`。","只寫 `X ← Y`、`Y ← X` 不能交換：第一句已經用 Y 的值**取代**了 X 原本的值。（p.40 想像）","類比：要交換一杯水和一杯橙汁，必須先準備第三隻杯。（p.40）","交換（swapping）在排序問題中經常出現。（p.40 備註）"]},{"sim":{"code":"X ← 3\nY ← 9\ntemp ← X\nX ← Y\nY ← temp","open":["trace"]},"cap":"例題 2.2 第 2 題（p.40）：逐步執行，看 temp 怎樣暫存 X 的值。"}],"tries":[{"id":"u3-s5-t1","pts":4,"src":"教科書 p.40 想像","code":"X ← 3\nY ← 9\nX ← Y\nY ← X\n輸出 X, Y","q":"先估：以下算法沒有用 temp。輸出是什麼？","options":["9 3","3 9","9 9","3 3"],"open":["trace"],"why":"`X ← Y` 之後 X 已變成 9，原本的 3 不見了；`Y ← X` 再把 9 放入 Y。"}],"practice":[{"id":"u3-s5-p1","type":"trace","pts":4,"src":"教科書 p.103 長題目 1 (a)(b)","label":"追蹤表填格","q":"空運行以下算法，完成追蹤表（只需填寫改變了的值），並寫出輸出。教科書沒有附這題的答案，網站答案由模擬器計算。","code":"A ← 5\nB ← 7\nC ← A\nA ← B\nB ← C\nC ← (A - C) × B\n輸出 A, C, B","spec":{"mode":"stmt","cols":["A","B","C"]},"hint":"首 5 句其實是用 C 作暫存變量，交換 A 和 B。"}]},{"id":"write","kind":"write","title":"寫算法","pages":"教科書 p.35、p.40","intro":"在編輯器寫偽代碼，可以先按「▶ 下一步」自己測試，再按「提交評核」。系統會用多組測試數據檢查；不通過時會說明是哪一組數據、期望輸出和你的輸出。","tasks":[{"id":"u3-w1","tier":"必做","title":"計算 BMI","pts":20,"src":"教科書 p.35 例題 2.1","prompt":"輸入體重 `weight`（kg）及身高 `height`（m），計算並輸出 BMI。\nBMI = 體重 ÷ 身高²","starter":"輸入 weight, height\n","ref":"輸入 weight, height\nbmi ← weight/(height*height)\n輸出 bmi","tests":[{"inputs":"60, 1.7","show":true},{"inputs":"45, 1.5"},{"inputs":"80, 2"},{"inputs":"52.5, 1.62"}],"hint":"`bmi ← weight/(height*height)`——記得括號，最後要 `輸出 bmi`。"},{"id":"u3-w2","tier":"進階","title":"交換兩個變量","pts":10,"src":"教科書 p.40 例題 2.2 第 2 題","prompt":"程式輸入兩個數值到 `X` 和 `Y`。在中間加入語句，**交換** X 和 Y 的值，最後輸出 X, Y。\n不可以改動第一行和最後一行。","starter":"輸入 X, Y\n\n輸出 X, Y","ref":"輸入 X, Y\ntemp ← X\nX ← Y\nY ← temp\n輸出 X, Y","check":{"vars":["X","Y"]},"rules":[{"re":"^輸入 X, ?Y$","msg":"請保留第一行「輸入 X, Y」。"},{"re":"^輸出 X, ?Y$","msg":"請保留最後一行「輸出 X, Y」。"}],"tests":[{"inputs":"3, 9","show":true},{"inputs":"5, -2"},{"inputs":"7, 7"},{"inputs":"100, 1"}],"hint":"先用 `temp ← X` 暫存 X 的值。"},{"id":"u3-w3","tier":"挑戰","title":"三個變量循環移位","pts":5,"src":"延伸：教科書 p.40 交換算法","prompt":"程式輸入三個數值到 `A`、`B`、`C`。在中間加入語句，令\n`A` 得到 B 原本的值、`B` 得到 C 原本的值、`C` 得到 A 原本的值，最後輸出 A, B, C。\n例如輸入 1, 2, 3，輸出 2 3 1。不可以改動第一行和最後一行。","starter":"輸入 A, B, C\n\n輸出 A, B, C","ref":"輸入 A, B, C\ntemp ← A\nA ← B\nB ← C\nC ← temp\n輸出 A, B, C","check":{"vars":["A","B","C"]},"rules":[{"re":"^輸入 A, ?B, ?C$","msg":"請保留第一行「輸入 A, B, C」。"},{"re":"^輸出 A, ?B, ?C$","msg":"請保留最後一行「輸出 A, B, C」。"}],"tests":[{"inputs":"1, 2, 3","show":true},{"inputs":"10, 20, 30"},{"inputs":"4, 4, 9"},{"inputs":"-1, 0, 8"}],"hint":"只需要一個 temp：先暫存 A，然後由 A 開始逐個「向前」複製。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.41、p.100–101","items":[{"id":"u3-q1","pts":4,"src":"教科書 p.41 測試站 2.1 第 1 題（參考 DSE 2019 卷一甲部第 30 題，答對率 81%）","q":"下列算法的輸出是什麼？","code":"A ← 1\nB ← 2\nC ← A + B\nA ← 6\nB ← 8\n輸出 C","options":["3","7","8","14"],"answer":"A","verify":true,"why":"C 在第 3 句已計算為 3；之後改變 A、B 不會改變 C。"},{"id":"u3-q2","pts":4,"src":"教科書 p.41 測試站 2.1 第 2 題","q":"下列算法的輸出是什麼？","code":"A ← 3\nB ← 5\nC ← A * B\nA ← A + 1\nB ← B - 1\nC ← A * B\n輸出 A, B, C","options":["3　5　15","3　4　12","4　5　20","4　4　16"],"answer":"D","verify":true,"why":"A = 4、B = 4，最後一句重新計算 C = 4 × 4 = 16。"},{"id":"u3-q3","pts":4,"src":"教科書 p.100 課題練習 選擇題 1","q":"以下算法的輸出是什麼？","code":"A ← 5\nB ← 7\nA ← B - 2\nC ← B\nB ← C\n輸出 B, A, C","options":["5, 7, 7","7, 5, 7","5, 5, 5","7, 7, 5"],"answer":"B","verify":true,"why":"留意輸出次序是 B, A, C。"},{"id":"u3-q4","pts":4,"src":"教科書 p.100 課題練習 選擇題 2","q":"以下算法的輸出是什麼？","code":"E ← 0\nF ← 1\nG ← 2\nE ← G × F\nF ← F + E\nG ← E × F\n輸出 G","options":["3","2","6","0"],"answer":"C","verify":true,"why":"E = 2 × 1 = 2；F = 1 + 2 = 3；G = 2 × 3 = 6。"},{"id":"u3-q5","pts":4,"src":"教科書 p.101 課題練習 選擇題 4","q":"以下算法的目的是什麼？","code":"輸入 A\n輸入 B\ntemp ← B\nA ← temp\nB ← A","options":["對調 A 和 B 的數值","把 B 轉成 A 的數值","把 A 轉成 B 的數值","以上皆非"],"answer":"C","why":"例如輸入 3、8：temp = 8，A = 8，B = 8。A 變成和 B 一樣，即「把 A 轉成 B 的數值」；兩個值並沒有對調（已用 tools/test_engine.js 核對）。"}]},{"id":"more","kind":"endless","title":"無限練習","gens":["seq","swap","inout"],"intro":"按教科書題型（p.39 活動 2.2、p.40–41）隨機生成空運行題目，答案由模擬器計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]},{"id":"u4","title":"數據類型、命名與變量分析表","book":"教科書 D1 第 2 章 p.36、p.42–47（另有 p.101、p.106 課題練習）","key":"D1-u4-hmac-8c3f60a19e","writeLabel":"分析題","sections":[{"id":"s1","title":"變量命名規則","pages":"教科書 p.36","learn":[{"pts":["變量要先**命名**，才可以儲存、更新或讀取數據。（p.36）","**規則 1**：只能以英文字母（A–Z、a–z）或下劃線 `_` 開首，**不能以數字開首**。✓ `number1` ✓ `numberOne` ✗ `1number`","**規則 2**：只能用英文字母、數字和下劃線，**不能有空白格或其他符號**（例如 `!`、`#`、`$`）。✓ `new_number` ✓ `newNumber` ✗ `new number` ✗ `newnumber!`","程式語言如果區分大小寫，`bmi` 和 `Bmi` 是**兩個不同**的變量；變量名稱通常以小寫字母起頭。（p.36 提示 1）","名稱要反映用途：`weight`、`height` 比 `A`、`B` 易明白。（p.36 提示 3）","多於一個詞：用下劃線或大小寫分隔，例如 `sum_of_scores`、`sumOfScores`。（p.36 提示 4）","同一程式內每個變量名稱都必須**獨一無二**。（p.36 提示 5）"]},{"sim":{"code":"sum_of_scores ← 0\nsumOfScores ← 10\n輸出 sum_of_scores, sumOfScores","open":[]},"cap":"兩種分隔詞語的寫法都符合規則，但它們是兩個不同的變量。試把第 1 行改成 `1sum ← 0` 想像一下：模擬器會說「無法理解」。"}],"tries":[{"id":"u4-s1-t1","pts":4,"src":"教科書 p.36 提示 1","code":"bmi ← 1\nBmi ← 2\n輸出 bmi, Bmi","q":"先估：本平台的偽代碼**區分大小寫**。以下算法的輸出是什麼？","options":["1 2","2 2","1 1","執行時出錯"],"why":"`bmi` 和 `Bmi` 大小寫不同，是兩個不同的變量，所以各自保留自己的值。"}],"practice":[{"id":"u4-s1-p1","type":"mc","pts":3,"src":"教科書 p.36 規則 1、2","q":"以下哪一個變量名稱**不**符合命名規則？","nameRule":"invalid","options":["`number1`","`new_number`","`_total`","`1number`"],"answer":3,"hint":"先看第一個字符：不能是數字。"},{"id":"u4-s1-p2","type":"mc","pts":2,"src":"教科書 p.36 規則 2","q":"以下哪一個變量名稱符合命名規則？","nameRule":"valid","options":["`new number`","`newnumber!`","`newNumber`","`new-number`"],"answer":2,"hint":"只可以用英文字母、數字和下劃線；空白格、`!`、`-` 都不可以。"}]},{"id":"s2","title":"四種常見數據類型","pages":"教科書 p.42","learn":[{"pts":["**數據類型（data type）**：定義變量儲存的值屬於哪種類型。（p.42）","電腦按數據類型分配合適的記憶體，數據類型亦**決定變量能做哪種運算**，避免程式出錯。（p.42）","**字串（string）**由字符組成，屬數據結構，但很多程式語言把它當作數據類型使用，例如 `\"abc\"`、`\"0011\"`。（p.42）"]},{"table":{"head":["數據類型","數據","例子"],"rows":[["整數（integer）","整數，包括正負數","`288`、`-101`"],["實數（real）／浮點數（float）","整數及小數，包括正負數","`56.5`、`-30.0`、`0.05`"],["字符（character）","字母、數字和一些特別符號（一個）","`'a'`、`'B'`、`'8'`、`'%'`"],["布爾（Boolean）","只可能是 True 或 False","`True`／`False`（1／0）"]]},"cap":"表 2.5 常見的數據類型（p.42）"},{"warn":"易錯：字串 `\"HKDSE5\"` 裏的 `5` 是**字符**，不是數值。（2016 卷一甲部第 2 題，答對率只有 18%，約一半考生以為「5」會以數值儲存）"},{"note":"擴闊視野（p.42）：每種數據類型都有可儲存的數值範圍，超出範圍會令程式出錯；範圍因程式語言而異。"},{"sim":{"code":"A ← 12\nB ← 3\n輸出 A + B","open":[]},"cap":"整數可以相加。下面「試」會把 B 改成字串 `\"3\"`，結果會怎樣？"}],"tries":[{"id":"u4-s2-t1","pts":4,"src":"教科書 p.42（數據類型決定可做的運算）","code":"A ← 12\nB ← \"3\"\nC ← A + B\n輸出 C","allowError":true,"q":"先估：`B ← \"3\"` 把**字串** \"3\" 放入 B。以下算法執行時會怎樣？","options":["輸出 15","輸出 123","輸出 \"123\"","執行時出錯"],"answer":3,"why":"A 是整數，B 是字串，數據類型不同，不能做加法，程式出錯（模擬器會說明原因）。這正是 p.42 說數據類型「決定變量能進行哪種運算」的意思。"}],"practice":[{"id":"u4-s2-p1","type":"mc","pts":3,"src":"教科書 p.42 表 2.5","q":"`'8'`（單引號內的 8）屬於哪一種數據類型？","options":["整數","實數","字符","字串","布爾"],"answer":2,"hint":"單引號內一個字符（包括數字）是字符。"},{"id":"u4-s2-p2","type":"mc","pts":2,"src":"教科書 p.42 表 2.5","q":"`-30.0` 屬於哪一種數據類型？","options":["整數","實數","字符","字串","布爾"],"answer":1,"hint":"有小數點（即使是 .0）的數值是實數。"}]},{"id":"s3","title":"選擇合適的數據類型","pages":"教科書 p.43–44","learn":[{"pts":["**數字類別（整數／實數）**：用作運算的數字，例如身高、年齡、考試分數、薪金。（p.43）","**文字類別（字符／字串）**：文字及**不用作運算**的數據，例如姓名、電郵地址、短訊。（p.43）","**邏輯類別（布爾）**：只有「真」或「假」——數據只有兩個可能性時使用。（p.43）","電話號碼看似數字，其實應用**字串**：不用運算，又可能要加上 (852) 或 +852。（p.43 提示）","問卷的年齡組別（例如「20-39歲」）是範圍，應用字串。（p.44 試想想）"]},{"warn":"易錯：2015 卷一乙部第 4(b)(iii) 題問「選用布爾作為 FLAG 數據類型的好處」，考試報告評為表現差劣。記住：只有兩個可能性的數據用布爾。"},{"h":"例題 2.3（p.44，參考 DSE 2012 1A Q34）"},{"table":{"head":["","善款數字（65000.5）","捐獻人數（72）","會長的話（新年快樂!）"],"rows":[["數據類型","實數（有小數點）","整數（人數是整數，方便計總數）","字串（文字）"]]}}],"tries":[{"id":"u4-s3-t1","pts":4,"src":"教科書 p.43 提示（延伸：前置 0）","code":"輸入 code\n輸出 code","inputs":"007","fixedInputs":true,"q":"先估：會員編號 `007` 輸入後當作**整數**儲存。輸出是什麼？","options":["007","7","0","執行時出錯"],"answer":1,"why":"整數不會保留前面的 0，所以 007 變成 7。編號、電話號碼這類不用運算的數據，應用字串儲存。"}],"practice":[{"id":"u4-s3-p1","type":"mc","pts":3,"src":"教科書 p.44 例題 2.3（參考 DSE 2012 1A Q34）","q":"慈善機構網頁顯示：善款數字 65000.5、捐獻人數 72、會長的話「新年快樂!」。以下哪組數據類型最合適？（次序：善款數字、捐獻人數、會長的話）","options":["整數、字符、字串","實數、整數、字串","整數、整數、字串","實數、字符、字符"],"answer":1,"hint":"善款有小數點；人數是整數；一句說話是文字。"},{"id":"u4-s3-p2","type":"mc","pts":2,"src":"教科書 p.44 測試站 2.2","q":"網上問卷有「聯絡電郵」文字框、「網站評分」1 至 5 顆星、「同意接收廣告」核取方塊。以下哪組數據類型最合適？（次序：聯絡電郵、網站評分、同意接收廣告）","options":["整數、整數、布爾","字串、字串、字串","整數、字串、字串","字串、整數、布爾"],"answer":3,"hint":"核取方塊只有「剔」或「不剔」兩個可能性。"}]},{"id":"s4","title":"常數","pages":"教科書 p.36、p.38","learn":[{"pts":["變量的數據可以修改；某些值是**固定**的，例如 π = 3.14159。（p.36 提示 2）","擁有固定數據的變量稱為**常數（constant）**，常以**全大寫**命名，例如 `PI`。（p.36 提示 2）","運算算式可以由數字、變量或常數組成，例如 `2 * PI * radius`。（p.38 圖 2.5）"]},{"sim":{"code":"PI ← 3.14159\nradius ← 10\nc ← 2 * PI * radius\n輸出 c","open":["trace"]},"cap":"計算圓周：PI 在整個算法中都不會改變。"}],"tries":[{"id":"u4-s4-t1","pts":4,"src":"教科書 p.38 圖 2.5","code":"PI ← 3.14\nradius ← 5\narea ← PI * radius * radius\n輸出 area","q":"先估：輸出是什麼？","options":["78.5","31.4","15.7","25"],"why":"3.14 × 5 × 5 = 78.5。"}],"practice":[{"id":"u4-s4-p1","type":"fill","pts":3,"src":"教科書 p.38 圖 2.5","q":"以下算法的輸出是什麼？","code":"PI ← 3.14\n輸入 radius\nc ← 2 * PI * radius\n輸出 c","inputs":"10","blanks":[{"label":"輸出","ask":"out"}],"hint":"2 × 3.14 × 10。"},{"id":"u4-s4-p2","type":"mc","pts":2,"src":"教科書 p.36 提示 2","q":"以下哪一項關於常數的描述是正確的？","options":["常數的值在算法執行期間固定不變","常數只可以儲存整數","常數的名稱必須以數字開首","常數不需要命名"],"answer":0,"hint":"例子：π = 3.14159 永遠不變。"}]},{"id":"s5","title":"變量分析表與 IPO","pages":"教科書 p.43、p.46–47","learn":[{"pts":["**變量分析表**（又名識別符圖表，identifier table）：列出算法需要的每個變量、數據類型及用途。（p.43）","設計算法時先寫出**輸入、處理、輸出**（IPO），再寫變量分析表，最後寫偽代碼及流程圖。（p.46 例題 2.4）"]},{"table":{"head":["變量名稱","數據類型","用途"],"rows":[["`weight`","實數","輸入的體重，以 kg 為單位"],["`height`","實數","輸入的身高，以 m 為單位"],["`bmi`","實數","最後輸出的 BMI 值"]]},"cap":"計算 BMI 的變量分析表（p.43）"},{"h":"例題 2.4：三次中文測驗的平均分（p.46）"},{"table":{"head":["輸入","處理","輸出"],"rows":[["test1、test2、test3","avg_mark = (test1 + test2 + test3) ÷ 3","avg_mark"]]},"cap":"(a) 輸入、處理和輸出"},{"table":{"head":["變量名稱","數據類型","用途"],"rows":[["`test1`","實數","輸入的第 1 次測驗成績"],["`test2`","實數","輸入的第 2 次測驗成績"],["`test3`","實數","輸入的第 3 次測驗成績"],["`avg_mark`","實數","最後輸出的平均分"]]},"cap":"(b) 變量分析表"},{"fix":"教科書 p.46 偽代碼印作「輸入 test 1, test 2, test 3」（中間有空格），應為「輸入 test1, test2, test3」——有空格的名稱不符合命名規則。"},{"sim":{"code":"輸入 test1, test2, test3\navg_mark ← (test1 + test2 + test3) / 3\n輸出 avg_mark","inputs":"70, 80, 66","open":["flow"]},"cap":"(c) 偽代碼及流程圖。可以改「輸入數據」再試。"}],"tries":[{"id":"u4-s5-t1","pts":4,"src":"教科書 p.46 例題 2.4","code":"輸入 test1, test2, test3\navg_mark ← test1 + test2 + test3 / 3\n輸出 avg_mark","inputs":"60, 90, 30","fixedInputs":true,"q":"先估：這個版本**漏了括號**。輸入 `60, 90, 30` 時輸出是什麼？","options":["60","160","180","50"],"open":["trace"],"why":"先乘除後加減：30 ÷ 3 = 10，再 60 + 90 + 10 = 160。正確寫法要用括號 `(test1 + test2 + test3) / 3`，答案才是 60。"}],"practice":[{"id":"u4-s5-p1","type":"complete","pts":3,"src":"教科書 p.46 例題 2.4 (c)","label":"補完偽代碼","q":"補完計算平均分的算法。會用多組數據測試。","template":"輸入 test1, test2, test3\navg_mark ← ［1］\n輸出 avg_mark","ref":["(test1 + test2 + test3) / 3"],"tests":[{"inputs":"70, 80, 66"},{"inputs":"60, 90, 30"},{"inputs":"55.5, 70, 81"}],"hint":"三個成績相加後才除以 3，要用括號。"},{"id":"u4-s5-p2","type":"mc","pts":2,"src":"教科書 p.47 測試站 2.3（參考 DSE 2016 1A Q33）","q":"IPO 周期：輸入 B、H；處理 AREA = B * H / 2；輸出 AREA。流程圖：開始 → 輸入 B, H → AREA ← B * H / 2 → 輸出 AREA → 結束。以下哪句描述是**不正確**的？","options":["此 IPO 周期運用了 3 個變量。","此 IPO 周期展示了數據類型。","此流程圖展示的問題可能是找出三角形的面積。","此流程圖運用序列控制結構解決問題。"],"answer":1,"hint":"IPO 只列出輸入、處理、輸出；數據類型要看變量分析表。"}]},{"id":"write","kind":"write","title":"分析題","pages":"教科書 p.36、p.43–47","intro":"本單元的「寫算法」改為分析題：一題寫偽代碼，其餘填寫表格。每題可提交多次；答錯兩次後可以看答案，但只得 1 分。","tasks":[{"id":"u4-w1","tier":"必做","title":"三角形面積","pts":10,"src":"教科書 p.47 測試站 2.3","prompt":"輸入三角形的底 `B` 和高 `H`，計算面積 `AREA`（= 底 × 高 ÷ 2）並輸出。","starter":"輸入 B, H\n","ref":"輸入 B, H\nAREA ← B * H / 2\n輸出 AREA","tests":[{"inputs":"6, 4","show":true},{"inputs":"5, 3"},{"inputs":"2.5, 8"},{"inputs":"10, 10"}],"hint":"`AREA ← B * H / 2`，最後 `輸出 AREA`。"},{"id":"u4-w2","kind":"table","tier":"必做","title":"變量分析表：書店收銀","pts":10,"src":"仿教科書 p.43、p.46 例題 2.4 (b)","prompt":"書店收銀的算法如下。為每個變量選擇最合適的數據類型及用途。","code":"輸入 name, num_books, price\ntotal ← num_books * price\n輸出 name, total","head":["變量名稱","數據類型","用途"],"opts":{"T":["整數","實數","字符","字串","布爾"],"U":["輸入的顧客姓名","輸入的書本數目","輸入的每本書價錢（元，可有小數）","最後輸出的應付總額"]},"rows":[["`name`",{"sel":"T","a":"字串"},{"sel":"U","a":"輸入的顧客姓名"}],["`num_books`",{"sel":"T","a":"整數"},{"sel":"U","a":"輸入的書本數目"}],["`price`",{"sel":"T","a":"實數"},{"sel":"U","a":"輸入的每本書價錢（元，可有小數）"}],["`total`",{"sel":"T","a":"實數"},{"sel":"U","a":"最後輸出的應付總額"}]],"hint":"書本數目只會是整數；價錢可有小數，所以價錢 × 數目也可能有小數。","why":"total = 整數 × 實數，結果可能有小數，所以用實數。"},{"id":"u4-w3","kind":"table","tier":"進階","title":"判斷變量名稱","pts":10,"src":"教科書 p.36 規則 1、2","nameCol":1,"prompt":"判斷每個變量名稱是否符合命名規則；不符合的，選出原因。","head":["變量名稱","是否符合","原因"],"opts":{"OK":["符合","不符合"],"WHY":["—（符合兩條規則）","以數字開首","含空白格或其他符號"]},"rows":[["`total_2`",{"sel":"OK","a":"符合"},{"sel":"WHY","a":"—（符合兩條規則）"}],["`2total`",{"sel":"OK","a":"不符合"},{"sel":"WHY","a":"以數字開首"}],["`avg mark`",{"sel":"OK","a":"不符合"},{"sel":"WHY","a":"含空白格或其他符號"}],["`_count`",{"sel":"OK","a":"符合"},{"sel":"WHY","a":"—（符合兩條規則）"}],["`score#`",{"sel":"OK","a":"不符合"},{"sel":"WHY","a":"含空白格或其他符號"}],["`sumOfScores`",{"sel":"OK","a":"符合"},{"sel":"WHY","a":"—（符合兩條規則）"}],["`e-mail`",{"sel":"OK","a":"不符合"},{"sel":"WHY","a":"含空白格或其他符號"}],["`MAX`",{"sel":"OK","a":"符合"},{"sel":"WHY","a":"—（符合兩條規則）"}]],"hint":"規則 1：不能以數字開首；規則 2：只可用英文字母、數字和下劃線。"},{"id":"u4-w4","kind":"table","tier":"挑戰","title":"網上報名表的數據類型","pts":5,"src":"仿教科書 p.43–44、p.101 選擇題 3","prompt":"學校網上報名表收集以下資料。為每項選擇最合適的數據類型。","head":["資料","數據類型"],"opts":{"T":["整數","實數","字符","字串","布爾"]},"rows":[["學生姓名（例如 陳大文）",{"sel":"T","a":"字串"}],["聯絡電話（例如 +852 9123 4567）",{"sel":"T","a":"字串"}],["參加人數（例如 3）",{"sel":"T","a":"整數"}],["身高（m，例如 1.68）",{"sel":"T","a":"實數"}],["是否需要校車（是／否）",{"sel":"T","a":"布爾"}],["T 恤尺碼（S、M 或 L，一個字母）",{"sel":"T","a":"字符"}]],"hint":"先問：要用來計算嗎？有小數嗎？只有兩個可能嗎？是一個字符還是一串文字？","why":"電話號碼不用運算，又有 + 號和空格，用字串；只有一個字母的尺碼用字符。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.36、p.42–44、p.101、p.106","items":[{"id":"u4-q1","pts":4,"src":"教科書 p.101 課題練習 選擇題 3（參考 DSE 2018 1A Q8）","tags":[{"t":"hot","why":"選擇合適的數據類型：2012 甲34（答對率 83%）、2018 甲8（79%）、2024 甲13（73%）"}],"q":"某公司使用表格輸入會員資料：用戶名稱 `Y123456`、名字 `Tom Cheung`、電郵地址 `tom123456@hellomail.com`。以下哪組陳述是正確的？","options":["欄名「用戶名稱」— 數據類型「整數」","欄名「名字」— 數據類型「字符」","欄名「電郵地址」— 數據類型「布爾」","以上皆非"],"answer":"D","why":"三項都是文字，應用字串：用戶名稱含英文字母，不是整數；名字有多個字符，不是單一字符；電郵地址不是只有真／假。"},{"id":"u4-q2","pts":4,"src":"自擬（題型參考 DSE 2024 卷一甲部第 13 題）","tags":[{"t":"hot","why":"選擇合適的數據類型：2012 甲34（答對率 83%）、2018 甲8（79%）、2024 甲13（73%）"}],"q":"圖書館會員資料中，以下哪一項最適合定義為**布爾**數據類型？","options":["會員是否已繳交年費","會員的出生日期","會員已借書本的數目","會員的電話號碼"],"answer":"A","why":"「是否已繳費」只有兩個可能性（真／假）。"},{"id":"u4-q3","pts":4,"src":"自擬（考點參考 DSE 2016 卷一甲部第 2 題）","tags":[{"t":"trap","why":"字串中的數字也是字符：2016 甲2 答對率 18%"}],"q":"變量 `code` 儲存了字串 `\"HKDSE5\"`。以下哪一項是正確的？","options":["「5」以整數儲存，其餘以字符儲存","「5」以實數儲存","6 個都是字符，整個是字串","整個字串以布爾儲存"],"answer":"C","why":"字串由字符組成；字串裏的數字「5」也是字符，不是數值。"},{"id":"u4-q4","pts":4,"src":"教科書 p.36 規則 1、2","q":"以下哪些是有效的變量名稱？\n(1) `total_2`\n(2) `2total`\n(3) `total 2`","options":["只有 (1)","只有 (1) 和 (2)","只有 (1) 和 (3)","(1)、(2) 和 (3)"],"answer":"A","why":"(2) 以數字開首；(3) 有空白格。"},{"id":"u4-q5","pts":4,"src":"改編自教科書 p.106 長題目 6(a)（教科書沒有附答案）","q":"以下算法找出同學 A、B、C 中誰最高。變量 A、B 和 C 最可能是什麼數據類型？","code":"輸入 A\n輸入 B\n輸入 C\n如果 (A > B AND A > C) 則\n    輸出 A","options":["字串","整數或實數","布爾","字符"],"answer":"B","why":"身高要用來比較大小，屬數字類別；以 cm 計可用整數，以 m 計有小數要用實數。"}]},{"id":"more","kind":"endless","title":"無限練習","gens":["dtype","name","circle"],"intro":"按教科書內容（p.36 命名規則、p.42–44 數據類型、p.38 常數）隨機出題。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]},{"id":"u5","title":"選擇：如果…則…否則","book":"教科書 D1 第 2 章 p.45、p.48–60（另有 p.101、p.105 課題練習）","key":"D1-u5-hmac-41d9e7b2a6","sections":[{"id":"s1","title":"布爾算式與關係運算符","pages":"教科書 p.45、p.48、p.51","learn":[{"pts":["三類基本**控制結構**：序列、**選擇**、迭代。（p.45）","**選擇控制結構**：根據條件，在**對分**（兩條路）或**多向**（多條路）選擇中作出決定。（p.48）","**布爾算式**：結果只會是 True（真）或 False（假），屬布爾數據類型。（p.48）","用**關係運算符**建立布爾算式，例如 `mark >= 50`。（p.48）"]},{"table":{"head":["關係運算符","意義","布爾算式","mark 為 50 時"],"rows":[["`=`","等於","`mark = 50`","True"],["`\u003c`","小於","`mark \u003c 50`","False"],["`≤` 或 `\u003c=`","小於或等於","`mark \u003c= 50`","True"],["`>`","大於","`mark > 50`","False"],["`≥` 或 `>=`","大於或等於","`mark >= 50`","True"],["`≠` 或 `\u003c>` 或 `!=`","不相等","`mark \u003c> 50`","False"]]},"cap":"表 2.6 關係運算符及布爾算式（p.48）"},{"warn":"常見錯誤：`=\u003c`、`=>` 不是關係運算符——關係運算符**不會以等號起頭**。✓ `\u003c=` ✓ `>=`（p.48、p.99）"},{"sim":{"code":"mark ← 50\nr1 ← mark = 50\nr2 ← mark \u003c 50\nr3 ← mark \u003c= 50\nr4 ← mark \u003c> 50\n輸出 r1, r2, r3, r4","open":[]},"cap":"`r1 ← mark = 50`：右邊的 `=` 是比較，結果 True／False 放入 r1。逐步執行看看。"}],"tries":[{"id":"u5-s1-t1","pts":4,"src":"教科書 p.51 活動 2.3 第 1 題","code":"age ← 65\n輸出 age >= 65, age \u003c> 65","q":"先估：以下算法的輸出是什麼？","options":["True False","False True","True True","False False"],"why":"65 >= 65 成立（True）；65 \u003c> 65 即「65 不等於 65」，不成立（False）。"}],"practice":[{"id":"u5-s1-p1","type":"fill","pts":3,"src":"教科書 p.51 活動 2.3 第 1 題","label":"填表","q":"輸入 age 為 70。寫出每個條件的邏輯結果（True 或 False）。","code":"age ← 70\nr1 ← age = 65\nr2 ← age \u003c 65\nr3 ← age \u003c= 65\nr4 ← age > 65\nr5 ← age >= 65\nr6 ← age != 65","blanks":[{"label":"age = 65","ask":{"var":"r1"}},{"label":"age \u003c 65","ask":{"var":"r2"}},{"label":"age \u003c= 65","ask":{"var":"r3"}},{"label":"age > 65","ask":{"var":"r4"}},{"label":"age >= 65","ask":{"var":"r5"}},{"label":"age != 65","ask":{"var":"r6"}}],"hint":"把 70 代入每個條件：70 等於 65 嗎？70 小於 65 嗎？……"},{"id":"u5-s1-p2","type":"mc","pts":2,"src":"教科書 p.48 常見錯誤","q":"以下哪一個**不是**正確的關係運算符寫法？","options":["`\u003c=`","`>=`","`=\u003c`","`\u003c>`"],"answer":2,"hint":"關係運算符不會以等號起頭。"}]},{"id":"s2","title":"如果…則","pages":"教科書 p.49","learn":[{"pts":["**對分選擇**：用布爾算式作**條件**，結果決定執行哪些語句。（p.49）","條件為**真** → 執行「則」部分；條件為**假** → 忽略「則」部分，條件語句結束。（p.49）","「則」部分可以是一系列語句（全
