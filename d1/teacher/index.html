<script>
D1.teacher({"units":[{"id":"u1","title":"界定及分析問題","book":"教科書 D1 第 1 章 p.2–9、p.25（另有 p.28 課題練習）","key":"D1-u1-hmac-2e7a94c15b","writeLabel":"分析題","sections":[{"id":"s1","title":"界定問題","pages":"教科書 p.4–6","learn":[{"pts":["問題不夠具體便難以解決：朋友只說「我不懂使用這個手機」，你不知道他是不懂安裝程式還是不懂打電話。（p.4）","用編程解決問題，第一步**不是**寫程式，而是**界定問題及其範圍**。（p.4）","類比：考試先要理解題目的範圍和意思，才能有效作答。（p.4）","思考工具：**六何法（5W1H）**、**腦圖（mind map）**。（p.4）","也可以做研究：**市場調查、訪問、閱讀參考資料**。（p.5）"]},{"table":{"head":["六何","問題","例子"],"rows":[["WHEN","網上商店的營業時間？","24 小時運作？全年無休？"],["WHERE","能在哪些平台上運作？","手機、平板電腦、桌上電腦"],["WHY","為什麼要設立網上商店？","購物更方便、提高銷量"],["WHAT","網上商店有什麼元素？","商品種類、產品資訊、聊天機器人"],["WHO","目標顧客群包括？","願意網上用信用卡的人；20–40 歲"],["HOW","網上商店要如何運作？","有送貨服務嗎？有會員制度嗎？"]]},"cap":"活動 1.1 以六何法界定網上商店的服務（p.5）"}],"practice":[{"id":"u1-s1-p1","type":"mc","pts":4,"src":"教科書 p.4","q":"用編程解決問題時，第一步應該做什麼？","options":["直接編寫程式","界定問題及其範圍","測試及除錯","設計流程圖"],"answer":1,"hint":"「問題本身的界定，要比其解決方法更為重要。」"},{"id":"u1-s1-p2","type":"mc","pts":4,"src":"教科書 p.4–5","q":"以下哪一項**不是**界定問題時常用的方法？","options":["六何法","腦圖","市場調查及訪問","編寫程式碼"],"answer":3,"hint":"界定問題時還未開始寫程式。"},{"id":"u1-s1-p3","type":"mc","pts":4,"src":"教科書 p.28 課題練習 選擇題 1","q":"志強打算開發一個學習日語的應用程式。在**編寫程式之前**，他應該先做什麼？\n(1) 設計應用程式的算法\n(2) 決定該應用程式可以提供給用戶的服務\n(3) 推廣該應用程式","options":["只有 (1)","只有 (2)","只有 (1) 和 (2)","(1)、(2) 和 (3)"],"answer":2,"hint":"推廣要等程式完成後才做。"},{"id":"u1-s1-p4","type":"mc","pts":3,"src":"教科書 p.5 活動 1.1","q":"「網上商店的目標顧客群包括哪些人？」屬於六何法的哪一項？","options":["WHEN（何時）","WHERE（何地）","WHY（為何）","WHAT（何事）","WHO（何人）","HOW（如何）"],"answer":4,"hint":"問的是「人」。"}]},{"id":"s2","title":"分析問題：輸入—處理—輸出","pages":"教科書 p.7–9","learn":[{"pts":["**分析問題**：界定範圍後，從不同角度找出解決方案的具體細節。（p.7）","**輸入—處理—輸出周期（IPO）**是分析問題的框架。（p.7）","**輸入**：程式要用的數據；**處理**：程式用的方法或步驟；**輸出**：程式傳回的資訊。（p.7 提示）","複雜的問題可能要多次運用 IPO 周期分析。（p.7 提示）"]},{"table":{"head":["輸入","處理","輸出"],"rows":[["體重（kg）、身高（m）","運算：BMI = 體重 ÷ 身高²","BMI"],["BMI","條件判斷，找出所屬類別","BMI 類別（過輕／正常／過重／肥胖）"]]},"cap":"BMI 計算器的兩個 IPO 周期（p.7）"},{"note":"活動 1.2（p.8–9）：按揭計算機和循線機械車也可以用 IPO 分析——會在「分析題」一節練習。"}],"practice":[{"id":"u1-s2-p1","type":"mc","pts":4,"src":"教科書 p.7","q":"在 BMI 計算器中，「BMI = 體重 ÷ 身高²」屬於 IPO 周期的哪一部分？","options":["輸入","處理","輸出","以上皆不是"],"answer":1,"hint":"處理是程式用的方法或步驟。"},{"id":"u1-s2-p2","type":"mc","pts":4,"src":"教科書 p.28 課題練習 選擇題 3","q":"以下哪一組輸入—處理—輸出周期是最可行的？（次序：輸入；處理；輸出）","options":["體重和身高；計算；BMI","產品的價格；排序；商店位置","咖啡；沖泡；咖啡豆","最高身高；搜索；最輕體重"],"answer":0,"hint":"輸出要能由輸入經處理得出。"},{"id":"u1-s2-p3","type":"mc","pts":4,"src":"教科書 p.28 課題練習 選擇題 4","q":"IPO 周期：輸入「詞彙」；處理（空白）；輸出「詞彙的定義」。以下哪個過程符合這個周期？","options":["尋找合適的字典","檢查拼字或印刷錯誤","將輸入的詞彙與相應的定義相匹配","搜索類似的詞彙"],"answer":2,"hint":"處理要把輸入變成輸出。"},{"id":"u1-s2-p4","type":"mc","pts":3,"src":"教科書 p.28 課題練習 選擇題 2","q":"製作學生的成績單時，以下哪項是**不需要**的？","options":["學生所學的科目","學生最喜歡的科目","學生的姓名","計算科目成績的公式"],"answer":1,"hint":"成績單要顯示什麼？"}]},{"id":"s3","title":"解難程序","pages":"教科書 p.25","learn":[{"pts":["運用編程解決問題大致分為**六個步驟**。（p.25 圖 1.19）","① **界定問題**：了解要提供什麼服務。","② **分析問題**：運作流程、輸入和輸出、處理方法。","③ **設計算法**：用流程圖等方法列明每個步驟。","④ **開發程式**：按算法編寫程式。","⑤ **測試及除錯**：檢查有沒有錯誤並改良程式。","⑥ **編製文件**：用日常語言描述程式各部分的運作，方便日後更新。"]},{"note":"教科書註明新課程文件已移除這部分，但它有助預覽整個流程；歷屆試題（2017 卷一甲部第 30 題）曾考步驟的次序。"}],"practice":[{"id":"u1-s3-p1","type":"mc","pts":4,"src":"教科書 p.25 圖 1.19","q":"「運用日常語言描述程式每個部分的運作和應用方法，以便日後更新系統」是解難程序的哪一步？","options":["分析問題","設計算法","測試及除錯","編製文件"],"answer":3,"hint":"最後一步。"},{"id":"u1-s3-p2","type":"mc","pts":3,"src":"教科書 p.28 課題練習 選擇題 8","q":"在解難程序中，完成算法設計**之後**，還需要進行哪項／些行動？\n(1) 測試和除錯\n(2) 開發程式\n(3) 定義問題","options":["只有 (1)","只有 (3)","只有 (1) 和 (2)","(1)、(2) 和 (3)"],"answer":2,"hint":"定義問題在設計算法之前。"},{"id":"u1-s3-p3","type":"mc","pts":3,"src":"教科書 p.25 圖 1.19","q":"「檢測系統運作有沒有錯誤並改良程式」之前的一步是什麼？","options":["界定問題","設計算法","開發程式","編製文件"],"answer":2,"hint":"先寫好程式，才可以測試。"}]},{"id":"write","kind":"write","title":"分析題","pages":"教科書 p.5、p.8–9、p.29","intro":"在表格內選出答案，按「提交評核」自動批改。答錯兩次後可以看答案，但只得 1 分。","tasks":[{"id":"u1-w1","kind":"table","tier":"必做","title":"IPO：按揭計算機及循線車","pts":15,"src":"教科書 p.8–9 活動 1.2","prompt":"為以下兩個程式選出輸入、處理和輸出。\n按揭計算機：計算每月供款及利息。\n循線機械車：左右兩邊的紅外線感應器偵測黑線，車身偏了便轉彎返回黑線。","head":["程式","輸入","處理","輸出"],"opts":{"I":["貸款本金、年利率、還款期（付款次數）","左右循線感應器偵測到的數據","兩條直角邊的長度 a 和 b","步行的步數"],"P":["運算（按揭公式）","判斷車身相對黑線的位置","運算：c = √(a² + b²)","運算：卡路里 = 步數 ÷ 1000 × 100"],"O":["每月供款及利息","控制摩打，令機械車循線而行","斜邊長度 c","消耗了的卡路里"]},"rows":[["按揭計算機",{"sel":"I","a":"貸款本金、年利率、還款期（付款次數）"},{"sel":"P","a":"運算（按揭公式）"},{"sel":"O","a":"每月供款及利息"}],["循線機械車",{"sel":"I","a":"左右循線感應器偵測到的數據"},{"sel":"P","a":"判斷車身相對黑線的位置"},{"sel":"O","a":"控制摩打，令機械車循線而行"}]],"hint":"輸入是程式「收到」的數據；輸出是程式最後「給出」的結果或動作。"},{"id":"u1-w2","kind":"table","tier":"進階","title":"IPO：畢氏定理及計步器","pts":10,"src":"教科書 p.9 測試站 1.2 第 2 題；p.29 長題目 2（教科書沒有附答案）","prompt":"為以下兩個程式選出輸入、處理和輸出。\n畢氏定理：計算直角三角形斜邊 c 的長度（c² = a² + b²）。\n健身手環：假設步行 1000 步消耗 100 卡路里，計算消耗了的卡路里。","head":["程式","輸入","處理","輸出"],"opts":{"I":["貸款本金、年利率、還款期（付款次數）","左右循線感應器偵測到的數據","兩條直角邊的長度 a 和 b","步行的步數"],"P":["運算（按揭公式）","判斷車身相對黑線的位置","運算：c = √(a² + b²)","運算：卡路里 = 步數 ÷ 1000 × 100"],"O":["每月供款及利息","控制摩打，令機械車循線而行","斜邊長度 c","消耗了的卡路里"]},"rows":[["計算斜邊",{"sel":"I","a":"兩條直角邊的長度 a 和 b"},{"sel":"P","a":"運算：c = √(a² + b²)"},{"sel":"O","a":"斜邊長度 c"}],["健身手環卡路里",{"sel":"I","a":"步行的步數"},{"sel":"P","a":"運算：卡路里 = 步數 ÷ 1000 × 100"},{"sel":"O","a":"消耗了的卡路里"}]],"hint":"計步器的感應器提供的是步數。"},{"id":"u1-w3","kind":"table","tier":"挑戰","title":"六何法：小食部網上訂餐","pts":10,"src":"仿教科書 p.5 活動 1.1","prompt":"學校打算為小食部設立網上訂餐系統。以下每條問題屬於六何法的哪一項？","head":["問題","六何法"],"opts":{"W":["WHEN（何時）","WHERE（何地）","WHY（為何）","WHAT（何事）","WHO（何人）","HOW（如何）"]},"rows":[["學生最遲可以在什麼時候訂餐？",{"sel":"W","a":"WHEN（何時）"}],["系統可以在學校的平板電腦和學生手機上使用嗎？",{"sel":"W","a":"WHERE（何地）"}],["為什麼要用網上訂餐取代排隊買飯？",{"sel":"W","a":"WHY（為何）"}],["系統要提供哪些餐點和資訊？",{"sel":"W","a":"WHAT（何事）"}],["使用者包括學生、老師還是家長？",{"sel":"W","a":"WHO（何人）"}],["學生怎樣付款和取餐？",{"sel":"W","a":"HOW（如何）"}]],"hint":"留意每條問題問的是時間、地點、原因、事物、人物還是方法。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.6、p.9、p.25、p.28","items":[{"id":"u1-q1","pts":5,"src":"教科書 p.6 例題 1.1（參考 DSE 2014 1A Q30）","tags":[{"t":"hot","why":"界定問題範圍：2014 甲30（答對率 73%）、2015 甲33（70%）、2022 甲32（74%）"}],"q":"某咖啡店老闆打算提供線上銷售服務，並要求 IT 同事為客戶建構一個網站。IT 同事首先需要做什麼？","options":["編寫網頁程式","估計項目所需的人手和時間","定義服務範圍","參考其他相關網站"],"answer":"C","why":"第一步必定是界定問題範圍，例如賣咖啡豆還是預訂咖啡、有沒有送貨、要不要會員功能。"},{"id":"u1-q2","pts":5,"src":"教科書 p.6 測試站 1.1（參考 DSE 2015 1A Q33）","tags":[{"t":"hot","why":"界定問題範圍：2014 甲30（答對率 73%）、2015 甲33（70%）、2022 甲32（74%）"}],"q":"解決專題研習中的問題時，為什麼需要準確界定問題的範圍？\n(1) 若誤解問題，就會使用錯誤的解決方法\n(2) 能夠通過流程圖清楚展現方案\n(3) 能把大問題細分為子問題","options":["只有 (1)","只有 (3)","只有 (1) 和 (3)","(1)、(2) 和 (3)"],"answer":"C","why":"流程圖用於設計算法，不是界定問題範圍的原因。"},{"id":"u1-q3","pts":5,"src":"教科書 p.9 測試站 1.2 第 1 題（參考 DSE 2012 1A Q1）","q":"小欣想利用程式計算文具店的利潤。以下哪項是與這個程式相關的「輸入」？\n(1) 文具店的利潤\n(2) 文具的成本\n(3) 文具的銷售","options":["只有 (1)、(2)","只有 (1)、(3)","只有 (2)、(3)","(1)、(2) 和 (3)"],"answer":"C","why":"利潤是計算出來的結果，屬輸出。"},{"id":"u1-q4","pts":5,"src":"教科書 p.25 測試站 1.4（參考 DSE 2017 1A Q30，答對率 78%）","q":"以下哪一個是解難程序的正確次序？\n(1) 進行測試及除錯\n(2) 定義問題\n(3) 編寫程式\n(4) 算法設計","options":["(2) → (4) → (1) → (3)","(2) → (4) → (3) → (1)","(4) → (2) → (1) → (3)","(4) → (2) → (3) → (1)"],"answer":"B","why":"定義問題 → 設計算法 → 編寫程式 → 測試及除錯。"},{"id":"u1-q5","pts":5,"src":"教科書 p.28 課題練習 選擇題 7","q":"如要找到班中身高最高的學生，需要採取以下哪個／些步驟？\n(1) 測量學生的身高\n(2) 列出所有學生的名字\n(3) 比較學生的身高","options":["只有 (1)","只有 (2)","只有 (1) 和 (3)","(1)、(2) 和 (3)"],"answer":"C","why":"找最高只需要身高數據並作比較；列出所有名字不是必要步驟。"}]},{"id":"report","kind":"report","title":"交功課"}]},{"id":"u2","title":"拆解問題與計算思維","book":"教科書 D1 第 1 章 p.10–24（另有 p.28 課題練習）","key":"D1-u2-hmac-9b51c3e8d2","writeLabel":"分析題","sections":[{"id":"s1","title":"拆解問題：由上而下","pages":"教科書 p.10","learn":[{"pts":["**拆解問題（decomposition）**：把問題拆成數個細小、容易處理的**子問題**，再逐個擊破。（p.10）","這是**由上而下（top-down）**／**分而治之（divide-and-conquer）**的策略。（p.10）","**模組化設計**：把程式細分為許多子程式（**模組**），模組可以獨立並**重複使用**，提高管理程式的效率。（p.10 提示）","例子：「製作一份全日早餐」拆成製作茄汁豆、製作多士、沖調咖啡、炒蛋；每次只集中解決一個子問題。（p.10 圖 1.5）"]}],"practice":[{"id":"u2-s1-p1","type":"mc","pts":4,"src":"教科書 p.28 課題練習 選擇題 5","q":"以下哪項**不是**拆解問題的好處？","options":["能使複雜的問題變得容易處理。","能使錯誤不會出現。","能加快測試過程。","能提高解決問題的效率。"],"answer":1,"hint":"拆解問題不能保證沒有錯誤。"},{"id":"u2-s1-p2","type":"mc","pts":4,"src":"教科書 p.28 課題練習 選擇題 6","q":"小傑想估計自己上班路程的需時。以下哪項是拆解問題的例子？","options":["親身前往辦公室一次，並記住所需時間。","將路線分為步行和駕車，分別估計所需時間。","嘗試不同的公共交通工具。","尋找其他方式前往辦公室。"],"answer":1,"hint":"拆解＝分成幾個較小的部分分別處理。"}]},{"id":"s2","title":"逐步求精與結構圖","pages":"教科書 p.11–12","learn":[{"pts":["**精益求精／逐步求精法（stepwise refinement）**：把已拆開的模組再進一步分拆。（p.11）","例子：「製作多士」再拆成將麵包切片、烤成多士、塗上牛油、塗上果醬。（p.11 圖 1.6）","拆解時，有些模組正好是 IPO 周期的各部分：加入咖啡粉及熱水（輸入）→ 開始滴漏（處理）→ 倒出咖啡（輸出）。（p.11）","**結構圖**用階層表示由上而下拆解的結果。（p.12 例題 1.2）"]},{"h":"例題 1.2：計算梯形面積（p.12）"},{"table":{"head":["輸入","處理","輸出"],"rows":[["上底 a、下底 b、高 h","運算：A = (a + b) × h ÷ 2","梯形面積 A"]]}},{"note":"結構圖：頂層「計算梯形的面積」→ 第二層「取得數據」「運算」「顯示面積」→「取得數據」之下有上底、下底、高度；「運算」之下有加數、乘數、除數。在「分析題」一節要自己把結構圖填好。"}],"practice":[{"id":"u2-s2-p1","type":"mc","pts":4,"src":"教科書 p.11","q":"把「製作多士」再分拆為「將麵包切片、將麵包烤成多士、塗上牛油、塗上果醬」，稱為什麼？","options":["模式識別","逐步求精","抽象化","由下而上"],"answer":1,"hint":"把已拆開的模組再拆。"},{"id":"u2-s2-p2","type":"mc","pts":4,"src":"教科書 p.11 B 輸入、處理和輸出模組","q":"沖調咖啡的模組中，「倒出咖啡」屬於 IPO 周期的哪一部分？","options":["輸入","處理","輸出","以上皆不是"],"answer":2,"hint":"最後得到的結果。"}]},{"id":"s3","title":"模式識別：由下而上","pages":"教科書 p.13–17","learn":[{"pts":["有些問題有**共同元素**；把相似問題歸類、以類近方法處理，避免重複解難。（p.13）","**模式識別（pattern recognition）**：發掘不同問題中相似的規律。（p.13）","例子：即溶咖啡和即溶朱古力的沖法相同（加粉 → 加熱水 → 攪拌），只要換「粉末」這個**變量**。（p.13 活動 1.3）","按身高排序和按體重排序只差一個變量，方法可以沿用。（p.14–15 活動 1.4）","把相似問題歸納成一個大問題，稱為**由下而上（bottom-up）**的策略。（p.16）","正多邊形：重複「前進、轉外角」；外角 = 360 ÷ 邊數。（p.16 提示）"]},{"table":{"head":["","正三角形","正四邊形","正 n 邊形"],"rows":[["重複次數","3","4","n"],["每次轉","360 ÷ 3 = 120 度","360 ÷ 4 = 90 度","360 ÷ n 度"]]},"cap":"實驗站 1.1 用 Scratch 繪畫正多邊形（p.15–16）"}],"practice":[{"id":"u2-s3-p1","type":"fill","pts":4,"src":"教科書 p.14 活動 1.4 第 2 題","label":"填充","q":"參考「按身高由矮至高排序」的方法，寫出「按體重由輕至重排序」的方法：\n(1) 列出所有學生的［①］後，從中找出［②］，抽出來排在第一。\n(2) 從剩下的學生之中找出最輕的，抽出來排在第二。\n(3) 如此類推，便可將全班學生由［③］排序。","blanks":[{"label":"①","value":"體重"},{"label":"②","value":"最輕的","accept":["最輕","最輕的學生"]},{"label":"③","value":"輕至重","accept":["輕到重"]}],"hint":"只需要把「身高」換成「體重」、「矮」換成「輕」。"},{"id":"u2-s3-p2","type":"mc","pts":4,"src":"教科書 p.17 測試站 1.3 第 1 題","q":"小明想編寫程式，把收藏品的估算價值按大至小排序。他曾用編程解決過以下問題，參考哪一個最可能幫助他？","options":["更新收藏品的估算價值","計算收藏品的估算價值總額","找出他測驗的平均分數","把他不同測驗的分數記錄，並按高至低順序排列"],"answer":3,"hint":"找一個同樣要「排序」的問題。"}]},{"id":"s4","title":"計算思維與抽象化","pages":"教科書 p.18–19","learn":[{"pts":["周以真（Jeannette M. Wing）2006 年重新定義**計算思維**：運用計算機科學的基礎概念來解決問題、設計系統及理解人類行為。（p.18）","計算思維與閱讀、寫作、算術同樣重要。（p.18）","四個重點：**拆解問題、模式識別、抽象化、算法設計**。（p.18 圖 1.11）","**抽象化（abstraction）**：過濾不必要的資訊、化繁為簡。（p.19）","例子：港鐵路綫圖不按真實地形繪畫，但足以幫人計劃旅程，反而更清晰。（p.19）"]}],"practice":[{"id":"u2-s4-p1","type":"mc","pts":4,"src":"教科書 p.18 圖 1.11","q":"以下哪一項**不是**計算思維的四個重點之一？","options":["拆解問題","模式識別","抽象化","編製文件"],"answer":3,"hint":"四個重點：拆解問題、模式識別、抽象化、算法設計。"},{"id":"u2-s4-p2","type":"mc","pts":4,"src":"教科書 p.19","q":"港鐵路綫圖把綫路畫成直線、車站等距排列，隱去了真實地理位置。這是計算思維中的哪一項？","options":["拆解問題","模式識別","抽象化","算法設計"],"answer":2,"hint":"過濾不必要的資訊。"}]},{"id":"s5","title":"用戶界面與線框稿","pages":"教科書 p.20–24","learn":[{"pts":["從 IPO 周期知道程式要什麼輸入、輸出，便可以用**線框稿**起草用戶界面及元件。（p.20）","BMI 程式的**輸入元件**：兩個文字輸入盒（體重、身高）及一個按鈕；**輸出元件**：一個文字標籤顯示 BMI。（p.20 圖 1.14）","把文字輸入盒設定為「僅限數字」，可以**減低輸入錯誤**。（p.22 試想想）","修改輸入盒的「提示」，讓用戶知道要輸入什麼資料及單位。（p.23 試想想）","實驗站 1.2–1.3 用 App Inventor 實作 BMI 程式：按鈕被點選 → 讀取輸入 → 計算 → 顯示結果。（p.21–24）"]},{"table":{"head":["元件","類別","作用"],"rows":[["文字輸入盒「Enter your weight (in kg) here」","輸入元件","輸入體重"],["文字輸入盒「Enter your height (in m) here」","輸入元件","輸入身高"],["按鈕「Calculate」","輸入元件","遞交數據進行運算"],["標籤「Your BMI is:」","輸出元件","顯示 BMI"]]},"cap":"圖 1.14 BMI 程式的線框稿（p.20）"}],"practice":[{"id":"u2-s5-p1","type":"mc","pts":4,"src":"教科書 p.20 圖 1.14","q":"BMI 程式的線框稿中，按鈕「Calculate」屬於哪一類元件？","options":["輸入元件","輸出元件","處理元件","不屬於任何元件"],"answer":0,"hint":"用戶按它來遞交數據。"},{"id":"u2-s5-p2","type":"mc","pts":4,"src":"教科書 p.22 試想想","q":"為什麼要限制 BMI 程式的文字輸入盒只可輸入數字？","options":["令程式更美觀","減低輸入錯誤","加快網絡速度","節省儲存空間"],"answer":1,"hint":"體重和身高只會是數字。"}]},{"id":"write","kind":"write","title":"分析題","pages":"教科書 p.11–12、p.16","intro":"在表格內選出或填寫答案，按「提交評核」自動批改。答錯兩次後可以看答案，但只得 1 分。","tasks":[{"id":"u2-w1","kind":"table","tier":"必做","title":"結構圖：計算梯形面積","pts":15,"src":"教科書 p.12 例題 1.2 (b)","prompt":"用由上而下的策略拆解「計算梯形的面積」。為每個模組選出它在結構圖中的**上一層**模組。","head":["模組","上一層模組"],"opts":{"T":["計算梯形的面積","取得數據","運算","顯示面積"]},"rows":[["取得數據",{"sel":"T","a":"計算梯形的面積"}],["運算",{"sel":"T","a":"計算梯形的面積"}],["顯示面積",{"sel":"T","a":"計算梯形的面積"}],["上底長度（a）",{"sel":"T","a":"取得數據"}],["下底長度（b）",{"sel":"T","a":"取得數據"}],["高度（h）",{"sel":"T","a":"取得數據"}],["加數",{"sel":"T","a":"運算"}],["乘數",{"sel":"T","a":"運算"}],["除數",{"sel":"T","a":"運算"}]],"hint":"第二層三個模組都直接屬於頂層；a、b、h 是要取得的數據；加、乘、除屬於運算。"},{"id":"u2-w2","kind":"table","tier":"進階","title":"逐步求精：全日早餐","pts":10,"src":"教科書 p.11 圖 1.6","prompt":"「製作一份全日早餐」第一步求精得到四個模組。第二步求精後，以下步驟分別屬於哪一個模組？","head":["步驟","屬於哪個模組"],"opts":{"B":["製作茄汁豆","製作多士","沖調咖啡","炒蛋"]},"rows":[["將麵包切片",{"sel":"B","a":"製作多士"}],["塗上牛油",{"sel":"B","a":"製作多士"}],["塗上果醬",{"sel":"B","a":"製作多士"}],["煲水",{"sel":"B","a":"沖調咖啡"}],["加入咖啡粉",{"sel":"B","a":"沖調咖啡"}],["開始滴漏",{"sel":"B","a":"沖調咖啡"}]],"hint":"想想每個步驟在弄哪一樣食物。"},{"id":"u2-w3","kind":"table","tier":"挑戰","title":"模式識別：正多邊形","pts":10,"src":"教科書 p.15–17 實驗站 1.1、測試站 1.3","prompt":"機械車重複「前進 10 厘米，右轉 X 度」便可以走出正多邊形。填寫每種圖形的**重複次數**和**每次轉的角度**（外角 = 360 ÷ 邊數）。","head":["圖形","重複次數","每次轉（度）"],"rows":[["正三邊形",{"text":true,"a":"3"},{"text":true,"a":"120"}],["正四邊形",{"text":true,"a":"4"},{"text":true,"a":"90"}],["正五邊形",{"text":true,"a":"5"},{"text":true,"a":"72"}],["正六邊形",{"text":true,"a":"6"},{"text":true,"a":"60"}],["正十二邊形",{"text":true,"a":"12"},{"text":true,"a":"30"}]],"hint":"邊數就是重複次數；角度 = 360 ÷ 邊數。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.10–19","items":[{"id":"u2-q1","pts":5,"src":"教科書 p.17 測試站 1.3 第 2 題","q":"以下程式令機械車行走直角路線。應如何修改，令機械車行走**正方形**？\n開始\n重複 2 次\n　　前進 10 厘米\n　　右轉 90 度","options":["將重複次數改為 4 次","將右轉角度改為 360 度","將前進距離改為 40 厘米","將右轉改為左轉"],"answer":"A","why":"正方形有 4 條邊，每次轉 90 度，只需重複 4 次。"},{"id":"u2-q2","pts":5,"src":"教科書 p.17 試想想","q":"承上題，如何修改程式令機械車行走**正三角形**？","options":["重複 3 次，右轉 60 度","重複 3 次，右轉 120 度","重複 6 次，右轉 60 度","重複 3 次，右轉 180 度"],"answer":"B","why":"外角 = 360 ÷ 3 = 120 度。"},{"id":"u2-q3","pts":5,"src":"教科書 p.10、p.16","q":"把繪畫正三角形、正四邊形等程式歸納成一個「繪畫正 n 邊形」的程式，運用了哪一種策略？","options":["由上而下","由下而上","逐步求精","分而治之"],"answer":"B","why":"把相似的問題歸納成一個大問題，是由下而上的策略。"},{"id":"u2-q4","pts":5,"src":"教科書 p.10 提示","q":"以下哪一項是模組化設計的好處？","options":["程式不會出現任何錯誤","模組可以獨立並重複使用","程式不需要測試","程式一定執行得較快"],"answer":"B","why":"模組可以獨立並重複使用，提高管理程式的效率。"},{"id":"u2-q5","pts":5,"src":"教科書 p.18–19","q":"設計網上地圖的「捷運路線」模式時，只顯示車站和綫路、隱去街道和建築物。這主要運用了計算思維中的哪一項？","options":["拆解問題","模式識別","抽象化","算法設計"],"answer":"C","why":"過濾不必要的資訊、化繁為簡，就是抽象化。"}]},{"id":"report","kind":"report","title":"交功課"}]},{"id":"u3","title":"算法、變量與賦值","book":"教科書 D1 第 2 章 p.32–41（另有 p.100–101、p.103 課題練習）","key":"D1-u3-hmac-5b8e21c74d","sections":[{"id":"s1","title":"算法與空運行","pages":"教科書 p.32–33","learn":[{"pts":["**算法（algorithm）**：按照特定次序解決問題的步驟。（p.32）","食譜是「製作奄列」的算法，輸出是奄列；洗衣機說明書是「洗衣服」的算法，輸出是乾淨衣物。（p.32）","**空運行（dry run）**：逐步跟着算法做，從而推斷它的目的和輸出。（p.32）","機械和電腦可以自行運行算法，這個自動化過程大大減輕人類的工作量。（p.33）"]},{"note":"空運行小技巧：把每個變量想像成一個寫上名字的盒子，每做一句，就更新盒內的值。（p.37 類比）"},{"sim":{"code":"A ← 3\nB ← A + 6\nC ← A * B\n輸出 A, B, C","open":[]},"cap":"試按「▶ 下一步」：右邊「變量」會顯示每個盒子的值，橙色是剛改變了的盒子。（p.39 活動 2.2）"}],"tries":[{"id":"u3-s1-t1","pts":4,"src":"教科書 p.39 活動 2.2（第 1 題）","code":"A ← 7\nA ← 10\n輸出 A","q":"先估：以下算法的輸出是什麼？","options":["7","10","17","7 10"],"why":"`A ← 10` 會取代 A 原有的值 7，所以最後輸出 10。"}],"practice":[{"id":"u3-s1-p1","type":"mc","pts":2,"src":"教科書 p.32","q":"「空運行」是指什麼？","options":["逐步跟着算法做，推斷它的目的和輸出","把算法寫成電腦程式","讓電腦不停重複執行同一個算法","執行一個沒有輸出的程式"],"answer":0,"hint":"空運行（dry run）是「理解」算法的過程。"},{"id":"u3-s1-p2","type":"mc","pts":2,"src":"教科書 p.32 試想想","q":"洗衣機的使用說明書（打開上蓋 → 放入衣物 → 關蓋 → 按「啟動」→ 等待機器停止 → 取出衣物）是一個算法。它的**輸出**是什麼？","options":["洗衣機","乾淨衣物","「啟動」按鈕","使用說明書"],"answer":1,"hint":"輸出是算法完成後得到的結果。"}]},{"id":"s2","title":"偽代碼與流程圖","pages":"教科書 p.34–35、p.45","learn":[{"pts":["表達算法的三種方式：日常文字、**偽代碼**、**流程圖**。（p.34）","**偽代碼（pseudocode）**：用簡單文字及關鍵詞（語句）表達算法，例如 `輸入`、`輸出`、`←`。（p.34）","**流程圖（flowchart）**：用特定圖形符號，以箭咀連結起來表達算法。（p.34）"]},{"symbols":[{"kind":"term","text":"開始","name":"開始／結束","desc":"圓角長方形"},{"kind":"proc","text":"A ← 21","name":"處理／賦值","desc":"長方形"},{"kind":"io","text":"輸入 A, B","name":"輸入／輸出","desc":"平行四邊形"},{"kind":"dec","text":"A = B","name":"決策","desc":"菱形（有「是」「否」兩個出口）"},{"kind":"mod","text":"調用 ProcedureABC","name":"模組","desc":"兩側有直線的長方形"}]},{"p":"表 2.1 常用的偽代碼及流程圖符號（p.34）。"},{"h":"例題 2.1：計算 BMI（p.35）"},{"table":{"head":["輸入","處理","輸出"],"rows":[["體重（kg）、身高（m）","BMI = 體重 ÷ 身高²","BMI"]]},"cap":"輸入 — 處理 — 輸出周期"},{"pts":["輸入語句：`輸入 weight, height`","賦值語句：`bmi ← weight/(height*height)`（偽代碼沒有次方符號，身高² 寫成 `height*height`）","輸出語句：`輸出 bmi`","**序列**控制結構：程式按編寫次序，由上而下逐句執行。（p.45）"]},{"sim":{"code":"輸入 weight, height\nbmi ← weight/(height*height)\n輸出 bmi","inputs":"60, 1.7","open":["flow"]},"cap":"按「▶ 下一步」，流程圖會用橙色標示走過的路線。可以改「輸入數據」再試。"}],"tries":[{"id":"u3-s2-t1","pts":4,"src":"教科書 p.35 例題 2.1","code":"輸入 weight, height\nbmi ← weight/(height*height)\n輸出 bmi","inputs":"60, 1.7","fixedInputs":true,"q":"先估：輸入 `60, 1.7` 時，輸出是什麼？（答案取 4 位小數）","options":["35.2941","60","20.7612","0.0482"],"open":["flow"],"why":"60 ÷ (1.7 × 1.7) = 60 ÷ 2.89 ≈ 20.7612。括號令 `height*height` 先計算。"}],"practice":[{"id":"u3-s2-p1","type":"mc","pts":2,"src":"教科書 p.34 表 2.1","q":"流程圖中，`輸入 weight, height` 應該畫在哪一種符號內？","options":["長方形","菱形","平行四邊形","圓角長方形"],"answer":2,"hint":"輸入和輸出共用同一種符號。"},{"id":"u3-s2-p2","type":"complete","pts":3,"src":"教科書 p.35 例題 2.1","label":"補完偽代碼","q":"補完計算 BMI 的算法（BMI = 體重 ÷ 身高²）。會用多組數據測試你的算式。","template":"輸入 weight, height\nbmi ← ［1］\n輸出 bmi","ref":["weight/(height*height)"],"tests":[{"inputs":"60, 1.7"},{"inputs":"45, 1.5"},{"inputs":"80, 2"}],"hint":"身高² 要寫成 `height*height`，並用括號包住，否則會先做除法。"}]},{"id":"s3","title":"變量與賦值","pages":"教科書 p.36–37","learn":[{"pts":["**變量（variable）**：電腦記憶體內儲存數據的位置，像寫上名字的盒子。（p.36–37）","變量名稱是程式用來辨別變量的**識別符（identifier）**；名稱要反映用途，`weight` 比 `A` 易明白。（p.36）","計算 BMI 的程式用了 3 個變量：`weight`、`height`、`bmi`。（p.36 試想想）","**賦值（assignment）**：把數據放入指定變量；偽代碼用賦值運算符 `←`。（p.37）"]},{"table":{"head":["偽代碼","意思"],"rows":[["`輸入 price`","接收用戶的輸入，放入變量 price"],["`price ← 8000`","把 8000 放入變量 price"],["`new ← price`","把變量 price 的值**複製**到變量 new"]]},"cap":"表 2.2 常見的賦值方法（p.37）"},{"warn":"常見錯誤：`new ← price` 是「複製」，不是「轉移」——執行後 price 的值不變。（p.37 旁註）"},{"p":"變量命名規則（例如不能以數字開首）會在單元 4 學習。"},{"sim":{"code":"price ← 8000\nnew ← price\n輸出 price, new","open":[]},"cap":"逐步執行，留意 price 盒子在第 2 步之後有沒有改變。"}],"tries":[{"id":"u3-s3-t1","pts":4,"src":"教科書 p.37 表 2.2","code":"price ← 8000\nnew ← price\n輸出 price, new","q":"先估：輸出是什麼？","options":["8000 8000","0 8000","8000 0","8000"],"why":"`new ← price` 把 price 的值複製到 new，price 仍然是 8000。"}],"practice":[{"id":"u3-s3-p1","type":"mc","pts":3,"src":"教科書 p.37","q":"`new ← price` 的意思是什麼？","options":["把變量 new 的值複製到變量 price","把變量 price 的值轉移到變量 new，price 變成沒有值","把變量 price 的值複製到變量 new","比較 new 和 price 是否相等"],"answer":2,"hint":"`←` 右邊的值放入左邊的變量；右邊的變量不會改變。"},{"id":"u3-s3-p2","type":"fill","pts":2,"src":"教科書 p.36 試想想","q":"例題 2.1 計算 BMI 的程式運用了多少個變量？","code":"輸入 weight, height\nbmi ← weight/(height*height)\n輸出 bmi","blanks":[{"label":"變量數目","value":"3","accept":["3個","三","三個"]}],"hint":"數一數出現過的變量名稱。"}]},{"id":"s4","title":"運算算式與追蹤表","pages":"教科書 p.38–39","learn":[{"pts":["一般賦值語句：`變量 ← 算式`；**右邊的新值會取代變量原有的值**。（p.38）","運算算式由數據（數字、變量或常數）及**數學運算符**組成，例如 `2 * PI * radius`。（p.38 圖 2.5）","數學運算符：加 `+`、減 `-`、乘 `*`（部分題目寫 `×`）、除 `/`。（p.38 表 2.3）","`new ← price + 5`：先讀 price 的值，加 5，結果放入 new。（p.38 表 2.4）","`price ← price + 1`：先讀 price 的值，加 1，結果**放回** price。（p.38 表 2.4）","空運行時用**追蹤表**逐句記錄變量的值；先填改變了的值，再填其餘不變的值。（p.39 提示）"]},{"h":"例題 2.2 第 1 題（p.39）"},{"sim":{"code":"A ← 2\nB ← 5\nA ← B - A\nA ← A * B\nB ← A - B\n輸出 A","open":["trace"]},"cap":"打開了「追蹤表」：每執行一句，便多填一行。粗體是該句改變了的值。"}],"tries":[{"id":"u3-s4-t1","pts":4,"src":"教科書 p.39 活動 2.2（第 3 題）","code":"A ← 6\nB ← A/2\nA ← 8\n輸出 A, B","q":"先估：輸出是什麼？","options":["8 4","8 3","6 3","3 8"],"open":["trace"],"why":"B 賦值時取了 A/2 = 3；之後 A 改為 8，但 B 不會自動更新，仍然是 3。（p.39 旁註）"}],"practice":[{"id":"u3-s4-p1","type":"trace","pts":4,"src":"教科書 p.39 例題 2.2 第 1 題","label":"追蹤表填格","code":"A ← 2\nB ← 5\nA ← B - A\nA ← A * B\nB ← A - B\n輸出 A","spec":{"mode":"stmt","cols":["A","B"]},"hint":"每一行只會改變 `←` 左邊的變量；`輸出` 不會改變變量。"},{"id":"u3-s4-p2","type":"fill","pts":3,"src":"教科書 p.41 測試站 2.1 第 3 題（挑戰題）","q":"以下算法的輸出是什麼？（用空格分隔）","code":"A ← 1\nB ← 2\nC ← A + B\nA ← B + C\nB ← C + A\n輸出 A, B, C","blanks":[{"label":"輸出","ask":"out"}],"hint":"`B ← C + A` 用的是 A 的**新**值。"}]},{"id":"s5","title":"交換兩個變量","pages":"教科書 p.40","learn":[{"pts":["要交換兩個變量的值，要用一個暫存變量（例如 `temp`）。（p.40 例題 2.2 第 2 題）","三步：① `temp ← X` ② `X ← Y` ③ `Y ← temp`。","只寫 `X ← Y`、`Y ← X` 不能交換：第一句已經用 Y 的值**取代**了 X 原本的值。（p.40 想像）","類比：要交換一杯水和一杯橙汁，必須先準備第三隻杯。（p.40）","交換（swapping）在排序問題中經常出現。（p.40 備註）"]},{"sim":{"code":"X ← 3\nY ← 9\ntemp ← X\nX ← Y\nY ← temp","open":["trace"]},"cap":"例題 2.2 第 2 題（p.40）：逐步執行，看 temp 怎樣暫存 X 的值。"}],"tries":[{"id":"u3-s5-t1","pts":4,"src":"教科書 p.40 想像","code":"X ← 3\nY ← 9\nX ← Y\nY ← X\n輸出 X, Y","q":"先估：以下算法沒有用 temp。輸出是什麼？","options":["9 3","3 9","9 9","3 3"],"open":["trace"],"why":"`X ← Y` 之後 X 已變成 9，原本的 3 不見了；`Y ← X` 再把 9 放入 Y。"}],"practice":[{"id":"u3-s5-p1","type":"trace","pts":4,"src":"教科書 p.103 長題目 1 (a)(b)","label":"追蹤表填格","q":"空運行以下算法，完成追蹤表（只需填寫改變了的值），並寫出輸出。教科書沒有附這題的答案，網站答案由模擬器計算。","code":"A ← 5\nB ← 7\nC ← A\nA ← B\nB ← C\nC ← (A - C) × B\n輸出 A, C, B","spec":{"mode":"stmt","cols":["A","B","C"]},"hint":"首 5 句其實是用 C 作暫存變量，交換 A 和 B。"}]},{"id":"write","kind":"write","title":"寫算法","pages":"教科書 p.35、p.40","intro":"在編輯器寫偽代碼，可以先按「▶ 下一步」自己測試，再按「提交評核」。系統會用多組測試數據檢查；不通過時會說明是哪一組數據、期望輸出和你的輸出。","tasks":[{"id":"u3-w1","tier":"必做","title":"計算 BMI","pts":20,"src":"教科書 p.35 例題 2.1","prompt":"輸入體重 `weight`（kg）及身高 `height`（m），計算並輸出 BMI。\nBMI = 體重 ÷ 身高²","starter":"輸入 weight, height\n","ref":"輸入 weight, height\nbmi ← weight/(height*height)\n輸出 bmi","tests":[{"inputs":"60, 1.7","show":true},{"inputs":"45, 1.5"},{"inputs":"80, 2"},{"inputs":"52.5, 1.62"}],"hint":"`bmi ← weight/(height*height)`——記得括號，最後要 `輸出 bmi`。"},{"id":"u3-w2","tier":"進階","title":"交換兩個變量","pts":10,"src":"教科書 p.40 例題 2.2 第 2 題","prompt":"程式輸入兩個數值到 `X` 和 `Y`。在中間加入語句，**交換** X 和 Y 的值，最後輸出 X, Y。\n不可以改動第一行和最後一行。","starter":"輸入 X, Y\n\n輸出 X, Y","ref":"輸入 X, Y\ntemp ← X\nX ← Y\nY ← temp\n輸出 X, Y","check":{"vars":["X","Y"]},"rules":[{"re":"^輸入 X, ?Y$","msg":"請保留第一行「輸入 X, Y」。"},{"re":"^輸出 X, ?Y$","msg":"請保留最後一行「輸出 X, Y」。"}],"tests":[{"inputs":"3, 9","show":true},{"inputs":"5, -2"},{"inputs":"7, 7"},{"inputs":"100, 1"}],"hint":"先用 `temp ← X` 暫存 X 的值。"},{"id":"u3-w3","tier":"挑戰","title":"三個變量循環移位","pts":5,"src":"延伸：教科書 p.40 交換算法","prompt":"程式輸入三個數值到 `A`、`B`、`C`。在中間加入語句，令\n`A` 得到 B 原本的值、`B` 得到 C 原本的值、`C` 得到 A 原本的值，最後輸出 A, B, C。\n例如輸入 1, 2, 3，輸出 2 3 1。不可以改動第一行和最後一行。","starter":"輸入 A, B, C\n\n輸出 A, B, C","ref":"輸入 A, B, C\ntemp ← A\nA ← B\nB ← C\nC ← temp\n輸出 A, B, C","check":{"vars":["A","B","C"]},"rules":[{"re":"^輸入 A, ?B, ?C$","msg":"請保留第一行「輸入 A, B, C」。"},{"re":"^輸出 A, ?B, ?C$","msg":"請保留最後一行「輸出 A, B, C」。"}],"tests":[{"inputs":"1, 2, 3","show":true},{"inputs":"10, 20, 30"},{"inputs":"4, 4, 9"},{"inputs":"-1, 0, 8"}],"hint":"只需要一個 temp：先暫存 A，然後由 A 開始逐個「向前」複製。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.41、p.100–101","items":[{"id":"u3-q1","pts":4,"src":"教科書 p.41 測試站 2.1 第 1 題（參考 DSE 2019 卷一甲部第 30 題，答對率 81%）","q":"下列算法的輸出是什麼？","code":"A ← 1\nB ← 2\nC ← A + B\nA ← 6\nB ← 8\n輸出 C","options":["3","7","8","14"],"answer":"A","verify":true,"why":"C 在第 3 句已計算為 3；之後改變 A、B 不會改變 C。"},{"id":"u3-q2","pts":4,"src":"教科書 p.41 測試站 2.1 第 2 題","q":"下列算法的輸出是什麼？","code":"A ← 3\nB ← 5\nC ← A * B\nA ← A + 1\nB ← B - 1\nC ← A * B\n輸出 A, B, C","options":["3　5　15","3　4　12","4　5　20","4　4　16"],"answer":"D","verify":true,"why":"A = 4、B = 4，最後一句重新計算 C = 4 × 4 = 16。"},{"id":"u3-q3","pts":4,"src":"教科書 p.100 課題練習 選擇題 1","q":"以下算法的輸出是什麼？","code":"A ← 5\nB ← 7\nA ← B - 2\nC ← B\nB ← C\n輸出 B, A, C","options":["5, 7, 7","7, 5, 7","5, 5, 5","7, 7, 5"],"answer":"B","verify":true,"why":"留意輸出次序是 B, A, C。"},{"id":"u3-q4","pts":4,"src":"教科書 p.100 課題練習 選擇題 2","q":"以下算法的輸出是什麼？","code":"E ← 0\nF ← 1\nG ← 2\nE ← G × F\nF ← F + E\nG ← E × F\n輸出 G","options":["3","2","6","0"],"answer":"C","verify":true,"why":"E = 2 × 1 = 2；F = 1 + 2 = 3；G = 2 × 3 = 6。"},{"id":"u3-q5","pts":4,"src":"教科書 p.101 課題練習 選擇題 4","q":"以下算法的目的是什麼？","code":"輸入 A\n輸入 B\ntemp ← B\nA ← temp\nB ← A","options":["對調 A 和 B 的數值","把 B 轉成 A 的數值","把 A 轉成 B 的數值","以上皆非"],"answer":"C","why":"例如輸入 3、8：temp = 8，A = 8，B = 8。A 變成和 B 一樣，即「把 A 轉成 B 的數值」；兩個值並沒有對調（已用 tools/test_engine.js 核對）。"}]},{"id":"more","kind":"endless","title":"無限練習","gens":["seq","swap","inout"],"intro":"按教科書題型（p.39 活動 2.2、p.40–41）隨機生成空運行題目，答案由模擬器計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]},{"id":"u4","title":"數據類型、命名與變量分析表","book":"教科書 D1 第 2 章 p.36、p.42–47（另有 p.101、p.106 課題練習）","key":"D1-u4-hmac-8c3f60a19e","writeLabel":"分析題","sections":[{"id":"s1","title":"變量命名規則","pages":"教科書 p.36","learn":[{"pts":["變量要先**命名**，才可以儲存、更新或讀取數據。（p.36）","**規則 1**：只能以英文字母（A–Z、a–z）或下劃線 `_` 開首，**不能以數字開首**。✓ `number1` ✓ `numberOne` ✗ `1number`","**規則 2**：只能用英文字母、數字和下劃線，**不能有空白格或其他符號**（例如 `!`、`#`、`$`）。✓ `new_number` ✓ `newNumber` ✗ `new number` ✗ `newnumber!`","程式語言如果區分大小寫，`bmi` 和 `Bmi` 是**兩個不同**的變量；變量名稱通常以小寫字母起頭。（p.36 提示 1）","名稱要反映用途：`weight`、`height` 比 `A`、`B` 易明白。（p.36 提示 3）","多於一個詞：用下劃線或大小寫分隔，例如 `sum_of_scores`、`sumOfScores`。（p.36 提示 4）","同一程式內每個變量名稱都必須**獨一無二**。（p.36 提示 5）"]},{"sim":{"code":"sum_of_scores ← 0\nsumOfScores ← 10\n輸出 sum_of_scores, sumOfScores","open":[]},"cap":"兩種分隔詞語的寫法都符合規則，但它們是兩個不同的變量。試把第 1 行改成 `1sum ← 0` 想像一下：模擬器會說「無法理解」。"}],"tries":[{"id":"u4-s1-t1","pts":4,"src":"教科書 p.36 提示 1","code":"bmi ← 1\nBmi ← 2\n輸出 bmi, Bmi","q":"先估：本平台的偽代碼**區分大小寫**。以下算法的輸出是什麼？","options":["1 2","2 2","1 1","執行時出錯"],"why":"`bmi` 和 `Bmi` 大小寫不同，是兩個不同的變量，所以各自保留自己的值。"}],"practice":[{"id":"u4-s1-p1","type":"mc","pts":3,"src":"教科書 p.36 規則 1、2","q":"以下哪一個變量名稱**不**符合命名規則？","nameRule":"invalid","options":["`number1`","`new_number`","`_total`","`1number`"],"answer":3,"hint":"先看第一個字符：不能是數字。"},{"id":"u4-s1-p2","type":"mc","pts":2,"src":"教科書 p.36 規則 2","q":"以下哪一個變量名稱符合命名規則？","nameRule":"valid","options":["`new number`","`newnumber!`","`newNumber`","`new-number`"],"answer":2,"hint":"只可以用英文字母、數字和下劃線；空白格、`!`、`-` 都不可以。"}]},{"id":"s2","title":"四種常見數據類型","pages":"教科書 p.42","learn":[{"pts":["**數據類型（data type）**：定義變量儲存的值屬於哪種類型。（p.42）","電腦按數據類型分配合適的記憶體，數據類型亦**決定變量能做哪種運算**，避免程式出錯。（p.42）","**字串（string）**由字符組成，屬數據結構，但很多程式語言把它當作數據類型使用，例如 `\"abc\"`、`\"0011\"`。（p.42）"]},{"table":{"head":["數據類型","數據","例子"],"rows":[["整數（integer）","整數，包括正負數","`288`、`-101`"],["實數（real）／浮點數（float）","整數及小數，包括正負數","`56.5`、`-30.0`、`0.05`"],["字符（character）","字母、數字和一些特別符號（一個）","`'a'`、`'B'`、`'8'`、`'%'`"],["布爾（Boolean）","只可能是 True 或 False","`True`／`False`（1／0）"]]},"cap":"表 2.5 常見的數據類型（p.42）"},{"warn":"易錯：字串 `\"HKDSE5\"` 裏的 `5` 是**字符**，不是數值。（2016 卷一甲部第 2 題，答對率只有 18%，約一半考生以為「5」會以數值儲存）"},{"note":"擴闊視野（p.42）：每種數據類型都有可儲存的數值範圍，超出範圍會令程式出錯；範圍因程式語言而異。"},{"sim":{"code":"A ← 12\nB ← 3\n輸出 A + B","open":[]},"cap":"整數可以相加。下面「試」會把 B 改成字串 `\"3\"`，結果會怎樣？"}],"tries":[{"id":"u4-s2-t1","pts":4,"src":"教科書 p.42（數據類型決定可做的運算）","code":"A ← 12\nB ← \"3\"\nC ← A + B\n輸出 C","allowError":true,"q":"先估：`B ← \"3\"` 把**字串** \"3\" 放入 B。以下算法執行時會怎樣？","options":["輸出 15","輸出 123","輸出 \"123\"","執行時出錯"],"answer":3,"why":"A 是整數，B 是字串，數據類型不同，不能做加法，程式出錯（模擬器會說明原因）。這正是 p.42 說數據類型「決定變量能進行哪種運算」的意思。"}],"practice":[{"id":"u4-s2-p1","type":"mc","pts":3,"src":"教科書 p.42 表 2.5","q":"`'8'`（單引號內的 8）屬於哪一種數據類型？","options":["整數","實數","字符","字串","布爾"],"answer":2,"hint":"單引號內一個字符（包括數字）是字符。"},{"id":"u4-s2-p2","type":"mc","pts":2,"src":"教科書 p.42 表 2.5","q":"`-30.0` 屬於哪一種數據類型？","options":["整數","實數","字符","字串","布爾"],"answer":1,"hint":"有小數點（即使是 .0）的數值是實數。"}]},{"id":"s3","title":"選擇合適的數據類型","pages":"教科書 p.43–44","learn":[{"pts":["**數字類別（整數／實數）**：用作運算的數字，例如身高、年齡、考試分數、薪金。（p.43）","**文字類別（字符／字串）**：文字及**不用作運算**的數據，例如姓名、電郵地址、短訊。（p.43）","**邏輯類別（布爾）**：只有「真」或「假」——數據只有兩個可能性時使用。（p.43）","電話號碼看似數字，其實應用**字串**：不用運算，又可能要加上 (852) 或 +852。（p.43 提示）","問卷的年齡組別（例如「20-39歲」）是範圍，應用字串。（p.44 試想想）"]},{"warn":"易錯：2015 卷一乙部第 4(b)(iii) 題問「選用布爾作為 FLAG 數據類型的好處」，考試報告評為表現差劣。記住：只有兩個可能性的數據用布爾。"},{"h":"例題 2.3（p.44，參考 DSE 2012 1A Q34）"},{"table":{"head":["","善款數字（65000.5）","捐獻人數（72）","會長的話（新年快樂!）"],"rows":[["數據類型","實數（有小數點）","整數（人數是整數，方便計總數）","字串（文字）"]]}}],"tries":[{"id":"u4-s3-t1","pts":4,"src":"教科書 p.43 提示（延伸：前置 0）","code":"輸入 code\n輸出 code","inputs":"007","fixedInputs":true,"q":"先估：會員編號 `007` 輸入後當作**整數**儲存。輸出是什麼？","options":["007","7","0","執行時出錯"],"answer":1,"why":"整數不會保留前面的 0，所以 007 變成 7。編號、電話號碼這類不用運算的數據，應用字串儲存。"}],"practice":[{"id":"u4-s3-p1","type":"mc","pts":3,"src":"教科書 p.44 例題 2.3（參考 DSE 2012 1A Q34）","q":"慈善機構網頁顯示：善款數字 65000.5、捐獻人數 72、會長的話「新年快樂!」。以下哪組數據類型最合適？（次序：善款數字、捐獻人數、會長的話）","options":["整數、字符、字串","實數、整數、字串","整數、整數、字串","實數、字符、字符"],"answer":1,"hint":"善款有小數點；人數是整數；一句說話是文字。"},{"id":"u4-s3-p2","type":"mc","pts":2,"src":"教科書 p.44 測試站 2.2","q":"網上問卷有「聯絡電郵」文字框、「網站評分」1 至 5 顆星、「同意接收廣告」核取方塊。以下哪組數據類型最合適？（次序：聯絡電郵、網站評分、同意接收廣告）","options":["整數、整數、布爾","字串、字串、字串","整數、字串、字串","字串、整數、布爾"],"answer":3,"hint":"核取方塊只有「剔」或「不剔」兩個可能性。"}]},{"id":"s4","title":"常數","pages":"教科書 p.36、p.38","learn":[{"pts":["變量的數據可以修改；某些值是**固定**的，例如 π = 3.14159。（p.36 提示 2）","擁有固定數據的變量稱為**常數（constant）**，常以**全大寫**命名，例如 `PI`。（p.36 提示 2）","運算算式可以由數字、變量或常數組成，例如 `2 * PI * radius`。（p.38 圖 2.5）"]},{"sim":{"code":"PI ← 3.14159\nradius ← 10\nc ← 2 * PI * radius\n輸出 c","open":["trace"]},"cap":"計算圓周：PI 在整個算法中都不會改變。"}],"tries":[{"id":"u4-s4-t1","pts":4,"src":"教科書 p.38 圖 2.5","code":"PI ← 3.14\nradius ← 5\narea ← PI * radius * radius\n輸出 area","q":"先估：輸出是什麼？","options":["78.5","31.4","15.7","25"],"why":"3.14 × 5 × 5 = 78.5。"}],"practice":[{"id":"u4-s4-p1","type":"fill","pts":3,"src":"教科書 p.38 圖 2.5","q":"以下算法的輸出是什麼？","code":"PI ← 3.14\n輸入 radius\nc ← 2 * PI * radius\n輸出 c","inputs":"10","blanks":[{"label":"輸出","ask":"out"}],"hint":"2 × 3.14 × 10。"},{"id":"u4-s4-p2","type":"mc","pts":2,"src":"教科書 p.36 提示  Y, Z\n如果 X >= Y 則\n    如果 Z > X 則\n        Y ← Y - 1\n    否則\n        輸出 \"A\"\n否則\n    如果 Z > Y 則\n        輸出 \"B\"\n    否則\n        輸出 \"C\"","options":["「C」必定會被輸出。","「A」沒有可能被輸出。","如果「B」被輸出，Z 的值是最小的。","如果最終沒有輸出，Z 的值是最大的。"],"answer":"D","why":"沒有輸出 → 走了 `Y ← Y - 1`，即 X >= Y（不相同即 X > Y）而且 Z > X，所以 Z 最大。"},{"id":"u5-q4","pts":4,"src":"教科書 p.48 表 2.6","q":"mark 的值是 50。以下哪一個布爾算式的結果是 True？","options":["`mark \u003c 50`","`mark > 50`","`mark \u003c> 50`","`mark \u003c= 50`"],"answer":"D","why":"50 \u003c= 50（小於或等於）成立。"},{"id":"u5-q5","pts":4,"src":"自擬（題型參考教科書 p.52 活動 2.3）","tags":[{"t":"hot","why":"選擇結構／流程圖的空運行：2012 甲30（答對率 75%）、2012 甲31（91%）、2014 甲32（81%）、2024 甲28（83%）"}],"verify":true,"q":"以下算法的輸出是什麼？","code":"A ← 7\nB ← 3\n如果 A > B 則\n    A ← A - B\n否則\n    B ← B - A\n如果 A > B 則\n    輸出 A\n否則\n    輸出 B","options":["4","3","1","7"],"answer":"A","why":"第一個條件：7 > 3，A = 4；第二個條件：4 > 3，輸出 A = 4。"}]},{"id":"more","kind":"endless","title":"無限練習","gens":["relop","ifelse","grade","nested"],"intro":"按教科書題型（p.51–52 活動 2.3、p.54–56 活動 2.4、p.58 例題 2.5）隨機生成空運行題目，答案由模擬器計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]},{"id":"u6","title":"布爾邏輯","book":"教科書 D1 第 2 章 p.60–73（另有 p.101、p.104、p.106 課題練習）","key":"D1-u6-hmac-c4a8e1f739","sections":[{"id":"s1","title":"AND、OR、NOT 與真值表","pages":"教科書 p.60–63","learn":[{"pts":["多於一個條件時，除了嵌套條件語句，還可用**布爾運算符**把條件結合成**複合布爾算式**。（p.60）","布爾運算符又稱**邏輯運算符**：AND（及）、OR（或）、NOT（不成立）。（p.60 表 2.10）","**AND**：兩個算式**同時**成立，結果才是 True；只要一個不成立便是 False。（p.62）","**OR**：只要**一個**成立，結果便是 True；兩個都不成立才是 False。（p.62）","**NOT**：把結果反轉。（p.63）","**真值表**列出所有條件結果的組合及運算後的結果。（p.62）"]},{"table":{"head":["X","Y","X AND Y","X OR Y","NOT X"],"rows":[["True","True","True","True","False"],["True","False","False","True","False"],["False","True","False","True","True"],["False","False","False","False","True"]]},"cap":"表 2.14–2.16 真值表（p.63）"},{"note":"擴闊視野（p.62）：日常說「咖啡或茶？」通常只可以選一樣（排斥性的 OR）；程式中的 OR 是**兼容性**的——兩個都成立時，X OR Y 也是 True。"},{"sim":{"code":"A ← 1\nB ← 5\nr1 ← (A = 1) AND (B > 2)\nr2 ← (A = 1) OR (B > 2)\nr3 ← NOT (A = 1)\n輸出 r1, r2, r3","open":[]},"cap":"表 2.11–2.13 的例子：逐步執行，「說明」會列出每個條件的結果。"}],"tries":[{"id":"u6-s1-t1","pts":5,"src":"教科書 p.61 實驗站 2.1（SHERLOCKED）","code":"a ← True\ns ← False\n輸出 a AND s, a OR s, NOT a","q":"先估：只按下了「a」鍵（a 為 True，s 為 False）。輸出是什麼？","options":["False True False","True True False","False False True","True False False"],"why":"AND 要兩個都成立 → False；OR 一個成立便可 → True；NOT a → False。"}],"practice":[{"id":"u6-s1-p1","type":"fill","pts":4,"src":"教科書 p.63 表 2.15","label":"真值表","q":"完成 OR 運算符的真值表。","code":"r1 ← True OR True\nr2 ← True OR False\nr3 ← False OR True\nr4 ← False OR False","blanks":[{"label":"True OR True","ask":{"var":"r1"}},{"label":"True OR False","ask":{"var":"r2"}},{"label":"False OR True","ask":{"var":"r3"}},{"label":"False OR False","ask":{"var":"r4"}}],"hint":"只要一個是 True，OR 的結果便是 True。"},{"id":"u6-s1-p2","type":"mc","pts":2,"src":"教科書 p.62 擴闊視野","q":"程式中，X 和 Y 都是 True。`X OR Y` 的結果是什麼？","options":["True","False","出錯，因為 OR 只可以有一個成立","視乎程式語言"],"answer":0,"hint":"程式中的 OR 是兼容性的。"}]},{"id":"s2","title":"複合布爾算式與優先次序","pages":"教科書 p.64–67","learn":[{"pts":["先處理**括號**內的算式，跟數學一樣。（p.64 備註）","方法：用真值表**逐層分拆**，先算最內層，再把結果帶到外層。（p.64）","沒有括號時，優先次序是 **NOT > AND > OR**（類似「先乘除，後加減」）。（p.67）","例：`NOT X OR Y AND Z` 要解讀成 `(NOT X) OR (Y AND Z)`。（p.67）","捷徑：AND 中有一個 False → 整個 False；OR 中有一個 True → 整個 True。（p.65 想像）"]},{"fix":"教科書 p.64 例題 2.6 選項 C 的分析表，第三欄表頭印作「(A > B) OR (B > 1)」，應為「(A > B) OR (B \u003c 1)」（欄中數值 False 是按 B \u003c 1 計算的）。"},{"sim":{"code":"A ← 1\nB ← 2\n如果 ((A > B) OR (B > 1)) AND (A \u003c= 1) 則\n    輸出 \"真\"\n否則\n    輸出 \"假\"","open":[]},"cap":"例題 2.6 第 1 題選項 B（A = 1、B = 2）。逐步執行時，「說明」會由內至外列出每一層的結果。"}],"tries":[{"id":"u6-s2-t1","pts":5,"src":"教科書 p.67 擴闊視野（優先次序）","code":"X ← True\nY ← False\nZ ← True\n輸出 NOT X OR Y AND Z","q":"先估：沒有括號，輸出是什麼？","options":["True","False"],"why":"先 NOT，再 AND，最後 OR：(NOT X) OR (Y AND Z) = False OR False = False。"}],"practice":[{"id":"u6-s2-p1","type":"fill","pts":3,"src":"教科書 p.65 例題 2.6 想像","q":"A = 1、B = 2。以下兩個算式的結果是 True 還是 False？","code":"A ← 1\nB ← 2\nr1 ← (A > B) AND ((B \u003c 1) OR (A > 1))\nr2 ← ((NOT(B > A)) AND (B \u003c 1)) OR (A \u003c= 1)","blanks":[{"label":"r1","ask":{"var":"r1"}},{"label":"r2","ask":{"var":"r2"}}],"hint":"r1：AND 左邊 A > B 已是 False。r2：OR 右邊 A \u003c= 1 已是 True。"},{"id":"u6-s2-p2","type":"mc","pts":3,"src":"教科書 p.67 測試站 2.5 第 1 題（參考 DSE 2020 1A Q5）","q":"A = 1 和 B = 1，下列哪些布爾算式的結果是「真」？\n(1) `(A > B) OR (B > A)`\n(2) `(A > -1) AND (A = B)`\n(3) `(A >= B) AND (B >= A)`","options":["只有 (1) 和 (2)","只有 (2) 和 (3)","只有 (1) 和 (3)","(1)、(2) 和 (3)"],"answer":1,"hint":"A 和 B 相等：A > B 和 B > A 都不成立。"}]},{"id":"s3","title":"數線與數值範圍","pages":"教科書 p.69–70","learn":[{"pts":["用**數線**找出不等式的數值範圍：實心點包括該數，空心點不包括。（p.69）","`80 \u003c= mark AND mark \u003c= 90`：兩段範圍**重疊**的部分（80 至 90）。（p.69）","`mark \u003c 0 OR 100 \u003c mark`：0 以左**加上** 100 以右。（p.69）","`NOT(0 \u003c= mark)` 即 `mark \u003c 0`。（p.69）","溫氏圖表示兩個集合的關係；數線表示一個數值的範圍。（p.69 提示）"]},{"fix":"教科書 p.69 NOT(0 \u003c= mark) 的數線，陰影在 0 左方，但箭咀印成指向右方，應指向左方。"},{"sim":{"code":"輸入 mark\n如果 mark \u003c 0 OR mark > 100 則\n    輸出 \"無效\"\n否則\n    輸出 \"有效\"","inputs":"100","open":["flow"]},"cap":"試輸入 -1、0、100、101，看看邊界值屬於哪一邊。"}],"tries":[{"id":"u6-s3-t1","pts":5,"src":"教科書 p.69 例題 2.7","code":"age ← 65\n輸出 age \u003c= 15 OR age > 65","q":"先估：age 是 65。`age \u003c= 15 OR age > 65` 的結果是什麼？","options":["True","False"],"why":"65 > 65 不成立（65 是空心點，不包括在內），65 \u003c= 15 亦不成立，所以是 False。"}],"practice":[{"id":"u6-s3-p1","type":"fill","pts":4,"src":"教科書 p.70 測試站 2.6（參考 DSE 2012 PP 1A Q29）","label":"填表","q":"X 代表 `age \u003c= 15`，Y 代表 `age > 65`。在 0、15、25、65、80 之中，哪些 age 會令以下算式為 True？（用逗號分隔；全部不成立寫「沒有」）","blanks":[{"label":"X AND Y","value":"沒有","accept":["無","冇"]},{"label":"NOT (X OR Y)","value":"25, 65"},{"label":"(NOT X) OR (NOT Y)","value":"0, 15, 25, 65, 80"}],"hint":"先畫數線：X 是 15 或以下（實心），Y 是 65 以上（空心）。"},{"id":"u6-s3-p2","type":"mc","pts":3,"src":"教科書 p.69 例題 2.7","q":"X 和 Y 分別代表 `age \u003c= 15` 和 `age > 65`。以下哪個／些 age 會令 `X OR Y` 為「真」？\n(1) 0　(2) 15　(3) 25　(4) 65　(5) 80","options":["只有 (1)","只有 (3)","只有 (1)、(2) 和 (5)","只有 (4) 和 (5)"],"answer":2,"hint":"15 包括在內；65 不包括在內。"}]},{"id":"s4","title":"複合條件與嵌套條件語句","pages":"教科書 p.68、p.71–73","learn":[{"pts":["`如果 X = 1 AND Y = 2 則` 與兩層嵌套的 `如果 X = 1 則 → 如果 Y = 2 則` 結果相同：兩個條件都成立才執行。（p.71 例題 2.8）","嵌套的兩個條件**調換次序**，結果也相同。（p.71）","`如果 X = 1 OR Y = 2 則` 與「如果…否則如果」兩個分支做同一件事，結果相同。（p.72 測試站 2.7）","`(Y \u003c= 8) AND (X > 5)` 與 `NOT (Y > 8) AND NOT (X \u003c= 5)` 相同：「是」「否」路線可以互換。（p.73 挑戰題）"]},{"sim":{"code":"A ← 11\nB ← -7\n如果 (A - B > A + B) AND (A * B \u003c 0) 則\n    A ← B + A * 2\n否則\n    B ← A + B * 2\n輸出 A, B","open":["flow"]},"cap":"測試站 2.5 第 4 題（p.68）：複合條件用在「如果…則…否則」之中。"}],"tries":[{"id":"u6-s4-t1","pts":5,"src":"教科書 p.72 測試站 2.7 第 1 題（改編）","code":"X ← 1\nY ← 3\nZ ← 0\n如果 X = 1 OR Y = 2 則\n    Z ← X + Y\n輸出 Z","q":"先估：X = 1、Y = 3。輸出是什麼？","options":["0","4","3","1"],"open":["flow"],"why":"X = 1 成立，OR 只需一個成立，所以執行 Z ← 1 + 3 = 4。"}],"practice":[{"id":"u6-s4-p1","type":"mc","pts":3,"src":"教科書 p.71 例題 2.8（參考 DSE 2016 1A Q30）","q":"以下哪些偽代碼會得出相同的結果？\n(1) `如果 X = 1 則` 之下 `如果 Y = 2 則` 之下 `Z ← X + Y`\n(2) `如果 Y = 2 則` 之下 `如果 X = 1 則` 之下 `Z ← Y + X`\n(3) `如果 X = 1 AND Y = 2 則` 之下 `Z ← X + Y`","options":["只有 (1) 和 (2)","只有 (2) 和 (3)","只有 (1) 和 (3)","(1)、(2) 和 (3)"],"answer":3,"hint":"三個算法都只在 X = 1 和 Y = 2 同時成立時才計算 Z。"},{"id":"u6-s4-p2","type":"mc","pts":3,"src":"教科書 p.72 測試站 2.7 第 2 題","q":"以下哪些算法會得出相同的結果？\n(1) `如果 X > 5 OR Y \u003c= 8 則` 之下 `Z ← Y + X`\n(2) `如果 X > 5 則` 之下 `如果 Y \u003c= 8 則` 之下 `Z ← X + Y`\n(3) `如果 Y \u003c= 8 則` 之下 `如果 X > 5 則` 之下 `Z ← X + Y`","options":["只有 (1) 和 (2)","只有 (2) 和 (3)","只有 (1) 和 (3)","(1)、(2) 和 (3)"],"answer":1,"hint":"嵌套的兩個條件等於 AND，不是 OR。"}]},{"id":"write","kind":"write","title":"寫算法","pages":"教科書 p.104、p.106","intro":"在編輯器寫偽代碼，可以先按「▶ 下一步」自己測試，再按「提交評核」。系統會用多組測試數據（包括邊界值）檢查。布爾值的輸入寫 True 或 False。","tasks":[{"id":"u6-w1","tier":"必做","title":"有效分數及合格","pts":20,"src":"教科書 p.104 長題目 3","prompt":"輸入 `score`。如果 score 在 0 至 100 之內（包括 0 和 100），50 或以上輸出 `\"Pass\"`，否則輸出 `\"Fail\"`；如果超出範圍，輸出 `\"Not a valid score\"`。\n提示：用 AND 把兩個條件結合。","starter":"輸入 score\n","ref":"輸入 score\n如果 (score >= 0 AND score \u003c= 100) 則\n    如果 score >= 50 則\n        輸出 \"Pass\"\n    否則\n        輸出 \"Fail\"\n否則\n    輸出 \"Not a valid score\"","tests":[{"inputs":"75","show":true},{"inputs":"120","show":true},{"inputs":"50"},{"inputs":"49"},{"inputs":"0"},{"inputs":"100"},{"inputs":"-1"},{"inputs":"101"}],"hint":"外層：`如果 score >= 0 AND score \u003c= 100 則`；內層再判斷是否 >= 50。"},{"id":"u6-w2","tier":"進階","title":"誰最高？","pts":10,"src":"教科書 p.106 長題目 6(c)（教科書沒有附答案）","prompt":"以下算法找出 A、B、C 中最高的數值，但三個數值相同時沒有輸出。**加入語句**，令三個數值相同時輸出 `\"它們的數值相同\"`。其餘部分保持不變。","starter":"輸入 A\n輸入 B\n輸入 C\n如果 (A > B AND A > C) 則\n    輸出 A\n如果 (B > A AND B > C) 則\n    輸出 B\n如果 (C > A AND C > B) 則\n    輸出 C","ref":"輸入 A\n輸入 B\n輸入 C\n如果 (A > B AND A > C) 則\n    輸出 A\n如果 (B > A AND B > C) 則\n    輸出 B\n如果 (C > A AND C > B) 則\n    輸出 C\n如果 (A = B AND B = C) 則\n    輸出 \"它們的數值相同\"","tests":[{"inputs":"160, 160, 160","show":true},{"inputs":"172, 160, 165"},{"inputs":"150, 171, 160"},{"inputs":"150, 160, 175"},{"inputs":"166, 170, 170"}],"hint":"相同要寫成 `A = B AND B = C`；不可以寫 `A = B = C`。另外留意：166、170、170 時原算法沒有輸出，這組數據的期望輸出也是空的（p.106 第 6(d) 題）。"},{"id":"u6-w3","tier":"挑戰","title":"入場費","pts":5,"src":"自擬（綜合複合條件）","prompt":"輸入年齡 `age` 及是否會員 `member`（True／False），輸出入場費 `price`：\n• 3 歲以下免費（0 元）；\n• 11 歲或以下，或 65 歲或以上：50 元；\n• 其他：100 元；\n• 會員而且需要付費的，再減 10 元。","starter":"輸入 age, member\n","ref":"輸入 age, member\n如果 age \u003c 3 則\n    price ← 0\n否則如果 age \u003c= 11 OR age >= 65 則\n    price ← 50\n否則\n    price ← 100\n如果 member AND price > 0 則\n    price ← price - 10\n輸出 price","tests":[{"inputs":"30, False","show":true},{"inputs":"70, True","show":true},{"inputs":"2, True"},{"inputs":"3, False"},{"inputs":"11, True"},{"inputs":"12, False"},{"inputs":"64, True"},{"inputs":"65, False"}],"hint":"先用「如果…否則如果…否則」決定 price；最後再用 `如果 member AND price > 0 則` 減 10。"}]},{"id":"quiz","kind":"quiz","title":"小測","pages":"教科書 p.65–68、p.101","items":[{"id":"u6-q1","pts":4,"src":"教科書 p.67 測試站 2.5 第 2 題（參考 DSE 2020 1A Q5）","tags":[{"t":"hot","why":"辨別結果為真的布爾算式：2018 甲33（答對率 79%）、2020 甲5（91%）、2021 甲31（85%）、2025 甲26（90%）"}],"q":"A = -2 和 B = 6，下列哪項布爾算式的結果是「假」？\nA. `(A > B) OR ((A \u003c -1) AND (B > 1))`\nB. `((A \u003c B) OR (A > -1)) AND (B > 1)`\nC. `(A \u003c B) OR ((A > -1) AND (B \u003c 1))`\nD. `((A > B) OR (A \u003c -1)) AND (B \u003c 1)`","options":["A","B","C","D"],"answer":"D","why":"D：(False OR True) AND (6 \u003c 1) = True AND False = False。"},{"id":"u6-q2","pts":4,"src":"教科書 p.65 例題 2.6 第 2 題（參考 DSE 2019 1A Q29）","tags":[{"t":"trap","why":"產生相同結果的布爾算式：2019 甲29 答對率 41%"}],"q":"以下哪些布爾算式的結果是完全一樣的？\n(1) `(A > 10) AND (B > 10)`\n(2) `NOT((A \u003c= 10) OR (B \u003c= 10))`\n(3) `(NOT(A \u003c= 10)) AND (NOT(B \u003c= 10))`","options":["只有 (1) 和 (2)","只有 (2) 和 (3)","只有 (1) 和 (3)","(1)、(2) 和 (3)"],"answer":"D","why":"代入四組數據（20/20、20/5、5/20、5/5），三個算式的結果都一樣；用溫氏圖看都是兩圓重疊的部分。"},{"id":"u6-q3","pts":4,"src":"教科書 p.68 測試站 2.5 第 5 題（參考 DSE 2017 1A Q32）","tags":[{"t":"trap","why":"使 NOT (… OR …) 條件成立的數值：2017 甲32 答對率 41%"}],"q":"細閱以下算法。哪組 age 和 employed 的值會使算法輸出 \"Other employed people\"？","code":"如果 ((NOT(age >= 20)) OR (NOT(age \u003c 35))) AND employed = True 則\n    輸出 \"Other employed people\"","options":["age = 10，employed = False","age = 20，employed = True","age = 35，employed = True","age = 50，employed = False"],"answer":"C","why":"要 employed = True；而且 age 不在 20 至 34 之間。35 不小於 35，NOT(age \u003c 35) 成立。"},{"id":"u6-q4","pts":4,"src":"教科書 p.68 測試站 2.5 第 4 題（參考 DSE 2014 1A Q32）","tags":[{"t":"hot","why":"選擇結構的空運行：2012 甲30（75%）、2012 甲31（91%）、2014 甲32（81%）、2024 甲28（83%）"}],"verify":true,"q":"以下算法的輸出是什麼？","code":"A ← 11\nB ← -7\n如果 (A - B > A + B) AND (A * B \u003c 0) 則\n    A ← B + A * 2\n否則\n    B ← A + B * 2\n輸出 A, B","options":["11 -7","15 -7","11 -3","15 -3"],"answer":"B","why":"18 > 4 成立；-77 \u003c 0 成立 → A ← -7 + 22 = 15，B 不變。"},{"id":"u6-q5","pts":4,"src":"教科書 p.101 課題練習 選擇題 7","tags":[{"t":"hot","why":"選擇結構的空運行：2012 甲30（75%）、2012 甲31（91%）、2014 甲32（81%）、2024 甲28（83%）"}],"verify":true,"q":"以下算法的輸出是什麼？","code":"A ← 5\n如果 (A > 3 AND A \u003c 7) OR (A > 5) 則\n    輸出 \"1\"\n否則\n    輸出 \"2\"\n如果 A >= 5 AND A \u003c> 0 則\n    輸出 \"1\"\n否則\n    輸出 \"2\"","options":["11","12","21","22"],"answer":"A","why":"兩個條件都成立，兩次都輸出 1。"}]},{"id":"more","kind":"endless","title":"無限練習","gens":["boolexpr","range","relop"],"intro":"按教科書題型（p.64–70 例題 2.6–2.7、測試站 2.5–2.6）隨機生成布爾算式，答案由模擬器計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]},{"id":"u7","title":"迭代（循環）","book":"教科書 D1 第 2 章 p.73–94、p.98–99（另有 p.102 課題練習）","key":"D1-u7-hmac-5f0d2b97ac","sections":[{"id":"s1","title":"迭代與 for 循環","pages":"教科書 p.73–79","learn":[{"pts":["**迭代（iteration）**又稱**循環（loop）**：重複執行某段語句，直至不再符合循環條件。（p.73）","被重複執行的語句稱為**循環體（loop body）**。（p.73）","**for 循環**：變量由起始值遞增（`由 1 至 10`）或遞減（`由 10 下至 1`）到最終值，決定循環體重複的次數。（p.75）","這個變量是**循環計數器**，常用 i、j、k；循環體內也可以用它來運算，例如 `輸出 3 * i`。（p.75–76）","重複次數 = 最終值 − 起始值 + 1（遞減時是 起始值 − 最終值 + 1）。（p.77 活動 2.6）","流程圖：`i ← 起始值` → 判斷 `i \u003c= 最終值` → 循環體 → `i ← i + 1` → 返回判斷。所以循環**完結後 i = 最終值 + 1**。（p.75 表 2.17）","典型用法：繪畫正多邊形——重複「向前畫、轉外角」。（p.79）"]},{"sim":{"code":"設 i 由 1 至 5\n    輸出 3 * i","open":["flow","trace"]},"cap":"輸出首五個 3 的倍數（p.76）。看流程圖怎樣在「i \u003c= 5」與循環體之間繞圈。"}],"tries":[{"id":"u7-s1-t1","pts":4,"src":"教科書 p.77 活動 2.6 第 2(c) 題","code":"k ← 10\n設 i 由 1 至 4\n    k ← k + 1\n輸出 k","q":"先估：輸出是什麼？","options":["13","14","15","4"],"open":["trace"],"why":"循環體執行 4 次，k 由 10 加到 14。"}],"practice":[{"id":"u7-s1-p1","type":"fill","pts":3,"src":"教科書 p.77 活動 2.6 第 1 題","q":"空運行以下算法，寫出輸出（用空格分隔）及循環體重複的次數。","code":"設 n 由 10 下至 0\n    輸出 n","blanks":[{"label":"輸出","ask":"out"},{"label":"重複次數","ask":{"count":1}}],"hint":"10 下至 0 包括 0：10 − 0 + 1。"},{"id":"u7-s1-p2","type":"complete","pts":2,"src":"教科書 p.77 活動 2.6 第 2(a) 題","label":"補完偽代碼","q":"用 for 循環寫出與「輸出 1 * 5、輸出 2 * 5 …… 輸出 7 * 5」對等的偽代碼。","template":"設 i 由 1 至 ［1］\n    輸出 i * ［2］","ref":["7","5"],"tests":[{"inputs":""}],"hint":"共 7 行；每行都乘 5。"}]},{"id":"s2","title":"while 循環與無限循環","pages":"教科書 p.80–81、p.99","learn":[{"pts":["**while 循環**：先判斷條件；成立便執行循環體，然後再判斷。只要條件一直成立，循環體就不斷執行。（p.80）","寫法：`當 {條件}`，循環體縮排。（p.80 表 2.18）","**無限循環**：邏輯錯誤令循環條件永遠成立，例如 `當 i \u003c 10` 但循環體寫成 `i ← i - 1`。（p.81、p.99）","無限循環時，循環之後的語句（例如 `輸出 X`）永遠不會執行。（p.81）","擴闊視野：有程式刻意用 `當 True` 造成無限循環（相當於 Scratch「重複無限次」）。（p.81）"]},{"sim":{"code":"i ← 1\n當 i \u003c 10\n    輸出 i\n    i ← i - 1","open":[]},"cap":"常見錯誤（p.99）：按「⏩ 執行到底」，模擬器執行 5,000 步後會判斷為無限循環並說明原因。把最後一行改成 `i ← i + 1` 便正確。"}],"tries":[{"id":"u7-s2-t1","pts":4,"src":"教科書 p.80","code":"num ← 17\n當 num \u003c 100\n    輸出 num\n    num ← num + 17","q":"先估：輸出是什麼？","options":["17 34 51 68 85","17 34 51 68 85 102","34 51 68 85","17"],"open":["trace"],"why":"num 變成 102 時，條件 102 \u003c 100 不成立，離開循環，所以 102 不會輸出。"}],"practice":[{"id":"u7-s2-p1","type":"mc","pts":3,"src":"教科書 p.82 測試站 2.8 第 1 題（參考 2012 Practice Paper 1A Q33）","q":"以下哪個輸入值，可以避免無限循環的發生？","code":"num ← 1\n輸入 X\n當 num \u003c= 5\n    num ← num * X","options":["任何整數","任何正數","0","-2"],"answer":3,"hint":"X 是 1、0 或 -1 時，num 永遠不會大於 5。試用 -2：1 → -2 → 4 → -8 → 16。"},{"id":"u7-s2-p2","type":"fill","pts":2,"src":"教科書 p.83 測試站 2.8 第 2 題","q":"輸入 X 為 3。最後輸出的 Z 是多少？","code":"輸入 X\nY ← 0\nZ ← 0\n設 i 由 1 至 10\n    Y ← Y + X\n    輸出 Y\n    Z ← Z + Y\n輸出 Z","inputs":"3","blanks":[{"label":"Z","ask":{"var":"Z"}}],"hint":"Z = 3 + 6 + 9 + … + 30。"}]},{"id":"s3","title":"for 與 while；執行…當","pages":"教科書 p.82–85","learn":[{"pts":["**for 循環**：已知循環體的**重複次數**（例如跑 10 個圈）。（p.82）","**while 循環**：重複次數**未知**，只要條件成立就繼續（例如體能許可便一直跑）。（p.82）","for 循環可以改寫成 while 循環：先 `i ← 1`，條件 `i \u003c= 10`，循環體最後加 `i ← i + 1`。（p.83 測試站 2.8 第 3 題）","**「執行…當」循環**：循環體**先執行一次**，再判斷條件；條件成立便再執行。（p.84）","例子：夾公仔機投下 5 個硬幣才啟動機械夾。（p.85）"]},{"sim":{"code":"coins ← 0\n執行\n    投下硬幣\n    coins ← coins + 1\n當 coins \u003c 5\n啟動機械夾","open":["flow"]},"cap":"夾公仔機（p.85）。「投下硬幣」「啟動機械夾」是文字描述的步驟，模擬器當作一個步驟，不改變變量。"}],"tries":[{"id":"u7-s3-t1","pts":4,"src":"教科書 p.85 測試站 2.9","code":"A ← 10\n執行\n    A ← A - 3\n    輸出 A\n當 A > 10","ask":{"count":3},"q":"先估：「輸出 A」會被執行多少次？","options":["0","1","2","3"],"open":["flow"],"why":"後測循環最少執行一次：輸出 7；之後 7 > 10 不成立，離開循環。"}],"practice":[{"id":"u7-s3-p1","type":"complete","pts":3,"src":"教科書 p.83 測試站 2.8 第 3 題","label":"補完偽代碼","q":"把「設 i 由 1 至 10」的算法改寫為 while 循環。會用多組數據測試。","template":"輸入 X\nY ← 0\nZ ← 0\ni ← 1\n當 ［1］\n    Y ← Y + X\n    輸出 Y\n    Z ← Z + Y\n    ［2］\n輸出 Z","ref":["i \u003c= 10","i ← i + 1"],"tests":[{"inputs":"3"},{"inputs":"5"},{"inputs":"-2"}],"hint":"條件要令循環體執行 10 次；循環體最後要更新 i，否則會無限循環。"},{"id":"u7-s3-p2","type":"mc","pts":2,"src":"教科書 p.82","q":"運動員以「跑 10 個圈」為目標。最適合用哪一種循環？","options":["for 循環","while 循環","無限循環","不需要循環"],"answer":0,"hint":"重複次數已知。"}]},{"id":"s4","title":"重複…直至；前測與後測","pages":"教科書 p.86–89、p.98–99","learn":[{"pts":["**「重複…直至」循環**：循環體先執行一次，條件**不成立**便再執行，**直至條件成立**為止。（p.86）","「執行…當」與「重複…直至」只差在條件：`當 NOT (條件)` 等於 `直至 條件`。（p.86 提示）","**前測循環**：先檢查條件再執行循環體，循環體**可能一次也不執行**（while、for）。（p.88）","**後測循環**：先執行循環體再檢查條件，循環體**最少執行一次**（執行…當、重複…直至）。（p.88）","例子：猜數字遊戲——玩家先猜一次，猜不中便再輸入，直至猜中。（p.87）"]},{"table":{"head":["","前測循環","後測循環"],"rows":[["何時檢查條件","執行循環體之前","執行循環體之後"],["循環體最少執行","0 次","1 次"],["例子","while、for","執行…當、重複…直至"]]},"cap":"表 2.21 循環控制結構的分類（p.88）"},{"sim":{"code":"輸入 secret\n重複\n    輸入 guess\n直至 guess = secret\n輸出 \"Bingo!\"","inputs":"7, 3, 9, 7","open":["flow"]},"cap":"猜數字遊戲（p.87）。第一個輸入是秘密數字，之後是玩家每次猜的數字。"}],"tries":[{"id":"u7-s4-t1","pts":4,"src":"教科書 p.87","code":"輸入 secret\n重複\n    輸入 guess\n直至 guess = secret\n輸出 \"Bingo!\"","inputs":"7, 3, 9, 7","fixedInputs":true,"ask":{"count":2},"q":"先估：秘密數字是 7，玩家依次猜 3、9、7。「輸入 guess」執行了多少次？","options":["1","2","3","4"],"open":["flow"],"why":"猜 3、猜 9 都不中，要再猜；第 3 次猜 7 才中，條件成立，離開循環。"}],"practice":[{"id":"u7-s4-p1","type":"complete","pts":3,"src":"教科書 p.87 活動 2.7","label":"補完偽代碼","q":"把猜數字遊戲改為使用「執行…當」循環。會用多組數據測試。","template":"輸入 secret\n執行\n    輸入 guess\n當 ［1］\n輸出 \"Bingo!\"","ref":["guess \u003c> secret"],"te ","why":"i = 1：X = 3、Y = 0；i = 2：X = 4、Y = 4；之後 Y 不變（4），每次 Z = X + Y、X = Z + 2：8、14、20、26。"},{"id":"u8-q3","pts":4,"src":"教科書 p.166 課題練習 選擇題 1","verify":true,"q":"以下算法的輸出是什麼？","code":"A ← 19\nB ← 3\n重複\n    A ← A - B\n    輸出 \"1\"\n直至 B > A","options":["1","11111","111111","1111111"],"answer":"C","why":"A：16、13、10、7、4、1，第六次後 3 > 1 成立。"},{"id":"u8-q4","pts":4,"src":"教科書 p.117 測試站 3.1 第 6(a) 題（參考 DSE 2012 1B Q3）","verify":true,"inputs":"5, 8","q":"用家輸入 X = 5 和 Y = 8。算法的輸出是什麼？","code":"輸入 X, Y\n重複\n    X ← X + 10\n    Y ← X - Y\n    Z ← X + Y\n    輸出 Y\n直至 Z > 50\n輸出 X","options":["7 18 17 35","7 18 17","7 18 35","15 25 35"],"answer":"A","why":"Z：22、43、52；Z = 52 時離開，最後輸出 X = 35。"},{"id":"u8-q5","pts":4,"src":"教科書 p.115 測試站 3.1 第 1(c) 題（參考 DSE 2018 1A Q30）","q":"以下算法要計算 5² + 4² + 3² + 2² + 1²。空格應填上什麼條件？","code":"X ← 0\nk ← 5\n當 ＿＿＿＿\n    X ← X + k * k\n    k ← k - 1\n輸出 X","options":["k > 0","k \u003c 5","k >= 5","k = 0"],"answer":"A","why":"k 由 5 減至 1 都要執行；k = 0 時停止（k >= 1、k >= 0 亦可）。"}]},{"id":"more","kind":"endless","title":"無限練習","gens":["forloop","whileloop","postloop","ifelse"],"intro":"隨機生成循環空運行題目；建議在紙上畫追蹤表再作答。答案由模擬器計算。不計分，但次數會寫進報告。"},{"id":"report","kind":"report","title":"交功課"}]},{"id":"u9","title":"陣列","book":"教科書 D1 第 3 章 p.122–161（另有 p.166–168 課題練習）","key":"D1-u9-hmac-a2c6f8e05d","sections":[{"id":"s1","title":"陣列與存取項目","pages":"教科書 p.122–126","learn":[{"pts":["**數據結構**有助整理數據。**一維陣列**把一組相同類型、相關的數據有次序地儲存在一連串記憶體位置。（p.122）","用**陣列名稱加索引**存取項目：`age[3]` 是第 3 個項目。本書偽代碼索引由 **1** 開始（Python 由 0 開始）。（p.123–124）","類比：陣列就像有很多抽屜的儲物櫃，每個抽屜有編號。（p.122）","一次放入一組數據：`age[] ← [8, 21, 16, 55]`。（p.124 提示）","用 for 循環逐一存取：`設 i 由 1 至 10` → `num[i] ← i * 10`。（p.125）","`輸出 count` 會輸出整個陣列，例如 `[10, 0, 0, 10, 10]`。（p.126）"]},{"sim":{"code":"count[] ← [1, 0, 0, 1, 1]\n設 i 由 1 至 5\n    count[i] ← count[i] * 10\n輸出 count","open":[]},"cap":"活動 3.3 第 2(i) 題（p.126）：右邊的變量區會把陣列畫成一格格，正在改變的格會亮起。"}],"tries":[{"id":"u9-s1-t1","pts":4,"src":"教科書 p.126 活動 3.3 第 2(iii) 題","code":"num[] ← [15, 20, 10, 20, 25]\nweight[] ← [1, 2, 2, 1, 3]\n設 k 由 1 至 5\n    score[k] ← num[k] * weight[k]\n輸出 score","q":"先估：輸出是什麼？","options":["[15, 40, 20, 20, 75]","[16, 22, 12, 21, 28]","[15, 20, 10, 20, 25]","170"],"why":"每個 score[k] 是同一位置的 num 乘 weight。"}],"practice":[{"id":"u9-s1-p1","type":"fill","pts":3,"src":"教科書 p.126 活動 3.3 第 2(ii)、(iv) 題","q":"寫出兩個算法的輸出。","code":"num[] ← [5, 10, 15, 20, 25, 30, 35]\ntotal ← 0\n設 N 由 1 至 7\n    total ← total + num[N]\navg ← total / 7\nAR[] ← [10, 20, 40, 80, 160]\nr ← 0\n設 k 由 3 至 5\n    r ← r + AR[k]","blanks":[{"label":"total","ask":{"var":"total"}},{"label":"avg","ask":{"var":"avg"}},{"label":"r","ask":{"var":"r"}}],"hint":"r 只加 AR[3] 至 AR[5]。"},{"id":"u9-s1-p2","type":"fill","pts":2,"src":"教科書 p.125 活動 3.3 第 1 題","q":"寫出 num 的最終值。","code":"num[1] ← 1\n設 k 由 2 至 7\n    num[k] ← num[k-1] + 2\n輸出 num","blanks":[{"label":"輸出","ask":"out"}],"hint":"每一項是前一項加 2。"}]},{"id":"s2","title":"以循環載入陣列","pages":"教科書 p.127–133","learn":[{"pts":["while 循環也可以載入陣列：`num[N] ← N * 3`，N 由 1 加到 100。（p.127 例題 3.3）","追蹤陣列時，表內寫「num[1] ← 3」等。（p.127）","一項可以用前面的項計算，例如斐波那契數列 `F[N] ← F[N-2] + F[N-1]`。（p.129）","用變量 first、last 作為索引範圍，不用改寫算法便可計算不同時段。（p.133）"]},{"sim":{"code":"F[1] ← 1\nF[2] ← 1\n設 N 由 3 至 10\n    F[N] ← F[N-2] + F[N-1]\n輸出 F[7]","open":["trace"]},"cap":"測試站 3.3 第 1 題（p.129）：斐波那契數列。"}],"tries":[{"id":"u9-s2-t1","pts":4,"src":"教科書 p.129 測試站 3.3 第 3 題","code":"diff ← 3\nindex ← 1\n當 diff \u003c 19\n    num[index] ← diff + 1\n    輸出 num[index]\n    diff ← diff + 4\n    index ← index + 1","q":"先估：輸出是什麼？","options":["3 7 11 15","3 7 11 15 19","4 8 12 16","4 8 12 16 20"],"open":["trace"],"why":"diff 是 3、7、11、15 時執行，各輸出 diff + 1；diff = 19 時離開。"}],"practice":[{"id":"u9-s2-p1","type":"mc","pts":3,"src":"教科書 p.129 測試站 3.3 第 2 題（參考 DSE 2019 1A Q33）","verify":true,"q":"以下算法的輸出是什麼？","code":"A[1] ← 10\n設 i 由 1 至 7\n    A[i+1] ← A[i] + i\n輸出 A[5] - A[4]","options":["1","2","3","4"],"hint":"A：10、11、13、16、20。"},{"id":"u9-s2-p2","type":"fill","pts":2,"src":"教科書 p.128 例題 3.3 第 2 題","q":"以下算法的輸出是什麼？它的目的是什麼？（只需寫輸出）","code":"AR[] ← [20, 5, 3, 10, 15]\nR ← 0\n設 i 由 1 至 5\n    如果 AR[i] > 10 則\n        R ← R + 1\n輸出 R","blanks":[{"label":"輸出","ask":"out"}],"fix":"教科書 p.128 原題第 4 行寫「R = R + 1」，用「=」而不是「←」賦值（D1-21 同類）。","hint":"統計有多少個項目大於 10；10 不大於 10。"}]},{"id":"s3","title":"線性檢索與旗標","pages":"教科書 p.134–138","learn":[{"pts":["**線性檢索**：由索引 1 開始逐一比較，直至找到目標值或到達最後一項。（p.134）","**旗標（flag）**：監視狀態的變量。先假設找不到（`found ← False`），找到才改為 True；應用布爾數據類型。（p.135）","要知道**位置**：`index` 初始值設為 -1（代表找不到），找到時 `index ← i`。（p.136）","找到第一個便停止：while 條件加上 `found = False`。（p.136）","已排序的陣列：遇到比目標大的值便可停止（`member[i] \u003c= target`）。（p.137）"]},{"sim":{"code":"height[] ← [172.2, 152.3, 165, 170, 168.5, 175, 188, 160, 150, 155]\n輸入 target\nfound ← False\n設 i 由 1 至 10\n    如果 target = height[i] 則\n        found ← True\n輸出 found","inputs":"175","open":["trace"]},"cap":"p.134 的算法。試輸入 175、140、150。"}],"tries":[{"id":"u9-s3-t1","pts":4,"src":"教科書 p.135 活動 3.4 第 2 題（大雄的算法）","code":"height[] ← [172.2, 152.3, 165, 170, 168.5, 175, 188, 160, 150, 155]\n輸入 target\n設 i 由 1 至 10\n    如果 target = height[i] 則\n        found ← True\n    否則\n        found ← False\n輸出 found","inputs":"175","fixedInputs":true,"q":"先估：175 在陣列中（第 6 項）。大雄的算法輸出什麼？","options":["True","False","6","沒有輸出"],"open":["trace"],"why":"找到後循環仍繼續，之後每次不相等都把 found 改回 False；只有目標在最後一項才會輸出 True。這是邏輯錯誤。"}],"practice":[{"id":"u9-s3-p1","type":"complete","pts":3,"src":"教科書 p.136 例題 3.4 第 1 題","label":"補完偽代碼","q":"找到目標值時輸出它的索引，找不到輸出 -1；有多個相同值時只找第一個。會用多組數據測試。","template":"height[] ← [172.2, 152.3, 165, 170, 168.5, 175, 188, 160, 150, 155]\n輸入 target\nfound ← False\nindex ← ［1］\ni ← 1\n當 i \u003c= 10 AND ［2］\n    如果 target = height[i] 則\n        found ← True\n        index ← i\n    i ← i + 1\n輸出 index","ref":["-1","found = False"],"tests":[{"inputs":"175"},{"inputs":"140"},{"inputs":"172.2"},{"inputs":"155"}],"hint":"index 先假設找不到；找到後 found 變成 True，循環便要停止。"},{"id":"u9-s3-p2","type":"fill","pts":2,"src":"教科書 p.137 例題 3.4 第 2(c) 題","q":"已排序的陣列 member。輸入 4000，輸出是什麼？while 循環體執行了多少次？","code":"member[] ← [1456, 1530, 2630, 3160, 4604, 5420, 7082, 8652, 9320, 9432]\n輸入 target\nfound ← False\nindex ← -1\ni ← 1\n當 i \u003c= 10 AND found = False AND member[i] \u003c= target\n    如果 target = member[i] 則\n        found ← True\n        index ← i\n    i ← i + 1\n輸出 index","inputs":"4000","blanks":[{"label":"輸出","ask":"out"},{"label":"循環體執行次數","ask":{"count":6}}],"hint":"4604 已大於 4000，便停止。"}]},{"id":"s4","title":"點算、最大最小、檢查次序","pages":"教科書 p.139–144","learn":[{"pts":["**點算**：`count ← 0`，符合條件便 `count ← count + 1`。（p.139）","**找最大值**：先把 `tallest ← height[1]`，再由第 2 項逐一比較，較大便取代——就像「打擂台」。（p.140–141）","找最小值：把條件改成 `\u003c`。（p.141）","**檢查次序**：先假設已排序（`sorted_list ← True`），比較 `height[i] > height[i+1]`，i 由 1 至 9（最後一項沒有下一項）。（p.142）","改用 while 循環，找到一個不按次序便立即停止，效率較高。（p.144）"]},{"fix":"教科書 p.144 測試站 3.5 題目說「五位小朋友」，但陣列 weight 有 7 個值；答案「設 i 由 1 至 6」亦按 7 項計算（D1-23）。"},{"sim":{"code":"height[] ← [172.2, 152.3, 165, 170, 168.5, 175, 188, 160, 150, 155]\ntallest ← height[1]\n設 i 由 2 至 10\n    如果 height[i] > tallest 則\n        tallest ← height[i]\n輸出 tallest","open":["trace"]},"cap":"p.140：找出最高的身高。"}],"tries":[{"id":"u9-s4-t1","pts":4,"src":"教科書 p.139","code":"height[] ← [172.2, 152.3, 165, 170, 168.5, 175, 188, 160, 150, 155]\n輸入 bound\ncount ← 0\n設 k 由 1 至 10\n    如果 height[k] > bound 則\n        count ← count + 1\n輸出 count","inputs":"170","fixedInputs":true,"q":"先估：輸入 170，輸出是什麼？","options":["2","3","4","5"],"open":["trace"],"why":"大於 170 的有 172.2、175、188；170 本身不大於 170。"}],"practice":[{"id":"u9-s4-p1","type":"complete","pts":3,"src":"教科書 p.139 測試站 3.4","label":"補完偽代碼","q":"統計有多少個同學的分數低於平均分 76.8。","template":"mark[] ← [56, 90, 85, 87, 66]\navg_mark ← 76.8\ncount ← 0\n設 i 由 ［1］ 至 ［2］\n    如果 ［3］ 則\n        count ← count + 1\n輸出 count","ref":["1","5","mark[i] \u003c avg_mark"],"tests":[{"inputs":""}],"hint":"五個分數；條件是「低於」平均分。"},{"id":"u9-s4-p2","type":"complete","pts":2,"src":"教科書 p.144 測試站 3.5","label":"補完偽代碼","q":"檢查陣列 weight 是否由**大至小**順序排列。","template":"weight[] ← [30.5, 29.6, 29.1, 28.8, 28.1, 27.3, 26.9]\nsorted_list ← True\n設 i 由 ［1］ 至 ［2］\n    如果 ［3］ 則\n        sorted_list ← False\n輸出 sorted_list","ref":["1","6","weight[i] \u003c weight[i+1]"],"tests":[{"inputs":""}],"hint":"7 個值只需比較 6 次；由大至小時，後一項比前一項大便是出錯。"}]},{"id":"s5","title":"刪除、加入及調動項目","pages":"教科書 p.146–155","learn":[{"pts":["**刪除**索引 P 的項目：`設 i 由 P 至 L-1`，`height[i] ← height[i+1]`，最後 `L ← L - 1`（L 是陣列大小）。（p.146）","範圍是「至 L-1」：若到 L，會讀取不存在的 height[L+1]。（p.147）","**加入**到索引 P：先 `L ← L + 1`，再 `設 i 由 L 下至 P+1`，`height[i] ← height[i-1]`，最後 `height[P] ← H`。（p.148）","加入要**由後向前**移；若由前向後，所有項目會變成同一個值。（p.149）","類比「排排坐」：有人離開，後面的人逐一向前移；有人插隊，後面的人由最後一位開始向後移。（p.150）","**調動**：把第 K 項移到第 1 項——先 `temp ← songs[K]`，再把前面的項目向後移，最後 `songs[1] ← temp`。（p.153–154）"]},{"fix":"教科書 p.149 試想想答案說「陣列項目 3 至 11 全是同一數值」，陣列只有 10 項，應為 3 至 10（D1-26）。"},{"sim":{"code":"songs[] ← [\"M1\", \"M2\", \"M3\", \"M4\", \"M5\", \"M6\", \"M7\", \"M8\", \"M9\", \"M10\"]\n輸入 K\ntemp ← songs[K]\n設 i 由 K 下至 2\n    songs[i] ← songs[i-1]\nsongs[1] ← temp\n輸出 songs","inputs":"6","open":[]},"cap":"p.154 小玉的算法：把第 K 首歌移到第一位。"}],"tries":[{"id":"u9-s5-t1","pts":4,"src":"教科書 p.150 活動 3.6","code":"num[] ← [1, 2, 3, 4, 5, 6]\n設 i 由 3 至 6\n    num[i] ← num[i-1]\n輸出 num","q":"先估：由前向後移，輸出是什麼？","options":["[1, 2, 2, 2, 2, 2]","[1, 2, 2, 3, 4, 5]","[1, 2, 3, 3, 4, 5]","[2, 3, 4, 5, 6, 6]"],"why":"num[3] 先變成 2，之後每項都複製已被改寫的前一項，全部變成 2。"}],"practice":[{"id":"u9-s5-p1","type":"fill","pts":3,"src":"教科書 p.146–147","q":"刪除第 5 位同學（P = 5）後，輸出是什麼？","code":"height[] ← [172.2, 152.3, 165, 170, 168.5, 175, 188, 160, 150, 155]\nL ← 10\n輸入 P\n設 i 由 P 至 L-1\n    height[i] ← height[i+1]\nL ← L - 1\n輸出 height[5], L","inputs":"5","blanks":[{"label":"輸出","ask":"out"}],"hint":"原本第 6 項移到第 5 項；L 減 1。"},{"id":"u9-s5-p2","type":"fill","pts":2,"src":"教科書 p.155","q":"播放清單是 M1 至 M10。小萍輸入「7」運行一次，再輸入「3」運行一次。最後輸出是什麼？","code":"songs[] ← [\"M1\", \"M2\", \"M3\", \"M4\", \"M5\", \"M6\", \"M7\", \"M8\", \"M9\", \"M10\"]\n設 r 由 1 至 2\n    輸入 K\n    temp ← songs[K]\n    設 i 由 K 下至 2\n        songs[i] ← songs[i-1]\n    songs[1] ← temp\n輸出 songs","inputs":"7, 3","blanks":[{"label":"輸出","ask":"out"}],"hint":"第一次後：M7、M1、M2……；第二次把第 3 項（M2）移到最前。"}]},{"id":"write","kind":"write","title":"寫算法","pages":"教科書 p.136–152","intro":"每題先用 for 循環把 5 個輸入放入陣列 `num`（`設 i 由 1 至 5` → `輸入 num[i]`，已寫好）。輸入數據用逗號分隔。","tasks":[{"id":"u9-w1","tier":"必做","title":"合格人數及最高分","pts":20,"src":"教科書 p.139–141","prompt":"5 個分數已放入陣列 `num`。輸出**合格（50 分或以上）人數**和**最高分**（用一個「輸出」，例如 `輸出 count, highest`）。","starter":"設 i 由 1 至 5\n    輸入 num[i]\n","ref":"設 i 由 1 至 5\n    輸入 num[i]\ncount ← 0\nhighest ← num[1]\n設 i 由 1 至 5\n    如果 num[i] >= 50 則\n        count ← count + 1\n    如果 num[i] > highest 則\n        highest ← num[i]\n輸出 count, highest","tests":[{"inputs":"56, 90, 45, 87, 30","show":true},{"inputs":"10, 20, 30, 40, 49"},{"inputs":"50, 50, 50, 50, 50"},{"inputs":"99, 12, 75, 100, 0"}],"hint":"點算：count 由 0 開始；最大值：highest 先設為 num[1]。"},{"id":"u9-w2","tier":"進階","title":"找出位置（線性檢索）","pts":10,"src":"教科書 p.136 例題 3.4","prompt":"5 個數字放入 num 後，再輸入 `target`。輸出 target **第一次**出現的索引；找不到輸出 -1。用旗標 found 和 while 循環，找到便停止。","starter":"設 i 由 1 至 5\n    輸入 num[i]\n輸入 target\n","ref":"設 i 由 1 至 5\n    輸入 num[i]\n輸入 target\nfound ← False\nindex ← -1\ni ← 1\n當 i \u003c= 5 AND found = False\n    如果 num[i] = target 則\n        found ← True\n        index ← i\n    i ← i + 1\n輸出 index","rules":[{"re":"^當 ","msg":"這題要用 while 循環（「當 條件」）。"}],"tests":[{"inputs":"12, 7, 30, 7, 5, 7","show":true},{"inputs":"12, 7, 30, 7, 5, 99"},{"inputs":"4, 8, 15, 16, 23, 4"},{"inputs":"4, 8, 15, 16, 23, 23"}],"hint":"index 先設為 -1；while 條件加上 `found = False`。"},{"id":"u9-w3","tier":"挑戰","title":"插班生（加入已排序陣列）","pts":5,"src":"教科書 p.151–152 例題 3.5","prompt":"5 個由小至大排好的數字放入 num 後，再輸入新數值 `H`。把 H 加入陣列，使陣列仍然由小至大排列，然後 `輸出 num`。","starter":"設 i 由 1 至 5\n    輸入 num[i]\n輸入 H\n","ref":"設 i 由 1 至 5\n    輸入 num[i]\n輸入 H\nfound ← False\nindex ← 6\ni ← 1\n當 i \u003c= 5 AND found = False\n    如果 H \u003c num[i] 則\n
